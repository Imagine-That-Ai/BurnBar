disabled_rules:
  - trailing_whitespace
  # SOTA: nest type_level relaxed for existing code; new code should prefer 1
  - nesting

# Recalibrated 2026-06-11: this config had NEVER executed in CI (diligence
# quality-gate-theater finding). First real runs measured the original
# aspirational opt-in set at ~37k violations of established house style, so
# style-war rules were dropped; every safety/correctness rule stays, and the
# residue is ratcheted via .swiftlint-baseline.json (new violations fail).
opt_in_rules:
  # Original rules
  - empty_count
  - explicit_init
  - closure_spacing
  - contains_over_first_not_nil
  - empty_string
  - first_where
  - sorted_first_last
  - redundant_type_annotation
  - override_in_extension
  - unneeded_parentheses_in_closure_argument
  - protocol_property_accessors_order
  - is_disjoint
  - dynamic_inline
  # SOTA additions — safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - fatal_error_message
  - force_cast
  - private_outlet
  - private_action
  - strong_iboutlet
  - unavailable_function
  - overridden_super_call
  - weak_delegate
  # SOTA additions — clarity & correctness
  - unused_import
  - unused_declaration
  - unused_capture_list
  - unused_optional_binding
  - unused_closure_parameter
  - unused_enumerated
  - unused_setter_value
  - redundant_optional_initialization
  - redundant_void_return
  - redundant_objc_attribute
  - redundant_set_access_control
  - redundant_string_enum_value
  - reduce_boolean
  - reduce_into
  - toggle_bool
  - identical_operands
  - yoda_condition
  # SOTA additions — style & consistency
  - array_init
  - comma_inheritance
  - duplicate_imports
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - lower_acl_than_parent
  - modifier_order
  - no_extension_access_modifier
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - orphaned_doc_comment
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_over_fileprivate
  - prohibited_interface_builder
  - prohibited_super_call
  - redundant_discardable_let
  - required_enum_case
  - return_value_from_void_function
  - shorthand_optional_binding
  - static_operator
  - test_case_accessibility
  - unneeded_break_in_switch
  - unowned_variable_capture
  - unused_control_flow_label
  - vertical_parameter_alignment
  - xct_specific_matcher
  # SOTA — legacy & deprecation
  - legacy_random
  - legacy_cggeometry_functions
  - legacy_nsgeometry_functions
  - legacy_hashing
  - legacy_constant

excluded:
  # The pre-rename excludes (BurnBarCore/.build, BurnsMacOS…) covered paths
  # that no longer exist, so the first real CI run linted 1.6M lines of
  # SwiftPM dependency checkouts. Current tree:
  - .derived-data
  - .spm-cache
  - .spm-cache-new
  - docs
  - mockups
  - plans
  - droid-wiki
  - .build
  - .swiftpm
  - OpenBurnBarCore/.build
  - OpenBurnBarCore/.swiftpm
  - OpenBurnBarDaemon/.build
  - OpenBurnBarDaemon/.swiftpm
  - OpenBurnBar.xcodeproj
  - Vendor
  - DerivedSources
  - build
  - Pods
  - node_modules
  - AgentLensTests/Quarantine
  - AgentLensTests/Support
  - AgentLensTests/Fixtures
  - AgentLensTests/Archive
  - AgentLensTests/LegacyReference
  - functions
  - extensions

# Per-rule overrides to prevent false positives on existing code
force_unwrapping:
  severity: warning
force_cast:
  severity: warning
missing_docs:
  severity: warning
  excludes_extensions: true
  excludes_inherited_types: true
  excludes_trivial_init: true
explicit_acl:
  severity: warning
explicit_top_level_acl:
  severity: warning
explicit_type_interface:
  severity: warning
  exclude_local_declarations: true
indentation_width:
  severity: warning
  indentation_width: 4
file_name_no_space:
  severity: warning
xct_specific_matcher:
  severity: warning
modifier_order:
  severity: warning
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - on
    - to
    - by
    - at
    - if
    - or
    - as
    - in
    - no
    - is
    - of
    - my
    - ns
    - Ok
    - ok

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
    - URL
    - HTTP
    - JSON
    - UUID

cyclomatic_complexity:
  warning: 15
  error: 25

warning_threshold: 10

reporter: xcode

custom_rules:
  empty_catch_block:
    name: "Empty Catch Block"
    regex: 'catch\s*\{\s*(\/\*.*?\*\/\s*)?\}'
    message: "Empty catch blocks swallow errors; log with AppLogger.error or propagate."
    severity: error
