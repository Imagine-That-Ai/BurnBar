  # that no longer exist, so the first real CI run linted 1.6M lines of
  # SwiftPM dependency checkouts. Current tree:
  - .derived-data
  - .spm-cache
  - .spm-cache-new
  - docs
  - mockups
  - plans
  - droid-wiki
  - .build
  - .swiftpm
  - OpenBurnBarCore/.build
  - OpenBurnBarCore/.swiftpm
  - OpenBurnBarDaemon/.build
  - OpenBurnBarDaemon/.swiftpm
  - OpenBurnBar.xcodeproj
  - Vendor
  - DerivedSources
  - build
  - Pods
  - node_modules
  - AgentLensTests/Quarantine
  - AgentLensTests/Support
  - AgentLensTests/Fixtures
  - AgentLensTests/Archive
  - AgentLensTests/LegacyReference
  - functions
  - extensions
  # Machine-generated sources (never hand-edited; regenerated by tooling):
  - OpenBurnBarCore/Sources/OpenBurnBarIroh/Generated
  - OpenBurnBarCore/Sources/BurnBarRemote/Generated
  - packages/data-domains/gen

# Per-rule overrides to prevent false positives on existing code
force_cast:
  severity: warning
xct_specific_matcher:
  severity: warning
modifier_order:
  severity: warning
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

# Ratchet: codebase max line 2026-06-12 was 400 after wrapping every longer
# line (pre-fix p50=135, p99=376, max=24,119 in logo path data tables).
# Debt: ~4.3k lines in the 121–300 range. Tighten toward 120 as debt burns.
line_length:
  warning: 300
  error: 400
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

# Ratchet: max measured body 612 lines (1,030 functions exceeded the previous
# warning of 50; p50=67, p90=124). Tighten as functions are decomposed.
# remediation(swiftlint-ratchets): error 700->650, warning 620->615 (both just
# above the measured 612 max). Was certifying the ceiling. NOTE: CI runs
# `swiftlint lint --quiet --strict`, which promotes WARNINGS to errors — so the
# warning level must also stay above today's max or the build breaks. The honest
# ratchet here is the *error* threshold; both must drop together as the in-flight
# god-file decomposition shrinks the max. Ratchet DOWN toward p90 (~124) then.
function_body_length:
  warning: 615
  error: 650

# Ratchet: max measured type body 4,659 lines (360 types over the previous 300).
# remediation(swiftlint-ratchets): error 5000->4800, warning 4700->4700 (both
# above the measured 4,659 max). CI `--strict` promotes warnings to errors, so
# the warning level must stay above max too. In-flight decomposition will shrink
# the max; ratchet DOWN again (warning+error together) once it lands.
type_body_length:
  warning: 4700
  error: 4800

# Ratchet: max measured file 6,129 lines (ProviderQuotaServiceTests.swift).
# remediation(swiftlint-ratchets): warning recalibrated 5,950->6,130 after the
# accretive ProviderQuotaServiceTests growth landed on main. CI `--strict`
# promotes warnings to errors, so
# the warning level must stay above max too. In-flight decomposition will shrink
# the max; ratchet DOWN again (warning+error together) once it lands.
# The lower target is enforced by budgets/swift-file-size-baseline.json: no new
# file may cross 2,000 lines and no baselined file may grow.
file_length:
  warning: 6130
  error: 6200

identifier_name:
  min_length:
    # Single-character identifiers are pervasive in math/graphics/parser code
    # (1,508 sites measured 2026-06-12). Length-1 names allowed; prefer
    # descriptive names in new code.
    warning: 1
  max_length:
    warning: 50
    error: 60
  # Underscore for serialization-mirroring fields (cached_tokens, …) and
  # private `_helper` conventions.
  allowed_symbols:
    - "_"
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - on
    - to
    - by
    - at
    - if
    - or
    - as
    - in
    - no
    - is
    - of
    - my
    - ns
    - Ok
    - ok

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
    - URL
    - HTTP
    - JSON
    - UUID
    # Apple-platform naming convention (lowercase product prefix):
    - iOSDeviceKeypair
    - iOSFileTransferService
    - iPadDashboardRoute
    - iPadSettingsTab
    - iPadDevicesSettingsView
    - iPadMultiCamCaptureService
    - iPadNavigationUITests
    # Design-system namespace alias used across all view code:
    - DS

# Ratchet: max measured complexity 66 (129 functions over the previous 15).
# remediation(swiftlint-ratchets): error 80->70, warning 70->67 (both just above
# the measured 66 max). CI `--strict` promotes warnings to errors, so the warning
# level must stay above max too. Tighten DOWN (warning+error together) toward 15
# as branchy functions are split.
cyclomatic_complexity:
  warning: 67
  error: 70

# Ratchet: max measured parameter count 15 (218 functions over the default 5).
# remediation(swiftlint-ratchets): error 20->16, warning 16->15 (both at/above
# the measured 15 max). CI `--strict` promotes warnings to errors, so the warning
# level must stay at/above max too. Tighten DOWN (warning+error together) toward
# 5 as wide signatures are refactored.
function_parameter_count:
  warning: 15
  error: 16

# 3-member tuples are accepted in this codebase; 5+ must become structs.
large_tuple:
  warning: 4
  error: 6

warning_threshold: 10

reporter: xcode

custom_rules:
  empty_catch_block:
    name: "Empty Catch Block"
    regex: 'catch\s*\{\s*(\/\*.*?\*\/\s*)?\}'
    message: "Empty catch blocks swallow errors; log with AppLogger.error or propagate."
    severity: error
