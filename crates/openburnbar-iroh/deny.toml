# cargo-deny policy for OpenBurnBar Rust surfaces (iroh FFI crate).
# CI runs via scripts/supply-chain/run-ecosystem-deny-checks.sh

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # Transitive Iroh 1.0.0-rc.0 dependency; no direct upgrade path in this
  # crate. Keep cargo-deny active for new advisories.
  "RUSTSEC-2023-0089", # atomic-polyfill is unmaintained
  # Transitive UniFFI/Iroh dependency; upstream notes bincode 1.3.3 is complete
  # and no safe upgrade is available.
  "RUSTSEC-2025-0141", # bincode is unmaintained
  # Transitive Iroh dependency with no safe upgrade available.
  "RUSTSEC-2024-0436", # paste is unmaintained
  # Transitive Iroh dependency with no safe upgrade available.
  "RUSTSEC-2024-0370", # proc-macro-error is unmaintained
  # Transitive Iroh 1.0.0-rc.0 dependency chain:
  # iroh -> netwatch -> netdev -> plist -> quick-xml 0.39.x.
  # plist 1.9.0 is currently the latest plist release and still pins
  # quick-xml ^0.39.2, so the patched quick-xml >=0.41.0 line is not reachable
  # without a coordinated iroh-stack upgrade.
  "RUSTSEC-2026-0194", # quick-xml duplicate-attribute check can be quadratic
  # Same transitive plist/quick-xml blocker as RUSTSEC-2026-0194.
  "RUSTSEC-2026-0195", # quick-xml NsReader namespace allocation DoS
]

[licenses]
allow = [
  "MIT",
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
