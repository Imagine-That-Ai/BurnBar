[package]
name = "burnbar-remote-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bridge for the BurnBar Remote engine foundation"

[lib]
name = "burnbar_remote"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
burnbar-remote-core.workspace = true
burnbar-remote-media.workspace = true
burnbar-remote-observability.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[lints]
workspace = true
