[package]
name = "openburnbar-attestd"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
description = "Root-owned Linux attestation broker for OpenBurnBar"
publish = false

[dependencies]
base64ct = "=1.8.3"
ed25519-dalek = { version = "=2.2.0", features = ["pem", "pkcs8"] }
libc = "=0.2.180"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
panic = "abort"
