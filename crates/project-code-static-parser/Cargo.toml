[package]
name = "project-code-static-parser"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "project-code-static-parser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.9"
tree-sitter-python = "0.25.0"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
