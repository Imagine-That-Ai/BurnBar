[package]
name = "openburnbar-domain-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bindings for OpenBurnBar domain logic"

[lib]
name = "openburnbar_domain_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
openburnbar-domain-core = { path = "../domain-core", version = "0.1.0" }
uniffi = { version = "=0.28.3", features = ["cli"] }

[build-dependencies]
uniffi = { version = "=0.28.3", features = ["build"] }

[lints]
workspace = true
