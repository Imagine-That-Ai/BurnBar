[package]
name = "openburnbar-domain-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bindings for OpenBurnBar domain logic"

[lib]
name = "openburnbar_domain_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
openburnbar-domain-core = { path = "../domain-core", version = "0.1.0" }
thiserror = "2"
uniffi = { version = "=0.32.1", features = ["cli"] }
zeroize = "1"

[build-dependencies]
cc = "=1.4.7"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
uniffi = { version = "=0.32.1", features = ["build"] }

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true
