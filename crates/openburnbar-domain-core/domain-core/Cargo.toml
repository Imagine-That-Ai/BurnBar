[package]
name = "openburnbar-domain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure cross-platform business logic for OpenBurnBar"

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13"
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
zeroize = "1"

[lints]
workspace = true
