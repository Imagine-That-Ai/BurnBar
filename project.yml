      - path: AgentLensTests/Support
        excludes:
          - "**/*.swift.plist"
      - path: AgentLensTests/Fixtures
        buildPhase: resources
      # Static App Store review compliance scans read these from the test
      # bundle instead of the workspace. App-hosted XCTest processes can lack
      # the terminal's Documents-folder TCC grants on macOS, which turns direct
      # repo reads into runner timeouts.
      - path: AgentLens/Resources/OpenBurnBarMAS.entitlements
