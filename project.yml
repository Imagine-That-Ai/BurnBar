        OTHER_CODE_SIGN_FLAGS: --identifier com.openburnbar.app --options runtime,library
        SKIP_INSTALL: true
    dependencies:
      # Core-decomposition P-18 (S17): OpenBurnBarDaemonMain imports OpenBurnBarEngine
      # (the UI-free umbrella), matching OpenBurnBarDaemon/Package.swift; no path to
      # the OpenBurnBarCore UI monolith. See docs/CORE_DECOMPOSITION_PROGRAM.md.
      #
      # Package products are `link: false` here on purpose: a standalone
      # executable (`type: tool`) with DIRECT package-product deps makes
      # XCBuild copy every transitive binary framework (openburnbar_domain_ffiFFI
      # from OpenBurnBarDomainCore.xcframework, via Kernel) into the shared
      # $BUILT_PRODUCTS_DIR/Frameworks, and two tools doing so collide with
      # "Multiple commands produce" (first seen in release run 32525126144 —
      # the only lane where the DomainCore xcframework exists). Linkage
      # propagates from the linked OpenBurnBarDaemon static library, whose
      # package products are linked; `link: false` keeps module import + build
      # ordering without the embed copy.
      - target: OpenBurnBarDaemon
      - package: OpenBurnBarCore
        product: OpenBurnBarEngine
        link: false
      - package: OpenBurnBarCore
        product: OpenBurnBarInsights
        link: false
      - package: OpenBurnBarCore
        product: OpenBurnBarComputerUseCore
        link: false
      - package: OpenBurnBarCore
        product: OpenBurnBarIrohRelay
        link: false
      - package: OpenBurnBarCore
        product: OpenBurnBarMedia
        link: false
      - package: OpenBurnBarCore
        product: OpenBurnBarLinuxSecurity
        link: false

