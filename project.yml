          - $(PROJECT_DIR)/AgentLens/Views/Settings/AccountSettingsView.swift
          - $(PROJECT_DIR)/AgentLens/Views/Settings/CloudStoreSettingsView.swift
          - $(PROJECT_DIR)/AgentLens/Views/Settings/CloudStoreSettingsView+Support.swift
          - $(PROJECT_DIR)/AgentLens/Views/Settings/MacCloudStoreLegalLinks.swift
          - $(PROJECT_DIR)/AgentLens/Views/Settings/SettingsView.swift
          - $(PROJECT_DIR)/OpenBurnBarMobile/Views/Store/CloudStoreView.swift
          - $(PROJECT_DIR)/AgentLens/App/AgentLensApp.swift
          - $(PROJECT_DIR)/AgentLens/Services/OpenBurnBarAppCheckProviderFactory.swift
          - $(PROJECT_DIR)/project.yml
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MenuBarPopoverView.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AccountSettingsView.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CloudStoreSettingsView.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CloudStoreSettingsView+Support.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MacCloudStoreLegalLinks.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SettingsView.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CloudStoreView.txt
