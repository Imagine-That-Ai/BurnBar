  OpenBurnBarMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenBurnBarMobile
        excludes:
          - "**/.DS_Store"
          - "Tests/**"
          - "Resources/Mermaid/**"
          - "Resources/GoogleService-Info.plist"
      - path: packages/data-domains/gen/DataDomains.swift
      - path: packages/design-tokens/dist/swift/PensieveTokens.swift
      # Mermaid is shipped as a folder reference so `index.html` and
      # `mermaid.min.js` keep their relative paths inside the bundle.
      - path: OpenBurnBarMobile/Resources/Mermaid
        type: folder
        buildPhase: resources
      # iOS shares the SAME macOS WebGL kernel backdrop bundle (no copy): the
      # self-contained web bundle (index.html + kernel-backdrop.js) lives under
      # AgentLens/Resources/KernelBackdrop and is loaded at runtime via
      # Bundle.main subdirectory "KernelBackdrop" by MobileWebGLKernelBackdropView.
      # Ship it as a folder reference so the "KernelBackdrop" directory survives
      # into the iOS bundle instead of being flattened into Resources/ — mirroring
      # exactly how the macOS AgentLens target includes it.
      - path: AgentLens/Resources/KernelBackdrop
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Guard source-built gRPC (iOS 27 Firestore crash)
        script: |
          # The prebuilt grpc-binary SIGSEGVs in BoringSSL (OPENSSL_cleanse via
          # ssl_cert_dup -> create_tsi_ssl_handshaker) the first time Firestore
          # opens its TLS channel on iOS 27 — verified on-device 2026-07-03 with
          # Firebase 12.15/grpc-binary 1.69.1. Firestore MUST be built from
          # source (grpc-ios + BoringSSL-SwiftPM): resolve packages with
          # FIREBASE_SOURCE_FIRESTORE=1 in the environment. This tripwire turns
          # a silent runtime crash into a build error when the graph regresses.
          # See docs/FIREBASE_IOS27_GRPC.md.
          resolved="$SRCROOT/OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f "$resolved" ] && grep -q '"grpc-binary"' "$resolved"; then
            echo "error: Package graph resolved with prebuilt grpc-binary, which crashes Firestore on iOS 27. Re-resolve with FIREBASE_SOURCE_FIRESTORE=1 (see docs/FIREBASE_IOS27_GRPC.md)."
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 84
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        # Apple sign-in + iOS Keychain access group; see
        # OpenBurnBarMobile/Resources/OpenBurnBarMobile.entitlements.
        CODE_SIGN_ENTITLEMENTS: OpenBurnBarMobile/Resources/OpenBurnBarMobile.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: OpenBurnBar
        INFOPLIST_KEY_CFBundleName: OpenBurnBar
        INFOPLIST_KEY_NSCameraUsageDescription: OpenBurnBar uses the camera only when you choose Take Photo to attach an image to a Hermes chat or start a trusted Mercury video call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OpenBurnBar uses the microphone only when you start voice commands or a trusted Mercury audio call.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: OpenBurnBar uses speech recognition only while you hold the voice command control to turn your spoken command into text.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: OpenBurnBar accesses selected photo library items only when you choose Photo Library to attach media to a Hermes chat.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: OpenBurnBar saves received media to your photo library only when you choose Save.
        INFOPLIST_KEY_NSFaceIDUsageDescription: OpenBurnBar uses Face ID only to confirm it's you before this iPhone sends remote input -- like typing or unlocking -- to your trusted Mac during a Mercury session.
        INFOPLIST_KEY_NSMotionUsageDescription: OpenBurnBar reads device motion only to adapt the mobile dashboard while you are using the app.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OpenBurnBar uses the local network to connect this iPhone or iPad to your trusted Mac for pairing, Hermes relay, and media sessions.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # Opt-in Amplitude analytics key. Empty in clean checkouts (COMMIT ZERO
        # KEYS): the recorder reads `amplitude.apiKey` from Info.plist and stays
        # dark when it is empty/placeholder. CI provides a real value via the
        # `BURNBAR_AMPLITUDE_API_KEY` build setting (or the inject script).
        BURNBAR_AMPLITUDE_API_KEY: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GSTACK_IOS_QA"
        Release:
          APS_ENVIRONMENT: production
    postBuildScripts:
      - name: Copy Firebase Config If Present
        script: |
          set -euo pipefail

          STAMP="${SCRIPT_OUTPUT_FILE_0:-}"
          finish() {
            if [[ -n "${STAMP}" ]]; then
              mkdir -p "$(dirname "${STAMP}")"
              touch "${STAMP}"
            fi
          }
          trap finish EXIT

          SOURCE_PLIST="${PROJECT_DIR}/OpenBurnBarMobile/Resources/GoogleService-Info.plist"
          BUILT_GOOGLE_PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"

          if [[ ! -f "${SOURCE_PLIST}" ]]; then
            rm -f "${BUILT_GOOGLE_PLIST}"
            echo "warning: GoogleService-Info.plist not found; Firebase auth remains disabled."
            exit 0
          fi

          mkdir -p "$(dirname "${BUILT_GOOGLE_PLIST}")"
          cp "${SOURCE_PLIST}" "${BUILT_GOOGLE_PLIST}"

          # F-RR09-003: land sentry.dsn into the app Info.plist (the PRIMARY read
          # path AppDelegate checks first), not just the GoogleService-Info.plist
          # fallback. Runs in release builds too (this block is unconditional).
          BUILT_INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          SENTRY_DSN="$(
            /usr/libexec/PlistBuddy -c "Print :sentry.dsn" "${SOURCE_PLIST}" 2>/dev/null || true
          )"
          if [[ -n "${SENTRY_DSN}" && -f "${BUILT_INFO_PLIST}" ]]; then
            /usr/libexec/PlistBuddy -c "Delete :sentry.dsn" "${BUILT_INFO_PLIST}" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :sentry.dsn string ${SENTRY_DSN}" "${BUILT_INFO_PLIST}"
          fi
        inputFiles:
          - $(PROJECT_DIR)/OpenBurnBarMobile/Resources/GoogleService-Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/CopyFirebaseConfigIfPresent.stamp
      - name: Block App Check Debug Token In Release
        script: |
          set -euo pipefail

          STAMP="${SCRIPT_OUTPUT_FILE_0:-}"
          finish() {
            if [[ -n "${STAMP}" ]]; then
              mkdir -p "$(dirname "${STAMP}")"
              touch "${STAMP}"
            fi
          }
          trap finish EXIT

          if [[ "${CONFIGURATION:-}" == "Debug" ]]; then
            exit 0
          fi

          SOURCE_PLIST="${PROJECT_DIR}/OpenBurnBarMobile/Resources/GoogleService-Info.plist"
          APP_BUNDLE="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          set --
          if [[ -f "${SOURCE_PLIST}" ]]; then
            set -- "$@" "${SOURCE_PLIST}"
          fi
          if [[ -d "${APP_BUNDLE}" ]]; then
            set -- "$@" "${APP_BUNDLE}"
          else
            BUILT_GOOGLE_PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
            BUILT_INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            [[ -f "${BUILT_GOOGLE_PLIST}" ]] && set -- "$@" "${BUILT_GOOGLE_PLIST}"
            [[ -f "${BUILT_INFO_PLIST}" ]] && set -- "$@" "${BUILT_INFO_PLIST}"
          fi

          if [[ "$#" -gt 0 ]]; then
            bash "${PROJECT_DIR}/scripts/ci/verify-apple-appcheck-release-artifact.sh" "$@"
          fi
        inputFiles:
          - $(PROJECT_DIR)/OpenBurnBarMobile/Resources/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/BlockAppCheckDebugTokenInRelease.stamp
      - name: Block iOS QA Bridge In Release
        script: |
          set -euo pipefail
          if [[ "${CONFIGURATION:-}" != "Release" ]]; then
            exit 0
          fi
          /bin/bash "${SRCROOT}/scripts/ci/verify-ios-debug-bridge-release.sh" \
            "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
        basedOnDependencyAnalysis: false
