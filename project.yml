          copy_fixture "${PROJECT_DIR}/AgentLens/Services/OpenBurnBarAppCheckProviderFactory.swift" "OpenBurnBarAppCheckProviderFactory.txt"
          copy_fixture "${PROJECT_DIR}/project.yml" "project.yml"
        inputFiles:
