name: OpenBurnBar
options:
  bundleIdPrefix: com.openburnbar
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.40"
    CURRENT_PROJECT_VERSION: 81
    CODE_SIGN_STYLE: Automatic
    # Release scripts override only this host-specific variable. Keeping the
    # Safari appex's CODE_SIGN_ENTITLEMENTS target-local prevents a command-line
    # CODE_SIGN_ENTITLEMENTS= (as the Mac App Store lane passes) from stamping the
    # host's entitlements onto the embedded extension.
    OPENBURNBAR_HOST_CODE_SIGN_ENTITLEMENTS: AgentLens/Resources/OpenBurnBar.entitlements
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_LSUIElement: true
    GENERATE_INFOPLIST_FILE: YES
    DOMAIN_CORE_BUILD_PROFILE: developer
    DOMAIN_CORE_BUILD_AUTHORITY: development
    DOMAIN_CORE_DISTRIBUTION: development
    DOMAIN_CORE_ROLLOUT_CHANNEL: ""
    DOMAIN_CORE_EVIDENCE_ENABLED: NO
    DOMAIN_CORE_CANDIDATE_COMMIT: ""
    DOMAIN_CORE_EXPECTED_VERSION: ""
    DOMAIN_CORE_EXPECTED_ABI_VERSION: ""
    DOMAIN_CORE_EXPECTED_SOURCE_SHA256: ""
    DOMAIN_CORE_QUOTA_MODE: legacy
    DOMAIN_CORE_CLOUDVAULT_MODE: legacy
    DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE: legacy
    DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE: legacy
    DOMAIN_CORE_HERMES_MODE: legacy
    DOMAIN_CORE_PRICING_MODE: legacy

# macOS Debug: the OpenBurnBar target uses keychain-access-groups (Firebase Auth). Xcode must sign with a
# development identity. Under targets.OpenBurnBar.settings.base add:
#   DEVELOPMENT_TEAM: <your 10-character Team ID>
# (Xcode → Settings → Accounts → your Apple ID → Team ID; or developer.apple.com → Membership.)

packages:
  OpenBurnBarCore:
    path: OpenBurnBarCore
  # Local-only live-device QA bridge. The app imports and starts this package
  # only when both DEBUG and GSTACK_IOS_QA are defined; Release compiles every
  # Swift bridge source out and the Objective-C touch shim becomes a no-op.
  DebugBridge:
    path: tools/DebugBridge
  # SQLCipher-enabled GRDB (SPM). Must stay aligned with OpenBurnBarDaemon/Package.swift.
  # Vendored from https://github.com/SahebRoy92/GRDB-SQLCipher at 2cf6c756 and
  # patched so SwiftPM GRDB imports the pinned SQLCipher XCFramework instead of system sqlite3,
  # and so failed async reads cannot unbalance DatabaseQueue read-only state.
  GRDB:
    path: Vendor/GRDB-SQLCipher
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.16.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.x bundles the iOS 27-compatible gRPC; 11.15/grpc-1.69 SIGBUSes in
    # BoringSSL (OPENSSL_cleanse) the first time Firestore opens its TLS
    # channel on iOS 27, which forced a Firestore-network kill switch on
    # mobile (AppDelegate.disableFirestoreNetworkOnIncompatibleOSIfNeeded).
    # Keep >= 12 so that shim never has to come back.
    from: "12.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    from: "1.18.6"
  AmplitudeCore:
    url: https://github.com/amplitude/AmplitudeCore-Swift.git
    from: "1.4.8"
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    exactVersion: 1.5.7
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.18.0"

schemes:
  OpenBurnBarUITests:
    build:
      targets:
        OpenBurnBar: all
        OpenBurnBarUITests: test
    test:
      config: Debug
      targets:
        - OpenBurnBarUITests

  OpenBurnBarMobileUnitTests:
    build:
      targets:
        OpenBurnBarMobile: all
    run:
      config: Debug
      executable: OpenBurnBarMobile
    test:
      config: Debug
      targets:
        - OpenBurnBarMobileTests
      storeKitConfiguration: OpenBurnBarMobileTests/Resources/OpenBurnBarPaidTiers.storekit

targets:
  OpenBurnBar:
    type: application
    platform: macOS
    # CFBundleURLTypes does not reliably merge via INFOPLIST_KEY_* with GENERATE_INFOPLIST_FILE.
    # XcodeGen regenerates this plist on `xcodegen generate`, so keep it aligned with
    # AgentLens/Resources/OpenBurnBar-Info.plist.
    info:
      path: AgentLens/Resources/OpenBurnBar-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.openburnbar.app
            CFBundleURLSchemes:
              - openburnbar
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.openburnbar.app.google-sign-in
            CFBundleURLSchemes:
              # IMPORTANT: Replace YOUR_CLIENT_ID_SUFFIX with your actual reversed Firebase client ID suffix.
              # Obtain from: GoogleService-Info.plist -> REVERSED_CLIENT_ID
              - com.googleusercontent.apps.YOUR_CLIENT_ID_SUFFIX
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ai.burnbar.chat-thread
            UTTypeDescription: OpenBurnBar Chat Thread
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: ai.burnbar.chat-pane
            UTTypeDescription: OpenBurnBar Chat Pane
            UTTypeConformsTo:
              - public.data
        NSBonjourServices:
          - _googlecast._tcp
          - _http._tcp
        OpenBurnBarDirectUpdateFeedURL: https://downloads.burnbar.ai/latest-macos.json
        SUFeedURL: https://downloads.burnbar.ai/appcast.xml
        SUPublicEDKey: 613YSraDEJ54LKsfpqbYhyzYnfYRg7z4QwiEJfoy0TI=
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        OpenBurnBarDomainCoreBuildProfile: "$(DOMAIN_CORE_BUILD_PROFILE)"
        OpenBurnBarDomainCoreBuildAuthority: "$(DOMAIN_CORE_BUILD_AUTHORITY)"
        OpenBurnBarDomainCoreDistribution: "$(DOMAIN_CORE_DISTRIBUTION)"
        OpenBurnBarDomainCoreRolloutChannel: "$(DOMAIN_CORE_ROLLOUT_CHANNEL)"
        OpenBurnBarDomainCoreEvidenceEnabled: "$(DOMAIN_CORE_EVIDENCE_ENABLED)"
        OpenBurnBarDomainCoreCandidateCommit: "$(DOMAIN_CORE_CANDIDATE_COMMIT)"
        OpenBurnBarDomainCoreExpectedVersion: "$(DOMAIN_CORE_EXPECTED_VERSION)"
        OpenBurnBarDomainCoreExpectedABIVersion: "$(DOMAIN_CORE_EXPECTED_ABI_VERSION)"
        OpenBurnBarDomainCoreExpectedSourceSHA256: "$(DOMAIN_CORE_EXPECTED_SOURCE_SHA256)"
        OpenBurnBarDomainCoreModeQuota: "$(DOMAIN_CORE_QUOTA_MODE)"
        OpenBurnBarDomainCoreModeCloudVault: "$(DOMAIN_CORE_CLOUDVAULT_MODE)"
        OpenBurnBarDomainCoreModeCloudVaultRewrap: "$(DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE)"
        OpenBurnBarDomainCoreModeCloudVaultSearch: "$(DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE)"
        OpenBurnBarDomainCoreModeHermes: "$(DOMAIN_CORE_HERMES_MODE)"
        OpenBurnBarDomainCoreModePricing: "$(DOMAIN_CORE_PRICING_MODE)"
        # Swift 6.2 (Xcode 26+) made swift_task_isCurrentExecutor crash on an isolation
        # mismatch where it previously returned false. Restore legacy non-crashing
        # behavior until the concurrency-isolation migration is complete. Keep aligned
        # with AgentLens/Resources/OpenBurnBar-Info.plist.
        LSEnvironment:
          SWIFT_IS_CURRENT_EXECUTOR_LEGACY_MODE_OVERRIDE: legacy
        NSLocalNetworkUsageDescription: OpenBurnBar uses the local network to connect this Mac to your trusted iPhone, iPad, Android devices, and local smart displays for pairing, Hermes relay, Mercury media sessions, and screen sharing.
        NSAppleEventsUsageDescription: OpenBurnBar may send Apple Events to apps you approve--such as Cursor, Safari, Google Chrome, and Finder--during Computer Use runs so agents can verify Automation permission and operate only the apps you authorize. Every action is recorded in a tamper-evident audit log.
        NSCameraUsageDescription: OpenBurnBar uses the camera only when you start a trusted Mercury video call or run the camera check in Media & Sharing settings.
        NSMicrophoneUsageDescription: OpenBurnBar uses the microphone only when you start a trusted Mercury audio or video call or run the microphone check in Media & Sharing settings.
    sources:
      - path: AgentLens
        excludes:
          - "**/.DS_Store"
          # Local Chat UI shim that duplicates types still declared by the main
          # chat surface. Keep it out until the owning refactor lands.
          - Views/Chat/ChatEngineUIStubs.swift
          - "**/Views/Chat/ChatEngineUIStubs.swift"
          - Resources/GoogleService-Info.plist
          # Pet asset trees are loaded by directory at runtime
          # (PetDefinition.loadBundled uses subdirectory: "Pets/<id>";
          # SceneKitPetRenderer loads subdirectory: "Models"). They must ship as
          # folder references so the per-pet structure and duplicate filenames
          # (petdef.json / spritesheet.webp) survive into the bundle instead of
          # being flattened into Resources/ (which collides). Added explicitly below.
          - "PetCompanion/Resources/Pets"
          - "PetCompanion/Resources/Pets/**"
          - "PetCompanion/Resources/Models"
          - "PetCompanion/Resources/Models/**"
          # The kernel backdrop is a self-contained web bundle loaded at runtime
          # via Bundle.main subdirectory "KernelBackdrop" (KernelBackdropView
          # loads index.html + its sibling kernel-backdrop.js). Ship it as a
          # folder reference so the directory survives into the bundle instead
          # of being flattened into Resources/.
          - "Resources/KernelBackdrop"
          - "Resources/KernelBackdrop/**"
      - path: AgentLens/Resources/KernelBackdrop
        type: folder
        buildPhase: resources
      - path: AgentLens/PetCompanion/Resources/Pets
        type: folder
        buildPhase: resources
      - path: AgentLens/PetCompanion/Resources/Models
        type: folder
        buildPhase: resources
      - path: packages/data-domains/gen/DataDomains.swift
      - path: packages/design-tokens/dist/swift/PensieveTokens.swift
    preBuildScripts:
      - name: Sync Imagine 3D Pets
        script: |
          "$SRCROOT/scripts/sync-imagine-pets.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: OpenBurnBar
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_ENTITLEMENTS: "$(OPENBURNBAR_HOST_CODE_SIGN_ENTITLEMENTS)"
        INFOPLIST_KEY_CFBundleDisplayName: OpenBurnBar
        INFOPLIST_KEY_CFBundleName: OpenBurnBar
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        INFOPLIST_KEY_NSSupportsSuddenTermination: NO
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SQLITE_HAS_CODEC=1"
        OTHER_CFLAGS: "$(inherited) -DSQLITE_HAS_CODEC"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # The daemon authenticates this app over the local RPC socket and
          # requires both CodeDirectory flags. Keep the Xcode Release product
          # compliant before any local/distribution re-signing step runs.
          # Deliberately Release-only: the Debug XCTest host builds with
          # CODE_SIGNING_ALLOWED=NO in CI, and carrying these flags there
          # only perturbs the ad-hoc-signed test host (observed as an
          # XCTest hang on CI runners) without protecting anything.
          OTHER_CODE_SIGN_FLAGS: --options runtime,library
          # The shared Rust candidate identity is not a Rust static on Apple:
          # domain-ffi's build.rs compiles it into its own object so it can sit
          # in __TEXT,__obb_core_id, which release verification reads back out
          # of the shipped binary.
          #
          # That object is only ever an archive member of
          # libopenburnbar_domain_ffi.a, and nothing references the symbol, so
          # ld never pulls the member in. The section was dropped from every
          # shipped Apple binary and the release could not pass its own
          # provenance gate: "observed Rust binary must contain exactly one
          # canonical embedded identity; found 0". Verified against the real
          # archive -- linking without this flag yields 0 markers and no
          # section, linking with it yields 1 and the section is present.
          #
          # Empty unless the protected release lane supplies it; a fresh checkout
          # has no domain-core xcframework, where -u could not resolve.
          OTHER_LDFLAGS: "$(inherited) $(OBB_DOMAIN_CORE_IDENTITY_LDFLAGS)"
    postBuildScripts:
      - name: Configure Firebase Auth Resources
        # GoogleService-Info.plist is gitignored and may be absent on fresh
        # checkouts. Copy it into the built bundle only when local/CI config
        # injection has provided it, then patch URL schemes from that plist.
        script: |
          set -euo pipefail
          SOURCE_PLIST="${PROJECT_DIR}/AgentLens/Resources/GoogleService-Info.plist"
          BUILT_GOOGLE_PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          if [[ ! -f "${SOURCE_PLIST}" ]]; then
            rm -f "${BUILT_GOOGLE_PLIST}"
            echo "warning: GoogleService-Info.plist not found; Google, Apple, and email auth remain disabled."
            exit 0
          fi

          mkdir -p "$(dirname "${BUILT_GOOGLE_PLIST}")"
          cp "${SOURCE_PLIST}" "${BUILT_GOOGLE_PLIST}"

          REVERSED_CLIENT_ID="$(
            /usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "${SOURCE_PLIST}" 2>/dev/null || true
          )"
          if [[ -n "${REVERSED_CLIENT_ID}" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${REVERSED_CLIENT_ID}" "${INFO_PLIST}"
          fi

          # F-RR09-003: land sentry.dsn (injected by inject-firebase-config.sh into
          # GoogleService-Info.plist) into the app Info.plist — the PRIMARY read
          # path resolveSentryDSN() checks first. Previously only the
          # GoogleService-Info.plist fallback carried it, so client crash
          # reporting worked only when that resource happened to be bundled.
          SENTRY_DSN="$(
            /usr/libexec/PlistBuddy -c "Print :sentry.dsn" "${SOURCE_PLIST}" 2>/dev/null || true
          )"
          if [[ -n "${SENTRY_DSN}" ]]; then
            /usr/libexec/PlistBuddy -c "Delete :sentry.dsn" "${INFO_PLIST}" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :sentry.dsn string ${SENTRY_DSN}" "${INFO_PLIST}"
          fi
        inputFiles:
          - $(PROJECT_DIR)/AgentLens/Resources/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
      - name: Block Mac App Check Debug Token In Release
        script: |
          set -euo pipefail

          STAMP="${SCRIPT_OUTPUT_FILE_0:-}"
          finish() {
            if [[ -n "${STAMP}" ]]; then
              mkdir -p "$(dirname "${STAMP}")"
              touch "${STAMP}"
            fi
          }
          trap finish EXIT

          if [[ "${CONFIGURATION:-}" == "Debug" ]]; then
            exit 0
          fi

          SOURCE_PLIST="${PROJECT_DIR}/AgentLens/Resources/GoogleService-Info.plist"
          APP_BUNDLE="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          set --
          if [[ -f "${SOURCE_PLIST}" ]]; then
            set -- "$@" "${SOURCE_PLIST}"
          fi
          if [[ -d "${APP_BUNDLE}" ]]; then
            set -- "$@" "${APP_BUNDLE}"
          else
            BUILT_GOOGLE_PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
            BUILT_INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            [[ -f "${BUILT_GOOGLE_PLIST}" ]] && set -- "$@" "${BUILT_GOOGLE_PLIST}"
            [[ -f "${BUILT_INFO_PLIST}" ]] && set -- "$@" "${BUILT_INFO_PLIST}"
          fi

          if [[ "$#" -gt 0 ]]; then
            bash "${PROJECT_DIR}/scripts/ci/verify-apple-appcheck-release-artifact.sh" "$@"
          fi
        inputFiles:
          - $(PROJECT_DIR)/AgentLens/Resources/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/BlockMacAppCheckDebugTokenInRelease.stamp
      - name: Stamp Build Provenance
        # Stamps git commit/branch/remote + the build channel into the bundle so
        # the in-app updater (UpdateChannelResolver / SourceUpdateChannel) can
        # distinguish a source/git build from a notarized release and report how
        # far behind it is. CI release builds export OPENBURNBAR_BUILD_CHANNEL=release;
        # local `make build` / Xcode default to "source".
        script: |
          set -euo pipefail
          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          CHANNEL="${OPENBURNBAR_BUILD_CHANNEL:-source}"
          cd "${PROJECT_DIR}"
          GIT_COMMIT="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          if [[ -n "$(git status --porcelain 2>/dev/null || true)" ]]; then
            GIT_COMMIT="${GIT_COMMIT}+dirty"
          fi
          GIT_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
          GIT_REMOTE="$(git config --get remote.origin.url 2>/dev/null || echo '')"
          set_key() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "${INFO_PLIST}" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "${INFO_PLIST}"
          }
          set_key OpenBurnBarBuildChannel "${CHANNEL}"
          set_key OpenBurnBarGitCommit "${GIT_COMMIT}"
          set_key OpenBurnBarGitBranch "${GIT_BRANCH}"
          set_key OpenBurnBarGitRemote "${GIT_REMOTE}"
          set_key OpenBurnBarSourceRoot "${PROJECT_DIR}"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
      - name: Bundle Remote Unlock Input Helpers
        script: |
          set -euo pipefail
          HELPERS_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${HELPERS_DIR}"
          for NAME in OpenBurnBarPrivilegedInputExecution OpenBurnBarVirtualHIDBridge OpenBurnBarPrivilegedInputKillSwitchWatchdog; do
            SOURCE="${BUILT_PRODUCTS_DIR}/${NAME}"
            if [[ ! -x "${SOURCE}" ]]; then
              echo "warning: ${NAME} helper not built; Remote Unlock setup may be unavailable."
              continue
            fi
            cp "${SOURCE}" "${HELPERS_DIR}/${NAME}"
            chmod 755 "${HELPERS_DIR}/${NAME}"
          done
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/OpenBurnBarPrivilegedInputExecution
          - $(BUILT_PRODUCTS_DIR)/OpenBurnBarVirtualHIDBridge
          - $(BUILT_PRODUCTS_DIR)/OpenBurnBarPrivilegedInputKillSwitchWatchdog
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/OpenBurnBarPrivilegedInputExecution
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/OpenBurnBarVirtualHIDBridge
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/OpenBurnBarPrivilegedInputKillSwitchWatchdog
      - name: Bundle Agent Runtime Resources
        script: |
          set -euo pipefail
          CORPUS_SOURCE="${PROJECT_DIR}/tools/project-code-memory/secret-pattern-corpus.json"
          CORPUS_DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ProjectCodeMemory"
          CORPUS_DEST="${CORPUS_DEST_DIR}/secret-pattern-corpus.json"
          WAND_SELECTOR_SOURCE="${PROJECT_DIR}/tools/openburnbar-mcp/select_wand_models.py"
          WAND_SELECTOR_DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/tools/openburnbar-mcp"
          WAND_SELECTOR_DEST="${WAND_SELECTOR_DEST_DIR}/select_wand_models.py"

          if [[ ! -f "${CORPUS_SOURCE}" ]]; then
            echo "error: missing Project Code Memory secret-scanner corpus at ${CORPUS_SOURCE}" >&2
            exit 1
          fi
          if [[ ! -f "${WAND_SELECTOR_SOURCE}" ]]; then
            echo "error: missing Wand selector script at ${WAND_SELECTOR_SOURCE}" >&2
            exit 1
          fi

          mkdir -p "${CORPUS_DEST_DIR}" "${WAND_SELECTOR_DEST_DIR}"
          cp "${CORPUS_SOURCE}" "${CORPUS_DEST}"
          cp "${WAND_SELECTOR_SOURCE}" "${WAND_SELECTOR_DEST}"
          chmod 0755 "${WAND_SELECTOR_DEST}"
        inputFiles:
          - $(PROJECT_DIR)/tools/project-code-memory/secret-pattern-corpus.json
          - $(PROJECT_DIR)/tools/openburnbar-mcp/select_wand_models.py
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProjectCodeMemory/secret-pattern-corpus.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tools/openburnbar-mcp/select_wand_models.py
    dependencies:
      # Embeds OpenBurnBarSafariExtension.appex into Contents/PlugIns so the
      # committed Safari web extension actually ships inside OpenBurnBar.app.
      - target: OpenBurnBarSafariExtension
        codeSign: true
      - target: OpenBurnBarDaemonExecutable
        link: false
        embed: false
      - target: OpenBurnBarPrivilegedInputExecution
        link: false
        embed: false
      - target: OpenBurnBarVirtualHIDBridge
        link: false
        embed: false
      - target: OpenBurnBarPrivilegedInputKillSwitchWatchdog
        link: false
        embed: false
      - package: OpenBurnBarCore
        product: OpenBurnBarCore
      - package: OpenBurnBarCore
        product: OpenBurnBarIrohRelay
      - package: OpenBurnBarCore
        product: OpenBurnBarMedia
      - package: OpenBurnBarCore
        product: OpenBurnBarComputerUseCore
      - package: OpenBurnBarCore
        product: OpenBurnBarSignalCore
      - package: OpenBurnBarCore
        product: OpenBurnBarSignalSessionTransport
      - package: OpenBurnBarCore
        product: OpenBurnBarFirestoreModels
      # Core-decomposition: explicit sibling products so the OpenBurnBarTests app test target can
      # `@testable import` them to reach INTERNAL symbols that moved out of the Core monolith
      # (Quota: WarpQuotaAdapter.candidateLogFiles, AntigravityQuotaAdapter.referenceDate*,
      # XAIQuotaAdapter.superGrokLogURL, ClaudeOAuthUsageFetcher.scopedCacheURL,
      # FactoryQuotaAdapter.inferPlanTier, AnthropicCredentialProbe.{parse,isHealthy,rateLimitHeaders},
      # ClaudeQuotaAdapter.scopedClaudeProfileMatchesDefaultLogin; Kernel: OpenBurnBarError.database;
      # LogParsers: TimestampNormalizationUtility.firestoreMaxEpochSeconds, TokenUsage bucket helpers;
      # UI: SwarmCanvasView.{sanitizedFrameRate,animationFrameScale,shouldDrawGlyphParticle}). Redundant
      # for runtime — the linked OpenBurnBarCore umbrella already `@_exported import`s all of them — but
      # required for internal @testable access, mirroring the other explicitly-linked siblings above.
      - package: OpenBurnBarCore
        product: OpenBurnBarQuota
      - package: OpenBurnBarCore
        product: OpenBurnBarKernel
      - package: OpenBurnBarCore
        product: OpenBurnBarLogParsers
      - package: OpenBurnBarCore
        product: OpenBurnBarUI
      # Recap: the monthly deck feature, carved out of Insights so that target
      # stayed under its decomposition ceiling.
      - package: OpenBurnBarCore
        product: OpenBurnBarRecap
      # AssistantModels: HermesAttachment, which MacAttachmentLandingService returns
      # to the Hermes transport. Linked explicitly rather than reached through the
      # umbrella so the file satisfies the core-decomposition umbrella-import ratchet.
      # Note OpenBurnBarData declares a *second*, distinct HermesAttachment; the
      # transport wants this one, so the import here must stay narrow and explicit.
      - package: OpenBurnBarCore
        product: OpenBurnBarAssistantModels
      - package: GRDB
        product: GRDB
      - package: SQLCipher
        product: SQLCipher
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sentry
        product: Sentry
      - package: AmplitudeSwift
        product: AmplitudeSwift
      - package: AmplitudeCore
        product: AmplitudeCoreFramework
      - package: GLTFKit2
        product: GLTFKit2
      - package: DracoSwift
        product: DracoSwift
    scheme:
      testTargets:
        - OpenBurnBarTests
        - OpenBurnBarDaemonTests

  # The Safari Web Extension that ships inside OpenBurnBar.app. The web payload is
  # the committed bundle at extensions/safari/dist; this target wraps it in the
  # appex Safari can actually load, and the host embeds it via `codeSign: true`
  # above. Intentionally links no OpenBurnBar module — see
  # OpenBurnBarSafariExtension/SafariWebExtensionHandler.swift for why.
  OpenBurnBarSafariExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: OpenBurnBarSafariExtension
        excludes:
          - Info.plist
          - Resources
          - Resources/**
    info:
      path: OpenBurnBarSafariExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarSafariExtension
        PRODUCT_MODULE_NAME: OpenBurnBarSafariExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app.safari-extension
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OpenBurnBarSafariExtension/Resources/OpenBurnBarSafariExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: --options runtime,library
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
    postBuildScripts:
      # Mirror the whole committed bundle rather than listing files: a resource
      # added to dist/ then ships automatically instead of silently going missing.
      # rsync also preserves icons/ as a subdirectory, which Xcode's resource phase
      # would flatten into Resources/.
      - name: Embed Safari WebExtension Resources
        script: |
          set -euo pipefail

          DIST_DIR="${PROJECT_DIR}/extensions/safari/dist"
          MANIFEST="${DIST_DIR}/manifest.json"
          RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

          if [[ ! -f "${MANIFEST}" ]]; then
            echo "error: Safari WebExtension bundle is missing ${MANIFEST}." >&2
            exit 1
          fi

          mkdir -p "${RESOURCES_DIR}"
          /usr/bin/rsync -a --delete "${DIST_DIR}/" "${RESOURCES_DIR}/"

          if [[ ! -f "${RESOURCES_DIR}/manifest.json" ]]; then
            echo "error: Safari appex resource copy did not produce Contents/Resources/manifest.json." >&2
            exit 1
          fi
        inputFiles:
          - $(PROJECT_DIR)/extensions/safari/dist/manifest.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: SafariServices.framework

  OpenBurnBarDaemon:
    type: library.static
    platform: macOS
    sources:
      - path: OpenBurnBarDaemon/Sources/OpenBurnBarDaemon
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarDaemon
        SKIP_INSTALL: true
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SQLITE_HAS_CODEC=1"
        OTHER_CFLAGS: "$(inherited) -DSQLITE_HAS_CODEC"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/OpenBurnBarCore/Sources/Czlib/module.modulemap"
    preBuildScripts:
      - name: Dedupe GRDB Link File Entries (Xcode 16)
        script: |
          # Xcode 16.4 can pass GRDB.o twice to libtool for this static target:
          # once via LinkFileList and once as an explicit linker argument.
          # Keep GRDB in the explicit arg path on 16.x by removing it from all
          # per-arch LinkFileLists only for 16.x toolchains.
          if [[ -n "${XCODE_VERSION_MAJOR:-}" && "${XCODE_VERSION_MAJOR}" -lt 1700 ]]; then
            for candidate in \
              "${LINK_FILE_LIST_normal_arm64:-}" \
              "${LINK_FILE_LIST_normal_x86_64:-}" \
              "${OBJECT_FILE_DIR_normal}/arm64/${PRODUCT_NAME}.LinkFileList" \
              "${OBJECT_FILE_DIR_normal}/x86_64/${PRODUCT_NAME}.LinkFileList" \
              "${OBJECT_FILE_DIR_normal}/${CURRENT_ARCH}/${PRODUCT_NAME}.LinkFileList" \
              "${OBJECT_FILE_DIR_normal}/${PRODUCT_NAME}.LinkFileList"
            do
              if [[ -n "${candidate}" && -f "${candidate}" ]]; then
                tmp_file="${candidate}.tmp"
                # Drop GRDB.o from each link file (it is added explicitly by Xcode)
                # and collapse any accidental duplicate object entries.
                awk '!/\/GRDB\.o$/ && !seen[$0]++' "${candidate}" > "${tmp_file}" || true
                mv "${tmp_file}" "${candidate}"
              fi
            done
          fi
    dependencies:
      # Core-decomposition P-18 (S17): the app-side OpenBurnBarDaemon target
      # mirrors OpenBurnBarDaemon/Package.swift — its 133 source files import the
      # UI-free OpenBurnBarEngine umbrella (+ ComputerUseCore/IrohRelay/Media/
      # LinuxSecurity), NEVER the SwiftUI/AppKit OpenBurnBarCore monolith, so this
      # binary has no path to the UI. See docs/CORE_DECOMPOSITION_PROGRAM.md.
      #
      # These package products are LINKED here (not `link: false`) so XCBuild
      # propagates their linkage to executables that link this static library
      # (OpenBurnBarDaemonExecutable). Static-library targets record package
      # products as packageProductDependencies without an embed-copy command;
      # a standalone executable (`type: tool`) that names them DIRECTLY gets a
      # copy of every transitive binary framework (openburnbar_domain_ffiFFI
      # from OpenBurnBarDomainCore.xcframework, via Kernel) into the shared
      # $BUILT_PRODUCTS_DIR/Frameworks — and two tools doing that collide with
      # "Multiple commands produce". Keep tools off direct package-product
      # deps; route them through a static-library target like this one
      # (OpenBurnBarRemoteAccessAgentCore plays the same role for the
      # privileged-input tools).
      - package: OpenBurnBarCore
        product: OpenBurnBarEngine
      - package: OpenBurnBarCore
        product: OpenBurnBarInsights
      - package: OpenBurnBarCore
        product: OpenBurnBarComputerUseCore
      - package: OpenBurnBarCore
        product: OpenBurnBarIrohRelay
      - package: OpenBurnBarCore
        product: OpenBurnBarMedia
      - package: OpenBurnBarCore
        product: OpenBurnBarLinuxSecurity
      - package: GRDB
        product: GRDB
      - package: SQLCipher
        product: SQLCipher
      - sdk: UserNotifications.framework

  OpenBurnBarDaemonExecutable:
    type: tool
    platform: macOS
    sources:
      - path: OpenBurnBarDaemon/Sources/OpenBurnBarDaemonExecutable/OpenBurnBarDaemonMain.swift
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarDaemon
        PRODUCT_MODULE_NAME: OpenBurnBarDaemonExecutable
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.daemon
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # The bare helper shares the app's designated requirement so both can
        # read the ordinary database-key Keychain ACL. Restricted entitlements
