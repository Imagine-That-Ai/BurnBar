    scheme:
      testTargets:
        - OpenBurnBarMobileTests
        - OpenBurnBarMobileUITests
      storeKitConfiguration: OpenBurnBarMobileTests/Resources/OpenBurnBarPaidTiers.storekit

  OpenBurnBarMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenBurnBarMobileTests
        excludes:
          - "**/.DS_Store"
      - path: OpenBurnBarMobile/Tests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_NAME: OpenBurnBarMobileTests
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app.tests
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # Depend ONLY on the host app. On iOS, SwiftPM products link statically, so
      # declaring `- package: OpenBurnBarCore` here linked a SECOND copy of
      # OpenBurnBarCore into the test bundle on top of the copy already inside the
      # OpenBurnBarMobile host app. Two Core copies split every Core-owned
      # singleton, actor, and type identity in the test process (`T.self ==
      # TokenUsage.self` metatype checks fail, `AssistantPendingThread.shared`
      # forks, real-Keychain -34018), which is why MediaControlStreamPresenceTests
      # never observed `.live` and each such test hung to its per-test timeout —
      # blowing the whole iOS Mobile harness job past the 3h cap (cancelled), and
      # why FirestoreNormalization/Hermes tests failed. The app already links
      # OpenBurnBarCore, OpenBurnBarAnalytics, and OpenBurnBarSignalCore; with
      # TEST_HOST/BUNDLE_LOADER (auto-wired for this app-hosted unit-test target),
      # `@testable import OpenBurnBarMobile` plus `import OpenBurnBarCore` resolve
      # against that single host copy at runtime. This matches how the other
      # transitively-imported Core products (OpenBurnBarIrohRelay, Media,
      # ComputerUseCore) are already consumed here without a direct dependency.
      - target: OpenBurnBarMobile

  OpenBurnBarMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenBurnBarMobileUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_NAME: OpenBurnBarMobileUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app.uitests
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: OpenBurnBarMobile
    dependencies:
      - target: OpenBurnBarMobile

  OpenBurnBarWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenBurnBarWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app.widget
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 84
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OpenBurnBarWidget/Resources/OpenBurnBarWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: OpenBurnBar Widget
        INFOPLIST_KEY_CFBundleName: BurnBarWidget
        SKIP_INSTALL: true
        # Opt-in analytics key (empty by default; COMMIT ZERO KEYS). The widget
        # only emits when the HOST app granted consent (read from the shared App
        # Group) AND this key is non-empty.
        BURNBAR_AMPLITUDE_API_KEY: ""
    info:
      path: OpenBurnBarWidget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        amplitude.apiKey: "$(BURNBAR_AMPLITUDE_API_KEY)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      # Core-decomposition P-19 (S18): repointed off the OpenBurnBarCore umbrella
      # onto the narrow products the widget's 17 source files actually import
      # (Kernel + Insights + UI). See docs/CORE_DECOMPOSITION_PROGRAM.md.
      - package: OpenBurnBarCore
        product: OpenBurnBarKernel
      - package: OpenBurnBarCore
        product: OpenBurnBarInsights
      - package: OpenBurnBarCore
        product: OpenBurnBarUI
      - package: OpenBurnBarCore
        product: OpenBurnBarAnalytics
      - package: AmplitudeSwift
        product: AmplitudeSwift
      - package: AmplitudeCore
        product: AmplitudeCoreFramework

  OpenBurnBarKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenBurnBarKeyboard
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: OpenBurnBarKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.openburnbar.app.keyboard
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 84
        DEVELOPMENT_TEAM: 4Y367DF25B
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OpenBurnBarKeyboard/Resources/OpenBurnBarKeyboard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: OpenBurnBar Keyboard
        INFOPLIST_KEY_CFBundleName: BurnBarKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
        # Opt-in analytics key (empty by default; COMMIT ZERO KEYS). The keyboard
        # only emits usage OUTCOMES (never keystrokes/text) and only when the HOST
        # app granted consent (read from the shared App Group) AND this is non-empty.
        BURNBAR_AMPLITUDE_API_KEY: ""
    info:
      path: OpenBurnBarKeyboard/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        amplitude.apiKey: "$(BURNBAR_AMPLITUDE_API_KEY)"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"

    dependencies:
      - sdk: UIKit.framework
      # Core-decomposition P-20 (S19): repointed off the OpenBurnBarCore umbrella
      # onto the narrow products the keyboard's 2 source files import —
      # OpenBurnBarTextExpansion (matcher/snippet/composer/usage+snapshot stores)
      # and OpenBurnBarUI (UnifiedDesignSystem.Colors, 7 sites in KeyboardView).
      # See docs/CORE_DECOMPOSITION_PROGRAM.md.
      - package: OpenBurnBarCore
        product: OpenBurnBarTextExpansion
      - package: OpenBurnBarCore
        product: OpenBurnBarUI
      - package: OpenBurnBarCore
        product: OpenBurnBarAnalytics
      - package: AmplitudeSwift
        product: AmplitudeSwift
      - package: AmplitudeCore
        product: AmplitudeCoreFramework
