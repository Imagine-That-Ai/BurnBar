org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# The dependency-analysis lane compiles every variant (debug+release+benchmark)
# in one invocation; without an explicit cap the Kotlin daemon inherits a
# default too small for the release lane and dies with "Not enough memory to
# run compilation" on CI runners (PR #311, run 27370322921).
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
