ShortDescription: One bar to watch, steer, and remember every coding-agent session.
Description: >-
  OpenBurnBar is a desktop companion for AI coding agents. It watches Claude Code,
  Codex, Cursor, and other CLI/agent sessions from a tray flyout, keeps provider quota
  and usage in view, remembers context across sessions, and can pair with your phone
  and smart displays. Cloud sync is end-to-end encrypted; auto-updates arrive over an
  Ed25519-pinned feed whose key is pinned independent of the code-signing certificate.
