title = "OpenBurnBar gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Project Code Memory high-entropy fixtures; runtime tests now construct these from short fragments"
condition = "AND"
regexTarget = "match"
regexes = [
  '''Az9qLm8Pr2Vx7Ns4Tu6Wy1Za3Qb5Cd7Ef9Gh2Jk4Mn6''',
]
paths = [
  '''OpenBurnBarDaemon/Tests/OpenBurnBarDaemonTests/BurnBarProjectCodeMemoryStoreTests\.swift''',
  '''tools/openburnbar-mcp/tests/test_project_code_memory\.py''',
]

[[allowlists]]
description = "Swift key-material parameter labels that reference variables, not committed secrets"
regexTarget = "match"
regexes = [
  '''privateKey:\s+[A-Za-z_][A-Za-z0-9_]*''',
  '''signingKey:\s+[A-Za-z_][A-Za-z0-9_]*''',
  '''key:\s+[A-Za-z_][A-Za-z0-9_]*''',
]

[[allowlists]]
description = "Swift redaction sentinel assertions that intentionally compare against the literal placeholder"
condition = "AND"
regexTarget = "match"
regexes = [
  '''creds\.rateLimitTier,\s*"REDACTED"''',
  '''routePayloadCreds\.rateLimitTier,\s*"REDACTED"''',
]
paths = [
  '''AgentLensTests/Active/ProviderQuotaServiceTests\.swift''',
]

[[allowlists]]
description = "Deterministic Hermes relay wire-vector keys used only in checked-in test fixtures"
condition = "AND"
regexTarget = "match"
regexes = [
  '''symmetricKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''plaintextContentKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedKeyOverride"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''bodyKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedVaultKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/HermesRelayWireVector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/HermesGatewayWireVector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/BurnBarHpkeV3Vector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesRelayWireVector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesGatewayWireVector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesGatewayWireVectorV3\.json''',
  '''functions/scripts/test-firestore-rules\.mjs''',
]

[[allowlists]]
description = "Deterministic media-frame/control-frame AEAD KAT keys used only in checked-in cross-language test fixtures"
condition = "AND"
regexTarget = "match"
regexes = [
  '''derivedKeyHex"\s*:\s*"[A-Fa-f0-9]{64}"''',
  '''sharedSecretHex"\s*:\s*"[A-Fa-f0-9]{64}"''',
  '''hpkeSessionKeyHex"\s*:\s*"[A-Fa-f0-9]{64}"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarMediaTests/Fixtures/MediaFrameAEADVector\.json''',
  '''android/app/src/test/resources/media-aead/MediaFrameAEADVector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarComputerUseCoreTests/Fixtures/ControlFrameSealVector\.json''',
  '''android/app/src/test/resources/control-seal/ControlFrameSealVector\.json''',
]

[[allowlists]]
description = "Deterministic Hermes ratchet golden-vector state outputs used only in Swift crypto tests"
condition = "AND"
regexTarget = "match"
regexes = [
  '''rootKeyBase64,\s*"[A-Za-z0-9+/_=-]+"''',
  '''receivingChainKeyBase64,\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/HermesRatchetCryptoTests\.swift''',
]

[[allowlists]]
description = "Deterministic Signal at-rest KAT private keys used only in checked-in cross-language test fixtures"
condition = "AND"
regexTarget = "match"
regexes = [
  '''recipientPrivateKeyB64"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''SIGNAL_(DEVICE_)?KAT_PRIVATE_KEY_B64\s*=\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarSignalCoreTests/Fixtures/SignalEnvelopeV1Vector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarSignalCoreTests/Fixtures/CryptoKitAtRestInteropVector\.json''',
  '''android/app/src/androidTest/java/com/openburnbar/data/cloud/CloudVaultCryptoSignalInstrumentedTest\.kt''',
  '''android/app/src/test/java/com/openburnbar/data/cloud/CloudVaultCryptoTest\.kt''',
]

[[allowlists]]
description = "Deterministic libsignal XEd25519 public-key KATs used only in server-side trust-chain signature tests"
condition = "AND"
regexTarget = "match"
regexes = [
  '''keyHex:\s*"[A-Fa-f0-9]{66}"''',
]
paths = [
  '''functions/src/__tests__/escrowDeviceTrustChainSignature\.test\.ts''',
]

[[allowlists]]
description = "Deterministic Signal envelope placeholder wraps used only in first-party contract tests"
condition = "AND"
regexTarget = "match"
regexes = [
  '''recipientIdentityKeyB64"?\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''sealedContentKeyB64"?\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/CloudVaultSignalEnvelopeTests\.swift''',
  '''functions/src/__tests__/signalEnvelopeExport\.test\.ts''',
  '''packages/signal-envelope-contracts/src/cloudVaultSignalEnvelope\.test\.ts''',
  '''packages/signal-envelope-contracts/src/index\.test\.ts''',
  '''services/hosted-mcp/src/signalEnvelopeContracts\.test\.ts''',
]

[[allowlists]]
description = "Escrow fingerprint parity tests use public P-256 keys, not private key material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''key\s*=\s*"[A-Za-z0-9+/_=-]{80,}"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/EscrowDeviceSafetyCodeTests\.swift''',
  '''functions/src/__tests__/escrowDeviceTrustFingerprint\.test\.ts''',
]

[[allowlists]]
description = "Gateway size-limit constants reference imported protocol caps, not credential values"
condition = "AND"
regexTarget = "match"
regexes = [
  '''HERMES_GATEWAY_MAX_SIGNAL_KEY_WRAP_B64\s*=\s*SIGNAL_MAX_KEY_WRAP_B64''',
]
paths = [
  '''functions/src/hermesGateway\.ts''',
]

[[allowlists]]
description = "Vendored libsignal cryptographic KATs and registration fixtures are deterministic public test vectors"
condition = "AND"
regexTarget = "match"
regexes = [
  '''"key"\s*:\s*"[A-Fa-f0-9]{32,128}"''',
  '''"(profileKey|masterKey|media_root_backup_key|mediaRootBackupKey|root_key|admin_key|rootKey|adminKey|recoveryPassword|aciIdentityKey|pniIdentityKey)"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''Vendor/libsignal/rust/crypto/tests/data/aes_gcm_test\.json''',
  '''Vendor/libsignal/rust/message-backup/tests/res/.*''',
  '''Vendor/libsignal/java/client/src/test/java/org/signal/libsignal/net/RegistrationServiceTest\.java''',
  '''Vendor/libsignal/rust/net/chat/src/ws/registration/request\.rs''',
]

[[allowlists]]
description = "Swift UserDefaults key constants and test lookup keys, not credential material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''userDefaultsKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''dismissedAtKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''savedQueriesKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''forKey:\s*"[A-Za-z0-9_.:-]+"''',
]
paths = [
  '''OpenBurnBarMobile/Services/ApprovalPolicyStore\.swift''',
  '''OpenBurnBarMobile/Services/MissionFABResurrectionController\.swift''',
  '''OpenBurnBarMobile/Models/ActivityStore\.swift''',
  '''OpenBurnBarMobile/Tests/MissionFABResurrectionControllerTests\.swift''',
]

[[allowlists]]
description = "ElderWand preset UserDefaults key constants ('elderWand.presets.v1') are local-storage identifiers, not credential material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''presets(Storage|Defaults)(Key|Name)\s*=\s*"[A-Za-z0-9_.:-]+"''',
]
paths = [
  '''AgentLens/Services/Settings/Stores/ElderWandSettings\.swift''',
  '''OpenBurnBarMobile/Services/Hermes/ElderWandSettings\.swift''',
]

[[allowlists]]
description = "Console escrow documentation and interoperability vectors contain public wrapped-key fixtures only"
condition = "AND"
regexTarget = "match"
regexes = [
  '''Wrapped vault key\s*=\s*ephemeral ECDH public key''',
  '''wrapVaultKey output bytes\s*=\s*ephemeral ECDH public key''',
  '''Swift wrapVaultKey exactly:\s*ephemeral ECDH public key''',
  '''"vaultKeyB64"\s*:\s*"[A-Za-z0-9+/=]+"''',
]
paths = [
  '''apps/console/README\.md''',
  '''apps/console/lib/escrow\.ts''',
  '''apps/console/test/interop/swift-fixture\.json''',
]

[[allowlists]]
description = "Console Firebase web config contains public client identifiers, not server credentials"
condition = "AND"
regexTarget = "match"
regexes = [
  '''AIza[0-9A-Za-z_-]{35}''',
]
paths = [
  '''apps/console/lib/firebaseClient\.ts''',
]

[[allowlists]]
description = "Website Firebase web config contains public client identifiers required for production sign-in"
condition = "AND"
regexTarget = "match"
regexes = [
  '''AIzaSyBiAIHwf1MKZ6LN5HrsaPYsAR3UTe8hyw4''',
]
paths = [
  '''website/src/lib/firebaseClient\.ts''',
  '''website/scripts/test-firebase-config\.mjs''',
  '''website/dist/_assets/firebaseClient\.[A-Za-z0-9_-]+\.js''',
]

[[allowlists]]
description = "Data export tests use synthetic relay-envelope wrapped-key fixtures"
condition = "AND"
regexTarget = "match"
regexes = [
  '''wrappedKey:\s*"[A-Za-z0-9+/=]+"''',
]
paths = [
  '''functions/src/__tests__/dataExport\.test\.ts''',
]

[[allowlists]]
description = "Launch evidence stores SHA-256 purchase token hashes, not raw purchase tokens"
condition = "AND"
regexTarget = "match"
regexes = [
  '''"purchaseTokenHash"\s*:\s*"[a-f0-9]{64}"''',
]
paths = [
  '''launch-evidence/android-play-v25-ultra-live-proof-20260603T115300Z\.json''',
  '''launch-evidence/paid-proof-google_play_ultra-v25-20260603T115132Z\.out''',
]

[[allowlists]]
description = "Flow validator rubric says auth context as evidence text, not an auth secret"
condition = "AND"
regexTarget = "match"
regexes = [
  '''auth context,\s+idempotency/concurrency behavior''',
]
paths = [
  '''\.claude/agents/flow-validator\.md''',
]

[[allowlists]]
description = "Swift crypto private-key type labels and aliases name parameters/types, not committed key material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''recipientPrivateKey:\s+Curve25519\.KeyAgreement\.PrivateKey''',
  '''typealias\s+PlatformP256KeyAgreementPrivateKey\s*=\s*P256\.KeyAgreement\.PrivateKey''',
]
paths = [
  '''OpenBurnBarCore/Sources/OpenBurnBarComputerUseCore/RemoteUnlockCredentialEnvelopeCrypto\.swift''',
  '''OpenBurnBarCore/Sources/OpenBurnBarCore/Platform/PlatformSupport\.swift''',
]

[[allowlists]]
description = "ElderWand Windows preset storage key is a local-storage identifier, not credential material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''PresetsStorageKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
]
paths = [
  '''windows/app/OpenBurnBar\.App\.Presentation/ElderWand/ElderWandSettingsModel\.cs''',
]

[[allowlists]]
description = "Deterministic Windows CloudVault KAT generator and fixtures use synthetic recovery/shared-secret vectors"
condition = "AND"
regexTarget = "match"
regexes = [
  '''recoveryKey:\s*"[A-Z0-9-]+"''',
  '''"recoveryKey"\s*:\s*"[A-Z0-9-]+"''',
  '''"sharedSecretHex"\s*:\s*"[A-Fa-f0-9]{64}"''',
]
paths = [
  '''windows/cloudsync/tools/CloudVaultVectorGen/Sources/CloudVaultVectorGen/main\.swift''',
  '''windows/tests/cloudsync/Fixtures/cloudvault-kat-vectors\.json''',
]

[[allowlists]]
description = "Vendored SQLite C API symbols contain key-like words but are not credentials"
condition = "AND"
regexTarget = "match"
regexes = [
  '''sqlite3_api->column_bytes16''',
  '''sqlite3_api->soft_heap_limit64''',
  '''sqlite3_api->hard_heap_limit64''',
  '''iKey==FTS5_AVERAGES_ROWID''',
]
paths = [
  '''OpenBurnBarCore/Sources/CSQLite/sqlite3\.c''',
]

[[allowlists]]
description = "Windows ARD auth test comments use a public AES all-zero known-answer vector"
condition = "AND"
regexTarget = "match"
regexes = [
  '''16-zero key = [A-Fa-f0-9]{32}''',
]
paths = [
  '''windows/tests/mercury/RfbArdAuthTests\.cs''',
]

[[allowlists]]
description = "Signal interop fixtures contain deterministic pre-key records for cross-language tests"
condition = "AND"
regexTarget = "match"
regexes = [
  '''"bobSignedPreKeyRecordB64"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''"bobPreKeyRecordB64"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''windows/tests/signal-interop/android-alice-to-swift-bob\.json''',
]

[[allowlists]]
description = "Signal prekey directory algorithm identifiers are public protocol labels, not credentials"
condition = "AND"
regexTarget = "match"
regexes = [
  '''signal-pqxdh-(signed|kyber|one-time)-prekey-v1''',
]
paths = [
  '''functions/src/callables/signalPrekeyDirectory\.ts''',
  '''functions/src/callables/signalPrekeyDirectoryValidators\.ts''',
]

[[allowlists]]
description = "Sparkle EdDSA public update key is bundle metadata, not signing secret material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''SUPublicEDKey:\s*613YSraDEJ54LKsfpqbYhyzYnfYRg7z4QwiEJfoy0TI=''',
  '''<key>SUPublicEDKey</key>''',
  '''<string>613YSraDEJ54LKsfpqbYhyzYnfYRg7z4QwiEJfoy0TI=</string>''',
]
paths = [
  '''project\.yml''',
  '''AgentLens/Resources/OpenBurnBar-Info\.plist''',
]

[[allowlists]]
description = "Signal prekey directory tests and denylist literals intentionally name forbidden secret fields"
condition = "AND"
regexTarget = "match"
regexes = [
  '''privateKeyData''',
  '''privateKeyB64''',
  '''serializedSession''',
  '''sessionState''',
  '''ratchetState''',
  '''apiKey''',
  '''secret''',
]
paths = [
  '''functions/src/callables/signalPrekeyDirectory\.ts''',
  '''functions/src/__tests__/signalPrekeyDirectory\.test\.ts''',
]

[[allowlists]]
description = "Signal prekey validator denylist literals intentionally name forbidden secret fields"
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"apiKey",''',
  '''^\s*"token",''',
  '''^\s*"refreshToken",''',
  '''^\s*"accessToken",''',
  '''^\s*"idToken",''',
  '''^\s*"cookie",''',
  '''^\s*"password",''',
  '''^\s*"secret",''',
  '''^\s*"secretVersionName",''',
  '''^\s*"authorization",''',
  '''^\s*"bearer",''',
  '''^\s*"credential",''',
  '''^\s*"privateKey",''',
  '''^\s*"privateKeyData",''',
  '''^\s*"privateKeyB64",''',
  '''^\s*"serializedSession",''',
  '''^\s*"serializedSessionB64",''',
  '''^\s*"sessionState",''',
  '''^\s*"sessionStateB64",''',
  '''^\s*"ratchetState",''',
  '''^\s*"ratchetStateB64",''',
]
paths = [
  '''functions/src/callables/signalPrekeyDirectoryValidators\.ts''',
]

[[allowlists]]
description = "Environment-secret guard unit test uses a fake private-key header sentinel"
condition = "AND"
regexTarget = "match"
regexes = [
  '''APNS_AUTH_KEY=-----BEGIN PRIVATE KEY-----''',
]
paths = [
  '''scripts/ci/check-env-no-secrets\.test\.sh''',
]

[[allowlists]]
description = "libsignal Cargo.lock dependency name `libcrux-secrets` is a package label, not credential material"
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"libcrux-secrets",''',
]
paths = [
  '''Vendor/libsignal/Cargo\.lock''',
]

[[allowlists]]
description = "Deterministic libsignal prekey record KATs used only in checked-in cross-language test fixtures"
condition = "AND"
regexTarget = "match"
regexes = [
  '''"bob(Signed)?PreKeyRecordB64"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarSignalCoreTests/Fixtures/android-alice-to-swift-bob\.json''',
  '''android/app/src/test/resources/signal-interop/android-alice-to-swift-bob\.json''',
  '''tests/fixtures/signal-interop/android-alice-to-swift-bob\.json''',
]

[[allowlists]]
description = "Firestore rules negative tests intentionally use forbidden credential field names with non-secret sentinel values"
condition = "AND"
regexTarget = "match"
regexes = [
  '''encryptedPayload:\s*\["not",\s*"allowed"\]''',
]
paths = [
  '''firestore-rules-tests/escrow-grants\.test\.js''',
]

[[allowlists]]
description = "Elder Wand UserDefaults storage keys are local preference names, not credential material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''static let presets(Storage|Defaults)Name\s*=\s*"elderWand\.presets\.v1"''',
]
paths = [
  '''AgentLens/Services/Settings/Stores/ElderWandSettings\.swift''',
  '''OpenBurnBarMobile/Services/Hermes/ElderWandSettings\.swift''',
]

[[allowlists]]
description = "Hermes wire-protocol schema: `\"key\": \"…\"` entries are JSON codable field names in the type definitions, not credential material"
condition = "AND"
regexTarget = "match"
regexes = [
  '''"key"\s*:\s*"[A-Za-z0-9_]+"''',
]
paths = [
  '''packages/hermes-wire-protocol/relay-message-types\.json''',
]

[[allowlists]]
description = "Synthetic Amplitude API keys used only in the VS Code extension analytics unit tests — placeholders, never real credentials"
condition = "AND"
regexTarget = "match"
regexes = [
  '''env-injected-key-[0-9]+''',
  '''amp-test-key-[0-9]+''',
  '''wiring-test-key-[0-9]+''',
]
paths = [
  '''extensions/openburnbar/test/analytics/config\.test\.ts''',
  '''extensions/openburnbar/test/analytics/consentContract\.test\.ts''',
  '''extensions/openburnbar/test/analytics/wiring\.test\.ts''',
]

[[allowlists]]
description = "Windows settings page reads VaultKeyB64 from AppConfiguration (UI binding, not a committed secret)"
condition = "AND"
regexTarget = "match"
regexes = [
  '''VaultKeyBox\.Text = snap\.VaultKeyB64 \?\? string\.Empty''',
]
paths = [
  '''windows/app/OpenBurnBar\.App/Settings/DataSourceSettingsPage\.xaml\.cs''',
]

[[allowlists]]
description = "Linux-port evidence transcripts: sha256 digests, ed25519 public-key hashes, and signer identifiers captured in committed proof bundles under docs/linux-port/evidence — digests of evidence artifacts, never credential material (the privacy-invariants gate governs PII there separately)"
condition = "AND"
regexTarget = "match"
regexes = [
  '''[0-9a-f]{24,64}''',
]
paths = [
  '''docs/linux-port/evidence/.*''',
]

[[allowlists]]
description = "Linux core-foundation parity fixture: hermesKeySHA256Hex is the digest of a synthetic fixture key generated for the parser-parity oracle"
condition = "AND"
regexTarget = "match"
regexes = [
  '''[0-9a-f]{24,64}''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarLinuxCoreFoundationTests/Fixtures/linux-provider-model-parity-fixture\.json''',
]

[[allowlists]]
description = "PlatformSupport crypto typealiases (e.g. PlatformEd25519SigningMaterial = Curve25519.Signing.PrivateKey) — Swift type names that pattern-match key keywords, not key material"
condition = "AND"
regexTarget = "line"
regexes = [
  '''public typealias Platform[A-Za-z0-9]+ =''',
]
paths = [
  '''OpenBurnBarCore/Sources/OpenBurnBarCore/Platform/PlatformSupport\.swift''',
]

[[allowlists]]
description = "Linux-port evidence daemon log transcripts: structured os_log lines (subsystem=com.openburnbar.daemon) captured as gateway/IPC proof — auth-token words appear in error copy, never as real token values"
condition = "AND"
regexTarget = "line"
regexes = [
  '''subsystem=com\.openburnbar\.daemon''',
]
paths = [
  '''docs/linux-port/evidence/.*''',
]
