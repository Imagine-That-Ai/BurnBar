title = "OpenBurnBar gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Swift key-material parameter labels that reference variables, not committed secrets"
regexTarget = "match"
regexes = [
  '''privateKey:\s+[A-Za-z_][A-Za-z0-9_]*''',
  '''signingKey:\s+[A-Za-z_][A-Za-z0-9_]*''',
  '''key:\s+[A-Za-z_][A-Za-z0-9_]*''',
]

[[allowlists]]
description = "Swift redaction sentinel assertions that intentionally compare against the literal placeholder"
regexTarget = "match"
regexes = [
  '''creds\.rateLimitTier,\s*"REDACTED"''',
  '''routePayloadCreds\.rateLimitTier,\s*"REDACTED"''',
]
paths = [
  '''AgentLensTests/Active/ProviderQuotaServiceTests\.swift''',
]

[[allowlists]]
description = "Deterministic Hermes relay wire-vector keys used only in checked-in test fixtures"
regexTarget = "match"
regexes = [
  '''symmetricKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''plaintextContentKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedKeyOverride"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''bodyKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''wrappedVaultKey"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/HermesRelayWireVector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/HermesGatewayWireVector\.json''',
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/BurnBarHpkeV3Vector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesRelayWireVector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesGatewayWireVector\.json''',
  '''android/app/src/test/resources/hermes-relay/HermesGatewayWireVectorV3\.json''',
  '''functions/scripts/test-firestore-rules\.mjs''',
]

[[allowlists]]
description = "Deterministic Hermes ratchet golden-vector state outputs used only in Swift crypto tests"
regexTarget = "match"
regexes = [
  '''rootKeyBase64,\s*"[A-Za-z0-9+/_=-]+"''',
  '''receivingChainKeyBase64,\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarCoreTests/HermesRatchetCryptoTests\.swift''',
]

[[allowlists]]
description = "Deterministic Signal at-rest KAT private keys used only in checked-in cross-language test fixtures"
regexTarget = "match"
regexes = [
  '''recipientPrivateKeyB64"\s*:\s*"[A-Za-z0-9+/_=-]+"''',
  '''SIGNAL_(DEVICE_)?KAT_PRIVATE_KEY_B64\s*=\s*"[A-Za-z0-9+/_=-]+"''',
]
paths = [
  '''OpenBurnBarCore/Tests/OpenBurnBarSignalCoreTests/Fixtures/SignalEnvelopeV1Vector\.json''',
  '''android/app/src/androidTest/java/com/openburnbar/data/cloud/CloudVaultCryptoSignalInstrumentedTest\.kt''',
  '''android/app/src/test/java/com/openburnbar/data/cloud/CloudVaultCryptoTest\.kt''',
]

[[allowlists]]
description = "Swift UserDefaults key constants and test lookup keys, not credential material"
regexTarget = "match"
regexes = [
  '''userDefaultsKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''dismissedAtKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''savedQueriesKey\s*=\s*"[A-Za-z0-9_.:-]+"''',
  '''forKey:\s*"[A-Za-z0-9_.:-]+"''',
]
paths = [
  '''OpenBurnBarMobile/Services/ApprovalPolicyStore\.swift''',
  '''OpenBurnBarMobile/Services/MissionFABResurrectionController\.swift''',
  '''OpenBurnBarMobile/Models/ActivityStore\.swift''',
  '''OpenBurnBarMobile/Tests/MissionFABResurrectionControllerTests\.swift''',
]

[[allowlists]]
description = "Console escrow documentation and interoperability vectors contain public wrapped-key fixtures only"
regexTarget = "match"
regexes = [
  '''Wrapped vault key\s*=\s*ephemeral ECDH public key''',
  '''wrapVaultKey output bytes\s*=\s*ephemeral ECDH public key''',
  '''Swift wrapVaultKey exactly:\s*ephemeral ECDH public key''',
  '''"vaultKeyB64"\s*:\s*"[A-Za-z0-9+/=]+"''',
]
paths = [
  '''apps/console/README\.md''',
  '''apps/console/lib/escrow\.ts''',
  '''apps/console/test/interop/swift-fixture\.json''',
]

[[allowlists]]
description = "Console Firebase web config contains public client identifiers, not server credentials"
regexTarget = "match"
regexes = [
  '''AIza[0-9A-Za-z_-]{35}''',
]
paths = [
  '''apps/console/lib/firebaseClient\.ts''',
]

[[allowlists]]
description = "Data export tests use synthetic relay-envelope wrapped-key fixtures"
regexTarget = "match"
regexes = [
  '''wrappedKey:\s*"[A-Za-z0-9+/=]+"''',
]
paths = [
  '''functions/src/__tests__/dataExport\.test\.ts''',
]

[[allowlists]]
description = "Launch evidence stores SHA-256 purchase token hashes, not raw purchase tokens"
regexTarget = "match"
regexes = [
  '''"purchaseTokenHash"\s*:\s*"[a-f0-9]{64}"''',
]
paths = [
  '''launch-evidence/android-play-v25-ultra-live-proof-20260603T115300Z\.json''',
  '''launch-evidence/paid-proof-google_play_ultra-v25-20260603T115132Z\.out''',
]
