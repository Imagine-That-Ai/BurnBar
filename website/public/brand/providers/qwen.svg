<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qwen mark">
  <title>Qwen · Alibaba</title>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0c0a0f" stroke="#2a2030" stroke-width="1.25"/>
  <!-- six-petal nucleus: three bars through the center, 60° apart -->
  <g fill="#ffb547">
    <rect x="28" y="10" width="8" height="44" rx="4"/>
    <rect x="28" y="10" width="8" height="44" rx="4" transform="rotate(60 32 32)"/>
    <rect x="28" y="10" width="8" height="44" rx="4" transform="rotate(-60 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="#0c0a0f"/>
</svg>
