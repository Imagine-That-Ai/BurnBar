<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Foil edge (Mercury/Platinum) -->
    <linearGradient id="mercury-platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="shield-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#0F1013"/>
    </linearGradient>

    <linearGradient id="crest-flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Bevel effect -->
    <filter id="shield-bevel" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4.5" specularConstant="1.3" specularExponent="28" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Slim Heraldic Shield Outline and Body -->
  <path d="M 128,24
           C 170,24 212,36 212,84
           C 212,148 160,208 128,232
           C 96,208 44,148 44,84
           C 44,36 86,24 128,24 Z"
        fill="url(#shield-body)" stroke="url(#mercury-platinum)" stroke-width="6" stroke-linejoin="round" filter="url(#shield-bevel)"/>

  <!-- Inner Inset Shield Ring -->
  <path d="M 128,34
           C 162,34 198,44 198,84
           C 198,138 154,192 128,214
           C 102,192 58,138 58,84
           C 58,44 94,34 128,34 Z"
        stroke="url(#mercury-platinum)" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Centered Cloud & Flame Mark -->
  <g transform="translate(0, 0)">
    <!-- Small Cloud Cradle -->
    <path d="M 98,154 C 80,154 70,136 80,118 C 75,96 98,82 116,91 C 125,73 157,73 166,91 C 184,82 207,96 202,118 C 211,136 202,154 184,154 Z"
          fill="#16181E" stroke="url(#mercury-platinum)" stroke-width="2.5" opacity="0.85"/>

    <!-- Focal Flame inside the Cloud -->
    <path d="M 128, 146
             C 108, 146 96, 128 96, 110
             C 96, 92 108, 76 128, 50
             C 148, 76 160, 92 160, 110
             C 160, 128 148, 146 128, 146 Z"
          fill="url(#crest-flame)"/>
  </g>

  <!-- One Tier "Pip" Engraved at Base -->
  <circle cx="128" cy="190" r="7" fill="url(#mercury-platinum)" filter="url(#shield-bevel)"/>
  <circle cx="128" cy="190" r="3" fill="#1E2026"/>
</svg>
