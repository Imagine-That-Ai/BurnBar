<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Duotone Theme Gradients -->
    <linearGradient id="primary-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow-effect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Silhouette -->
  <rect x="18" y="8" width="28" height="48" rx="5" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Phone Screen Top/Bottom Details -->
  <line x1="28" y1="12" x2="36" y2="12" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="50" r="2" fill="url(#primary-line)"/>

  <!-- Circular Refresh Arrow lifting from screen -->
  <path d="M 32,18 A 12,12 0 1,1 23,38" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 0"/>

  <!-- Cloud at Top Right -->
  <path d="M 40,24 C 37,24 35,22 36,19 C 35,16 38,14 41,15 C 42,13 46,13 47,15 C 49,14 51,16 50,19 C 51,21 50,24 47,24 Z"
        fill="#0F172A" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Refresh Arrowhead -->
  <path d="M 20,34 L 23,38 L 27,35" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tiny Lightning/Ember Spark at arrowhead -->
  <path d="M 23,41 L 21,46 L 25,45 L 24,50" stroke="url(#accent-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-effect)"/>
</svg>
