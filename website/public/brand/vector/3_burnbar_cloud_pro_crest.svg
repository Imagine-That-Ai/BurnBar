<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Luxury Gold Foil -->
    <linearGradient id="pro-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="pro-shield-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1D22"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <linearGradient id="pro-flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Cinematic Relieved Bevel -->
    <filter id="pro-bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5.5" specularConstant="1.6" specularExponent="32" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.9" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="pro-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Faint Sunburst behind the Crest -->
  <g opacity="0.25" filter="url(#pro-glow)">
    <line x1="128" y1="128" x2="128" y2="10" stroke="url(#pro-gold)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="128" y2="246" stroke="url(#pro-gold)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="10" y2="128" stroke="url(#pro-gold)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="246" y2="128" stroke="url(#pro-gold)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="44" y2="44" stroke="url(#pro-gold)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="212" y2="212" stroke="url(#pro-gold)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="212" y2="44" stroke="url(#pro-gold)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="128" y1="128" x2="44" y2="212" stroke="url(#pro-gold)" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- Ornate Laurel flourishes flanking the shield -->
  <g stroke="url(#pro-gold)" stroke-width="2" fill="none" opacity="0.8">
    <!-- Left Laurel -->
    <path d="M 36,90 C 26,110 26,140 40,166 C 44,174 50,182 56,188" stroke-linecap="round"/>
    <path d="M 30,105 C 24,106 18,102 16,96" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 28,125 C 20,125 14,120 12,112" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 29,145 C 21,143 16,136 15,128" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right Laurel -->
    <path d="M 220,90 C 230,110 230,140 216,166 C 212,174 206,182 200,188" stroke-linecap="round"/>
    <path d="M 226,105 C 232,106 238,102 240,96" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 228,125 C 236,125 242,120 244,112" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 227,145 C 235,143 240,136 241,128" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Full, Ornate Shield -->
  <path d="M 128,20
           C 174,20 218,32 218,84
           C 218,154 162,216 128,240
           C 94,216 38,154 38,84
           C 38,32 82,20 128,20 Z"
        fill="url(#pro-shield-body)" stroke="url(#pro-gold)" stroke-width="7" stroke-linejoin="round" filter="url(#pro-bevel)"/>

  <!-- Crown on Top of Cloud-Flame Mark -->
  <g transform="translate(100, 36)" stroke="url(#pro-gold)" stroke-width="2" fill="url(#pro-gold)" filter="url(#pro-bevel)">
    <path d="M 6,18 L 12,6 L 28,14 L 44,6 L 50,18 Z" stroke-linejoin="round"/>
    <circle cx="12" cy="4" r="2.5"/>
    <circle cx="28" cy="11" r="2.5"/>
    <circle cx="44" cy="4" r="2.5"/>
  </g>

  <!-- Ornate Inner Frame -->
  <path d="M 128,32
           C 164,32 202,42 202,84
           C 202,142 156,200 128,222
           C 100,200 54,142 54,84
           C 54,42 92,32 128,32 Z"
        stroke="url(#pro-gold)" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- Centered Cloud & Flame Mark -->
  <g transform="translate(0, 8)">
    <path d="M 94,148 C 76,148 66,130 76,112 C 71,90 94,76 112,85 C 121,67 153,67 162,85 C 180,76 203,90 198,112 C 207,130 198,148 180,148 Z"
          fill="#1C1D22" stroke="url(#pro-gold)" stroke-width="2.5" opacity="0.9"/>

    <path d="M 128, 140
             C 108, 140 96, 122 96, 104
             C 96, 86 108, 70 128, 44
             C 148, 70 160, 86 160, 104
             C 160, 122 148, 140 128, 140 Z"
          fill="url(#pro-flame)"/>
  </g>

  <!-- Three Tier Pips Engraved in Arc at Base -->
  <g filter="url(#pro-bevel)">
    <!-- Left Pip -->
    <circle cx="104" cy="192" r="6" fill="url(#pro-gold)"/>
    <circle cx="104" cy="192" r="2" fill="#09090B"/>
    <!-- Center Pip -->
    <circle cx="128" cy="198" r="6" fill="url(#pro-gold)"/>
    <circle cx="128" cy="198" r="2" fill="#09090B"/>
    <!-- Right Pip -->
    <circle cx="152" cy="192" r="6" fill="url(#pro-gold)"/>
    <circle cx="152" cy="192" r="2" fill="#09090B"/>
  </g>
</svg>
