<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mystic Floo Flame-Green Portal Gradients -->
    <linearGradient id="floo-portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="floo-spark-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Bevel & Glow Filters -->
    <filter id="portal-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chip-bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="1.2" specularExponent="25" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
    </filter>
  </defs>

  <!-- Deep space portal field -->
  <circle cx="32" cy="32" r="26" fill="#030712"/>

  <!-- Swirling Portal Ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#floo-portal-grad)" stroke-width="4.5" filter="url(#portal-depth)" fill="none"/>

  <!-- Active data streams swirling inside (Dots/Bytes) -->
  <!-- Swirling dotted arc 1 -->
  <path d="M 18,22 A 16,16 0 0,1 46,22" stroke="url(#floo-spark-grad)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" fill="none"/>
  <!-- Swirling dotted arc 2 -->
  <path d="M 46,42 A 16,16 0 0,1 18,42" stroke="url(#floo-spark-grad)" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round" fill="none"/>

  <!-- Glowing energy sparks in center -->
  <circle cx="32" cy="22" r="2" fill="#FFF" filter="url(#portal-depth)"/>
  <circle cx="20" cy="34" r="1.5" fill="#34D399" filter="url(#portal-depth)"/>
  <circle cx="44" cy="30" r="2.5" fill="#FFF" filter="url(#portal-depth)"/>

  <!-- GB Engraved Chip (Bottom-Right, overlapping portal) -->
  <g transform="translate(36, 36)" filter="url(#chip-bevel)">
    <!-- Platinum / Tech metal microchip base -->
    <rect width="22" height="18" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Corner notches / chip pins -->
    <line x1="4" y1="-1" x2="4" y2="1" stroke="#475569" stroke-width="1.2"/>
    <line x1="11" y1="-1" x2="11" y2="1" stroke="#475569" stroke-width="1.2"/>
    <line x1="18" y1="-1" x2="18" y2="1" stroke="#475569" stroke-width="1.2"/>
    <line x1="4" y1="17" x2="4" y2="19" stroke="#475569" stroke-width="1.2"/>
    <line x1="11" y1="17" x2="11" y2="19" stroke="#475569" stroke-width="1.2"/>
    <line x1="18" y1="17" x2="18" y2="19" stroke="#475569" stroke-width="1.2"/>

    <!-- GB Engraved Text -->
    <text x="11" y="12.5" font-family="'Inter', 'Outfit', sans-serif" font-size="7.5" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.2">
      GB
    </text>
  </g>
</svg>
