<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow-effect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stacked Transcript/Code Lines -->
  <!-- Line 1 -->
  <line x1="8" y1="12" x2="36" y2="12" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Line 2 -->
  <line x1="8" y1="20" x2="48" y2="20" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Line 3 (Highlighted Line) -->
  <line x1="8" y1="28" x2="52" y2="28" stroke="url(#primary-line)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Highlighted Ember Underline -->
  <line x1="12" y1="32" x2="38" y2="32" stroke="url(#accent-glow)" stroke-width="2" stroke-linecap="round" filter="url(#glow-effect)"/>
  <!-- Line 4 -->
  <line x1="8" y1="40" x2="28" y2="40" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Line 5 -->
  <line x1="8" y1="48" x2="40" y2="48" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Magnifier overlaying the stacked lines -->
  <g filter="url(#glow-effect)">
    <!-- Lens Circle -->
    <circle cx="44" cy="38" r="10" stroke="url(#primary-line)" stroke-width="2.5" fill="#0F172A" fill-opacity="0.8"/>
    <!-- Handle -->
    <line x1="51" y1="45" x2="59" y2="53" stroke="url(#primary-line)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Small Timestamp Tick Icon (Clock Face) -->
  <g transform="translate(46, 8)" filter="url(#glow-effect)" stroke="url(#accent-glow)" stroke-width="1.5" fill="none">
    <circle cx="6" cy="6" r="5"/>
    <path d="M 6,3 L 6,6 L 8.5,7.5" stroke-linecap="round"/>
  </g>
</svg>
