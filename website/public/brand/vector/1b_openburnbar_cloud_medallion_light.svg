<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cream Medallion Base Gradient -->
    <radialGradient id="cream-field" cx="50%" cy="30%" r="75%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="80%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#E2DDD3"/>
    </radialGradient>

    <!-- Brushed Gold Ring Gradient -->
    <linearGradient id="brushed-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Deeper Ember Flame Gradient -->
    <linearGradient id="deep-ember-flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- 3D Bevel/Relief Filter -->
    <filter id="numismatic-relief-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.4" specularExponent="30" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="65"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C6F5A" flood-opacity="0.3"/>
    </filter>

    <!-- Engraved Effect for Ring Text -->
    <filter id="engraved-inset-light" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0.5" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#451A03" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Text Path for Circular Medallion -->
    <path id="textPath-light" d="M 256, 442 A 186,186 0 1,1 256.1,442" fill="none"/>
  </defs>

  <!-- Cream Field (Medallion Base) -->
  <circle cx="256" cy="256" r="240" fill="url(#cream-field)" stroke="#E2DDD3" stroke-width="4"/>

  <!-- Outer Brushed Gold Foil Ring with Bevel -->
  <circle cx="256" cy="256" r="218" stroke="url(#brushed-gold)" stroke-width="24" filter="url(#numismatic-relief-light)" fill="none"/>

  <!-- Outer Ring Accent Borders -->
  <circle cx="256" cy="256" r="230" stroke="#B45309" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="206" stroke="#B45309" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Text Along Path -->
  <text font-family="'Inter', 'Outfit', sans-serif" font-size="19" font-weight="700" letter-spacing="9" fill="#451A03" filter="url(#engraved-inset-light)" opacity="0.9">
    <textPath href="#textPath-light" startOffset="50%" text-anchor="middle">
      OPENBURNBAR · CLOUD ·
    </textPath>
  </text>

  <!-- Core Content -->
  <g>
    <!-- Stylized Cumulus Cloud Base -->
    <path d="M 170,330 C 130,330 110,290 130,250 C 120,200 170,170 210,190 C 230,150 300,150 320,190 C 360,170 410,200 400,250 C 420,290 400,330 360,330 Z"
          fill="#FAF9F6" stroke="url(#brushed-gold)" stroke-width="4" filter="url(#numismatic-relief-light)"/>

    <!-- Rising 3-Tongued Deeper Ember Flame -->
    <path d="M 256, 310
             C 215, 310 190, 275 190, 235
             C 190, 200 212, 170 225, 130
             C 230, 160 242, 178 249, 187
             C 243, 169 241, 138 256, 100
             C 271, 138 269, 169 263, 187
             C 270, 178 282, 160 287, 130
             C 300, 170 322, 200 322, 235
             C 322, 275 297, 310 256, 310 Z"
          fill="url(#deep-ember-flame)"/>

    <!-- Flame Specular Highlights -->
    <path d="M 256, 290
             C 230, 290 215, 270 215, 240
             C 215, 215 230, 195 240, 160
             C 242, 180 249, 192 253, 198
             C 249, 185 248, 165 256, 140
             C 264, 165 263, 185 259, 198
             C 263, 192 270, 180 272, 160
             C 282, 195 297, 215 297, 240
             C 297, 270 282, 290 256, 290 Z"
          fill="#FFF" opacity="0.3"/>
  </g>

  <!-- Subtle Brushed Golden Specular Reflection -->
  <ellipse cx="140" cy="140" rx="65" ry="22" transform="rotate(-40, 140, 140)" fill="#FFF" opacity="0.12"/>
</svg>
