<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Medallion Base Gradient -->
    <radialGradient id="obsidian-field" cx="50%" cy="30%" r="75%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#24252C"/>
      <stop offset="60%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#09090C"/>
    </radialGradient>

    <!-- Platinum-to-Gold Foil Ring Gradient -->
    <linearGradient id="plat-gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3C6"/>
      <stop offset="20%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="80%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Flame Glowing Ember/Amber Gradient -->
    <linearGradient id="ember-flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- 3D Bevel/Relief Filter -->
    <filter id="numismatic-relief" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.5" specularExponent="35" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="65"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Inner Shadow for Engraved Look -->
    <filter id="engraved-inset" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Ambient Glow for Flame -->
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Path for Circular Medallion -->
    <path id="textPath-dark" d="M 256, 442 A 186,186 0 1,1 256.1,442" fill="none"/>
  </defs>

  <!-- Obsidian Field (Medallion Base) -->
  <circle cx="256" cy="256" r="240" fill="url(#obsidian-field)" stroke="#09090C" stroke-width="4"/>

  <!-- Outer Platinum-to-Gold Foil Ring with Bevel -->
  <circle cx="256" cy="256" r="218" stroke="url(#plat-gold-foil)" stroke-width="24" filter="url(#numismatic-relief)" fill="none"/>

  <!-- Outer Ring Dark Inner Accent Border -->
  <circle cx="256" cy="256" r="230" stroke="#09090C" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="256" cy="256" r="206" stroke="#09090C" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Text Along Path for Circular Medallion -->
  <text font-family="'Inter', 'Outfit', sans-serif" font-size="19" font-weight="700" letter-spacing="9" fill="#0F0F11" filter="url(#engraved-inset)" opacity="0.95">
    <textPath href="#textPath-dark" startOffset="50%" text-anchor="middle">
      OPENBURNBAR · CLOUD ·
    </textPath>
  </text>

  <!-- Core Content (12px Safe Margin Centered Area) -->
  <g transform="translate(0, 0)">
    <!-- Stylized Cumulus Cloud Base -->
    <!-- The cloud shape sits beneath and cradles the rising flame -->
    <path d="M 170,330 C 130,330 110,290 130,250 C 120,200 170,170 210,190 C 230,150 300,150 320,190 C 360,170 410,200 400,250 C 420,290 400,330 360,330 Z"
          fill="#1C1D24" stroke="url(#plat-gold-foil)" stroke-width="4" filter="url(#numismatic-relief)"/>

    <!-- Semi-transparent overlay to give volume to cloud -->
    <path d="M 170,330 C 130,330 110,290 130,250 C 120,200 170,170 210,190 C 230,150 300,150 320,190 C 360,170 410,200 400,250 C 420,290 400,330 360,330 Z"
          fill="url(#plat-gold-foil)" opacity="0.08"/>

    <!-- Rising 3-Tongued Flame cradled inside -->
    <path d="M 256, 310
             C 215, 310 190, 275 190, 235
             C 190, 200 212, 170 225, 130
             C 230, 160 242, 178 249, 187
             C 243, 169 241, 138 256, 100
             C 271, 138 269, 169 263, 187
             C 270, 178 282, 160 287, 130
             C 300, 170 322, 200 322, 235
             C 322, 275 297, 310 256, 310 Z"
          fill="url(#ember-flame)" filter="url(#flame-glow)"/>

    <!-- Subtle Specular Highlights on the Flame Center -->
    <path d="M 256, 290
             C 230, 290 215, 270 215, 240
             C 215, 215 230, 195 240, 160
             C 242, 180 249, 192 253, 198
             C 249, 185 248, 165 256, 140
             C 264, 165 263, 185 259, 198
             C 263, 192 270, 180 272, 160
             C 282, 195 297, 215 297, 240
             C 297, 270 282, 290 256, 290 Z"
          fill="#FFF" opacity="0.25"/>
  </g>

  <!-- Specular Highlight Top-Left (Luxury Coin Effect) -->
  <ellipse cx="140" cy="140" rx="60" ry="25" transform="rotate(-40, 140, 140)" fill="#FFF" opacity="0.08" filter="url(#numismatic-relief)"/>
</svg>
