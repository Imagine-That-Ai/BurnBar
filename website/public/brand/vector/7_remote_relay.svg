<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow-effect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Endpoint (Phone) -->
  <rect x="6" y="24" width="10" height="20" rx="1.5" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="9" y1="27" x2="13" y2="27" stroke="url(#primary-line)" stroke-width="1"/>

  <!-- Right Endpoint (Laptop) -->
  <rect x="42" y="24" width="16" height="16" rx="2" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="39" y1="40" x2="61" y2="40" stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Relay Tower -->
  <path d="M 28,44 L 32,18 L 36,44" stroke="url(#primary-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="18" r="3.5" fill="url(#accent-glow)" filter="url(#glow-effect)"/>

  <!-- Concentric Signal Arcs -->
  <path d="M 26,16 A 8,8 0 0,0 26,20" stroke="url(#accent-glow)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 38,16 A 8,8 0 0,1 38,20" stroke="url(#accent-glow)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 22,12 A 14,14 0 0,0 22,24" stroke="url(#accent-glow)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 42,12 A 14,14 0 0,1 42,24" stroke="url(#accent-glow)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Signed Connection Bridge with Lock Glyph -->
  <path d="M 16,34 L 42,34" stroke="url(#primary-line)" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- Lock Glyph on the beam -->
  <g transform="translate(26, 28)" filter="url(#glow-effect)">
    <rect x="2" y="4" width="8" height="6" rx="1" fill="url(#accent-glow)"/>
    <path d="M 3,4 L 3,2 C 3,0.5 4,0.5 6,0.5 C 8,0.5 9,0.5 9,2 L 9,4" stroke="url(#accent-glow)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
