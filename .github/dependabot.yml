  # ── Lockfiles the required OSV gate scans but nothing auto-fixed ──────────
  #
  # `OSV Scanner (open source vulnerabilities)` is a REQUIRED status check on
  # main and scans every package-lock.json in the tree (19 of them). Dependabot
  # watched only 8. An advisory landing in one of the other 11 therefore had no
  # auto-fix owner: the required check went red on every open PR at once and
  # stayed red until somebody hand-patched it.
  #
  # 2026-07-24 produced two examples in one day -- the postcss/tar advisories in
  # /apps/linux-desktop and /tools/schema-sync (#1968), then brace-expansion
  # GHSA-mh99-v99m-4gvg -- each red-lining all 17 open PRs for a vulnerability
  # none of them introduced.
  #
  # Closing the gap makes the required gate self-healing: anything that can
  # block a merge now has a bot that opens the fix. Grouped and rate-limited so
  # 11 new ecosystems cannot flood the PR queue.
  #
  # These blocks are deliberately written out in full. dependabot.yml does NOT
  # support YAML anchors/aliases -- Dependabot rejects the whole file with
  # "YAML aliases are not supported" (dependabot-core#1582, open since 2019),
  # which would disable every entry above as well. Do not "de-duplicate" this
  # with anchors; scripts/ci/verify-dependabot-config.mjs fails the build if you
  # try. Keep entries in sync by editing all of them.
    groups:
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

