name: Headless App Build (K4 precursor)

# Post-merge / nightly build-only proof that the macOS AgentLens app (scheme
# OpenBurnBar) still COMPILES headlessly — the declared precondition for the
# Core-decomposition UI extraction (packet P-16 / K4, docs/CORE_DECOMPOSITION_PROGRAM.md).
#
# WHY A SEPARATE LANE (not just app-pr-gate.yml):
#   app-pr-gate.yml's `app-build-test` runs `xcodebuild test` — it launches the
#   XCTest host and the app's Firestore/daemon lifecycle. P-16 (Views ->
#   OpenBurnBarUI) does not need the app TESTS to run to be proven safe; it
#   needs proof the app GRAPH still builds after a UI move. This lane runs
#   `xcodebuild build` only (scripts/ci/headless-app-build.sh).
#
# This is not a pull_request or merge_group wall. Hosted macos-26 headless
# builds were 21–30 minutes and are not one of the ten required merge
# contexts; ALLGREEN on the merge queue still waited for them. Fast Feedback
# plus the required security/quality contexts remain the merge door. A broken
# AgentLens graph stays visible on push-to-main and nightly, not silent.
#
# PATH FILTER (push only): surfaces a UI extraction can break —
# OpenBurnBarCore/** and AgentLens/**. Nightly and workflow_dispatch ignore
# path filters so a quiet day cannot hide a red app graph.
#
# The known-good headless recipe (repo memory "Headless xcodebuild blocked
# (Xcode 27 Beta)") is encoded in the script: a fresh CI runner checks out
# OUTSIDE ~/Documents, so the Xcode-27 sandbox/TCC blockers that bite a local
# ~/Documents checkout do not apply and a normal in-tree resolve + build works.
# The script also supports a local cache-reuse mode for developers reproducing
# the gate on a ~/Documents checkout.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "OpenBurnBarCore/**"
      - "AgentLens/**"
      - "OpenBurnBar.xcodeproj/**"
      - "project.yml"
      - "scripts/ci/headless-app-build.sh"
      - ".github/workflows/headless-app-build.yml"
  schedule:
    # 10:47 UTC. After the 09:17 App post-merge lane and the 10:17 Linux
    # nightly so macos-26 runners are not triple-booked.
    - cron: "47 10 * * *"
  workflow_dispatch:

# Push runs are the exact-main headless proof: key them by commit and never
# cancel them. A later main push must not evict an in-flight graph build;
# path filters do not protect a product SHA whose proof is still running.
# GitHub also evicts a *pending* run when two jobs share a group, even with
# cancel-in-progress false, so push groups include the SHA.
concurrency:
  group: headless-app-build-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  headless-app-build:
    name: Headless macOS app build (scheme OpenBurnBar)
    # Routing (cost + security): post-merge main is trusted, but this lane still
    # uses the isolated hosted macOS pools so MACOS_GATE_POOL / CI_POOL policy
    # stays unchanged. Set repo var MACOS_GATE_POOL=paid to force the capped
    # hosted pool for a billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    # Build-only (no XCTest host launch), so far lighter than the 90-min
    # app-build-test lane; the cap still covers a cold SPM cache + libsignal FFI
    # build on a hosted runner.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache macOS Signal FFI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .derived-data
          key: ${{ runner.os }}-headless-app-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-headless-app-spm-
            ${{ runner.os }}-app-spm-
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Build the AgentLens app headless (scheme OpenBurnBar, build-only)
        # scripts/ci/headless-app-build.sh runs `xcodebuild build -scheme
        # OpenBurnBar` for platform=macOS with code signing off. On a fresh CI
        # runner it builds in-tree (checkout is outside ~/Documents, so no
        # sandbox/TCC hit). FIREBASE_SOURCE_FIRESTORE=1 is forced inside the
        # script (iOS 27 gRPC/Firestore source-build guard on the resolve path).
        run: >-
          SIGNAL_FFI_BUILD_TARGETS=aarch64-apple-darwin
          ./scripts/ci/headless-app-build.sh
