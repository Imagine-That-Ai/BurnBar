name: Ops Confidence

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          # Availability is fatal; missing AGPL sourceMetadata warns until the
          # metadata-serving functions deploy reaches prod (see nightly-e2e).
          HEALTH_GATE_REQUIRE_SOURCE_METADATA: "0"
        run: bash scripts/ci/post-deploy-health-gate.sh

      - name: Check out pinned hermes-agent for provenance verification
        # verify-ops-readiness.sh runs verify-vendored-agent-source.sh, which
        # needs a hermes-agent checkout containing the manifest's pinnedCommit.
        # Without this clone the weekly gate failed at "not a checkout" on
        # every run it ever had (diligence 2026-06-11 LB-4). The clone is
        # manifest-driven so a pin bump never desynchronizes this workflow.
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import json;print(json.load(open("third_party/hermes-agent/manifest.json"))["pinnedCommit"])')"
          git clone --filter=blob:none https://github.com/Ajnunezg/hermes-agent .ci/hermes-agent
          git -C .ci/hermes-agent fetch origin "$pin"
          git -C .ci/hermes-agent checkout --detach "$pin"

      - name: Ops readiness verifiers (offline)
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.ci/hermes-agent
        run: bash scripts/ci/verify-ops-readiness.sh

  website-zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: OWASP ZAP baseline (burnbar.ai)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://burnbar.ai"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a -j"
          fail_action: true
          artifact_name: "zap-ops-confidence-report"

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, website-zap-baseline]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Open ops-confidence failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = `Ops confidence launch gate failed (${context.runId})`;
            const results = ${{ toJSON(needs) }};
            const body = [
              'The weekly OpenBurnBar ops-confidence gate failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Job results:',
              '```json',
              JSON.stringify(results, null, 2),
              '```'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'P0 - Critical,area: infra',
              per_page: 20,
            });
            if (!existing.data.some((issue) => issue.title.startsWith('Ops confidence launch gate failed'))) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['P0 - Critical', 'area: infra'],
              });
            }

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, website-zap-baseline]
    # Close-on-green: the failure-issue job dedupes on an open issue with the
    # same title prefix, so a STALE open issue would silently suppress alerts
    # for future, distinct failures (diligence 2026-06-11). A fully green run
    # closes the standing issue and re-arms the alarm.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - name: Close resolved failure issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const prefix = 'Ops confidence launch gate failed';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'P0 - Critical,area: infra',
              per_page: 50,
            });
            for (const issue of open.data) {
              if (!issue.title.startsWith(prefix)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by green run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
