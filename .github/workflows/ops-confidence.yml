name: Ops Confidence

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
        run: bash scripts/ci/post-deploy-health-gate.sh

      - name: Ops readiness verifiers (offline)
        run: bash scripts/ci/verify-ops-readiness.sh

  website-zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OWASP ZAP baseline (burnbar.ai)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://burnbar.ai"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a -j"
          fail_action: true
          artifact_name: "zap-ops-confidence-report"

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, website-zap-baseline]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Open ops-confidence failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = `Ops confidence launch gate failed (${context.runId})`;
            const results = ${{ toJSON(needs) }};
            const body = [
              'The weekly OpenBurnBar ops-confidence gate failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Job results:',
              '```json',
              JSON.stringify(results, null, 2),
              '```'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'P0 - Critical,area: infra',
              per_page: 20,
            });
            if (!existing.data.some((issue) => issue.title.startsWith('Ops confidence launch gate failed'))) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['P0 - Critical', 'area: infra'],
              });
            }
