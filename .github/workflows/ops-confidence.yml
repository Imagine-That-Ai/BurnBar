name: Ops Confidence

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          # Availability is fatal; missing AGPL sourceMetadata warns until the
          # metadata-serving functions deploy reaches prod (see nightly-e2e).
          # GATED ON A1/P-OPS-1: flip to "1" only after Alberto's real
          # production functions deploy (deploy-production.yml dry_run=false)
          # lands and healthReady serves the sourceMetadata fields. Until then
          # the synthetic lane would be permanently red for a compliance gap,
          # masking real availability failures.
          HEALTH_GATE_REQUIRE_SOURCE_METADATA: "0"
        run: bash scripts/ci/post-deploy-health-gate.sh

      - name: Check out pinned hermes-agent for provenance verification
        # verify-ops-readiness.sh runs verify-vendored-agent-source.sh, which
        # needs a hermes-agent checkout containing the manifest's pinnedCommit.
        # Without this clone the weekly gate failed at "not a checkout" on
        # every run it ever had (diligence 2026-06-11 LB-4). The clone is
        # manifest-driven so a pin bump never desynchronizes this workflow.
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import json;print(json.load(open("third_party/hermes-agent/manifest.json"))["pinnedCommit"])')"
          git clone --filter=blob:none https://github.com/Ajnunezg/hermes-agent .ci/hermes-agent
          git -C .ci/hermes-agent fetch origin "$pin"
          git -C .ci/hermes-agent checkout --detach "$pin"

      - name: Ops readiness verifiers (offline)
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.ci/hermes-agent
        run: bash scripts/ci/verify-ops-readiness.sh

  website-zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: OWASP ZAP baseline (burnbar.ai)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://burnbar.ai"
          rules_file_name: ".github/zap-rules.tsv"
          # ZAP exit 1 (FAIL) remains blocking; -I makes warning-only scans exit 0.
          cmd_options: "-a -j -I"
          fail_action: true
          artifact_name: "zap-ops-confidence-report"

  deploy-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # W0-5: viewer-identity drift check. No `environment:` — this job authenticates
    # as the read-only ops-verifier WIF (governance/ops-plane-verifier-sa.json),
    # not as a production deploy identity, so it must not enter the protected
    # environment. It fails CLOSED when the federation vars are absent (red by
    # design until human queue items 7-9 provision them).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Fail closed when the ops-verifier WIF is not provisioned
        env:
          OPS_VERIFY_WIF_PROVIDER: ${{ vars.OPS_VERIFY_WIF_PROVIDER }}
          OPS_VERIFY_SERVICE_ACCOUNT: ${{ vars.OPS_VERIFY_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "${OPS_VERIFY_WIF_PROVIDER}" || -z "${OPS_VERIFY_SERVICE_ACCOUNT}" ]]; then
            echo "::error::wif-not-provisioned — OPS_VERIFY_WIF_PROVIDER / OPS_VERIFY_SERVICE_ACCOUNT repo variables are not set. The deploy-freshness lane cannot verify live state without the viewer-identity federation. Provision per governance/ops-plane-verifier-sa.json (human queue items 7-9). Failing closed instead of skipping."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Authenticate to Google Cloud (ops-verifier, viewer-only WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ vars.OPS_VERIFY_WIF_PROVIDER }}
          service_account: ${{ vars.OPS_VERIFY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Deploy freshness check
        # Reads live Cloud Functions (v2 API) + Cloud Run updateTime and fails
        # if ANY required deploy surface exceeds 14 days
        # (DEPLOY_FRESHNESS_MAX_AGE_DAYS env override). Each surface is checked
        # independently so a fresh Cloud Run cannot mask a frozen Functions
        # plane. This is the monitor that would have caught the 6/18 26-day
        # silent freeze (diligence 2026-07-14 Ops finding).
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
        run: node scripts/ci/check-deploy-freshness.mjs

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, website-zap-baseline]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record ops-confidence failure (per-lane dedupe; comment, never silent-skip)
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: ops-confidence
          title-prefix: Ops confidence launch gate failed
          summary: The weekly OpenBurnBar ops-confidence gate failed.
          details: |
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

  deploy-freshness-open:
    runs-on: ubuntu-latest
    needs: [deploy-freshness]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record deploy-freshness failure
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-freshness
          title-prefix: Deploy freshness gate failed
          summary: Production deploy freshness check failed — a deploy surface exceeds the 14-day threshold.
          details: |
            This is the 6/18 freeze signature: a merged fix sitting undeployed.
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, website-zap-baseline]
    # Close-on-green re-arms the alarm: the shared action dedupes on a per-lane
    # `lane:ops-confidence` label (not a title prefix shared across workflows),
    # so a STALE open issue from another lane can never suppress this lane.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved ops-confidence failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: ops-confidence
          title-prefix: Ops confidence launch gate failed

  deploy-freshness-close:
    runs-on: ubuntu-latest
    needs: [deploy-freshness]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved deploy-freshness failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-freshness
          title-prefix: Deploy freshness gate failed