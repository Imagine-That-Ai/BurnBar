name: Deploy Production (Cloud Functions)

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (v*). Defaults to ref when dispatching from a tag."
        required: false
        type: string
      dry_run:
        description: "Build + verifiers + health gate only (no firebase deploy)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          # The release preflight's provenance gate requires corresponding-source
          # files inside Vendor/libsignal (a submodule). Without this, every tag
          # deploy fails on "Vendor/libsignal/LICENSE missing" — the wedge that
          # blocked v1.0.2 (diligence 2026-06-11 NB-2 / C8). release.yml and
          # license-posture.yml init the same submodule recursively; this keeps
          # all provenance lanes consistent.
          submodules: recursive

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Deploy only from v* tags"
            exit 1
          fi
          git checkout "$TAG"
          # C8: checkout-time `submodules: recursive` initializes submodules at
          # the dispatch ref's gitlink. After `git checkout "$TAG"` the gitlink
          # points at the tag's pinned SHA, but the working tree still holds the
          # dispatch ref's submodule contents — so the provenance preflight reads
          # Vendor/libsignal at the wrong commit (or empty). Re-sync the working
          # tree to the tag's gitlink so the manifest's Vendor/libsignal files
          # resolve to the released commit.
          git submodule update --init --recursive
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and build Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
          bash scripts/ci/verify-callable-logging.sh
          bash scripts/ci/verify-resilience-wiring.sh

      - name: BurnBar product release preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py

      - name: Authenticate to Google Cloud (service account)
        if: steps.tag.outputs.dry_run != 'true' && env.HAS_GCP_SA_KEY == 'true'
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (legacy Play service account)
        if: steps.tag.outputs.dry_run != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == 'true'
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Sentry release (Functions)
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_FUNCTIONS: openburnbar-functions
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          curl -sL https://sentry.io/get-cli/ | bash
          RELEASE_NAME="openburnbar-functions@${TAG}"
          sentry-cli releases new --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases set-commits --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" --auto || true
          sentry-cli releases finalize --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases deploys "$RELEASE_NAME" new \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_FUNCTIONS" \
            --env production \
            --name "${TAG}-$(date -u +%Y%m%dT%H%M%SZ)" || true
          echo "Sentry release ${RELEASE_NAME} created."

      - name: Deploy Cloud Functions
        if: steps.tag.outputs.dry_run != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}
          OPENBURNBAR_SOURCE_COMMIT: ${{ github.sha }}
          OPENBURNBAR_CORRESPONDING_SOURCE_URL: https://burnbar.ai/legal/source
          # H13: Sentry ingest DSN for the functions project. DSNs are
          # low-sensitivity (write-only ingest endpoints, not credentials), but
          # are not public product IDs, so the value lives in an Actions secret
          # rather than the committed .env.burnbar.production. SENTRY_ENVIRONMENT
          # is the committed static "production" value from the prod config.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_FUNCTIONS }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ENV_FILE="functions/.env.burnbar"
          PROD_CONFIG="functions/.env.burnbar.production"

          # H14: production runtime config is the committed, reviewed
          # functions/.env.burnbar.production (non-secret public IDs/URLs).
          # Both this deploy lane and scripts/rollback.sh source the SAME file,
          # so a deploy and a rollback can never disagree or ship empty config.
          if [[ ! -f "$PROD_CONFIG" ]]; then
            echo "::error::Missing $PROD_CONFIG — refusing to deploy with empty runtime config."
            exit 1
          fi

          # H13: Sentry must be provisioned for production functions, or the
          # crash-reporting surface ships dark. Fail closed at deploy time (not
          # just at the post-deploy health gate) so a missing/cleared DSN secret
          # is caught before traffic shifts.
          if [[ -z "${SENTRY_DSN:-}" ]]; then
            echo "::error::Missing SENTRY_DSN — refusing to deploy production functions with crash reporting disabled. Set the SENTRY_DSN_FUNCTIONS Actions secret (production environment)."
            exit 1
          fi

          # Per-deploy dynamic values are not committed; append them on top of
          # the reviewed static config. SENTRY_DSN is an Actions secret (not
          # committed). SENTRY_ENVIRONMENT is provisioned through the same env
          # writer so functions/src/sentry.ts tags production events correctly.
          {
            cat "$PROD_CONFIG"
            echo ""
            echo "FUNCTION_VERSION=${TAG}"
            echo "OPENBURNBAR_SOURCE_COMMIT=${OPENBURNBAR_SOURCE_COMMIT}"
            echo "SENTRY_DSN=${SENTRY_DSN}"
            echo "SENTRY_ENVIRONMENT=production"
          } > "$ENV_FILE"
          export FUNCTION_VERSION="$TAG"

          firebase_args=(--only functions --project burnbar --non-interactive --force)
          if [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "Using legacy FIREBASE_TOKEN authentication. Prefer GCP_SA_KEY or workload credentials."
            firebase_args+=(--token "$FIREBASE_TOKEN")
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "Using Google application credentials from google-github-actions/auth."
          else
            echo "::error::No Firebase deploy auth configured. Set GCP_SA_KEY (preferred), GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, or legacy FIREBASE_TOKEN."
            exit 1
          fi

          npx firebase-tools deploy "${firebase_args[@]}"

      - name: Dry-run skip deploy
        if: steps.tag.outputs.dry_run == 'true'
        run: echo "dry_run=true — skipping firebase deploy"

      - name: Post-deploy health gate
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          DEPLOY_HEALTH_JSON: deploy-health.json
          DEPLOY_TAG: ${{ steps.tag.outputs.tag }}
          # H13: on a real production deploy (not a dry run), the runtime config
          # the deploy step wrote MUST enable Sentry, or crash reporting ships
          # dark. The gate fails closed when this is 1; dry runs leave it 0 so
          # the no-deploy lane is not permanently red.
          HEALTH_GATE_REQUIRE_SENTRY: ${{ steps.tag.outputs.dry_run == 'true' && '0' || '1' }}
          FUNCTIONS_RUNTIME_ENV_FILE: functions/.env.burnbar
        run: |
          # shellcheck source=scripts/ops/resolve-functions-base-url.sh
          source scripts/ops/resolve-functions-base-url.sh
          bash scripts/ci/post-deploy-health-gate.sh

      - name: Upload deploy health artifact
        if: always() && hashFiles('deploy-health.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-health-${{ steps.tag.outputs.tag }}
          path: deploy-health.json
          if-no-files-found: ignore

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Functions deploy"
            echo "- Tag: ${{ steps.tag.outputs.tag }}"
            echo "- Dry run: ${{ steps.tag.outputs.dry_run }}"
            echo "- FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}"
            echo "- Project: burnbar"
            echo "- Health: scripts/ci/post-deploy-health-gate.sh"
            echo ""
            echo "### On failure — rollback"
            echo "- FAST (sub-minute, preferred): pin traffic to a previous-good Cloud Run revision, no rebuild:"
            echo "  \`./scripts/ops/rollback-revision.sh <cloud-run-service> --yes\`"
            echo "- SLOW (tens of minutes, fallback): full source rollback (rebuild + redeploy):"
            echo "  \`./scripts/rollback.sh --yes\`"
          } >> "$GITHUB_STEP_SUMMARY"
