name: Deploy Production (Cloud Functions)

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (v*). Defaults to ref when dispatching from a tag."
        required: false
        type: string
      dry_run:
        description: "Build + verifiers + health gate only (no firebase deploy)"
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: "Full SHA of the release candidate on origin/main (dry_run only)"
        required: false
        type: string
      domain_core_profile:
        description: "Signed Functions domain-core profile"
        required: true
        type: choice
        default: public-production
        options:
          - public-production
          - public-production-rollback

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize-domain-core-rollback:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && inputs.domain_core_profile == 'public-production-rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: domain-core-promotion
    permissions:
      contents: read
    steps:
      - name: Record explicit protected rollback authorization
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "${{ inputs.domain_core_profile }}" == "public-production-rollback" ]]
          echo "Protected reviewers authorized the candidate-bound Functions rollback profile."

  deploy-functions:
    needs: authorize-domain-core-rollback
    if: >-
      ${{ always()
          && !cancelled()
          && (github.event_name == 'push'
              || inputs.domain_core_profile == 'public-production'
              || needs.authorize-domain-core-rollback.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
      statuses: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
      stable_release: ${{ steps.tag.outputs.stable_release }}
      domain_core_profile: ${{ steps.tag.outputs.domain_core_profile }}
      core_version: ${{ steps.domain-core-profile.outputs.core_version }}
      abi_version: ${{ steps.domain-core-profile.outputs.abi_version }}
      source_sha256: ${{ steps.domain-core-profile.outputs.source_sha256 }}
      pricing_mode: ${{ steps.domain-core-profile.outputs.pricing_mode }}
      profile_sha256: ${{ steps.domain-core-build.outputs.profile_sha256 }}
      receipt_sha256: ${{ steps.domain-core-build.outputs.receipt_sha256 }}
      runtime_manifest_sha256: ${{ steps.domain-core-build.outputs.runtime_manifest_sha256 }}
      wasm_sha256: ${{ steps.domain-core-build.outputs.wasm_sha256 }}
      source_run_id: ${{ steps.domain-core-source.outputs.run_id }}
      source_run_attempt: ${{ steps.domain-core-source.outputs.run_attempt }}
      signer_run_id: ${{ steps.domain-core-gate.outputs.signer_run_id }}
      signer_run_attempt: ${{ steps.domain-core-gate.outputs.signer_run_attempt }}
      proof_artifact: ${{ steps.domain-core-proof.outputs.artifact_name }}
      reused_existing_evidence: ${{ steps.stable-replay.outputs.reused }}
    env:
      HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      # WIF-only: long-lived service account keys and token fallbacks are
      # removed (codex-gpt-5 FINDING-007). The google-github-actions/auth step
      # below uses OIDC workload identity federation; no JSON keys are accepted.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          # The release preflight's provenance gate requires corresponding-source
          # files inside Vendor/libsignal (a submodule). Without this, every tag
          # deploy fails on "Vendor/libsignal/LICENSE missing" — the wedge that
          # blocked v1.0.2 (diligence 2026-06-11 NB-2 / C8). release.yml and
          # license-posture.yml init the same submodule recursively; this keeps
          # all provenance lanes consistent.
          submodules: recursive

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_DOMAIN_CORE_PROFILE: ${{ inputs.domain_core_profile }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          IS_DRY_RUN="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]]; then
            IS_DRY_RUN="true"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            DOMAIN_CORE_PROFILE="public-production"
          else
            DOMAIN_CORE_PROFILE="${INPUT_DOMAIN_CORE_PROFILE:-public-production}"
          fi
          if [[ "$DOMAIN_CORE_PROFILE" != "public-production" && "$DOMAIN_CORE_PROFILE" != "public-production-rollback" ]]; then
            echo "::error::Unknown signed Functions domain-core profile: $DOMAIN_CORE_PROFILE"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$DOMAIN_CORE_PROFILE" == "public-production-rollback" ]]; then
            echo "::error::The rollback profile is manual-only and requires protected authorization."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Deploy only from SemVer v* release tags"
            exit 1
          fi

          # Dry-runs prove the exact current main commit before its future tag
          # exists. Real deploys remain bound to the immutable tag event.
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            if [[ -z "$INPUT_CANDIDATE_SHA" ]]; then
              echo "::error::Dry-run dispatch requires candidate_sha (full SHA on origin/main)."
              exit 1
            fi
            if ! [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::candidate_sha must be a full 40-char hex SHA, got: $INPUT_CANDIDATE_SHA"
              exit 1
            fi
            tag_ref="refs/tags/${TAG}"
            if [[ "$GITHUB_REF" == "$tag_ref" ]]; then
              echo "::error::Dry-run must not run from a tag ref ($tag_ref). Dispatch from a non-tag branch or SHA ref."
              exit 1
            fi

            git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
            git fetch --force --tags origin
            if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Future tag ${TAG} already exists. Dry-run validates a candidate BEFORE the tag is created."
              exit 1
            fi
            if ! git cat-file -e "$INPUT_CANDIDATE_SHA^{commit}" 2>/dev/null; then
              git fetch --force origin "$INPUT_CANDIDATE_SHA"
            fi
            if ! git cat-file -e "$INPUT_CANDIDATE_SHA^{commit}" 2>/dev/null; then
              echo "::error::candidate_sha $INPUT_CANDIDATE_SHA does not resolve to a commit."
              exit 1
            fi
            main_sha="$(git rev-parse origin/main)"
            if [[ "$INPUT_CANDIDATE_SHA" != "$main_sha" ]]; then
              echo "::error::candidate_sha $INPUT_CANDIDATE_SHA != origin/main $main_sha."
              echo "::error::Dry-run must prove the exact commit that will be tagged is current main."
              exit 1
            fi
            commit="$INPUT_CANDIDATE_SHA"
          else
            tag_ref="refs/tags/${TAG}"
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "${GITHUB_REF}" != "$tag_ref" ]]; then
              echo "::error::Manual production deploy for ${TAG} must run from ${tag_ref}, not ${GITHUB_REF}."
              echo "::error::Select the release tag as the workflow dispatch ref so production credentials stay tag-bound."
              exit 1
            fi

            git fetch --force --tags origin "+${tag_ref}:${tag_ref}"
            git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
            if ! commit="$(git rev-list -n 1 "${tag_ref}^{commit}")"; then
              echo "::error::Tag does not exist in repository: $TAG"
              exit 1
            fi
            if [[ -z "$commit" ]]; then
              echo "::error::Unable to resolve ${tag_ref} to a commit."
              exit 1
            fi
            if [[ -n "${GITHUB_SHA:-}" && "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag moved away from the workflow event commit."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::Release tag ${TAG} points at ${commit}, which is not reachable from origin/main."
              exit 1
            fi
          fi

          git checkout --detach "$commit"
          [[ "$(git rev-parse HEAD)" == "$commit" ]] \
            || { echo "::error::Detached checkout does not match the immutable release commit."; exit 1; }
          # C8: checkout-time `submodules: recursive` initializes submodules at
          # the dispatch ref's gitlink. After checking out the resolved release
          # commit, the gitlink points at the tag's pinned SHA, but the working
          # tree still holds the dispatch ref's submodule contents — so the
          # provenance preflight reads Vendor/libsignal at the wrong commit (or
          # empty). Re-sync the working tree to the tag's gitlink so the
          # manifest's Vendor/libsignal files resolve to the released commit.
          git submodule update --init --recursive
          {
            echo "tag=$TAG"
            echo "commit=$commit"
            echo "dry_run=$IS_DRY_RUN"
            echo "stable_release=$([[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]] && echo true || echo false)"
            echo "domain_core_profile=$DOMAIN_CORE_PROFILE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Resolve protected candidate C and activation P
        id: activation
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: node scripts/ci/resolve-domain-core-activation.mjs --release-commit "$RELEASE_COMMIT" --format github-output >> "$GITHUB_OUTPUT"

      - name: Resolve exact signed Functions profile
        id: domain-core-profile
        env:
          DOMAIN_CORE_PROFILE: ${{ steps.tag.outputs.domain_core_profile }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          CANDIDATE_COMMIT: ${{ steps.activation.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/domain-core-functions-profile.json"
          node scripts/ci/resolve-domain-core-build-profile.mjs \
            --profile "$DOMAIN_CORE_PROFILE" \
            --expected-candidate-commit "$CANDIDATE_COMMIT" \
            --expected-release-commit "$RELEASE_COMMIT" \
            --format json \
            --output "$profile"
          node scripts/ci/resolve-domain-core-build-profile.mjs \
            --profile "$DOMAIN_CORE_PROFILE" \
            --expected-candidate-commit "$CANDIDATE_COMMIT" \
            --expected-release-commit "$RELEASE_COMMIT" \
            --format github-env \
            --output "$RUNNER_TEMP/domain-core-functions.env"
          node - "$profile" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const [profilePath, outputPath] = process.argv.slice(2);
          const bytes = fs.readFileSync(profilePath);
          const profile = JSON.parse(bytes);
          const candidate = profile.candidateIdentity;
          if (!candidate || profile.artifactAuthority !== "signed" || profile.distribution !== "public") {
            throw new Error("Functions production profile is not signed, public, and candidate-bound");
          }
          fs.appendFileSync(outputPath, [
            `profile_path=${profilePath}`,
            `profile_sha256=${crypto.createHash("sha256").update(bytes).digest("hex")}`,
            `candidate_commit=${candidate.candidateCommit}`,
            `core_version=${candidate.coreVersion}`,
            `abi_version=${candidate.abiVersion}`,
            `source_sha256=${candidate.sourceSha256}`,
            `pricing_mode=${profile.modes.pricing}`,
          ].join("\n") + "\n");
          NODE

      - name: Locate exact deterministic candidate source run
        id: domain-core-source
        env:
          CANDIDATE_COMMIT: ${{ steps.domain-core-profile.outputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/domain-core-source-run-pages.json"
          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/domain-core.yml/runs?event=push&status=completed&head_sha=$CANDIDATE_COMMIT&per_page=100" \
            > "$pages"
          run_json="$RUNNER_TEMP/domain-core-source-run.json"
          jq -e --arg sha "$CANDIDATE_COMMIT" '
            if length == 0 then error("source workflow API returned no pages") else . end
            | if .[0].total_count != ([.[].workflow_runs[]] | unique_by(.id) | length)
              then error("source workflow pagination is incomplete")
              else [.[].workflow_runs[]]
              end
            | map(select(
                .path == ".github/workflows/domain-core.yml"
                and .event == "push"
                and .head_branch == "main"
                and .head_sha == $sha
                and .status == "completed"
                and .conclusion == "success"
              ))
            | unique_by(.id)
            | if length == 1 then .[0] else error("expected exactly one successful deterministic main push run") end
          ' "$pages" > "$run_json"
          run_id="$(jq -er '.id' "$run_json")"
          run_attempt="$(jq -er '.run_attempt' "$run_json")"
          printf 'run_id=%s\nrun_attempt=%s\n' "$run_id" "$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download exact unsigned candidate bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.domain-core-source.outputs.run_id }}
          name: domain-core-candidate-bundle-${{ steps.domain-core-profile.outputs.candidate_commit }}-${{ steps.domain-core-source.outputs.run_id }}-${{ steps.domain-core-source.outputs.run_attempt }}
          path: ${{ runner.temp }}/domain-core-release-materials/candidate

      - name: Download exact candidate rollback artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.domain-core-source.outputs.run_id }}
          name: domain-core-public-production-rollback-${{ steps.domain-core-profile.outputs.candidate_commit }}-${{ steps.domain-core-source.outputs.run_id }}-${{ steps.domain-core-source.outputs.run_attempt }}
          path: ${{ runner.temp }}/domain-core-release-materials/rollback

      - name: Verify protected promotion and exact rollback before build
        id: domain-core-gate
        env:
          CANDIDATE_COMMIT: ${{ steps.domain-core-profile.outputs.candidate_commit }}
          CORE_VERSION: ${{ steps.domain-core-profile.outputs.core_version }}
          ABI_VERSION: ${{ steps.domain-core-profile.outputs.abi_version }}
          SOURCE_SHA256: ${{ steps.domain-core-profile.outputs.source_sha256 }}
          SOURCE_RUN_ID: ${{ steps.domain-core-source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.domain-core-source.outputs.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          materials="$RUNNER_TEMP/domain-core-release-materials"
          candidate="$materials/candidate/domain-core-candidate-bundle.json"
          rollback="$materials/rollback/domain-core-public-production-rollback.json"
          test -s "$candidate"
          test -s "$rollback"

          mkdir -p "$materials/promotion"
          pushd "$materials/promotion" >/dev/null
          gh attestation download "$candidate" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --limit 100
          mapfile -t attestation_files < <(find . -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
          if [[ "${#attestation_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one digest-addressed protected attestation download, found ${#attestation_files[@]}."
            exit 1
          fi
          mv "${attestation_files[0]}" domain-core-promotion.sigstore.jsonl
          popd >/dev/null
          promotion="$materials/promotion/domain-core-promotion.sigstore.jsonl"

          verified_attestations="$RUNNER_TEMP/domain-core-protected-attestations.json"
          gh attestation verify "$candidate" \
            --bundle "$promotion" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/domain-core-promotion-proof.yml" \
            --source-ref refs/heads/main \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json \
            > "$verified_attestations"
          signer_runs="$RUNNER_TEMP/domain-core-signer-runs.json"
          node - "$verified_attestations" "$signer_runs" <<'NODE'
          const fs = require("node:fs");
          const [verifiedPath, outputPath] = process.argv.slice(2);
          const verified = JSON.parse(fs.readFileSync(verifiedPath));
          const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/`;
          const runs = new Map();
          for (const entry of Array.isArray(verified) ? verified : []) {
            const uri = entry?.verificationResult?.signature?.certificate?.runInvocationURI;
            if (typeof uri !== "string" || !uri.startsWith(prefix)) continue;
            const match = uri.slice(prefix.length).match(/^([1-9][0-9]*)\/attempts\/([1-9][0-9]*)$/);
            if (!match) continue;
            runs.set(`${match[1]}:${match[2]}`, { id: Number(match[1]), run_attempt: Number(match[2]) });
          }
          const result = [...runs.values()].sort((left, right) => right.id - left.id);
          if (result.length === 0) throw new Error("protected attestation contains no exact signer run invocation");
          fs.writeFileSync(outputPath, `${JSON.stringify(result, null, 2)}\n`);
          NODE

          rollback_sha256="$(sha256sum "$rollback" | awk '{print $1}')"
          selected_run=""
          selected_attempt=""
          : > "$RUNNER_TEMP/domain-core-release-gate-attempts.log"
          while IFS=$'\t' read -r run_id run_attempt; do
            signer_run="$RUNNER_TEMP/domain-core-signer-run-$run_id.json"
            if ! gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$signer_run"; then
              continue
            fi
            if ! jq -e --argjson attempt "$run_attempt" '
              .path == ".github/workflows/domain-core-promotion-proof.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $attempt
            ' "$signer_run" >/dev/null; then
              continue
            fi
            attempt_gate="$RUNNER_TEMP/domain-core-release-gate-$run_id-$run_attempt.json"
            if node scripts/ci/verify-domain-core-release-gate.mjs \
              --candidate-bundle "$candidate" \
              --promotion-attestation "$promotion" \
              --rollback-artifact "$rollback" \
              --candidate-commit "$CANDIDATE_COMMIT" \
              --release-commit "${{ steps.tag.outputs.commit }}" \
              --core-version "$CORE_VERSION" \
              --abi-version "$ABI_VERSION" \
              --source-sha256 "$SOURCE_SHA256" \
              --source-run-id "$SOURCE_RUN_ID" \
              --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
              --protected-signer-run-id "$run_id" \
              --protected-signer-run-attempt "$run_attempt" \
              --rollback-sha256 "$rollback_sha256" \
              --output "$attempt_gate" \
              >> "$RUNNER_TEMP/domain-core-release-gate-attempts.log" 2>&1; then
              selected_run="$run_id"
              selected_attempt="$run_attempt"
              cp "$attempt_gate" "$materials/domain-core-release-gate.json"
              break
            fi
          done < <(jq -r '.[] | [.id, .run_attempt] | @tsv' "$signer_runs")
          if [[ -z "$selected_run" || -z "$selected_attempt" ]]; then
            cat "$RUNNER_TEMP/domain-core-release-gate-attempts.log"
            echo "::error::No successful protected signer run attests the exact candidate bundle and run attempt."
            exit 1
          fi
          gate_sha256="$(sha256sum "$materials/domain-core-release-gate.json" | awk '{print $1}')"
          {
            echo "signer_run_id=$selected_run"
            echo "signer_run_attempt=$selected_attempt"
            echo "rollback_sha256=$rollback_sha256"
            echo "gate_sha256=$gate_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Install and build selected Functions artifact
        id: domain-core-build
        run: |
          set -euo pipefail
          npm ci --prefix functions
          npm run build --prefix functions
          node scripts/ci/resolve-domain-core-build-profile.mjs \
            --profile "${{ steps.tag.outputs.domain_core_profile }}" \
            --expected-candidate-commit "${{ steps.domain-core-profile.outputs.candidate_commit }}" \
            --expected-release-commit "${{ steps.tag.outputs.commit }}" \
            --format functions-js \
            --output functions/lib/generated/domainCoreCandidateReceipt.js
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs \
            --profile "${{ steps.tag.outputs.domain_core_profile }}" \
            --expected-candidate-commit "${{ steps.domain-core-profile.outputs.candidate_commit }}" \
            --functions-dir functions/lib
          node scripts/ci/verify-domain-core-functions-target-inventory.mjs \
            --inventory config/domain-core-functions-relevant-targets.json
          node scripts/ci/create-domain-core-runtime-artifact-manifest.mjs \
            --consumer functions \
            --root functions \
            --profile-receipt "${{ steps.domain-core-profile.outputs.profile_path }}" \
            --output functions/lib/domain-core-runtime-artifact-manifest.json
          receipt_sha256="$(sha256sum functions/lib/generated/domainCoreCandidateReceipt.js | awk '{print $1}')"
          runtime_manifest_sha256="$(sha256sum functions/lib/domain-core-runtime-artifact-manifest.json | awk '{print $1}')"
          wasm_sha256="$(jq -er '.files[] | select(.path == "vendor/openburnbar/domain-core-wasm/openburnbar_domain_core_bg.wasm") | .sha256' functions/lib/domain-core-runtime-artifact-manifest.json)"
          {
            echo "profile_sha256=${{ steps.domain-core-profile.outputs.profile_sha256 }}"
            echo "receipt_sha256=$receipt_sha256"
            echo "runtime_manifest_sha256=$runtime_manifest_sha256"
            echo "wasm_sha256=$wasm_sha256"
          } >> "$GITHUB_OUTPUT"
          bash scripts/ci/verify-callable-logging.sh
          bash scripts/ci/verify-resilience-wiring.sh
          node scripts/ci/check-callable-validation.mjs
          bash scripts/ci/verify-production-deploy-auth.sh
          node scripts/ci/write-firebase-hosting-ci-config.mjs \
            --mode functions \
            --output "$RUNNER_TEMP/firebase-functions.ci.json" \
            --check
          bash scripts/ci/prepare-firebase-tools.sh

      - name: Create immutable Functions deploy proof
        id: domain-core-proof
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          materials="$RUNNER_TEMP/domain-core-release-materials"
          stage="$RUNNER_TEMP/domain-core-functions-deploy-proof"
          mkdir -p "$stage"
          cp -a functions/lib "$stage/functions-lib"
          node scripts/ci/create-domain-core-functions-deploy-proof.mjs \
            --profile "${{ steps.domain-core-profile.outputs.profile_path }}" \
            --compiled-receipt functions/lib/generated/domainCoreCandidateReceipt.js \
            --runtime-manifest functions/lib/domain-core-runtime-artifact-manifest.json \
            --release-gate "$materials/domain-core-release-gate.json" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --deploy-run-id "$GITHUB_RUN_ID" \
            --deploy-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$stage/domain-core-functions-deploy-proof.json"
          install -m 0600 "${{ steps.domain-core-profile.outputs.profile_path }}" "$stage/domain-core-functions-profile.json"
          install -m 0600 functions/lib/generated/domainCoreCandidateReceipt.js "$stage/domainCoreCandidateReceipt.js"
          install -m 0600 functions/lib/domain-core-runtime-artifact-manifest.json "$stage/domain-core-runtime-artifact-manifest.json"
          install -m 0600 "$materials/domain-core-release-gate.json" "$stage/domain-core-release-gate.json"
          install -m 0600 "$materials/candidate/domain-core-candidate-bundle.json" "$stage/domain-core-candidate-bundle.json"
          install -m 0600 "$materials/promotion/domain-core-promotion.sigstore.jsonl" "$stage/domain-core-promotion.sigstore.jsonl"
          install -m 0600 "$materials/rollback/domain-core-public-production-rollback.json" "$stage/domain-core-public-production-rollback.json"
          artifact_name="domain-core-functions-deploy-proof-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned Sentry CLI
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        run: npm install --global @sentry/cli@2.42.2

      - name: BurnBar source provenance preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py --source-provenance-only

      - name: BurnBar product release preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py

      - name: Verify dry-run attestations
        if: steps.tag.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_SHA: ${{ steps.tag.outputs.commit }}
          ATTEST_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/ci/release-dry-run-attestation.mjs verify --sha "$ATTEST_SHA" --tag "$ATTEST_TAG"

      - name: Authenticate to Google Cloud (WIF/OIDC only)
        if: steps.tag.outputs.dry_run != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud for immutable provider readback
        if: steps.tag.outputs.dry_run != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Refuse non-identical stable-tag redeploy
        if: ${{ steps.tag.outputs.dry_run != 'true' && steps.tag.outputs.domain_core_profile == 'public-production' }}
        id: stable-replay
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="OpenBurnBar-${version}-functions-deployment.json"
          bundle_asset="OpenBurnBar-${version}-functions-pricing.sigstore.json"
          release_json="$RUNNER_TEMP/existing-release.json"
          if ! gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json" 2>"$RUNNER_TEMP/existing-release.err"; then
            if grep -q "HTTP 404" "$RUNNER_TEMP/existing-release.err"; then
              echo "reused=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/existing-release.err" >&2
            exit 1
          fi
          if ! jq -e --arg asset "$asset" '.assets | any(.name == $asset)' "$release_json" >/dev/null; then
            current_commit="$(curl --fail --silent --show-error \
              "https://us-central1-burnbar.cloudfunctions.net/healthReady" \
              | jq -er '.source.commit')"
            if [[ "$current_commit" == "$RELEASE_COMMIT" ]]; then
              echo "::error::The release commit is already live but its immutable Functions deployment receipt is missing. Refusing an unverifiable same-tag redeploy."
              exit 1
            fi
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/existing-functions-evidence"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --pattern "$bundle_asset" \
            --dir "$RUNNER_TEMP/existing-functions-evidence"
          gh attestation verify \
            "$RUNNER_TEMP/existing-functions-evidence/$asset" \
            --bundle "$RUNNER_TEMP/existing-functions-evidence/$bundle_asset" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/domain-core-functions-release-evidence.yml" \
            --source-digest "$RELEASE_COMMIT" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --signer-digest "$RELEASE_COMMIT" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners \
            --predicate-type "https://openburnbar.dev/attestations/domain-core-release-artifact/v2" \
            --format json \
            | jq -e 'type == "array" and length > 0' >/dev/null
          curl --fail --silent --show-error \
            "https://us-central1-burnbar.cloudfunctions.net/healthLive" \
            > "$RUNNER_TEMP/existing-health-live.json"
          curl --fail --silent --show-error \
            "https://us-central1-burnbar.cloudfunctions.net/healthReady" \
            > "$RUNNER_TEMP/existing-health-ready.json"
          jq -n \
            --slurpfile live "$RUNNER_TEMP/existing-health-live.json" \
            --slurpfile ready "$RUNNER_TEMP/existing-health-ready.json" \
            '{healthLive: $live[0], healthReady: $ready[0]}' \
            > "$RUNNER_TEMP/existing-functions-live.json"
          descriptions="$RUNNER_TEMP/existing-functions-descriptions.jsonl"
          : > "$descriptions"
          while IFS= read -r target; do
            gcloud functions describe "$target" \
              --gen2 \
              --region us-central1 \
              --project burnbar \
              --format=json \
              | jq -c --arg target "$target" '{target: $target, value: .}' >> "$descriptions"
          done < <(jq -er '.targets[]' config/domain-core-functions-relevant-targets.json)
          jq -s . "$descriptions" > "$RUNNER_TEMP/existing-functions-descriptions.json"
          node scripts/ci/create-domain-core-functions-provider-coordinates.mjs \
            --inventory config/domain-core-functions-relevant-targets.json \
            --descriptions "$RUNNER_TEMP/existing-functions-descriptions.json" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --artifact-sha256 "${{ steps.domain-core-build.outputs.runtime_manifest_sha256 }}" \
            --output "$RUNNER_TEMP/existing-functions-provider-coordinates.json"
          node scripts/ci/verify-existing-domain-core-deployment.mjs \
            --consumer functions \
            --receipt "$RUNNER_TEMP/existing-functions-evidence/$asset" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --artifact functions/lib/domain-core-runtime-artifact-manifest.json \
            --live "$RUNNER_TEMP/existing-functions-live.json" \
            --provider-coordinates "$RUNNER_TEMP/existing-functions-provider-coordinates.json" \
            --inventory config/domain-core-functions-relevant-targets.json
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Security config gate — nonce replay defense must not be explicitly disabled
        # F-RR04-002: requireHighRiskNonce defaults to true in production (looksProd).
        # An operator who explicitly sets REQUIRE_HIGH_RISK_NONCE to anything other
        # than "true" or unset in the production Actions environment accepts the
        # consequence loudly at deploy time rather than silently at runtime.
        # Also catches the empty-string bypass (REQUIRE_HIGH_RISK_NONCE="") that
        # would have passed the old == "false" check but still disabled nonce defense
        # pre-fix; belt-and-suspenders alongside the toBool empty-string fix in config.ts.
        run: |
          val="${REQUIRE_HIGH_RISK_NONCE:-}"
          if [[ "$val" == "false" || ( -n "$val" && "$val" != "true" ) ]]; then
            echo "::error::REQUIRE_HIGH_RISK_NONCE is set to '${val}' in the production environment."
            echo "::error::Only 'true' or an unset secret is accepted. Any other value disables nonce replay defense."
            echo "::error::Re-enable by removing the REQUIRE_HIGH_RISK_NONCE secret or setting it to 'true'."
            echo "::error::See docs/security/BurnBar-threat-model.md TM-007 and F-RR04-002 fix-audit for context."
            exit 1
          fi
          echo "Nonce replay defense: ok (REQUIRE_HIGH_RISK_NONCE=${REQUIRE_HIGH_RISK_NONCE:-<unset, defaults to true in production>})"
        env:
          REQUIRE_HIGH_RISK_NONCE: ${{ secrets.REQUIRE_HIGH_RISK_NONCE }}

      - name: Sentry release (Functions)
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true' && steps.tag.outputs.dry_run != 'true' && steps.stable-replay.outputs.reused != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_FUNCTIONS: openburnbar-functions
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_NAME="openburnbar-functions@${TAG}"
          sentry-cli releases new --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases set-commits --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" --auto || true
          sentry-cli releases finalize --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases deploys "$RELEASE_NAME" new \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_FUNCTIONS" \
            --env production \
            --name "${TAG}-$(date -u +%Y%m%dT%H%M%SZ)" || true
          echo "Sentry release ${RELEASE_NAME} created."

      - name: Require matching rules before Functions deploy
        if: steps.tag.outputs.dry_run != 'true' && steps.stable-replay.outputs.reused != 'true'
        env:
          FIREBASE_PROJECT: burnbar
        run: node scripts/ci/check-firestore-deploy-drift.mjs "$FIREBASE_PROJECT"

      - name: Deploy Cloud Functions
        id: deploy
        if: steps.tag.outputs.dry_run != 'true' && steps.stable-replay.outputs.reused != 'true'
        env:
          FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}
          OPENBURNBAR_SOURCE_COMMIT: ${{ steps.tag.outputs.commit }}
          OPENBURNBAR_CORRESPONDING_SOURCE_URL: https://burnbar.ai/legal/source
          FIREBASE_FUNCTIONS_CI_CONFIG: ${{ runner.temp }}/firebase-functions.ci.json
          # H13: Sentry ingest DSN for the functions project. DSNs are
          # low-sensitivity (write-only ingest endpoints, not credentials), but
          # are not public product IDs, so the value lives in an Actions secret
          # rather than the committed .env.burnbar.production. SENTRY_ENVIRONMENT
          # is the committed static "production" value from the prod config.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_FUNCTIONS }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ENV_FILE="functions/.env.burnbar"
          PROD_CONFIG="functions/.env.burnbar.production"

          # H14: production runtime config is the committed, reviewed
          # functions/.env.burnbar.production (non-secret public IDs/URLs).
          # Both this deploy lane and scripts/rollback.sh source the SAME file,
          # so a deploy and a rollback can never disagree or ship empty config.
          if [[ ! -f "$PROD_CONFIG" ]]; then
            echo "::error::Missing $PROD_CONFIG — refusing to deploy with empty runtime config."
            exit 1
          fi

          # H13: Sentry must be provisioned for production functions, or the
          # crash-reporting surface ships dark. Fail closed at deploy time (not
          # just at the post-deploy health gate) so a missing/cleared DSN secret
          # is caught before traffic shifts.
          if [[ -z "${SENTRY_DSN:-}" ]]; then
            echo "::error::Missing SENTRY_DSN — refusing to deploy production functions with crash reporting disabled. Set the SENTRY_DSN_FUNCTIONS Actions secret (production environment)."
            exit 1
          fi

          # Per-deploy dynamic values are not committed; append them on top of
          # the reviewed static config. SENTRY_DSN is an Actions secret (not
          # committed). SENTRY_ENVIRONMENT is provisioned through the same env
          # writer so functions/src/sentry.ts tags production events correctly.
          {
            cat "$PROD_CONFIG"
            echo ""
            cat "$RUNNER_TEMP/domain-core-functions.env"
            echo "FUNCTION_VERSION=${TAG}"
            echo "OPENBURNBAR_SOURCE_COMMIT=${OPENBURNBAR_SOURCE_COMMIT}"
            echo "OPENBURNBAR_DOMAIN_CORE_RUNTIME_MANIFEST_SHA256=${{ steps.domain-core-build.outputs.runtime_manifest_sha256 }}"
            echo "SENTRY_DSN=${SENTRY_DSN}"
            echo "SENTRY_ENVIRONMENT=production"
          } > "$ENV_FILE"
          export FUNCTION_VERSION="$TAG"

          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Production deploy requires workload identity federation."
            exit 1
          fi
          if [[ -z "${FIREBASE_TOOLS_BIN:-}" || ! -x "$FIREBASE_TOOLS_BIN" ]]; then
            echo "::error::Pinned Firebase CLI path is missing or not executable."
            exit 1
          fi
          if grep -q '"predeploy"' "$FIREBASE_FUNCTIONS_CI_CONFIG"; then
            echo "::error::$FIREBASE_FUNCTIONS_CI_CONFIG contains predeploy."
            exit 1
          fi

          recomputed_manifest="$RUNNER_TEMP/domain-core-functions-runtime-manifest-recomputed.json"
          node scripts/ci/create-domain-core-runtime-artifact-manifest.mjs \
            --consumer functions \
            --root functions \
            --profile-receipt "${{ steps.domain-core-profile.outputs.profile_path }}" \
            --output "$recomputed_manifest"
          if ! cmp -s functions/lib/domain-core-runtime-artifact-manifest.json "$recomputed_manifest"; then
            echo "::error::Functions runtime bytes changed after the immutable manifest was created."
            exit 1
          fi

          "$FIREBASE_TOOLS_BIN" deploy \
            --only functions \
            --project burnbar \
            --config "$FIREBASE_FUNCTIONS_CI_CONFIG" \
            --non-interactive

          descriptions="$RUNNER_TEMP/domain-core-functions-descriptions.jsonl"
          : > "$descriptions"
          while IFS= read -r target; do
            gcloud functions describe "$target" \
              --gen2 \
              --region us-central1 \
              --project burnbar \
              --format=json \
              | jq -c --arg target "$target" '{target: $target, value: .}' >> "$descriptions"
          done < <(jq -er '.targets[]' config/domain-core-functions-relevant-targets.json)
          jq -s . "$descriptions" > "$RUNNER_TEMP/domain-core-functions-descriptions.json"
          node scripts/ci/create-domain-core-functions-provider-coordinates.mjs \
            --inventory config/domain-core-functions-relevant-targets.json \
            --descriptions "$RUNNER_TEMP/domain-core-functions-descriptions.json" \
            --tag "$TAG" \
            --commit "${{ steps.tag.outputs.commit }}" \
            --artifact-sha256 "${{ steps.domain-core-build.outputs.runtime_manifest_sha256 }}" \
            --output "$RUNNER_TEMP/domain-core-functions-deploy-proof/domain-core-functions-provider-coordinates.json"

      - name: Upload exact deployed Functions proof inputs
        if: steps.tag.outputs.dry_run != 'true' && steps.stable-replay.outputs.reused != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.domain-core-proof.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-functions-deploy-proof
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run skip deploy
        if: steps.tag.outputs.dry_run == 'true'
        run: echo "dry_run=true — skipping production deploy"

      - name: Publish dry-run attestation
        if: steps.tag.outputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_SHA: ${{ steps.tag.outputs.commit }}
          ATTEST_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/ci/release-dry-run-attestation.mjs publish --sha "$ATTEST_SHA" --tag "$ATTEST_TAG" --plane deploy-production

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Functions deploy"
            echo "- Tag: ${{ steps.tag.outputs.tag }}"
            echo "- Dry run: ${{ steps.tag.outputs.dry_run }}"
            echo "- FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}"
            echo "- Domain core profile: ${{ steps.tag.outputs.domain_core_profile }}"
            echo "- Protected signer: run ${{ steps.domain-core-gate.outputs.signer_run_id }}, attempt ${{ steps.domain-core-gate.outputs.signer_run_attempt }}"
            echo "- Project: burnbar"
            echo "- Health: functions-health-gate job"
            echo ""
            echo "### On failure — rollback"
            echo "- MANUAL FAST (sub-minute): pin traffic to a previous-good Cloud Run revision, no rebuild:"
            echo "  \`scripts/ops/rollback-revision.sh <cloud-run-service> --yes\`"
            echo "- MANUAL SLOW (tens of minutes): full source rollback (rebuild + redeploy):"
            echo "  \`scripts/rollback.sh --yes\`"
          } >> "$GITHUB_STEP_SUMMARY"

  functions-health-gate:
    needs: deploy-functions
    if: ${{ always() && needs.deploy-functions.result == 'success' && needs.deploy-functions.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Post-deploy health gate
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          DEPLOY_HEALTH_JSON: deploy-health.json
          DEPLOY_TAG: ${{ needs.deploy-functions.outputs.tag }}
          HEALTH_GATE_EXPECTED_SOURCE_COMMIT: ${{ needs.deploy-functions.outputs.commit }}
          HEALTH_GATE_EXPECTED_VERSION: ${{ needs.deploy-functions.outputs.tag }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_PROFILE: ${{ needs.deploy-functions.outputs.domain_core_profile }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ needs.deploy-functions.outputs.commit }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_VERSION: ${{ needs.deploy-functions.outputs.core_version }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_ABI_VERSION: ${{ needs.deploy-functions.outputs.abi_version }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_SOURCE_SHA256: ${{ needs.deploy-functions.outputs.source_sha256 }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_PRICING_MODE: ${{ needs.deploy-functions.outputs.pricing_mode }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_RUNTIME_MANIFEST_SHA256: ${{ needs.deploy-functions.outputs.runtime_manifest_sha256 }}
          HEALTH_GATE_EXPECTED_DOMAIN_CORE_WASM_SHA256: ${{ needs.deploy-functions.outputs.wasm_sha256 }}
          HEALTH_GATE_REQUIRE_SENTRY: "1"
        run: bash scripts/ci/post-deploy-health-gate.sh

      - name: Upload deploy health artifact
        if: always() && hashFiles('deploy-health.json') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-functions-deploy-health-${{ needs.deploy-functions.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-health.json
          if-no-files-found: ignore

  dispatch-domain-core-functions-evidence:
    needs: [deploy-functions, functions-health-gate]
    if: >-
      ${{ needs.deploy-functions.result == 'success'
          && needs.functions-health-gate.result == 'success'
          && needs.deploy-functions.outputs.dry_run != 'true'
          && needs.deploy-functions.outputs.stable_release == 'true'
          && needs.deploy-functions.outputs.reused_existing_evidence != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exact tag-bound Functions release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.deploy-functions.outputs.tag }}
          DOMAIN_CORE_PROFILE: ${{ needs.deploy-functions.outputs.domain_core_profile }}
        run: |
          set -euo pipefail
          gh workflow run domain-core-functions-release-evidence.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field deploy_run_id="$GITHUB_RUN_ID" \
            --field deploy_run_attempt="$GITHUB_RUN_ATTEMPT" \
            --field domain_core_profile="$DOMAIN_CORE_PROFILE"
