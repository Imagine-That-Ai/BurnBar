name: Deploy Production (Cloud Functions)

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (v*). Defaults to ref when dispatching from a tag."
        required: false
        type: string
      dry_run:
        description: "Build + verifiers + health gate only (no firebase deploy)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Deploy only from v* tags"
            exit 1
          fi
          git checkout "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and build Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
          bash scripts/ci/verify-callable-logging.sh
          bash scripts/ci/verify-resilience-wiring.sh

      - name: Authenticate to Google Cloud (service account)
        if: steps.tag.outputs.dry_run != 'true' && env.HAS_GCP_SA_KEY == 'true'
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (legacy Play service account)
        if: steps.tag.outputs.dry_run != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == 'true'
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Sentry release (Functions)
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_FUNCTIONS: openburnbar-functions
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          curl -sL https://sentry.io/get-cli/ | bash
          RELEASE_NAME="openburnbar-functions@${TAG}"
          sentry-cli releases new --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases set-commits --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" --auto || true
          sentry-cli releases finalize --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_FUNCTIONS" "$RELEASE_NAME" || true
          sentry-cli releases deploys "$RELEASE_NAME" new \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_FUNCTIONS" \
            --env production \
            --name "${TAG}-$(date -u +%Y%m%dT%H%M%SZ)" || true
          echo "Sentry release ${RELEASE_NAME} created."

      - name: Deploy Cloud Functions
        if: steps.tag.outputs.dry_run != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ENV_FILE="functions/.env.burnbar"
          touch "$ENV_FILE"
          for key in FUNCTION_VERSION OPENBURNBAR_OTS_VERIFY_URL OPENBURNBAR_OTS_VERIFY_AUDIENCE OPENBURNBAR_OTS_STAMP_URL APNS_VOIP_TOPIC APNS_HOST APP_STORE_APPLE_APP_ID APP_STORE_BUNDLE_ID APP_STORE_ENV HOSTED_QUOTA_PRODUCT_ID; do
            grep -v "^${key}=" "$ENV_FILE" > "${ENV_FILE}.tmp" || true
            mv "${ENV_FILE}.tmp" "$ENV_FILE"
          done
          {
            echo "FUNCTION_VERSION=${TAG}"
            printf '%s\n' \
              'OPENBURNBAR_OTS_VERIFY_URL=https://openburnbar-ots-verifier-cjrjb5ckqq-uc.a.run.app/verify' \
              'OPENBURNBAR_OTS_VERIFY_AUDIENCE=https://openburnbar-ots-verifier-cjrjb5ckqq-uc.a.run.app' \
              'OPENBURNBAR_OTS_STAMP_URL=https://openburnbar-ots-verifier-cjrjb5ckqq-uc.a.run.app/stamp' \
              'APNS_VOIP_TOPIC=com.openburnbar.mobile.voip' \
              'APNS_HOST=https://api.push.apple.com' \
              'APP_STORE_APPLE_APP_ID=6766366964' \
              'APP_STORE_BUNDLE_ID=com.openburnbar.app' \
              'APP_STORE_ENV=Production' \
              'HOSTED_QUOTA_PRODUCT_ID=com.openburnbar.hostedQuotaSync.cloud.monthly'
          } >> "$ENV_FILE"
          export FUNCTION_VERSION="$TAG"

          firebase_args=(--only functions --project burnbar --non-interactive)
          if [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "Using legacy FIREBASE_TOKEN authentication. Prefer GCP_SA_KEY or workload credentials."
            firebase_args+=(--token "$FIREBASE_TOKEN")
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "Using Google application credentials from google-github-actions/auth."
          else
            echo "::error::No Firebase deploy auth configured. Set GCP_SA_KEY (preferred), GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, or legacy FIREBASE_TOKEN."
            exit 1
          fi

          npx firebase-tools deploy "${firebase_args[@]}"

      - name: Dry-run skip deploy
        if: steps.tag.outputs.dry_run == 'true'
        run: echo "dry_run=true — skipping firebase deploy"

      - name: Post-deploy health gate
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          DEPLOY_HEALTH_JSON: deploy-health.json
          DEPLOY_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # shellcheck source=scripts/ops/resolve-functions-base-url.sh
          source scripts/ops/resolve-functions-base-url.sh
          bash scripts/ci/post-deploy-health-gate.sh

      - name: Upload deploy health artifact
        if: always() && hashFiles('deploy-health.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-health-${{ steps.tag.outputs.tag }}
          path: deploy-health.json
          if-no-files-found: ignore

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Functions deploy"
            echo "- Tag: ${{ steps.tag.outputs.tag }}"
            echo "- Dry run: ${{ steps.tag.outputs.dry_run }}"
            echo "- FUNCTION_VERSION: ${{ steps.tag.outputs.tag }}"
            echo "- Project: burnbar"
            echo "- Health: scripts/ci/post-deploy-health-gate.sh"
            echo ""
            echo "### On failure — rollback"
            echo "- FAST (sub-minute, preferred): pin traffic to a previous-good Cloud Run revision, no rebuild:"
            echo "  \`./scripts/ops/rollback-revision.sh <cloud-run-service> --yes\`"
            echo "- SLOW (tens of minutes, fallback): full source rollback (rebuild + redeploy):"
            echo "  \`./scripts/rollback.sh --yes\`"
          } >> "$GITHUB_STEP_SUMMARY"
