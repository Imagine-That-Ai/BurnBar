name: Shared Rust promotion observation

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact rollout candidate commit already reachable from main"
        required: true
        type: string
      domain:
        description: "Shared Rust promotion domain"
        required: true
        type: choice
        options:
          - quota
          - cloudvault
          - hermes
          - pricing
      channel:
        description: "Signed rollout channel to evaluate"
        required: true
        type: choice
        options:
          - internal
          - beta
      start:
        description: "Inclusive UTC observation start, for example 2026-07-01T00:00:00Z"
        required: true
        type: string
      end:
        description: "Inclusive UTC observation end, at least 14 days after start"
        required: true
        type: string
      core_version:
        description: "Candidate shared Rust semantic version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: domain-core-promotion-${{ inputs.domain }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  observe:
    name: Export, evaluate, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: domain-core-promotion
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the trusted builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # Pin to the immutable dispatch SHA: a floating `main` ref can
          # advance while the run waits in the environment/runner queue and
          # would then fail the builder-commit guard below.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable observation inputs
        id: candidate
        env:
          BUILDER_COMMIT: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CORE_VERSION: ${{ inputs.core_version }}
          OBSERVATION_START: ${{ inputs.start }}
          OBSERVATION_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_commit must be a full lowercase Git SHA"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Promotion observations must run from the exact main builder commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CANDIDATE_COMMIT" HEAD; then
            echo "::error::candidate_commit must already be reachable from the trusted main builder"
            exit 1
          fi
          if [[ ! "$CORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::core_version must be a semantic version"
            exit 1
          fi
          python3 - "$OBSERVATION_START" "$OBSERVATION_END" <<'PY'
          from datetime import datetime
          import sys

          def parse(value: str) -> datetime:
              if not value.endswith("Z"):
                  raise ValueError("timestamps must be UTC and end in Z")
              return datetime.fromisoformat(value[:-1] + "+00:00")

          try:
              started = parse(sys.argv[1])
              ended = parse(sys.argv[2])
          except ValueError as error:
              raise SystemExit(f"invalid observation timestamp: {error}") from error
          if ended <= started:
              raise SystemExit("observation end must be later than start")
          PY
          candidate_version="$(git show "$CANDIDATE_COMMIT:crates/openburnbar-domain-core/Cargo.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')"
          if [[ "$candidate_version" != "$CORE_VERSION" ]]; then
            echo "::error::core_version does not match the candidate Cargo workspace version"
            exit 1
          fi
          # Derive the exporter's full candidate tuple from the committed
          # union ABI manifest at the exact candidate commit so an operator
          # cannot relabel one candidate's records as another identity.
          git show "$CANDIDATE_COMMIT:crates/openburnbar-domain-core/union-abi-manifest.json" > "$RUNNER_TEMP/candidate-union-abi-manifest.json"
          manifest_core_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["coreVersion"])' "$RUNNER_TEMP/candidate-union-abi-manifest.json")"
          if [[ "$manifest_core_version" != "$CORE_VERSION" ]]; then
            echo "::error::core_version does not match the candidate union ABI manifest coreVersion"
            exit 1
          fi
          core_abi_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["abiVersion"])' "$RUNNER_TEMP/candidate-union-abi-manifest.json")"
          core_source_sha256="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceSha256"])' "$RUNNER_TEMP/candidate-union-abi-manifest.json")"
          if [[ ! "$core_abi_version" =~ ^[0-9]+$ || ! "$core_source_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::candidate union ABI manifest tuple is malformed"
            exit 1
          fi
          {
            echo "core_abi_version=$core_abi_version"
            echo "core_source_sha256=$core_source_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install evidence exporter dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Firestore with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Export aggregate shadow evidence
        id: export
        env:
          BUILDER_COMMIT: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_ABI_VERSION: ${{ steps.candidate.outputs.core_abi_version }}
          CORE_SOURCE_SHA256: ${{ steps.candidate.outputs.core_source_sha256 }}
          DOMAIN: ${{ inputs.domain }}
          OBSERVATION_CHANNEL: ${{ inputs.channel }}
          OBSERVATION_START: ${{ inputs.start }}
          OBSERVATION_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          node scripts/ops/export-domain-core-promotion-evidence.mjs \
            --project burnbar \
            --domain "$DOMAIN" \
            --start "$OBSERVATION_START" \
            --end "$OBSERVATION_END" \
            --channel "$OBSERVATION_CHANNEL" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --expected-core-version "$CORE_VERSION" \
            --expected-core-abi-version "$CORE_ABI_VERSION" \
            --expected-core-source-sha256 "$CORE_SOURCE_SHA256" \
            --source-uri https://console.cloud.google.com/firestore/databases/-default-/data/panel/domain_core_shadow_samples \
            --output "$RUNNER_TEMP/domain-core-promotion-evidence.json"

      - name: Evaluate the committed promotion policy
        id: evaluate
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set +e
          node scripts/ci/evaluate-domain-core-promotion.mjs \
            --domain "$DOMAIN" \
            --evidence "$RUNNER_TEMP/domain-core-promotion-evidence.json" \
            --output "$RUNNER_TEMP/domain-core-promotion-report.json"
          status=$?
          set -e
          # The evaluator is diagnostic-only: a validly evaluated
          # candidate-bound report exits 2 (status: diagnostic) and exit 1
          # means invalid input or policy. It never exits 0 — treat 0 like
          # any other unexpected status so a broken evaluator cannot be
          # mistaken for promotion authority.
          if [[ "$status" -ne 1 && "$status" -ne 2 ]]; then
            echo "::error::promotion evaluator returned unexpected status $status"
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Attest a valid diagnostic report
        id: attest_report
        if: steps.evaluate.outputs.status == '2'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/domain-core-promotion-report.json

      - name: Preserve the Sigstore bundle
        if: steps.evaluate.outputs.status == '2'
        env:
          BUNDLE_PATH: ${{ steps.attest_report.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/domain-core-promotion-report.sigstore.json"
          chmod 600 "$RUNNER_TEMP/domain-core-promotion-report.sigstore.json"

      - name: Write observation manifest
        if: steps.evaluate.outputs.status == '2'
        env:
          BUILDER_COMMIT: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CORE_VERSION: ${{ inputs.core_version }}
          DOMAIN: ${{ inputs.domain }}
          OBSERVATION_CHANNEL: ${{ inputs.channel }}
          OBSERVATION_START: ${{ inputs.start }}
          OBSERVATION_END: ${{ inputs.end }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          names = (
              "domain-core-promotion-evidence.json",
              "domain-core-promotion-report.json",
              "domain-core-promotion-report.sigstore.json",
          )
          manifest = {
              "schemaVersion": 1,
              "candidateCommit": os.environ["CANDIDATE_COMMIT"],
              "builderCommit": os.environ["BUILDER_COMMIT"],
              "domain": os.environ["DOMAIN"],
              "channel": os.environ["OBSERVATION_CHANNEL"],
              "coreVersion": os.environ["CORE_VERSION"],
              "startedAt": os.environ["OBSERVATION_START"],
              "endedAt": os.environ["OBSERVATION_END"],
              "workflowRun": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "sha256": {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names},
          }
          (root / "domain-core-promotion-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-core-promotion-${{ inputs.domain }}-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/domain-core-promotion-evidence.json
            ${{ runner.temp }}/domain-core-promotion-report.json
            ${{ runner.temp }}/domain-core-promotion-report.sigstore.json
            ${{ runner.temp }}/domain-core-promotion-manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce a valid diagnostic result
        if: always()
        env:
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXPORT_OUTCOME" != "success" ]]; then
            echo "::error::shadow evidence export failed"
            exit 1
          fi
          # Exit 2 is the evaluator's only valid outcome for this workflow's
          # documented diagnostic use case (status: diagnostic, ready: false,
          # authority: diagnostic-only); it never exits with promotion success.
          if [[ "$EVALUATION_STATUS" != "2" ]]; then
            echo "::error::promotion evidence is invalid or was not validly evaluated (status=${EVALUATION_STATUS:-missing})"
            exit 1
          fi
