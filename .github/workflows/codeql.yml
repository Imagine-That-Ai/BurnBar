name: CodeQL

# Nightly CodeQL scan + on every push to main. Covers:
#   - Swift (AgentLens, OpenBurnBarDaemon, OpenBurnBarCore) — security + correctness
#   - Java/Kotlin (Android)
#   - JavaScript/TypeScript (VS Code extension)
#   - Python (CI helpers, build scripts)
#
# Swift is NOT on pull_request — Swift CodeQL takes 60-90 min and kills PR
# velocity. Non-Swift CodeQL (JS/TS, Python, Java/Kotlin) runs on PR +
# merge_group via .github/workflows/codeql-pr.yml. Other fast PR security gates
# live in .github/workflows/security-pr.yml (gitleaks, npm audit, dependency
# review).
#
# Swift is built with xcodebuild before analysis to ensure full symbol resolution.
# To activate this workflow, switch the repo's code-scanning configuration from
# "Default setup" to "Advanced setup" in Settings → Code security → Code scanning.
#
# Branch protection: require the "CodeQL / Analyze (swift)" status check
# on the *nightly* run (via "Require status checks → from any source") so
# the daily result gates the next day's merges without blocking same-day PRs.

# CI-cost hardening (2026-07-31): the push-to-main trigger re-ran the full
# Swift analysis (~140 macOS min) on every merge (~52K macOS minutes/month).
# Per the branch-protection note above, the NIGHTLY run is the gating result;
# the push trigger was redundant with this workflow's own stated design.
on:
  schedule:
    # 09:17 UTC daily — slightly off the hour to dodge GitHub's cron contention.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift requires xcodebuild → macOS runner. JS/TS and Python don't need
    # macOS, but the matrix-level runner is set per-job to keep the matrix
    # simple. Per-language overrides handled below via `runs-on: ${{ matrix.runner }}`.
    runs-on: ${{ matrix.runner }}
    env:
      # Keep package resolution on the source-built Firestore graph — the
      # prebuilt grpc-binary path is unsafe on iOS 27/Xcode 27 and its package
      # graph triggers the SwiftPM "INTERNAL ERROR: Uncaught exception" crash
      # class (same mitigation as release.yml, 05f158ea3f).
      FIREBASE_SOURCE_FIRESTORE: "1"
    # Swift CodeQL builds the full app/daemon graph plus Signal FFI on hosted
    # macOS runners. The June 2026 main proof run hit the previous 90-minute cap
    # during the traced Swift build, after JS/TS, Python, and Java/Kotlin had
    # passed. Keep the lane bounded, but give Swift enough room to finish source
    # extraction and analysis instead of silently losing coverage.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift coverage: the app, daemon, and core frameworks.
          # autobuild is sufficient for security queries; we use manual xcodebuild
          # for more complete symbol resolution.
          - language: swift
            build-mode: manual
            runner: macos-26
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest

    steps:
      - name: Checkout
        if: matrix.language != 'swift'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Checkout with Swift submodules
        if: matrix.language == 'swift'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive

      # The app target references this plist as a bundle resource, but the real
      # Firebase config is intentionally gitignored. CodeQL only needs the Swift
      # build graph, so use the checked-in placeholder rather than requiring
      # production Firebase secrets for source analysis.
      - name: Prepare Firebase plist for Swift build
        if: matrix.language == 'swift'
        run: cp AgentLens/Resources/GoogleService-Info.plist.example AgentLens/Resources/GoogleService-Info.plist

      - name: Resolve Signal FFI cache identity
        if: matrix.language == 'swift'
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restore-only: this lane builds an x86_64-only artifact on a cache miss,
      # so letting it save would poison the shared superset key for the arm64
      # consumers (SwiftPM/App gates). Only ci-cache-warm.yml and full-target
      # builders may write this key.
      - name: Restore macOS Signal FFI artifact
        if: matrix.language == 'swift'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Install Rust toolchain for libsignal Swift FFI
        if: matrix.language == 'swift'
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        if: matrix.language == 'swift'
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Prepare Signal FFI for Swift CodeQL
        if: matrix.language == 'swift'
        run: |
          SIGNAL_FFI_BUILD_TARGETS=x86_64-apple-darwin \
          SIGNAL_FFI_BUILD_PROFILE=debug \
          CARGO_BUILD_JOBS=2 \
            ./scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Set up JDK 21 for Android CodeQL
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK for CodeQL
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)

      - name: Prepare Android Firebase placeholder
        if: matrix.language == 'java-kotlin'
        run: cp android/app/google-services.json.template android/app/google-services.json

      # init must run BEFORE the manual Swift build so CodeQL's tracer
      # observes the compiler invocations. Without this, the database
      # finalizer reports "no source seen" and fails with exit 32.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended = strong security coverage without the
          # quality/lint noise that security-and-quality adds (unused-var,
          # dead-store, etc.). Those are handled by eslint in the PR harness.
          queries: security-extended

      # Binary SwiftPM targets, especially Sentry's XCFramework artifacts, can
      # timeout on a cold macOS runner. Resolve packages with a bounded retry
      # before the traced build so transient CDN failures do not mask real
      # CodeQL/security signal.
      - name: Resolve Swift packages (CodeQL)
        if: matrix.language == 'swift'
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -project OpenBurnBar.xcodeproj \
              -scheme OpenBurnBar \
              -configuration Debug \
              -destination 'platform=macOS,arch=x86_64' \
              -derivedDataPath .codeql-derived-data \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      # Swift build — resolves packages and compiles all targets so CodeQL
      # can trace the compiler. Runs after init (so CodeQL hooks the build)
      # and only on the swift matrix entry. Disable code signing because
      # macOS-15 GitHub runners don't have signing identities.
      # Retried once because Xcode 27 SwiftPM can crash with "INTERNAL ERROR:
      # Uncaught exception" during the package-graph action even after a clean
      # resolve (same transient class release.yml classifies and retries,
      # 64c7341fbe). The retry stays inside one step so the CodeQL tracer
      # observes whichever attempt compiles.
      - name: Build Swift (CodeQL)
        if: matrix.language == 'swift'
        run: |
          for attempt in 1 2; do
            if xcodebuild -project OpenBurnBar.xcodeproj \
              -scheme OpenBurnBar \
              -configuration Debug \
              -destination 'platform=macOS,arch=x86_64' \
              -derivedDataPath .codeql-derived-data \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO \
              build; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              exit 1
            fi
            echo "xcodebuild failed (attempt ${attempt}); retrying the traced build once."
            sleep 20
          done

      - name: Build Android (CodeQL)
        if: matrix.language == 'java-kotlin'
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
