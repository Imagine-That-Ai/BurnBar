name: Factory Security Review

permissions:
  contents: read
  security-events: write

on:
  schedule:
    # Sunday 23:00 US Central (CST, UTC-6) = Monday 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: factory-security-review
  cancel-in-progress: false

env:
  DROID_VERSION: "0.150.1"
  # GLM-5.2 supported reasoning levels: [off, high]. "high" is the maximum.
  FACTORY_SECURITY_MODEL: "glm-5.2"
  FACTORY_REASONING_EFFORT: "high"

jobs:
  deep-security-review:
    name: Deep Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Factory Droid from pinned npm release
        run: |
          set -euo pipefail

          declare -A expected_integrity=(
            ["droid"]="sha512-4m+nw3ePKHXNeysTWZdNUtbX1oXH/M/JQGaJVEZF7edscLSBvqcK4AiQBTolV97dmSKoH9/eKNNptXy1gBwXyw=="
            ["@factory/cli-linux-x64"]="sha512-JqaJB/4JgM0/Ln0xnOUU3FqCiNc+NZAkBE+B61D1wtrt0ZL9mXGY/7QO61hU4xfz1p6R8hrpn0cvmrMREWcBYA=="
            ["@factory/cli-linux-x64-baseline"]="sha512-BFImbx2ZQ7HlbVsDFI0YFIvCmFLj2SkmC4u4/+d7DslurYzUxGS+SZFSBpKExZqbc/kc8dOBfeH0cMpsUVGUdg=="
          )

          for package_name in "${!expected_integrity[@]}"; do
            actual="$(npm view "${package_name}@${DROID_VERSION}" dist.integrity)"
            if [[ "$actual" != "${expected_integrity[$package_name]}" ]]; then
              echo "Integrity drift for ${package_name}@${DROID_VERSION}" >&2
              echo "expected: ${expected_integrity[$package_name]}" >&2
              echo "actual:   ${actual}" >&2
              exit 1
            fi
          done

          npm install --global "droid@${DROID_VERSION}"
          droid --version | grep -F "${DROID_VERSION}"

      - name: Run mission-based deep security review
        timeout-minutes: 330
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${FACTORY_API_KEY}" ]]; then
            echo "::error::FACTORY_API_KEY is not configured for this repository"
            exit 1
          fi

          trusted_system_path="/usr/bin:/bin:/usr/sbin:/sbin"
          npm_global_bin="$(npm prefix --global)/bin"
          droid_bin="${npm_global_bin}/droid"
          if [[ ! -x "${droid_bin}" ]]; then
            droid_bin="$(command -v droid || true)"
          fi
          node_bin="$(command -v node || true)"
          if [[ -z "${droid_bin}" || ! -x "${droid_bin}" || -z "${node_bin}" || ! -x "${node_bin}" ]]; then
            echo "::error::Droid CLI or Node runtime was not found after the pinned npm install"
            exit 1
          fi
          droid_bin="$(realpath "${droid_bin}")"
          node_bin="$(realpath "${node_bin}")"
          droid_dir="$(dirname "${droid_bin}")"
          node_dir="$(dirname "${node_bin}")"

          mission_user="factory-mission"
          if ! id -u "${mission_user}" >/dev/null 2>&1; then
            sudo useradd --create-home --shell /usr/sbin/nologin "${mission_user}"
          fi

          mission_root="${RUNNER_TEMP}/factory-security-review-mission"
          mission_home="${mission_root}/home"
          mission_tmp="${mission_root}/tmp"
          rm -rf "${mission_root}"
          mkdir -p "${mission_home}" "${mission_tmp}"
          sudo chown -R "${mission_user}:${mission_user}" "${mission_root}"

          review_output="${RUNNER_TEMP}/factory-security-review-output.log"
          if ! {
            sudo -H -u "${mission_user}" env -i \
              HOME="${mission_home}" \
              PATH="${droid_dir}:${node_dir}:${trusted_system_path}" \
              LANG="${LANG:-C.UTF-8}" \
              LC_ALL="${LC_ALL:-C.UTF-8}" \
              CI="true" \
              GITHUB_ACTIONS="true" \
              RUNNER_TEMP="${mission_tmp}" \
              TMPDIR="${mission_tmp}" \
              FACTORY_API_KEY="${FACTORY_API_KEY}" \
              FACTORY_SECURITY_MODEL="${FACTORY_SECURITY_MODEL}" \
              FACTORY_REASONING_EFFORT="${FACTORY_REASONING_EFFORT}" \
              "${droid_bin}" exec --mission --auto high \
              --model "${FACTORY_SECURITY_MODEL}" \
              --reasoning-effort "${FACTORY_REASONING_EFFORT}" \
              --worker-model "${FACTORY_SECURITY_MODEL}" \
              --worker-reasoning-effort "${FACTORY_REASONING_EFFORT}" \
              --validator-model "${FACTORY_SECURITY_MODEL}" \
              --validator-reasoning-effort "${FACTORY_REASONING_EFFORT}" \
              "/security-review across the entire repository"
          } >"${review_output}" 2>&1; then
            echo "::error::Droid security review failed. Raw mission output was kept on the runner and was not printed to CI logs."
            rm -f "${review_output}"
            exit 1
          fi

          rm -f "${review_output}"
          echo "Droid security review completed; raw mission output was not printed to CI logs."

      - name: Verify security review output
        run: |
          set -euo pipefail
          audit_dir="${RUNNER_TEMP}/factory-security-review-mission/home/security-audits"
          if [[ ! -d "${audit_dir}" ]]; then
            echo "::error::Droid completed without creating ${audit_dir}"
            exit 1
          fi
          if [[ -z "$(find "${audit_dir}" -type f -print -quit)" ]]; then
            echo "::error::Droid completed without writing security audit artifacts"
            exit 1
          fi
          echo "Security audit produced $(find "${audit_dir}" -type f | wc -l) file(s) on the runner."

      - name: Route critical findings to private security advisory
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          unset BASH_ENV ENV CDPATH

          gh_bin="/usr/bin/gh"
          jq_bin="/usr/bin/jq"
          curl_bin="/usr/bin/curl"
          gpg_bin="/usr/bin/gpg"
          tar_bin="/usr/bin/tar"
          for tool in gh jq curl gpg tar; do
            bin_var="${tool}_bin"
            if [[ ! -x "${!bin_var}" ]]; then
              echo "::error::Required routing tool ${tool} was not found at the expected system path"
              exit 1
            fi
          done

          audit_dir="${RUNNER_TEMP}/factory-security-review-mission/home/security-audits"
          tmp_files=()
          cleanup() {
            for f in "${tmp_files[@]}"; do
              rm -rf -- "${f}"
            done
          }
          trap cleanup EXIT

          # Concatenate every file the mission produced into a single buffer.
          report_tmp="$(mktemp)"
          evidence_archive="${RUNNER_TEMP}/factory-security-review-encrypted-evidence.tgz.gpg"
          evidence_retained=false
          tmp_files+=("${report_tmp}")
          find "${audit_dir}" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            rel="${f#"${audit_dir}"/}"
            {
              echo "===== ${rel} ====="
              cat "${f}"
              echo ""
            } >> "${report_tmp}"
          done

          # Detect critical findings. The security-review skill tags them as
          # "Critical" or "P0" in its structured output. If none are present,
          # the run is treated as clean and no advisory is opened.
          if ! grep -qiE '\b(critical|P0)\b' "${report_tmp}"; then
            echo "No critical findings detected. No advisory will be opened."
            exit 0
          fi

          # Truncate to a safe size for the advisory body (GH API limit is large
          # but we keep this bounded to avoid pathological reports).
          max_chars=60000
          description_tmp="$(mktemp)"
          payload_tmp="$(mktemp)"
          tmp_files+=("${description_tmp}" "${payload_tmp}")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          today="$(date -u +%Y-%m-%d)"

          {
            printf 'Auto-generated by the Factory Security Review workflow (run [#%s](%s)).\n\n' \
              "${GITHUB_RUN_ID}" "${run_url}"
            head -c "${max_chars}" "${report_tmp}"
          } > "${description_tmp}"
          if [[ $(wc -c < "${report_tmp}") -gt "${max_chars}" ]]; then
            {
              printf '\n\n'
              printf '... (report truncated at %s bytes; full audit retained only on the runner)\n' "${max_chars}"
            } >> "${description_tmp}"
          fi

          if [[ -n "${SECURITY_REVIEW_EVIDENCE_KEY:-}" ]]; then
            evidence_dir="$(mktemp -d)"
            tmp_files+=("${evidence_dir}")
            chmod 700 "${evidence_dir}"
            cp "${report_tmp}" "${evidence_dir}/report.txt"
            "${jq_bin}" -n \
              --arg run_url "${run_url}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "{
                repository: \$repository,
                run_id: \$run_id,
                run_url: \$run_url,
                created_at: \$created_at,
                contents: \"encrypted factory security review evidence\"
              }" > "${evidence_dir}/metadata.json"
            (
              cd "${evidence_dir}"
              "${tar_bin}" -czf - report.txt metadata.json
            ) | "${gpg_bin}" --batch --yes --pinentry-mode loopback \
              --symmetric --cipher-algo AES256 \
              --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
              --passphrase-fd 3 \
              --output "${evidence_archive}" \
              3<<<"${SECURITY_REVIEW_EVIDENCE_KEY}"
            chmod 600 "${evidence_archive}"
            evidence_retained=true
            echo "Encrypted security review evidence retained for this run."
          else
            echo "::warning::SECURITY_REVIEW_EVIDENCE_KEY is not configured; encrypted evidence artifact cannot be retained."
          fi

          "${jq_bin}" -n \
            --arg summary "Weekly security review — ${today}" \
            --rawfile description "${description_tmp}" \
            "{
              summary: \$summary,
              description: \$description,
              severity: \"critical\",
              confidential: true,
              private_vulnerability_reporting: true,
              vulnerabilities: [
                {
                  package: {
                    ecosystem: \"other\",
                    name: \"repository-codebase\"
                  },
                  vulnerable_version_range: \">= 0.0.0\"
                }
              ]
            }" > "${payload_tmp}"

          # Post a single private security advisory per run. The GitHub
          # Security Advisory API requires a vulnerabilities array; we provide
          # a generic entry since the scan reports code-level issues, not
          # specific package CVEs. Repo admins can refine from the Security tab.
          advisory_created=false
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::SECURITY_ADVISORY_TOKEN is not configured; workflow will fail closed after alert routing."
          else
            if "${gh_bin}" api --silent --method POST "/repos/${GITHUB_REPOSITORY}/security-advisories" \
              --input "${payload_tmp}" \
              2>/dev/null; then
              advisory_created=true
              echo "Private security advisory created for ${today}."
            else
              # SECURITY_ADVISORY_TOKEN must belong to a repository admin or
              # security manager with repository advisory write permission.
              echo "::warning::Failed to create security advisory (SECURITY_ADVISORY_TOKEN may lack repository advisory write permission). Workflow will fail closed after alert routing."
            fi
          fi

          # Slack notification. This is alert-only routing; the private advisory
          # is the only channel that receives the confidential report body.
          if [[ -n "${SLACK_SECURITY_WEBHOOK}" ]]; then
            critical_count="$(grep -ciE '\b(critical|P0)\b' "${report_tmp}" || true)"
            if [[ "${advisory_created}" == "true" ]]; then
              slack_text="🚨 *${GITHUB_REPOSITORY}* — ${critical_count} critical finding(s) from weekly security review. Private advisory created (${today}). Run: ${run_url}"
            elif [[ "${evidence_retained}" == "true" ]]; then
              slack_text="🚨 *${GITHUB_REPOSITORY}* — ${critical_count} critical finding(s) from weekly security review. Advisory creation failed; encrypted evidence artifact retained and workflow failed closed. Run: ${run_url}"
            else
              slack_text="🚨 *${GITHUB_REPOSITORY}* — ${critical_count} critical finding(s) from weekly security review. Advisory creation failed; workflow failed closed without printing the report. Run: ${run_url}"
            fi
            payload="$("${jq_bin}" -nc \
              --arg text "${slack_text}" \
              "{text: \$text, blocks: [{type:\"section\", text:{type:\"mrkdwn\", text: \$text}}]}" 2>/dev/null || echo "")"
            if [[ -n "${payload}" ]]; then
              if "${curl_bin}" -fsS -X POST -H 'Content-Type: application/json' \
                --data "${payload}" \
                "${SLACK_SECURITY_WEBHOOK}" 2>/dev/null; then
                echo "Slack security notification sent."
              else
                echo "::warning::Slack webhook post failed (non-fatal)"
              fi
            fi
          fi

          # Critical reports must land in the private advisory channel. Slack is
          # only an alert, never a substitute for the confidential report body.
          if [[ "${advisory_created}" == "false" ]]; then
            if [[ "${evidence_retained}" == "true" ]]; then
              echo "::error::Critical findings detected but private advisory routing failed. Encrypted evidence artifact retained; raw report intentionally not printed to CI logs."
            else
              echo "::error::Critical findings detected but private advisory routing failed, and encrypted evidence retention is unavailable. Raw report intentionally not printed to CI logs."
            fi
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
          SECURITY_REVIEW_EVIDENCE_KEY: ${{ secrets.SECURITY_REVIEW_EVIDENCE_KEY }}
          SLACK_SECURITY_WEBHOOK: ${{ secrets.SLACK_SECURITY_WEBHOOK }}

      - name: Upload encrypted security review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: factory-security-review-encrypted-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-security-review-encrypted-evidence.tgz.gpg
          if-no-files-found: ignore
          retention-days: 30
