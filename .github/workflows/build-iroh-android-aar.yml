name: openburnbar-iroh AAR (Android)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/openburnbar-iroh/**"
      - "scripts/build-iroh-android-aar.sh"
      - ".github/workflows/build-iroh-android-aar.yml"
      - "android/openburnbar-iroh-relay/**"
      - "Vendor/openburnbar-iroh.aar"
  pull_request:
    paths:
      - "crates/openburnbar-iroh/**"
      - "scripts/build-iroh-android-aar.sh"
      - ".github/workflows/build-iroh-android-aar.yml"
      - "android/openburnbar-iroh-relay/**"
      - "Vendor/openburnbar-iroh.aar"
  workflow_dispatch:

concurrency:
  group: openburnbar-iroh-aar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "26.3.11579264"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.3.0 (node24-native)
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
        with:
          packages: "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install rust toolchain
        # Keep in sync with crates/openburnbar-iroh/rust-toolchain.toml and the
        # iroh xcframework lane so both platforms build on the same rustc.
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/openburnbar-iroh/target
            build/uniffi-bindgen-kotlin-helper/target
          key: iroh-aar-${{ runner.os }}-${{ hashFiles('crates/openburnbar-iroh/Cargo.toml') }}
          restore-keys: |
            iroh-aar-${{ runner.os }}-

      - name: Install cargo-ndk
        env:
          # crates.io downloads on hosted runners occasionally fail with HTTP/2
          # framing errors; sparse + retry keeps this setup step deterministic.
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if cargo install cargo-ndk --locked --version "^3.5"; then
                exit 0
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep "$((attempt * 10))"
            done
          fi

      - name: Export Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euo pipefail
          ndk_path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          if [[ ! -d "${ndk_path}" ]]; then
            echo "Expected Android NDK missing: ${ndk_path}" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Host-side cargo check (sanity)
        run: cargo check -p openburnbar-iroh
        working-directory: crates/openburnbar-iroh

      - name: Host-side cargo test (datagrams + chat ALPN)
        run: cargo test -p openburnbar-iroh
        working-directory: crates/openburnbar-iroh

      - name: Build AAR
        run: ./scripts/build-iroh-android-aar.sh
        env:
          IROH_BUILD_PROFILE: release
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify committed AAR parity
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            Vendor/openburnbar-iroh.aar \
            android/openburnbar-iroh-relay/src/main/java/uniffi/openburnbar_iroh \
            || {
              echo "::error::Committed openburnbar-iroh AAR/Kotlin bindings do not match a clean source rebuild.";
              exit 1;
            }

      - name: Inspect AAR
        run: |
          set -euo pipefail
          ls -la Vendor/openburnbar-iroh.aar
          unzip -l Vendor/openburnbar-iroh.aar | head -40

      - name: Upload AAR artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: openburnbar-iroh.aar
          path: Vendor/openburnbar-iroh.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Kotlin bindings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: openburnbar-iroh-kotlin-bindings
          path: android/openburnbar-iroh-relay/src/main/java/uniffi/openburnbar_iroh
          if-no-files-found: error
          retention-days: 14
