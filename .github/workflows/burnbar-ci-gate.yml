name: BurnBar CI Gate

on:
  # The bootstrap-compatibility `pull_request` trigger was removed 2026-07-31:
  # the trusted default-branch `pull_request_target` trigger has long since
  # landed, and running both double-fired this 295-minute-budget umbrella on
  # every PR event (138 runs/48h, two live "BurnBar CI Gate" check runs
  # observed on the same head SHA).
  pull_request_target:
    branches: [main]
    # `labeled`/`unlabeled`: the ci-freeze-override label is read from the PR
    # timeline, so both applying and revoking it must produce a fresh verdict.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: burnbar-ci-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  burnbar-ci-gate:
    name: BurnBar CI Gate
    runs-on: ubuntu-latest
    # Remaining merge-queue walls (Domain Core, Daemon, Android, Windows)
    # are allowed 240 minutes of observed runtime on a cold hosted runner,
    # and a component's timeout clock starts only when it leaves the runner
    # queue. The evaluator re-anchors its deadline to the observed component
    # start (component_runtime_budget_minutes in
    # governance/burnbar-ci-gate.json), so this job cap funds that queueing
    # skew while remaining below the 300-minute merge queue response timeout.
    # AgentLens / Headless are post-merge/nightly and are not in this inventory.
    timeout-minutes: 295
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.draft == false
    steps:
      - name: Check out trusted default-branch evaluator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - name: Verify trusted evaluator and exact candidate
        env:
          BURNBAR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          BURNBAR_CI_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BURNBAR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
          BURNBAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Imagine-That-Ai/BurnBar" ]]
          [[ "$BURNBAR_BASE_REF" == "main" || "$BURNBAR_BASE_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$BURNBAR_BASE_SHA" ]]
          [[ "$BURNBAR_CI_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Fast-gate split: PR eligibility polls the fast set (no Swift/mobile/
          # Windows walls, ~10 min); merge_group candidates still fail-closed on
          # the full set minus App/Headless (those builds are post-merge/nightly).
          # Both configs are read from the trusted base-SHA tree.
          CONFIG=governance/burnbar-ci-gate.json
          if [[ "$GITHUB_EVENT_NAME" == pull_request* ]]; then
            CONFIG=governance/burnbar-ci-gate.fast.json
          fi
          node scripts/ci/await-burnbar-ci-gate.mjs "$CONFIG"
