name: BurnBar CI Gate

on:
  # Bootstrap compatibility: remove after the trusted default-branch trigger lands.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: burnbar-ci-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  burnbar-ci-gate:
    name: BurnBar CI Gate
    runs-on: ubuntu-latest
    # The required AgentLens suite is allowed 240 minutes on a cold hosted
    # runner, and its timeout clock starts only when the job leaves the runner
    # queue, which can lag this umbrella's start under dependency and macOS
    # runner contention. The evaluator re-anchors its deadline to the observed
    # component start (component_runtime_budget_minutes in
    # governance/burnbar-ci-gate.json), so this job cap funds that queueing
    # skew while remaining below the 300-minute merge queue response timeout.
    timeout-minutes: 295
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.draft == false
    steps:
      - name: Check out trusted default-branch evaluator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - name: Verify trusted evaluator and exact candidate
        env:
          BURNBAR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          BURNBAR_CI_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BURNBAR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Imagine-That-Ai/BurnBar" ]]
          [[ "$BURNBAR_BASE_REF" == "main" || "$BURNBAR_BASE_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$BURNBAR_BASE_SHA" ]]
          [[ "$BURNBAR_CI_SHA" =~ ^[0-9a-f]{40}$ ]]
          node scripts/ci/await-burnbar-ci-gate.mjs governance/burnbar-ci-gate.json
