name: OpenBurnBarIroh xcframework

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/openburnbar-iroh/**"
      - "scripts/build-iroh-xcframework.sh"
      - ".github/workflows/iroh-xcframework.yml"
      - "OpenBurnBarCore/Package.swift"
  pull_request:
    paths:
      - "crates/openburnbar-iroh/**"
      - "scripts/build-iroh-xcframework.sh"
      - ".github/workflows/iroh-xcframework.yml"
      - "OpenBurnBarCore/Package.swift"
  workflow_dispatch:

concurrency:
  group: iroh-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - name: Install rust toolchain
        # Keep in sync with crates/openburnbar-iroh/rust-toolchain.toml and the
        # Android AAR lane: the shipping xcframework must not float on `stable`.
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/openburnbar-iroh/target
          key: iroh-xcframework-${{ runner.os }}-${{ hashFiles('crates/openburnbar-iroh/Cargo.toml') }}
          restore-keys: |
            iroh-xcframework-${{ runner.os }}-

      - name: Host-side cargo check (sanity)
        run: cargo check -p openburnbar-iroh
        working-directory: crates/openburnbar-iroh

      - name: Build xcframework
        run: ./scripts/build-iroh-xcframework.sh

      - name: Inspect xcframework
        run: |
          set -euo pipefail
          ls -la Vendor/OpenBurnBarIroh.xcframework
          find Vendor/OpenBurnBarIroh.xcframework -maxdepth 3 -type f | head -50
          file Vendor/OpenBurnBarIroh.xcframework/*/libopenburnbar_iroh.a | head -5 || true

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: OpenBurnBarIroh.xcframework
          path: Vendor/OpenBurnBarIroh.xcframework
          if-no-files-found: error
          retention-days: 14
