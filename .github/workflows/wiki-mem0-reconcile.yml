name: Wiki mem0 Reconcile

# Nightly safety net for the droid-wiki -> mem0 mirror. The per-commit hook keeps
# mem0 fresh during normal development; this job re-reconciles the whole canonical
# wiki against mem0 so any drift (a commit landed without the hook installed, a CI
# wiki regeneration, a manually deleted memory) is corrected within a day.
#
# Requires repository secret MEM0_BURNBAR_API_KEY (the BurnBar mem0 project key).
# Without it the sync logs a skip and the job is a no-op.

on:
  schedule:
    - cron: "0 9 * * *" # 02:00 America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-mem0-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.capture-base.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Capture reconcile base
        id: capture-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Reconcile droid-wiki to mem0
        run: node scripts/wiki/mem0-sync.mjs --all --verbose
        env:
          MEM0_BURNBAR_API_KEY: ${{ secrets.MEM0_BURNBAR_API_KEY }}

      - name: Stage refreshed manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mem0-manifest"
          cp droid-wiki/.mem0-manifest.json "$RUNNER_TEMP/mem0-manifest/mem0-manifest.json"

      - name: Upload refreshed manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: wiki-mem0-manifest
          path: ${{ runner.temp }}/mem0-manifest/mem0-manifest.json
          if-no-files-found: error
          retention-days: 1

  commit-refreshed-manifest:
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.reconcile.outputs.base-sha }}
          persist-credentials: false

      - name: Download refreshed manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          name: wiki-mem0-manifest
          path: ${{ runner.temp }}/mem0-manifest

      - name: Restore refreshed manifest
        run: cp "$RUNNER_TEMP/mem0-manifest/mem0-manifest.json" droid-wiki/.mem0-manifest.json

      - name: Commit refreshed manifest
        continue-on-error: true # tolerate branch protection; mem0 is already reconciled
        run: |
          if git diff --quiet -- droid-wiki/.mem0-manifest.json; then
            echo "Manifest unchanged - mem0 already in sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add droid-wiki/.mem0-manifest.json
          git commit -m "chore(wiki): reconcile mem0 manifest [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || {
            echo "## mem0 manifest push skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "mem0 was reconciled, but pushing the updated manifest failed (likely branch protection). The next developer commit will carry it." >> "$GITHUB_STEP_SUMMARY"
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}
