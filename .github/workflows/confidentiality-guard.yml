name: Confidentiality Guard

# Fails if internal-only content (pricing/COGS, GTM strategy, open-vuln working
# notes, or anything carrying the `BurnBar-Confidential: internal` banner) is
# present in the public tree. This complements the secret scanners in
# security-pr.yml — it catches content that is sensitive but is not a credential.
#
# Policy:  scripts/security/internal-content-policy.mjs
# Engine:  scripts/security/scan-internal-content.mjs
# Docs:    docs/security/CONFIDENTIALITY_POLICY.md
#
# The `guard` job is a REQUIRED status check (see governance/branch-protection.main.json),
# so it is also the fail-closed home for the branch-protection bypass-recipe guard
# (scripts/ci/check-no-bypass-recipe.sh, R-G3): a required lane guarantees a future PR
# that re-adds an admin-enforcement-disable recipe cannot merge undetected.
#
# Branch protection should require the "Confidentiality Guard / guard" check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: confidentiality-guard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    # PR run 31396653071 spent the full former 10-minute budget in checkout
    # on 2026-08-10, so none of the required confidentiality checks could run.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Run confidentiality guard (full tracked tree)
        run: node scripts/security/scan-internal-content.mjs

      - name: Self-test the guard
        run: node --test scripts/security/__tests__/scan-internal-content.test.mjs

      - name: Run public evidence redaction guard
        run: node scripts/security/check-public-evidence-redaction.mjs

      - name: Self-test public evidence redaction guard
        run: node --test scripts/security/__tests__/check-public-evidence-redaction.test.mjs

      - name: Run branch-protection bypass-recipe guard (fail-closed)
        run: bash scripts/ci/check-no-bypass-recipe.sh

      - name: Self-test bypass-recipe guard
        run: bash scripts/ci/check-no-bypass-recipe.test.sh
