name: OpenBurnBar Functional QA

# Functional QA. Posts one updated PR comment and does not replace the
# existing OpenBurnBar PR Harness/static validators. NOT a required check —
# but its conclusion is honest: if QA is blocked or fails, the job goes red
# (diligence 2026-06-11: the previous continue-on-error version concluded
# "success" even when fully broken, green-washing every PR's check list).

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to update with the QA report
        required: false
        type: string

concurrency:
  group: qa-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-qa:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      INTERNAL_RUN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - name: Resolve PR metadata
        id: pr
        env:
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            printf 'number=%s\n' "${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_PR:-}" ]]; then
            printf 'number=%s\n' "${INPUT_PR}" >> "$GITHUB_OUTPUT"
            ref=$(gh pr view "$INPUT_PR" --json headRefName --jq .headRefName)
            printf 'ref=%s\n' "${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            brew install imagemagick
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install tuistory
        run: npm install -g tuistory@0.4.0

      - name: Install OpenBurnBar extension dependencies
        run: npm ci --prefix extensions/openburnbar

      # Defense-in-depth: GitHub redacts secrets for fork PRs on pull_request,
      # but the if: guard skips QA entirely to avoid wasting runner minutes.
      - name: Run QA
        if: env.INTERNAL_RUN == 'true'
        id: qa
        # continue-on-error keeps later steps (artifacts, PR comment) running;
        # the "Honest conclusion" step below re-asserts the real outcome.
        continue-on-error: true
        timeout-minutes: 20
        # Minimum-scoped secret set (diligence H26): this step receives ONLY
        # the credentials functional QA actually needs and nothing else.
        #   - FACTORY_API_KEY: retained as a required QA environment preflight
        #     because downstream agent/Hermes QA flows need Factory auth.
        #   - FIREBASE_*: build/run the app under App Check (these two also gate
        #     INTERNAL_RUN's HAS_FIREBASE_SECRETS above).
        #   - QA_FIREBASE_*: the dedicated QA Auth account the qa skill signs in
        #     with (tools/qa/README.md).
        # Deliberately NOT in scope (removed to shrink the curl-CLI blast radius):
        # ANTHROPIC, the alternate provider keys (OPENAI/OPENROUTER/ZAI/Z_AI/MINIMAX), the
        # provider GitHub PAT, the Factory session creds (BEARER/COOKIE), the
        # backend API_SERVER_KEY, and the Sentry DSN. If a future QA flow needs
        # one of these, add it back narrowly with a note on why.
        env:
          CI: true
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          QA_FIREBASE_EMAIL: ${{ secrets.QA_FIREBASE_EMAIL }}
          QA_FIREBASE_PASSWORD: ${{ secrets.QA_FIREBASE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p qa-results
          bash tools/qa/run-functional-qa.sh 2>&1 | tee qa-results/qa-output.txt

      - name: Ensure report exists
        if: always()
        run: |
          mkdir -p qa-results
          if [[ ! -f qa-results/report.md ]]; then
            {
              echo "## QA Report"
              echo ""
              echo "| # | Test Case | App | Persona | Result | Notes |"
              echo "|---|-----------|-----|---------|--------|-------|"
              echo "| 1 | QA execution | qa | operator | :no_entry: BLOCKED | Droid did not produce qa-results/report.md; see qa-output.txt artifact. |"
              echo ""
              echo "<details>"
              echo "<summary>Screenshots & Evidence</summary>"
              echo ""
              echo '```text'
              tail -200 qa-results/qa-output.txt 2>/dev/null || true
              echo '```'
              echo ""
              echo "</details>"
            } > qa-results/report.md
          fi
          if ! grep -q '^## QA Report' qa-results/report.md; then
            tmp=$(mktemp)
            { echo "## QA Report"; echo; cat qa-results/report.md; } > "$tmp"
            mv "$tmp" qa-results/report.md
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: qa-results-${{ github.run_number }}
          path: qa-results/**
          retention-days: 14

      - name: Post QA report as PR comment
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          pr = os.environ['PR_NUMBER']
          run_url = os.environ['RUN_URL']
          marker = '<!-- qa-report -->'
          report_path = Path('qa-results/report.md')
          body = report_path.read_text() if report_path.exists() else '## QA Report\n\n:no_entry: BLOCKED -- report missing.'
          if not body.startswith('## QA Report'):
              body = '## QA Report\n\n' + body
          body = f"{marker}\n{body}\n\n---\nArtifacts: see `qa-results-{os.environ.get('GITHUB_RUN_NUMBER', '')}` in the workflow run.\nWorkflow run: {run_url}\n"

          comments_json = subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/{pr}/comments', '--paginate'], text=True)
          comments = json.loads(comments_json)
          existing = next((c for c in comments if c.get('body', '').startswith(marker)), None)
          if existing:
              subprocess.check_call(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/comments/{existing["id"]}', '-X', 'PATCH', '-f', f'body={body}'])
          else:
              subprocess.check_call(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/{pr}/comments', '-f', f'body={body}'])
          PY

      - name: Honest conclusion
        if: always() && env.INTERNAL_RUN == 'true'
        env:
          QA_STEP_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          if [[ "${QA_STEP_OUTCOME}" != "success" ]]; then
            echo "::error::Functional QA did not complete (step outcome: ${QA_STEP_OUTCOME}). The PR comment/artifacts have details."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          report = Path("qa-results/report.md").read_text()
          bad_rows = []
          for line in report.splitlines():
              if not line.startswith("|"):
                  continue
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              if len(cells) < 5 or cells[0] in {"#", "---"} or cells[4] == "Result":
                  continue
              if ":no_entry: BLOCKED" in cells[4] or ":x: FAIL" in cells[4]:
                  bad_rows.append(line)

          if bad_rows:
              print("::error::Functional QA report contains BLOCKED/FAIL result rows. See the PR comment.")
              for row in bad_rows:
                  print(row)
              raise SystemExit(1)
          PY
          echo "Functional QA passed."
