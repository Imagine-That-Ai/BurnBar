name: OpenBurnBar Functional QA

# Functional QA. Posts one updated PR comment and does not replace the
# existing OpenBurnBar PR Harness/static validators. NOT a required check —
# but its conclusion is honest: if QA is blocked or fails, the job goes red
# (diligence 2026-06-11: the previous continue-on-error version concluded
# "success" even when fully broken, green-washing every PR's check list).

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to update with the QA report
        required: false
        type: string

concurrency:
  group: qa-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-qa:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RUN_PR_SAFE_QA: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref != 'refs/heads/main' }}
      RUN_SECRET_BACKED_QA: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR metadata
        id: pr
        env:
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            printf 'number=%s\n' "${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_PR:-}" ]]; then
            printf 'number=%s\n' "${INPUT_PR}" >> "$GITHUB_OUTPUT"
            ref=$(gh pr view "$INPUT_PR" --json headRefName --jq .headRefName)
            printf 'ref=%s\n' "${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            brew install imagemagick
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install tuistory
        run: npm install -g tuistory@0.4.0

      - name: Install OpenBurnBar extension dependencies
        run: npm ci --prefix extensions/openburnbar

      # Pull-request code runs the deterministic QA surface without any
      # secret-backed credentials. Manual dispatch on main is the only lane
      # allowed to exercise Firebase/App Check and QA-authenticated flows.
      - name: Run PR-safe QA
        if: env.RUN_PR_SAFE_QA == 'true'
        id: qa_pr_safe
        continue-on-error: true
        timeout-minutes: 20
        env:
          CI: true
          OPENBURNBAR_QA_SECRET_MODE: pr-safe
        run: |
          set +e -uo pipefail
          mkdir -p qa-results
          bash tools/qa/run-functional-qa.sh 2>&1 | node scripts/ci/redact-qa-artifacts.mjs --stream | tee qa-results/qa-output.txt
          statuses=("${PIPESTATUS[@]}")
          qa_status="${statuses[0]}"
          stream_redactor_status="${statuses[1]}"
          tee_status="${statuses[2]}"
          artifact_redactor_status=0
          node scripts/ci/redact-qa-artifacts.mjs qa-results || artifact_redactor_status="$?"

          if [[ "$stream_redactor_status" -ne 0 || "$tee_status" -ne 0 || "$artifact_redactor_status" -ne 0 ]]; then
            echo "::error::Functional QA artifact redaction failed."
            exit 1
          fi

          exit "$qa_status"

      - name: Run secret-backed QA
        if: env.RUN_SECRET_BACKED_QA == 'true'
        id: qa_secret
        # continue-on-error keeps later steps running; artifact upload and PR
        # comments are still gated on a final successful redaction pass below.
        continue-on-error: true
        timeout-minutes: 20
        # Minimum-scoped secret set: this step receives ONLY the credentials
        # functional QA actually needs and nothing else. It is restricted to
        # workflow_dispatch on main so PR-controlled code never receives them.
        #   - FACTORY_API_KEY: retained as a required QA environment preflight
        #     because downstream agent/Hermes QA flows need Factory auth.
        #   - FIREBASE_*: build/run the app under App Check in the manual-main
        #     lane.
        #   - QA_FIREBASE_*: the dedicated QA Auth account the qa skill signs in
        #     with (tools/qa/README.md).
        # Deliberately NOT in scope (removed to shrink the curl-CLI blast radius):
        # ANTHROPIC, the alternate provider keys (OPENAI/OPENROUTER/ZAI/Z_AI/MINIMAX), the
        # provider GitHub PAT, the Factory session creds (BEARER/COOKIE), the
        # backend API_SERVER_KEY, and the Sentry DSN. If a future QA flow needs
        # one of these, add it back narrowly with a note on why.
        env:
          CI: true
          OPENBURNBAR_QA_SECRET_MODE: full
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          OPENBURNBAR_USE_DEBUG_APP_CHECK: "YES"
          QA_FIREBASE_EMAIL: ${{ secrets.QA_FIREBASE_EMAIL }}
          QA_FIREBASE_PASSWORD: ${{ secrets.QA_FIREBASE_PASSWORD }}
        run: |
          set +e -uo pipefail
          mkdir -p qa-results
          bash tools/qa/run-functional-qa.sh 2>&1 | node scripts/ci/redact-qa-artifacts.mjs --stream | tee qa-results/qa-output.txt
          statuses=("${PIPESTATUS[@]}")
          qa_status="${statuses[0]}"
          stream_redactor_status="${statuses[1]}"
          tee_status="${statuses[2]}"
          artifact_redactor_status=0
          node scripts/ci/redact-qa-artifacts.mjs qa-results || artifact_redactor_status="$?"

          if [[ "$stream_redactor_status" -ne 0 || "$tee_status" -ne 0 || "$artifact_redactor_status" -ne 0 ]]; then
            echo "::error::Functional QA artifact redaction failed."
            exit 1
          fi

          exit "$qa_status"

      - name: Ensure report exists
        if: always()
        run: |
          set -euo pipefail
          mkdir -p qa-results
          if [[ ! -f qa-results/report.md ]]; then
            {
              echo "## QA Report"
              echo ""
              echo "| # | Test Case | App | Persona | Result | Notes |"
              echo "|---|-----------|-----|---------|--------|-------|"
              echo "| 1 | QA execution | qa | operator | :no_entry: BLOCKED | Droid did not produce qa-results/report.md; see qa-output.txt artifact. |"
              echo ""
              echo "<details>"
              echo "<summary>Screenshots & Evidence</summary>"
              echo ""
              echo '```text'
              if [[ -f qa-results/qa-output.txt ]]; then
                if redacted_tail="$(node scripts/ci/redact-qa-artifacts.mjs --stream < qa-results/qa-output.txt 2>/dev/null | tail -200)"; then
                  printf '%s\n' "$redacted_tail"
                else
                  echo "QA output omitted because redaction failed."
                fi
              else
                echo "QA output file missing."
              fi
              echo '```'
              echo ""
              echo "</details>"
            } > qa-results/report.md
          fi
          if ! grep -q '^## QA Report' qa-results/report.md; then
            tmp=$(mktemp)
            { echo "## QA Report"; echo; cat qa-results/report.md; } > "$tmp"
            mv "$tmp" qa-results/report.md
          fi
          node scripts/ci/redact-qa-artifacts.mjs qa-results

      - name: Finalize sanitized QA artifacts
        if: always()
        id: qa_artifacts
        run: |
          set -euo pipefail
          mkdir -p qa-results
          if [[ ! -f qa-results/report.md ]]; then
            {
              echo "## QA Report"
              echo ""
              echo ":no_entry: BLOCKED -- QA report missing before artifact finalization."
            } > qa-results/report.md
          fi
          if ! node scripts/ci/redact-qa-artifacts.mjs qa-results; then
            rm -rf qa-results
            echo "::error::QA artifact redaction failed; qa-results removed before upload/comment publication."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload QA artifacts
        if: always() && steps.qa_artifacts.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: qa-results-${{ github.run_number }}
          path: qa-results/**
          retention-days: 14

      - name: Post QA report as PR comment
        if: always() && steps.qa_artifacts.outputs.ready == 'true' && steps.pr.outputs.number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ env.GH_TOKEN }}
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require('fs');
            const pr = Number(process.env.PR_NUMBER);
            const runUrl = process.env.RUN_URL;
            const marker = '<!-- qa-report -->';
            const reportPath = 'qa-results/report.md';
            let report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '## QA Report\n\n:no_entry: BLOCKED -- report missing.';
            if (!report.startsWith('## QA Report')) {
              report = `## QA Report\n\n${report}`;
            }
            const body = `${marker}\n${report}\n\n---\nArtifacts: see \`qa-results-${process.env.GITHUB_RUN_NUMBER || ''}\` in the workflow run.\nWorkflow run: ${runUrl}\n`;

            // REST issue-comment reads and writes can return 503 for very large PRs.
            // Keep discovery and mutation on GraphQL so the QA result remains reportable.
            let before = null;
            let existing = null;
            let subjectId = null;
            do {
              const result = await github.graphql(`
                query QAComment($owner: String!, $repo: String!, $number: Int!, $before: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id
                      comments(last: 100, before: $before) {
                        nodes { id body }
                        pageInfo { hasPreviousPage startCursor }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pr,
                before,
              });
              const pullRequest = result.repository.pullRequest;
              subjectId = pullRequest.id;
              const page = pullRequest.comments;
              existing = page.nodes.find(comment => comment.body.startsWith(marker));
              before = page.pageInfo.hasPreviousPage ? page.pageInfo.startCursor : null;
            } while (!existing && before);

            if (existing) {
              await github.graphql(`
                mutation UpdateQAComment($id: ID!, $body: String!) {
                  updateIssueComment(input: {id: $id, body: $body}) {
                    issueComment { id }
                  }
                }
              `, { id: existing.id, body });
            } else {
              await github.graphql(`
                mutation CreateQAComment($subjectId: ID!, $body: String!) {
                  addComment(input: {subjectId: $subjectId, body: $body}) {
                    commentEdge { node { id } }
                  }
                }
              `, { subjectId, body });
            }

      - name: Honest conclusion
        if: always()
        env:
          QA_PR_SAFE_OUTCOME: ${{ steps.qa_pr_safe.outcome }}
          QA_SECRET_OUTCOME: ${{ steps.qa_secret.outcome }}
          QA_ARTIFACTS_READY: ${{ steps.qa_artifacts.outputs.ready }}
        run: |
          set -euo pipefail
          qa_step_outcome="${QA_SECRET_OUTCOME:-}"
          if [[ -z "$qa_step_outcome" || "$qa_step_outcome" == "skipped" ]]; then
            qa_step_outcome="${QA_PR_SAFE_OUTCOME:-}"
          fi
          if [[ "${QA_ARTIFACTS_READY}" != "true" ]]; then
            echo "::error::Functional QA artifacts were not published because redaction did not complete successfully."
            exit 1
          fi
          if [[ "$qa_step_outcome" != "success" ]]; then
            echo "::error::Functional QA did not complete (step outcome: ${qa_step_outcome:-none}). The PR comment/artifacts have details."
            exit 1
          fi
          node scripts/ci/verify-functional-qa-report.mjs qa-results/report.md
          echo "Functional QA passed."
