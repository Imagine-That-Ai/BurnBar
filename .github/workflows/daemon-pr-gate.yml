name: Daemon PR Gate (Swift)

# Focused, merge-blocking lane for the OpenBurnBar daemon: the :8317
# OpenAI-compatible proxy (OpenBurnBarHTTPGatewayServer), the provider
# router/executor, and quota gating all live in the OpenBurnBarDaemon package.
#
# The FULL Swift suite (Core + Daemon + app XCTest) runs post-merge / nightly in
# openburnbar-pr-harness.yml, which is deliberately off the PR path for velocity.
# That left daemon correctness with no merge-blocking signal. This lane runs ONLY
# the daemon package on every PR (Core suite skipped) so a routing / quota /
# proxy regression cannot merge, without paying for the whole Swift suite per PR.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: daemon-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    uses: ./.github/workflows/ci-impact.yml

  daemon-swift:
    name: Daemon Swift tests (proxy + router + quota)
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    # Cold cache + libsignal FFI build on a slow runner needs headroom; the
    # daemon package alone is far lighter than the full Swift suite (~40 min cap).
    timeout-minutes: 40
    needs: classify
    if: needs.classify.outputs.daemon == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0"

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Run daemon Swift tests (Core suite skipped)
        # OPENBURNBAR_SKIP_CORE_SWIFT_TESTS=1 runs only the OpenBurnBarDaemon
        # package; the script still builds the host libsignal FFI the daemon needs.
        env:
          OPENBURNBAR_SKIP_CORE_SWIFT_TESTS: "1"
        run: ./scripts/test-openburnbar-swift.sh

  # ── Release-build verification ───────────────────────────────────────────
  # The security gates on F-RR06-001/002 rely on `#if DEBUG` / `#else` compile
  # branches. Unit tests inject `isDebugBuild: false` to simulate release
  # behavior, but that does NOT prove the `#else` branch compiles or that
  # debug-only escape hatches are absent from a real release binary. This job
  # builds the daemon executable in release mode and verifies the
  # `--gateway-allow-unauthenticated-loopback` flag is absent from `--help`
  # output, proving the compile gate works in a real release build.
  release-build-verification:
    name: Release build (debug-only escape hatches compiled out)
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    timeout-minutes: 40
    needs: classify
    if: needs.classify.outputs.daemon == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0"

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Build daemon executable in release mode
        run: |
          cd OpenBurnBarDaemon && swift build -c release --target OpenBurnBarDaemonExecutable

      - name: Verify debug-only escape hatches are absent from release binary
        run: |
          set -euo pipefail
          BINARY="OpenBurnBarDaemon/.build/release/OpenBurnBarDaemon"
          HELP_OUTPUT="$("$BINARY" --help 2>&1 || true)"

          # The unauthenticated-loopback flag must NOT appear in release help.
          if echo "$HELP_OUTPUT" | grep -q "gateway-allow-unauthenticated-loopback"; then
            echo "::error::Release binary help output contains --gateway-allow-unauthenticated-loopback (should be compiled out)"
            exit 1
          fi

          # The debugOnlyArgument error message must NOT appear in release help.
          if echo "$HELP_OUTPUT" | grep -q "debugOnlyArgument"; then
            echo "::error::Release binary help output contains debugOnlyArgument text"
            exit 1
          fi

          echo "Release build verification passed: debug-only escape hatches are compiled out."

  daemon-pr-gate:
    name: Daemon PR Gate
    needs: [classify, daemon-swift, release-build-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected daemon floor
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          REQUIRED: ${{ needs.classify.outputs.daemon }}
          TEST_RESULT: ${{ needs.daemon-swift.result }}
          RELEASE_RESULT: ${{ needs.release-build-verification.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFIER_RESULT" == "success" ]] || { echo "::error::Impact classifier failed."; exit 1; }
          expected=skipped; [[ "$REQUIRED" == "true" ]] && expected=success
          for result in "$TEST_RESULT" "$RELEASE_RESULT"; do
            [[ "$result" == "$expected" ]] || { echo "::error::Daemon prerequisite ended $result; expected $expected."; exit 1; }
          done
