name: Linux Nightly Matrix

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: linux-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-matched-performance:
    name: macOS 30-minute matched workload soak
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      macos_artifact_name: ${{ steps.select-macos-performance-artifact.outputs.artifact_name }}
    env:
      OB_EVIDENCE_OUT: ${{ github.workspace }}/.linux-matched-performance
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Capture macOS nightly matched workload soak
        run: node scripts/linux-port/run-matched-performance.mjs --macos-only --profile nightly

      - name: Upload macOS nightly matched workload soak
        id: upload-macos-performance-primary
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: linux-parity-macos-performance-nightly
          path: ${{ env.OB_EVIDENCE_OUT }}/matched-performance-macos.json
          if-no-files-found: error

      - name: Retry macOS nightly matched workload soak upload
        id: upload-macos-performance-retry
        if: steps.upload-macos-performance-primary.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: linux-parity-macos-performance-nightly-retry-${{ github.run_id }}
          path: ${{ env.OB_EVIDENCE_OUT }}/matched-performance-macos.json
          if-no-files-found: error

      - name: Select uploaded macOS nightly matched workload soak
        id: select-macos-performance-artifact
        if: always()
        env:
          PRIMARY_OUTCOME: ${{ steps.upload-macos-performance-primary.outcome }}
          RETRY_OUTCOME: ${{ steps.upload-macos-performance-retry.outcome }}
          PRIMARY_NAME: linux-parity-macos-performance-nightly
          RETRY_NAME: linux-parity-macos-performance-nightly-retry-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PRIMARY_OUTCOME" == "success" ]]; then
            echo "artifact_name=$PRIMARY_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RETRY_OUTCOME" == "success" ]]; then
            echo "artifact_name=$RETRY_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Neither macOS matched-performance artifact upload succeeded." >&2
          exit 1

  linux-matched-performance:
    name: Linux 30-minute matched workload soak and comparison
    runs-on: ubuntu-24.04-arm
    needs: [macos-matched-performance]
    timeout-minutes: 50
    env:
      OB_EVIDENCE_OUT: ${{ github.workspace }}/.linux-matched-performance
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Download macOS nightly matched workload soak
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.macos-matched-performance.outputs.macos_artifact_name }}
          path: ${{ runner.temp }}/openburnbar-macos-performance

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Run Linux nightly matched workload soak and comparison
        run: >
          node scripts/linux-port/run-matched-performance.mjs
          --profile nightly
          --macos-input "${{ runner.temp }}/openburnbar-macos-performance/matched-performance-macos.json"

      - name: Upload nightly matched performance evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: linux-parity-matched-performance-nightly
          path: ${{ env.OB_EVIDENCE_OUT }}/
          if-no-files-found: error
          include-hidden-files: true

  linux-surface:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04-arm
    needs: [linux-matched-performance]
    timeout-minutes: 75
    env:
      OPENBURNBAR_LINUX_EVIDENCE_OUT: ${{ github.workspace }}/.linux-evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-gnome-x11-xvfb
            mode: runnable
            smoke: shell
          - label: ubuntu-gnome-wayland-portal
            mode: blocked
            reason: GitHub hosted runner has no interactive GNOME Wayland session bus or xdg-desktop-portal consent surface.
          - label: fedora-kde-wayland
            mode: blocked
            reason: GitHub hosted runner is Ubuntu; Fedora KDE Wayland needs a dedicated VM or nested compositor runner.
          - label: arch-wlroots
            mode: blocked
            reason: GitHub hosted runner is Ubuntu; Arch/wlroots needs a dedicated VM or nested compositor runner.

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Record blocked environment row
        if: matrix.mode == 'blocked'
        run: |
          set -euo pipefail
          mkdir -p "$OPENBURNBAR_LINUX_EVIDENCE_OUT/nightly/${{ matrix.label }}"
          cat > "$OPENBURNBAR_LINUX_EVIDENCE_OUT/nightly/${{ matrix.label }}/blocked.json" <<'JSON'
          {
            "label": "${{ matrix.label }}",
            "status": "infra-failed",
            "failureClass": "infra",
            "reasonCode": "linux-environment-unavailable",
            "reason": "${{ matrix.reason }}",
            "requiredBeforePromotion": "Rerun shell, daemon, portal, package, Computer Use, and media smokes on a real matching desktop environment."
          }
          JSON
          echo "::error::reasonCode=linux-environment-unavailable. ${{ matrix.reason }}"
          exit 3

      - name: Install Linux desktop dependencies
        if: matrix.mode == 'runnable'
        run: npm ci --prefix apps/linux-desktop

      - name: Build mission Linux toolchain image
        if: matrix.mode == 'runnable'
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Run Linux Swift package tests
        if: matrix.mode == 'runnable'
        run: |
          mkdir -p "$OPENBURNBAR_LINUX_EVIDENCE_OUT"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$OPENBURNBAR_LINUX_EVIDENCE_OUT:/evidence" \
            -w /workspace \
            --env OPENBURNBAR_LINUX_SWIFT_TEST_RESULTS=/evidence/linux-swift-tests \
            openburnbar-linux-toolchain:mission-001 \
            bash scripts/linux-port/run-linux-swift-tests.sh

      - name: Download nightly matched performance evidence
        if: matrix.mode == 'runnable'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: linux-parity-matched-performance-nightly
          path: ${{ runner.temp }}/openburnbar-matched-performance

      - name: Run shell smoke
        if: matrix.mode == 'runnable' && matrix.smoke == 'shell'
        env:
          OB_EVIDENCE_OUT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}
          OB_MATCHED_PERF_PROFILE: nightly
          OB_MATCHED_MACOS_INPUT: ${{ runner.temp }}/openburnbar-matched-performance/matched-performance-macos.json
          OB_MATCHED_LINUX_INPUT: ${{ runner.temp }}/openburnbar-matched-performance/matched-performance-linux.json
        run: node scripts/linux-port/run-shell-smoke.mjs

      - name: Run package release structural checks
        if: matrix.mode == 'runnable'
        run: |
          node scripts/linux-port/validate-linux-release-config.mjs
          node scripts/linux-port/validate-parity-ledger.mjs --allow-blocked
          node scripts/linux-port/render-parity-ledger.mjs --check
          node scripts/linux-port/check-linux-docs.mjs

      - name: Upload Linux nightly evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-nightly-${{ matrix.label }}
          path: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/
          include-hidden-files: true
          if-no-files-found: warn

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [macos-matched-performance, linux-matched-performance, linux-surface]
    if: >-
      always() &&
      (
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled') ||
        contains(needs.*.result, 'skipped')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record Linux nightly failure
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: linux-nightly
          title-prefix: Linux nightly matrix failed
          summary: The Linux desktop/package evidence matrix failed.
          details: |
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}
