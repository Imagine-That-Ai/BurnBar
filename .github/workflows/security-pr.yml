name: PR Security Gate

# Fast (<3 min) security checks that run on every pull request.
# These replace CodeQL on PRs — CodeQL runs nightly (see codeql.yml).
#
# Checks:
#   1. Secret detection via gitleaks
#   2. GitHub Dependency Review (blocks PRs that introduce known CVEs)
#   3. npm audit on functions + extension (high/critical only)
#   4. OSV-Scanner on package-lock.json files
#
# All checks must pass before merge. Branch protection should require
# the "security-pr / Secret Detection", "security-pr / Dependency Review",
# and "security-pr / npm Audit" status checks.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  secret-detection:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.30.1"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . \
            --redact \
            --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review (CVE check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: GitHub Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Allow known-safe license exceptions
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense
          # Deny packages that have been deprecated or yanked
          deny-packages: ''
          comment-summary-in-pr: always

  npm-audit:
    name: npm Audit (functions + extension)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Audit functions dependencies
        run: |
          set -euo pipefail
          echo "==> npm audit: functions"
          npm audit --prefix functions --audit-level=high --json 2>/dev/null \
            | node -e "
                const r=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const vulns=r.vulnerabilities||{};
                const high=Object.values(vulns).filter(v=>v.severity==='high'||v.severity==='critical');
                if(high.length>0){
                  console.error('High/critical vulnerabilities found:');
                  high.forEach(v=>console.error('  '+v.name+': '+v.severity));
                  process.exit(1);
                }
                console.log('No high/critical vulnerabilities in functions.');
              " || (echo "::error::npm audit found high/critical vulnerabilities in functions" && exit 1)

      - name: Audit extension dependencies
        run: |
          set -euo pipefail
          echo "==> npm audit: extensions/openburnbar"
          npm audit --prefix extensions/openburnbar --audit-level=high --json 2>/dev/null \
            | node -e "
                const r=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const vulns=r.vulnerabilities||{};
                const high=Object.values(vulns).filter(v=>v.severity==='high'||v.severity==='critical');
                if(high.length>0){
                  console.error('High/critical vulnerabilities found:');
                  high.forEach(v=>console.error('  '+v.name+': '+v.severity));
                  process.exit(1);
                }
                console.log('No high/critical vulnerabilities in extension.');
              " || (echo "::error::npm audit found high/critical vulnerabilities in extension" && exit 1)

  osv-scanner:
    name: OSV Scanner (open source vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=functions/package-lock.json
            --lockfile=extensions/openburnbar/package-lock.json
