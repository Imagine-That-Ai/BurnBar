name: Publish Android to Google Play

permissions:
  contents: read
  attestations: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing canonical v* release tag whose signed AAB will be published"
        required: true
        type: string
      track:
        description: "Google Play track"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      confirm_non_internal:
        description: "Required explicit confirmation for alpha, beta, or production"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Verify and seal the exact AAB without authenticating or uploading"
        required: true
        type: boolean
        default: true
      release_status:
        description: "Play release status; draft is the safe default"
        required: true
        type: choice
        default: draft
        options:
          - draft
          - completed
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      track:
        required: false
        type: string
        default: internal
      confirm_non_internal:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: true
      release_status:
        required: false
        type: string
        default: draft
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      publication_manifest_artifact:
        description: "Checksum-sealed preparation artifact"
        value: ${{ jobs.prepare-google-play-publication.outputs.artifact_name }}
      receipt_artifact:
        description: "Google Play upload receipt artifact; empty for dry-runs"
        value: ${{ jobs.publish-google-play.outputs.receipt_artifact }}
      edit_id:
        description: "Committed Android Publisher edit ID; empty for dry-runs"
        value: ${{ jobs.publish-google-play.outputs.edit_id }}
      version_code:
        description: "Uploaded Play version code; empty for dry-runs"
        value: ${{ jobs.publish-google-play.outputs.version_code }}

concurrency:
  group: google-play-${{ inputs.tag }}-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  prepare-google-play-publication:
    name: Verify and seal exact signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.inspect.outputs.version_code }}
      aab_sha256: ${{ steps.inspect.outputs.aab_sha256 }}
    steps:
      - name: Check out the exact approved workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release tag and policy
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          CONFIRM_NON_INTERNAL: ${{ inputs.confirm_non_internal }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          set -euo pipefail
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/publish-google-play.yml@refs/heads/main"
          if [[ "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo "::error::Google Play publishing must execute the reviewed workflow from protected main."
            echo "::error::Expected $expected_workflow_ref, got $GITHUB_WORKFLOW_REF."
            exit 1
          fi
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$checked_out_commit" != "$GITHUB_WORKFLOW_SHA" ]]; then
            echo "::error::Checked-out commit $checked_out_commit does not match the executing workflow revision $GITHUB_WORKFLOW_SHA."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          if [[ ! "$TRACK" =~ ^(internal|alpha|beta|production)$ ]]; then
            echo "::error::Unsupported Google Play track: $TRACK"
            exit 1
          fi
          if [[ "$TRACK" != "internal" && "$CONFIRM_NON_INTERNAL" != "true" ]]; then
            echo "::error::Non-internal tracks require confirm_non_internal=true."
            exit 1
          fi
          if [[ "$TAG" == *-* && "$TRACK" != "internal" ]]; then
            echo "::error::Prerelease tags may only target the internal track."
            exit 1
          fi
          if [[ ! "$RELEASE_STATUS" =~ ^(draft|completed)$ ]]; then
            echo "::error::Unsupported release status: $RELEASE_STATUS"
            exit 1
          fi
          git fetch --force --tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Release tag $TAG is not reachable from protected main."
            exit 1
          fi
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$TAG" "${TAG#v}" "$commit" >> "$GITHUB_OUTPUT"

      - name: Download exact signed AAB from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/google-play-input"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "OpenBurnBar-${VERSION}-Android.aab" \
            --dir "$RUNNER_TEMP/google-play-input"
          test -s "$RUNNER_TEMP/google-play-input/OpenBurnBar-${VERSION}-Android.aab"

      - name: Verify exact release-workflow attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/google-play-input/OpenBurnBar-${VERSION}-Android.aab"
          commit="$COMMIT"
          gh attestation verify "$aab" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$commit" \
            --source-ref "refs/tags/$TAG" \
            --signer-digest "$commit" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://openburnbar.dev/attestations/domain-core-release-artifact/v2 \
            --format json > "$RUNNER_TEMP/google-play-input/attestation-verification.json"
          jq -e 'type == "array" and length > 0' \
            "$RUNNER_TEMP/google-play-input/attestation-verification.json" >/dev/null

      - name: Set up Java 21 for AAB verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify package, version, version code, and upload certificate
        id: inspect
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/google-play-input/OpenBurnBar-${VERSION}-Android.aab"
          approved_fingerprint="$(tr -d '[:space:]' < config/android-upload-certificate.sha256)"
          [[ "$approved_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          certificate_output="$(keytool -printcert -jarfile "$aab" 2>&1)"
          signer_count="$(grep -Ec '^Signer #[0-9]+:' <<<"$certificate_output" || true)"
          [[ "$signer_count" == "1" ]] || { echo "::error::Expected exactly one AAB signer."; exit 1; }
          signer_fingerprint="$(awk '
            /^Signer #1:/ { in_signer = 1; next }
            /^Signer #[0-9]+:/ { in_signer = 0 }
            in_signer && /^Certificate #1:/ { in_certificate = 1; next }
            in_signer && in_certificate && /^[[:space:]]*SHA256:/ {
              sub(/^[[:space:]]*SHA256:[[:space:]]*/, "")
              print
              exit
            }
          ' <<<"$certificate_output" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$signer_fingerprint" == "$approved_fingerprint" ]] || {
            echo "::error::AAB signer does not match the approved upload certificate."
            exit 1
          }
          verify_output="$(jarsigner -verify -verbose -certs "$aab" 2>&1)"
          printf '%s\n' "$verify_output"
          grep -Fq "jar verified." <<<"$verify_output" || {
            echo "::error::AAB JAR signature verification did not succeed."
            exit 1
          }

          bundletool_version="1.18.3"
          bundletool_sha256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          bundletool="$RUNNER_TEMP/bundletool-all-${bundletool_version}.jar"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$bundletool" \
            "https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar"
          printf '%s  %s\n' "$bundletool_sha256" "$bundletool" | sha256sum --check --strict
          java -jar "$bundletool" validate --bundle="$aab"
          package_name="$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@package)"
          version_name="$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)"
          version_code="$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)"
          [[ "$package_name" == "com.openburnbar" ]] || { echo "::error::Unexpected package: $package_name"; exit 1; }
          [[ "$version_name" == "$VERSION" ]] || { echo "::error::Unexpected versionName: $version_name"; exit 1; }
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid versionCode: $version_code"; exit 1; }
          aab_sha256="$(sha256sum "$aab" | awk '{print $1}')"
          {
            echo "package_name=$package_name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "aab_sha256=$aab_sha256"
            echo "upload_certificate_sha256=$signer_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable publication manifest and seal
        id: seal
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          TRACK: ${{ inputs.track }}
          CONFIRM_NON_INTERNAL: ${{ inputs.confirm_non_internal }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          PACKAGE_NAME: ${{ steps.inspect.outputs.package_name }}
          VERSION_CODE: ${{ steps.inspect.outputs.version_code }}
          AAB_SHA256: ${{ steps.inspect.outputs.aab_sha256 }}
          UPLOAD_CERTIFICATE_SHA256: ${{ steps.inspect.outputs.upload_certificate_sha256 }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/google-play-input"
          stage="$RUNNER_TEMP/google-play-prepared"
          mkdir "$stage"
          aab="OpenBurnBar-${VERSION}-Android.aab"
          mv "$input/$aab" "$stage/$aab"
          mv "$input/attestation-verification.json" "$stage/attestation-verification.json"
          cp scripts/ci/google-play-safe-retry.mjs "$stage/google-play-safe-retry.mjs"
          node scripts/ci/google-play-publication.mjs prepare \
            --artifact "$stage/$aab" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --track "$TRACK" \
            --confirm-non-internal "$CONFIRM_NON_INTERNAL" \
            --dry-run "$DRY_RUN" \
            --release-status "$RELEASE_STATUS" \
            --package "$PACKAGE_NAME" \
            --version-name "$VERSION" \
            --version-code "$VERSION_CODE" \
            --sha256 "$AAB_SHA256" \
            --upload-certificate-sha256 "$UPLOAD_CERTIFICATE_SHA256" \
            --prepared-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$stage/google-play-publication.json"
          (cd "$stage" && sha256sum "$aab" attestation-verification.json google-play-publication.json google-play-safe-retry.mjs > SHA256SUMS)
          artifact_name="google-play-prepared-${COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload checksum-sealed publication candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/google-play-prepared/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize validation-only result
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          TRACK: ${{ inputs.track }}
          VERSION_CODE: ${{ steps.inspect.outputs.version_code }}
          AAB_SHA256: ${{ steps.inspect.outputs.aab_sha256 }}
        run: |
          {
            echo "## Google Play validation complete"
            echo
            echo "- No Google credentials were used and no upload occurred."
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Track: \`$TRACK\`"
            echo "- Version code: \`$VERSION_CODE\`"
            echo "- AAB SHA-256: \`$AAB_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-google-play:
    name: Publish sealed AAB through protected release environment
    needs: prepare-google-play-publication
    if: ${{ needs.prepare-google-play-publication.result == 'success' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: none
    outputs:
      receipt_artifact: ${{ steps.receipt.outputs.artifact_name }}
      edit_id: ${{ steps.publish.outputs.edit_id }}
      version_code: ${{ steps.publish.outputs.version_code }}
    steps:
      - name: Download checksum-sealed publication candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          name: ${{ needs.prepare-google-play-publication.outputs.artifact_name }}
          path: ${{ runner.temp }}/google-play-prepared

      - name: Verify immutable prepared publication
        env:
          EXPECTED_COMMIT: ${{ needs.prepare-google-play-publication.outputs.commit }}
          EXPECTED_TAG: ${{ needs.prepare-google-play-publication.outputs.tag }}
          EXPECTED_VERSION_CODE: ${{ needs.prepare-google-play-publication.outputs.version_code }}
          EXPECTED_AAB_SHA256: ${{ needs.prepare-google-play-publication.outputs.aab_sha256 }}
          EXPECTED_TRACK: ${{ inputs.track }}
          EXPECTED_RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/google-play-prepared"
          test -s "$stage/SHA256SUMS"
          if find "$stage" -type l -o \( ! -type d ! -type f \) | grep -q .; then
            echo "::error::Prepared publication contains a symlink or special file."
            exit 1
          fi
          if find "$stage" -type f -links +1 | grep -q .; then
            echo "::error::Prepared publication contains a hard-linked file."
            exit 1
          fi
          (cd "$stage" && sha256sum --check --strict SHA256SUMS)
          manifest="$stage/google-play-publication.json"
          jq -e \
            --arg commit "$EXPECTED_COMMIT" \
            --arg tag "$EXPECTED_TAG" \
            --arg versionCode "$EXPECTED_VERSION_CODE" \
            --arg sha256 "$EXPECTED_AAB_SHA256" \
            --arg track "$EXPECTED_TRACK" \
            --arg status "$EXPECTED_RELEASE_STATUS" '
              .schemaVersion == 1
              and .publication.packageName == "com.openburnbar"
              and .publication.dryRun == false
              and .publication.track == $track
              and .publication.releaseStatus == $status
              and .release.commit == $commit
              and .release.tag == $tag
              and (.release.versionCode | tostring) == $versionCode
              and .artifact.sha256 == $sha256
              and .release.signerWorkflow == ".github/workflows/release.yml"
              and .preparation.workflow == ".github/workflows/publish-google-play.yml"
            ' "$manifest" >/dev/null

      - name: Authenticate with the existing Play publisher service account
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Safely publish or verify the exact existing release
        id: publish
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          set +x
          stage="$RUNNER_TEMP/google-play-prepared"
          manifest="$stage/google-play-publication.json"
          aab="$stage/$(jq -er '.artifact.fileName' "$manifest")"
          provider_result="$RUNNER_TEMP/google-play-provider-result.json"
          node "$stage/google-play-safe-retry.mjs" \
            --manifest "$manifest" \
            --aab "$aab" \
            --output "$provider_result"
          edit_id="$(jq -r '.committedEditId // ""' "$provider_result")"
          version_code="$(jq -er '.versionCode | tostring' "$provider_result")"
          action="$(jq -er '.action' "$provider_result")"
          {
            echo "edit_id=$edit_id"
            echo "version_code=$version_code"
            echo "action=$action"
          } >> "$GITHUB_OUTPUT"

      - name: Write durable Google Play receipt
        id: receipt
        env:
          EDIT_ID: ${{ steps.publish.outputs.edit_id }}
          VERSION_CODE: ${{ steps.publish.outputs.version_code }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/google-play-prepared"
          manifest="$stage/google-play-publication.json"
          receipt_dir="$RUNNER_TEMP/google-play-receipt"
          mkdir "$receipt_dir"
          receipt="$receipt_dir/google-play-upload-receipt.json"
          jq -n \
            --slurpfile manifest "$manifest" \
            --slurpfile provider "$RUNNER_TEMP/google-play-provider-result.json" \
            --arg editId "$EDIT_ID" \
            --arg versionCode "$VERSION_CODE" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" '{
              schemaVersion: 1,
              provider: "google-play-android-publisher-v3",
              packageName: $manifest[0].publication.packageName,
              track: $manifest[0].publication.track,
              requestedReleaseStatus: $manifest[0].publication.releaseStatus,
              releaseStatus: $provider[0].readback.status,
              tag: $manifest[0].release.tag,
              commit: $manifest[0].release.commit,
              versionName: $manifest[0].release.versionName,
              versionCode: ($versionCode | tonumber),
              aabSha256: $manifest[0].artifact.sha256,
              uploadCertificateSha256: $manifest[0].artifact.uploadCertificateSha256,
              editId: $editId,
              recordedAt: $recordedAt,
              committedAt: (if $provider[0].committed then $recordedAt else null end),
              workflowRun: {id: $runId, attempt: $runAttempt},
              action: $provider[0].action,
              uploaded: $provider[0].uploaded,
              committed: $provider[0].committed,
              priorVersionCodes: $provider[0].priorVersionCodes,
              readback: $provider[0].readback,
              providerResponses: $provider[0].providerResponses
            }' > "$receipt"
          artifact_name="google-play-receipt-${{ needs.prepare-google-play-publication.outputs.commit }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload durable Google Play receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/google-play-receipt/google-play-upload-receipt.json
          if-no-files-found: error
          retention-days: 400

      - name: Summarize committed Google Play publication
        env:
          EDIT_ID: ${{ steps.publish.outputs.edit_id }}
          VERSION_CODE: ${{ steps.publish.outputs.version_code }}
          ACTION: ${{ steps.publish.outputs.action }}
          TAG: ${{ needs.prepare-google-play-publication.outputs.tag }}
          COMMIT: ${{ needs.prepare-google-play-publication.outputs.commit }}
          TRACK: ${{ inputs.track }}
        run: |
          {
            if [[ "$ACTION" == "already_current" ]]; then
              echo "## Google Play publication already current"
            else
              echo "## Google Play publication committed"
            fi
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Track: \`$TRACK\`"
            echo "- Version code: \`$VERSION_CODE\`"
            echo "- Action: \`$ACTION\`"
            if [[ -n "$EDIT_ID" ]]; then
              echo "- Committed edit ID: \`$EDIT_ID\`"
            else
              echo "- Store mutation: none (exact completed release already current)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
