name: CI impact classifier

on:
  workflow_call:
    outputs:
      full:
        value: ${{ jobs.classify.outputs.full }}
      reason:
        value: ${{ jobs.classify.outputs.reason }}
      macos:
        value: ${{ jobs.classify.outputs.macos }}
      mobile:
        value: ${{ jobs.classify.outputs.mobile }}
      android:
        value: ${{ jobs.classify.outputs.android }}
      rust:
        value: ${{ jobs.classify.outputs.rust }}
      daemon:
        value: ${{ jobs.classify.outputs.daemon }}
      functions:
        value: ${{ jobs.classify.outputs.functions }}
      web:
        value: ${{ jobs.classify.outputs.web }}
      console:
        value: ${{ jobs.classify.outputs.console }}

permissions:
  contents: read

jobs:
  classify:
    name: Deterministic changed-path classification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.impact.outputs.full }}
      reason: ${{ steps.impact.outputs.reason }}
      macos: ${{ steps.impact.outputs.macos }}
      mobile: ${{ steps.impact.outputs.mobile }}
      android: ${{ steps.impact.outputs.android }}
      rust: ${{ steps.impact.outputs.rust }}
      daemon: ${{ steps.impact.outputs.daemon }}
      functions: ${{ steps.impact.outputs.functions }}
      web: ${{ steps.impact.outputs.web }}
      console: ${{ steps.impact.outputs.console }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: false
      - id: impact
        name: Classify exact candidate diff (fail closed)
        run: node scripts/ci/classify-ci-impact.mjs
