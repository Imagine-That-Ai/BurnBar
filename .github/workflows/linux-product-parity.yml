      - name: Capture P-34 credential security proof
        if: inputs.requirement == 'P-34'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
