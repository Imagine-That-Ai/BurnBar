name: Linux product parity evidence

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: Canonical product requirement id
        required: true
        type: choice
        options:
          - P-01
          - P-02
          - P-03
          - P-04
          - P-05
          - P-06
          - P-07
          - P-08
          - P-09
          - P-10
          - P-11
          - P-12
          - P-13
          - P-14
          - P-15
          - P-16
          - P-17
          - P-18
          - P-19
          - P-20
          - P-21
          - P-22
          - P-23
          - P-24
          - P-25
          - P-26
          - P-27
          - P-28
          - P-29
          - P-30
          - P-31
          - P-32
          - P-33
          - P-34
          - P-35
          - P-36
          - P-37
          - P-38
          - P-39
          - P-40
      environment:
        description: Exact installed Linux environment
        required: true
        type: choice
        options:
          - ubuntu-24.04-gnome-x11-x86_64
          - ubuntu-24.04-gnome-x11-aarch64
          - ubuntu-24.04-gnome-wayland-x86_64
          - ubuntu-24.04-gnome-wayland-aarch64
          - fedora-kde-wayland-x86_64
          - fedora-kde-wayland-aarch64
          - arch-sway-wayland-x86_64
      candidate_run_id:
        description: Successful first-attempt Linux Release Candidate run at this exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: linux-product-parity-${{ github.sha }}-${{ inputs.requirement }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  p39-macos-producer:
    name: P-39 macOS parser corpus producer
    if: inputs.requirement == 'P-39'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the exact evidence source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Resolve the trusted immutable release evidence artifact
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET_HEAD: ${{ github.sha }}
        run: >-
          node scripts/linux-port/resolve-product-evidence-run.mjs
          --run-id "$CANDIDATE_RUN_ID"
          --target-head "$TARGET_HEAD"

      - name: Download exact candidate closure for version binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact_id }}
          repository: Imagine-That-Ai/BurnBar
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/openburnbar-p39-candidate

      - name: Capture real macOS candidate-bound parser output
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/openburnbar-p39-candidate"
          output_root="$RUNNER_TEMP/openburnbar-p39-platform"
          mkdir -p "$output_root"
          test -f "$candidate_root/.linux-release/product-proof-closure.json"
          node scripts/linux-port/capture-p39-platform-evidence.mjs \
            --platform macos \
            --output "$output_root/macos-platform-evidence.json" \
            --report "$output_root/macos-platform-producer-run.json" \
            --candidate-closure "$candidate_root/.linux-release/product-proof-closure.json" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Upload P-39 macOS platform evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-p39-macos-platform-evidence
          path: ${{ runner.temp }}/openburnbar-p39-platform/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  validate:
    name: ${{ inputs.requirement }} on ${{ inputs.environment }}
    needs: [p39-macos-producer]
    if: always() && (inputs.requirement != 'P-39' || needs.p39-macos-producer.result == 'success')
    runs-on:
      - self-hosted
      - linux
      - ${{ inputs.environment }}
    timeout-minutes: 90
    steps:
      - name: Check out the exact evidence source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Linux evidence contract dependencies
        run: npm ci --prefix scripts/linux-port --ignore-scripts

      - name: Resolve the trusted immutable release evidence artifact
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET_HEAD: ${{ github.sha }}
        run: >-
          node scripts/linux-port/resolve-product-evidence-run.mjs
          --run-id "$CANDIDATE_RUN_ID"
          --target-head "$TARGET_HEAD"

      - name: Download exact-candidate installed evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact_id }}
          repository: Imagine-That-Ai/BurnBar
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: docs/linux-port/evidence/product-parity-inputs/${{ inputs.requirement }}/${{ inputs.environment }}

      - name: Download P-39 macOS platform evidence
        if: inputs.requirement == 'P-39'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-p39-macos-platform-evidence
          path: docs/linux-port/evidence/product-parity-inputs/${{ inputs.requirement }}/${{ inputs.environment }}

      - name: Capture P-38 release automation verification
        if: inputs.requirement == 'P-38'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/capture-p38-release-automation.mjs \
            --input-root "$input_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Capture parity certification preflight
        id: p02_capture
        if: inputs.requirement == 'P-02'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          diagnostic_root="$(mktemp -d "${RUNNER_TEMP}/openburnbar-p02.XXXXXX")"
          printf 'diagnostic_root=%s\n' "$diagnostic_root" >> "$GITHUB_OUTPUT"
          capture_log="$diagnostic_root/capture.log"
          node scripts/linux-port/capture-parity-certification-preflight.mjs \
            --input-root "$input_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --diagnostic-root "$diagnostic_root" \
            2>&1 | tee "$capture_log"

      - name: Preserve non-promotable P-02 diagnostic evidence
        if: always() && inputs.requirement == 'P-02'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-product-parity-diagnostic-${{ github.sha }}-${{ inputs.candidate_run_id }}-${{ inputs.environment }}
          path: |
            docs/linux-port/evidence/product-parity-inputs/P-02/${{ inputs.environment }}/feature-artifacts/parity-certification-preflight.json
            docs/linux-port/evidence/product-parity-inputs/P-02/${{ inputs.environment }}/feature-proof-registration.json
            ${{ steps.p02_capture.outputs.diagnostic_root }}/capture-failure.json
            ${{ steps.p02_capture.outputs.diagnostic_root }}/capture.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Install P-06 signed candidate package
        id: p06_install
        if: inputs.requirement == 'P-06'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          case "$ENVIRONMENT_ID" in
            ubuntu-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo arm64 ;; *) echo amd64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(dpkg-deb -f "$candidate" Package)" = open-burn-bar || continue
                test "$(dpkg-deb -f "$candidate" Architecture)" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.deb' -print | sort)
              test -n "$package"
              version="$(dpkg-deb -f "$package" Version)"
              sudo apt-get install -y --reinstall "$package"
              ;;
            fedora-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo aarch64 ;; *) echo x86_64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(rpm -qp --qf '%{NAME}' "$candidate")" = open-burn-bar || continue
                test "$(rpm -qp --qf '%{ARCH}' "$candidate")" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.rpm' -print | sort)
              test -n "$package"
              version="$(rpm -qp --qf '%{VERSION}' "$package")"
              sudo dnf install -y "$package"
              ;;
            arch-*)
              package="$(find "$input_root" -type f -name '*.pkg.tar.zst' -print | sort | head -1)"
              test -n "$package"
              package_info="$(bsdtar -xOf "$package" .PKGINFO)"
              test "$(awk -F ' = ' '$1 == "pkgname" { print $2 }' <<<"$package_info")" = open-burn-bar
              test "$(awk -F ' = ' '$1 == "arch" { print $2 }' <<<"$package_info")" = x86_64
              version="$(awk -F ' = ' '$1 == "pkgver" { print $2 }' <<<"$package_info")"
              sudo pacman -U --noconfirm "$package"
              ;;
            *) echo "unsupported P-06 environment: $ENVIRONMENT_ID" >&2; exit 1 ;;
          esac
          printf 'package_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum /usr/share/openburnbar/attestation/installed-manifest.json \
            | awk '{print "manifest_sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Capture P-06 installed gateway credential boundary proof
        if: inputs.requirement == 'P-06'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
          PACKAGE_VERSION: ${{ steps.p06_install.outputs.package_version }}
          MANIFEST_SHA256: ${{ steps.p06_install.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          evidence_root="$(mktemp -d "${RUNNER_TEMP}/openburnbar-p06.XXXXXX")"
          desktop_pid=""
          cleanup_p06() {
            if test -n "$desktop_pid"; then kill "$desktop_pid" 2>/dev/null || true; fi
            rm -rf "$evidence_root"
          }
          trap cleanup_p06 EXIT
          systemctl --user restart openburnbar-daemon.service
          /usr/bin/openburnbar-linux-desktop --background >"$evidence_root/desktop.log" 2>&1 &
          desktop_pid=$!
          token_file="${XDG_DATA_HOME:-$HOME/.local/share}/openburnbar/daemon-socket-auth-token"
          for _ in $(seq 1 60); do
            test -s "$token_file" && pgrep -f 'WebKit(Web|Network)Process' >/dev/null && break
            sleep 0.5
          done
          test -s "$token_file"
          node scripts/linux-port/run-p06-gateway-boundary-session.mjs \
            --token-file "$token_file" \
            --output-root "$evidence_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --package-version "$PACKAGE_VERSION" \
            --manifest-sha256 "$MANIFEST_SHA256"
          install -m 600 "$evidence_root/p06-gateway-boundary-session.json" \
            "$input_root/p06-gateway-boundary-session.json"
          node scripts/linux-port/capture-p06-gateway-boundary-proof.mjs \
            --input-root "$input_root" \
            --session-report "$input_root/p06-gateway-boundary-session.json" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Capture P-07 candidate-bound computer-use proof
        if: inputs.requirement == 'P-07'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          session_report="$input_root/p07-live-session.json"
          test -f "$session_report"
          node scripts/linux-port/capture-p07-computer-use-proof.mjs \
            --input-root "$input_root" \
            --session-report "$session_report" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Install P-08 signed candidate package
        id: p08_install
        if: inputs.requirement == 'P-08'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          case "$ENVIRONMENT_ID" in
            ubuntu-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo arm64 ;; *) echo amd64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(dpkg-deb -f "$candidate" Package)" = open-burn-bar || continue
                test "$(dpkg-deb -f "$candidate" Architecture)" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.deb' -print | sort)
              test -n "$package"
              version="$(dpkg-deb -f "$package" Version)"
              sudo apt-get install -y --reinstall "$package"
              ;;
            fedora-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo aarch64 ;; *) echo x86_64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(rpm -qp --qf '%{NAME}' "$candidate")" = open-burn-bar || continue
                test "$(rpm -qp --qf '%{ARCH}' "$candidate")" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.rpm' -print | sort)
              test -n "$package"
              version="$(rpm -qp --qf '%{VERSION}' "$package")"
              sudo dnf install -y "$package"
              ;;
            arch-*)
              package="$(find "$input_root" -type f -name '*.pkg.tar.zst' -print | sort | head -1)"
              test -n "$package"
              package_info="$(bsdtar -xOf "$package" .PKGINFO)"
              test "$(awk -F ' = ' '$1 == "pkgname" { print $2 }' <<<"$package_info")" = open-burn-bar
              test "$(awk -F ' = ' '$1 == "arch" { print $2 }' <<<"$package_info")" = x86_64
              version="$(awk -F ' = ' '$1 == "pkgver" { print $2 }' <<<"$package_info")"
              sudo pacman -U --noconfirm "$package"
              ;;
            *) echo "unsupported P-08 environment: $ENVIRONMENT_ID" >&2; exit 1 ;;
          esac
          printf 'package_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum /usr/share/openburnbar/attestation/installed-manifest.json \
            | awk '{print "manifest_sha256=" $1}' >> "$GITHUB_OUTPUT"
          sha256sum /usr/share/openburnbar/attestation/installed-manifest.json.sig \
            | awk '{print "manifest_signature_sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Capture P-08 installed Mercury media proof
        if: inputs.requirement == 'P-08'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
          PACKAGE_VERSION: ${{ steps.p08_install.outputs.package_version }}
          MANIFEST_SHA256: ${{ steps.p08_install.outputs.manifest_sha256 }}
          MANIFEST_SIGNATURE_SHA256: ${{ steps.p08_install.outputs.manifest_signature_sha256 }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          desktop_report="$input_root/p08-linux-desktop-observation.json"
          device_report="$input_root/p08-physical-device-observation.json"
          test -f "$desktop_report"
          test -f "$device_report"
          chmod 700 "$input_root"
          node scripts/linux-port/run-p08-mercury-media-session.mjs \
            --output-root "$input_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --package-version "$PACKAGE_VERSION" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --manifest-signature-sha256 "$MANIFEST_SIGNATURE_SHA256"
          node scripts/linux-port/capture-p08-mercury-media-proof.mjs \
            --input-root "$input_root" \
            --session-report "$input_root/p08-installed-mercury-media-session.json" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Capture P-31 installed accessibility matrix evidence
        id: p31_capture
        if: inputs.requirement == 'P-31'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          session_report="$input_root/p31-live-session.json"
          test -f "$session_report"
          node scripts/linux-port/capture-p31-accessibility.mjs \
            --input-root "$input_root" \
            --session-report "$session_report" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Install P-05 signed candidate package
        id: p05_install
        if: inputs.requirement == 'P-05'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          case "$ENVIRONMENT_ID" in
            ubuntu-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo arm64 ;; *) echo amd64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(dpkg-deb -f "$candidate" Package)" = open-burn-bar || continue
                test "$(dpkg-deb -f "$candidate" Architecture)" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.deb' -print | sort)
              test -n "$package"
              version="$(dpkg-deb -f "$package" Version)"
              sudo apt-get install -y --reinstall "$package"
              ;;
            fedora-*)
              expected_arch="$(case "$ENVIRONMENT_ID" in *-aarch64) echo aarch64 ;; *) echo x86_64 ;; esac)"
              package=""
              while IFS= read -r candidate; do
                test "$(rpm -qp --qf '%{NAME}' "$candidate")" = open-burn-bar || continue
                test "$(rpm -qp --qf '%{ARCH}' "$candidate")" = "$expected_arch" || continue
                package="$candidate"; break
              done < <(find "$input_root" -type f -name '*.rpm' -print | sort)
              test -n "$package"
              version="$(rpm -qp --qf '%{VERSION}' "$package")"
              sudo dnf install -y "$package"
              ;;
            arch-*)
              package="$(find "$input_root" -type f -name '*.pkg.tar.zst' -print | sort | head -1)"
              test -n "$package"
              package_info="$(bsdtar -xOf "$package" .PKGINFO)"
              test "$(awk -F ' = ' '$1 == "pkgname" { print $2 }' <<<"$package_info")" = open-burn-bar
              test "$(awk -F ' = ' '$1 == "arch" { print $2 }' <<<"$package_info")" = x86_64
              version="$(awk -F ' = ' '$1 == "pkgver" { print $2 }' <<<"$package_info")"
              sudo pacman -U --noconfirm "$package"
              ;;
            *) echo "unsupported P-05 environment: $ENVIRONMENT_ID" >&2; exit 1 ;;
          esac
          printf 'package_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum /usr/share/openburnbar/attestation/installed-manifest.json \
            | awk '{print "manifest_sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Capture P-05 installed credential custody proof
        if: inputs.requirement == 'P-05'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
          PACKAGE_VERSION: ${{ steps.p05_install.outputs.package_version }}
          MANIFEST_SHA256: ${{ steps.p05_install.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          evidence_root="$(mktemp -d "${RUNNER_TEMP}/openburnbar-p05.XXXXXX")"
          trap 'rm -rf "$evidence_root"' EXIT
          node scripts/linux-port/run-p05-credential-custody-session.mjs \
            --output-root "$evidence_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --package-version "$PACKAGE_VERSION" \
            --manifest-sha256 "$MANIFEST_SHA256"
          install -m 600 "$evidence_root/p05-installed-custody-session.json" \
            "$input_root/p05-installed-custody-session.json"
          node scripts/linux-port/capture-p05-credential-custody-proof.mjs \
            --input-root "$input_root" \
            --session-report "$input_root/p05-installed-custody-session.json" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Capture P-34 credential security proof
        if: inputs.requirement == 'P-34'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/capture-p34-credential-security-proof.mjs \
            --input-root "$input_root" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      # P-39 consumes a macOS/Linux evidence pair emitted by producers bound to
      # this exact candidate. The macOS producer runs the real lifted parser
      # corpus; this Linux step runs the same corpus on the selected runner.
      - name: Capture P-39 Linux candidate-bound platform evidence
        if: inputs.requirement == 'P-39'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/capture-p39-platform-evidence.mjs \
            --platform linux \
            --output "$input_root/linux-platform-evidence.json" \
            --report "$input_root/linux-platform-producer-run.json" \
            --candidate-closure "$input_root/.linux-release/product-proof-closure.json" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Resolve P-39 candidate-bound platform evidence inputs
        id: p39_inputs
        if: inputs.requirement == 'P-39'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/resolve-p39-platform-evidence.mjs \
            --input-root "$input_root" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Capture P-39 same-commit macOS/Linux differential proof
        if: inputs.requirement == 'P-39'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
          MACOS_INPUT: ${{ steps.p39_inputs.outputs.macos }}
          LINUX_INPUT: ${{ steps.p39_inputs.outputs.linux }}
          VERSION: ${{ steps.p39_inputs.outputs.version }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/capture-p39-differential.mjs \
            --input-root "$input_root" \
            --macos "$MACOS_INPUT" \
            --linux "$LINUX_INPUT" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --version "$VERSION" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --ignore '$.payload.generatedAt'

      - name: Capture P-40 installed privacy proof
        if: inputs.requirement == 'P-40'
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          test "$ENVIRONMENT_ID" = 'ubuntu-24.04-gnome-x11-aarch64' \
            || { echo 'P-40 installed RPC producer currently targets the Ubuntu 24.04 aarch64 UTM session.' >&2; exit 1; }
          deb=""
          while IFS= read -r candidate; do
            architecture="$(dpkg-deb -f "$candidate" Architecture)"
            package_name="$(dpkg-deb -f "$candidate" Package)"
            if test "$architecture" = arm64 && test "$package_name" = open-burn-bar; then
              deb="$candidate"
              break
            fi
          done < <(find "$input_root" -type f -name '*.deb' -print | sort)
          test -n "$deb" || { echo 'P-40 requires an installed open-burn-bar arm64 Debian package.' >&2; exit 1; }
          sudo apt-get install -y --reinstall "$deb"

          candidate_root="$RUNNER_TEMP/openburnbar-p40-${CANDIDATE_RUN_ID}"
          rm -rf "$candidate_root"
          install -d -m 700 "$candidate_root/support" "$candidate_root/runtime/openburnbar" "$candidate_root/evidence"
          socket="$candidate_root/runtime/openburnbar/daemon.sock"
          support="$candidate_root/support"
          OPENBURNBAR_DAEMON_SUPPORT_DIR="$support" \
          OPENBURNBAR_DAEMON_SOCKET_PATH="$socket" \
          XDG_DATA_HOME="$candidate_root/data" \
          XDG_RUNTIME_DIR="$candidate_root/runtime" \
          /usr/libexec/openburnbar-daemon-launch >"$candidate_root/daemon.log" 2>&1 &
          daemon_pid=$!
          cleanup_p40() {
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
            rm -rf "$candidate_root"
          }
          trap cleanup_p40 EXIT
          for _ in $(seq 1 60); do test -S "$socket" && break; sleep 0.5; done
          test -S "$socket"
          token_file="$support/daemon-socket-auth-token"
          test -f "$token_file"
          manifest_sha256="$(sha256sum /usr/share/openburnbar/attestation/installed-manifest.json | awk '{print $1}')"
          package_version="$(dpkg-deb -f "$deb" Version)"
          # The trusted launcher exports this path for the daemon. The producer
          # also invokes the installed Swift CLI peer, so bind the same
          # package-owned runtime explicitly for its child process.
          export LD_LIBRARY_PATH="/usr/lib/openburnbar/swift:/usr/lib/openburnbar/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          node scripts/linux-port/run-p40-privacy-rpc-session.mjs \
            --socket "$socket" \
            --token-file "$token_file" \
            --output-root "$candidate_root/evidence" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --package-version "$package_version" \
            --manifest-sha256 "$manifest_sha256"
          cp -f "$candidate_root/evidence/p40-live-session.json" "$input_root/p40-live-session.json"
          install -d -m 700 "$input_root/privacy"
          cp -f "$candidate_root/evidence/privacy/inventory.json" "$input_root/privacy/inventory.json"
          cp -f "$candidate_root/evidence/privacy/deletion.json" "$input_root/privacy/deletion.json"
          cp -f "$candidate_root/evidence/privacy/export.json" "$input_root/privacy/export.json"
          cp -f "$candidate_root/evidence/privacy/retention.json" "$input_root/privacy/retention.json"
          session_report="$input_root/p40-live-session.json"
          test -f "$session_report"
          node scripts/linux-port/capture-p40-privacy-proof.mjs \
            --input-root "$input_root" \
            --session-report "$session_report" \
            --environment "$ENVIRONMENT_ID" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Finalize registered feature proof closure
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/finalize-product-feature-proof-closure.mjs \
            --requirement "$REQUIREMENT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --input-root "$input_root" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Materialize the requirement-owned release closure
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          TARGET_HEAD: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          input_root="docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}"
          node scripts/linux-port/prepare-product-requirement-input.mjs \
            --requirement "$REQUIREMENT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --input-root "$input_root" \
            --target-head "$TARGET_HEAD" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Run the registered requirement validator
        id: validate
        shell: bash
        env:
          REQUIREMENT_ID: ${{ inputs.requirement }}
          ENVIRONMENT_ID: ${{ inputs.environment }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          area="$(node -e 'const m=require("./docs/linux-port/product-parity-requirements.json"); const r=m.requirements.find(x=>x.id===process.argv[1]); if(!r)process.exit(1); process.stdout.write(r.area)' "$REQUIREMENT_ID")"
          check_id="$(printf '%s.%s' "$REQUIREMENT_ID" "$area" | tr '[:upper:]' '[:lower:]')"
          receipt="docs/linux-port/evidence/validator-receipts/${REQUIREMENT_ID}/${check_id}/${ENVIRONMENT_ID}.json"
          node scripts/linux-port/run-product-requirement-validator.mjs \
            --requirement "$REQUIREMENT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --release-closure "docs/linux-port/evidence/product-parity-inputs/${REQUIREMENT_ID}/${ENVIRONMENT_ID}/release-closure.json" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --output "$receipt"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Attest the exact validator receipt
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.validate.outputs.receipt }}
          show-summary: false

      - name: Preserve the detached Sigstore bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          RECEIPT_PATH: ${{ steps.validate.outputs.receipt }}
        run: cp -- "$BUNDLE_PATH" "${RECEIPT_PATH}.sigstore.jsonl"

      - name: Upload receipt, provenance, and exact installed subjects
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-product-parity-${{ github.sha }}-${{ inputs.candidate_run_id }}-${{ inputs.requirement }}-${{ inputs.environment }}
          path: |
            ${{ steps.validate.outputs.receipt }}
            ${{ steps.validate.outputs.receipt }}.sigstore.jsonl
            docs/linux-port/evidence/product-parity-inputs/${{ inputs.requirement }}/${{ inputs.environment }}/
          if-no-files-found: error
          retention-days: 30
