name: PR Native Fast Gate

# remediation(ci-native-pr-gate): close the gap where a PR could merge green
# while breaking 715K LOC of native code. Before this workflow, the
# pull_request gate (fast-feedback.yml) covered only TS/Rust/Python/website,
# and the full Swift/iOS/Android/Daemon suites (openburnbar-pr-harness.yml)
# ran ONLY on push:main + cron — never on PRs.
#
# WHAT IS PR-GATED HERE (this workflow, runs on every PR):
#   - SwiftLint --strict over the tree.
#   - `swift build` + `swift test` on the two SwiftPM packages
#     OpenBurnBarCore and OpenBurnBarDaemon. These are quick (no simulator)
#     and catch the overwhelming majority of native compile/unit regressions.
#   - `xcodegen generate` pbxproj drift check (committed project.pbxproj must
#     match project.yml + the on-disk source globs).
#
# WHAT STAYS POST-MERGE / NIGHTLY (openburnbar-pr-harness.yml, unchanged):
#   - Full iOS/macOS App XCTest suites (3000+ tests, simulator-bound).
#   - Android build + instrumentation, Node evals, integration suites.
#   These remain REQUIRED post-merge gates as today; running the multi-hour
#   simulator matrix on every PR is intentionally NOT done here.
#
# To avoid burning scarce macOS runner minutes on non-native PRs, the macOS
# jobs are gated behind a cheap ubuntu path-filter (detect-native-changes).
# When a PR touches no native surface, those jobs skip and the aggregate gate
# still reports success.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-native-fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cheap detector: did this PR touch any native (Swift/XcodeGen) surface? ──
  # Runs on ubuntu so we only spin up the (slow, costly) macOS jobs when a PR
  # actually changes native code, project.yml, or the committed pbxproj.
  # For merge_group (and any non-PR trigger) we always run the gates.
  detect-native-changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # Pull request checkouts use GitHub's synthetic merge commit. Depth 2
          # includes that merge commit plus its base/head parents, which is all
          # this detector needs. A full-history fetch has timed out on large PRs.
          fetch-depth: 2

      - name: Determine whether native paths changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Non-PR triggers (merge_group / manual) always run the native gate.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Event ${EVENT_NAME}: running native gate unconditionally."
            exit 0
          fi

          # Diff the PR's effective changes. In pull_request events, checkout
          # lands on refs/pull/<n>/merge, so HEAD^1 is base and HEAD^2 is the PR
          # head when fetch-depth >= 2. Fall back to base/head SHA if available,
          # then to native=true (fail-safe: run the gate) if no diff is possible.
          base="${BASE_SHA}"
          head="${HEAD_SHA}"

          if git cat-file -e "HEAD^1^{commit}" 2>/dev/null && \
             git cat-file -e "HEAD^2^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only HEAD^1 HEAD^2)"
          elif git cat-file -e "${base}^{commit}" 2>/dev/null && \
               git cat-file -e "${head}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${base}" "${head}")"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve merge parents or base/head commits; running native gate to stay fail-safe."
            exit 0
          fi
          echo "Changed files:"
          echo "${changed}"

          # Any of these surfaces can change Swift compilation OR the generated
          # pbxproj (XcodeGen globs source directories, so adding/removing a
          # file under one of them rewrites project.pbxproj). The Engine-closure
          # UI-purity check and the swift-toolchain resolver it sources are
          # listed too: this job is the only lane that runs that check, so a
          # change to the gate itself must re-run the gate.
          if echo "${changed}" | grep -Eq \
            '^(project\.yml|OpenBurnBar\.xcodeproj/|OpenBurnBarCore/|OpenBurnBarDaemon/|OpenBurnBarMobile/|OpenBurnBarMobileTests/|OpenBurnBarMobileUITests/|OpenBurnBarKeyboard/|OpenBurnBarWidget/|AgentLens/|AgentLensTests/|scripts/ci/verify-daemon-release-signing(\.test)?\.sh|scripts/debt/check-engine-closure-ui-purity\.sh|scripts/lib/swift-toolchain\.sh|\.swiftlint\.yml|packages/data-domains/gen/.*\.swift|packages/design-tokens/dist/swift/.*\.swift|\.github/workflows/pr-native-fast\.yml)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Native surface changed: running SwiftPM + xcodegen-drift gates."
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "No native surface changed: skipping macOS gates (aggregate still passes)."
          fi

  # ── PR-GATED: SwiftPM compile + unit gate (OpenBurnBarCore + Daemon) ────────
  # Mirrors the "Swift Core" lane of openburnbar-pr-harness.yml but is wired to
  # pull_request so it actually gates merges. `swift test` builds first, so a
  # compile break in either package fails here. No simulator, no iOS app
  # target — these are the fast SwiftPM packages.
  swiftpm-native:
    name: SwiftPM build + test (Core + Daemon)
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.native == 'true'
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    # `swift test` on both packages compiles the libsignal Swift FFI on a cold
    # cache; the Swift Core lane uses 40 min for the same work.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive

      - name: Verify macOS Engine closure is UI-free
        run: bash scripts/debt/check-engine-closure-ui-purity.sh

      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache macOS Signal FFI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1; pin matches repo Rust crates
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      # SwiftLint --strict over the tree. Same pinned binary + config the App
      # XCTest lane uses; this is the PR-time copy of that gate so a lint
      # regression cannot reach main only to be caught post-merge.
      - name: SwiftLint
        run: |
          set -euo pipefail
          VER="0.63.3"
          SHA="fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6"
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${VER}/portable_swiftlint.zip"
          echo "${SHA}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint-bin
          /tmp/swiftlint-bin/swiftlint version
          /tmp/swiftlint-bin/swiftlint lint --quiet --strict

      - name: Self-test signed daemon runtime gate
        run: bash scripts/ci/verify-daemon-release-signing.test.sh

      # Reuses scripts/test-openburnbar-swift.sh, which prepares the libsignal
      # FFI then runs `swift test` (build + unit) on OpenBurnBarCore and
      # OpenBurnBarDaemon. This is the SwiftPM-level compile+unit gate the task
      # requires on PRs. Coverage is enabled here because this is the merge-
      # blocking lane that owns package-source diff coverage.
      - name: Build + test OpenBurnBarCore and OpenBurnBarDaemon (SwiftPM)
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-swift.sh

      - name: Extract package coverage lines
        if: github.event_name == 'pull_request'
        run: ./scripts/extract-package-coverage-lines.sh > "$GITHUB_WORKSPACE/openburnbar-package-coverage-lines.json"

      - name: Enforce package diff coverage
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVERAGE_SCOPE: packages
          DIFF_COVERAGE_OUTPUT: ${{ github.workspace }}/openburnbar-package-diff-coverage.json
        run: |
          set -euo pipefail
          ./scripts/diff-coverage-self-test.sh
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/diff-coverage.sh origin/main '' '' "$GITHUB_WORKSPACE/openburnbar-package-coverage-lines.json"

      - name: Upload package coverage evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: pr-package-coverage
          path: |
            openburnbar-package-coverage-lines.json
            openburnbar-package-diff-coverage.json
          if-no-files-found: error

  # ── PR-GATED: XcodeGen pbxproj drift gate ──────────────────────────────────
  # remediation(ci-xcodegen-drift): no workflow regenerated the project and
  # diff-checked the committed project.pbxproj, so a missed `xcodegen generate`
  # silently dropped OpenBurnBarDaemonTests/BurnBarCustomModelLiveCatalogTests.swift
  # from the pbxproj (a whole test file compiled to nothing). This fails the PR
  # when the committed pbxproj is stale vs project.yml + the on-disk globs.
  xcodegen-drift:
    name: XcodeGen pbxproj drift
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.native == 'true'
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          # The committed project is generated with XcodeGen 2.45.4. Do not
          # consume the moving Homebrew formula: 2.46.0 changes target
          # discovery and makes the drift gate fail without a source change.
          xcodegen_version=2.45.4
          xcodegen_sha256=090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          xcodegen_root="$RUNNER_TEMP/xcodegen-$xcodegen_version"
          mkdir -p "$xcodegen_root"
          # --retry 3 alone still lost this gate to a burst of 504s from
          # github.com/*/releases/download: the default 1s backoff retried
          # inside the same outage window, and not every curl build treats an
          # HTTP error as retryable. --retry-all-errors + a 3s floor covers both.
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$xcodegen_version/xcodegen.zip" \
            --output "$xcodegen_root/xcodegen.zip"
          echo "$xcodegen_sha256  $xcodegen_root/xcodegen.zip" | shasum --algorithm 256 --check --strict
          unzip -q -o "$xcodegen_root/xcodegen.zip" -d "$xcodegen_root"
          echo "$xcodegen_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$xcodegen_root/xcodegen/bin/xcodegen" --version

      # Regenerate from the spec; the committed pbxproj must already match.
      - name: Regenerate Xcode project from project.yml
        run: xcodegen generate --spec project.yml

      - name: Fail if committed project.pbxproj drifted from project.yml
        run: |
          set -euo pipefail
          if git diff --quiet OpenBurnBar.xcodeproj/project.pbxproj; then
            echo "project.pbxproj is in sync with project.yml."
            exit 0
          fi

          # XcodeGen can churn internal PBX object IDs across versions/runner
          # installs. Those IDs are not the contract. Everything else is:
          # sources, targets, build phases, settings, entitlements, packages,
          # and shell scripts must already match the generated project.
          git show HEAD:OpenBurnBar.xcodeproj/project.pbxproj > /tmp/committed.pbxproj
          if python3 scripts/ci/verify-xcodegen-pbxproj-drift.py /tmp/committed.pbxproj OpenBurnBar.xcodeproj/project.pbxproj; then
            exit 0
          fi

          # XcodeGen emission is not fully deterministic: an identical spec and
          # tree can occasionally omit a whole target. Observed on a merge-queue
          # candidate whose regenerated project dropped the OpenBurnBarMobileTests
          # target, while the same commit regenerates clean locally with the same
          # pinned XcodeGen 2.45.4. That ejects the candidate and discards hours
          # of gate work. Real staleness is deterministic and reproduces, so
          # regenerate once more and only fail when the drift comes back.
          echo "::warning::pbxproj drift detected; regenerating once more to rule out nondeterministic XcodeGen emission."
          xcodegen generate --spec project.yml
          if python3 scripts/ci/verify-xcodegen-pbxproj-drift.py /tmp/committed.pbxproj OpenBurnBar.xcodeproj/project.pbxproj; then
            echo "::warning::Drift did not reproduce on the second generation; treating the first result as nondeterministic XcodeGen output."
            exit 0
          fi

          git diff -- OpenBurnBar.xcodeproj/project.pbxproj
          {
            echo "::error file=OpenBurnBar.xcodeproj/project.pbxproj::project.pbxproj is stale."
            echo "The committed OpenBurnBar.xcodeproj/project.pbxproj does not match the"
            echo "output of \`xcodegen generate --spec project.yml\`. Run"
            echo "\`xcodegen generate --spec project.yml\` locally and commit the result so"
            echo "no source/test file is silently dropped from the build."
            echo ""
            echo "Regenerate from a checkout that has NO build output in it."
            echo "XcodeGen reads whatever is on disk, so a working copy holding"
            echo ".derived-data, a .spm-cache symlink or a previously generated"
            echo ".xcodeproj yields hundreds of lines of duplicate group hierarchy"
            echo "that regenerate clean here and fail this gate. If your tree has"
            echo "been built in, use a scratch worktree:"
            echo "  git worktree add --detach /tmp/obb-pbxproj HEAD"
            echo "  (cd /tmp/obb-pbxproj && xcodegen generate --spec project.yml)"
            echo "  cp /tmp/obb-pbxproj/OpenBurnBar.xcodeproj/project.pbxproj \\"
            echo "     OpenBurnBar.xcodeproj/project.pbxproj"
            echo "Pin XcodeGen to ${xcodegen_version:-the version this job installs}."
          } >&2
          exit 1

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  # Single required status. Passes when the native jobs succeed OR when they
  # were skipped because the PR touched no native surface. Fails if any native
  # job failed or was cancelled. Mirrors fast-feedback-gate semantics.
  pr-native-gate:
    name: PR Native Gate
    needs:
      - detect-native-changes
      - swiftpm-native
      - xcodegen-drift
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check native jobs passed (or were correctly skipped)
        env:
          DETECT_RESULT: ${{ needs.detect-native-changes.result }}
          SWIFTPM_RESULT: ${{ needs.swiftpm-native.result }}
          XCODEGEN_RESULT: ${{ needs.xcodegen-drift.result }}
        run: |
          set -euo pipefail
          echo "detect-native-changes: ${DETECT_RESULT}"
          echo "swiftpm-native: ${SWIFTPM_RESULT}"
          echo "xcodegen-drift: ${XCODEGEN_RESULT}"

          # The detector itself must have succeeded; a 'skipped' here would mean
          # the path-filter never ran, so we cannot trust the downstream skips.
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "::error::detect-native-changes did not succeed (${DETECT_RESULT})."
            exit 1
          fi

          # success and skipped are both acceptable for the macOS jobs (skipped
          # == no native surface changed). Anything else (failure/cancelled) is
          # a hard fail.
          for result in "${SWIFTPM_RESULT}" "${XCODEGEN_RESULT}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::A native PR gate job failed (result=${result})."
              exit 1
            fi
          done

          echo "### PR Native Gate: native compile/test + pbxproj drift checks passed" >> "$GITHUB_STEP_SUMMARY"
