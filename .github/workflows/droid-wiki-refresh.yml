name: Droid Wiki Refresh

# Least-privilege default: the agentic `droid exec --skip-permissions-unsafe`
# run below must never receive a write token. Declaring `contents: read` at the
# top level makes the no-write-token guarantee file-local (it does not depend on
# the repository/org default GITHUB_TOKEN permission setting), so the unattended
# Droid run can read the checked-out tree but cannot push, open PRs, or mutate
# any GitHub resource.
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Locate Factory Droid
        id: droid
        run: |
          set -euo pipefail
          if command -v droid >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            droid --version
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Droid wiki refresh skipped"
              echo ""
              echo "Factory Droid is not preinstalled on this runner. The workflow refuses mutable curl-pipe-shell installers; provision a pinned Droid binary before enabling this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate wiki
        id: generate-wiki
        if: steps.droid.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 10
        # CI is non-interactive, so Droid cannot ask for tool permission
        # confirmation. The workflow has no write token, so this only permits
        # the checked-out read-only wiki generation run to proceed unattended.
        run: droid exec --skip-permissions-unsafe "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Summarize wiki refresh outage
        if: steps.generate-wiki.outcome == 'failure'
        run: |
          {
            echo "## Droid wiki refresh skipped"
            echo ""
            echo "The optional Droid wiki refresh did not complete. This usually means Factory/Droid quota or service availability blocked the read-only /wiki run."
          } >> "$GITHUB_STEP_SUMMARY"
