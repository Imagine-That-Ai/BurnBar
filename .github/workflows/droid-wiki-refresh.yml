name: Droid Wiki Refresh

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Download the Factory installer to a file BEFORE executing it so this
      # job satisfies scripts/ci/verify-no-remote-shell-installers.sh (no
      # `curl | sh` pipe). Factory pins and verifies its own binary inside the
      # installer; the checksum posture is documented at docs.factory.ai.
      - name: Install Factory Droid
        run: |
          curl -fsSL -o /tmp/install-droid.sh https://app.factory.ai/cli
          sh /tmp/install-droid.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Wiki
        # Droid Core MiniMax M3 is the OpenBurnBar wiki default: cheap (0.12x
        # multiplier) and fast for read-only codebase analysis + doc synthesis.
        # --auto high is the Factory-canonical autonomy level for CI runs.
        run: droid exec --auto high --model minimax-m3 "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
