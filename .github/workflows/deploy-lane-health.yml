name: Scheduled deploy lane health

# This is an observation-only lane. Production deploys remain tag-push or
# approved main-only existing-tag retries; this workflow never dispatches,
# deploys, mutates traffic, or retries a release.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deploy-lane-health
  cancel-in-progress: false

jobs:
  collect:
    name: Check production deploy history and health
    runs-on: ubuntu-latest
    # reason: cap on a new observation job (GitHub API reads only), not a raise.
    timeout-minutes: 15
    outputs:
      status: ${{ steps.collect.outputs.status }}
      red: ${{ steps.collect.outputs.red }}
      blockers: ${{ steps.collect.outputs.blockers }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Collect deploy runs and public health
        id: collect
        # reason: the collector must not abort the job before the scoreboard is
        # uploaded; "Fail closed on red or unavailable" below re-fails the job
        # from steps.collect.outputs.status, and open-failure-issue pages on it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          FUNCTIONS_HEALTH_READY_URL: https://us-central1-burnbar.cloudfunctions.net/healthReady
          FUNCTIONS_HEALTH_LIVE_URL: https://us-central1-burnbar.cloudfunctions.net/healthLive
          CLOUD_RUN_HEALTH_READY_URL: https://mcp.burnbar.ai/readyz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openburnbar-deploy-health"
          node scripts/ci/deploy-lane-health.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --functions-ready "$FUNCTIONS_HEALTH_READY_URL" \
            --functions-live "$FUNCTIONS_HEALTH_LIVE_URL" \
            --cloud-run-ready "$CLOUD_RUN_HEALTH_READY_URL" \
            --out "$RUNNER_TEMP/openburnbar-deploy-health/deploy-lane-health.json"

      - name: Upload deploy health scoreboard
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: deploy-lane-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openburnbar-deploy-health/deploy-lane-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on red or unavailable deploy health
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.collect.outputs.status }}"
          if [[ "${status:-red}" != "green" ]]; then
            echo "::error::Deploy lane health is ${status:-unavailable}; production health and deploy history are not green."
            exit 1
          fi

  open-failure-issue:
    name: Record deploy health failure
    runs-on: ubuntu-latest
    needs: collect
    if: always() && needs.collect.result != 'success'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Record deploy lane-health failure
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-health
          title-prefix: Scheduled deploy lane health is red
          summary: Production deploy history or health probes are red or unavailable.
          details: |
            Collector result: `${{ needs.collect.result }}`
            Blockers: `${{ needs.collect.outputs.blockers || 'unavailable' }}`
            The observer never deploys or retries production. Use the release-owner human queue and approved main-only control path.
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

  close-resolved-issue:
    name: Close resolved deploy health issue
    runs-on: ubuntu-latest
    needs: collect
    if: always() && needs.collect.result == 'success'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Close resolved deploy lane-health failure
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-health
          title-prefix: Scheduled deploy lane health is red
