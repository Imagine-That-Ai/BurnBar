  candidate-bundle:
    name: candidate-bundle
    if: always() && needs.classify.outputs.rust == 'true'
    needs:
      - classify
      - promotion-contracts
      - rust-and-csharp
      - windows-native
      - linux-arm64-native
      - wasm
      - functions-pricing
      - android
      - apple
      - apple-native-smoke
      - swift-consumer-contracts
      - console-consumer-contracts
      - python-mcp-cloudvault-contracts
      - python-hermes-contracts
      - rollback-drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every deterministic proof job to succeed
        if: github.event_name == 'push'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq 'del(.classify)' > "$RUNNER_TEMP/domain-core-job-results.json"
          jq -e 'to_entries | length == 14 and all(.value.result == "success")' \
            "$RUNNER_TEMP/domain-core-job-results.json" >/dev/null

      - name: Download exact-attempt proof fragments
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          pattern: domain-core-proof-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-proof-fragments
          merge-multiple: true

      - name: Aggregate fragments and create unsigned candidate bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          node scripts/ci/domain-core-proof-fragment.mjs aggregate \
            --expected-candidate-commit "$GITHUB_SHA" \
            --fragments "$RUNNER_TEMP/domain-core-proof-fragments" \
            --job-results "$RUNNER_TEMP/domain-core-job-results.json" \
            --output "$RUNNER_TEMP/domain-core-deterministic-evidence.json"
          node scripts/ci/create-domain-core-deterministic-candidate-bundle.mjs \
            --expected-candidate-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/domain-core-deterministic-evidence.json" \
            --output "$RUNNER_TEMP/domain-core-candidate-bundle.json"

      - name: Upload immutable unsigned candidate bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-candidate-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-candidate-bundle.json
          if-no-files-found: error
          retention-days: 90

  domain-core-pr-gate:
    name: Domain Core PR Gate
    if: always()
    needs:
      - classify
      - promotion-contracts
      - rust-and-csharp
      - windows-native
      - linux-arm64-native
      - wasm
      - functions-pricing
      - android
      - apple
      - apple-native-smoke
      - swift-consumer-contracts
      - console-consumer-contracts
      - python-mcp-cloudvault-contracts
      - python-hermes-contracts
      - rollback-drill
      - candidate-bundle
    runs-on: ubuntu-latest
    # The deletion-candidate checkout needs complete history, all refs, and
    # blobs for ancestry and historical-content proofs. The current repository
    # pack is 8.68 GiB, so a degraded GitHub fetch can consume an hour before
    # the gate logic runs. Leave two hours of headroom without weakening the
    # fail-closed gate.
    timeout-minutes: 120
    steps:
      - name: Require every meaningful Domain Core job
        if: needs.classify.outputs.rust == 'true'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/domain-core-final-results.json"
          jq -e 'del(.classify) | to_entries | length == 15 and all(.value.result == "success")' \
            "$RUNNER_TEMP/domain-core-final-results.json" >/dev/null

      - name: Verify unowned Domain Core jobs were intentionally skipped
        if: needs.classify.outputs.rust == 'false'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -e \
            '(.classify.result == "success") and (del(.classify) | all(.result == "skipped"))' >/dev/null

      - name: Check out deletion candidate
        if: needs.classify.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The evaluator checkout only supplies trusted script content at the base
      # ref; every Git proof runs against the deletion-candidate workspace.
      # Keep this fetch bounded so it cannot burn the gate's checkout headroom.
      - name: Check out trusted default-branch absence evaluator
        if: needs.classify.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .domain-core-trusted-evaluator
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/verify-domain-core-legacy-absence.py
            scripts/ci/verify-domain-core-legacy-deletion.py
          sparse-checkout-cone-mode: false

      - name: Download exact-attempt proof fragments
        if: needs.classify.outputs.rust == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: domain-core-proof-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-proof-fragments
          merge-multiple: true

      - name: Download exact-attempt staged final binaries
        if: needs.classify.outputs.rust == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: domain-core-attestation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-final-binaries
          merge-multiple: false

      - name: Prove deleted legacy source, build inputs, and final binaries are absent
        if: needs.classify.outputs.rust == 'true'
        env:
          DOMAIN_CORE_EVIDENCE_CACHE: ${{ runner.temp }}/domain-core-evidence-cache
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evaluator=".domain-core-trusted-evaluator/scripts/ci/verify-domain-core-legacy-absence.py"
          if [[ -f "$evaluator" ]]; then
            python3 "$evaluator" \
              --repo-root "$GITHUB_WORKSPACE" \
              --fragments "$RUNNER_TEMP/domain-core-proof-fragments" \
              --artifacts "$RUNNER_TEMP/domain-core-final-binaries" \
              --verify-signed-evidence \
              --output "$RUNNER_TEMP/domain-core-legacy-absence.json"
          else
            # One-time bootstrap: the base evaluator predates final-binary proof.
            # It still proves this landing contains no deletion; later PRs must use
            # the trusted default-branch absence evaluator above.
            jq -e 'all(.rows[]; .state != "legacy_deleted")' config/domain-core-legacy-deletion.json >/dev/null
            python3 .domain-core-trusted-evaluator/scripts/ci/verify-domain-core-legacy-deletion.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --base-ref "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
          fi
