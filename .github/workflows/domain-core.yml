name: Shared Rust domain core

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/openburnbar-domain-core/**"
      - "OpenBurnBarCore/Package.swift"
      - "OpenBurnBarCore/Sources/OpenBurnBarCore/ProviderQuota/**"
      - "OpenBurnBarCore/Sources/OpenBurnBarDomainCore/**"
      - "OpenBurnBarCore/Tests/OpenBurnBarCoreTests/*DomainCore*Tests.swift"
      - "windows/app/OpenBurnBar.App.Presentation/Quota/**"
      - "windows/tests/quota/**"
      - "OpenBurnBarCore/Sources/OpenBurnBarCore/SharedModels/CloudVaultCrypto.swift"
      - "OpenBurnBarCore/Tests/OpenBurnBarCoreTests/CloudVault*Tests.swift"
      - "windows/cloudsync/OpenBurnBar.CloudSync.Crypto/**"
      - "windows/tests/cloudsync/**"
      - "android/openburnbar-domain-core/**"
      - "android/app/src/main/java/com/openburnbar/data/cloud/CloudVaultCrypto*.kt"
      - "android/app/src/test/java/com/openburnbar/data/cloud/CloudVault*Test.kt"
      - "android/app/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "apps/console/lib/escrow.ts"
      - "apps/console/test/escrow.test.ts"
      - "apps/console/vendor/openburnbar-domain-core-wasm/**"
      - "Vendor/openburnbar-domain-core.aar"
      - "tests/fixtures/domain-core/**"
      - "scripts/build-domain-core-xcframework.sh"
      - "scripts/build-domain-core-android-aar.sh"
      - "scripts/build-domain-core-wasm.sh"
      - ".github/workflows/domain-core.yml"
  pull_request:
    paths:
      - "crates/openburnbar-domain-core/**"
      - "OpenBurnBarCore/Package.swift"
      - "OpenBurnBarCore/Sources/OpenBurnBarCore/ProviderQuota/**"
      - "OpenBurnBarCore/Sources/OpenBurnBarDomainCore/**"
      - "OpenBurnBarCore/Tests/OpenBurnBarCoreTests/*DomainCore*Tests.swift"
      - "windows/app/OpenBurnBar.App.Presentation/Quota/**"
      - "windows/tests/quota/**"
      - "OpenBurnBarCore/Sources/OpenBurnBarCore/SharedModels/CloudVaultCrypto.swift"
      - "OpenBurnBarCore/Tests/OpenBurnBarCoreTests/CloudVault*Tests.swift"
      - "windows/cloudsync/OpenBurnBar.CloudSync.Crypto/**"
      - "windows/tests/cloudsync/**"
      - "android/openburnbar-domain-core/**"
      - "android/app/src/main/java/com/openburnbar/data/cloud/CloudVaultCrypto*.kt"
      - "android/app/src/test/java/com/openburnbar/data/cloud/CloudVault*Test.kt"
      - "android/app/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "apps/console/lib/escrow.ts"
      - "apps/console/test/escrow.test.ts"
      - "apps/console/vendor/openburnbar-domain-core-wasm/**"
      - "Vendor/openburnbar-domain-core.aar"
      - "tests/fixtures/domain-core/**"
      - "scripts/build-domain-core-xcframework.sh"
      - "scripts/build-domain-core-android-aar.sh"
      - "scripts/build-domain-core-wasm.sh"
      - ".github/workflows/domain-core.yml"
  workflow_dispatch:

concurrency:
  group: domain-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check Rust core
        working-directory: crates/openburnbar-domain-core
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build -p openburnbar-domain-ffi

      - name: Run C# quota contracts through the native library
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo

  windows-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build native domain core
        working-directory: crates/openburnbar-domain-core
        run: cargo build -p openburnbar-domain-ffi

      - name: Load native core and run quota contracts
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo --runtime ${{ matrix.rid }}

  linux-arm64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build and load native domain core
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: |
          cargo build --manifest-path crates/openburnbar-domain-core/Cargo.toml -p openburnbar-domain-ffi
          dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - name: Verify generated Wasm package drift
        run: ./scripts/build-domain-core-wasm.sh --check

      - name: Run generated package against the canonical KAT
        run: >-
          node crates/openburnbar-domain-core/domain-wasm/tests/package-smoke.mjs
          apps/console/vendor/openburnbar-domain-core-wasm

  android:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DOMAIN_CORE_ANDROID_NDK_VERSION: "26.3.11579264"
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: sdkmanager "ndk;${DOMAIN_CORE_ANDROID_NDK_VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Verify committed AAR source fingerprint
        run: ./scripts/build-domain-core-android-aar.sh --check-source

      - name: Build four-ABI Android AAR
        run: ./scripts/build-domain-core-android-aar.sh

      - name: Reject Android binding drift
        run: |
          git diff --exit-code -- \
            android/openburnbar-domain-core/src/main/java/uniffi/openburnbar_domain_ffi

      - name: Compile Android native-load test
        working-directory: android
        run: ./gradlew :openburnbar-domain-core:assembleDebugAndroidTest --no-daemon

      - name: Execute ABI v2 smoke on arm64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          script: cd android && ./gradlew :openburnbar-domain-core:connectedDebugAndroidTest --no-daemon

  apple:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Build Apple XCFramework and regenerate Swift bindings
        run: ./scripts/build-domain-core-xcframework.sh

      - name: Reject Swift binding drift
        run: git diff --exit-code -- OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated

      - name: Upload XCFramework
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: OpenBurnBarDomainCore.xcframework
          path: Vendor/OpenBurnBarDomainCore.xcframework
          if-no-files-found: error
          retention-days: 14

  apple-native-smoke:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Build host domain-core XCFramework
        env:
          DOMAIN_CORE_BUILD_PROFILE: debug
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export DOMAIN_CORE_BUILD_TARGETS="aarch64-apple-darwin"
          else
            export DOMAIN_CORE_BUILD_TARGETS="x86_64-apple-darwin"
          fi
          ./scripts/build-domain-core-xcframework.sh

      - name: Load XCFramework and run the narrow native contract
        working-directory: OpenBurnBarCore
        run: swift run OpenBurnBarDomainCoreFFISmoke

  swift-consumer-contracts:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Build host domain-core XCFramework
        env:
          DOMAIN_CORE_BUILD_PROFILE: debug
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export DOMAIN_CORE_BUILD_TARGETS="aarch64-apple-darwin"
          else
            export DOMAIN_CORE_BUILD_TARGETS="x86_64-apple-darwin"
          fi
          ./scripts/build-domain-core-xcframework.sh

      - name: Run Swift quota consumer contracts
        env:
          OPENBURNBAR_CORE_SWIFT_FILTER: DomainCoreQuotaConsumerTests
          OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS: "1"
        run: ./scripts/test-openburnbar-swift.sh
