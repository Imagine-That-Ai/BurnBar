  wasm:
    name: wasm
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/openburnbar-domain-core

      - name: Verify generated Wasm package drift
        env:
          DOMAIN_CORE_ARTIFACT_EXPORT_DIR: ${{ runner.temp }}/domain-core-wasm-rebuilt
        run: ./scripts/build-domain-core-wasm.sh --check

      - name: Upload rebuilt Wasm packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: domain-core-wasm-rebuilt
          path: ${{ runner.temp }}/domain-core-wasm-rebuilt/
          if-no-files-found: warn
          retention-days: 3

      - name: Verify browser and Node Wasm provenance
        run: >-
          python3 scripts/ci/domain-core-union-gate.py
          --check-provenance browser-wasm node-wasm

      - name: Run browser Wasm package against the canonical KAT
        env:
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/browser-wasm-observed-identity.json
        run: |
          set -o pipefail
          {
            printf '%s\n' 'suite=wasm-browser-kat'
            node crates/openburnbar-domain-core/domain-wasm/tests/package-smoke.mjs \
              apps/console/vendor/openburnbar-domain-core-wasm
          } 2>&1 | tee "$RUNNER_TEMP/wasm-browser-kat.log"

      - name: Freeze the observed browser Wasm before loading another package
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact apps/console/vendor/openburnbar-domain-core-wasm/openburnbar_domain_core_bg.wasm
          --identity-report "$RUNNER_TEMP/browser-wasm-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-browser-wasm"

      - name: Run Node Wasm package against the canonical KAT
        env:
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/node-wasm-observed-identity.json
        run: |
          set -o pipefail
          {
            printf '%s\n' 'suite=wasm-node-kat'
            node crates/openburnbar-domain-core/domain-wasm/tests/package-smoke.mjs \
              functions/vendor/openburnbar/domain-core-wasm
          } 2>&1 | tee "$RUNNER_TEMP/wasm-node-kat.log"

      - name: Run remote MCP CloudVault consumer contracts
        run: |
          set -o pipefail
          npm ci --prefix tools/openburnbar-mcp-remote
          npm --prefix tools/openburnbar-mcp-remote run lint
          npm --prefix tools/openburnbar-mcp-remote test \
            2>&1 | tee "$RUNNER_TEMP/remote-mcp-cloudvault-contracts.log"

      - name: Freeze the observed Node Wasm before broader candidate tests
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact functions/vendor/openburnbar/domain-core-wasm/openburnbar_domain_core_bg.wasm
          --identity-report "$RUNNER_TEMP/node-wasm-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-node-wasm"

      - name: Emit Wasm proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id wasm
          --suite "wasm-browser-kat=$RUNNER_TEMP/wasm-browser-kat.log"
          --suite "wasm-node-kat=$RUNNER_TEMP/wasm-node-kat.log"
          --suite "remote-mcp-cloudvault-contracts=$RUNNER_TEMP/remote-mcp-cloudvault-contracts.log"
          --artifact "browser-wasm=$RUNNER_TEMP/attestation-browser-wasm/artifact,$RUNNER_TEMP/attestation-browser-wasm/observed-identity.json"
          --artifact "node-wasm=$RUNNER_TEMP/attestation-node-wasm/artifact,$RUNNER_TEMP/attestation-node-wasm/observed-identity.json"
          --output "$RUNNER_TEMP/wasm.json"

      - name: Upload Wasm attestation inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-browser-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-browser-wasm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Node Wasm attestation input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-node-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-node-wasm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wasm proof fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm.json
          if-no-files-found: error
          retention-days: 14

  functions-pricing:
    name: functions-pricing
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
