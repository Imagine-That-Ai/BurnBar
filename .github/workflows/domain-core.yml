          --suite "functions-pricing-contracts=$RUNNER_TEMP/functions-pricing-contracts.log"
          --output "$RUNNER_TEMP/functions-pricing.json"

      - name: Upload Functions pricing proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-functions-pricing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/functions-pricing.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Resolve signed Android domain-core candidate
        run: node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --expected-candidate-commit "$GITHUB_SHA" --format github-env >> "$GITHUB_ENV"

      - name: Install safe Android Firebase build config
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Load canonical Android toolchain
        shell: bash
        run: |
          ndk_version="$(sed -nE \
            's/^([0-9]+(\.[0-9]+)+)$/\1/p' \
            config/domain-core-android-ndk-version.txt)"
          [[ "${ndk_version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          printf 'DOMAIN_CORE_ANDROID_NDK_VERSION=%s\n' "${ndk_version}" >> "${GITHUB_ENV}"

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify hosted Android SDK
        run: |
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${DOMAIN_CORE_ANDROID_NDK_VERSION}"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rebuild and byte-compare four-ABI Android AAR
        env:
          DOMAIN_CORE_ARTIFACT_EXPORT_DIR: ${{ runner.temp }}/domain-core-android-rebuilt
        run: ./scripts/build-domain-core-android-aar.sh --check-artifact

      - name: Upload rebuilt Android AAR and bindings
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: domain-core-android-rebuilt
          path: ${{ runner.temp }}/domain-core-android-rebuilt/
          if-no-files-found: warn
          retention-days: 3

      - name: Reject Android binding and provenance drift
        run: |
          status="$(git status --porcelain -- \
            android/openburnbar-domain-core/src/main/java/uniffi/openburnbar_domain_ffi \
            crates/openburnbar-domain-core/artifact-provenance/kotlin.sha256)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}" >&2
            exit 1
          fi
          python3 scripts/ci/domain-core-union-gate.py \
            --check-provenance aar kotlin

      - name: Compile Android native-load test
        working-directory: android
        run: ./gradlew :openburnbar-domain-core:assembleDebugAndroidTest --no-daemon

      - name: Execute ABI v3 smoke on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: |
            cd android && ./gradlew :openburnbar-domain-core:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.candidateCommit="$GITHUB_SHA"
            adb exec-out run-as com.openburnbar.domaincore.test cat files/domain-core-observed-identity.json > "$RUNNER_TEMP/android-observed-identity.json"

      - name: Record successful Android native load
        run: |
          test -s "$RUNNER_TEMP/android-observed-identity.json"
          jq -e --arg commit "$GITHUB_SHA" '.candidateCommit == $commit' \
            "$RUNNER_TEMP/android-observed-identity.json"
          cp "$RUNNER_TEMP/android-observed-identity.json" "$RUNNER_TEMP/android-native-load.log"

      - name: Freeze the observed Android AAR before broader candidate tests
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact Vendor/openburnbar-domain-core.aar
          --identity-report "$RUNNER_TEMP/android-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-kotlin-aar"

      - name: Run Android app domain-core consumer contracts
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            --tests 'com.openburnbar.data.DomainCoreBuildProfileTest' \
            --tests 'com.openburnbar.data.DomainCoreShadowEvidenceTest' \
            --tests 'com.openburnbar.data.cloud.*DomainCoreTest' \
            --tests 'com.openburnbar.data.cloud.CloudVaultAadParityTest' \
            --tests 'com.openburnbar.data.hermes.relay.HermesDomainCoreAdapterTest' \
            --tests 'com.openburnbar.data.hermes.relay.HermesRatchetCryptoTest' \
            2>&1 | tee "$RUNNER_TEMP/android-consumer-contracts.log"

      - name: Build and verify a signed Android app bundle
        run: |
          cd android
          ./gradlew :app:bundleDebug --no-daemon
          cd ..
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs --profile public-production --expected-candidate-commit "$GITHUB_SHA" --android-aab android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Emit Android proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id android
          --suite "android-native-load=$RUNNER_TEMP/android-native-load.log"
          --suite "android-consumer-contracts=$RUNNER_TEMP/android-consumer-contracts.log"
          --artifact "kotlin-aar=$RUNNER_TEMP/attestation-kotlin-aar/artifact,$RUNNER_TEMP/attestation-kotlin-aar/observed-identity.json"
          --output "$RUNNER_TEMP/android.json"

      - name: Upload Android AAR attestation input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-kotlin-aar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-kotlin-aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android.json
          if-no-files-found: error
          retention-days: 14

  apple:
    name: apple
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Build Apple XCFramework and regenerate Swift bindings
        run: ./scripts/build-domain-core-xcframework.sh

      - name: Reject Swift binding and provenance drift
        run: |
          set -o pipefail
          status="$(git status --porcelain -- \
            OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated \
            crates/openburnbar-domain-core/artifact-provenance/swift.sha256)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}" >&2
            exit 1
          fi
          python3 scripts/ci/domain-core-union-gate.py \
            --check-provenance swift xcframework \
            2>&1 | tee "$RUNNER_TEMP/swift-artifact-provenance.log"
          printf '%s\n' \
            'swift and xcframework provenance verified' \
            >> "$RUNNER_TEMP/swift-artifact-provenance.log"

      - name: Emit Apple artifact proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id apple
          --suite "swift-artifact-provenance=$RUNNER_TEMP/swift-artifact-provenance.log"
          --output "$RUNNER_TEMP/apple.json"

      - name: Upload Apple artifact proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload rebuilt Apple artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: domain-core-apple-rebuilt
          path: |
            Vendor/OpenBurnBarDomainCore.xcframework/
            OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated/
            crates/openburnbar-domain-core/artifact-provenance/swift.sha256
          if-no-files-found: warn
          retention-days: 3

      - name: Upload XCFramework
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: OpenBurnBarDomainCore.xcframework
          path: Vendor/OpenBurnBarDomainCore.xcframework
          if-no-files-found: error
          retention-days: 14

  apple-native-smoke:
    name: apple-native-smoke
    needs: apple
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download the exact XCFramework produced by the Apple job
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: OpenBurnBarDomainCore.xcframework
          path: Vendor/OpenBurnBarDomainCore.xcframework

      - name: Load XCFramework and run the narrow native contract
        env:
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/swift-observed-identity.json
        working-directory: OpenBurnBarCore
        run: |
          set -o pipefail
          swift run OpenBurnBarDomainCoreFFISmoke \
            2>&1 | tee "$RUNNER_TEMP/swift-native-load.log"

      - name: Freeze the observed XCFramework before proof generation
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact Vendor/OpenBurnBarDomainCore.xcframework
          --identity-report "$RUNNER_TEMP/swift-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-swift-xcframework"

      - name: Emit Apple native-load proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id apple-native-smoke
          --suite "swift-native-load=$RUNNER_TEMP/swift-native-load.log"
          --artifact "swift-xcframework=$RUNNER_TEMP/attestation-swift-xcframework/artifact,$RUNNER_TEMP/attestation-swift-xcframework/observed-identity.json"
          --output "$RUNNER_TEMP/apple-native-smoke.json"

      - name: Upload Swift XCFramework attestation input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-swift-xcframework-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-swift-xcframework
          if-no-files-found: error
          retention-days: 14

      - name: Upload Apple native-load proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-apple-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-native-smoke.json
          if-no-files-found: error
          retention-days: 14

  swift-consumer-contracts:
    name: swift-consumer-contracts
    runs-on: macos-26
    # Cold macos-26 runners can spend nearly an hour building the domain-core
    # XCFramework and app-test dependency graph before the focused spool test.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Build host domain-core XCFramework
        env:
          DOMAIN_CORE_BUILD_PROFILE: debug
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export DOMAIN_CORE_BUILD_TARGETS="aarch64-apple-darwin"
          else
            export DOMAIN_CORE_BUILD_TARGETS="x86_64-apple-darwin"
          fi
          ./scripts/build-domain-core-xcframework.sh

      - name: Run Swift domain-core consumer contracts
        env:
          OPENBURNBAR_CORE_SWIFT_FILTER: DomainCore
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS: "1"
        run: |
          set -o pipefail
          ./scripts/test-openburnbar-swift.sh \
            2>&1 | tee "$RUNNER_TEMP/swift-consumer-core.log"

      - name: Run Apple shadow evidence spool contracts
        run: |
          set -o pipefail
          ./scripts/test-openburnbar-app.sh \
            -only-testing:OpenBurnBarTests/DomainCoreShadowEvidenceSpoolTests \
            2>&1 | tee "$RUNNER_TEMP/swift-consumer-spool.log"
          cat "$RUNNER_TEMP/swift-consumer-core.log" \
            "$RUNNER_TEMP/swift-consumer-spool.log" \
            > "$RUNNER_TEMP/swift-consumer-contracts.log"

      - name: Emit Swift consumer proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id swift-consumer-contracts
          --suite "swift-consumer-contracts=$RUNNER_TEMP/swift-consumer-contracts.log"
          --output "$RUNNER_TEMP/swift-consumer-contracts.json"

      - name: Upload Swift consumer proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-swift-consumer-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-consumer-contracts.json
          if-no-files-found: error
          retention-days: 14

  console-consumer-contracts:
    name: console-consumer-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install Console dependencies
        working-directory: apps/console
        run: npm ci

      - name: Run Console domain-core consumer contracts
        working-directory: apps/console
        run: |
          set -o pipefail
          npx vitest run \
            test/domainCoreBuildProfile.test.ts \
            test/domainCoreCloudVault.test.ts \
            test/domainCoreCloudVaultArtifact.test.ts \
            test/domainCoreShadowEvidence.test.ts \
            test/escrow.test.ts \
            2>&1 | tee "$RUNNER_TEMP/console-consumer-contracts.log"
          npm run typecheck
          npm run lint
          node --test ../../scripts/ci/domain-core-release-schema-validation.test.mjs

      - name: Emit Console consumer proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id console-consumer-contracts
          --suite "console-consumer-contracts=$RUNNER_TEMP/console-consumer-contracts.log"
          --output "$RUNNER_TEMP/console-consumer-contracts.json"

      - name: Upload Console consumer proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-console-consumer-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-consumer-contracts.json
          if-no-files-found: error
          retention-days: 14

  rollback-drill:
    name: rollback-drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Resolve the signed legacy rollback artifact
        run: >-
          node scripts/ci/resolve-domain-core-build-profile.mjs
          --profile public-production-rollback
          --expected-candidate-commit "$GITHUB_SHA"
          --format json
          --output "$RUNNER_TEMP/domain-core-public-production-rollback.json"

      - name: Exercise the actual Console signed rollback selector
        working-directory: apps/console
        run: |
          npm ci
          npx vitest run test/domainCoreBuildProfile.test.ts \
            -t 'uses the signed rollback profile for legacy even with hostile Rust overrides'

      - name: Verify every domain restores the legacy implementation
        run: >-
          node scripts/ci/verify-domain-core-rollback.mjs
          --artifact "$RUNNER_TEMP/domain-core-public-production-rollback.json"
          --report "$RUNNER_TEMP/rollback-drill.log"
          --expected-candidate-commit "$GITHUB_SHA"

      - name: Emit rollback proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id rollback-drill
          --suite "rollback-drill=$RUNNER_TEMP/rollback-drill.log"
          --rollback "$RUNNER_TEMP/rollback-drill.log,$RUNNER_TEMP/domain-core-public-production-rollback.json"
          --output "$RUNNER_TEMP/rollback-drill.json"

      - name: Publish the exact candidate-bound rollback artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-public-production-rollback-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-public-production-rollback.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload rollback proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-rollback-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-drill.json
          if-no-files-found: error
          retention-days: 14

  candidate-bundle:
    name: candidate-bundle
    if: always()
    needs:
      - promotion-contracts
      - rust-and-csharp
      - windows-native
      - linux-arm64-native
      - wasm
      - functions-pricing
      - android
      - apple
      - apple-native-smoke
      - swift-consumer-contracts
      - console-consumer-contracts
      - rollback-drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        if: github.event_name == 'push'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Require every deterministic proof job to succeed
        if: github.event_name == 'push'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/domain-core-job-results.json"
          jq -e 'to_entries | length == 12 and all(.value.result == "success")' \
            "$RUNNER_TEMP/domain-core-job-results.json" >/dev/null

      - name: Download exact-attempt proof fragments
        if: github.event_name == 'push'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          pattern: domain-core-proof-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-proof-fragments
          merge-multiple: true

      - name: Aggregate fragments and create unsigned candidate bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          node scripts/ci/domain-core-proof-fragment.mjs aggregate \
            --expected-candidate-commit "$GITHUB_SHA" \
            --fragments "$RUNNER_TEMP/domain-core-proof-fragments" \
            --job-results "$RUNNER_TEMP/domain-core-job-results.json" \
            --output "$RUNNER_TEMP/domain-core-deterministic-evidence.json"
          node scripts/ci/create-domain-core-deterministic-candidate-bundle.mjs \
            --expected-candidate-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/domain-core-deterministic-evidence.json" \
            --output "$RUNNER_TEMP/domain-core-candidate-bundle.json"

      - name: Upload immutable unsigned candidate bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-candidate-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-candidate-bundle.json
          if-no-files-found: error
          retention-days: 90
