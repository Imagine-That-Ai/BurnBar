          name: domain-core-proof-functions-pricing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/functions-pricing.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve canonical candidate commit
        id: candidate
        run: node scripts/ci/canonical-candidate-commit.mjs

      - name: Install safe Android Firebase build config
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Load canonical Android toolchain
        shell: bash
        run: |
          ndk_version="$(sed -nE \
            's/^([0-9]+(\.[0-9]+)+)$/\1/p' \
            config/domain-core-android-ndk-version.txt)"
          [[ "${ndk_version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          printf 'DOMAIN_CORE_ANDROID_NDK_VERSION=%s\n' "${ndk_version}" >> "${GITHUB_ENV}"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify hosted Android SDK
        run: |
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${DOMAIN_CORE_ANDROID_NDK_VERSION}"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/openburnbar-domain-core

      - name: Rebuild and byte-compare four-ABI Android AAR
        env:
          DOMAIN_CORE_ARTIFACT_EXPORT_DIR: ${{ runner.temp }}/domain-core-android-rebuilt
        run: ./scripts/build-domain-core-android-aar.sh --check-artifact

      - name: Resolve signed Android domain-core candidate
        run: node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --expected-candidate-commit "${{ steps.candidate.outputs.candidate_commit }}" --format github-env >> "$GITHUB_ENV"

      - name: Build candidate-bound four-ABI Android AAR
        run: ./scripts/build-domain-core-android-aar.sh

      - name: Upload rebuilt Android AAR and bindings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: domain-core-android-rebuilt
          path: ${{ runner.temp }}/domain-core-android-rebuilt/
          if-no-files-found: warn
          retention-days: 3

      - name: Reject Android binding and provenance drift
        run: |
          status="$(git status --porcelain -- \
            android/openburnbar-domain-core/src/main/java/uniffi/openburnbar_domain_ffi \
            crates/openburnbar-domain-core/artifact-provenance/kotlin.sha256)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}" >&2
            exit 1
          fi
          python3 scripts/ci/domain-core-union-gate.py \
            --check-provenance aar kotlin

      - name: Compile Android native-load test
        working-directory: android
        run: ./gradlew :openburnbar-domain-core:assembleDebugAndroidTest --no-daemon

      - name: Execute ABI v3 smoke on x86_64 emulator
        # Hosted-runner emulators crash at boot ~5% of the time (qemu dies,
        # adb:5554 refused). Tolerate that one failure mode and retry below.
        #
        # `continue-on-error` necessarily wraps the whole action, including the
        # native-load proof script -- which also exits non-zero for post-boot
        # failures (instrumentation failures, observed-identity mismatches).
        # Retrying those would let a real ABI/native-load flake pass on a second
        # roll and still record a successful proof fragment. So the script drops
        # a marker the moment the emulator has booted and it starts running:
        # marker present + failure => a genuine post-boot failure, never retried.
        id: emu-smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: |
            touch "$RUNNER_TEMP/emulator-booted"
            bash scripts/ci/run-domain-core-android-native-load.sh android/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk "${{ steps.candidate.outputs.candidate_commit }}" "$RUNNER_TEMP/android-observed-identity.json"

      - name: Fail closed when the emulator booted but the proof failed
        # The marker exists only if the emulator came up and the proof script
        # started, so this is a real native-load failure, not a boot flake.
        if: steps.emu-smoke.outcome == 'failure' && hashFiles(format('{0}/emulator-booted', runner.temp)) != ''
        run: |
          echo "::error::ABI v3 native-load proof failed after the emulator booted; not a boot flake, not retrying." >&2
          exit 1

      - name: Retry ABI v3 smoke on x86_64 emulator (boot-flake guard)
        if: steps.emu-smoke.outcome == 'failure' && hashFiles(format('{0}/emulator-booted', runner.temp)) == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: bash scripts/ci/run-domain-core-android-native-load.sh android/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk "${{ steps.candidate.outputs.candidate_commit }}" "$RUNNER_TEMP/android-observed-identity.json"

      - name: Record successful Android native load
        run: |
          cp "$RUNNER_TEMP/android-observed-identity.json" \
            "$RUNNER_TEMP/android-native-load.log"

      - name: Freeze the exact observed Android native library
        run: |
          set -euo pipefail
          observed_library="$RUNNER_TEMP/libopenburnbar_domain_ffi-x86_64.so"
          instrumentation_apk="android/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk"
          unzip -p "$instrumentation_apk" \
            lib/x86_64/libopenburnbar_domain_ffi.so > "$observed_library"
          test -s "$observed_library"
          node scripts/ci/stage-domain-core-attestation-artifact.mjs \
            --artifact "$observed_library" \
            --identity-report "$RUNNER_TEMP/android-observed-identity.json" \
            --output "$RUNNER_TEMP/attestation-kotlin-aar"

      - name: Build host domain core for JVM consumer contracts
        working-directory: crates/openburnbar-domain-core
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: cargo build --locked -p openburnbar-domain-ffi

      - name: Run Android app domain-core consumer contracts
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -Dopenburnbar.domainCore.nativeLibraryPath="$GITHUB_WORKSPACE/crates/openburnbar-domain-core/target/debug/libopenburnbar_domain_ffi.so" \
            --tests 'com.openburnbar.data.DomainCoreBuildProfileTest' \
            --tests 'com.openburnbar.data.DomainCoreShadowEvidenceTest' \
            --tests 'com.openburnbar.data.cloud.*DomainCoreTest' \
            --tests 'com.openburnbar.data.cloud.CloudVaultAadParityTest' \
            --tests 'com.openburnbar.data.hermes.relay.HermesDomainCoreAdapterTest' \
            --tests 'com.openburnbar.data.hermes.relay.HermesRatchetCryptoTest' \
            2>&1 | tee "$RUNNER_TEMP/android-consumer-contracts.log"

      - name: Build and verify a signed Android app bundle
        run: |
          cd android
          ./gradlew :app:bundleDebug --no-daemon
          cd ..
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs --profile public-production --expected-candidate-commit "${{ steps.candidate.outputs.candidate_commit }}" --android-aab android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Restore checked-in Android AAR after candidate validation
        run: |
          git restore --source=HEAD -- Vendor/openburnbar-domain-core.aar
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf 'unexpected dirty path after Android candidate validation:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Emit Android proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "${{ steps.candidate.outputs.candidate_commit }}"
          --job-id android
          --suite "android-native-load=$RUNNER_TEMP/android-native-load.log"
          --suite "android-consumer-contracts=$RUNNER_TEMP/android-consumer-contracts.log"
          --artifact "kotlin-aar=$RUNNER_TEMP/attestation-kotlin-aar/artifact,$RUNNER_TEMP/attestation-kotlin-aar/observed-identity.json"
          --output "$RUNNER_TEMP/android.json"

      - name: Upload Android loaded-library attestation input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-kotlin-aar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-kotlin-aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android proof fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android.json
          if-no-files-found: error
          retention-days: 14

  apple:
    name: apple
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/openburnbar-domain-core

      - name: Build Apple XCFramework and regenerate Swift bindings
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ github.sha }}
        run: ./scripts/build-domain-core-xcframework.sh

      - name: Reject Swift binding and provenance drift
        run: |
          set -o pipefail
          status="$(git status --porcelain -- \
            OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated \
            crates/openburnbar-domain-core/artifact-provenance/swift.sha256)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}" >&2
            exit 1
          fi
          python3 scripts/ci/domain-core-union-gate.py \
            --check-provenance swift xcframework \
            2>&1 | tee "$RUNNER_TEMP/swift-artifact-provenance.log"
          printf '%s\n' \
            'swift and xcframework provenance verified' \
            >> "$RUNNER_TEMP/swift-artifact-provenance.log"

      - name: Emit Apple artifact proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id apple
          --suite "swift-artifact-provenance=$RUNNER_TEMP/swift-artifact-provenance.log"
          --output "$RUNNER_TEMP/apple.json"

      - name: Upload Apple artifact proof fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload rebuilt Apple artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: domain-core-apple-rebuilt
          path: |
            Vendor/OpenBurnBarDomainCore.xcframework/
            OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated/
            crates/openburnbar-domain-core/artifact-provenance/swift.sha256
          if-no-files-found: warn
          retention-days: 3

      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenBurnBarDomainCore.xcframework
          path: Vendor/OpenBurnBarDomainCore.xcframework
          if-no-files-found: error
          retention-days: 14

  apple-native-smoke:
    name: apple-native-smoke
    needs: [classify, apple]
    if: needs.classify.outputs.rust == 'true'
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact checked-out candidate C
        id: candidate
        run: |
          candidate_commit="$(git rev-parse HEAD)"
          if [[ ! "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out domain-core candidate is not a full Git SHA-1."
            exit 1
          fi
          printf 'commit=%s\n' "$candidate_commit" >> "$GITHUB_OUTPUT"

      - name: Download the exact XCFramework produced by the Apple job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          name: OpenBurnBarDomainCore.xcframework
          path: Vendor/OpenBurnBarDomainCore.xcframework

      - name: Load XCFramework and run the narrow native contract
        env:
          DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/swift-observed-identity.json
        working-directory: OpenBurnBarCore
        run: |
          set -o pipefail
          swift run OpenBurnBarDomainCoreFFISmoke \
            2>&1 | tee "$RUNNER_TEMP/swift-native-load.log"

      - name: Freeze the observed XCFramework before proof generation
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact Vendor/OpenBurnBarDomainCore.xcframework
          --identity-report "$RUNNER_TEMP/swift-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-swift-xcframework"

      - name: Emit Apple native-load proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "${{ steps.candidate.outputs.commit }}"
          --job-id apple-native-smoke
          --suite "swift-native-load=$RUNNER_TEMP/swift-native-load.log"
          --artifact "swift-xcframework=$RUNNER_TEMP/attestation-swift-xcframework/artifact,$RUNNER_TEMP/attestation-swift-xcframework/observed-identity.json"
          --output "$RUNNER_TEMP/apple-native-smoke.json"

      - name: Upload Swift XCFramework attestation input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-swift-xcframework-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-swift-xcframework
          if-no-files-found: error
          retention-days: 14

      - name: Upload Apple native-load proof fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-apple-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-native-smoke.json
          if-no-files-found: error
          retention-days: 14

  swift-consumer-contracts:
    name: swift-consumer-contracts
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    # PR/MQ keep DomainCore Swift contracts (~XCFramework + Core) and skip the
    # Apple app spool that rebuilds the full OpenBurnBar graph (~47m measured).
    # Push/dispatch still runs the spool after Core so main keeps focused
    # coverage; the nightly openburnbar-pr-harness app-xctest also runs the
    # full OpenBurnBarTests corpus (including DomainCoreShadowEvidenceSpoolTests).
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 90 }}
    # Routing (cost + security): pull-request and merge-queue candidates may both
    # contain untrusted PR code, so they run only on isolated hosted macOS pools.
    # Set repo var MACOS_GATE_POOL=paid to force the capped hosted pool for a
    # billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/openburnbar-domain-core

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Build host domain-core XCFramework
        env:
          DOMAIN_CORE_BUILD_PROFILE: release
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export DOMAIN_CORE_BUILD_TARGETS="aarch64-apple-darwin"
          else
            export DOMAIN_CORE_BUILD_TARGETS="x86_64-apple-darwin"
          fi
          ./scripts/build-domain-core-xcframework.sh

      - name: Run Swift domain-core consumer contracts
        env:
          OPENBURNBAR_CORE_SWIFT_FILTER: DomainCore
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS: "1"
          # Prevent two Rust staticlibs (domain-core xcframework + locally-built
          # libsignal_ffi) from colliding on _rust_eh_personality at link time.
          # test-openburnbar-swift.sh also exports this from
          # OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE; set it here for explicitness.
          OPENBURNBAR_DISABLE_LIBSIGNAL_SWIFT_PACKAGE: "1"
        run: |
          set -o pipefail
          ./scripts/test-openburnbar-swift.sh \
            2>&1 | tee "$RUNNER_TEMP/swift-consumer-core.log"
          # Proof emit always succeeds from the Core log alone on PR/MQ. Push
          # and workflow_dispatch append the app spool log below.
          cp "$RUNNER_TEMP/swift-consumer-core.log" \
            "$RUNNER_TEMP/swift-consumer-contracts.log"

      - name: Run Apple shadow evidence spool contracts
        # Keep the focused app-spool selector off pull_request + merge_group: it
        # rebuilds the same OpenBurnBar app graph AgentLens already built in the
        # same MQ batch. Coverage homes: this step on push/dispatch, plus the
        # nightly Full Harness app-xctest unfiltered OpenBurnBarTests run.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          set -o pipefail
          ./scripts/test-openburnbar-app.sh \
            -only-testing:OpenBurnBarTests/DomainCoreShadowEvidenceSpoolTests \
            2>&1 | tee "$RUNNER_TEMP/swift-consumer-spool.log"
          cat "$RUNNER_TEMP/swift-consumer-spool.log" \
            >> "$RUNNER_TEMP/swift-consumer-contracts.log"

      - name: Restore tracked Swift artifacts after debug validation
        run: |
          # The XCFramework is a generated, gitignored build product. Remove it;
          # git restore cannot address a path that is intentionally untracked.
          rm -rf -- Vendor/OpenBurnBarDomainCore.xcframework
          git restore --source=HEAD -- \
            OpenBurnBarCore/Sources/OpenBurnBarDomainCore/Generated \
            crates/openburnbar-domain-core/artifact-provenance/swift.sha256
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf 'unexpected dirty path after Swift candidate validation:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Emit Swift consumer proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id swift-consumer-contracts
          --suite "swift-consumer-contracts=$RUNNER_TEMP/swift-consumer-contracts.log"
          --output "$RUNNER_TEMP/swift-consumer-contracts.json"

      - name: Upload Swift consumer proof fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-swift-consumer-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-consumer-contracts.json
          if-no-files-found: error
          retention-days: 14

