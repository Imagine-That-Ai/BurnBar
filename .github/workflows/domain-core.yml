concurrency:
  group: domain-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-contracts:
    name: promotion-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Test fail-closed promotion evidence evaluation
        run: |
          set -o pipefail
          node --test \
            scripts/ci/create-domain-core-deterministic-candidate-bundle.test.mjs \
            scripts/ci/domain-core-proof-fragment.test.mjs \
            scripts/ci/evaluate-domain-core-promotion.test.mjs \
            scripts/ci/stage-domain-core-attestation-artifact.test.mjs \
            scripts/ci/verify-domain-core-control-plane.test.mjs \
            scripts/ci/verify-domain-core-protected-attestation.test.mjs \
            scripts/ci/verify-domain-core-workflows.test.mjs \
            scripts/ci/create-domain-core-functions-deploy-proof.test.mjs \
            scripts/ci/create-domain-core-functions-deployment-evidence.test.mjs \
            scripts/ci/create-domain-core-functions-provider-coordinates.test.mjs \
            scripts/ci/create-domain-core-runtime-artifact-manifest.test.mjs \
            scripts/ci/verify-existing-domain-core-deployment.test.mjs \
            scripts/ci/verify-domain-core-functions-deploy-run.test.mjs \
            scripts/ci/create-domain-core-deployment-identity.test.mjs \
            scripts/ci/verify-domain-core-console-deploy-evidence.test.mjs \
            scripts/ci/create-domain-core-release-evidence.test.mjs \
            scripts/ci/domain-core-release-evidence-contract.test.mjs \
            scripts/ci/publish-domain-core-release-evidence.test.mjs \
            scripts/ci/verify-domain-core-release-gate.test.mjs \
            scripts/lib/domain-core-deterministic-candidate-bundle.test.mjs \
            scripts/lib/domain-core-proof-fragments.test.mjs \
            scripts/lib/export-domain-core-promotion-evidence.test.mjs \
            scripts/ci/resolve-domain-core-build-profile.test.mjs \
            scripts/lib/domain-core-artifact-profile.test.mjs \
            scripts/lib/domain-core-candidate-receipt.test.mjs \
            scripts/lib/domain-core-shadow-enrollment.test.mjs \
            | tee "$RUNNER_TEMP/promotion-contracts.log"
          python3 tests/test_domain_core_console_release_evidence_workflow.py
          bash scripts/ci/hosting-smoke-domain-core.test.sh

      - name: Test Functions release workflow and live identity gate
        run: |
          python3 tests/test_domain_core_functions_release_workflow.py
          bash scripts/ci/post-deploy-health-gate.test.sh

      - name: Verify shadow evidence retention declaration
        run: bash scripts/ci/check-firestore-ttl-declared.sh

      - name: Emit promotion-contracts proof fragment
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id promotion-contracts
          --suite "promotion-contracts=$RUNNER_TEMP/promotion-contracts.log"
          --output "$RUNNER_TEMP/promotion-contracts.json"

      - name: Upload promotion-contracts proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-promotion-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-contracts.json
          if-no-files-found: error
          retention-days: 14

  rust-and-csharp:
    name: rust-and-csharp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check Rust core
        working-directory: crates/openburnbar-domain-core
        run: |
          set -o pipefail
          {
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            cargo build -p openburnbar-domain-ffi
          } 2>&1 | tee "$RUNNER_TEMP/rust-workspace.log"

      - name: Run deterministic domain fuzz smoke
        working-directory: crates/openburnbar-domain-core
        run: |
          set -o pipefail
          cargo test -p openburnbar-domain-ffi --test fuzz_smoke -- --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/rust-fuzz-smoke.log"

      - name: Guard complete-payload FFI performance
        working-directory: crates/openburnbar-domain-core
        env:
          DOMAIN_CORE_BENCHMARK_REPORT: ${{ runner.temp }}/complete-payload-ffi.json
        run: |
          set -o pipefail
          cargo test --release -p openburnbar-domain-ffi --test performance_smoke \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/rust-performance-smoke.log"
          test -s "$DOMAIN_CORE_BENCHMARK_REPORT"

      - name: Test and verify union ABI manifest
        run: |
          python3 tests/test_domain_core_union_gate.py
          python3 scripts/ci/domain-core-union-gate.py --check-abi

      - name: Cache pinned uniffi-bindgen-cs
        id: domain-bindgen-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: domain-core-uniffi-bindgen-cs-${{ runner.os }}-v0.9.2+v0.28.3

      - name: Install pinned uniffi-bindgen-cs
        if: steps.domain-bindgen-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install uniffi-bindgen-cs
          --git https://github.com/NordSecurity/uniffi-bindgen-cs
          --tag v0.9.2+v0.28.3

      - name: Reject C# domain-core binding drift
        run: scripts/windows-port/check-csharp-binding-drift.sh domain-core

      - name: Verify C# generated-source provenance
        run: >-
          python3 scripts/ci/domain-core-union-gate.py
          --check-provenance csharp

      - name: Observe the exact C# native identity
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/csharp-native-observed-identity.json
        run: >-
          dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo
          --filter FullyQualifiedName=OpenBurnBar.App.Quota.Tests.DomainCoreQuotaBridgeTests.Loaded_native_identity_is_observed_for_attestation

      - name: Freeze the observed C# artifact before broader candidate tests
        run: >-
          node scripts/ci/stage-domain-core-attestation-artifact.mjs
          --artifact crates/openburnbar-domain-core/target/debug/libopenburnbar_domain_ffi.so
          --identity-report "$RUNNER_TEMP/csharp-native-observed-identity.json"
          --output "$RUNNER_TEMP/attestation-csharp-native"

      - name: Run C# quota contracts through the native library
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: |
          set -o pipefail
          dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo \
            2>&1 | tee "$RUNNER_TEMP/csharp-quota-native.log"

      - name: Run C# CloudVault contracts through the native library
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: |
          set -o pipefail
          dotnet test windows/tests/cloudsync/OpenBurnBar.CloudSync.Crypto.Tests.csproj --nologo \
            2>&1 | tee "$RUNNER_TEMP/csharp-cloudvault-native.log"

      - name: Run C# signed profile contracts
        run: dotnet test windows/tests/configuration/OpenBurnBar.App.Configuration.Tests.csproj --nologo

      - name: Build and verify a signed Windows configuration artifact
        run: |
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --expected-candidate-commit "$GITHUB_SHA" --format msbuild-props --output "$RUNNER_TEMP/domain-core-profile.props"
          dotnet build windows/app/OpenBurnBar.App.Configuration/OpenBurnBar.App.Configuration.csproj --nologo -c Release -p:DomainCoreBuildProfileProps="$RUNNER_TEMP/domain-core-profile.props"
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --expected-candidate-commit "$GITHUB_SHA" --format json --output windows/app/OpenBurnBar.App.Configuration/bin/Release/domain-core-build-profile.json
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs --profile public-production --expected-candidate-commit "$GITHUB_SHA" --windows-dir windows/app/OpenBurnBar.App.Configuration/bin/Release

      - name: Emit Rust and C# proof fragment
        env:
          ATTESTATION_INPUT: ${{ runner.temp }}/attestation-csharp-native
        run: >-
          node scripts/ci/domain-core-proof-fragment.mjs emit
          --expected-candidate-commit "$GITHUB_SHA"
          --job-id rust-and-csharp
          --suite "rust-workspace=$RUNNER_TEMP/rust-workspace.log"
          --suite "rust-fuzz-smoke=$RUNNER_TEMP/rust-fuzz-smoke.log"
          --suite "rust-performance-smoke=$RUNNER_TEMP/rust-performance-smoke.log"
          --suite "csharp-quota-native=$RUNNER_TEMP/csharp-quota-native.log"
          --suite "csharp-cloudvault-native=$RUNNER_TEMP/csharp-cloudvault-native.log"
          --artifact "csharp-native=$ATTESTATION_INPUT/artifact,$ATTESTATION_INPUT/observed-identity.json"
          --benchmark "complete-payload-ffi=$RUNNER_TEMP/complete-payload-ffi.json"
          --output "$RUNNER_TEMP/rust-and-csharp.json"

      - name: Upload C# native attestation input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-csharp-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-csharp-native
          if-no-files-found: error
          retention-days: 14

      - name: Upload Rust and C# proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-rust-and-csharp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-and-csharp.json
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: windows-native-${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            suite: windows-native-x64
            artifact: windows-native-x64-binary
          - runner: windows-11-arm
            rid: win-arm64
            suite: windows-native-arm64
            artifact: windows-native-arm64-binary
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build native domain core
        working-directory: crates/openburnbar-domain-core
        run: cargo build -p openburnbar-domain-ffi

      - name: Observe the exact Windows native identity
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}/windows-native-${{ matrix.rid }}-observed-identity.json
        run: |
          dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo --runtime ${{ matrix.rid }} `
            --filter FullyQualifiedName=OpenBurnBar.App.Quota.Tests.DomainCoreQuotaBridgeTests.Loaded_native_identity_is_observed_for_attestation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze the observed Windows artifact before broader candidate tests
        run: |
          node scripts/ci/stage-domain-core-attestation-artifact.mjs `
            --artifact "crates/openburnbar-domain-core/target/debug/openburnbar_domain_ffi.dll" `
            --identity-report "$env:RUNNER_TEMP/windows-native-${{ matrix.rid }}-observed-identity.json" `
            --output "$env:RUNNER_TEMP/attestation-${{ matrix.artifact }}"

      - name: Run Windows native quota contracts
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: |
          dotnet test windows/tests/quota/OpenBurnBar.App.Quota.Tests.csproj --nologo --runtime ${{ matrix.rid }} `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-native-${{ matrix.rid }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit Windows native proof fragment
        run: |
          node scripts/ci/domain-core-proof-fragment.mjs emit `
            --expected-candidate-commit "$env:GITHUB_SHA" `
            --job-id windows-native `
            --suite "${{ matrix.suite }}=$env:RUNNER_TEMP/windows-native-${{ matrix.rid }}.log" `
            --artifact "${{ matrix.artifact }}=$env:RUNNER_TEMP/attestation-${{ matrix.artifact }}/artifact,$env:RUNNER_TEMP/attestation-${{ matrix.artifact }}/observed-identity.json" `
            --output "$env:RUNNER_TEMP/windows-native-${{ matrix.rid }}.json"

      - name: Upload Windows native attestation input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-attestation-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows native proof fragment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-proof-windows-native-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-native-${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 14

