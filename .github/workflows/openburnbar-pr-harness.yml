  harness-required:
    name: Harness Required (deterministic gates)
    needs:
      - platform-misc
      - functions-integration
      - windows
      - swift-core
      - app-xctest
      - supply-chain
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required (deterministic) harness jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') != 'success']
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following required (deterministic) harness jobs failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Harness Required: All deterministic gates passed" >> "$GITHUB_STEP_SUMMARY"

  harness-informational:
    name: Harness Informational (external/emulator/virtualization)
    needs:
      - android
      - node-evals
      - ios-mobile
      - retrieval-evals
      - hermes-gateway-e2ee-proof
      - hermes-iroh-e2e
      - android-hermes-smoke
      - computer-use-e2e
      - mercury-media-e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report informational harness job results (alerts, does not block)
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::warning::The following informational harness jobs failed (visible but non-blocking):"
            echo "$failed"
            echo "### Harness Informational: failures detected (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Harness Informational: All external/emulator jobs passed" >> "$GITHUB_STEP_SUMMARY"
          fi

  platform-confidence-gate:
    name: Platform Confidence Gate
    needs:
      - platform-misc
      - functions-integration
      - android
      - windows
      - node-evals
      - supply-chain
      - swift-core
      - app-xctest
      - ios-mobile
      - retrieval-evals
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all platform jobs passed (informational jobs warn, not block)
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # P-QA-1 split: android, node-evals, ios-mobile, retrieval-evals are
          # informational (external/emulator deps). They are still in this
          # aggregate for coverage, but their failures are warnings, not red.
          informational = {'android', 'node-evals', 'ios-mobile', 'retrieval-evals'}
          failed = [k for k, v in data.items()
                    if v.get('result') not in ('success', 'skipped')
                    and k not in informational]
          warnings = [k for k, v in data.items()
                      if v.get('result') not in ('success', 'skipped')
                      and k in informational]
          print('\n'.join(failed))
          if warnings:
            print('\n'.join('::warning::Informational job ' + k + ' failed (non-blocking)' for k in warnings), file=sys.stderr)
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following required platform confidence jobs failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Platform Confidence: All required checks passed" >> "$GITHUB_STEP_SUMMARY"

  path-filter:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      hermes_iroh: ${{ steps.filter.outputs.hermes_iroh }}
      hermes_gateway_e2ee: ${{ steps.filter.outputs.hermes_gateway_e2ee }}
      computer_use: ${{ steps.filter.outputs.computer_use }}
      mercury_media: ${{ steps.filter.outputs.mercury_media }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          FORCE_MERCURY_MEDIA_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.force_mercury_media_e2e == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            # Scheduled and dispatched runs must cover EVERY commit since the
            # last completed harness run, not just HEAD~1: with the per-push
            # trigger removed (CI-cost hardening 2026-07-31), several commits
            # can land between daily runs and a HEAD~1 diff would silently
            # skip targeted E2E lanes whose paths are absent from the final
            # commit before the schedule fires.
            BASELINE="$(gh run list \
              --workflow openburnbar-pr-harness.yml \
              --branch "${{ github.ref_name }}" \
              --status completed \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // empty' 2>/dev/null || true)"
            if [[ -n "$BASELINE" ]] && git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
              CHANGED="$(git diff --name-only "${BASELINE}..HEAD" || true)"
            else
              # Fail open: without a usable baseline (first run, force-pushed
              # or expired SHA, API error) treat every tracked path as changed
              # so no targeted E2E lane is silently skipped.
              CHANGED="$(git ls-files)"
            fi
          fi
          echo "$CHANGED" > /tmp/changed-paths.txt
          match() { grep -Eq "$1" /tmp/changed-paths.txt; }
          if match '^OpenBurnBarCore/|^android/.*/hermes/|^functions/src/hermes|^functions/src/.*iroh|^OpenBurnBarMobile/.*iroh|^scripts/e2e/.*iroh|^\.github/workflows/openburnbar-pr-harness\.yml$'; then
            echo "hermes_iroh=true" >> "$GITHUB_OUTPUT"
          else
            echo "hermes_iroh=false" >> "$GITHUB_OUTPUT"
          fi
          if match '^docs/HERMES_GATEWAY_E2EE_REMEDIATION_PLAN\.md$|^functions/src/hermesGateway\.ts$|^functions/src/callables/(hermesGateway|dataExport|privacyBackfill)\.ts$|^functions/src/types/generated/hermes-gateway\.ts$|^functions/src/__tests__/hermesGateway.*\.test\.ts$|^functions/src/__tests__/(dataExport|privacyBackfill)\.test\.ts$|^functions/scripts/test-hermes-gateway\.mjs$|^functions/scripts/test-firestore-rules\.mjs$|^firestore\.rules$|^scripts/privacy/scan-chat-cloud-plaintext\.mjs$|^scripts/ci/verify-hermes-gateway-e2ee-remediation\.sh$|^tools/hermes-platform-burnbar/|^tools/schema-sync/|^OpenBurnBarCore/.*Hermes(Relay|Ratchet)|^OpenBurnBarCore/Sources/OpenBurnBarFirestoreModels/HermesGatewayModels\.swift$|^OpenBurnBarCore/Tests/OpenBurnBarCoreTests/(BurnBarHpkeV3|HermesRelayHPKEv3)|^OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/BurnBarHpkeV3Vector\.json$|^OpenBurnBarMobile/Services/(FunctionsRepository|HermesService|HermesGatewayRelayKeypair|.*HermesGateway).*\.swift$|^OpenBurnBarMobileTests/.*Hermes.*\.swift$|^OpenBurnBarMobileTests/OpenBurnBarMobileTests\.swift$|^android/app/src/main/java/com/openburnbar/data/firebase/FunctionsRepository\.kt$|^android/app/src/test/java/com/openburnbar/data/firebase/FunctionsRepositoryHermesGatewayTest\.kt$|^android/app/src/main/java/com/openburnbar/data/models/generated/HermesGatewayModels\.kt$|^android/app/src/main/java/com/openburnbar/data/hermes/|^android/app/src/test/java/com/openburnbar/data/hermes/|^android/app/src/test/resources/hermes-relay/'; then
            echo "hermes_gateway_e2ee=true" >> "$GITHUB_OUTPUT"
          else
            echo "hermes_gateway_e2ee=false" >> "$GITHUB_OUTPUT"
          fi
          if match '^OpenBurnBarCore/Sources/OpenBurnBarComputerUseCore/|^OpenBurnBarDaemon/.*ComputerUse|^OpenBurnBarDaemon/Resources/PlaywrightBridge/|^scripts/test-computer-use|^scripts/install-playwright'; then
            echo "computer_use=true" >> "$GITHUB_OUTPUT"
          else
            echo "computer_use=false" >> "$GITHUB_OUTPUT"
          fi
          # Keep the Mercury proof fail-closed when its product surface, tests,
          # or runner wiring changes. The workflow and script paths matter
          # because this job is the proof for those harness edits.
          if [[ "${FORCE_MERCURY_MEDIA_E2E:-false}" == "true" ]] || match '^\.github/workflows/openburnbar-pr-harness\.yml$|^scripts/test-openburnbar-mobile\.sh$|^scripts/lib/prepare-signal-ffi-xcframework\.sh$|^scripts/ci/inject-firebase-config(-android)?\.sh$|^OpenBurnBarMobile/.*[Mm]edia|^OpenBurnBarMobile/.*[Mm]ercury|^OpenBurnBarMobileTests/.*[Mm]edia|^OpenBurnBarMobileTests/.*[Mm]ercury|^android/.*/media/|^AgentLens/Services/Media/|^functions/src/media'; then
            echo "mercury_media=true" >> "$GITHUB_OUTPUT"
          else
            echo "mercury_media=false" >> "$GITHUB_OUTPUT"
          fi

  hermes-gateway-e2ee-proof:
    needs: [path-filter]
    if: needs.path-filter.outputs.hermes_gateway_e2ee == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          repository: Ajnunezg/hermes-agent
          # Keep this immutable: the gate runs with repo credentials in scope.
          # To bump, update third_party/hermes-agent/manifest.json first, run
          # scripts/ci/verify-vendored-agent-source.sh, then copy pinnedCommit here.
          # The provenance step below FAILS if this ref and the manifest drift,
          # so the gate always executes the exact commit the manifest attests
          # (diligence 2026-06-11 LB-4: attestation and gate had split across
          # two different commits).
          ref: bdb830070927cbb20763819f91ee930548f7da92
          path: .ci/hermes-agent

      - name: Verify vendored agent provenance (C-5, on PRs)
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.ci/hermes-agent
        run: |
          set -euo pipefail
          manifest_pin="$(python3 -c 'import json;print(json.load(open("third_party/hermes-agent/manifest.json"))["pinnedCommit"])')"
          checkout_head="$(git -C .ci/hermes-agent rev-parse HEAD)"
          if [[ "$manifest_pin" != "$checkout_head" ]]; then
            echo "ERROR: harness checkout ($checkout_head) != manifest pinnedCommit ($manifest_pin)." >&2
            echo "The E2EE proof would run against a commit the provenance manifest does not attest." >&2
            echo "Update the checkout ref above and the manifest together." >&2
            exit 1
          fi
          bash scripts/ci/verify-vendored-agent-source.sh

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Hermes gateway test dependencies
        run: |
          set -euo pipefail
          python3 -m venv .ci/hermes-agent/.venv
          .ci/hermes-agent/.venv/bin/python -m pip install --upgrade pip
          .ci/hermes-agent/.venv/bin/python -m pip install -e '.ci/hermes-agent[dev,gateway-e2ee]'

      - name: Hermes Gateway E2EE remediation proof
        env:
          HERMES_AGENT_CHECKOUT: ${{ github.workspace }}/.ci/hermes-agent
          HERMES_PYTHON: ${{ github.workspace }}/.ci/hermes-agent/.venv/bin/python
          HERMES_GATEWAY_OVERLAY_ADAPTER: "1"
          HERMES_GATEWAY_EXTERNAL_PYTEST_REQUIRED: "1"
        run: bash scripts/ci/verify-hermes-gateway-e2ee-remediation.sh

  hermes-iroh-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.hermes_iroh == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
      - name: Hermes relay unit tests (Functions)
        run: npm ci --prefix functions && npm --prefix functions run test:hermes
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain
      - name: Hermes core Swift tests
        run: OPENBURNBAR_CORE_SWIFT_FILTER=OpenBurnBarCoreTests/Hermes OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
      - name: Android iroh-relay JVM tests
        run: cd android && ./gradlew :openburnbar-iroh-relay:testDebugUnitTest --no-daemon

  android-hermes-smoke:
    needs: [path-filter]
    if: >-
      github.event_name != 'pull_request' &&
      needs.path-filter.outputs.hermes_iroh == 'true'
    # ubuntu-24.04 + x86_64 + KVM: macos-26/arm64-v8a fails with HV_UNSUPPORTED
    # (no hardware virtualization on Apple Silicon runners). Follows the proven
    # pattern from domain-core.yml: Enable KVM, x86_64 image, swiftshader_indirect.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALLOW_ANDROID_FIREBASE_SECRET_RUN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use Android Firebase template when secret run is not allowed
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN != 'true' || env.HAS_ANDROID_SECRETS != 'true'
        run: cp android/app/google-services.json.template android/app/google-services.json
      - name: Inject Android Firebase config
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN == 'true' && env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh
      - name: Android Hermes instrumented smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: ./scripts/e2e/android-iroh-chat.sh

  computer-use-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.computer_use == 'true'
    # macos-26 like every other Swift job: Vendor/libsignal/swift declares
    # swift-tools-version 6.0, which macos-14's default toolchain (5.10) rejects.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain
      - name: Computer Use core tests
        run: OPENBURNBAR_CORE_SWIFT_FILTER=OpenBurnBarComputerUseCoreTests OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh
      - name: Install Playwright (pinned)
        run: bash scripts/install-playwright.sh
      - name: Playwright bridge loopback smoke
        env:
          OPENBURNBAR_PLAYWRIGHT_BRIDGE: ${{ github.workspace }}/OpenBurnBarDaemon/Resources/PlaywrightBridge/openburnbar-playwright-bridge.js
        run: bash scripts/test-computer-use-loopback.sh

  mercury-media-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.mercury_media == 'true'
    runs-on: macos-26
    # This job intentionally proves both Android media and the iOS Mercury/media
    # path. On macos-26 the iOS test bundle compile alone can take ~35 minutes,
    # after Android JVM tests and Signal FFI prep, so keep enough headroom for
    # actual XCTest execution. The iOS step stays targeted so this lane does
    # not duplicate the full iOS Mobile job.
    timeout-minutes: 90
    env:
      ALLOW_FIREBASE_SECRET_RUN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
      # gradle's processDebugGoogleServices needs google-services.json; this job
      # previously had no inject step, so it failed before any test ran.
      - name: Inject Android Firebase config
        if: env.ALLOW_FIREBASE_SECRET_RUN == 'true' && env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh
      - name: Generate dummy google-services.json when secret unavailable
        if: env.ALLOW_FIREBASE_SECRET_RUN != 'true' || env.HAS_ANDROID_SECRETS != 'true'
        run: |
          python3 -c "
          import json, pathlib
          pathlib.Path('android/app').mkdir(parents=True, exist_ok=True)
          pathlib.Path('android/app/google-services.json').write_text(json.dumps({
              'project_info': {'project_id': 'burnbar-ci-dummy', 'project_number': '000000000000'},
              'client': [{'client_info': {'mobilesdk_app_id': '1:000000000000:android:0000000000000000',
              'android_client_info': {'package_name': 'com.openburnbar'}},
              'api_key': [{'current_key': '*************************************'}],
              'services': {}}],
              'configuration_version': '1'
          }))
          "
      - name: Android media JVM tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --tests "com.openburnbar.ui.media.*" --tests "com.openburnbar.data.media.*" --no-daemon
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain
      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh
      # The OpenBurnBarMobile target declares GoogleService-Info.plist as a
      # build input, so the iOS test step needs the same inject the other
      # iOS jobs run.
      - name: Inject Firebase config
        if: env.ALLOW_FIREBASE_SECRET_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          OPENBURNBAR_USE_DEBUG_APP_CHECK: "YES"
        run: bash ./scripts/ci/inject-firebase-config.sh
      - name: iOS Mercury/media unit tests
        # GitHub macOS runners have no USB physical devices; the script falls back to iOS Simulator in CI.
        env:
          OPENBURNBAR_MOBILE_SKIP_SIGNAL_FFI_PREP: "1"
          # Keep this targeted lane bounded but retryable. SwiftPM can race its
          # repository cache or temporarily fail to map the freshly-built Signal
          # FFI binary target before XCTest starts.
          OPENBURNBAR_MOBILE_TEST_ATTEMPTS: "3"
          OPENBURNBAR_MOBILE_TEST_FILTER: >-
            OpenBurnBarMobileTests/AgentIdentityRegistryMacURITests
            OpenBurnBarMobileTests/AgentLiveStageWiringTests
            OpenBurnBarMobileTests/HermesServiceTests/testMediaControlStreamUsesPublishedRelayURLAndMediaTimeout
            OpenBurnBarMobileTests/HermesServiceTests/testInlineMirrorRelayResolverUsesActiveMediaControlWhenRelayDiscoveryIsEmpty
            OpenBurnBarMobileTests/HermesServiceTests/testInlineMirrorRelayResolverPrefersDiscoveredRelayOverActiveMediaControl
            OpenBurnBarMobileTests/HermesServiceTests/testInlineMirrorRelayResolverRejectsStoppedMediaControlWithoutRelay
            OpenBurnBarMobileTests/MediaAttachmentManifestStoreTests
            OpenBurnBarMobileTests/MediaInboxFileProtectionTests
            OpenBurnBarMobileTests/MercuryPersonalizationTests
            OpenBurnBarMobileTests/MercuryTransferThumbnailCacheTests
            OpenBurnBarMobileTests/OpenBurnBarMobileTests/testMercuryReceiverInstallIsRetainedByRelayTransport
            OpenBurnBarMobileTests/OpenBurnBarMobileTests/testMercuryReceiverCanInstallWithoutBlobBackend
            OpenBurnBarMobileTests/OpenBurnBarMobileTests/testIrohRequestStreamRoutesSignalSessionMessagesToMediaDispatcher
            OpenBurnBarMobileTests/ScreenShareAutoTypeFollowPolicyTests
            OpenBurnBarMobileTests/ScreenShareControlInputPolicyTests
            OpenBurnBarMobileTests/ScreenSharePiPControllerTests
            OpenBurnBarMobileTests/ScreenShareSmartTextDoubleTapTests
            OpenBurnBarMobileTests/ScreenShareSmartZoomReducerTests
            OpenBurnBarMobileTests/ScreenShareStreamStateOverlayPolicyTests
            OpenBurnBarMobileTests/ScreenShareViewerStatsMeterTests
            OpenBurnBarMobileTests/ScreenShareViewportStateTests
        run: ./scripts/test-openburnbar-mobile.sh

  targeted-e2e-gate:
    name: Targeted E2E Gate
    needs:
      - path-filter
      - hermes-gateway-e2ee-proof
      - hermes-iroh-e2e
      - computer-use-e2e
      - mercury-media-e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all targeted E2E jobs passed
        env:
          PF_HERMES_GATEWAY: ${{ needs.path-filter.outputs.hermes_gateway_e2ee }}
          PF_HERMES_IROH: ${{ needs.path-filter.outputs.hermes_iroh }}
          PF_COMPUTER_USE: ${{ needs.path-filter.outputs.computer_use }}
          PF_MERCURY: ${{ needs.path-filter.outputs.mercury_media }}
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          # A SECURITY proof that was EXPECTED (its area changed, so the
          # path-filter flag is 'true') but did NOT run — e.g. a fork PR, or a
          # path the filter missed — must NOT silently pass. Previously every
          # skip counted as success, so the required check went green having
          # executed zero E2EE / Computer-Use / media security proofs.
          expected = {
              'hermes-gateway-e2ee-proof': os.environ.get('PF_HERMES_GATEWAY') == 'true',
              'hermes-iroh-e2e': os.environ.get('PF_HERMES_IROH') == 'true',
              'computer-use-e2e': os.environ.get('PF_COMPUTER_USE') == 'true',
              'mercury-media-e2e': os.environ.get('PF_MERCURY') == 'true',
          }
          failed = []
          for k, v in data.items():
              r = v.get('result')
              if k == 'path-filter':
                  if r not in ('success', 'skipped'):
                      failed.append(k + ' (path-filter job failed)')
                  continue
              if r == 'success':
                  continue
              if r == 'skipped':
                  if expected.get(k):
                      failed.append(k + ' (expected security proof skipped — fork PR or path miss; cannot auto-pass)')
                  continue
              failed.append(k + ' (result=' + str(r) + ')')
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following targeted E2E security-proof gate checks failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Targeted E2E: All required checks passed" >> "$GITHUB_STEP_SUMMARY"

  openburnbar-pr:
    name: openburnbar-pr
    needs:
      - platform-confidence-gate
      - targeted-e2e-gate
      - harness-required
      - harness-informational
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Preserve legacy required check while new gates prove out
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following aggregate gates failed:"
            echo "$failed"
            exit 1
          fi
          echo "### openburnbar-pr compatibility gate: passed" >> "$GITHUB_STEP_SUMMARY"
