name: OpenBurnBar PR Harness

permissions:
  contents: read

concurrency:
  group: pr-harness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
    types: [checks_requested]

jobs:
  platform-misc:
    name: Platform Misc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTERNAL_RUN: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Test OpenBurnBar app-test log classifier
        run: bash scripts/test-openburnbar-app-classifier.sh

      - name: Check unsafe cast debt budget
        run: ./scripts/debt/check-unsafe-cast-budget.sh

      - name: Check empty catch debt budget
        run: ./scripts/debt/check-empty-catch-budget.sh

      - name: Check try? debt budget
        run: ./scripts/debt/check-try-optional-budget.sh

      - name: Refresh tech debt metrics snapshot
        run: |
          set -euo pipefail
          ./scripts/ci/update-tech-debt-metrics.sh
          if ! git diff --quiet -- docs/TECH_DEBT_METRICS.md; then
            echo "docs/TECH_DEBT_METRICS.md is out of date. Run ./scripts/ci/update-tech-debt-metrics.sh and commit." >&2
            git diff -- docs/TECH_DEBT_METRICS.md >&2 || true
            exit 1
          fi

      - name: Detect dead feature flags
        run: |
          set -euo pipefail
          ./scripts/detect-dead-feature-flags.sh || true

      - name: Confirm fast security gate is active
        run: |
          set -euo pipefail
          if [[ ! -f .github/workflows/security-pr.yml ]]; then
            echo "::error::security-pr.yml is missing. Fast PR security gate must exist." >&2
            exit 1
          fi
          echo "security-pr.yml: present (gitleaks + dependency-review + npm-audit + OSV-scanner)"
          if [[ ! -f .github/workflows/codeql.yml ]]; then
            echo "::error::codeql.yml is missing. Nightly CodeQL scan must exist." >&2
            exit 1
          fi
          echo "codeql.yml: present (Swift + JS/TS + Python, security-extended, nightly)"

  functions-integration:
    name: Functions Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install OpenBurnBar Functions dependencies
        run: npm ci --prefix functions

      - name: Build OpenBurnBar Functions
        run: |
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          npm --prefix functions run build
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "functions_build_ms=$((END - START))" >> "$GITHUB_ENV"
          echo "Functions build: $((END - START))ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Run OpenBurnBar Functions tests
        run: |
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          npm --prefix functions test
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "Functions tests: $((END - START))ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify callable logging (ops)
        run: bash scripts/ci/verify-callable-logging.sh

      - name: Verify resilience wiring (ops)
        run: bash scripts/ci/verify-resilience-wiring.sh

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      INTERNAL_RUN: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 21 (Android)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Inject Android Firebase config (internal PRs)
        if: env.INTERNAL_RUN == 'true' && env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Skip Android Firebase config (fork PRs)
        if: env.INTERNAL_RUN != 'true'
        run: |
          echo "Skipping Android Firebase config for fork PR."
          echo "A dummy google-services.json is generated so gradle can resolve the plugin."
          python3 -c "
          import json, pathlib
          pathlib.Path('android/app').mkdir(parents=True, exist_ok=True)
          pathlib.Path('android/app/google-services.json').write_text(json.dumps({
              'project_info': {'project_id': 'burnbar-ci-dummy', 'project_number': '000000000000'},
              'client': [{'client_info': {'mobilesdk_app_id': '1:000000000000:android:0000000000000000',
              'android_client_info': {'package_name': 'com.openburnbar'}},
              'api_key': [{'current_key': '*************************************'}],
              'services': {}}],
              'configuration_version': '1'
          }))
          "

      - name: Skip Android Firebase config when secrets unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_ANDROID_SECRETS != 'true'
        run: echo "Android Firebase secret is unavailable; building without injected config."

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Lint Kotlin (ktlint)
        run: |
          set -euo pipefail
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          cd android && ./gradlew ktlintCheck --no-daemon
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "ktlint: $((END - START))ms — no violations found" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Android unit tests
        run: ./scripts/test-openburnbar-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  node-evals:
    name: Node Evals
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install OpenBurnBar extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Run OpenBurnBar replay evals
        run: ./scripts/test-openburnbar-replay-evals.sh

      - name: Run OpenBurnBar extension-host tests
        run: ./scripts/test-openburnbar-extension-host.sh

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the Rule-0 guard can diff against the PR base ref
          # (and resolve the libsignal submodule gitlink pointer change).
          fetch-depth: 0

      - name: Rule-0 supply-chain tamper guard (libsignal submodule / FFI / .gitmodules / licenses)
        # Always-run, fail-closed. Previously this guard existed but was wired
        # into ZERO workflows, so a PR repointing the libsignal submodule at a
        # hostile fork (or swapping the FFI xcframework / license files) faced no
        # PR-time enforcement. It runs on EVERY PR including forks (no secrets).
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          echo "Rule-0 diff base: $BASE"
          bash scripts/ci/verify-signal-rule0.sh "$BASE"

      - name: Run supply chain audit (SBOM + VEX + ecosystem deny)
        run: |
          set -euo pipefail
          PR_SBOM="$RUNNER_TEMP/openburnbar-pr.sbom.spdx.json"
          python3 scripts/generate-sbom.py \
            --version "pr-${GITHUB_SHA::7}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$PR_SBOM"
          python3 scripts/supply-chain/generate-vex.py \
            --sbom "$PR_SBOM" \
            --output "$RUNNER_TEMP/openburnbar-pr.vex.json" \
            --product-version "pr-${GITHUB_SHA::7}"
          bash scripts/supply-chain/run-ecosystem-deny-checks.sh

  swift-core:
    name: Swift Core
    runs-on: macos-26
    # The WS6 safety harness builds Rust FFI deps; on a cold cache + slow
    # runner the old 20 min budget was hit mid-compile.
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Run OpenBurnBar Swift tests
        env:
          XCODEBUILD_RETRY_ON_FAILURE: "YES"
          XCODEBUILD_TEST_ITERATIONS: "3"
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-swift.sh

      - name: Computer Use safety invariant harness (WS6 gate)
        run: OPENBURNBAR_CORE_SWIFT_FILTER='ComputerUseSafetyInvariantHarnessTests|ComputerUseTrustPanicInvariantTests|PrivilegedInputKillSwitchTests' OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh

  app-xctest:
    name: App XCTest
    runs-on: macos-26
    # 3000+ tests and growing; 45 min was hit at suite tail on slow runners.
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      INTERNAL_RUN: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: SwiftLint (informational)
        continue-on-error: true
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "swiftlint not installed; skipping informational lint."
          fi

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: App Check config smoke
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          INTERNAL_RUN: ${{ env.INTERNAL_RUN }}
        run: bash ./scripts/ci/app-check-smoke.sh

      - name: Skip Firebase config injection for fork PRs
        if: env.INTERNAL_RUN != 'true'
        run: echo "Skipping Firebase config injection for fork PR; auth remains disabled in CI."

      - name: Skip Firebase config injection when secrets are unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS != 'true'
        run: echo "Firebase CI secrets are unavailable; running tests without injected auth config."

      - name: Run OpenBurnBar app tests
        env:
          XCODEBUILD_RETRY_ON_FAILURE: "YES"
          XCODEBUILD_TEST_ITERATIONS: "3"
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-app.sh

      - name: Verify OpenBurnBar app SwiftPM lockfile
        run: ./scripts/check-openburnbar-app-swiftpm-lock.sh

      - name: Extract code coverage
        if: success() && env.INTERNAL_RUN == 'true'
        run: |
          set -euo pipefail
          xcresult="$GITHUB_WORKSPACE/.derived-data/OpenBurnBar_TestCoverage.xcresult"
          if [[ ! -d "$xcresult" ]]; then
            echo "Missing xcresult at $xcresult — app tests must emit coverage on internal PRs." >&2
            exit 1
          fi
          ./scripts/extract-coverage.sh "$xcresult" > "$GITHUB_WORKSPACE/openburnbar-coverage.json"

      - name: Compute diff coverage
        if: github.event_name == 'pull_request' && env.INTERNAL_RUN == 'true'
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/openburnbar-coverage.json"
          ./scripts/diff-coverage.sh origin/main "$GITHUB_WORKSPACE/openburnbar-coverage.json"

      - name: Post coverage summary
        if: always()
        run: |
          {
            echo "### Code Coverage"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/openburnbar-coverage.json" ]; then
              total_pct=$(jq -r '.summary.percent // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              total_exc=$(jq -r '.summary.executableLines // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              total_hit=$(jq -r '.summary.coveredLines // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              echo "Overall coverage: **${total_pct}%** (${total_hit}/${total_exc} lines)"
              echo ""
            fi
            diff_cov="$GITHUB_WORKSPACE/openburnbar-diff-coverage.json"
            if [ -f "$diff_cov" ]; then
              threshold=$(jq -r '.diffCoverage.threshold // 80' "$diff_cov")
              percent=$(jq -r '.diffCoverage.percent // 0.0' "$diff_cov")
              passed=$(jq -r '.diffCoverage.passed // false' "$diff_cov")
              files=$(jq -r '.diffCoverage.changedFiles // 0' "$diff_cov")
              lines=$(jq -r '.diffCoverage.changedLines // 0' "$diff_cov")
              echo "Diff coverage: **${percent}%** (threshold: ${threshold}%)"
              echo "Changed files: ${files} | Changed executable lines: ${lines}"
              if [ "$passed" = "true" ]; then
                echo "Status: passed"
              else
                echo "Status: failed — new code coverage below threshold"
              fi
              echo ""
              echo "| File | Executable | Covered | % |"
              echo "|------|-----------|---------|---|"
              jq -r '.details[] | "| \(.file) | \(.executableLines) | \(.coveredLines) | \(.percent) |"' "$diff_cov" | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            openburnbar-coverage.json
            openburnbar-diff-coverage.json

      - name: Clean up Firebase config
        if: always() && env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        run: bash ./scripts/ci/cleanup-firebase-config.sh

  ios-mobile:
    name: iOS Mobile
    runs-on: macos-26
    # Internal hosted macOS runs build the Signal FFI and then compile the full
    # mobile target before tests start. Keep the lane bounded while allowing
    # cold runners enough room to reach the test phase.
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      INTERNAL_RUN: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Skip Firebase config injection for fork PRs
        if: env.INTERNAL_RUN != 'true'
        run: echo "Skipping Firebase config injection for fork PR; auth remains disabled in CI."

      - name: Skip Firebase config injection when secrets are unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS != 'true'
        run: echo "Firebase CI secrets are unavailable; running tests without injected auth config."

      - name: Run OpenBurnBar mobile unit tests
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-mobile.sh

      - name: Clean up Firebase config
        if: always() && env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        run: bash ./scripts/ci/cleanup-firebase-config.sh

  retrieval-evals:
    name: Retrieval Evals
    runs-on: macos-26
    # Cold macOS runners can spend most of the first 20 minutes compiling the
    # Signal FFI before the replay suite starts, so keep this lane bounded but
    # large enough for the actual retrieval evals to run.
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      INTERNAL_RUN: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Skip Firebase config injection for fork PRs
        if: env.INTERNAL_RUN != 'true'
        run: echo "Skipping Firebase config injection for fork PR; auth remains disabled in CI."

      - name: Skip Firebase config injection when secrets are unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS != 'true'
        run: echo "Firebase CI secrets are unavailable; running tests without injected auth config."

      - name: Run OpenBurnBar retrieval replay evals
        run: ./scripts/test-openburnbar-retrieval-evals.sh

      - name: Clean up Firebase config
        if: always() && env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        run: bash ./scripts/ci/cleanup-firebase-config.sh

  platform-confidence-gate:
    name: Platform Confidence Gate
    needs:
      - platform-misc
      - functions-integration
      - android
      - node-evals
      - supply-chain
      - swift-core
      - app-xctest
      - ios-mobile
      - retrieval-evals
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all platform jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following platform confidence jobs failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Platform Confidence: All checks passed" >> "$GITHUB_STEP_SUMMARY"

  path-filter:
    runs-on: ubuntu-latest
    outputs:
      hermes_iroh: ${{ steps.filter.outputs.hermes_iroh }}
      hermes_gateway_e2ee: ${{ steps.filter.outputs.hermes_gateway_e2ee }}
      computer_use: ${{ steps.filter.outputs.computer_use }}
      mercury_media: ${{ steps.filter.outputs.mercury_media }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            {
              echo "hermes_iroh=true"
              echo "hermes_gateway_e2ee=true"
              echo "computer_use=true"
              echo "mercury_media=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          echo "$CHANGED" > /tmp/changed-paths.txt
          match() { grep -Eq "$1" /tmp/changed-paths.txt; }
          if match '^OpenBurnBarCore/|^android/.*/hermes/|^functions/src/hermes|^functions/src/.*iroh|^OpenBurnBarMobile/.*iroh|^scripts/e2e/.*iroh'; then
            echo "hermes_iroh=true" >> "$GITHUB_OUTPUT"
          else
            echo "hermes_iroh=false" >> "$GITHUB_OUTPUT"
          fi
          if match '^docs/HERMES_GATEWAY_E2EE_REMEDIATION_PLAN\.md$|^functions/src/hermesGateway\.ts$|^functions/src/callables/(hermesGateway|dataExport|privacyBackfill)\.ts$|^functions/src/types/generated/hermes-gateway\.ts$|^functions/src/__tests__/hermesGateway.*\.test\.ts$|^functions/src/__tests__/(dataExport|privacyBackfill)\.test\.ts$|^functions/scripts/test-hermes-gateway\.mjs$|^functions/scripts/test-firestore-rules\.mjs$|^firestore\.rules$|^scripts/privacy/scan-chat-cloud-plaintext\.mjs$|^scripts/ci/verify-hermes-gateway-e2ee-remediation\.sh$|^tools/hermes-platform-burnbar/|^tools/schema-sync/|^OpenBurnBarCore/.*Hermes(Relay|Ratchet)|^OpenBurnBarCore/Sources/OpenBurnBarFirestoreModels/HermesGatewayModels\.swift$|^OpenBurnBarCore/Tests/OpenBurnBarCoreTests/(BurnBarHpkeV3|HermesRelayHPKEv3)|^OpenBurnBarCore/Tests/OpenBurnBarCoreTests/Fixtures/BurnBarHpkeV3Vector\.json$|^OpenBurnBarMobile/Services/(FunctionsRepository|HermesService|HermesGatewayRelayKeypair|.*HermesGateway).*\.swift$|^OpenBurnBarMobileTests/.*Hermes.*\.swift$|^OpenBurnBarMobileTests/OpenBurnBarMobileTests\.swift$|^android/app/src/main/java/com/openburnbar/data/firebase/FunctionsRepository\.kt$|^android/app/src/test/java/com/openburnbar/data/firebase/FunctionsRepositoryHermesGatewayTest\.kt$|^android/app/src/main/java/com/openburnbar/data/models/generated/HermesGatewayModels\.kt$|^android/app/src/main/java/com/openburnbar/data/hermes/|^android/app/src/test/java/com/openburnbar/data/hermes/|^android/app/src/test/resources/hermes-relay/'; then
            echo "hermes_gateway_e2ee=true" >> "$GITHUB_OUTPUT"
          else
            echo "hermes_gateway_e2ee=false" >> "$GITHUB_OUTPUT"
          fi
          if match '^OpenBurnBarCore/Sources/OpenBurnBarComputerUseCore/|^OpenBurnBarDaemon/.*ComputerUse|^OpenBurnBarDaemon/Resources/PlaywrightBridge/|^scripts/test-computer-use|^scripts/install-playwright'; then
            echo "computer_use=true" >> "$GITHUB_OUTPUT"
          else
            echo "computer_use=false" >> "$GITHUB_OUTPUT"
          fi
          if match '^OpenBurnBarMobile/.*[Mm]edia|^OpenBurnBarMobile/.*[Mm]ercury|^android/.*/media/|^AgentLens/Services/Media/|^functions/src/media'; then
            echo "mercury_media=true" >> "$GITHUB_OUTPUT"
          else
            echo "mercury_media=false" >> "$GITHUB_OUTPUT"
          fi

  hermes-gateway-e2ee-proof:
    needs: [path-filter]
    if: needs.path-filter.outputs.hermes_gateway_e2ee == 'true' && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Ajnunezg/hermes-agent
          # Keep this immutable: the gate runs with repo credentials in scope.
          # To bump, update third_party/hermes-agent/manifest.json first, run
          # scripts/ci/verify-vendored-agent-source.sh, then copy pinnedCommit here.
          # The provenance step below FAILS if this ref and the manifest drift,
          # so the gate always executes the exact commit the manifest attests
          # (diligence 2026-06-11 LB-4: attestation and gate had split across
          # two different commits).
          ref: bdb830070927cbb20763819f91ee930548f7da92
          path: .ci/hermes-agent

      - name: Verify vendored agent provenance (C-5, on PRs)
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.ci/hermes-agent
        run: |
          set -euo pipefail
          manifest_pin="$(python3 -c 'import json;print(json.load(open("third_party/hermes-agent/manifest.json"))["pinnedCommit"])')"
          checkout_head="$(git -C .ci/hermes-agent rev-parse HEAD)"
          if [[ "$manifest_pin" != "$checkout_head" ]]; then
            echo "ERROR: harness checkout ($checkout_head) != manifest pinnedCommit ($manifest_pin)." >&2
            echo "The E2EE proof would run against a commit the provenance manifest does not attest." >&2
            echo "Update the checkout ref above and the manifest together." >&2
            exit 1
          fi
          bash scripts/ci/verify-vendored-agent-source.sh

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Hermes gateway test dependencies
        run: |
          set -euo pipefail
          python3 -m venv .ci/hermes-agent/.venv
          .ci/hermes-agent/.venv/bin/python -m pip install --upgrade pip
          .ci/hermes-agent/.venv/bin/python -m pip install -e '.ci/hermes-agent[dev,gateway-e2ee]'

      - name: Hermes Gateway E2EE remediation proof
        env:
          HERMES_AGENT_CHECKOUT: ${{ github.workspace }}/.ci/hermes-agent
          HERMES_PYTHON: ${{ github.workspace }}/.ci/hermes-agent/.venv/bin/python
          HERMES_GATEWAY_OVERLAY_ADAPTER: "1"
          HERMES_GATEWAY_EXTERNAL_PYTEST_REQUIRED: "1"
        run: bash scripts/ci/verify-hermes-gateway-e2ee-remediation.sh

  hermes-iroh-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.hermes_iroh == 'true' && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Hermes relay unit tests (Functions)
        run: npm ci --prefix functions && npm --prefix functions run test:hermes
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version
      - name: Hermes core Swift tests
        run: OPENBURNBAR_CORE_SWIFT_FILTER=OpenBurnBarCoreTests/Hermes OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Android iroh-relay JVM tests
        run: cd android && ./gradlew :openburnbar-iroh-relay:testDebugUnitTest --no-daemon

  android-hermes-smoke:
    needs: [path-filter]
    if: >-
      github.event_name != 'pull_request' &&
      needs.path-filter.outputs.hermes_iroh == 'true' &&
      vars.ANDROID_E2E_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Inject Android Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh
      - name: Android Hermes instrumented smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          script: ./scripts/e2e/android-iroh-chat.sh

  computer-use-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.computer_use == 'true' && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    # macos-26 like every other Swift job: Vendor/libsignal/swift declares
    # swift-tools-version 6.0, which macos-14's default toolchain (5.10) rejects.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version
      - name: Computer Use core tests
        run: OPENBURNBAR_CORE_SWIFT_FILTER=OpenBurnBarComputerUseCoreTests OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh
      - name: Install Playwright (pinned)
        run: bash scripts/install-playwright.sh
      - name: Playwright bridge loopback smoke
        env:
          OPENBURNBAR_PLAYWRIGHT_BRIDGE: ${{ github.workspace }}/OpenBurnBarDaemon/Resources/PlaywrightBridge/openburnbar-playwright-bridge.js
        run: bash scripts/test-computer-use-loopback.sh

  mercury-media-e2e:
    needs: [path-filter]
    if: needs.path-filter.outputs.mercury_media == 'true' && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: macos-26
    # 35 min was sized when this job failed at gradle config in 2 min; the full
    # JVM-tests + Signal FFI prep + iOS suite path needs more headroom.
    timeout-minutes: 60
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      # gradle's processDebugGoogleServices needs google-services.json; this job
      # previously had no inject step, so it failed before any test ran.
      - name: Inject Android Firebase config
        if: env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh
      - name: Generate dummy google-services.json when secret unavailable
        if: env.HAS_ANDROID_SECRETS != 'true'
        run: |
          python3 -c "
          import json, pathlib
          pathlib.Path('android/app').mkdir(parents=True, exist_ok=True)
          pathlib.Path('android/app/google-services.json').write_text(json.dumps({
              'project_info': {'project_id': 'burnbar-ci-dummy', 'project_number': '000000000000'},
              'client': [{'client_info': {'mobilesdk_app_id': '1:000000000000:android:0000000000000000',
              'android_client_info': {'package_name': 'com.openburnbar'}},
              'api_key': [{'current_key': '*************************************'}],
              'services': {}}],
              'configuration_version': '1'
          }))
          "
      - name: Android media JVM tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --tests "com.openburnbar.ui.media.*" --tests "com.openburnbar.data.media.*" --no-daemon
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version
      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh
      # The OpenBurnBarMobile target declares GoogleService-Info.plist as a
      # build input, so the iOS test step needs the same inject the other
      # iOS jobs run.
      - name: Inject Firebase config
        if: env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh
      - name: iOS Mercury/media unit tests
        # GitHub macOS runners have no USB physical devices; the script falls back to iOS Simulator in CI.
        run: ./scripts/test-openburnbar-mobile.sh

  targeted-e2e-gate:
    name: Targeted E2E Gate
    needs:
      - path-filter
      - hermes-gateway-e2ee-proof
      - hermes-iroh-e2e
      - computer-use-e2e
      - mercury-media-e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all targeted E2E jobs passed
        env:
          PF_HERMES_GATEWAY: ${{ needs.path-filter.outputs.hermes_gateway_e2ee }}
          PF_HERMES_IROH: ${{ needs.path-filter.outputs.hermes_iroh }}
          PF_COMPUTER_USE: ${{ needs.path-filter.outputs.computer_use }}
          PF_MERCURY: ${{ needs.path-filter.outputs.mercury_media }}
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          # A SECURITY proof that was EXPECTED (its area changed, so the
          # path-filter flag is 'true') but did NOT run — e.g. a fork PR, or a
          # path the filter missed — must NOT silently pass. Previously every
          # skip counted as success, so the required check went green having
          # executed zero E2EE / Computer-Use / media security proofs.
          expected = {
              'hermes-gateway-e2ee-proof': os.environ.get('PF_HERMES_GATEWAY') == 'true',
              'hermes-iroh-e2e': os.environ.get('PF_HERMES_IROH') == 'true',
              'computer-use-e2e': os.environ.get('PF_COMPUTER_USE') == 'true',
              'mercury-media-e2e': os.environ.get('PF_MERCURY') == 'true',
          }
          failed = []
          for k, v in data.items():
              r = v.get('result')
              if k == 'path-filter':
                  if r not in ('success', 'skipped'):
                      failed.append(k + ' (path-filter job failed)')
                  continue
              if r == 'success':
                  continue
              if r == 'skipped':
                  if expected.get(k):
                      failed.append(k + ' (expected security proof skipped — fork PR or path miss; cannot auto-pass)')
                  continue
              failed.append(k + ' (result=' + str(r) + ')')
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following targeted E2E security-proof gate checks failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Targeted E2E: All required checks passed" >> "$GITHUB_STEP_SUMMARY"

  openburnbar-pr:
    name: openburnbar-pr
    needs:
      - platform-confidence-gate
      - targeted-e2e-gate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Preserve legacy required check while new gates prove out
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following aggregate gates failed:"
            echo "$failed"
            exit 1
          fi
          echo "### openburnbar-pr compatibility gate: passed" >> "$GITHUB_STEP_SUMMARY"
