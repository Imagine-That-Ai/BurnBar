name: OpenBurnBar Full Harness

# Full-confidence lane. This is intentionally not a pull_request or
# merge_group gate: daily PR velocity is owned by fast-feedback.yml and
# security-pr.yml. This workflow runs after merge, nightly, and on demand.
#
# Required / informational split (P-QA-1):
#   The harness historically never went green because deterministic gates and
#   flaky external-dependency jobs were collapsed into a single aggregate, so
#   ambient infra rot masked real regressions. Jobs are now partitioned into
#   two aggregates so "harness red" is defined only by deterministic failures:
#
#   harness-required (blocks "harness green"):
#     platform-misc, functions-integration, windows, swift-core, app-xctest,
#     supply-chain -- infra-light, deterministic, no emulator/external checkout.
#
#   harness-informational (alerts, does not block):
#     android, node-evals, ios-mobile, retrieval-evals,
#     hermes-gateway-e2ee-proof, hermes-iroh-e2e, android-hermes-smoke,
#     computer-use-e2e, mercury-media-e2e -- jobs with external deps, emulator
#     boot, or virtualization requirements whose failures must stay visible but
#     must not define "harness red" (per Operation 9 plan: "splitting is NOT
#     allowed to drop coverage -- every job stays running").
#
#   The pre-existing platform-confidence-gate and targeted-e2e-gate aggregates
#   are retained so no coverage is dropped; the new aggregates layer on top.

permissions:
  contents: read

concurrency:
  group: full-harness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI-cost hardening (owner directive 2026-07-31): the per-push trigger ran the
# full ~300-macOS-minute harness on EVERY merge to main (~25 pushes/48h =
# ~112K macOS minutes/month) while 9 of 16 runs were cancelled or failed
# anyway. The daily cron below remains the authoritative full-confidence lane;
# use workflow_dispatch for an on-demand post-merge proof of a specific SHA.
on:
  workflow_dispatch:
    inputs:
      force_mercury_media_e2e:
        description: "Run the Mercury/media targeted E2E lane even when changed-path detection would skip it."
        required: false
        type: boolean
        default: false
  schedule:
    # 08:37 UTC daily. Avoid the top of the hour; GitHub documents higher
    # scheduler contention there.
    - cron: "37 8 * * *"

jobs:
  platform-misc:
    name: Platform Misc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTERNAL_RUN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Test OpenBurnBar app-test log classifier
        run: bash scripts/test-openburnbar-app-classifier.sh

      - name: Check unsafe cast debt budget
        run: ./scripts/debt/check-unsafe-cast-budget.sh

      - name: Check empty catch debt budget
        run: ./scripts/debt/check-empty-catch-budget.sh

      - name: Check try? debt budget
        run: ./scripts/debt/check-try-optional-budget.sh

      - name: Check unchecked Sendable debt budget
        run: ./scripts/debt/check-unchecked-sendable-budget.sh

      - name: Check Rust panic debt budget (unwrap/expect)
        run: ./scripts/debt/check-rust-panic-budget.sh

      - name: Check service SwiftUI import budget
        run: ./scripts/debt/check-service-swiftui-import-budget.sh

      - name: Test debt counters
        run: |
          set -euo pipefail
          python3 tools/error-debt/test_count_error_debt.py
          python3 tools/concurrency-debt/test_count_task_detached.py

      - name: Check Swift file-size debt budget (shrink-only)
        run: ./scripts/debt/check-swift-file-size-budget.sh

      - name: Check usage refresh-tick budget (shrink-only)
        run: ./scripts/debt/check-usage-refresh-tick-budget.sh

      - name: Refresh tech debt metrics snapshot
        run: |
          set -euo pipefail
          ./scripts/ci/update-tech-debt-metrics.sh
          if ! git diff --quiet -- docs/TECH_DEBT_METRICS.md; then
            echo "docs/TECH_DEBT_METRICS.md is out of date. Run ./scripts/ci/update-tech-debt-metrics.sh and commit." >&2
            git diff -- docs/TECH_DEBT_METRICS.md >&2 || true
            exit 1
          fi

      - name: Detect dead feature flags
        run: |
          set -euo pipefail
          ./scripts/detect-dead-feature-flags.sh --fail-on-stale

      - name: Confirm fast security gate is active
        run: |
          set -euo pipefail
          if [[ ! -f .github/workflows/security-pr.yml ]]; then
            echo "::error::security-pr.yml is missing. Fast PR security gate must exist." >&2
            exit 1
          fi
          echo "security-pr.yml: present (gitleaks + dependency-review + npm-audit + OSV-scanner)"
          if [[ ! -f .github/workflows/codeql.yml ]]; then
            echo "::error::codeql.yml is missing. Nightly CodeQL scan must exist." >&2
            exit 1
          fi
          echo "codeql.yml: present (Swift + JS/TS + Python, security-extended, nightly)"

  functions-integration:
    name: Functions Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Install OpenBurnBar Functions dependencies
        run: npm ci --prefix functions

      - name: Build OpenBurnBar Functions
        run: |
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          npm --prefix functions run build
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "functions_build_ms=$((END - START))" >> "$GITHUB_ENV"
          echo "Functions build: $((END - START))ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Run OpenBurnBar Functions tests
        run: |
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          npm --prefix functions test
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "Functions tests: $((END - START))ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify callable logging (ops)
        run: bash scripts/ci/verify-callable-logging.sh

      - name: Verify resilience wiring (ops)
        run: bash scripts/ci/verify-resilience-wiring.sh

      - name: Verify callable input validation (security ratchet)
        # R-S1: every new callable that reads a client payload must validate it.
        # Self-test the scanner first, then run the shrink-only offender ratchet so
        # an unvalidated callable can never merge without failing this gate.
        run: |
          node --test scripts/ci/check-callable-validation.test.mjs
          node scripts/ci/check-callable-validation.mjs

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALLOW_ANDROID_FIREBASE_SECRET_RUN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Java 21 (Android)
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865"

      - name: Use Android Firebase template when secret run is not allowed
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN != 'true' || env.HAS_ANDROID_SECRETS != 'true'
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Inject Android Firebase config
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN == 'true' && env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Android 16 KB native page-size compatibility
        run: bash scripts/ci/verify-android-16kb-page-size.sh

      - name: Lint Kotlin (ktlint)
        run: |
          set -euo pipefail
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          cd android && ./gradlew ktlintCheck --no-daemon
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          echo "ktlint: $((END - START))ms — no violations found" >> "$GITHUB_STEP_SUMMARY"

      - name: Ban unjustified suppressions + baselines (meta-gate)
        run: bash scripts/ci/check-no-suppressions.sh

      - name: Lint Kotlin (detekt)
        run: cd android && ./gradlew :app:detekt --no-daemon

      - name: Run Android unit tests
        run: ./scripts/test-openburnbar-android.sh

      - name: Android diff coverage (JaCoCo line evidence)
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:jacocoTestReport --no-daemon)
          git fetch origin main --depth=1 2>/dev/null || true
          ./scripts/diff-coverage-android.sh origin/main

      - name: Upload Android APK
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN != 'true' || env.HAS_ANDROID_SECRETS != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Skip Android APK artifact after real Firebase config injection
        if: env.ALLOW_ANDROID_FIREBASE_SECRET_RUN == 'true' && env.HAS_ANDROID_SECRETS == 'true'
        run: echo "Skipping debug APK artifact because this run injected the real Android Firebase config."

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Verify Windows solution
        run: |
          if (-not (Test-Path "windows/OpenBurnBar.sln")) {
            throw "windows/OpenBurnBar.sln not found."
          }
          Write-Host "Windows solution present."

      - name: Restore Windows solution
        run: dotnet restore windows/OpenBurnBar.sln

      - name: Build native shared domain core
        run: cargo build --manifest-path crates/openburnbar-domain-core/Cargo.toml -p openburnbar-domain-ffi

      - name: Build Windows solution
        run: dotnet build windows/OpenBurnBar.sln --configuration Debug --no-restore -p:Platform=x64

      - name: Run Windows test suite
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: dotnet test windows/OpenBurnBar.sln --configuration Debug --no-build --logger trx --results-directory TestResults-x64

      - name: Verify complete Windows test evidence
        run: node scripts/windows-port/verify-trx-results.mjs --results-directory TestResults-x64 --minimum-files 40 --minimum-tests 4082 --maximum-not-executed 15

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: full-harness-windows-x64-test-results
          path: TestResults-x64/
          if-no-files-found: error

  node-evals:
    name: Node Evals
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install OpenBurnBar extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Run OpenBurnBar replay evals
        run: ./scripts/test-openburnbar-replay-evals.sh

      - name: Run OpenBurnBar extension-host tests
        run: |
          ./scripts/test-openburnbar-extension-host-self-test.sh
          ./scripts/test-openburnbar-extension-host.sh

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # Full history so the Rule-0 guard can diff against the PR base ref
          # (and resolve the libsignal submodule gitlink pointer change).
          fetch-depth: 0

      - name: Rule-0 supply-chain tamper guard (libsignal submodule / FFI / .gitmodules / licenses)
        # Always-run, fail-closed. Previously this guard existed but was wired
        # into ZERO workflows, so a PR repointing the libsignal submodule at a
        # hostile fork (or swapping the FFI xcframework / license files) faced no
        # PR-time enforcement. It runs on EVERY PR including forks (no secrets).
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          echo "Rule-0 diff base: $BASE"
          bash scripts/ci/verify-signal-rule0.sh "$BASE"

      - name: Run supply chain audit (SBOM + VEX + ecosystem deny)
        run: |
          set -euo pipefail
          PR_SBOM="$RUNNER_TEMP/openburnbar-pr.sbom.spdx.json"
          python3 scripts/generate-sbom.py \
            --version "pr-${GITHUB_SHA::7}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$PR_SBOM"
          python3 scripts/supply-chain/generate-vex.py \
            --sbom "$PR_SBOM" \
            --output "$RUNNER_TEMP/openburnbar-pr.vex.json" \
            --product-version "pr-${GITHUB_SHA::7}"
          bash scripts/supply-chain/run-ecosystem-deny-checks.sh

  swift-core:
    name: Swift Core
    runs-on: macos-26
    # The WS6 safety harness builds Rust FFI deps; on a cold cache + slow
    # runner the old 20 min budget was hit mid-compile.
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Run OpenBurnBar Swift tests
        env:
          XCODEBUILD_RETRY_ON_FAILURE: "YES"
          XCODEBUILD_TEST_ITERATIONS: "3"
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-swift.sh

      - name: Computer Use safety invariant harness (WS6 gate)
        run: OPENBURNBAR_CORE_SWIFT_FILTER='ComputerUseSafetyInvariantHarnessTests|ComputerUseTrustPanicInvariantTests|PrivilegedInputKillSwitchTests' OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh

  app-xctest:
    name: App XCTest
    runs-on: macos-26
    # 3000+ tests and growing; 45 min was hit at suite tail on slow runners.
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      INTERNAL_RUN: "true"
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: SwiftLint
        # The previous "informational" step never executed — swiftlint was
        # absent from the runner image and the step skipped with
        # continue-on-error (diligence quality-gate theater). Now: pinned
        # binary, recalibrated config, and no checked-in suppression baseline.
        run: |
          set -euo pipefail
          VER="0.63.3"
          SHA="fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6"
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${VER}/portable_swiftlint.zip"
          echo "${SHA}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint-bin
          /tmp/swiftlint-bin/swiftlint version
          /tmp/swiftlint-bin/swiftlint lint --quiet --strict

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          OPENBURNBAR_USE_DEBUG_APP_CHECK: "YES"
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Skip Firebase config injection for fork PRs
        if: env.INTERNAL_RUN != 'true'
        run: echo "Skipping Firebase config injection for fork PR; auth remains disabled in CI."

      - name: Skip Firebase config injection when secrets are unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS != 'true'
        run: echo "Firebase CI secrets are unavailable; running tests without injected auth config."

      - name: Run OpenBurnBar app tests
        # Unfiltered OpenBurnBarTests corpus — includes DomainCoreShadowEvidenceSpoolTests.
        # That focused spool selector is skipped from domain-core swift-consumer-contracts
        # on pull_request/merge_group (app-graph rebuild cost); this nightly/dispatch lane
        # plus domain-core push/dispatch remain the coverage homes.
        env:
          XCODEBUILD_RETRY_ON_FAILURE: "YES"
          XCODEBUILD_TEST_ITERATIONS: "3"
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-app.sh

      - name: Guard against "Executed 0 tests" false-green
        # An unregistered Xcode test file (missing project.pbxproj membership)
        # compiles to nothing and runs zero tests while the lane stays green.
        # Assert the app xcresult actually recorded executed tests.
        if: success()
        run: ./scripts/ci/check-executed-test-count.sh "$GITHUB_WORKSPACE/.derived-data/OpenBurnBar_TestCoverage.xcresult"

      - name: Verify OpenBurnBar app SwiftPM lockfile
        run: ./scripts/check-openburnbar-app-swiftpm-lock.sh

      - name: Extract code coverage
        if: success() && env.INTERNAL_RUN == 'true'
        run: |
          set -euo pipefail
          xcresult="$GITHUB_WORKSPACE/.derived-data/OpenBurnBar_TestCoverage.xcresult"
          if [[ ! -d "$xcresult" ]]; then
            echo "Missing xcresult at $xcresult — app tests must emit coverage on internal PRs." >&2
            exit 1
          fi
          ./scripts/extract-coverage.sh "$xcresult" > "$GITHUB_WORKSPACE/openburnbar-coverage.json"

      - name: Post coverage summary
        if: always()
        run: |
          {
            echo "### Code Coverage"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/openburnbar-coverage.json" ]; then
              total_pct=$(jq -r '.summary.percent // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              total_exc=$(jq -r '.summary.executableLines // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              total_hit=$(jq -r '.summary.coveredLines // 0' "$GITHUB_WORKSPACE/openburnbar-coverage.json")
              echo "Overall coverage: **${total_pct}%** (${total_hit}/${total_exc} lines)"
              echo ""
            fi
            diff_cov="$GITHUB_WORKSPACE/openburnbar-diff-coverage.json"
            if [ -f "$diff_cov" ]; then
              threshold=$(jq -r '.diffCoverage.threshold // 80' "$diff_cov")
              percent=$(jq -r '.diffCoverage.percent // 0.0' "$diff_cov")
              passed=$(jq -r '.diffCoverage.passed // false' "$diff_cov")
              files=$(jq -r '.diffCoverage.changedFiles // 0' "$diff_cov")
              lines=$(jq -r '.diffCoverage.changedLines // 0' "$diff_cov")
              echo "Diff coverage: **${percent}%** (threshold: ${threshold}%)"
              echo "Changed files: ${files} | Changed executable lines: ${lines}"
              if [ "$passed" = "true" ]; then
                echo "Status: passed"
              else
                echo "Status: failed — new code coverage below threshold"
              fi
              echo ""
              echo "| File | Executable | Covered | % |"
              echo "|------|-----------|---------|---|"
              jq -r '.details[] | "| \(.file) | \(.executableLines) | \(.coveredLines) | \(.percent) |"' "$diff_cov" | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always() && !env.ACT
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: coverage-data
          path: |
            openburnbar-coverage.json
            openburnbar-diff-coverage.json

      - name: Clean up Firebase config
        if: always() && env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        run: bash ./scripts/ci/cleanup-firebase-config.sh

  ios-mobile:
    name: iOS Mobile
    runs-on: macos-26
    # Internal hosted macOS runs build Signal FFI, compile the full mobile
    # target, then execute the full OpenBurnBarMobileTests bundle. The June 18,
    # 2026 main proof run hit the previous 90-minute cap while XCTest was still
    # making progress through the StoreKit-backed quota tests. Keep the lane
    # bounded, but give the full-confidence mobile proof enough room to finish
    # instead of failing after all earlier platform gates have passed.
    timeout-minutes: 180
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      INTERNAL_RUN: "true"
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          OPENBURNBAR_USE_DEBUG_APP_CHECK: "YES"
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Skip Firebase config injection for fork PRs
        if: env.INTERNAL_RUN != 'true'
        run: echo "Skipping Firebase config injection for fork PR; auth remains disabled in CI."

      - name: Skip Firebase config injection when secrets are unavailable
        if: env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS != 'true'
        run: echo "Firebase CI secrets are unavailable; running tests without injected auth config."

      - name: Run OpenBurnBar mobile unit tests
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-mobile.sh

      - name: Clean up Firebase config
        if: always() && env.INTERNAL_RUN == 'true' && env.HAS_FIREBASE_SECRETS == 'true'
        run: bash ./scripts/ci/cleanup-firebase-config.sh

