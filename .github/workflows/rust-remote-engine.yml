name: Rust Remote Engine

# crates/burnbar-remote is the gen-2 remote-control engine (ADR'd, in-tree).
# Until this workflow existed it was built by NO CI — shadow architecture
# rotting silently (diligence 2026-06-10 §8 / 2026-06-11 follow-through).
# This lane keeps it honest: it compiles, its tests pass, clippy is clean at
# -D warnings, and formatting is canonical, on every change to the crates.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "crates/burnbar-remote/**"
      - ".github/workflows/rust-remote-engine.yml"
  push:
    branches: [main]
    paths:
      - "crates/burnbar-remote/**"
      - ".github/workflows/rust-remote-engine.yml"

concurrency:
  group: rust-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/burnbar-remote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      # rust-toolchain.toml drives the version; rustup respects it.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/burnbar-remote

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (deny warnings + panic lints)
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used

      - name: cargo test
        run: cargo test --workspace
