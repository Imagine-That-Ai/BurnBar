name: Rust SAST

# Static security analysis for the in-tree Rust surfaces (Cure53 RR-16).
#
# The CodeQL matrix (codeql.yml) covers swift / java-kotlin / js-ts / python but
# NOT Rust — CodeQL has no GA-stable Rust analyzer here. cargo-deny already gates
# licenses + bans (fast-feedback.yml `rust-deny-fast`, license-posture.yml), but
# advisory *vulnerabilities* were scanned in ZERO workflows. This lane closes
# that gap with cargo-audit (RustSec advisory DB) over every shipping Rust workspace, plus
# clippy security lints, failing closed on any new advisory:
#   - crates/openburnbar-iroh  (iroh QUIC FFI shipped into the Swift/Android app)
#   - crates/burnbar-remote    (gen-2 remote-control engine workspace)
#   - crates/openburnbar-domain-core (shared pure business logic + UniFFI)
#
# cargo-audit fails the job on any advisory except the four unmaintained
# transitive deps already accepted (with justification) in
# crates/openburnbar-iroh/deny.toml. Keep that ignore set in lockstep with the
# deny.toml ignore list so the two tools agree on the accepted-risk boundary.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  # Re-run on a weekly cadence so a *newly disclosed* advisory against an
  # already-merged dependency turns the lane red even with no code change.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: rust-sast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisory-single-source:
    name: advisory ignore single-source guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      # Fails if the accepted-advisory set is hand-duplicated in this workflow
      # instead of derived from crates/openburnbar-iroh/deny.toml (the one source).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      # Positive control: prove the audit gate still fails an unaccepted yank
      # and still refuses to let a policy entry silence a vulnerability, before
      # trusting its verdict on the real crates.
      - name: Self-test the cargo-audit gate
        run: node --test scripts/ci/check-cargo-audit-fail-closed.test.mjs

      - name: Verify advisory ignores are single-sourced from deny.toml
        run: bash scripts/ci/check-advisory-ignore-single-source.sh

  cargo-audit:
    name: cargo-audit (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: openburnbar-iroh
            path: crates/openburnbar-iroh
            toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
          - crate: burnbar-remote
            path: crates/burnbar-remote
            toolchain: "1.94.0" # pin: crates/burnbar-remote
          - crate: openburnbar-domain-core
            path: crates/openburnbar-domain-core
            toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action; toolchain below
        with:
          toolchain: ${{ matrix.toolchain }}

      # Pin cargo-audit so the advisory engine itself is reproducible; a floating
      # `cargo install cargo-audit` would pull whatever the registry serves.
      # Retry mirrors the cargo-deny install in fast-feedback.yml (transient
      # crates.io / network flakes must not mask a real advisory signal).
      # 0.22.2: the `rustsec`/`cvss` engine here parses CVSS 4.0 advisories — older
      # 0.21.x choked ("unsupported CVSS version: 4.0") loading the live DB, which
      # now carries many CVSS-4.0 entries, and failed the whole audit on load.
      - name: Install cargo-audit (pinned)
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-audit --version 0.22.2 --locked; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      # Fail closed on advisories (RR-16), through a gate rather than raw flags.
      #
      # `cargo audit --deny warnings` is the right posture — it escalates
      # unmaintained AND yanked crates, not just vulnerabilities — but its only
      # escape hatch is `--ignore <RUSTSEC-id>`, and a YANKED crate has no
      # advisory id (cargo-audit reports `advisory: null`). So a dependency
      # yanked with no upgrade path left exactly two options: drop
      # `--deny warnings` and lose the unmaintained signal too, or disable the
      # job. BurnBar hit that on 2026-08-20 when arrayref 0.3.5-0.3.9 were
      # yanked while blake3 still required ^0.3.5.
      #
      # The gate keeps the strict posture and adds the missing granularity.
      # Advisory acceptances still come from crates/openburnbar-iroh/deny.toml
      # (the one source, shared with cargo-deny); yanks with no upgrade path are
      # time-boxed with rationale in config/rust-supply-chain-policy.json and
      # expire on their own. Execution failures stay failures.
      - name: cargo audit (${{ matrix.crate }})
        run: node scripts/ci/check-cargo-audit-fail-closed.mjs "${{ matrix.path }}"

  # Catches the attack class cargo-audit structurally cannot see: a dependency
  # on a crate that does not exist. Advisory scanners answer "does a published
  # advisory match something I already resolved?" — so they are blind to a
  # malicious version until someone writes the CVE, and blind to the upgrade
  # path entirely. This reads the registry directly and reports phantom
  # dependencies on versions above what we pin. See docs/RUST_SUPPLY_CHAIN.md.
  dependency-confusion:
    name: Rust dependency confusion (registry facts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      # Positive control first: prove the gate still fails on the real attack
      # shape before trusting its verdict on our actual lockfiles.
      - name: Self-test the dependency-confusion gate
        run: node --test scripts/ci/check-cargo-dependency-confusion.test.mjs

      - name: Scan every Cargo.lock upgrade path
        run: node scripts/ci/check-cargo-dependency-confusion.mjs

  clippy-security:
    name: clippy security lints (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: openburnbar-iroh
            path: crates/openburnbar-iroh
            toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
          - crate: burnbar-remote
            path: crates/burnbar-remote
            toolchain: "1.94.0" # pin: crates/burnbar-remote
          - crate: openburnbar-domain-core
            path: crates/openburnbar-domain-core
            toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      # Keep the SAST toolchain explicit because this workflow uses a SHA-pinned
      # action ref rather than the @stable shorthand.
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action; toolchain below
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.path }}

      # Security posture: deny correctness lints that are genuine FFI/memory
      # footguns (transmute-to-ref, invalid reference casting, unchecked-utf8),
      # panic-prone unwrap/expect in library code, and lossy numeric casts.
      # Keep this fail-closed: a newly introduced clippy warning must either be
      # fixed or explicitly justified in source where reviewers can inspect it.
      - name: cargo clippy (security lints)
        working-directory: ${{ matrix.path }}
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -D clippy::transmute_ptr_to_ref \
            -D invalid_reference_casting \
            -D invalid_from_utf8_unchecked \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::cast_possible_truncation \
            -D clippy::cast_sign_loss
