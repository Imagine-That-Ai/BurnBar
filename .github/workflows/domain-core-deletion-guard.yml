name: Domain Core trusted deletion guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: domain-core-deletion-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-deletion-guard:
    name: Domain Core Trusted Deletion Guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted default-branch evaluator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0

      - name: Check out candidate as data only
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Require live protected default-branch controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/ci/verify-domain-core-default-branch-controls.mjs

      - name: Evaluate candidate with trusted default-branch code
        env:
          DOMAIN_CORE_EVIDENCE_CACHE: ${{ runner.temp }}/domain-core-evidence-cache
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Imagine-That-Ai/BurnBar"
          test "${{ github.event.pull_request.base.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          python3 trusted/scripts/ci/verify-domain-core-legacy-deletion.py \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base-ref "$BASE_SHA" \
            --verify-signed-evidence \
            --deletion-pull-request "$PULL_REQUEST" \
            --deletion-head "$HEAD_SHA"
