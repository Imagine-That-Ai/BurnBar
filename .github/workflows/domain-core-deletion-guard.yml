name: Domain Core trusted deletion guard

# This required context is intentionally unfiltered: every PR must emit it, and the
# trusted evaluator decides whether the candidate touches a governed deletion surface.
#
# Stacked PRs (an internal branch targeting another internal non-main branch) emit a
# neutral pass instead of evaluating: the "trusted" checkout for such a PR would be the
# unreviewed base branch, not default-branch code, so evaluation there proves nothing.
# Enforcement is NOT lost: nothing reaches main without the base branch's own PR into
# main (and the merge queue), where this guard evaluates the full accumulated diff with
# genuinely trusted default-branch code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: domain-core-deletion-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-deletion-guard:
    name: Domain Core Trusted Deletion Guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted default-branch evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0

      - name: Check out candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve protected candidate metadata
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${PR_NUMBER:-}"
          pr_head_sha="${PR_HEAD_SHA:-}"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            pr_number="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#^(refs/heads/)?gh-readonly-queue/main/pr-([0-9]+)-.*#\2#p')"
            if [[ -z "$pr_number" ]]; then
              echo "::error::Could not resolve PR number from merge queue ref: $MERGE_HEAD_REF"
              exit 1
            fi
            pr_head_sha="$(
              bash "$GITHUB_WORKSPACE/trusted/scripts/ci/gh-api-with-retry.sh" \
                "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
                --jq .head.sha
            )"
          fi
          test -n "$pr_number"
          test -n "$pr_head_sha"
          echo "pull_request=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pull_request_head=$pr_head_sha" >> "$GITHUB_OUTPUT"

      - name: Evaluate candidate with trusted default-branch code
        env:
          DOMAIN_CORE_EVIDENCE_CACHE: ${{ runner.temp }}/domain-core-evidence-cache
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PULL_REQUEST: ${{ steps.candidate.outputs.pull_request }}
          PULL_REQUEST_HEAD: ${{ steps.candidate.outputs.pull_request_head }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Imagine-That-Ai/BurnBar"
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            test "${{ github.event.pull_request.base.repo.full_name }}" = "$GITHUB_REPOSITORY"
            test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
            if [[ "${{ github.event.pull_request.base.ref }}" != "main" ]]; then
              echo "::notice::Internal stacked PR (base '${{ github.event.pull_request.base.ref }}' is not main): emitting a neutral pass. The trusted deletion guard enforces at the main boundary, where the base branch's own PR into main evaluates the full accumulated diff with trusted default-branch code."
              exit 0
            fi
          else
            test "${{ github.event.merge_group.base_ref }}" = "refs/heads/main"
          fi
          test "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$HEAD_SHA"
          python3 "$TRUSTED_ROOT/scripts/ci/verify-domain-core-legacy-deletion.py" \
            --repo-root "$CANDIDATE_ROOT" \
            --base-ref "$BASE_SHA" \
            --trusted-root "$TRUSTED_ROOT" \
            --verify-signed-evidence \
            --deletion-pull-request "$PULL_REQUEST" \
            --deletion-head "$PULL_REQUEST_HEAD"
