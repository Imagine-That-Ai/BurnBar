      - agents-md-fast
      - rust-deny-fast
      - functions-security-fast
      - signal-honesty-copy
      - services-fast
      - no-suppressions
      - twin-basenames
      - windows-storage-architecture
      - debt-budgets
      - functions-correctness
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all fast jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [[ -n "$failed" ]]; then
            echo "::error::The following fast feedback jobs failed:"
            echo "$failed"
            exit 1
          fi
          echo "### Fast Feedback: All checks passed in under 5 minutes" >> "$GITHUB_STEP_SUMMARY"
