name: Fast Feedback (<5 min)

# Lightweight pre-check that gates every PR in under 5 minutes.
# Runs parallel jobs covering lint, type-check, shell validation, schema drift,
# and non-Swift unit tests so agents get actionable signal before the 45-min
# macOS build completes.
#
# This workflow is the PRIMARY CI feedback signal for PRs.
# The full macOS build (openburnbar-pr-harness.yml) provides deeper coverage
# but is not suited to fast iteration loops.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fast-feedback-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Functions: lint + typecheck + unit tests ──────────────────────────────
  functions-fast:
    name: Functions (lint + types + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build Signal envelope contracts
        run: bash scripts/build-signal-envelope-contracts.sh

      - name: Build entitlements contracts
        run: bash scripts/build-entitlements.sh

      # Catalog contract tests + firestore.rules drift gate: the three rules
      # entitlement allowlists are GENERATED from packages/entitlements
      # (tools/gen-rules-entitlements.mjs); fail red if firestore.rules
      # diverges from a regenerate or the catalog drifts from its fixture.
      - name: Entitlement catalog tests (node --test)
        run: node --test packages/entitlements/lib/

      - name: firestore.rules entitlement allowlists are generated (no drift)
        run: node tools/gen-rules-entitlements.mjs --check

      - name: TypeScript type check
        run: cd functions && npx tsc --noEmit

      - name: ESLint
        run: npm run lint --prefix functions

      - name: Unit tests (vitest)
        run: npm run test:unit --prefix functions

      - name: Callable input validation ratchet
        run: |
          node --test scripts/ci/check-callable-validation.test.mjs
          node scripts/ci/check-callable-validation.mjs

      - name: Guard parser regressions (test-guards.mjs)
        run: npm run test:guards --prefix functions

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Functions Fast Check"
            echo "- TypeScript: ✓"
            echo "- ESLint: ✓"
            echo "- Unit tests: ✓"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Extension: lint + typecheck + unit tests ─────────────────────────────
  extension-fast:
    name: Extension (lint + types + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: TypeScript type check
        run: cd extensions/openburnbar && npx tsc --noEmit

      - name: ESLint
        run: npm run lint --prefix extensions/openburnbar

      - name: Unit tests (vitest)
        run: npm run test --prefix extensions/openburnbar

  # ── Website: typecheck + lint ─────────────────────────────────────────────
  website-fast:
    name: Website (types + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Astro type check
        run: npm run check --prefix website

      - name: Prettier format check
        run: npm run format:check --prefix website

  # ── TypeScript package surfaces: ESLint + typecheck floors ───────────────
  typescript-surfaces-lint:
    name: TypeScript package lint floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            services/hermes-realtime-relay/package-lock.json
            services/hosted-mcp/package-lock.json
            tools/openburnbar-mcp-remote/package-lock.json
            packages/libsignal-bridge/package-lock.json
            packages/libsignal-protocol/package-lock.json
            packages/signal-envelope-contracts/package-lock.json

      - name: Install TypeScript package dependencies
        run: |
          set -euo pipefail
          for dir in \
            services/hermes-realtime-relay \
            services/hosted-mcp \
            tools/openburnbar-mcp-remote \
            packages/libsignal-bridge \
            packages/libsignal-protocol \
            packages/signal-envelope-contracts
          do
            echo "::group::npm ci --prefix ${dir}"
            npm ci --prefix "${dir}"
            echo "::endgroup::"
          done

      - name: ESLint + typecheck package floors
        run: |
          set -euo pipefail
          for dir in \
            services/hermes-realtime-relay \
            services/hosted-mcp \
            tools/openburnbar-mcp-remote \
            packages/libsignal-protocol \
            packages/signal-envelope-contracts
          do
            echo "::group::npm run lint --prefix ${dir}"
            npm run lint --prefix "${dir}"
            echo "::endgroup::"
          done

  # ── Shell scripts: syntax validation ────────────────────────────────────
  sqlite-schema-doc:
    name: SQLite schema doc drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          filter: blob:none
          sparse-checkout: |
            AgentLens/Services/DataStore/OpenBurnBarDatabase.swift
            AgentLens/Services/DataStore/OpenBurnBarDatabase+MemoryMigrations.swift
            OpenBurnBarDaemon/Sources/OpenBurnBarDaemon/ProjectCodeMemory/BurnBarProjectCodeMemoryStore+Database.swift
            docs/SCHEMA_SQLITE.sql
            scripts/ci/verify-sqlite-schema-doc.mjs
            tools/openburnbar-mcp/project_code_memory.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Verify SQLite schema doc covers migration sources
        run: node scripts/ci/verify-sqlite-schema-doc.mjs

  sqlcipher-codec-policy:
    name: SQLCipher codec policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Verify SQLCipher codec wiring policy
        run: bash scripts/ci/verify-sqlcipher-codec.sh

  agpl-compliance:
    name: AGPL compliance
    runs-on: ubuntu-latest
    # 3 minutes started timing out as the tree grew (checkout + verify ran
    # 2m18s-3m15s in July 2026); job timeout reports as "cancelled" in the UI.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Verify license metadata, libsignal pin, and source offer
        run: |
          bash scripts/ci/verify-agpl-compliance-self-test.sh
          bash scripts/ci/verify-agpl-compliance.sh

  # ── Signal crypto proof: package load + envelope harness ─────────────────
  libsignal-bridge:
    name: Signal crypto proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/libsignal-bridge/package-lock.json
            packages/libsignal-protocol/package-lock.json
            packages/signal-envelope-contracts/package-lock.json

      - name: Install libsignal bridge dependencies
        run: npm ci --prefix packages/libsignal-bridge

      - name: Install Signal envelope contract dependencies
        run: npm ci --prefix packages/signal-envelope-contracts

      - name: Install libsignal protocol dependencies
        run: npm ci --prefix packages/libsignal-protocol

      - name: Test official libsignal bridge
        run: npm test --prefix packages/libsignal-bridge

      - name: Run Signal envelope crypto proof harness
        run: node scripts/ci/crypto-proof-harness.mjs

      # ADR-001 §7.2: the committed CryptoKit ⇄ libsignal at-rest interop
      # vectors must keep opening. This (Linux) leg verifies the libsignal
      # side + tamper fail-closed; the CryptoKit side runs in
      # CryptoKitAtRestInteropTests.swift on the macOS PR harness.
      - name: Verify committed CryptoKit-libsignal interop vectors
        run: node scripts/ci/generate-cryptokit-interop-vector.mjs

  # ── Shell scripts: syntax validation ────────────────────────────────────
  shell-syntax:
    name: Shell syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Validate all shell scripts
        run: |
          set -euo pipefail
          ERRORS=0
          while IFS= read -r -d '' script; do
            if ! bash -n "$script"; then
              echo "::error file=${script}::Shell syntax error in ${script}"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find scripts/ -name '*.sh' -print0 2>/dev/null)
          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::${ERRORS} shell script(s) have syntax errors."
            exit 1
          fi
          echo "All shell scripts pass syntax validation."

      - name: Release config injection safety tests
        run: |
          set -euo pipefail
          bash scripts/ci/sentry_dsn.test.sh
          bash scripts/ci/inject-sentry-config-ios.test.sh
          bash scripts/ci/inject-sentry-config-android.test.sh
          bash scripts/ci/inject-firebase-config.test.sh
          bash scripts/ci/verify-apple-release-firebase-config.test.sh
          bash scripts/ci/inject-sentry-config-extension.test.sh

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck
        run: ./scripts/ci/run-shellcheck.sh

      - name: Remote Config credential argv safety tests
        run: bash scripts/cutover-n0-hosted-relay.test.sh

      - name: Source rollback target safety tests
        run: bash scripts/rollback.test.sh

      - name: macOS appcast rollback safety tests
        run: bash scripts/ops/rollback-macos-appcast.test.sh

      - name: Local agent config symlink guard
        run: |
          bash scripts/ci/verify-no-local-agent-config-symlinks.test.sh
          bash scripts/ci/verify-no-local-agent-config-symlinks.sh

      - name: Dev macOS tmux launcher boundary
        run: bash scripts/ci/verify-dev-mac-tmux-boundary.sh

  # ── Python scripts: Ruff defect floor + formatter gate ───────────────────
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.17

      - name: Ruff check
        run: ruff check scripts tools/openburnbar-mcp

      - name: Ruff format check
        run: ruff format --check scripts tools/openburnbar-mcp

  # ── Schema sync drift check ───────────────────────────────────────────────
  schema-drift:
    name: Schema sync drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/schema-sync/package-lock.json

      - name: Install schema-sync toolchain (@typespec/compiler)
        run: npm --prefix tools/schema-sync ci

      # check-drift.sh also compiles the TypeSpec canon and asserts the
      # compiled model set matches the emitted generated interfaces
      # (tools/schema-sync/check-tsp-canon.mjs), so the canon cannot rot.
      - name: Check schema sync drift + TypeSpec canon
        run: ./tools/schema-sync/check-drift.sh

  # ── Wiki / Pensieve verbatim chunker parity ──────────────────────────────
  chunker-parity:
    name: Verbatim chunker parity (wiki + Pensieve)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      # Proves scripts/lib/verbatim-chunker.mjs still reproduces every committed
      # droid-wiki chunk byte-identically (zero-write reconcile). The same chunker
      # powers per-member Pensieve ingestion, so drift here would silently change
      # both the maintainer mem0 mirror and members' encrypted knowledge.
      - name: Chunker golden + unit tests
        run: node --test scripts/lib/verbatim-chunker.test.mjs

      - name: Maintainer mem0 reconcile is a no-op
        run: |
          node scripts/wiki/mem0-sync.mjs --all --dry-run | tee /tmp/reconcile.log
          grep -q "already in sync - zero writes" /tmp/reconcile.log

  # ── Control Center foundations (data-domain registry + design tokens) ──────
  control-center-foundations:
    name: Control Center foundations (registry + tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      # Registry validation + codegen freshness + firestore.rules drift check:
      # every users/{uid}/ collection must be registered or explicitly excluded.
      - name: Data-domain registry (codegen + drift)
        run: cd packages/data-domains && node codegen.mjs && node driftcheck.mjs && node --test

      # Hermes/iroh wire protocol: ONE canonical protocol.json -> generated TS
      # (consumed by the relay) + Swift/Kotlin/Rust references, plus a parity gate
      # that fails if any hand-written language surface drifts from canon. This is
      # the contract iOS + Android + macOS all encode/decode, so a silent interop
      # break here (a renamed wire string, a changed ALPN or frame cap) would
      # otherwise ship green to all three apps.
      - name: Hermes wire protocol (codegen drift + parity + tests)
        run: |
          # Tracked-file guard: a PR that DELETES a generated file must fail too.
          git ls-files --error-unmatch \
            services/hermes-realtime-relay/src/generated/wireProtocol.ts \
            packages/hermes-wire-protocol/gen/HermesWireProtocol.swift \
            packages/hermes-wire-protocol/gen/HermesWireProtocol.kt \
            packages/hermes-wire-protocol/gen/wire_protocol.rs \
            android/openburnbar-iroh-relay/src/main/java/com/openburnbar/irohrelay/Generated/HermesRealtimeRelayGeneratedTypes.kt \
            OpenBurnBarCore/Sources/OpenBurnBarCore/SharedModels/Generated
          node packages/hermes-wire-protocol/codegen.mjs
          # codegen.mjs writes ALL generated surfaces (the gen/ references AND the real
          # consumed payload types: Kotlin android Generated/ + Swift SharedModels/Generated/).
          # Diff every one of them so a stale committed payload type fails CI — without the
          # real Generated dirs here, drift only surfaces inside the apps (silent interop break).
          git diff --exit-code -- \
            services/hermes-realtime-relay/src/generated/wireProtocol.ts \
            packages/hermes-wire-protocol/gen \
            android/openburnbar-iroh-relay/src/main/java/com/openburnbar/irohrelay/Generated \
            OpenBurnBarCore/Sources/OpenBurnBarCore/SharedModels/Generated \
            || { echo "::error::Hermes wire-protocol generated files are stale — run 'node packages/hermes-wire-protocol/codegen.mjs' and commit."; exit 1; }
          node packages/hermes-wire-protocol/parity.mjs
          node --test packages/hermes-wire-protocol/protocol.test.mjs
          # Kotlin emitter byte-faithfulness: every generatable type's emitter output must
          # match the committed Kotlin (hand-written remainder + Generated/). Complements the
          # protocol.test.mjs @EncodeDefault validator (override-vs-schema) above.
          node packages/hermes-wire-protocol/migrate/kotlin-roundtrip.mjs --faithful

      # DTCG tokens build to CSS/Swift/Kotlin and stay one source of truth.
      - name: Design tokens (Style Dictionary build + tests)
        run: |
          cd packages/design-tokens
          npm ci
          npm test

      # Belt-and-suspenders to the registry.test.mjs / tokens.test.mjs Android
      # assertions: re-sync the in-tree Android copies from the (now freshly
      # regenerated) gen/ + dist/ outputs and fail if anything moved. Catches a
      # hand-edit committed straight into the Android tree that bypassed the
      # codegen path — the exact failure mode that mislabeled server-readable
      # chat as end-to-end encrypted.
      - name: Android generated sources are in sync (no drift)
        run: |
          cp packages/data-domains/gen/DataDomains.kt \
            android/app/src/main/java/com/openburnbar/data/domains/DataDomains.kt
          cp packages/design-tokens/dist/compose/PensieveTokens.kt \
            android/app/src/main/java/com/openburnbar/ui/tokens/PensieveTokens.kt
          git diff --exit-code -- \
            android/app/src/main/java/com/openburnbar/data/domains/DataDomains.kt \
            android/app/src/main/java/com/openburnbar/ui/tokens/PensieveTokens.kt \
            || { echo "::error::Android generated sources are stale — run ./gradlew :app:syncGeneratedSources and commit the result."; exit 1; }

      # Same guarantee for the public marketing site: burnbar.ai/trust renders
      # every encryption-tier claim from website/src/data/trust.generated.ts,
      # which codegen emits from registry.json (+ the Pensieve tier colors). Fail
      # red if the committed copy drifts so the website can never overstate the
      # product — the exact failure mode that mislabeled server-readable chat as
      # end-to-end encrypted, now gated for the website too.
      - name: Website trust copy is in sync (no drift)
        run: |
          # ls-files guard: a PR that DELETES the generated file must fail too —
          # `git diff --exit-code` alone is blind to untracked regenerations.
          git ls-files --error-unmatch website/src/data/trust.generated.ts
          node packages/data-domains/codegen.mjs
          git diff --exit-code -- website/src/data/trust.generated.ts \
            || { echo "::error::website/src/data/trust.generated.ts is stale — run 'node packages/data-domains/codegen.mjs' and commit the result."; exit 1; }

      # Same mechanism for the encryption-architecture claims: burnbar.ai/trust
      # renders its crypto claim/not-claim copy from
      # website/src/data/crypto-claims.generated.ts, which the generator emits
      # from docs/security/crypto-architecture-policy.json + the CI-enforced
      # libsignal pin + the fail-closed runtime-readiness gate. `--check` fails
      # on a stale, hand-edited, or DELETED file — and the generator itself
      # fails when runtime readiness flips, so "not activated in production"
      # copy cannot outlive the rollout it describes.
      - name: Website crypto-claims copy is in sync (no drift)
        run: node website/scripts/generate-crypto-claims.mjs --check

  # ── Web console (app.burnbar.ai): lint + types + tests + static build ──────
  console-web:
    name: Console (lint + types + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install console dependencies
        run: npm ci --prefix apps/console

      # build/test scripts auto-run sync:domains (prebuild/pretest) to refresh the
      # generated registry + token copies from packages/.
      - name: Lint
        run: npm run lint --prefix apps/console

      - name: Type check
        run: npm run typecheck --prefix apps/console

      - name: Unit tests (incl. Swift<->WebCrypto escrow interop)
        run: npm test --prefix apps/console

      - name: Static build (next export)
        run: npm run build --prefix apps/console

  # ── Version consistency ────────────────────────────────────────────────────
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            CHANGELOG.md
            README.md
            SECURITY.md
            project.yml
            extensions/openburnbar/package.json
            homebrew/burnbar.rb
            OpenBurnBarDaemon/Sources/OpenBurnBarDaemon/OpenBurnBarDaemonConfiguration.swift
            windows/app/OpenBurnBar.App/app.manifest
            scripts/verify-version-consistency.sh

      - name: Verify version consistency
        run: ./scripts/verify-version-consistency.sh

  # ── AGENTS.md validation ───────────────────────────────────────────────────
  agents-md-fast:
    name: AGENTS.md quick validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Check that referenced scripts exist
        run: |
          set -euo pipefail
          ERRORS=0
          while IFS= read -r line; do
            if [[ "$line" =~ \`(scripts/[^[:space:]\`]+)\` ]]; then
              script="${BASH_REMATCH[1]}"
              if [[ ! -f "$script" && ! -f "${script}.sh" ]]; then
                echo "::error::AGENTS.md references missing script: $script"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done < AGENTS.md
          if [[ $ERRORS -gt 0 ]]; then
            exit 1
          fi
          echo "All AGENTS.md script references valid."

      - name: Self-test agent memory source policy
        run: node scripts/ci/verify-agent-memory-source-policy.test.mjs

      - name: Verify agent memory source policy
        run: node scripts/ci/verify-agent-memory-source-policy.mjs

  # ── Path filter: skip expensive legs when their surfaces are untouched ────
  fast-feedback-path-filter:
    name: Fast Feedback path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust_changed: ${{ steps.changed.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # The PR checkout ref is a synthetic merge commit. Depth 2 includes its
          # base and head parents without fetching the entire repository history,
          # keeping this path filter inside its two-minute budget.
          fetch-depth: 2

      - name: Detect Rust-relevant changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          head="${HEAD_SHA:-HEAD}"
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
            head="$(git rev-parse HEAD^2)"
          elif [[ -z "$base" || "$base" == "null" ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base FETCH_HEAD HEAD)"
            head="HEAD"
          fi
          git diff --name-only "$base" "$head" > /tmp/fast-feedback-changed-paths.txt
          cat /tmp/fast-feedback-changed-paths.txt
          if grep -Eq '^(crates/(openburnbar-iroh|project-code-static-parser)/|\.github/workflows/fast-feedback\.yml$|\.cargo/config(\.toml)?$|\.?rustfmt\.toml$|clippy\.toml$|rust-toolchain(\.toml)?$|Cargo\.(toml|lock)$)' /tmp/fast-feedback-changed-paths.txt; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Rust: fmt + clippy + cargo-deny on iroh crate (WS5) ─────────────────
  rust-deny-fast:
    name: Rust (fmt + clippy + cargo-deny)
    needs: fast-feedback-path-filter
    if: needs.fast-feedback-path-filter.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          # Match crates/openburnbar-iroh/rust-toolchain.toml so fmt/clippy/test
          # run under the same rustc the crate is pinned to (and its components
          # resolve). The crate's rust-toolchain.toml otherwise overrides `stable`
          # mid-job and the requested components would be missing.
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            crates/openburnbar-iroh -> target
            crates/project-code-static-parser -> target

      - name: cargo fmt check (openburnbar-iroh)
        run: cd crates/openburnbar-iroh && cargo fmt --check

      - name: cargo fmt check (project-code-static-parser)
        run: cargo fmt --manifest-path crates/project-code-static-parser/Cargo.toml --check

      - name: cargo clippy deny warnings (openburnbar-iroh)
        run: |
          cd crates/openburnbar-iroh && cargo clippy --all-targets -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used

      - name: cargo clippy deny warnings (project-code-static-parser)
        run: |
          cargo clippy --manifest-path crates/project-code-static-parser/Cargo.toml --all-targets -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used

      - name: cargo test — iroh loopback handshake (openburnbar-iroh)
        # Merge-blocking validation of the SHIPPING iroh transport: a hermetic
        # two-endpoint loopback ALPN handshake + length-prefixed frame round-trip.
        # Fails on ALPN drift, length-prefix changes, or handshake regressions.
        run: cd crates/openburnbar-iroh && cargo test --test loopback_handshake

      - name: cargo test — project code static parser
        run: cargo test --manifest-path crates/project-code-static-parser/Cargo.toml

      - name: Install cargo-deny
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-deny --locked; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: cargo deny check (openburnbar-iroh)
        run: cd crates/openburnbar-iroh && cargo deny check

