name: Public Linux Download Trust

concurrency:
  group: public-linux-download-trust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  # Only pull_request runs share a group and get cancelled. merge_group runs are
  # the merge-queue's own proof and `push` runs are the per-commit post-merge
  # record, so both get a unique per-run group that can never collide: a shared
  # group evicts a *pending* run even with cancel-in-progress false, because
  # GitHub keeps at most one queued run per group. Same pattern and reasoning as
  # `.github/workflows/security-pr.yml`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-public-linux-download-change:
    runs-on: ubuntu-latest
    # This detector needs every commit/tree to compare PR and merge-group
    # candidates against their exact base, but it never reads repository file
    # contents. Avoid downloading the large blob pack and leave enough time for
    # GitHub-hosted checkout degradation without weakening the fail-closed gate.
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      gate_changed: ${{ steps.detect.outputs.gate_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - id: detect
        name: Detect public Linux download config changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=false
          gate_changed=false
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
            gate_changed=true
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$changed_paths"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed=true
              gate_changed=true
            else
              git diff --name-only "$BEFORE_SHA" HEAD > "$changed_paths"
            fi
          fi
          if grep -qx 'website/src/data/site.ts' "$changed_paths"; then changed=true; fi
          if grep -Eq '^(.github/workflows/public-linux-download-trust\.yml|scripts/ci/verify-public-linux-download-trust(\.test)?\.sh)$' "$changed_paths"; then gate_changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "gate_changed=$gate_changed" >> "$GITHUB_OUTPUT"
          echo "Public Linux download config changed: $changed"
          echo "Public Linux trust gate code changed: $gate_changed"

  verify-public-linux-download-trust-code:
    needs: detect-public-linux-download-change
    if: ${{ needs.detect-public-linux-download-change.outputs.gate_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Install SITE parser dependency
        run: npm ci --prefix website --ignore-scripts
      - name: Verify public Linux trust gate scripts
        run: |
          set -euo pipefail
          bash -n scripts/ci/verify-public-linux-download-trust.sh
          bash -n scripts/ci/verify-public-linux-download-trust.test.sh
          bash scripts/ci/verify-public-linux-download-trust.test.sh

  verify-public-linux-download-trust:
    needs: detect-public-linux-download-change
    if: ${{ needs.detect-public-linux-download-change.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Install SITE parser dependency
        run: npm ci --prefix website --ignore-scripts
      - name: Verify exact public Linux artifact and feed trust chain
        run: bash scripts/ci/verify-public-linux-download-trust.sh
