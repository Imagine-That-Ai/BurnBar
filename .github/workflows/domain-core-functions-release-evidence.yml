name: Publish Shared Rust Functions Release Evidence

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: Exact successful deploy-production run ID
        required: true
        type: string
      deploy_run_attempt:
        description: Exact successful deploy-production run attempt
        required: true
        type: string
      domain_core_profile:
        description: Exact signed public profile deployed by the source run
        required: true
        type: choice
        options:
          - public-production
          - public-production-rollback

concurrency:
  group: domain-core-functions-release-evidence-${{ github.ref }}-${{ inputs.deploy_run_id }}-${{ inputs.deploy_run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact stable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact tag, deploy run, attempt, and required jobs
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ inputs.deploy_run_attempt }}
          DOMAIN_CORE_PROFILE: ${{ inputs.domain_core_profile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Functions release evidence must run from a stable vX.Y.Z tag."
            exit 1
          fi
          release_tag="${GITHUB_REF#refs/tags/}"
          git fetch --force --tags origin "+refs/tags/$release_tag:refs/tags/$release_tag"
          tag_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Evidence checkout and stable tag do not resolve to the exact same commit."
            exit 1
          fi

          run_json="$RUNNER_TEMP/deploy-run.json"
          pages_json="$RUNNER_TEMP/deploy-job-pages.json"
          jobs_json="$RUNNER_TEMP/deploy-jobs.json"
          completed=false
          for poll in $(seq 1 120); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID" > "$run_json"
            if ! jq -e --argjson attempt "$DEPLOY_RUN_ATTEMPT" '.run_attempt == $attempt' "$run_json" >/dev/null; then
              echo "::error::Deploy run attempt changed before evidence verification completed."
              exit 1
            fi
            if [[ "$(jq -r '.status' "$run_json")" == "completed" ]]; then
              completed=true
              break
            fi
            echo "Waiting for deploy run $DEPLOY_RUN_ID attempt $DEPLOY_RUN_ATTEMPT to complete ($poll/120)..."
            sleep 5
          done
          if [[ "$completed" != "true" ]]; then
            echo "::error::Deploy run did not complete within 10 minutes."
            exit 1
          fi
          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID/attempts/$DEPLOY_RUN_ATTEMPT/jobs?per_page=100" \
            > "$pages_json"
          jq -e '
            if length == 0 then error("jobs API returned no pages") else . end
            | {total_count: .[0].total_count, jobs: [.[].jobs[]]}
            | select(.total_count == (.jobs | length))
          ' "$pages_json" > "$jobs_json"
          node scripts/ci/verify-domain-core-functions-deploy-run.mjs \
            --run "$run_json" \
            --jobs "$jobs_json" \
            --tag "$release_tag" \
            --commit "$GITHUB_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --deploy-run-attempt "$DEPLOY_RUN_ATTEMPT" \
            --profile "$DOMAIN_CORE_PROFILE" \
            --output "$RUNNER_TEMP/functions-deploy-run-verification.json"
          {
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_VERSION=${release_tag#v}"
          } >> "$GITHUB_ENV"

      - name: Download exact deployed Functions proof inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.deploy_run_id }}
          name: domain-core-functions-deploy-proof-${{ github.ref_name }}-${{ inputs.deploy_run_id }}-${{ inputs.deploy_run_attempt }}
          path: ${{ runner.temp }}/functions-deploy-proof

      - name: Download exact post-deploy health evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.deploy_run_id }}
          name: domain-core-functions-deploy-health-${{ github.ref_name }}-${{ inputs.deploy_run_id }}-${{ inputs.deploy_run_attempt }}
          path: ${{ runner.temp }}/functions-deploy-health

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Download and verify canonical retained rollback authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="OpenBurnBar-${RELEASE_VERSION}-legacy-rollback.zip"
          bundle="${asset}.sigstore.json"
          retained="$RUNNER_TEMP/domain-core-retained-rollback"
          mkdir -p "$retained"
          for attempt in $(seq 1 120); do
            rm -f "$retained/$asset" "$retained/$bundle"
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --pattern "$bundle" --dir "$retained" 2>/dev/null; then
              break
            fi
            [[ "$attempt" -lt 120 ]] || { echo "::error::Canonical retained rollback authority was not published."; exit 1; }
            sleep 30
          done
          gh attestation verify "$retained/$asset" \
            --bundle "$retained/$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --signer-digest "$GITHUB_SHA" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://openburnbar.dev/attestations/domain-core-rollback-artifact/v1
          unzip -p "$retained/$asset" domain-core-public-production-rollback.json \
            > "$retained/domain-core-public-production-rollback.json"
          test -s "$retained/domain-core-public-production-rollback.json"
          {
            echo "RETAINED_ROLLBACK=$retained/$asset"
            echo "RETAINED_ROLLBACK_PROFILE=$retained/domain-core-public-production-rollback.json"
          } >> "$GITHUB_ENV"

      - name: Export archived candidate and signer coordinates
        env:
          EXPECTED_PROFILE: ${{ inputs.domain_core_profile }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/functions-deploy-proof"
          node - "$proof_dir" "$EXPECTED_PROFILE" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [directory, expectedProfile, envPath] = process.argv.slice(2);
          const proof = JSON.parse(fs.readFileSync(path.join(directory, "domain-core-functions-deploy-proof.json")));
          const gate = JSON.parse(fs.readFileSync(path.join(directory, "domain-core-release-gate.json")));
          if (proof.profile.value.name !== expectedProfile) throw new Error("deploy proof profile does not match dispatch input");
          const candidate = proof.profile.value.candidateIdentity;
          if (gate.activation?.candidateCommit !== candidate?.candidateCommit) throw new Error("deploy proof candidate does not match release activation");
          if (gate.activation?.releaseCommit !== process.env.GITHUB_SHA) throw new Error("deploy proof activation does not match stable tag commit");
          const signer = gate.promotionProof.signerRun;
          fs.appendFileSync(envPath, [
            `CANDIDATE_COMMIT=${candidate.candidateCommit}`,
            `CORE_VERSION=${candidate.coreVersion}`,
            `ABI_VERSION=${candidate.abiVersion}`,
            `SOURCE_SHA256=${candidate.sourceSha256}`,
            `SOURCE_RUN_ID=${gate.sourceRun.runId}`,
            `SOURCE_RUN_ATTEMPT=${gate.sourceRun.runAttempt}`,
            `SIGNER_RUN_ID=${signer.runId}`,
            `SIGNER_RUN_ATTEMPT=${signer.runAttempt}`,
            `PUBLIC_PROFILE_SHA256=${proof.profile.sha256}`,
          ].join("\n") + "\n");
          NODE

      - name: Reverify archived release gate and exact deploy proof
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ inputs.deploy_run_attempt }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/functions-deploy-proof"
          release_rollback="$proof_dir/domain-core-public-production-rollback-release.json"
          cmp "$release_rollback" "$RETAINED_ROLLBACK_PROFILE"
          if [[ "${{ inputs.domain_core_profile }}" == "public-production-rollback" ]]; then
            cmp "$proof_dir/domain-core-functions-profile.json" "$RETAINED_ROLLBACK_PROFILE"
            [[ "$PUBLIC_PROFILE_SHA256" == "$(sha256sum "$RETAINED_ROLLBACK_PROFILE" | awk '{print $1}')" ]]
          fi
          rollback_sha256="$(sha256sum "$release_rollback" | awk '{print $1}')"
          node scripts/ci/verify-domain-core-release-gate.mjs \
            --candidate-bundle "$proof_dir/domain-core-candidate-bundle.json" \
            --promotion-attestation "$proof_dir/domain-core-promotion.sigstore.jsonl" \
            --candidate-rollback-artifact "$proof_dir/domain-core-public-production-rollback.json" \
            --rollback-artifact "$release_rollback" \
            --rollback-profile "$release_rollback" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --release-commit "$GITHUB_SHA" \
            --release-version "$RELEASE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --core-version "$CORE_VERSION" \
            --abi-version "$ABI_VERSION" \
            --source-sha256 "$SOURCE_SHA256" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --protected-signer-run-id "$SIGNER_RUN_ID" \
            --protected-signer-run-attempt "$SIGNER_RUN_ATTEMPT" \
            --rollback-sha256 "$rollback_sha256" \
            --output "$proof_dir/domain-core-release-gate.json"
          node scripts/ci/create-domain-core-functions-deploy-proof.mjs \
            --profile "$proof_dir/domain-core-functions-profile.json" \
            --compiled-receipt "$proof_dir/domainCoreCandidateReceipt.js" \
            --runtime-manifest "$proof_dir/domain-core-runtime-artifact-manifest.json" \
            --release-gate "$proof_dir/domain-core-release-gate.json" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --deploy-run-attempt "$DEPLOY_RUN_ATTEMPT" \
            --output "$proof_dir/domain-core-functions-deploy-proof.json"

      - name: Reverify live deployment evidence
        run: |
          set -euo pipefail
          node scripts/ci/create-domain-core-functions-deployment-evidence.mjs \
            --deploy-proof "$RUNNER_TEMP/functions-deploy-proof/domain-core-functions-deploy-proof.json" \
            --health-artifact "$RUNNER_TEMP/functions-deploy-health/deploy-health.json" \
            --deploy-run-verification "$RUNNER_TEMP/functions-deploy-run-verification.json" \
            --provider-coordinates "$RUNNER_TEMP/functions-deploy-proof/domain-core-functions-provider-coordinates.json" \
            --inventory config/domain-core-functions-relevant-targets.json \
            --output "$RUNNER_TEMP/functions-deployment-evidence.json"

      - name: Create candidate-bound v2 Functions receipt and predicate
        id: evidence
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/OpenBurnBar-${RELEASE_VERSION}-functions-deployment.json"
          predicate="$RUNNER_TEMP/OpenBurnBar-${RELEASE_VERSION}-functions-deployment.predicate.json"
          proof_dir="$RUNNER_TEMP/functions-deploy-proof"
          activation="$proof_dir/domain-core-functions-release-activation.json"
          jq -e '.activation | {candidateCommit, activationCommit, coreVersion, abiVersion, sourceSha256, changedPathsSha256}' \
            "$proof_dir/domain-core-release-gate.json" > "$activation"
          node scripts/ci/create-domain-core-release-evidence.mjs \
            --consumer functions \
            --domain pricing \
            --artifact-kind functions-deployment-receipt \
            --target firebase-functions-production \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --artifact "$artifact" \
            --predicate "$predicate" \
            --public-profile-sha256 "$PUBLIC_PROFILE_SHA256" \
            --profile-name "${{ inputs.domain_core_profile }}" \
            --activation "$activation" \
            --candidate-bundle "$proof_dir/domain-core-candidate-bundle.json" \
            --promotion-attestation "$proof_dir/domain-core-promotion.sigstore.jsonl" \
            --protected-signer-run-id "$SIGNER_RUN_ID" \
            --protected-signer-run-attempt "$SIGNER_RUN_ATTEMPT" \
            --candidate-rollback-profile "$proof_dir/domain-core-public-production-rollback.json" \
            --rollback-artifact "$RETAINED_ROLLBACK" \
            --rollback-profile "$RETAINED_ROLLBACK_PROFILE" \
            --deployment "$RUNNER_TEMP/functions-deployment-evidence.json" \
            --legacy-absence-root "$proof_dir/functions-lib"
          {
            echo "artifact=$artifact"
            echo "predicate=$predicate"
            echo "bundle_asset=OpenBurnBar-${RELEASE_VERSION}-functions-pricing.sigstore.json"
          } >> "$GITHUB_OUTPUT"

      - name: Attest exact Functions deployment receipt
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.artifact }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ steps.evidence.outputs.predicate }}

      - name: Stage exact official provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BUNDLE_ASSET: ${{ steps.evidence.outputs.bundle_asset }}
        run: |
          set -euo pipefail
          install -m 0600 "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/$BUNDLE_ASSET"


      - name: Publish immutable normal-release evidence
        if: inputs.domain_core_profile == 'public-production'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.evidence.outputs.artifact }}
          PREDICATE_PATH: ${{ steps.evidence.outputs.predicate }}
          BUNDLE_ASSET: ${{ steps.evidence.outputs.bundle_asset }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/domain-core-functions-publication.json"
          node - "$manifest" "$ARTIFACT_PATH" "$PREDICATE_PATH" "$RUNNER_TEMP/$BUNDLE_ASSET" "$BUNDLE_ASSET" <<'NODE'
          const fs = require("node:fs");
          const [manifest, artifact, predicate, bundle, bundleAsset] = process.argv.slice(2);
          fs.writeFileSync(manifest, `${JSON.stringify({
            schemaVersion: 2,
            repository: "Imagine-That-Ai/BurnBar",
            tag: process.env.RELEASE_TAG,
            commit: process.env.GITHUB_SHA,
            consumer: "functions",
            signerWorkflow: ".github/workflows/domain-core-functions-release-evidence.yml",
            artifactPath: artifact,
            bundles: [{ domain: "pricing", assetName: bundleAsset, bundlePath: bundle, predicatePath: predicate }],
          }, null, 2)}\n`);
          NODE
          node scripts/ci/publish-domain-core-release-evidence.mjs --manifest "$manifest"

      - name: Retain unique immutable rollback evidence
        if: inputs.domain_core_profile == 'public-production-rollback'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: domain-core-functions-rollback-evidence-${{ github.ref_name }}-${{ inputs.deploy_run_id }}-${{ inputs.deploy_run_attempt }}
          path: |
            ${{ steps.evidence.outputs.artifact }}
            ${{ steps.evidence.outputs.predicate }}
            ${{ runner.temp }}/${{ steps.evidence.outputs.bundle_asset }}
            ${{ runner.temp }}/functions-deploy-run-verification.json
            ${{ runner.temp }}/functions-deploy-proof
            ${{ runner.temp }}/functions-deploy-health/deploy-health.json
          if-no-files-found: error
          retention-days: 90
