name: Build Staging Candidate

# Candidate refs may build and test deployment material, but never receive
# cloud credentials. A real rehearsal delegates bounded artifacts to the
# reusable deployment workflow pinned to main.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional exact candidate SHA; overrides are accepted only when this workflow runs from main"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build and test only; do not invoke the trusted deploy workflow"
        required: false
        type: boolean
        default: true
      deploy_functions:
        description: "Include a reviewed Functions artifact"
        required: false
        type: boolean
        default: false
      deploy_hosting:
        description: "Include the isolated staging marketing website artifact"
        required: false
        type: boolean
        default: false
      function_targets:
        description: "Optional reviewed subset; blank deploys every target in the staging manifest"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-candidate:
    name: Resolve exact staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - name: Authorize exact candidate selection
        id: resolve
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          candidate_sha="${INPUT_CANDIDATE_SHA:-$DISPATCH_SHA}"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character Git SHA."
            exit 1
          fi
          if [[ -n "$INPUT_CANDIDATE_SHA" && "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::An explicit candidate_sha may be promoted only by dispatching this workflow from main."
            exit 1
          fi
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Exact staging candidate"
            echo
            echo "- Candidate SHA: \`$candidate_sha\`"
            echo "- Workflow ref: \`$DISPATCH_REF\`"
            if [[ -n "$INPUT_CANDIDATE_SHA" ]]; then
              echo "- Mode: trusted-main promotion of an exact candidate"
            else
              echo "- Mode: current-ref candidate"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-rules-candidate:
    name: Build and test staging rules candidate
    needs: resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Test candidate rules without credentials
        run: |
          set -euo pipefail
          npm ci --prefix functions
          npm --prefix functions run test:firestore-rules

      - name: Package bounded rules data
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-rules"
          cp firestore.rules firestore.indexes.json storage.rules "$RUNNER_TEMP/staging-rules/"
          (
            cd "$RUNNER_TEMP/staging-rules"
            sha256sum firestore.rules firestore.indexes.json storage.rules > SHA256SUMS
            printf '%s\n' "$CANDIDATE_SHA" > CANDIDATE_SHA
          )

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: staging-rules-${{ needs.resolve-candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/staging-rules
          if-no-files-found: error
          retention-days: 3

  build-hosting-candidate:
    name: Build and test staging Hosting candidate
    needs: resolve-candidate
    if: ${{ inputs.deploy_hosting }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STAGING_FIREBASE_PUBLIC_CONFIG_JSON: ${{ vars.STAGING_FIREBASE_PUBLIC_CONFIG_JSON }}
      PUBLIC_ANALYTICS_COLLECTOR_URL: ${{ vars.STAGING_ANALYTICS_COLLECTOR_URL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build isolated staging website without credentials
        run: |
          set -euo pipefail
          test -n "$STAGING_FIREBASE_PUBLIC_CONFIG_JSON"
          npm ci --prefix website
          npm run build:staging --prefix website
          node scripts/ci/write-firebase-hosting-ci-config.test.mjs

      - name: Package bounded Hosting data
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/staging-hosting/website/dist"
          mkdir -p "$destination"
          cp -R website/dist/. "$destination/"
          (
            cd "$RUNNER_TEMP/staging-hosting"
            find website -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            printf '%s\n' "$CANDIDATE_SHA" > CANDIDATE_SHA
          )

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: staging-hosting-${{ needs.resolve-candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/staging-hosting
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  build-functions-candidate:
    name: Build and test staging Functions candidate
    needs: resolve-candidate
    if: ${{ inputs.deploy_functions }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      FUNCTION_TARGETS: ${{ inputs.function_targets }}
    outputs:
      resolved_function_targets: ${{ steps.scope-functions.outputs.function_targets }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Validate, test, and scope candidate Functions without credentials
        id: scope-functions
        run: |
          set -euo pipefail
          if [[ -n "${FUNCTION_TARGETS:-}" ]] &&
             [[ ! "$FUNCTION_TARGETS" =~ ^functions:[A-Za-z][A-Za-z0-9_-]*(,functions:[A-Za-z][A-Za-z0-9_-]*)*$ ]]; then
            echo "::error::function_targets must contain only explicit Firebase Functions selectors."
            exit 1
          fi
          npm ci --prefix functions
          npm run build --prefix functions
          npm run test:security --prefix functions
          node scripts/ci/prepare-scoped-functions-deploy.mjs \
            --targets "$FUNCTION_TARGETS" \
            --functions-dir functions
          test -f functions/.env.burnbar-staging

      - name: Package bounded Functions data
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/staging-functions/functions"
          mkdir -p "$destination"
          cp -R functions/lib "$destination/lib"
          find "$destination/lib" -type f \
            \( -name '*.d.ts' -o -name '*.d.ts.map' \) -delete
          rm -f "$destination/lib/appstore/certs/README.md"
          cp -R functions/vendor "$destination/vendor"
          test -f "$destination/vendor/openburnbar/brace-expansion-cjs.tgz"
          rm -rf "$destination/vendor/openburnbar/brace-expansion-cjs"
          cp functions/package.json functions/package-lock.json functions/.env.burnbar-staging "$destination/"
          (
            cd "$RUNNER_TEMP/staging-functions"
            find functions -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            printf '%s\n' "$CANDIDATE_SHA" > CANDIDATE_SHA
          )

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: staging-functions-${{ needs.resolve-candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/staging-functions
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-through-trusted-main:
    name: Deploy candidate through trusted main workflow
    if: ${{ !inputs.dry_run && always() && needs.resolve-candidate.result == 'success' && needs.build-rules-candidate.result == 'success' && (!inputs.deploy_hosting || needs.build-hosting-candidate.result == 'success') && (!inputs.deploy_functions || needs.build-functions-candidate.result == 'success') }}
    needs:
      - resolve-candidate
      - build-rules-candidate
      - build-hosting-candidate
      - build-functions-candidate
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: Imagine-That-Ai/BurnBar/.github/workflows/deploy-staging-trusted.yml@main
    with:
      candidate_sha: ${{ needs.resolve-candidate.outputs.candidate_sha }}
      rules_artifact: staging-rules-${{ needs.resolve-candidate.outputs.candidate_sha }}
      deploy_hosting: ${{ inputs.deploy_hosting }}
      hosting_artifact: staging-hosting-${{ needs.resolve-candidate.outputs.candidate_sha }}
      deploy_functions: ${{ inputs.deploy_functions }}
      functions_artifact: staging-functions-${{ needs.resolve-candidate.outputs.candidate_sha }}
      # The candidate build resolves a blank input to the reviewed staging
      # manifest, so the trusted deploy always receives explicit selectors and
      # never runs an unscoped `--only functions` deployment.
      function_targets: ${{ needs.build-functions-candidate.outputs.resolved_function_targets }}
    secrets: inherit
