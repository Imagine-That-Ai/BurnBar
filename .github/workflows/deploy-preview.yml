name: Preview Channel (burnbar-staging)

# Per-PR Firebase Hosting preview channel on the burnbar-staging project.
# Production is never touched: the only deploy target below is the staging
# project, and the build refuses to package any production Firebase
# identifier (BB-01). Pull requests from forks skip the deploy leg cleanly
# because repository secrets are never exposed to them. When
# FIREBASE_SERVICE_ACCOUNT_BURNBAR_STAGING is not set the deploy + preview
# smoke legs skip with a notice instead of going red; the local smoke leg
# always runs so the suite still gates every PR.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "website/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-preview.yml"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview site (staging config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build with staging Firebase config
        env:
          # Repo *variable* (not secret): the burnbar-staging web-app config.
          # Same input the trusted staging lane uses — one source of truth.
          STAGING_FIREBASE_PUBLIC_CONFIG_JSON: ${{ vars.STAGING_FIREBASE_PUBLIC_CONFIG_JSON }}
        run: |
          set -euo pipefail
          npm ci --prefix website
          node website/scripts/build-staging.mjs
          # BB-01: refuse to package any production identifier.
          node website/scripts/verify-no-prod-config.mjs website/dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-site-pr-${{ github.event.pull_request.number }}
          path: website/dist
          if-no-files-found: error
          retention-days: 3

  deploy-preview:
    name: Deploy to burnbar-staging preview channel
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork pull requests never see secrets; skip the deploy leg for them.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_sa: ${{ steps.creds.outputs.has_sa }}
      preview_url: ${{ steps.deploy.outputs.details_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-site-pr-${{ github.event.pull_request.number }}
          path: public

      - name: Check staging deploy credentials
        id: creds
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BURNBAR_STAGING != '' }}
        run: echo "has_sa=${HAS_SA}" >> "$GITHUB_OUTPUT"

      - name: Note skipped deploy
        if: steps.creds.outputs.has_sa != 'true'
        run: |
          echo "::notice::FIREBASE_SERVICE_ACCOUNT_BURNBAR_STAGING is not set — preview deploy skipped."
          echo "::notice::Set it per docs/ops/STAGING.md to enable per-PR staging previews."

      # No repoToken: the action's own PR comment stays off; the sticky
      # comment below is the single comment surface and gets the real URL.
      - name: Deploy preview channel on burnbar-staging
        if: steps.creds.outputs.has_sa == 'true'
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@0cbcac4740c2bfb00d632f0b863b57713124eb5a # v0.9.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BURNBAR_STAGING }}
          projectId: burnbar-staging
          target: marketing
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

      - name: Sticky preview comment
        if: steps.creds.outputs.has_sa == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: burnbar-staging-preview
          message: |
            **Staging preview** (project `burnbar-staging`, `noindex`):
            ${{ steps.deploy.outputs.details_url }}

            Preview channels expire after 7 days (expires:
            ${{ steps.deploy.outputs.expire_time_formatted }}).

  smoke-preview:
    name: Playwright smoke on preview channel
    needs: deploy-preview
    # Only runs when a channel was actually deployed.
    if: needs.deploy-preview.outputs.has_sa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Playwright + run smoke on the deployed channel
        env:
          # The real channel URL (with hash suffix) from the deploy action.
          BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          BURNBAR_STAGING_TEST_EMAIL: ${{ secrets.BURNBAR_STAGING_TEST_EMAIL }}
          BURNBAR_STAGING_TEST_PASSWORD: ${{ secrets.BURNBAR_STAGING_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci --prefix website
          npx --yes playwright install --with-deps chromium
          npm run test:smoke --prefix website

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-preview-pr-${{ github.event.pull_request.number }}
          path: |
            website/test-results/smoke/
            website/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  smoke-local:
    name: Playwright smoke on built site (local server)
    # Gates every PR: serves the staging-config build locally, needs no
    # secrets and never touches Firebase — so it runs even when the deploy
    # leg is skipped (forks, missing secret).
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-site-pr-${{ github.event.pull_request.number }}
          path: website/dist

      - name: Serve build + run smoke
        env:
          BASE_URL: http://127.0.0.1:4322
        run: |
          set -euo pipefail
          npm ci --prefix website
          npx --yes playwright install --with-deps chromium
          (npm run preview --prefix website &)
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4322/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4322/
          npm run test:smoke --prefix website

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-local-pr-${{ github.event.pull_request.number }}
          path: |
            website/test-results/smoke/
            website/playwright-report/
          if-no-files-found: warn
          retention-days: 14
