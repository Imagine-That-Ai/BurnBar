name: BurnBarRemote AAR (Android)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/burnbar-remote/**"
      - "scripts/build-burnbar-remote-android-aar.sh"
      - ".github/workflows/build-burnbar-remote-android-aar.yml"
      - "android/burnbar-remote/**"
      - "android/app/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "Vendor/burnbar-remote.aar"
  pull_request:
    paths:
      - "crates/burnbar-remote/**"
      - "scripts/build-burnbar-remote-android-aar.sh"
      - ".github/workflows/build-burnbar-remote-android-aar.yml"
      - "android/burnbar-remote/**"
      - "android/app/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "Vendor/burnbar-remote.aar"
  workflow_dispatch:

concurrency:
  group: burnbar-remote-aar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
        with:
          packages: "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          toolchain: "1.94.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/burnbar-remote/target
            build/burnbar-remote-uniffi-bindgen-kotlin-helper/target
          key: burnbar-remote-aar-${{ runner.os }}-${{ hashFiles('crates/burnbar-remote/Cargo.toml', 'crates/burnbar-remote/Cargo.lock') }}
          restore-keys: |
            burnbar-remote-aar-${{ runner.os }}-

      - name: Install cargo-ndk
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if cargo install cargo-ndk --locked --version "^3.5"; then
                exit 0
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep "$((attempt * 10))"
            done
          fi

      - name: Export Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euo pipefail
          ndk_path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          if [[ ! -d "${ndk_path}" ]]; then
            echo "Expected Android NDK missing: ${ndk_path}" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Host-side cargo check
        run: cargo check -p burnbar-remote-ffi
        working-directory: crates/burnbar-remote

      - name: Host-side cargo test
        run: cargo test -p burnbar-remote-ffi
        working-directory: crates/burnbar-remote

      - name: Verify committed AAR provenance and native structure
        run: ./scripts/build-burnbar-remote-android-aar.sh --check
        env:
          BURNBAR_REMOTE_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Preserve committed AAR for device proof
        run: cp Vendor/burnbar-remote.aar "${RUNNER_TEMP}/burnbar-remote-committed.aar"

      - name: Build AAR
        run: ./scripts/build-burnbar-remote-android-aar.sh
        env:
          BURNBAR_REMOTE_BUILD_PROFILE: release
          BURNBAR_REMOTE_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify committed AAR and Kotlin binding parity
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            android/burnbar-remote/src/main/java/uniffi/burnbar_remote \
            || {
              echo "::error::Committed BurnBarRemote Kotlin bindings do not match a clean source rebuild.";
              exit 1;
            }

      - name: Restore committed AAR for device proof
        run: cp "${RUNNER_TEMP}/burnbar-remote-committed.aar" Vendor/burnbar-remote.aar

      - name: Compile committed AAR native-load test
        run: ./gradlew :burnbar-remote:assembleDebugAndroidTest --no-daemon --stacktrace
        working-directory: android

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute committed AAR smoke on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 4G
          script: cd android && ./gradlew :burnbar-remote:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Build host UniFFI library for JVM smoke
        run: cargo build -p burnbar-remote-ffi
        working-directory: crates/burnbar-remote

      - name: Smoke-test Kotlin bridge
        run: |
          ./gradlew \
            -Dburnbar.remote.expectNative=true \
            -Dburnbar.remote.nativeLibraryPath=../crates/burnbar-remote/target/debug \
            :burnbar-remote:testDebugUnitTest \
            --no-daemon \
            --stacktrace
        working-directory: android

      - name: Inspect AAR
        run: |
          set -euo pipefail
          ls -la Vendor/burnbar-remote.aar
          unzip -l Vendor/burnbar-remote.aar | head -60

      - name: Upload AAR artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: burnbar-remote.aar
          path: Vendor/burnbar-remote.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Kotlin bindings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: burnbar-remote-kotlin-bindings
          path: android/burnbar-remote/src/main/java/uniffi/burnbar_remote
          if-no-files-found: error
          retention-days: 14
