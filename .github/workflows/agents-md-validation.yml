name: AGENTS.md Validation

# Validates that AGENTS.md stays consistent with the actual codebase.
# Checks: script existence, command references, link validity, and doc freshness.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/ci/verify-agent-memory-source-policy.mjs"
      - "scripts/ci/verify-agent-memory-source-policy.test.mjs"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/agents-md-validation.yml"
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    # Weekly check: Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: agents-md-validation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  # Only pull_request runs share a group and get cancelled. merge_group runs are
  # the merge-queue's own proof and `push` runs are the per-commit post-merge
  # record, so both get a unique per-run group that can never collide: a shared
  # group evicts a *pending* run even with cancel-in-progress false, because
  # GitHub keeps at most one queued run per group. Same pattern and reasoning as
  # `.github/workflows/security-pr.yml`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-agents-md:
    # Plain bash + node + git — no macOS dependency. Moved off macos-26
    # (2026-07-31) to stop occupying the scarce hosted-macOS concurrency pool
    # that the Swift lanes contend for.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Validate AGENTS.md script references exist
        run: |
          set -euo pipefail
          echo "==> Checking scripts referenced in AGENTS.md exist..."
          ERRORS=0

          check_script() {
            local script="$1"
            if [[ ! -f "$script" && ! -f "$script.sh" ]]; then
              echo "FAIL: Referenced script not found: $script" >&2
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: $script"
            fi
          }

          # Extract script references from AGENTS.md (lines that look like script paths)
          while IFS= read -r line; do
            if [[ "$line" =~ \`(scripts/[^[:space:]\`]+)\` ]]; then
              check_script "${BASH_REMATCH[1]}"
            fi
          done < AGENTS.md

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS script(s) referenced in AGENTS.md are missing from the repo."
            exit 1
          fi
          echo "All AGENTS.md script references are valid."

      - name: Validate Makefile targets referenced in AGENTS.md exist
        run: |
          set -euo pipefail
          echo "==> Checking Makefile targets referenced in AGENTS.md..."
          ERRORS=0

          # Targets we expect AGENTS.md to describe
          REQUIRED_TARGETS=("ci" "test" "lint" "build")
          for target in "${REQUIRED_TARGETS[@]}"; do
            if grep -q "^${target}:" Makefile; then
              echo "OK: Makefile target '$target' exists"
            else
              echo "FAIL: Makefile target '$target' missing" >&2
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS Makefile target(s) referenced in AGENTS.md are missing."
            exit 1
          fi

      - name: Validate internal links in AGENTS.md
        run: node scripts/ci/validate-agents-md-links.mjs AGENTS.md

      - name: Self-test agent memory source policy
        run: node scripts/ci/verify-agent-memory-source-policy.test.mjs

      - name: Self-test AGENTS.md link validation
        run: node --test scripts/ci/validate-agents-md-links.test.mjs

      - name: Verify agent memory source policy
        run: node scripts/ci/verify-agent-memory-source-policy.mjs

      - name: Check AGENTS.md freshness relative to key scripts
        run: |
          set -euo pipefail
          echo "==> Checking AGENTS.md was updated alongside key scripts..."

          # Get the last-modified timestamp for AGENTS.md
          AGENTS_DATE=$(git log -1 --format="%ct" -- AGENTS.md)

          # Check if key scripts are newer than AGENTS.md by more than 30 days
          THRESHOLD=$((30 * 24 * 3600))
          NOW=$(date +%s)
          AGENTS_AGE=$((NOW - AGENTS_DATE))

          if [[ $AGENTS_AGE -gt $THRESHOLD ]]; then
            echo "::warning::AGENTS.md has not been updated in over 30 days. Consider reviewing for accuracy."
          else
            echo "OK: AGENTS.md was updated $(( AGENTS_AGE / 86400 )) days ago."
          fi

      - name: Verify AGENTS.md build commands reference valid package.json scripts
        run: |
          set -euo pipefail
          echo "==> Verifying functions build/test scripts exist in functions/package.json..."
          ERRORS=0

          check_npm_script() {
            local dir="$1" script="$2"
            if ! node -e "const p=require('./${dir}/package.json'); process.exit(p.scripts && p.scripts['${script}'] ? 0 : 1)" 2>/dev/null; then
              echo "FAIL: npm script '${script}' missing in ${dir}/package.json" >&2
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: ${dir} has script '${script}'"
            fi
          }

          check_npm_script "functions" "build"
          check_npm_script "functions" "lint"
          check_npm_script "functions" "test"
          check_npm_script "extensions/openburnbar" "build"
          check_npm_script "extensions/openburnbar" "lint"
          check_npm_script "extensions/openburnbar" "test"

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS npm script(s) referenced in AGENTS.md are missing."
            exit 1
          fi
