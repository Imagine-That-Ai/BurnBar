name: Ops plane verify (production)

permissions:
  contents: read

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply GCP log metrics + alert policies (requires OPS_ALERT_CHANNELS secret)"
        required: false
        type: boolean
        default: false
  # PRs run ONLY the creds-free drift-check self-tests (drift-check-selftest job).
  # The live diff steps live in the `verify` job, which is gated on GCP creds and
  # never runs on a PR — so the diff LOGIC is gated on every PR while the live
  # comparison stays a scheduled/dispatch concern.
  pull_request:
    branches: [main]
    paths:
      - "scripts/lib/branch-protection-drift.mjs"
      - "scripts/lib/ops-alert-plane-drift.mjs"
      - "scripts/ops/check-branch-protection-drift.*"
      - "scripts/ops/check-ops-alert-plane-drift.*"
      - "scripts/ops/verify-github-governance.sh"
      - "governance/branch-protection.main.json"
      - "functions/scripts/ops-alert-policy-definitions.mjs"
      - "functions/scripts/billing-alert-policy-definitions.mjs"
      - ".github/workflows/ops-plane-verify.yml"

concurrency:
  group: ops-plane-verify
  cancel-in-progress: false

jobs:
  # Creds-free gate for the drift-check scripts themselves. Runs on PRs and on
  # schedule/dispatch so a drift check that can no longer DETECT drift fails loud
  # before it is ever trusted to guard live state. No GCP/gh credentials required.
  drift-check-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Branch-protection drift check — offline self-test
        run: node --test scripts/ops/check-branch-protection-drift.test.mjs

      - name: Ops alert-plane drift check — offline self-test
        run: node --test scripts/ops/check-ops-alert-plane-drift.test.mjs

      - name: Syntax-check reworked GitHub governance verifier
        run: bash -n scripts/ops/verify-github-governance.sh

  detect-secrets:
    runs-on: ubuntu-latest
    # Production-environment jobs (this, plus verify / skipped-no-gcp-key via `needs`)
    # run only on schedule / workflow_dispatch. On pull_request, only drift-check-selftest
    # runs (it has no environment), so PRs never hit production environment protection.
    # Without this guard the PR check fails with "not allowed to deploy to production".
    if: github.event_name != 'pull_request'
    environment: production
    outputs:
      has-gcp-sa-key: ${{ steps.detect.outputs.has-gcp-sa-key }}
    steps:
      - name: Detect required secrets
        id: detect
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [[ -n "${GCP_SA_KEY}" ]]; then
            echo "has-gcp-sa-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-gcp-sa-key=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: detect-secrets
    if: github.event_name != 'pull_request' && needs.detect-secrets.outputs.has-gcp-sa-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Check out pinned Hermes agent source
        id: hermes-agent-source
        run: |
          repo="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.forkRepository)")"
          pin="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.pinnedCommit)")"
          src="$RUNNER_TEMP/hermes-agent"
          git clone --no-tags --filter=blob:none "$repo" "$src"
          git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach "$pin"
          echo "path=$src" >> "$GITHUB_OUTPUT"

      - name: Activate ops plane (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          GCLOUD_PROJECT: burnbar
          OPS_ALERT_CHANNELS: ${{ secrets.OPS_ALERT_CHANNELS }}
        run: bash scripts/ops/activate-production-ops-plane.sh

      - name: Verify production ops plane
        env:
          GCLOUD_PROJECT: burnbar
          OPENBURNBAR_FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          VERIFY_OPS_PLANE_SUMMARY: verify-ops-plane-summary.json
          GH_TOKEN: ${{ github.token }}
          HERMES_AGENT_SRC: ${{ steps.hermes-agent-source.outputs.path }}
        run: bash scripts/ops/verify-production-ops-plane.sh

      # Live drift checks: prove LIVE state == committed source of truth. These
      # need creds (gh repo scope / gcloud) so they run ONLY here, never on PRs.
      # Fail CLOSED on any divergence. (Branch-protection drift is also exercised
      # transitively by verify-production-ops-plane.sh -> verify-github-governance.sh;
      # this explicit step gives a distinct, readable CI signal.)
      - name: Branch-protection drift — live (ruleset + classic) vs committed source of truth
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OPENBURNBAR_GOVERNANCE_REPO: ${{ github.repository }}
          OPENBURNBAR_GOVERNANCE_ORG: ${{ github.repository_owner }}
        run: node scripts/ops/check-branch-protection-drift.mjs

      - name: Ops alert-plane drift — live GCP policies vs committed manifest
        if: always()
        env:
          GCLOUD_PROJECT: burnbar
        run: node scripts/ops/check-ops-alert-plane-drift.mjs

      - name: Collect Firebase security evidence
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          KMS_LOCATIONS: global,us,us-central1,us-east1,us-east4,northamerica-northeast1
        run: |
          node scripts/ops/collect-firebase-security-evidence.mjs \
            --strict \
            --output firebase-security-evidence.json

      - name: Verify Firebase evidence redaction
        if: always()
        run: |
          test -f firebase-security-evidence.json
          node scripts/security/check-public-evidence-redaction.mjs firebase-security-evidence.json

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ops-plane-verify-${{ github.run_id }}
          path: |
            verify-ops-plane-summary.json
            firebase-security-evidence.json
          if-no-files-found: ignore

  skipped-no-gcp-key:
    needs: detect-secrets
    if: github.event_name != 'pull_request' && needs.detect-secrets.outputs.has-gcp-sa-key == 'false'
    runs-on: ubuntu-latest
    steps:
      # Fail CLOSED on the scheduled production run: a missing GCP_SA_KEY there means
      # the Firestore DR + GitHub governance posture went UNVERIFIED, and a silent green
      # would hide that gap (audit RR-4). Manual workflow_dispatch dry-runs may soft-skip.
      - name: Fail closed on scheduled runs; soft-skip manual dry-runs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "::error::GCP_SA_KEY is not set — production DR/governance verification could not run. Failing closed so the gap is visible instead of reporting a false green." >&2
            exit 1
          fi
          echo "::notice::GCP_SA_KEY not set — ops plane verify skipped (manual dispatch dry-run)."
