name: CodeQL PR

# Required PR CodeQL for every non-Swift language configured on main. Keeping
# the same categories on pull requests prevents GitHub Advanced Security from
# treating compiled-language configurations as missing on large code changes.
#
# Swift CodeQL stays on nightly `codeql.yml` only (schedule + workflow_dispatch).
# That matches codeql.yml's longstanding design note that Swift is NOT on
# pull_request — Swift analysis takes ~60m on macOS and must not wake the
# merge queue or block PR velocity. Do not re-add push-to-main on codeql.yml.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      FIREBASE_SOURCE_FIRESTORE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up JDK 21 for Android
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)

      - name: Prepare Android Firebase placeholder
        if: matrix.language == 'java-kotlin'
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
