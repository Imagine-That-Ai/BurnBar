name: CodeQL PR (JS+Python)

# Path-filtered PR CodeQL for the script/service languages that analyze quickly.
# Swift stays in the nightly/push CodeQL workflow because it requires a traced
# xcodebuild and routinely takes an hour on hosted macOS runners.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/codeql-pr.yml"
      - ".github/workflows/codeql.yml"
      - "apps/console/**/*.js"
      - "apps/console/**/*.jsx"
      - "apps/console/**/*.ts"
      - "apps/console/**/*.tsx"
      - "extensions/openburnbar/**/*.js"
      - "extensions/openburnbar/**/*.ts"
      - "functions/**/*.js"
      - "functions/**/*.ts"
      - "packages/**/*.js"
      - "packages/**/*.ts"
      - "quota-runner/**/*.js"
      - "quota-runner/**/*.ts"
      - "scripts/**/*.py"
      - "services/**/*.js"
      - "services/**/*.ts"
      - "tools/**/*.js"
      - "tools/**/*.mjs"
      - "tools/**/*.py"
      - "tools/**/*.ts"
      - "website/**/*.js"
      - "website/**/*.jsx"
      - "website/**/*.ts"
      - "website/**/*.tsx"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/pr-language:${{ matrix.language }}"
