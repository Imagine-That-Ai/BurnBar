name: CodeQL PR (JS+Python)

# Required PR CodeQL for the script/service languages that analyze quickly.
# This workflow must not be path-filtered while branch protection requires the
# Analyze contexts globally: skipped workflows leave required checks missing and
# make otherwise-green PRs unmergeable.
# Swift stays in the nightly/push CodeQL workflow because it requires a traced
# xcodebuild and routinely takes an hour on hosted macOS runners.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/pr-language:${{ matrix.language }}"
