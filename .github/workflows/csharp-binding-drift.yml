name: C# binding drift (uniffi)

# Codegen-drift gate for the committed uniffi C# bindings the Windows native
# shim and domain-core adapters consume.
# Rebuilds each cdylib, regenerates the binding with the PINNED
# uniffi-bindgen-cs, and diffs against the committed generated source — so a
# `#[uniffi::export]` surface change can never land without its regenerated
# binding (docs/windows-port/decisions/0001-csharp-binding-path.md).
#
# Owned by the native-shim lane (Wave 1 item 4 of
# docs/windows-port/PARITY_100_REMEDIATION_PLAN.md). The crate build lanes
# (build-iroh-windows.yml / build-burnbar-remote-windows.yml) are owned by
# W-RUST and are not touched by this gate.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/burnbar-remote/**"
      - "crates/openburnbar-iroh/**"
      - "crates/openburnbar-domain-core/**"
      - "scripts/windows-port/check-csharp-binding-drift.sh"
      - ".github/workflows/csharp-binding-drift.yml"
  pull_request:
    paths:
      - "crates/burnbar-remote/**"
      - "crates/openburnbar-iroh/**"
      - "crates/openburnbar-domain-core/**"
      - "scripts/windows-port/check-csharp-binding-drift.sh"
      - ".github/workflows/csharp-binding-drift.yml"
  workflow_dispatch:

concurrency:
  group: csharp-binding-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      # Each crate pins its own rustc via rust-toolchain.toml (1.94.0 /
      # 1.96.0); rustup auto-installs the right one when cargo runs inside the
      # crate directory, so a single explicit install is enough to seed rustup.
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Cache cargo registry + crate targets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/burnbar-remote/target
            crates/openburnbar-iroh/target
            crates/openburnbar-domain-core/target
          key: csharp-binding-drift-${{ runner.os }}-${{ hashFiles('crates/burnbar-remote/Cargo.lock', 'crates/openburnbar-iroh/Cargo.lock', 'crates/openburnbar-domain-core/Cargo.lock') }}
          restore-keys: |
            csharp-binding-drift-${{ runner.os }}-

      # The generator is pinned to the crates' uniffi 0.28.3 ABI (decision
      # 0001); the drift script refuses any other version. Cached by tag so the
      # cargo-install cost is paid once per pin bump.
      - name: Cache pinned uniffi-bindgen-cs
        id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ runner.os }}-v0.9.2+v0.28.3

      - name: Install pinned uniffi-bindgen-cs
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.9.2+v0.28.3

      - name: Check committed C# bindings against the pinned generator
        run: scripts/windows-port/check-csharp-binding-drift.sh
