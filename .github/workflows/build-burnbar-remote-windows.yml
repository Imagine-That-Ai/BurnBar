name: BurnBarRemote (Windows / MSVC)

# Windows crate-build lane for the gen-2 remote engine, mirroring
# build-burnbar-remote-android-aar.yml (which runs the same crate on a non-Apple
# host — ubuntu). This lane builds the whole `burnbar-remote` workspace, and the
# `burnbar-remote-ffi` cdylib the Windows C# shim consumes, for both supported
# Windows triples on a native `windows-latest` MSVC host.
#
# Ownership (VAL-P0-RUST-005): this file, and build-iroh-windows.yml, are OWNED
# and authored by the Rust→Windows lane. CI-002/W-SCAFFOLD only *references* them
# (factory shared-file discipline, master plan §6.3).
#
# Green msvc build+test is PROVEN by VAL-P0-RUST-006 once a Windows runner is
# enabled (billing is an open item). The lane is authored now so it is one
# toggle from green.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/burnbar-remote/**"
      - ".github/workflows/build-burnbar-remote-windows.yml"
  pull_request:
    paths:
      - "crates/burnbar-remote/**"
      - ".github/workflows/build-burnbar-remote-windows.yml"
  workflow_dispatch:

concurrency:
  group: burnbar-remote-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      # `ring` (pulled by iroh via burnbar-remote-network) assembles its crypto
      # primitives with NASM on the MSVC target; Perl (its other build-time
      # dependency) is preinstalled on the windows-latest image.
      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install rust toolchain
        # Keep in sync with crates/burnbar-remote/rust-toolchain.toml and the
        # burnbar-remote Android/xcframework lanes so every platform builds on the
        # same rustc against the `iroh =1.0.0-rc.0` pin.
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1, pinned via toolchain below
        with:
          toolchain: "1.94.0"
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/burnbar-remote/target
          key: burnbar-remote-windows-${{ runner.os }}-${{ hashFiles('crates/burnbar-remote/Cargo.toml', 'crates/burnbar-remote/Cargo.lock') }}
          restore-keys: |
            burnbar-remote-windows-${{ runner.os }}-

      # ---- x86_64: full build + test (native on the x64 runner) --------------
      - name: Build workspace (x86_64-pc-windows-msvc)
        run: cargo build --workspace --target x86_64-pc-windows-msvc
        working-directory: crates/burnbar-remote

      - name: Test workspace (x86_64-pc-windows-msvc)
        run: cargo test --workspace --target x86_64-pc-windows-msvc
        working-directory: crates/burnbar-remote

      - name: Build the FFI cdylib explicitly (x86_64-pc-windows-msvc)
        # The C# shim (crates/burnbar-remote/bindings/csharp) consumes this DLL;
        # build it by name so a workspace-graph change can never silently drop it.
        run: cargo build -p burnbar-remote-ffi --target x86_64-pc-windows-msvc
        working-directory: crates/burnbar-remote

      # ---- aarch64: build-only (cannot execute ARM64 on the x64 runner) -------
      - name: Build workspace (aarch64-pc-windows-msvc, build-only)
        run: cargo build --workspace --target aarch64-pc-windows-msvc
        working-directory: crates/burnbar-remote

      - name: Inspect built native artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "== x86_64 =="
          ls -la crates/burnbar-remote/target/x86_64-pc-windows-msvc/debug/*.dll crates/burnbar-remote/target/x86_64-pc-windows-msvc/debug/*.lib 2>/dev/null || true
          echo "== aarch64 =="
          ls -la crates/burnbar-remote/target/aarch64-pc-windows-msvc/debug/*.dll crates/burnbar-remote/target/aarch64-pc-windows-msvc/debug/*.lib 2>/dev/null || true

      - name: Upload burnbar-remote Windows native libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: burnbar-remote-windows-native
          path: |
            crates/burnbar-remote/target/x86_64-pc-windows-msvc/debug/burnbar_remote.dll
            crates/burnbar-remote/target/x86_64-pc-windows-msvc/debug/burnbar_remote.dll.lib
            crates/burnbar-remote/target/aarch64-pc-windows-msvc/debug/burnbar_remote.dll
          if-no-files-found: warn
          retention-days: 14
