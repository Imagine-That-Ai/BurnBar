name: Droid Tag

# CI-cost hardening (2026-07-31): this workflow spawned ~120 runs/48h with
# nearly all skipped — every review, inline comment, and PR body edit created
# a run just to evaluate the @droid gate. issue_comment already covers
# conversation comments on both issues and PRs, which is the canonical
# invocation path; `edited` fired on every title/body touch.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@droid') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.comment.body, '@droid') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.review.body, '@droid') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.issue.pull_request == null &&
        (contains(github.event.issue.body, '@droid') || contains(github.event.issue.title, '@droid')) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.issue.author_association)
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.body, '@droid') || contains(github.event.pull_request.title, '@droid')) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FACTORY_API_KEY_AVAILABLE: ${{ secrets.FACTORY_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Skip Droid when Factory API key is unavailable
        if: env.FACTORY_API_KEY_AVAILABLE == 'false'
        run: echo "::notice::FACTORY_API_KEY is unavailable; skipping Droid run."
      - name: Resolve PR comment scope
        id: pr-comment-scope
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_URL: ${{ github.event.issue.pull_request.url || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          allowed=true
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" && "${ISSUE_IS_PR}" == "true" ]]; then
            head_repo="$(gh api "${PR_URL}" --jq '.head.repo.full_name')"
            if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
              allowed=false
            fi
          fi
          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"
      - name: Run Droid Exec
        if: env.FACTORY_API_KEY_AVAILABLE == 'true' && steps.pr-comment-scope.outputs.allowed == 'true'
        uses: Factory-AI/droid-action@49188f4035f23e609bbeee36ec5b22e72212a8e5
        with:
          github_token: ${{ github.token }}
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
