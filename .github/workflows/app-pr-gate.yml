name: App PR Gate (Swift)

# Merge-blocking lane for the macOS AgentLens APP target (and the app-linked
# OpenBurnBarCore/CloudSync/memory surfaces it compiles). The full Swift suite
# runs post-merge/nightly in openburnbar-pr-harness.yml, deliberately off the PR
# path for velocity — which left the APP TARGET with NO merge-blocking build
# signal. A non-compiling app shipped to main this way (PR #597's
# KnowledgeSyncService static-call error, caught only post-merge). This lane
# builds + tests the app target on every PR so an app-target compile error or
# app-test regression cannot merge again.
#
# Mirrors daemon-pr-gate.yml (the proven focused-Swift-lane precedent): always
# runs on non-draft PRs to main, so it can be a required status check directly
# (no skipped-required-check aggregate needed).

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

concurrency:
  group: app-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build-test:
    name: App build + test (AgentLens)
    runs-on: macos-26
    # Cold cache + libsignal FFI + full xcodebuild of the app target on a hosted
    # runner needs headroom; the app suite is heavier than the daemon package.
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
            .derived-data
          key: ${{ runner.os }}-app-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-app-spm-
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Validate app test classifier
        run: bash scripts/test-openburnbar-app-classifier.sh

      - name: Build + test the AgentLens app target
        # Builds the OpenBurnBar app scheme (xcodebuild) and runs OpenBurnBarTests.
        # This is the build that was missing as a PR gate: it compiles every
        # app-target file (AgentLens/**, app-linked OpenBurnBarCore/**, CloudSync,
        # the memory subsystem) and runs the app XCTest suite.
        run: OPENBURNBAR_ENABLE_COVERAGE=NO ./scripts/test-openburnbar-app.sh
