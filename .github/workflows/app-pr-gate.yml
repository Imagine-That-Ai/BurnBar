name: App PR Gate (Swift)

# Merge-blocking lane for the macOS AgentLens APP target (and the app-linked
# OpenBurnBarCore/CloudSync/memory surfaces it compiles). The full Swift suite
# runs post-merge/nightly in openburnbar-pr-harness.yml, deliberately off the PR
# path for velocity — which left the APP TARGET with NO merge-blocking build
# signal. A non-compiling app shipped to main this way (PR #597's
# KnowledgeSyncService static-call error, caught only post-merge). This lane
# builds + tests the app target on every PR so an app-target compile error or
# app-test regression cannot merge again.
#
# Mirrors daemon-pr-gate.yml (the proven focused-Swift-lane precedent): always
# runs on non-draft PRs to main, so it can be a required status check directly
# (no skipped-required-check aggregate needed).
#
# mobile-build-gate (added 2026-07-07): the same gap existed for the iOS app —
# PR CI compiled macOS + SwiftPM but never the OpenBurnBarMobile target, so
# three mobile-only compile breaks reached main in one day during the audit
# remediation (cross-type private logger access, duplicate DEBUG `line` local;
# hotfixes #1358/#1378). This lane compiles the mobile app + unit-test bundle
# (build-for-testing, no test execution — the full mobile XCTest suite stays
# post-merge in openburnbar-pr-harness.yml for velocity) so an iOS compile
# error cannot merge again.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

concurrency:
  group: app-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build-test:
    name: App build + test (AgentLens)
    runs-on: macos-26
    # Cold cache + libsignal FFI + full xcodebuild of the app target on a hosted
    # runner needs headroom; the app suite is heavier than the daemon package
    # and can exceed 75 minutes on macos-26 when daemon lifecycle tests hit their
    # health-check waits.
    timeout-minutes: 120
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache
            .build
            .derived-data
          key: ${{ runner.os }}-app-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-app-spm-
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Validate app test classifier
        run: bash scripts/test-openburnbar-app-classifier.sh

      - name: Build + test the AgentLens app target
        # Builds the OpenBurnBar app scheme (xcodebuild) and runs OpenBurnBarTests.
        # This is the build that was missing as a PR gate: it compiles every
        # app-target file (AgentLens/**, app-linked OpenBurnBarCore/**, CloudSync,
        # the memory subsystem) and runs the app XCTest suite.
        run: OPENBURNBAR_ENABLE_COVERAGE=NO ./scripts/test-openburnbar-app.sh

  mobile-build-gate:
    name: Mobile build (compile gate)
    runs-on: macos-26
    # Compile-only: Signal FFI + full mobile app-and-tests compile, no XCTest
    # execution. Warm-cache runs are far shorter than the 75-minute macOS
    # build+test lane; the cap covers a cold SPM cache plus the FFI build.
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .derived-data
          key: ${{ runner.os }}-mobile-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-mobile-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Prepare Signal FFI XCFramework
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Compile mobile app + unit tests (no test execution)
        # build-for-testing compiles the OpenBurnBarMobile app target AND the
        # OpenBurnBarMobileTests bundle — full compile coverage of every
        # mobile-only source file, without simulator test flakiness on the PR
        # path. FIREBASE_SOURCE_FIRESTORE guards the resolve path if package
        # resolution runs (iOS 27 grpc-binary tripwire, docs/FIREBASE_IOS27_GRPC.md).
        run: |
          set -euo pipefail
          FIREBASE_SOURCE_FIRESTORE=1 xcodebuild build-for-testing \
            -project OpenBurnBar.xcodeproj \
            -scheme OpenBurnBarMobileUnitTests \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath .spm-cache-new \
            -derivedDataPath .derived-data/mobile-pr-gate \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
