name: App PR Gate (Swift)

# Post-merge / nightly AgentLens + mobile compile proof. This is intentionally
# not a pull_request wall: hosted macos-26 App builds were 53–69 minutes and
# made Alberto's 5–10 minute merge door impossible. Fast Feedback plus the
# ten required security/quality contexts remain the PR merge door.
#
# Real work (macos-26 AgentLens CPU gate + bounded smoke, plus the mobile
# compile/unit-test gate) runs on:
#   - push to main (every merge; classifier still selects macos/mobile)
#   - nightly cron (forced full lanes so a quiet day cannot hide a red app)
#   - workflow_dispatch (on-demand SHA proof)
#
# merge_group stays only so a stale base-SHA BurnBar CI Gate inventory that
# still lists `App build + test (AgentLens)` / `Mobile build + unit test`
# observes skipped receipts instead of hanging the queue. Every job below
# skips on merge_group. Fake-green success without a build is not emitted.
# The full Swift XCTest corpus stays in openburnbar-pr-harness.yml.

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    # 09:17 UTC. After the 08:37 full harness so macos-26 runners are not
    # double-booked at the top of the hour.
    - cron: "17 9 * * *"
  workflow_dispatch:
  merge_group:
    branches: [main]
    types: [checks_requested]

# Push runs are the exact-main product proof: key them by commit and never
# cancel them. A later docs-only (or any) main push must not share
# `app-pr-gate-push-refs/heads/main` and evict a 53–69 minute AgentLens run;
# the replacement would classify only its own before..after diff and skip
# macos/mobile. GitHub also evicts a *pending* run when two jobs share a
# group, even with cancel-in-progress false, so push groups include the SHA.
concurrency:
  group: app-pr-gate-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  classify:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/ci-impact.yml

  app-build-test:
    name: AgentLens Rust + Swift build/test prerequisites
    # Routing (cost + security): post-merge main is trusted, but this lane still
    # uses the isolated hosted macOS pools so MACOS_GATE_POOL / CI_POOL policy
    # stays unchanged. Set repo var MACOS_GATE_POOL=paid to force the capped
    # hosted pool for a billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    # Cold cache + libsignal FFI + the full app build and bounded smoke catalog
    # routinely take ~55–70 minutes on macos-26 hosted runners (CPU budget gate
    # alone can take ~30m). Keep a 90m ceiling so a post-merge/nightly run does
    # not cancel mid-smoke. The full XCTest corpus belongs to the
    # post-merge/nightly harness, not this lane.
    timeout-minutes: 90
    needs: classify
    if: github.event_name != 'merge_group' && needs.classify.outputs.macos == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache macOS Signal FFI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .build
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          # Anchored manifest list instead of '**/Package.resolved': the unanchored
          # glob rescans the whole workspace when the post-job save step re-evaluates
          # the key, and by then .spm-cache-new/.derived-data hold enough files to
          # blow hashFiles' 120s budget (and dependency checkouts carry their own
          # Package.resolved copies, drifting the key between restore and save).
          key: ${{ runner.os }}-app-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-app-spm-
            ${{ runner.os }}-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: macOS rAF pause prerequisite (P-PERF-3)
        # Fast deterministic tripwire and real-gate self-tests. This keeps the
        # shipped bundle behavior check ahead of the slower app build/measurement.
        run: node --test scripts/ci/macos-idle-occlusion-gate.test.mjs

      - name: Prepare macOS libsignal FFI for CPU gate
        run: >-
          SIGNAL_FFI_BUILD_TARGETS=aarch64-apple-darwin
          ./scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Build AgentLens app for real-process CPU gate
        run: |
          set -euo pipefail
          PERF_DERIVED_DATA="$GITHUB_WORKSPACE/.derived-data/macos-idle-occlusion-gate"
          rm -rf "$PERF_DERIVED_DATA"
          FIREBASE_SOURCE_FIRESTORE=1 xcodebuild build \
            -project OpenBurnBar.xcodeproj \
            -scheme OpenBurnBar \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -clonedSourcePackagesDirPath .spm-cache-new \
            -derivedDataPath "$PERF_DERIVED_DATA" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Enforce real macOS idle/occluded CPU budget (P-PERF-3)
        run: >-
          node scripts/ci/macos-idle-occlusion-gate.mjs
          --output "$RUNNER_TEMP/macos-idle-occlusion-evidence/result.json"

      - name: Upload macOS idle/occlusion CPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: macos-idle-occlusion-cpu-evidence
          path: ${{ runner.temp }}/macos-idle-occlusion-evidence/result.json
          if-no-files-found: error

      - name: Validate app test classifier
        run: bash scripts/test-openburnbar-app-classifier.sh

      - name: Build + run bounded AgentLens app smoke tests
        # The preceding xcodebuild build compiles every app-target file
        # (AgentLens/**, app-linked OpenBurnBarCore/**, CloudSync, and memory).
        # Reuse the release smoke catalog here instead of running the full
        # 3,000+ XCTest corpus. The full suite remains mandatory in the
        # post-merge/nightly harness.
        run: |
          set -euo pipefail
          source scripts/lib/openburnbar-release-app-test-filters.sh
          OPENBURNBAR_ENABLE_COVERAGE=YES \
          OPENBURNBAR_APP_TEST_ATTEMPTS=2 \
          OPENBURNBAR_APP_TEST_DEFAULT_ALLOWANCE=180 \
          OPENBURNBAR_APP_TEST_MAX_ALLOWANCE=360 \
          OPENBURNBAR_APP_TEST_FILTERS="$(openburnbar_release_app_test_filters_env)" \
          SIGNAL_FFI_BUILD_TARGETS=aarch64-apple-darwin \
          OPENBURNBAR_APP_TEST_DERIVED_DATA_DIR="$GITHUB_WORKSPACE/.derived-data/macos-idle-occlusion-gate" \
          ./scripts/test-openburnbar-app.sh

      - name: Upload app test xcresult bundles (hang/failure diagnostics)
        # When a test exceeds its execution-time allowance, XCTest attaches the
        # hung process's thread backtraces to the attempt's xcresult. Without
        # this upload those bundles die with the runner, leaving a 10-minute
        # hang undiagnosable from the streamed log alone. The harness copies
        # every non-passing attempt's bundle to the diagnostics directory
        # because the derived-data dir (where attempts are written) is deleted
        # by the script's retry refreshes and EXIT trap before this step runs.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: openburnbar-app-test-xcresults
          path: |
            .derived-data/test-openburnbar-app-diagnostics
            .derived-data/test-openburnbar-app-attempts.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Guard against zero-test false greens
        run: ./scripts/ci/check-executed-test-count.sh "$GITHUB_WORKSPACE/.derived-data/OpenBurnBar_TestCoverage.xcresult"

  mobile-build-gate:
    name: Mobile build + unit test
    # Routing (cost + security): post-merge main is trusted, but this lane still
    # uses the isolated hosted macOS pools so MACOS_GATE_POOL / CI_POOL policy
    # stays unchanged. Set repo var MACOS_GATE_POOL=paid to force the capped
    # hosted pool for a billed fast burst.
    runs-on: ${{ vars.MACOS_GATE_POOL == 'fleet' && fromJSON('["self-hosted","macOS","burnbar-swift"]') || vars.MACOS_GATE_POOL == 'paid' && fromJSON('{"group":"burnbar-ci-paid"}') || 'macos-26' }}
    # Compile + unit test execution: Signal FFI + full mobile app-and-tests
    # compile, THEN run the unit-test bundle on a booted simulator.
    # Observing-first: build-for-testing first (fail fast on compile errors),
    # then test-without-building (execute the already-compiled tests).
    # Cold cache + libsignal FFI + full xcodebuild build-for-testing of the
    # mobile app target on a hosted runner can exceed 75 minutes. The test
    # step runs only the three focused QA regression groups (not the full
    # mobile suite) so test execution is fast after the build completes.
    # The 120-min cap covers a cold SPM cache + FFI build + focused tests.
    timeout-minutes: 120
    needs: classify
    if: github.event_name != 'merge_group' && needs.classify.outputs.mobile == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache iOS Signal FFI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiIOS.xcframework
          key: ${{ runner.os }}-signal-ffi-ios-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          # Anchored manifest list instead of '**/Package.resolved': see the app job's
          # SPM cache key comment (post-job hashFiles timeout + key drift).
          key: ${{ runner.os }}-mobile-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-mobile-spm-

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Prepare Signal FFI XCFramework
        run: >-
          SIGNAL_FFI_BUILD_TARGETS="aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
          bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Build mobile app + unit tests for testing
        # Observing-first: build-for-testing compiles the OpenBurnBarMobile
        # app target AND the OpenBurnBarMobileTests bundle — full compile
        # coverage of every mobile-only source file. Fail fast here before
        # booting a simulator. FIREBASE_SOURCE_FIRESTORE guards the resolve
        # path (iOS 27 grpc-binary tripwire, docs/FIREBASE_IOS27_GRPC.md).
        run: |
          set -euo pipefail
          FIREBASE_SOURCE_FIRESTORE=1 xcodebuild build-for-testing \
            -project OpenBurnBar.xcodeproj \
            -scheme OpenBurnBarMobileUnitTests \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath .spm-cache-new \
            -derivedDataPath .derived-data/mobile-pr-gate \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_ENABLE_BATCH_MODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Boot simulator for test execution
        run: |
          set -euo pipefail
          # Resolve a concrete booted simulator destination for
          # test-without-building (build-for-testing used the generic
          # destination; test execution needs a real booted sim).
          SIM_NAME="${OPENBURNBAR_MOBILE_SIMULATOR:-iPhone 17 Pro Max}"
          xcrun simctl list devices available | grep -E "$SIM_NAME \(" | head -1 | sed 's/.*(\([0-9A-F-]*\)).*/\1/' > /tmp/mobile_sim_udid.txt || true
          SIM_UDID="$(cat /tmp/mobile_sim_udid.txt)"
          if [ -z "$SIM_UDID" ]; then
            echo "No available '$SIM_NAME' simulator found; creating one."
            SIM_UDID="$(xcrun simctl create "CI-Mobile-Test" "iPhone 17 Pro Max" 2>/dev/null || true)"
          fi
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run unit tests (observing-first)
        # test-without-building executes the already-compiled test bundle
        # against the booted simulator. This is the merge-blocking signal
        # that was missing: a compile-only gate lets logic regressions
        # merge undetected. Keychain-gated tests XCTSkip on the unsigned
        # CI simulator host (errSecMissingEntitlement) — they count as
        # skips, not failures.
        run: |
          set -euo pipefail
          FIREBASE_SOURCE_FIRESTORE=1 xcodebuild test-without-building \
            -project OpenBurnBar.xcodeproj \
            -scheme OpenBurnBarMobileUnitTests \
            -destination "id=$SIM_UDID" \
            -clonedSourcePackagesDirPath .spm-cache-new \
            -derivedDataPath .derived-data/mobile-pr-gate \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/Mobile_TestResults.xcresult" \
            -only-testing:OpenBurnBarMobileTests/AssistantPendingThreadIsolationTests \
            -only-testing:OpenBurnBarMobileTests/OpenBurnBarCoreTypeIdentityTests \
            -only-testing:OpenBurnBarMobileTests/HermesServiceToolUseLoopTests

      - name: Guard against zero-test false greens
        run: ./scripts/ci/check-executed-test-count.sh "$RUNNER_TEMP/Mobile_TestResults.xcresult"

  app-pr-gate:
    name: App build + test (AgentLens)
    needs:
      - classify
      - app-build-test
      - mobile-build-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name != 'merge_group'
    steps:
      - name: Require every Rust and Swift prerequisite job
        env:
          AGENTLENS_RESULT: ${{ needs.app-build-test.result }}
          MOBILE_RESULT: ${{ needs.mobile-build-gate.result }}
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          MACOS_REQUIRED: ${{ needs.classify.outputs.macos }}
          MOBILE_REQUIRED: ${{ needs.classify.outputs.mobile }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFIER_RESULT" == "success" ]] || { echo "::error::Impact classifier failed."; exit 1; }
          require_or_skip() {
            local required="$1" result="$2" lane="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::$lane was required but ended $result."; exit 1
            fi
            if [[ "$required" == "false" && "$result" != "skipped" ]]; then
              echo "::error::$lane was not selected but ended $result."; exit 1
            fi
          }
          require_or_skip "$MACOS_REQUIRED" "$AGENTLENS_RESULT" macOS
          require_or_skip "$MOBILE_REQUIRED" "$MOBILE_RESULT" mobile
