name: Deploy Production (Hosting)

# Deploys Firebase Hosting for the marketing site (burnbar.ai) and the console
# (app.burnbar.ai). Cloud Functions deploy separately in deploy-production.yml.
# The production credentialed lane never checks out the repo and never runs
# repository-controlled build, verify, npm lifecycle, or Firebase predeploy code.

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "website/**"
      - "apps/console/**"
      - "firebase.json"
      - ".firebaserc"
      - "scripts/ci/deploy-firebase-hosting-rest.mjs"
      - "scripts/ci/write-firebase-hosting-ci-config.mjs"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate immutable hosting artifacts only"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  build-hosting-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
      release_tag: ${{ steps.ref.outputs.release_tag }}
      stable_release: ${{ steps.ref.outputs.stable_release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hosting deploy ref
        id: ref
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          release_tag=""
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            commit="$GITHUB_SHA"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            git fetch --force --tags origin "+$GITHUB_REF:$GITHUB_REF"
            commit="$(git rev-parse "$GITHUB_REF^{commit}")"
            if [[ "$GITHUB_SHA" != "$commit" ]]; then
              echo "::error::Hosting release tag and workflow source do not resolve to the same commit."
              exit 1
            fi
          else
            echo "::error::Hosting deploys must run from main or an exact stable semantic v* tag, not ${GITHUB_REF}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Hosting deploy commit ${commit} is not reachable from origin/main."
            exit 1
          fi
          stable_release=false
          if [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            stable_release=true
          fi
          {
            echo "commit=$commit"
            echo "release_tag=$release_tag"
            echo "stable_release=$stable_release"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 24

      - name: Install hosting dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix apps/console

      - name: Resolve signed public domain-core profile
        run: |
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --format github-env-web >> "$GITHUB_ENV"
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --format json --output apps/console/public/domain-core-build-profile.json

      - name: Embed exact console deployment identity
        env:
          RELEASE_COMMIT: ${{ steps.ref.outputs.commit }}
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          args=(
            --consumer console
            --commit "$RELEASE_COMMIT"
            --output apps/console/public/domain-core-deployment-identity.json
          )
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          node scripts/ci/create-domain-core-deployment-identity.mjs "${args[@]}"

      - name: Trust copy drift gates (block deploy)
        run: |
          node website/scripts/generate-crypto-claims.mjs --check
          git ls-files --error-unmatch website/src/data/trust.generated.ts
          node packages/data-domains/codegen.mjs
          git diff --exit-code -- website/src/data/trust.generated.ts \
            || { echo "::error::website/src/data/trust.generated.ts is stale — refusing to deploy drifted trust copy."; exit 1; }

      - name: Build immutable hosting outputs
        env:
          PUBLIC_SOURCE_COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          npm run verify --prefix website
          npm run build --prefix apps/console

      - name: Stage hosting deploy artifact
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/hosting-artifact
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT/website" "$ARTIFACT_ROOT/apps/console" "$ARTIFACT_ROOT/scripts/ci"

          cp -a website/dist "$ARTIFACT_ROOT/website/dist"
          cp -a apps/console/out "$ARTIFACT_ROOT/apps/console/out"
          cp .firebaserc "$ARTIFACT_ROOT/.firebaserc"
          cp scripts/ci/deploy-firebase-hosting-rest.mjs "$ARTIFACT_ROOT/scripts/ci/"

          node scripts/ci/verify-domain-core-build-profile-artifact.mjs \
            --profile public-production \
            --console-dir "$ARTIFACT_ROOT/apps/console/out"

          node scripts/ci/write-firebase-hosting-ci-config.mjs \
            --mode hosting \
            --output "$ARTIFACT_ROOT/firebase-hosting.ci.json" \
            --manifest "$ARTIFACT_ROOT/firebase-hosting-public-dirs.json" \
            --check

          (
            cd "$ARTIFACT_ROOT"
            find . \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q . \
              && { echo "::error::Hosting artifact contains a symlink or special file."; exit 1; }
            find . -type f -links +1 -print -quit | grep -q . \
              && { echo "::error::Hosting artifact contains a hardlinked file."; exit 1; }
            find . \( -path "*/node_modules/*" -o -name ".env" -o -name ".env.*" -o -iname "*credential*" \) -print -quit | grep -q . \
              && { echo "::error::Hosting artifact contains forbidden credential/env/node_modules material."; exit 1; }
            sums_tmp="$(mktemp)"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$sums_tmp"
            mv "$sums_tmp" SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload immutable hosting artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: hosting-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/hosting-artifact
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "dry_run=true — built, stripped, hashed, and uploaded hosting artifacts; skipped production deploy"

  deploy-hosting:
    needs: build-hosting-artifacts
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable hosting artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          name: hosting-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/hosting-artifact

      - name: Verify hosting artifact and CI config
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/hosting-artifact
          FIREBASE_HOSTING_CI_CONFIG: ${{ runner.temp }}/hosting-artifact/firebase-hosting.ci.json
        run: |
          set -euo pipefail
          cd "$ARTIFACT_ROOT"
          find . \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q . \
            && { echo "::error::Hosting artifact contains a symlink or special file."; exit 1; }
          find . -type f -links +1 -print -quit | grep -q . \
            && { echo "::error::Hosting artifact contains a hardlinked file."; exit 1; }
          find . \( -path "*/node_modules/*" -o -name ".env" -o -name ".env.*" -o -iname "*credential*" \) -print -quit | grep -q . \
            && { echo "::error::Hosting artifact contains forbidden credential/env/node_modules material."; exit 1; }
          sha256sum -c SHA256SUMS
          test -d website/dist
          test -d apps/console/out
          test -f "$FIREBASE_HOSTING_CI_CONFIG"
          python3 - "$FIREBASE_HOSTING_CI_CONFIG" <<'PY'
          import json
          import sys
          from pathlib import Path

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "predeploy":
                          raise SystemExit("::error::firebase-hosting.ci.json contains predeploy")
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if set(config.keys()) != {"hosting"}:
              raise SystemExit("::error::firebase-hosting.ci.json must contain only hosting")
          targets = {entry.get("target"): entry.get("public") for entry in config["hosting"]}
          expected = {"marketing": "website/dist", "console": "apps/console/out"}
          if targets != expected:
              raise SystemExit(f"::error::unexpected hosting public dirs: {targets!r}")
          walk(config)
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Authenticate to Google Cloud (hosting-only WIF/OIDC)
        id: hosting_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_HOSTING_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Deploy Hosting (marketing + console)
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/hosting-artifact
          FIREBASE_HOSTING_CI_CONFIG: ${{ runner.temp }}/hosting-artifact/firebase-hosting.ci.json
          FIREBASE_HOSTING_REST_ACCESS_TOKEN: ${{ steps.hosting_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Production hosting deploy requires workload identity federation."
            exit 1
          fi
          if [[ -z "${FIREBASE_HOSTING_REST_ACCESS_TOKEN:-}" ]]; then
            echo "::error::No Google access token from WIF/OIDC auth. Production hosting deploy requires token_format: access_token for the Hosting REST API."
            exit 1
          fi
          if [[ ! -f "$ARTIFACT_ROOT/scripts/ci/deploy-firebase-hosting-rest.mjs" ]]; then
            echo "::error::Hosting REST deployer is missing from the immutable artifact root."
            exit 1
          fi
          if [[ ! -f "$FIREBASE_HOSTING_CI_CONFIG" ]]; then
            echo "::error::Firebase Hosting CI config is missing from the immutable artifact root."
            exit 1
          fi
          cd "$ARTIFACT_ROOT"
          node "$ARTIFACT_ROOT/scripts/ci/deploy-firebase-hosting-rest.mjs" \
            --project burnbar \
            --config "$FIREBASE_HOSTING_CI_CONFIG" \
            --firebaserc "$ARTIFACT_ROOT/.firebaserc" \
            --message "GitHub Actions ${GITHUB_SHA}"

  hosting-smoke-result:
    needs: [build-hosting-artifacts, deploy-hosting]
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Fail when deploy job did not succeed
        if: ${{ needs.deploy-hosting.result != 'success' }}
        run: |
          echo "::error::deploy-hosting result was ${{ needs.deploy-hosting.result }}"
          exit 1

      - name: Post-deploy hosting smoke
        env:
          HOSTING_SMOKE_EXPECTED_COMMIT: ${{ needs.build-hosting-artifacts.outputs.commit }}
          HOSTING_SMOKE_EXPECTED_TAG: ${{ needs.build-hosting-artifacts.outputs.release_tag }}
          CONSOLE_DEPLOY_HEALTH_JSON: ${{ needs.build-hosting-artifacts.outputs.stable_release == 'true' && 'console-deploy-health.json' || '' }}
          # The signed macOS update feed is produced by release.yml, which
          # fail-closes on its own freshly published feed (verify-live-update-feed
          # job). Hosting deploys still monitor the live feed continuously:
          # until the first release publishes the assets, a 404 is annotated as
          # a warning instead of failing this deploy. Set the repo variable
          # OPENBURNBAR_REQUIRE_DOWNLOAD_FEED=1 once the first release exists
          # to enforce fail-closed here too.
          OPENBURNBAR_REQUIRE_DOWNLOAD_FEED: ${{ vars.OPENBURNBAR_REQUIRE_DOWNLOAD_FEED || 'warn' }}
        run: bash scripts/ci/hosting-smoke.sh

      - name: Upload exact console deploy health evidence
        if: ${{ needs.build-hosting-artifacts.outputs.stable_release == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: console-deploy-health-${{ needs.build-hosting-artifacts.outputs.release_tag }}
          path: console-deploy-health.json
          if-no-files-found: error
          retention-days: 7

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Hosting deploy"
            echo "- Targets: marketing (burnbar.ai / burnbar.web.app), console (app.burnbar.ai / burnbar-console.web.app)"
            echo "- Project: burnbar"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Artifact SHA: ${{ github.sha }}"
            echo ""
            echo "### Rollback"
            echo "- Firebase Console -> Hosting -> select the site -> Release history -> Rollback, or:"
            echo "  \`firebase hosting:rollback --project burnbar --site burnbar\`"
            echo "  \`firebase hosting:rollback --project burnbar --site burnbar-console\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record hosting deploy failure (per-lane dedupe; comment, never silent-skip)
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-hosting
          title-prefix: Hosting deploy smoke failed
          summary: >-
            The Firebase Hosting deploy or post-deploy smoke failed. This blocks
            launch posture until burnbar.ai and app.burnbar.ai return HTTP 200
            with expected content and CSP headers.

      - name: Close resolved hosting deploy failure issue
        if: success() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-hosting
          title-prefix: Hosting deploy smoke failed

  dispatch-domain-core-console-evidence:
    needs: [build-hosting-artifacts, deploy-hosting, hosting-smoke-result]
    if: >-
      ${{ needs.build-hosting-artifacts.result == 'success'
          && needs.deploy-hosting.result == 'success'
          && needs.hosting-smoke-result.result == 'success'
          && needs.build-hosting-artifacts.outputs.stable_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch tag-bound Console evidence publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-hosting-artifacts.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run domain-core-console-release-evidence.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field deploy_run_id="$GITHUB_RUN_ID"
