name: Deploy Production (Hosting)

# Deploys Firebase Hosting for the marketing site (burnbar.ai) and the console
# (app.burnbar.ai). Cloud Functions deploy separately in deploy-production.yml;
# this workflow intentionally only touches `--only hosting`.
#
# Auth mirrors deploy-production.yml: prefer GCP_SA_KEY (service account) via
# google-github-actions/auth, fall back to GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, then
# to the legacy FIREBASE_TOKEN. At least one must be configured as a repo secret.

permissions:
  contents: read
  id-token: write
  issues: write

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "apps/console/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (no firebase deploy)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Node 24: satisfies the website's engines (>=22.12) and Next 15 (console).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Install deps for both sites so the firebase.json predeploy hooks
      # (`npm --prefix website run verify`, `npm --prefix apps/console run build`)
      # can validate and build during `firebase deploy`.
      - name: Install hosting dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix apps/console

      # Defense in depth for the public trust copy: even a bad merge cannot
      # deploy drifted claims. These mirror the fast-feedback gates — the
      # crypto-claims `--check` fails on stale/hand-edited/deleted copy, and
      # the trust.generated.ts regenerate+diff catches registry drift.
      - name: Trust copy drift gates (block deploy)
        run: |
          node website/scripts/generate-crypto-claims.mjs --check
          git ls-files --error-unmatch website/src/data/trust.generated.ts
          node packages/data-domains/codegen.mjs
          git diff --exit-code -- website/src/data/trust.generated.ts \
            || { echo "::error::website/src/data/trust.generated.ts is stale — refusing to deploy drifted trust copy."; exit 1; }

      - name: Authenticate to Google Cloud (service account)
        if: ${{ github.event.inputs.dry_run != 'true' && env.HAS_GCP_SA_KEY == 'true' }}
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (legacy Play service account)
        if: ${{ github.event.inputs.dry_run != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == 'true' }}
        uses: google-github-actions/auth@v2 # v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      # `--only hosting` deploys every configured hosting target (marketing +
      # console). The per-target build runs via the firebase.json predeploy hook.
      - name: Deploy Hosting (marketing + console)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          firebase_args=(deploy --only hosting --project burnbar --non-interactive)
          if [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "Using legacy FIREBASE_TOKEN authentication. Prefer GCP_SA_KEY or workload credentials."
            firebase_args+=(--token "$FIREBASE_TOKEN")
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "Using Google application credentials from google-github-actions/auth."
          else
            echo "::error::No Firebase deploy auth configured. Set GCP_SA_KEY (preferred), GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, or legacy FIREBASE_TOKEN."
            exit 1
          fi
          npx firebase-tools "${firebase_args[@]}"

      - name: Post-deploy hosting smoke
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          # The signed macOS update feed is produced by release.yml, which
          # fail-closes on its own freshly published feed (verify-live-update-feed
          # job). Hosting deploys still monitor the live feed continuously:
          # until the first release publishes the assets, a 404 is annotated as
          # a warning instead of failing this deploy. Set the repo variable
          # OPENBURNBAR_REQUIRE_DOWNLOAD_FEED=1 once the first release exists
          # to enforce fail-closed here too.
          OPENBURNBAR_REQUIRE_DOWNLOAD_FEED: ${{ vars.OPENBURNBAR_REQUIRE_DOWNLOAD_FEED || 'warn' }}
        run: bash scripts/ci/hosting-smoke.sh

      - name: Dry-run skip deploy
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          npm run verify --prefix website
          npm run build --prefix apps/console
          echo "dry_run=true — verified marketing, built console, skipped firebase deploy"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Hosting deploy"
            echo "- Targets: marketing (burnbar.ai / burnbar.web.app), console (app.burnbar.ai / burnbar-console.web.app)"
            echo "- Project: burnbar"
            echo "- Trigger: ${{ github.event_name }}"
            echo ""
            echo "### Rollback"
            echo "- Firebase Console → Hosting → select the site → Release history → Rollback, or:"
            echo "  \`firebase hosting:rollback --project burnbar\` (per site)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open hosting deploy failure issue
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = `Hosting deploy smoke failed (${context.runId})`;
            const body = [
              'The Firebase Hosting deploy or post-deploy smoke failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Ref: ${context.ref}`,
              '',
              'This blocks launch posture until burnbar.ai and app.burnbar.ai return HTTP 200 with expected content and CSP headers.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'P0 - Critical,area: infra',
              per_page: 20,
            });
            if (!existing.data.some((issue) => issue.title.startsWith('Hosting deploy smoke failed'))) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['P0 - Critical', 'area: infra'],
              });
            }
