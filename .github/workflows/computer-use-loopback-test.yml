name: computer-use-loopback-test

concurrency:
  group: computer-use-loopback-test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  # Only pull_request runs share a group and get cancelled. merge_group runs are
  # the merge-queue's own proof and `push` runs are the per-commit post-merge
  # record, so both get a unique per-run group that can never collide: a shared
  # group evicts a *pending* run even with cancel-in-progress false, because
  # GitHub keeps at most one queued run per group. Same pattern and reasoning as
  # `.github/workflows/security-pr.yml`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "OpenBurnBarCore/Sources/OpenBurnBarComputerUseCore/**"
      - "OpenBurnBarCore/Tests/OpenBurnBarComputerUseCoreTests/**"
      - "OpenBurnBarDaemon/Sources/OpenBurnBarDaemon/ComputerUse/**"
      - "OpenBurnBarDaemon/Resources/PlaywrightBridge/**"
      - ".github/workflows/computer-use-loopback-test.yml"
      - "scripts/install-playwright.sh"
      - "scripts/test-openburnbar-swift.sh"
      - "scripts/test-computer-use-loopback.sh"
      - "scripts/test-computer-use-browser-scenarios.mjs"
      - "scripts/lib/prepare-signal-ffi-xcframework.sh"
      - "scripts/build-signal-ffi-xcframework.sh"
  merge_group:
    branches: [main]
    types: [checks_requested]
  # Post-merge re-verification: merges land via direct admin merge (no merge
  # queue), so the merge_group trigger never fires — without this, privileged
  # computer-use changes reached main with no loopback re-run (diligence
  # 2026-06-11: "the post-merge gate never runs post-merge").
  push:
    branches: [main]
    paths:
      - "OpenBurnBarCore/Sources/OpenBurnBarComputerUseCore/**"
      - "OpenBurnBarCore/Tests/OpenBurnBarComputerUseCoreTests/**"
      - "OpenBurnBarDaemon/Sources/OpenBurnBarDaemon/ComputerUse/**"
      - "OpenBurnBarDaemon/Resources/PlaywrightBridge/**"
      - ".github/workflows/computer-use-loopback-test.yml"
  workflow_dispatch:

jobs:
  swiftpm-tests:
    name: SwiftPM — OpenBurnBarComputerUseCoreTests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: recursive
      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache macOS Signal FFI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}
      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)
      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain
      - name: Prepare Signal FFI XCFramework
        run: >-
          SIGNAL_FFI_BUILD_TARGETS=aarch64-apple-darwin
          bash scripts/lib/prepare-signal-ffi-xcframework.sh
      - name: Build + test
        run: OPENBURNBAR_CORE_SWIFT_FILTER='OpenBurnBarComputerUseCoreTests/' OPENBURNBAR_SKIP_DAEMON_SWIFT_TESTS=1 ./scripts/test-openburnbar-swift.sh
      - name: Build daemon
        run: |
          cd OpenBurnBarDaemon
          swift build --target OpenBurnBarDaemon

  loopback-smoke:
    name: Playwright bridge — loopback smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
      - name: Install Playwright (pinned)
        run: bash scripts/install-playwright.sh
      - name: Smoke
        env:
          OPENBURNBAR_PLAYWRIGHT_BRIDGE: ${{ github.workspace }}/OpenBurnBarDaemon/Resources/PlaywrightBridge/openburnbar-playwright-bridge.js
        run: bash scripts/test-computer-use-loopback.sh
      - name: Browser scenarios
        env:
          OPENBURNBAR_PLAYWRIGHT_BRIDGE: ${{ github.workspace }}/OpenBurnBarDaemon/Resources/PlaywrightBridge/openburnbar-playwright-bridge.js
        run: node scripts/test-computer-use-browser-scenarios.mjs --runs 5
