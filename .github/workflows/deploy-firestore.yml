name: Deploy Firestore Rules and Indexes

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore.yml"
      - "scripts/ci/prepare-firebase-tools.sh"
      - "scripts/ci/write-firebase-hosting-ci-config.mjs"
      - "scripts/ci/check-firestore-deploy-drift.mjs"
      - "scripts/ci/check-firestore-deploy-drift.test.mjs"
      - "scripts/ci/check-firestore-rules-size.mjs"
      - "scripts/ci/compact-firestore-rules-inplace.mjs"
      - "scripts/ci/repair-firestore-rules-release.mjs"
      - "scripts/ci/repair-firestore-rules-release.test.mjs"
      - "scripts/ci/propagate-storage-rules-secondary-buckets.mjs"
      - "scripts/ci/firebase-rules-source.mjs"
      - "functions/scripts/test-firestore-rules.mjs"
      - "firestore-rules-tests/package.json"
      - "firestore-rules-tests/package-lock.json"
      - "firestore-rules-tests/storage-rules.test.js"
      - "scripts/ci/test-storage-rules.sh"
  schedule:
    - cron: "15 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests and drift checks without deploying"
        required: false
        type: boolean
        default: false

concurrency:
  # Project-scoped: push and manual production mutations must never overlap.
  group: deploy-firestore-production-burnbar
  cancel-in-progress: false

jobs:
  firestore-rules-and-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT: burnbar
      SHOULD_DEPLOY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run Firestore rules emulator tests
        run: npm --prefix functions run test:firestore-rules

      - name: Run Storage rules emulator tests
        run: bash scripts/ci/test-storage-rules.sh

      - name: Guard Firestore rules size against the release limit
        run: node scripts/ci/check-firestore-rules-size.mjs

      - name: Test Firestore release conflict repair path
        run: node --test scripts/ci/repair-firestore-rules-release.test.mjs

      - name: Test Firestore drift-gate local source resolution
        run: node --test scripts/ci/check-firestore-deploy-drift.test.mjs

      - name: Prepare Firebase deploy config and CLI before auth
        run: |
          node scripts/ci/write-firebase-hosting-ci-config.mjs \
            --mode firestore \
            --output "$RUNNER_TEMP/firebase-firestore.ci.json" \
            --check
          bash scripts/ci/prepare-firebase-tools.sh

      - name: Authenticate to Google Cloud (WIF/OIDC only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Require WIF credentials
        run: |
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Production Firestore deploy/drift checks require workload identity federation."
            exit 1
          fi

      - name: Deploy Firestore rules, indexes, and Storage rules
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        env:
          FIREBASE_FIRESTORE_CI_CONFIG: ${{ runner.temp }}/firebase-firestore.ci.json
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_TOOLS_BIN:-}" || ! -x "$FIREBASE_TOOLS_BIN" ]]; then
            echo "::error::Pinned Firebase CLI path is missing or not executable."
            exit 1
          fi
          if grep -q '"predeploy"' "$FIREBASE_FIRESTORE_CI_CONFIG"; then
            echo "::error::$FIREBASE_FIRESTORE_CI_CONFIG contains predeploy."
            exit 1
          fi
          # Route firestore.rules through firebase-tools' proven release path
          # (the same tool that deployed rules manually on 2026-07-03), not the
          # bespoke REST PATCH that has 400'd on every push since 2026-06-19.
          # Compact the rules in place first so the deployed ruleset stays
          # comment/blank-stripped — preserving the size margin AND keeping the
          # drift check (which compacts the repo side) hash-identical.
          node scripts/ci/compact-firestore-rules-inplace.mjs firestore.rules
          set +e
          deploy_output="$("$FIREBASE_TOOLS_BIN" deploy \
            --only firestore,storage \
            --project "$FIREBASE_PROJECT" \
            --config "$FIREBASE_FIRESTORE_CI_CONFIG" \
            --non-interactive 2>&1)"
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [[ "$deploy_status" -ne 0 ]]; then
            if grep -Fq "firebaserules.googleapis.com/v1/projects/" <<<"$deploy_output" \
              && grep -Fq "409, Requested entity already exists" <<<"$deploy_output"; then
              echo "Firebase Rules release already exists; repairing the existing cloud.firestore release idempotently."
              node scripts/ci/repair-firestore-rules-release.mjs "$FIREBASE_PROJECT"
            else
              echo "::error::Firebase deploy failed outside the narrowly-scoped existing-release conflict repair path."
              exit "$deploy_status"
            fi
          fi

      # firebase deploy --only storage only ships rules to the default bucket.
      # The deleted helper enumerated every firebase.storage/ release; the drift
      # checker still verifies them all. Propagate storage.rules to secondary
      # buckets so the drift gate does not catch them (LB-2).
      - name: Propagate Storage rules to secondary buckets
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        run: node scripts/ci/propagate-storage-rules-secondary-buckets.mjs "$FIREBASE_PROJECT"

      - name: Drift check deployed Firestore rules and indexes
        run: node scripts/ci/check-firestore-deploy-drift.mjs "$FIREBASE_PROJECT"

      - name: Verify live App Check enforcement
        env:
          OPENBURNBAR_FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: |
          set -euo pipefail
          python3 - "$OPENBURNBAR_FIREBASE_PROJECT" <<'PY'
          import json
          import subprocess
          import sys
          import urllib.request

          project = sys.argv[1]
          project_number = subprocess.check_output(
              ["gcloud", "projects", "describe", project, "--format=value(projectNumber)"],
              text=True,
          ).strip()
          token = subprocess.check_output(
              ["gcloud", "auth", "print-access-token"],
              text=True,
          ).strip()
          if not project_number or not token:
              raise SystemExit("App Check verification could not resolve project credentials")

          expected = ("firestore.googleapis.com", "firebasestorage.googleapis.com")
          failures = []
          for service in expected:
              url = (
                  "https://firebaseappcheck.googleapis.com/v1beta/"
                  f"projects/{project_number}/services/{service}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "X-Goog-User-Project": project,
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              mode = payload.get("enforcementMode")
              print(json.dumps({"project": project, "service": service, "enforcementMode": mode}))
              if mode != "ENFORCED":
                  failures.append(f"{service}={mode or '<unset>'}")
          if failures:
              raise SystemExit("App Check is not enforced: " + ", ".join(failures))
          PY

      # run-09 F-RR09-001 / F-RR09-007: prove every declared ttl:true override is
      # actually a LIVE Firestore TTL policy (ephemeral uid+token docs must
      # auto-expire). This is the automated "B3 deploy readback".
      - name: Verify Firestore TTL policies are live
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        run: node scripts/ci/verify-firestore-ttl-state.mjs "$FIREBASE_PROJECT"

      - name: Firestore deploy summary
        if: always()
        run: |
          {
            echo "## Firestore deploy gate"
            echo "- Project: $FIREBASE_PROJECT"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Deploy attempted: $SHOULD_DEPLOY"
            echo "- Scope: firestore.rules, firestore.indexes.json, storage.rules"
          } >> "$GITHUB_STEP_SUMMARY"

  firestore-result:
    needs: firestore-rules-and-indexes
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Fail when Firestore deploy gate did not succeed
        if: ${{ needs.firestore-rules-and-indexes.result != 'success' }}
        run: |
          echo "::error::firestore-rules-and-indexes result was ${{ needs.firestore-rules-and-indexes.result }}"
          exit 1

      - name: Record Firestore deploy failure (per-lane dedupe; comment, never silent-skip)
        if: failure()
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-firestore
          title-prefix: Firestore deploy gate failed
          summary: >-
            The Firestore deploy/drift gate failed. This blocks launch posture
            until firestore.rules, firestore.indexes.json, and storage.rules are
            tested, deployed, and drift-clean.
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

      - name: Close resolved Firestore deploy failure issue
        if: success()
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-firestore
          title-prefix: Firestore deploy gate failed
