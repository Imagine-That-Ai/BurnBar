name: Deploy Firestore Rules and Indexes

permissions:
  contents: read
  id-token: write
  issues: write

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore.yml"
      - "scripts/ci/check-firestore-deploy-drift.mjs"
      - "functions/scripts/test-firestore-rules.mjs"
  schedule:
    - cron: "15 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests and drift checks without deploying"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-firestore-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  firestore-rules-and-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      FIREBASE_PROJECT: burnbar
      SHOULD_DEPLOY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run Firestore rules emulator tests
        run: npm --prefix functions run test:firestore-rules

      - name: Authenticate to Google Cloud (WIF/OIDC only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Require WIF credentials
        run: |
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Production Firestore deploy/drift checks require workload identity federation."
            exit 1
          fi

      - name: Deploy Firestore rules, indexes, and Storage rules
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        run: |
          set -euo pipefail
          # Pinned via functions/package.json devDependencies — a floating npx
          # install would pull whatever the registry serves into a production
          # deploy step (diligence 2026-06-11 LB-3 residual).
          npm ci --prefix functions
          npm --prefix functions exec -- firebase deploy \
            --only firestore:indexes,firestore:rules,storage \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Drift check deployed Firestore rules and indexes
        run: node scripts/ci/check-firestore-deploy-drift.mjs "$FIREBASE_PROJECT"

      # run-09 F-RR09-001 / F-RR09-007: prove every declared ttl:true override is
      # actually a LIVE Firestore TTL policy (ephemeral uid+token docs must
      # auto-expire). This is the automated "B3 deploy readback".
      - name: Verify Firestore TTL policies are live
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        run: node scripts/ci/verify-firestore-ttl-state.mjs "$FIREBASE_PROJECT"

      - name: Firestore deploy summary
        if: always()
        run: |
          {
            echo "## Firestore deploy gate"
            echo "- Project: $FIREBASE_PROJECT"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Deploy attempted: $SHOULD_DEPLOY"
            echo "- Scope: firestore.rules, firestore.indexes.json, storage.rules"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Firestore deploy failure (per-lane dedupe; comment, never silent-skip)
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-firestore
          title-prefix: Firestore deploy gate failed
          summary: >-
            The Firestore deploy/drift gate failed. This blocks launch posture
            until firestore.rules, firestore.indexes.json, and storage.rules are
            tested, deployed, and drift-clean.

      - name: Close resolved Firestore deploy failure issue
        if: success() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-firestore
          title-prefix: Firestore deploy gate failed
