name: Android PR Gate

# Merge-blocking Android floor. The expensive job is path-filtered by a cheap
# detector, while the aggregate status always runs so this workflow can be a
# required check without path-filtered pending/skipped ambiguity.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: android-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    uses: ./.github/workflows/ci-impact.yml

  android-build-test:
    name: Android compile + detekt + unit tests
    needs: classify
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)

      - name: Seed Firebase template
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Compile Android app
        run: cd android && ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run detekt
        run: cd android && ./gradlew :app:detekt --no-daemon --stacktrace

      - name: Run Android unit tests
        run: ./scripts/test-openburnbar-android.sh

      - name: Verify living theme assets
        run: node scripts/verify-living-theme-assets.mjs

      - name: Generate JaCoCo evidence and enforce diff coverage
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ./scripts/diff-coverage-android-self-test.sh
          cd android
          ./gradlew :app:jacocoTestReport :openburnbar-iroh-relay:jacocoTestReport --no-daemon --stacktrace
          cd ..
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/diff-coverage-android.sh origin/main

      - name: Upload Android test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: android-pr-test-coverage
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/jacoco/
          if-no-files-found: error

  android-pr-gate:
    name: Android PR Gate
    needs: [classify, android-build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable Android floor
        env:
          DETECT_RESULT: ${{ needs.classify.result }}
          ANDROID_CHANGED: ${{ needs.classify.outputs.android }}
          ANDROID_RESULT: ${{ needs.android-build-test.result }}
        run: |
          set -euo pipefail
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "::error::Android path detection failed (${DETECT_RESULT})."
            exit 1
          fi
          if [[ "${ANDROID_CHANGED}" == "true" && "${ANDROID_RESULT}" != "success" ]]; then
            echo "::error::Android checks did not succeed (${ANDROID_RESULT})."
            exit 1
          fi
          if [[ "${ANDROID_CHANGED}" == "false" && "${ANDROID_RESULT}" != "skipped" ]]; then
            echo "::error::Android checks should skip for a non-Android change (${ANDROID_RESULT})."
            exit 1
          fi
          echo "Android PR floor is satisfied."
