name: OpenBurnBar Nightly E2E

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          # Availability is fatal; missing AGPL sourceMetadata is a loud
          # warning until the metadata-serving functions deploy reaches prod
          # (blocked on counsel review). Flip to 1 right after that deploy —
          # tracked in docs/runbooks/functions-break-glass.md.
          HEALTH_GATE_REQUIRE_SOURCE_METADATA: "0"
        run: bash scripts/ci/post-deploy-health-gate.sh

  nightly-tests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      INTERNAL_RUN: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Run full test matrix
        uses: ./.github/actions/openburnbar-test-matrix
        with:
          tier: full
          enable_diff_coverage: "false"

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Inject Android Firebase config
        if: env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      # Android instrumented E2E is an HONEST, EXPLICIT GAP, not coverage.
      # The previous ANDROID_E2E_ENABLED-gated steps were dead code: the repo
      # variable never existed, so the smokes skipped silently on every run
      # while reading as coverage (diligence 2026-06-10/11; tech-debt H9). The
      # dead steps and their unset var are deleted here so the gap is visible.
      # The scripts still exist (scripts/e2e/android-iroh-chat.sh,
      # android-mercury-call.sh); arming them needs a validated emulator lane on
      # macOS runners (boot + budget) — tracked as a follow-up, not silently
      # gated behind an unset variable.
      - name: Android instrumented E2E gap (explicit)
        if: env.HAS_ANDROID_SECRETS == 'true'
        run: echo "::warning title=Android instrumented E2E not run::Android instrumented smokes are an explicit gap in this lane — they have never run in CI. Arming them requires a validated macOS emulator lane (see scripts/e2e/android-*.sh)."

  # ── Privileged-socket red-team gate (P0-6) ──────────────────────────────
  # Boots the real virtual-HID bridge as root on a live socket and proves an
  # unsigned probe is rejected by peer authentication. CI binaries are ad-hoc
  # signed, so the probe models the attacker; acceptance = refusal. Guards
  # against the class of regression where socket peer auth ships broken
  # because nothing ever exercised a live socket.
  privileged-socket-redteam:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: true

      - name: Run privileged-socket red-team gate
        run: bash ./scripts/ci/privileged-socket-redteam-ci.sh

  # ── DAST: OWASP ZAP scan against website + functions staging ────────────
  dast-website:
    name: DAST — Website (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Run OWASP ZAP baseline scan against burnbar.ai
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://burnbar.ai'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j'
          # fail_action ON: the curated .github/zap-rules.tsv triages expected
          # findings to IGNORE/WARN so a real new alert fails the lane instead
          # of being silently buried (tech-debt H9). Same rules file the
          # ops-confidence website scan already fails on.
          fail_action: true
          artifact_name: 'zap-website-report'

  dast-functions:
    name: DAST — Functions health endpoints (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Start Firebase Functions Emulator
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
          npx firebase-tools emulators:start --project openburnbar-dev --only functions &
          # Wait for emulator to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:5001 2>/dev/null; do sleep 2; done' || true

      - name: Run OWASP ZAP API scan against health endpoints
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'functions/openapi.yaml'
          format: openapi
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j'
          # fail_action ON with the same curated rules file: expected Firebase
          # Functions findings (CORS, missing CSP on APIs, etc.) are triaged to
          # IGNORE/WARN, so a genuine new API alert fails the lane (tech-debt
          # H9). If the emulator never serves the spec the scan errors loudly
          # rather than passing blind.
          fail_action: true
          artifact_name: 'zap-functions-report'

  commercial-launch-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_ASC_SECRETS: ${{ secrets.APP_STORE_ASC_KEY_ID != '' && secrets.APP_STORE_ASC_ISSUER_ID != '' && secrets.APP_STORE_ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
      - name: Run commercial launch gate (read-only)
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_ASC_KEY_ID: ${{ secrets.APP_STORE_ASC_KEY_ID }}
          APP_STORE_ASC_ISSUER_ID: ${{ secrets.APP_STORE_ASC_ISSUER_ID }}
          APP_STORE_ASC_KEY_P8: ${{ secrets.APP_STORE_ASC_KEY_P8 }}
        run: node scripts/commercial-launch-gate.mjs
      - name: Skip commercial launch gate when ASC secrets are unavailable
        if: env.HAS_ASC_SECRETS != 'true'
        run: |
          echo "::notice::Skipping commercial launch gate because APP_STORE_ASC_* secrets are not configured in GitHub Actions."
          echo "Commercial launch readiness must be proven from an operator environment with App Store Connect credentials."

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, nightly-tests, privileged-socket-redteam, dast-website, dast-functions, commercial-launch-gate]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record nightly failure (per-lane dedupe; comment, never silent-skip)
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: nightly-e2e
          title-prefix: Nightly E2E launch gate failed
          summary: The scheduled OpenBurnBar E2E/DAST/health launch gate failed.
          details: |
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, nightly-tests, privileged-socket-redteam, dast-website, dast-functions, commercial-launch-gate]
    # Close-on-green re-arms the alarm: the shared action dedupes on a per-lane
    # `lane:nightly-e2e` label (not a title prefix shared across workflows), so a
    # STALE open issue from another lane can never suppress this lane's alerts.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved nightly failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: nightly-e2e
          title-prefix: Nightly E2E launch gate failed
