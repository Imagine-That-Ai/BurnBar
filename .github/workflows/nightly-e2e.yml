name: OpenBurnBar Nightly E2E

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 09:43 UTC daily. Keep off the top of the hour to reduce scheduler
    # contention and leave the full harness room to start first.
    - cron: "43 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
          # Availability is fatal; missing AGPL sourceMetadata is a loud
          # warning until the metadata-serving functions deploy reaches prod
          # (blocked on counsel review). Flip to 1 right after that deploy —
          # tracked in docs/runbooks/functions-break-glass.md.
          HEALTH_GATE_REQUIRE_SOURCE_METADATA: "0"
        run: bash scripts/ci/post-deploy-health-gate.sh

  nightly-tests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      INTERNAL_RUN: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Project Code Memory 100k-symbol load proof
        run: python3 scripts/ci/project-code-memory-load-test.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
          OPENBURNBAR_USE_DEBUG_APP_CHECK: "YES"
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Run full test matrix
        uses: ./.github/actions/openburnbar-test-matrix
        with:
          tier: full
          enable_diff_coverage: "false"

  android-e2e:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)

      - name: Inject Android Firebase config
        if: env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Use Android Firebase template when secret is unavailable
        if: env.HAS_ANDROID_SECRETS != 'true'
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Android iroh chat instrumented E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          script: ./scripts/e2e/android-iroh-chat.sh

  commercial-launch-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_ASC_SECRETS: ${{ secrets.APP_STORE_ASC_KEY_ID != '' && secrets.APP_STORE_ASC_ISSUER_ID != '' && secrets.APP_STORE_ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: 22
      - name: Run commercial launch gate (read-only)
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_ASC_KEY_ID: ${{ secrets.APP_STORE_ASC_KEY_ID }}
          APP_STORE_ASC_ISSUER_ID: ${{ secrets.APP_STORE_ASC_ISSUER_ID }}
          APP_STORE_ASC_KEY_P8: ${{ secrets.APP_STORE_ASC_KEY_P8 }}
        run: node scripts/commercial-launch-gate.mjs
      - name: Skip commercial launch gate when ASC secrets are unavailable
        if: env.HAS_ASC_SECRETS != 'true'
        run: |
          echo "::notice::Skipping commercial launch gate because APP_STORE_ASC_* secrets are not configured in GitHub Actions."
          echo "Commercial launch readiness must be proven from an operator environment with App Store Connect credentials."

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, nightly-tests, android-e2e, commercial-launch-gate]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record nightly failure (per-lane dedupe; comment, never silent-skip)
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: nightly-e2e
          title-prefix: Nightly E2E launch gate failed
          summary: The scheduled OpenBurnBar E2E/health launch gate failed.
          details: |
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [prod-health-synthetic, nightly-tests, android-e2e, commercial-launch-gate]
    # Close-on-green re-arms the alarm: the shared action dedupes on a per-lane
    # `lane:nightly-e2e` label (not a title prefix shared across workflows), so a
    # STALE open issue from another lane can never suppress this lane's alerts.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved nightly failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: nightly-e2e
          title-prefix: Nightly E2E launch gate failed
