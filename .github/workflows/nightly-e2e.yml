name: OpenBurnBar Nightly E2E

permissions:
  contents: read

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  prod-health-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Production health synthetic
        env:
          FIREBASE_PROJECT: burnbar
          FUNCTIONS_REGION: us-central1
        run: bash scripts/ci/post-deploy-health-gate.sh

  nightly-tests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      INTERNAL_RUN: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
      HAS_ANDROID_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Inject Firebase config
        if: env.INTERNAL_RUN == 'true'
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Run full test matrix
        uses: ./.github/actions/openburnbar-test-matrix
        with:
          tier: full
          enable_diff_coverage: "false"

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Inject Android Firebase config
        if: env.HAS_ANDROID_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Android instrumented smoke (optional)
        if: env.HAS_ANDROID_SECRETS == 'true' && vars.ANDROID_E2E_ENABLED == 'true'
        run: ./scripts/e2e/android-iroh-chat.sh

      - name: Android Mercury call instrumented smoke (optional)
        if: env.HAS_ANDROID_SECRETS == 'true' && vars.ANDROID_E2E_ENABLED == 'true'
        run: ./scripts/e2e/android-mercury-call.sh

  # ── DAST: OWASP ZAP scan against website + functions staging ────────────
  dast-website:
    name: DAST — Website (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run OWASP ZAP baseline scan against burnbar.ai
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://burnbar.ai'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
          artifact_name: 'zap-website-report'

  dast-functions:
    name: DAST — Functions health endpoints (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Start Firebase Functions Emulator
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
          npx firebase-tools emulators:start --project openburnbar-dev --only functions &
          # Wait for emulator to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:5001 2>/dev/null; do sleep 2; done' || true

      - name: Run OWASP ZAP API scan against health endpoints
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'functions/openapi.yaml'
          format: openapi
          cmd_options: '-a -j'
          fail_action: false
          artifact_name: 'zap-functions-report'

  commercial-launch-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_ASC_SECRETS: ${{ secrets.APP_STORE_ASC_KEY_ID != '' && secrets.APP_STORE_ASC_ISSUER_ID != '' && secrets.APP_STORE_ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run commercial launch gate (read-only)
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_ASC_KEY_ID: ${{ secrets.APP_STORE_ASC_KEY_ID }}
          APP_STORE_ASC_ISSUER_ID: ${{ secrets.APP_STORE_ASC_ISSUER_ID }}
          APP_STORE_ASC_KEY_P8: ${{ secrets.APP_STORE_ASC_KEY_P8 }}
        run: node scripts/commercial-launch-gate.mjs
      - name: Skip commercial launch gate when ASC secrets are unavailable
        if: env.HAS_ASC_SECRETS != 'true'
        run: |
          echo "::notice::Skipping commercial launch gate because APP_STORE_ASC_* secrets are not configured in GitHub Actions."
          echo "Commercial launch readiness must be proven from an operator environment with App Store Connect credentials."
