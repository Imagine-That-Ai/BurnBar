name: Droid Auto Review

# CI-cost hardening (2026-07-31): `synchronize` triggered a full high-effort
# GLM-5.2 review + security review on EVERY commit pushed to every open PR
# (~74 Factory-credit runs/48h). Review once when the PR becomes reviewable;
# re-request by closing/reopening or ready_for_review if a re-review is needed.
# `synchronize` stays in the trigger list only to feed the lightweight
# droid-synchronize job below: governance/burnbar-ci-gate.json requires a
# `droid-review` context on every evaluated head SHA, so a pushed commit with
# no context would stall the umbrella gate until its 270-minute timeout.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  merge_group:
    types: [checks_requested]

# Keep synchronize receipts in a separate concurrency lane so a commit pushed
# right after the PR opens cannot cancel the in-flight full review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'synchronize' && 'sync' || 'review' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACTORY_API_KEY_AVAILABLE: ${{ secrets.FACTORY_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Skip Droid review when Factory API key is unavailable
        if: env.FACTORY_API_KEY_AVAILABLE == 'false'
        run: echo "::notice::FACTORY_API_KEY is unavailable; skipping Droid review."
      - name: Run Droid Auto Review
        id: droid_auto_review
        if: env.FACTORY_API_KEY_AVAILABLE == 'true'
        continue-on-error: true
        uses: Factory-AI/droid-action@49188f4035f23e609bbeee36ec5b22e72212a8e5
        with:
          github_token: ${{ github.token }}
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_model: glm-5.2
          reasoning_effort: high
          security_model: glm-5.2
      - name: Report Droid review service degradation
        if: env.FACTORY_API_KEY_AVAILABLE == 'true' && steps.droid_auto_review.outcome == 'failure'
        run: |
          echo "::warning::Droid Auto Review service returned a failure. The review artifact/comment link is preserved for diagnosis, but PR mergeability is not blocked on Factory API quota or transient SaaS availability."
          {
            echo "### Droid Auto Review degraded"
            echo
            echo "The Droid review action failed after preparing the review run. Treat this as an external review-service degradation, not a product build failure. The workflow uploaded its debug artifact and updated the PR review comment with the job link."
          } >> "$GITHUB_STEP_SUMMARY"

  droid-synchronize:
    name: droid-review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Emit droid-review context for the synchronized head
        run: echo "Droid's advisory review already ran when this PR became reviewable; this lightweight check re-emits the required droid-review context for the new head SHA without spending Factory credits (CI-cost hardening 2026-07-31)."

  droid-merge-group:
    name: droid-review
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reuse PR-head Droid review for merge queue
        run: echo "The merge queue revalidates required code and security gates; Droid's advisory review already ran on the PR head."
