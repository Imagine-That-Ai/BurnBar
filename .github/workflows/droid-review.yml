name: Droid Auto Review

# CI-cost hardening (2026-07-31): `synchronize` triggered a full high-effort
# GLM-5.2 review + security review on EVERY commit pushed to every open PR
# (~74 Factory-credit runs/48h). Review once when the PR becomes reviewable;
# re-request by closing/reopening or ready_for_review if a re-review is needed.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACTORY_API_KEY_AVAILABLE: ${{ secrets.FACTORY_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Skip Droid review when Factory API key is unavailable
        if: env.FACTORY_API_KEY_AVAILABLE == 'false'
        run: echo "::notice::FACTORY_API_KEY is unavailable; skipping Droid review."
      - name: Run Droid Auto Review
        id: droid_auto_review
        if: env.FACTORY_API_KEY_AVAILABLE == 'true'
        continue-on-error: true
        uses: Factory-AI/droid-action@7c7bfea2aa3bb7ea87579402cc1d89dbcf6b13b3
        with:
          github_token: ${{ github.token }}
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_model: glm-5.2
          reasoning_effort: high
          security_model: glm-5.2
      - name: Report Droid review service degradation
        if: env.FACTORY_API_KEY_AVAILABLE == 'true' && steps.droid_auto_review.outcome == 'failure'
        run: |
          echo "::warning::Droid Auto Review service returned a failure. The review artifact/comment link is preserved for diagnosis, but PR mergeability is not blocked on Factory API quota or transient SaaS availability."
          {
            echo "### Droid Auto Review degraded"
            echo
            echo "The Droid review action failed after preparing the review run. Treat this as an external review-service degradation, not a product build failure. The workflow uploaded its debug artifact and updated the PR review comment with the job link."
          } >> "$GITHUB_STEP_SUMMARY"

  droid-merge-group:
    name: droid-review
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reuse PR-head Droid review for merge queue
        run: echo "The merge queue revalidates required code and security gates; Droid's advisory review already ran on the PR head."
