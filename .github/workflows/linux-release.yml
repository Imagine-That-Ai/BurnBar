name: Linux Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Linux release version, without leading v
        required: true
        type: string
      allow_prerelease:
        description: Mark GitHub release as prerelease
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-release:
    name: Build and attest Linux release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Build Linux release artifacts
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM
          -e OPENBURNBAR_CI_OIDC_AVAILABLE=true
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs --version '${{ inputs.version }}'"

      - name: Package install/uninstall/update smoke
        run: >
          docker run --rm
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/smoke-linux-packages.mjs"

      - name: Take ownership of container-generated release evidence
        # The build/smoke containers run as root and create artifacts/ + sidecars/
        # owned by root; the later runner steps (attest, publish) write next to
        # those files, so hand ownership back to the runner user first.
        run: sudo chown -R "$(id -u):$(id -g)" docs/linux-port/evidence/mission-001-release

      - name: Restore SPM resolved files mutated by the Linux build
        # The container Linux build deterministically re-resolves and drops the
        # macOS-only sqlcipher.swift pin, mutating the tracked Package.resolved.
        # Restore it so the strict verifier's clean-worktree check binds to the
        # committed release commit rather than failing on expected Linux drift.
        run: git checkout -- OpenBurnBarCore/Package.resolved OpenBurnBarDaemon/Package.resolved

      - name: Strict Linux release verification
        run: node scripts/linux-port/verify-linux-release.mjs

      - name: Attest Linux release sidecars and packages
        run: |
          set -euo pipefail
          mapfile -t files < <(find docs/linux-port/evidence/mission-001-release -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' -o -name '*.spdx.json' -o -name '*.openvex.json' -o -name '*checksums.txt' -o -name '*provenance-predicate.json' \) | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No Linux release files found for attestation"
            exit 1
          fi
          for file in "${files[@]}"; do
            predicate="${file}.predicate.json"
            if [[ "$file" == *provenance-predicate.json ]]; then
              predicate="$file"
            else
              cp docs/linux-port/evidence/mission-001-release/sidecars/*provenance-predicate.json "$predicate"
            fi
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/linux-release-artifact/v1" \
              --predicate "$predicate" \
              --bundle "${file}.sigstore.json" \
              "$file"
          done

      - name: Verify cosign bundles exist
        run: |
          test -n "$(find docs/linux-port/evidence/mission-001-release -type f -name '*.sigstore.json' -print -quit)"

      - name: Publish Linux GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Linux-specific tag: does not match the macOS/iOS `v*` release trigger,
          # so publishing here never fires the Apple release pipeline.
          tag="linux-v${{ inputs.version }}"
          art=docs/linux-port/evidence/mission-001-release
          cp packaging/linux/openburnbar-linux-ed25519.pub.pem "$art/" 2>/dev/null || true
          mapfile -t assets < <(find "$art/artifacts" "$art/sidecars" "$art" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' \
               -o -name '*.ed25519.sig' -o -name '*.sigstore.json' -o -name '*.spdx.json' \
               -o -name '*.openvex.json' -o -name '*checksums*.txt' -o -name '*provenance-predicate.json' \
               -o -name 'openburnbar-linux-ed25519.pub.pem' \) | sort -u)
          prerelease=""
          [ "${{ inputs.allow_prerelease }}" = "true" ] && prerelease="--prerelease"
          gh release create "$tag" $prerelease \
            --title "OpenBurnBar Linux ${{ inputs.version }} (aarch64)" \
            --notes "First OpenBurnBar Linux desktop release — aarch64/ARM64. Signed AppImage (primary), deb, and rpm plus the daemon binary, with Ed25519 detached signatures and keyless Sigstore/cosign attestation bundles. Verify with packaging/linux/openburnbar-linux-ed25519.pub.pem. Prerelease: this build seeds the auto-update chain." \
            "${assets[@]}"

      - name: Upload Linux release evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-release-evidence
          path: docs/linux-port/evidence/mission-001-release/
          if-no-files-found: error
