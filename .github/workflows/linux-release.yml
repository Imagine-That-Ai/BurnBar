name: Linux Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Linux release version, without leading v (defaults to apps/linux-desktop/package.json)
        required: false
        type: string
      channel:
        description: Signed update channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
          - nightly
      previous_version:
        description: Previous published Linux version for native update/rollback proof; auto-discovers when empty
        required: false
        type: string
  push:
    tags:
      - "linux-v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Linux release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      publish_allowed: ${{ steps.release-version.outputs.publish_allowed }}
      channel: ${{ steps.channel.outputs.value }}
      previous_version: ${{ steps.previous-version.outputs.version }}
      candidate_commit: ${{ steps.domain-core-activation.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify official Linux release history
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          channel="${INPUT_CHANNEL:-prerelease}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then channel="prerelease"; fi
          if [[ "$GITHUB_REF" == refs/tags/linux-v* || "$channel" == "stable" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            printf 'Linux %s candidate may run from branch ref %s at %s.\n' "$channel" "$GITHUB_REF" "$GITHUB_SHA"
          fi
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            test "$(git rev-list -n 1 "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Resolve and validate Linux release version
        id: release-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/linux-port/resolve-linux-release-version.mjs --github-output

      - name: Validate public Linux release configuration
        env:
          OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID }}
          OPENBURNBAR_FIREBASE_API_KEY: ${{ vars.OPENBURNBAR_FIREBASE_API_KEY }}
          OPENBURNBAR_LINUX_APP_CHECK_APP_ID: ${{ vars.OPENBURNBAR_LINUX_APP_CHECK_APP_ID }}
        run: node scripts/linux-port/validate-linux-release-public-config.mjs

      - name: Resolve protected Domain Core candidate C and activation P
        id: domain-core-activation
        run: node scripts/ci/resolve-domain-core-activation.mjs --release-commit "$GITHUB_SHA" --format github-output >> "$GITHUB_OUTPUT"

      - name: Resolve signed update channel
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-prerelease}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then channel="prerelease"; fi
          case "$channel" in stable|prerelease|nightly) ;; *) exit 1 ;; esac
          printf 'value=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Resolve previous Linux release baseline
        id: previous-version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          CURRENT_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          # Select only a published, complete two-architecture release whose
          # Debian payload still contains the package-owned daemon launcher.
          # The first 0.1.0 release is intentionally skipped because it
          # predates that contract; an empty automatic result remains an
          # explicit blocked lifecycle input for prerelease assembly.
          node scripts/linux-port/resolve-linux-previous-release.mjs \
            --current-version "$CURRENT_VERSION" \
            --github-output

  sign-text-expansion-engine:
    name: Sign Linux text-expansion engine manifest
    needs: resolve-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Sign executable-bound IBus manifest in isolation
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p .linux-trust
          node scripts/linux-port/sign-linux-text-expansion-engine.mjs \
            --backend ibus \
            --executable packaging/linux/openburnbar-text-expansion-engine.py \
            --output .linux-trust/text-expansion-engine.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-text-expansion-trust
          path: .linux-trust/text-expansion-engine.json
          include-hidden-files: true
          if-no-files-found: error

  build-architecture:
    name: Build Linux ${{ matrix.architecture }} shard
    needs: [resolve-release, sign-text-expansion-engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            arch_base_image: menci/archlinuxarm@sha256:b5568ae763e3a3315de5a08eda6228be9213da28f5869fc45b983f0add962413
          - architecture: x86_64
            runner: ubuntu-24.04
            arch_base_image: archlinux@sha256:377f594c95c2c4f245e7285ec7f0bc7cd5a36003bd8b869c932b9b0ff2d761a5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      OPENBURNBAR_LINUX_RELEASE_OUT: ${{ github.workspace }}/.linux-shard
      OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID }}
      OPENBURNBAR_FIREBASE_API_KEY: ${{ vars.OPENBURNBAR_FIREBASE_API_KEY }}
      OPENBURNBAR_LINUX_APP_CHECK_APP_ID: ${{ vars.OPENBURNBAR_LINUX_APP_CHECK_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify candidate-to-activation history is complete
        env:
          CANDIDATE_COMMIT: ${{ needs.resolve-release.outputs.candidate_commit }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git cat-file -e "${CANDIDATE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" "$RELEASE_COMMIT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Assert native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          actual="$(node -p "process.arch === 'arm64' ? 'aarch64' : process.arch === 'x64' ? 'x86_64' : process.arch")"
          test "$actual" = "$EXPECTED_ARCHITECTURE"

      - name: Resolve signed Domain Core profile for Linux artifact
        env:
          CANDIDATE_COMMIT: ${{ needs.resolve-release.outputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/ci/resolve-domain-core-build-profile.mjs --profile public-production --expected-candidate-commit "$CANDIDATE_COMMIT" --expected-release-commit "$RELEASE_COMMIT" --format github-env >> "$GITHUB_ENV"

      - name: Download signed text-expansion trust
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          name: linux-text-expansion-trust
          # Keep generated trust input inside the canonical shard output so
          # release checkout cleanliness remains fail-closed.
          path: .linux-shard/text-expansion-trust

      - name: Reclaim hosted-runner build disk
        run: |
          set -euo pipefail
          # Swift/Cargo and the architecture package images are both large;
          # hosted runner language/tool caches are not part of the release
          # subject and must not be allowed to starve the native build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --volumes --force
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          test "$available_kb" -ge 20000000
          df -h /

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Build architecture-pinned Arch package image
        run: >
          docker build
          --build-arg 'BASE_IMAGE=${{ matrix.arch_base_image }}'
          -t openburnbar-arch-package:mission-001
          tools/linux-arch-package

      - name: Prepare unsigned native architecture artifacts
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -e OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID
          -e OPENBURNBAR_FIREBASE_API_KEY
          -e OPENBURNBAR_LINUX_APP_CHECK_APP_ID
          -e OPENBURNBAR_LINUX_TEXT_EXPANSION_SIGNED_MANIFEST=/workspace/.linux-shard/text-expansion-trust/text-expansion-engine.json
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs
          --architecture-shard
          --phase prepare
          --version '${{ needs.resolve-release.outputs.version }}'"

      - name: Dump native artifact preparation logs on failure
        if: failure()
        run: |
          set -euo pipefail
          for log in .linux-shard/logs/daemon-build.log .linux-shard/logs/package-build.log; do
            if [[ -f "$log" ]]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done

      - name: Upload native artifact preparation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native-preparation-diagnostics-${{ matrix.architecture }}
          path: |
            .linux-shard/logs/
            .linux-shard/signing-preparation.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Prepare unsigned Arch installed-manifest request
        run: |
          set -euo pipefail
          container="openburnbar-arch-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          cleanup() {
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" == "true" ]]; then
              docker stop --time 10 "$container" >/dev/null
            fi
            docker rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container" \
            -e OPENBURNBAR_LINUX_APP_CHECK_APP_ID \
            -v "$PWD:/workspace" -w /workspace \
            openburnbar-arch-package:mission-001 \
            node scripts/linux-port/build-signed-arch-package.mjs \
              --phase prepare \
              --version '${{ needs.resolve-release.outputs.version }}' \
              --git-commit "$GITHUB_SHA" \
              --architecture '${{ matrix.architecture }}' \
              --state-dir /workspace/.linux-shard/signing-state
          docker start --attach "$container"

      - name: Materialize exact-commit isolated signer
        env:
          SIGNER_ROOT: ${{ runner.temp }}/openburnbar-linux-signer
        run: |
          set -euo pipefail
          mkdir -p "$SIGNER_ROOT"
          git archive "$GITHUB_SHA" \
            scripts/linux-port/sign-linux-release-requests.mjs \
            scripts/linux-port/lib/linux-installed-manifest.mjs \
            scripts/linux-port/lib/linux-appimage-peer-manifest.mjs \
            scripts/linux-port/lib/stable-file.mjs \
            packaging/linux/openburnbar-linux-ed25519.pub.pem \
            | tar -x -C "$SIGNER_ROOT"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Sign exact native requests in isolated container
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
          SIGNER_ROOT: ${{ runner.temp }}/openburnbar-linux-signer
        run: >
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          -e OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM
          -v "$SIGNER_ROOT:/signer:ro"
          -v "$OPENBURNBAR_LINUX_RELEASE_OUT/signing-state:/state:rw"
          -w /signer
          openburnbar-linux-toolchain:mission-001
          node scripts/linux-port/sign-linux-release-requests.mjs
          --state-dir /state
          --version '${{ needs.resolve-release.outputs.version }}'
          --git-commit "$GITHUB_SHA"
          --architecture '${{ matrix.architecture }}'

      - name: Finalize signed Arch package with makepkg
        run: |
          set -euo pipefail
          container="openburnbar-arch-finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          cleanup() {
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" == "true" ]]; then
              docker stop --time 10 "$container" >/dev/null
            fi
            docker rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container" \
            -e OPENBURNBAR_LINUX_APP_CHECK_APP_ID \
            -v "$PWD:/workspace" -w /workspace \
            openburnbar-arch-package:mission-001 \
            node scripts/linux-port/build-signed-arch-package.mjs \
              --phase finalize \
              --version '${{ needs.resolve-release.outputs.version }}' \
              --git-commit "$GITHUB_SHA" \
              --architecture '${{ matrix.architecture }}' \
              --state-dir /workspace/.linux-shard/signing-state
          docker start --attach "$container"

      - name: Finalize and verify signed native architecture artifacts
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -e OPENBURNBAR_GOOGLE_OAUTH_CLIENT_ID
          -e OPENBURNBAR_FIREBASE_API_KEY
          -e OPENBURNBAR_LINUX_APP_CHECK_APP_ID
          -e OPENBURNBAR_LINUX_TEXT_EXPANSION_SIGNED_MANIFEST=/workspace/.linux-shard/text-expansion-trust/text-expansion-engine.json
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs
          --architecture-shard
          --phase finalize
          --version '${{ needs.resolve-release.outputs.version }}'"

      - name: Native package inspection/install/uninstall smoke
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/smoke-linux-packages.mjs --architecture-shard"

      - name: Arch pacman install ownership and uninstall smoke
        run: |
          set -euo pipefail
          container="openburnbar-arch-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          cleanup() {
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" == "true" ]]; then
              docker stop --time 10 "$container" >/dev/null
            fi
            docker rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container" \
            -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard \
            -v "$PWD:/workspace" -w /workspace \
            openburnbar-arch-package:mission-001 \
            node scripts/linux-port/smoke-arch-package.mjs
          docker start --attach "$container"

      - name: Take ownership of shard output
        run: sudo chown -R "$(id -u):$(id -g)" "$OPENBURNBAR_LINUX_RELEASE_OUT"

      - name: Stage current and previous packages for installed lifecycle proof
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ needs.resolve-release.outputs.previous_version }}
        run: |
          set -euo pipefail
          mkdir -p "$OPENBURNBAR_LINUX_RELEASE_OUT/session" \
            "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/deb" \
            "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch" \
            "$OPENBURNBAR_LINUX_RELEASE_OUT/arch-lifecycle"
          mapfile -t candidates < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT/artifacts" -maxdepth 1 -name '*.deb' -type f)
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$OPENBURNBAR_LINUX_RELEASE_OUT/session/"
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            case "${{ matrix.architecture }}" in
              aarch64) pattern="*_${PREVIOUS_VERSION}_arm64.deb" ;;
              x86_64) pattern="*_${PREVIOUS_VERSION}_amd64.deb" ;;
            esac
            if ! gh release download "linux-v${PREVIOUS_VERSION}" \
              --pattern "$pattern" \
              --dir "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/deb"; then
              echo "No previous Debian package matched ${pattern}; the dpkg lifecycle will remain blocked."
            fi
            arch_pattern="openburnbar-${PREVIOUS_VERSION}-*-${{ matrix.architecture }}.pkg.tar.zst"
            arch_signature_pattern="${arch_pattern}.ed25519.sig"
            arch_manifest_pattern="openburnbar-${PREVIOUS_VERSION}-arch-${{ matrix.architecture }}.installed-manifest.json"
            arch_manifest_signature_pattern="openburnbar-${PREVIOUS_VERSION}-arch-${{ matrix.architecture }}.installed-manifest.ed25519"
            if ! gh release download "linux-v${PREVIOUS_VERSION}" \
              --pattern "$arch_pattern" \
              --pattern "$arch_signature_pattern" \
              --pattern "$arch_manifest_pattern" \
              --pattern "$arch_manifest_signature_pattern" \
              --pattern 'product-proof-closure.json' \
              --pattern 'product-proof-closure.json.ed25519.sig' \
              --dir "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch"; then
              echo "No previous Arch package matched ${arch_pattern}; the pacman lifecycle will remain blocked."
            fi
            mapfile -t downloaded_arch_packages < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch" -maxdepth 1 -name "$arch_pattern" -type f)
            if [[ "${#downloaded_arch_packages[@]}" -eq 1 ]]; then
              test -f "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch/${arch_manifest_pattern}"
              test -f "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch/${arch_manifest_signature_pattern}"
              test -f "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch/product-proof-closure.json"
              test -f "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch/product-proof-closure.json.ed25519.sig"
              test -f "${downloaded_arch_packages[0]}.ed25519.sig"
            fi
          fi

      - name: Verify Arch package update, rollback, and data preservation
        env:
          PREVIOUS_VERSION: ${{ needs.resolve-release.outputs.previous_version }}
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT/artifacts" -maxdepth 1 -name '*.pkg.tar.zst' -type f)
          mapfile -t previous < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT/previous/arch" -maxdepth 1 -name '*.pkg.tar.zst' -type f)
          test "${#candidates[@]}" -eq 1
          test "${#previous[@]}" -le 1
          candidate_relative="${candidates[0]#"$PWD"/}"
          release_output_relative="${OPENBURNBAR_LINUX_RELEASE_OUT#"$PWD"/}"
          command=(node scripts/linux-port/verify-arch-package-update-rollback.mjs \
            --candidate "/workspace/$candidate_relative" \
            --release-public-key /workspace/packaging/linux/openburnbar-linux-ed25519.pub.pem)
          if [[ "${#previous[@]}" -eq 1 ]]; then
            previous_package="${previous[0]}"
            previous_relative="${previous_package#"$PWD"/}"
            command+=(
              --previous "/workspace/$previous_relative"
              --previous-signature "/workspace/$previous_relative.ed25519.sig"
              --previous-installed-manifest "/workspace/$release_output_relative/previous/arch/openburnbar-${PREVIOUS_VERSION}-arch-${{ matrix.architecture }}.installed-manifest.json"
              --previous-installed-manifest-signature "/workspace/$release_output_relative/previous/arch/openburnbar-${PREVIOUS_VERSION}-arch-${{ matrix.architecture }}.installed-manifest.ed25519"
              --previous-product-proof "/workspace/$release_output_relative/previous/arch/product-proof-closure.json"
              --previous-product-proof-signature "/workspace/$release_output_relative/previous/arch/product-proof-closure.json.ed25519.sig"
              --previous-release-tag "linux-v${PREVIOUS_VERSION}"
            )
          fi
          container="openburnbar-arch-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          cleanup() {
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" == "true" ]]; then
              docker stop --time 10 "$container" >/dev/null
            fi
            docker rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container" \
            -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/.linux-shard/arch-lifecycle,target=/workspace/.linux-shard/arch-lifecycle" \
            -w /workspace \
            openburnbar-arch-package:mission-001 \
            "${command[@]}"
          docker start --attach "$container"

      - name: Run package-owned desktop, daemon, accessibility, tray, and route session
        run: >
          docker run --rm
          -e OB_REPO_ROOT=/workspace
          -e OB_EVIDENCE_OUT=/workspace/.linux-shard/session
          -e OB_REUSE_EXISTING_DEB=1
          --mount "type=bind,source=$PWD,target=/workspace,readonly"
          --mount "type=bind,source=$PWD/.linux-shard/session,target=/workspace/.linux-shard/session"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash scripts/linux-port/linux-desktop-session.sh

      - name: Verify native package update, rollback, and data preservation
        run: >
          docker run --rm
          -e OB_REPO_ROOT=/workspace
          -e OB_EVIDENCE_OUT=/workspace/.linux-shard/session
          --mount "type=bind,source=$PWD,target=/workspace,readonly"
          --mount "type=bind,source=$PWD/.linux-shard/session,target=/workspace/.linux-shard/session"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "OB_CANDIDATE_DEB=\$(find /workspace/.linux-shard/session -maxdepth 1 -name '*.deb' -type f | head -n 1)
          OB_PREVIOUS_DEB=\$(find /workspace/.linux-shard/previous/deb -maxdepth 1 -name '*.deb' -type f | head -n 1)
          bash scripts/linux-port/verify-linux-package-update-rollback.sh"

      - name: Finalize commit-bound architecture session
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$OPENBURNBAR_LINUX_RELEASE_OUT"
          node scripts/linux-port/finalize-linux-architecture-session.mjs

      - name: Reject tracked dependency-resolution drift
        run: git diff --exit-code -- OpenBurnBarCore/Package.resolved OpenBurnBarDaemon/Package.resolved

      - name: Upload architecture shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-shard-${{ matrix.architecture }}
          path: ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/
          include-hidden-files: true
          if-no-files-found: error

  assemble-release:
    name: Assemble and attest Linux release candidate
    needs:
      - resolve-release
      - build-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    # Stable tags remain behind the protected release environment. Feature
    # branch prerelease/nightly candidates need an unprotected environment so
    # exact-head signed evidence can be assembled before promotion.
    environment: ${{ needs.resolve-release.outputs.channel == 'stable' && 'release' || 'release-candidate' }}
    env:
      OPENBURNBAR_LINUX_EVIDENCE_OUT: ${{ github.workspace }}/.linux-evidence
      OPENBURNBAR_LINUX_RELEASE_OUT: ${{ github.workspace }}/.linux-release
      OPENBURNBAR_LINUX_SHARDS_DIR: ${{ github.workspace }}/.linux-shards
      OPENBURNBAR_LINUX_RELEASE_BASE_URL: https://github.com/Imagine-That-Ai/BurnBar/releases/download/${{ needs.resolve-release.outputs.tag }}
      # Cosign defaults to 128 MiB attachments; release AppImages, Arch
      # packages, and the source archive are larger but still hash-bound.
      COSIGN_MAX_ATTACHMENT_SIZE: 1GiB
      OPENBURNBAR_LINUX_COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Isolate generated release output from source cleanliness gates
        run: |
          set -euo pipefail
          exclude_file="$(git rev-parse --git-path info/exclude)"
          printf '%s\n' \
            '/.linux-evidence/' \
            '/.linux-release/' \
            '/.linux-shards/' >> "$exclude_file"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify candidate-to-activation history is complete
        env:
          CANDIDATE_COMMIT: ${{ needs.resolve-release.outputs.candidate_commit }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git cat-file -e "${CANDIDATE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" "$RELEASE_COMMIT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Install Linux evidence contract dependencies
        run: npm ci --prefix scripts/linux-port --ignore-scripts

      - name: Download native architecture shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          pattern: linux-release-shard-*
          path: ${{ env.OPENBURNBAR_LINUX_SHARDS_DIR }}
          merge-multiple: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Assemble signed two-architecture closure and feed
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          args=(
            --candidate
            --version '${{ needs.resolve-release.outputs.version }}'
            --channel '${{ needs.resolve-release.outputs.channel }}'
          )
          if [[ '${{ needs.resolve-release.outputs.channel }}' != 'stable' ]]; then
            args+=(--allow-blocked-lifecycle)
          fi
          node scripts/linux-port/assemble-linux-release.mjs "${args[@]}"

      - name: Pre-attestation Linux release verification
        run: >
          node scripts/linux-port/verify-linux-release.mjs
          --candidate
          --phase pre-attestation
          --version '${{ needs.resolve-release.outputs.version }}'

      - name: Attest Linux release sidecars and packages
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(node scripts/linux-port/list-linux-release-attestation-subjects.mjs)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            predicate="${file}.predicate.json"
            if [[ "$file" == *provenance-predicate.json ]]; then
              predicate="$file"
            else
              cp "$OPENBURNBAR_LINUX_RELEASE_OUT"/sidecars/*provenance-predicate.json "$predicate"
            fi
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/linux-release-artifact/v1" \
              --predicate "$predicate" \
              --bundle "${file}.sigstore.json" \
              "$file"
          done

      - name: Final Linux release verification
        run: >
          node scripts/linux-port/verify-linux-release.mjs
          --candidate
          --phase final
          --version '${{ needs.resolve-release.outputs.version }}'

      - name: Create candidate-bound Domain Core Linux release evidence
        env:
          CANDIDATE_COMMIT: ${{ needs.resolve-release.outputs.candidate_commit }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          closure="$OPENBURNBAR_LINUX_RELEASE_OUT/OpenBurnBar-${VERSION}-linux-release.tar.zst"
          tar --zstd -cf "$closure" -C "$OPENBURNBAR_LINUX_RELEASE_OUT" artifacts sidecars latest-linux.draft.json
          inputs="$RUNNER_TEMP/domain-core-linux-release"
          mkdir -p "$inputs"
          activation="$(node scripts/ci/resolve-domain-core-activation.mjs --release-commit "$RELEASE_COMMIT" --format json)"
          activation_path="$inputs/domain-core-release-activation.json"
          jq '{candidateCommit, activationCommit, coreVersion, abiVersion, sourceSha256, changedPathsSha256}' \
            <<<"$activation" > "$activation_path"
          rollback="$inputs/domain-core-public-production-rollback.json"
          node scripts/ci/resolve-domain-core-build-profile.mjs \
            --profile public-production-rollback \
            --expected-candidate-commit "$CANDIDATE_COMMIT" \
            --expected-release-commit "$RELEASE_COMMIT" \
            --format json \
            --output "$rollback"
          while IFS= read -r encoded; do
            domain="$(jq -r '.domain' <<<"$encoded")"
            bundle="$inputs/domain-core-candidate-bundle.json"
            provenance="$inputs/${domain}-promotion.sigstore.json"
            cp "$(jq -r '.bundlePath' <<<"$encoded")" "$bundle"
            cp "$(jq -r '.provenancePath' <<<"$encoded")" "$provenance"
            predicate="$OPENBURNBAR_LINUX_RELEASE_OUT/sidecars/domain-core-${domain}.predicate.json"
            node scripts/ci/create-domain-core-release-evidence.mjs \
              --consumer linux \
              --domain "$domain" \
              --artifact-kind linux-release-bundle \
              --target linux-x64-arm64 \
              --version "$VERSION" \
              --tag "$TAG" \
              --commit "$RELEASE_COMMIT" \
              --artifact "$closure" \
              --predicate "$predicate" \
              --public-profile-sha256 "$(jq -r '.publicProfileSha256' <<<"$encoded")" \
              --activation "$activation_path" \
              --candidate-bundle "$bundle" \
              --promotion-attestation "$provenance" \
              --protected-signer-run-id "$(jq -r '.signerRunId' <<<"$encoded")" \
              --protected-signer-run-attempt "$(jq -r '.signerRunAttempt' <<<"$encoded")" \
              --rollback-artifact "$rollback"
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/domain-core-release-artifact/v2" \
              --predicate "$predicate" \
              --bundle "${predicate}.sigstore.json" \
              "$closure"
          done < <(jq -c '.domains[]' <<<"$activation")

      - name: Finalize installed-product proof closure
        env:
          TARGET_HEAD: ${{ github.sha }}
        run: node scripts/linux-port/finalize-product-proof-closure.mjs --target-head "$TARGET_HEAD"

      - name: Sign installed-product proof closure
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
        run: |
          node scripts/linux-port/sign-product-proof-closure.mjs \
            --closure "$OPENBURNBAR_LINUX_RELEASE_OUT/product-proof-closure.json" \
            --signature "$OPENBURNBAR_LINUX_RELEASE_OUT/product-proof-closure.json.ed25519.sig"

      - name: Materialize format-specific lifecycle release assets
        run: |
          node scripts/linux-port/materialize-linux-lifecycle-release-assets.mjs \
            --candidate-root "$GITHUB_WORKSPACE" \
            --output-root "$OPENBURNBAR_LINUX_RELEASE_OUT"

      - name: Create GitHub SLSA provenance for Linux packages and checksums
        id: build-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/artifacts/*.AppImage
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/artifacts/*.pkg.tar.zst
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/artifacts/*.deb
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/artifacts/*.rpm
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/artifacts/openburnbar-daemon-*
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/sidecars/OpenBurnBar-${{ needs.resolve-release.outputs.version }}-linux-checksums.txt

      - name: Upload Linux release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-evidence
          path: |
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/
            ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/
            ${{ env.OPENBURNBAR_LINUX_SHARDS_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
