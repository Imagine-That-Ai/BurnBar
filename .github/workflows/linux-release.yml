name: Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - "linux-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-release:
    name: Build and attest Linux release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Resolve tag-bound Linux release
        id: release-binding
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/linux-v* ]]; then
            echo "::error::Select a pre-existing linux-v* tag as the workflow_dispatch ref."
            exit 1
          fi
          git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          node scripts/linux-port/resolve-linux-release-ref.mjs

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Build Linux release artifacts
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
          OPENBURNBAR_RELEASE_TAG: ${{ steps.release-binding.outputs.tag }}
          OPENBURNBAR_RELEASE_REF: ${{ steps.release-binding.outputs.ref }}
          OPENBURNBAR_RELEASE_COMMIT: ${{ steps.release-binding.outputs.commit }}
          OPENBURNBAR_EXPECTED_COSIGN_IDENTITY: ${{ steps.release-binding.outputs.expected_cosign_identity }}
          RELEASE_VERSION: ${{ steps.release-binding.outputs.version }}
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM
          -e ACTIONS_ID_TOKEN_REQUEST_TOKEN
          -e ACTIONS_ID_TOKEN_REQUEST_URL
          -e OPENBURNBAR_RELEASE_TAG
          -e OPENBURNBAR_RELEASE_REF
          -e OPENBURNBAR_RELEASE_COMMIT
          -e OPENBURNBAR_EXPECTED_COSIGN_IDENTITY
          -e RELEASE_VERSION
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs --version \"\$RELEASE_VERSION\""

      - name: Package install/uninstall/update smoke
        run: >
          docker run --rm
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/smoke-linux-packages.mjs"

      - name: Take ownership of container-generated release evidence
        # The build/smoke containers run as root and create artifacts/ + sidecars/
        # owned by root; the later runner steps (attest, publish) write next to
        # those files, so hand ownership back to the runner user first.
        run: sudo chown -R "$(id -u):$(id -g)" docs/linux-port/evidence/mission-001-release

      - name: Restore SPM resolved files mutated by the Linux build
        # The container Linux build deterministically re-resolves and drops the
        # macOS-only sqlcipher.swift pin, mutating the tracked Package.resolved.
        # Restore it so the strict verifier's clean-worktree check binds to the
        # committed release commit rather than failing on expected Linux drift.
        run: git checkout -- OpenBurnBarCore/Package.resolved OpenBurnBarDaemon/Package.resolved

      - name: Strict Linux release verification
        env:
          OPENBURNBAR_RELEASE_TAG: ${{ steps.release-binding.outputs.tag }}
          OPENBURNBAR_RELEASE_REF: ${{ steps.release-binding.outputs.ref }}
          OPENBURNBAR_RELEASE_COMMIT: ${{ steps.release-binding.outputs.commit }}
          OPENBURNBAR_EXPECTED_COSIGN_IDENTITY: ${{ steps.release-binding.outputs.expected_cosign_identity }}
        run: node scripts/linux-port/verify-linux-release.mjs

      - name: Attest Linux release sidecars and packages
        run: |
          set -euo pipefail
          mapfile -t files < <(find docs/linux-port/evidence/mission-001-release -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' -o -name '*.spdx.json' -o -name '*.openvex.json' -o -name '*checksums.txt' -o -name '*provenance-predicate.json' -o -name '*-source-*.tar.gz' -o -name '*-source-*.tar.gz.sha256' \) | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No Linux release files found for attestation"
            exit 1
          fi
          for file in "${files[@]}"; do
            predicate="${file}.predicate.json"
            if [[ "$file" == *provenance-predicate.json ]]; then
              predicate="$file"
            else
              cp docs/linux-port/evidence/mission-001-release/sidecars/*provenance-predicate.json "$predicate"
            fi
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/linux-release-artifact/v1" \
              --predicate "$predicate" \
              --bundle "${file}.sigstore.json" \
              "$file"
          done

      - name: Verify Linux release Sigstore attestations
        env:
          EXPECTED_COSIGN_IDENTITY: ${{ steps.release-binding.outputs.expected_cosign_identity }}
        run: |
          set -euo pipefail
          predicate_type="https://openburnbar.dev/attestations/linux-release-artifact/v1"
          mapfile -t bundles < <(find docs/linux-port/evidence/mission-001-release -type f -name '*.sigstore.json' | sort)
          if [[ "${#bundles[@]}" -eq 0 ]]; then
            echo "::error::No Linux release Sigstore bundles were produced."
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            artifact="${bundle%.sigstore.json}"
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Sigstore bundle has no artifact: $bundle"
              exit 1
            fi
            cosign verify-blob-attestation \
              --bundle "$bundle" \
              --type "$predicate_type" \
              --certificate-identity "$EXPECTED_COSIGN_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact" >/dev/null
          done

      - name: Publish tag-bound Linux GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-binding.outputs.tag }}
          RELEASE_REF: ${{ steps.release-binding.outputs.ref }}
          RELEASE_COMMIT: ${{ steps.release-binding.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release-binding.outputs.version }}
          IS_PRERELEASE: ${{ steps.release-binding.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --force origin "+${RELEASE_REF}:${RELEASE_REF}"
          actual_commit="$(git rev-list -n 1 "${RELEASE_REF}^{commit}")"
          if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::Remote release tag drifted: expected $RELEASE_COMMIT, resolved $actual_commit"
            exit 1
          fi
          art=docs/linux-port/evidence/mission-001-release
          cp packaging/linux/openburnbar-linux-ed25519.pub.pem "$art/" 2>/dev/null || true
          mapfile -t assets < <(find "$art/artifacts" "$art/sidecars" "$art" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' \
               -o -name '*.ed25519.sig' -o -name '*.sigstore.json' -o -name '*.spdx.json' \
               -o -name '*.openvex.json' -o -name '*checksums*.txt' -o -name '*provenance-predicate.json' \
               -o -name '*-source-*.tar.gz' -o -name '*-source-*.tar.gz.sha256' \
               -o -name 'openburnbar-linux-ed25519.pub.pem' \) | sort -u)
          prerelease=""
          [ "$IS_PRERELEASE" = "true" ] && prerelease="--prerelease"
          gh release create "$RELEASE_TAG" $prerelease \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --latest=false \
            --title "OpenBurnBar Linux $RELEASE_VERSION (aarch64)" \
            --notes "OpenBurnBar Linux aarch64/ARM64 release. Signed AppImage (primary), deb, rpm, and daemon binary, plus exact-commit source, Ed25519 detached signatures, and verified keyless Sigstore attestations." \
            "${assets[@]}"

      - name: Upload Linux release evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-release-evidence
          path: docs/linux-port/evidence/mission-001-release/
          if-no-files-found: error
