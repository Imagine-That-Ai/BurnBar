name: Linux Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Linux release version, without leading v
        required: true
        type: string
      channel:
        description: Signed update channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
          - nightly
      allow_prerelease:
        description: Mark GitHub release as prerelease
        required: false
        default: true
        type: boolean
      previous_version:
        description: Previous published Linux version for native update/rollback proof; auto-discovers when empty
        required: false
        type: string
  push:
    tags:
      - "linux-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: linux-repository-release
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Linux release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      publish_allowed: ${{ steps.release-version.outputs.publish_allowed }}
      channel: ${{ steps.channel.outputs.value }}
      previous_version: ${{ steps.previous-version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Resolve and validate Linux release version
        id: release-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/linux-port/resolve-linux-release-version.mjs --github-output

      - name: Resolve signed update channel
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-prerelease}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then channel="prerelease"; fi
          case "$channel" in stable|prerelease|nightly) ;; *) exit 1 ;; esac
          printf 'value=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Resolve previous Linux release baseline
        id: previous-version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          CURRENT_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          previous="${INPUT_PREVIOUS_VERSION:-}"
          if [[ -z "$previous" ]]; then
            previous="$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' \
              | sed -n 's/^linux-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
              | grep -Fvx "$CURRENT_VERSION" | head -n 1 || true)"
          fi
          if [[ -n "$previous" && ! "$previous" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "previous Linux version must be strict X.Y.Z semver" >&2
            exit 1
          fi
          printf 'version=%s\n' "$previous" >> "$GITHUB_OUTPUT"

  build-architecture:
    name: Build Linux ${{ matrix.architecture }} shard
    needs: resolve-release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      OPENBURNBAR_LINUX_RELEASE_OUT: ${{ github.workspace }}/.linux-shard
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Assert native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          actual="$(node -p "process.arch === 'arm64' ? 'aarch64' : process.arch === 'x64' ? 'x86_64' : process.arch")"
          test "$actual" = "$EXPECTED_ARCHITECTURE"

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Build unsigned native architecture inputs
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs
          --architecture-shard
          --prepare-only
          --version '${{ needs.resolve-release.outputs.version }}'"

      - name: Sign installed manifests and build native packages
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
          OPENBURNBAR_LINUX_FIREBASE_APP_ID: ${{ vars.OPENBURNBAR_LINUX_FIREBASE_APP_ID }}
          APP_CHECK_STANDARD_WEB_APP_IDS: ${{ vars.APP_CHECK_STANDARD_WEB_APP_IDS }}
        run: |
          set -euo pipefail
          : "${OPENBURNBAR_LINUX_FIREBASE_APP_ID:?configure the dedicated Linux Firebase app id repository variable}"
          : "${APP_CHECK_STANDARD_WEB_APP_IDS:?configure the standard Web Firebase app id registry repository variable}"
          signing_key="$OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM"
          unset OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM
          printf '%s' "$signing_key" | docker run --rm -i \
            -e OPENBURNBAR_LINUX_FIREBASE_APP_ID \
            -e APP_CHECK_STANDARD_WEB_APP_IDS \
            -v "$PWD:/workspace" \
            -w /workspace \
            openburnbar-linux-toolchain:mission-001 \
            bash -c "git config --global --add safe.directory /workspace </dev/null && \
            node scripts/linux-port/build-native-linux-packages.mjs \
            --private-key-stdin \
            --version '${{ needs.resolve-release.outputs.version }}'"
          unset signing_key

      - name: Finalize native architecture artifacts without signing key
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/build-linux-release.mjs
          --architecture-shard
          --finalize-only
          --version '${{ needs.resolve-release.outputs.version }}'"

      - name: Native package inspection/install/uninstall smoke
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-shard
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "git config --global --add safe.directory /workspace &&
          node scripts/linux-port/smoke-linux-packages.mjs --architecture-shard"

      - name: Take ownership of shard output
        run: sudo chown -R "$(id -u):$(id -g)" "$OPENBURNBAR_LINUX_RELEASE_OUT"

      - name: Stage current and previous packages for installed lifecycle proof
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ needs.resolve-release.outputs.previous_version }}
        run: |
          set -euo pipefail
          mkdir -p "$OPENBURNBAR_LINUX_RELEASE_OUT/session" "$OPENBURNBAR_LINUX_RELEASE_OUT/previous"
          mapfile -t candidates < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT/artifacts" -maxdepth 1 -name '*.deb' -type f)
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$OPENBURNBAR_LINUX_RELEASE_OUT/session/"
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            case "${{ matrix.architecture }}" in
              aarch64) pattern="*_${PREVIOUS_VERSION}_arm64.deb" ;;
              x86_64) pattern="*_${PREVIOUS_VERSION}_amd64.deb" ;;
            esac
            gh release download "linux-v${PREVIOUS_VERSION}" \
              --pattern "$pattern" \
              --dir "$OPENBURNBAR_LINUX_RELEASE_OUT/previous"
          fi

      - name: Run package-owned desktop, daemon, accessibility, tray, and route session
        run: >
          docker run --rm
          -e OB_REPO_ROOT=/workspace
          -e OB_EVIDENCE_OUT=/workspace/.linux-shard/session
          -e OB_REUSE_EXISTING_DEB=1
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash scripts/linux-port/linux-desktop-session.sh

      - name: Verify native package update, rollback, and data preservation
        run: >
          docker run --rm
          -e OB_REPO_ROOT=/workspace
          -e OB_EVIDENCE_OUT=/workspace/.linux-shard/session
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash -c "OB_CANDIDATE_DEB=\$(find /workspace/.linux-shard/session -maxdepth 1 -name '*.deb' -type f | head -n 1)
          OB_PREVIOUS_DEB=\$(find /workspace/.linux-shard/previous -maxdepth 1 -name '*.deb' -type f | head -n 1)
          bash scripts/linux-port/verify-linux-package-update-rollback.sh"

      - name: Finalize commit-bound architecture session
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$OPENBURNBAR_LINUX_RELEASE_OUT"
          node scripts/linux-port/finalize-linux-architecture-session.mjs

      - name: Reject tracked dependency-resolution drift
        run: git diff --exit-code -- OpenBurnBarCore/Package.resolved OpenBurnBarDaemon/Package.resolved

      - name: Upload architecture shard
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-release-shard-${{ matrix.architecture }}
          path: ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/
          if-no-files-found: error

  assemble-release:
    name: Assemble, attest, and publish Linux release
    needs:
      - resolve-release
      - build-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      OPENBURNBAR_LINUX_EVIDENCE_OUT: ${{ github.workspace }}/.linux-evidence
      OPENBURNBAR_LINUX_RELEASE_OUT: ${{ github.workspace }}/.linux-release
      OPENBURNBAR_LINUX_SHARDS_DIR: ${{ github.workspace }}/.linux-shards
      OPENBURNBAR_LINUX_RELEASE_BASE_URL: https://downloads.burnbar.ai/linux/releases/${{ needs.resolve-release.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Download native architecture shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          pattern: linux-release-shard-*
          path: ${{ env.OPENBURNBAR_LINUX_SHARDS_DIR }}
          merge-multiple: false

      - name: Verify product parity at release HEAD
        run: |
          node scripts/linux-port/render-parity-ledger.mjs --check
          node scripts/linux-port/validate-parity-ledger.mjs

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Assemble signed two-architecture closure and feed
        env:
          OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM: ${{ secrets.OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          signing_key="$OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM"
          unset OPENBURNBAR_LINUX_ED25519_PRIVATE_KEY_PEM
          printf '%s' "$signing_key" | \
            node scripts/linux-port/assemble-linux-release.mjs \
            --private-key-stdin \
            --version '${{ needs.resolve-release.outputs.version }}' \
            --channel '${{ needs.resolve-release.outputs.channel }}'
          unset signing_key

      - name: Build repository toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Build signed apt and RPM repositories
        env:
          OPENBURNBAR_LINUX_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          repository_signing_key="$OPENBURNBAR_LINUX_REPOSITORY_GPG_PRIVATE_KEY"
          unset OPENBURNBAR_LINUX_REPOSITORY_GPG_PRIVATE_KEY
          printf '%s' "$repository_signing_key" | docker run --rm -i \
            -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-release \
            -v "$PWD:/workspace" \
            -w /workspace \
            openburnbar-linux-toolchain:mission-001 \
            bash -c "git config --global --add safe.directory /workspace </dev/null && \
            node scripts/linux-port/build-linux-repositories.mjs \
            --private-key-stdin \
            --version '${{ needs.resolve-release.outputs.version }}' \
            --channel '${{ needs.resolve-release.outputs.channel }}'"
          unset repository_signing_key

      - name: Take ownership of repository output
        run: sudo chown -R "$(id -u):$(id -g)" "$OPENBURNBAR_LINUX_RELEASE_OUT/repositories"

      - name: Verify signed apt and RPM repositories
        run: >
          docker run --rm
          -e OPENBURNBAR_LINUX_RELEASE_OUT=/workspace/.linux-release
          -v "$PWD:/workspace"
          -w /workspace
          openburnbar-linux-toolchain:mission-001
          node scripts/linux-port/verify-linux-repositories.mjs
          --version '${{ needs.resolve-release.outputs.version }}'
          --channel '${{ needs.resolve-release.outputs.channel }}'

      - name: Enable cross-architecture repository clients
        # QEMU is required because repository install/remove proof covers both
        # release architectures from the aggregate x86_64 release job.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Verify clean apt and dnf repository lifecycle
        env:
          OPENBURNBAR_LINUX_REPOSITORY_VERSION: ${{ needs.resolve-release.outputs.version }}
          OPENBURNBAR_LINUX_REPOSITORY_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
        run: bash scripts/linux-port/verify-linux-repository-lifecycle.sh

      - name: Bind repository lifecycle into release closure
        run: >
          node scripts/linux-port/finalize-linux-repositories.mjs
          --version '${{ needs.resolve-release.outputs.version }}'
          --channel '${{ needs.resolve-release.outputs.channel }}'

      - name: Pre-attestation Linux release verification
        run: >
          node scripts/linux-port/verify-linux-release.mjs
          --phase pre-attestation
          --version '${{ needs.resolve-release.outputs.version }}'

      - name: Attest Linux release sidecars and packages
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$OPENBURNBAR_LINUX_RELEASE_OUT" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' -o -name '*.spdx.json' -o -name '*.openvex.json' -o -name '*checksums.txt' -o -name '*source-*.tar' -o -name '*parity-attestation.json' -o -name '*provenance-predicate.json' -o -name 'repository-closure.json' -o -name 'repository-lifecycle.json' \) | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            predicate="${file}.predicate.json"
            if [[ "$file" == *provenance-predicate.json ]]; then
              predicate="$file"
            else
              cp "$OPENBURNBAR_LINUX_RELEASE_OUT"/sidecars/*provenance-predicate.json "$predicate"
            fi
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/linux-release-artifact/v1" \
              --predicate "$predicate" \
              --bundle "${file}.sigstore.json" \
              "$file"
          done

      - name: Final Linux release verification
        run: >
          node scripts/linux-port/verify-linux-release.mjs
          --phase final
          --version '${{ needs.resolve-release.outputs.version }}'

      - name: Provision branded Linux repository storage
        if: needs.resolve-release.outputs.publish_allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENBURNBAR_R2_BUCKET: ${{ vars.OPENBURNBAR_R2_BUCKET }}
          OPENBURNBAR_R2_CUSTOM_DOMAIN: downloads.burnbar.ai
          OPENBURNBAR_R2_ZONE_ID: ${{ secrets.OPENBURNBAR_R2_ZONE_ID }}
          OPENBURNBAR_LINUX_REPOSITORY_UPLOAD_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_UPLOAD_TOKEN }}
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
        run: bash scripts/setup-linux-downloads-r2.sh --provision-only

      - name: Publish immutable Linux release and repository snapshot
        if: needs.resolve-release.outputs.publish_allowed == 'true'
        env:
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_UPLOAD_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_UPLOAD_TOKEN }}
        run: bash scripts/upload-linux-downloads-r2.sh

      - name: Verify exact snapshot apt and dnf lifecycle before activation
        if: needs.resolve-release.outputs.publish_allowed == 'true'
        env:
          OPENBURNBAR_LINUX_REPOSITORY_VERSION: ${{ needs.resolve-release.outputs.version }}
          OPENBURNBAR_LINUX_REPOSITORY_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
          OPENBURNBAR_LINUX_REPOSITORY_LIFECYCLE_RECEIPT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/preview-repository-lifecycle.json
        run: |
          set -euo pipefail
          snapshot="$(node -e "const fs=require('node:fs');const crypto=require('node:crypto');process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$OPENBURNBAR_LINUX_RELEASE_OUT/repositories/repository-closure.json")"
          OPENBURNBAR_LINUX_REPOSITORY_PREVIEW_SNAPSHOT="$snapshot" \
            bash scripts/linux-port/verify-linux-repository-lifecycle.sh

      - name: Atomically activate Linux repository snapshot
        id: activate_repository
        if: needs.resolve-release.outputs.publish_allowed == 'true'
        env:
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
        run: >
          node scripts/linux-port/activate-linux-repository.mjs
          --yes
          --channel '${{ needs.resolve-release.outputs.channel }}'
          --reason 'Activate exact release candidate after immutable byte and preview lifecycle verification'
          --output "$OPENBURNBAR_LINUX_RELEASE_OUT/repository-activation.json"

      - name: Deploy branded Linux repository serving routes
        id: deploy_repository_routes
        if: needs.resolve-release.outputs.publish_allowed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENBURNBAR_R2_BUCKET: ${{ vars.OPENBURNBAR_R2_BUCKET }}
          OPENBURNBAR_R2_CUSTOM_DOMAIN: downloads.burnbar.ai
          OPENBURNBAR_R2_ZONE_ID: ${{ secrets.OPENBURNBAR_R2_ZONE_ID }}
        run: bash scripts/setup-linux-downloads-r2.sh --deploy-only

      - name: Verify active public Linux repository bytes
        id: verify_public_repository
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.deploy_repository_routes.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_PUBLIC_REPOSITORY_RECEIPT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/public-repository-verification.json
        run: node scripts/linux-port/verify-linux-public-repository.mjs

      - name: Verify clean public apt and dnf repository lifecycle
        id: verify_public_lifecycle
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.verify_public_repository.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENBURNBAR_LINUX_REPOSITORY_VERSION: ${{ needs.resolve-release.outputs.version }}
          OPENBURNBAR_LINUX_REPOSITORY_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
          OPENBURNBAR_LINUX_REPOSITORY_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_LIFECYCLE_RECEIPT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/public-repository-lifecycle.json
        run: bash scripts/linux-port/verify-linux-repository-lifecycle.sh

      - name: Drill repository rollback and candidate reactivation
        id: drill_repository_rollback
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.verify_public_lifecycle.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_ROLLBACK_RECEIPT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/repository-rollback-drill.json
        run: node scripts/linux-port/drill-linux-repository-rollback.mjs

      - name: Atomically publish signed update feed pointer
        id: publish_feed_pointer
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.drill_repository_rollback.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
        run: bash scripts/publish-linux-update-feed-r2.sh --publish-only

      - name: Deploy branded Linux update feed routes
        id: deploy_feed_routes
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.publish_feed_pointer.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENBURNBAR_R2_BUCKET: ${{ vars.OPENBURNBAR_R2_BUCKET }}
          OPENBURNBAR_R2_CUSTOM_DOMAIN: downloads.burnbar.ai
          OPENBURNBAR_R2_ZONE_ID: ${{ secrets.OPENBURNBAR_R2_ZONE_ID }}
        run: bash scripts/setup-linux-downloads-r2.sh --feed-only

      - name: Verify signed update feed pointer and public bytes
        id: verify_public_feed
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.deploy_feed_routes.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
        run: bash scripts/publish-linux-update-feed-r2.sh --verify-only

      - name: Verify live Linux update feed after publish
        id: verify_live_feed
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.verify_public_feed.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          channel='${{ needs.resolve-release.outputs.channel }}'
          if [[ "$channel" == stable ]]; then
            feed_url='https://downloads.burnbar.ai/latest-linux.json'
          else
            feed_url="https://downloads.burnbar.ai/linux/update/$channel/latest-linux.json"
          fi
          node scripts/linux-port/check-linux-update-feed.mjs --url "$feed_url"

      - name: Preserve and attest repository publication evidence
        id: attest_repository_publication
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.verify_live_feed.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          art="$OPENBURNBAR_LINUX_RELEASE_OUT"
          evidence="$OPENBURNBAR_LINUX_EVIDENCE_OUT"
          predicate="$(find "$art/sidecars" -maxdepth 1 -type f -name '*provenance-predicate.json' -print -quit)"
          test -n "$predicate"
          cp "$art/latest-linux.draft.json" "$art/latest-linux.json"
          cosign attest-blob --yes \
            --type "https://openburnbar.dev/attestations/linux-repository-publication/v1" \
            --predicate "$predicate" \
            --bundle "$art/latest-linux.json.sigstore.json" \
            "$art/latest-linux.json"
          receipts=(
            "$art/repository-upload-manifest.json"
            "$art/repository-upload.json"
            "$art/repository-activation.json"
            "$art/repository-feed-publication.json"
            "$art/repository-feed-verification.json"
            "$evidence/preview-repository-lifecycle.json"
            "$evidence/public-repository-verification.json"
            "$evidence/public-repository-lifecycle.json"
            "$evidence/repository-rollback-drill.json"
          )
          for receipt in "${receipts[@]}"; do
            test -s "$receipt"
            if [[ "$receipt" == "$art/"* ]]; then
              preserved="$receipt"
            else
              preserved="$art/sidecars/$(basename "$receipt")"
              cp "$receipt" "$preserved"
            fi
            cosign attest-blob --yes \
              --type "https://openburnbar.dev/attestations/linux-repository-publication/v1" \
              --predicate "$predicate" \
              --bundle "${preserved}.sigstore.json" \
              "$preserved"
          done

      - name: Publish Linux GitHub release
        id: publish_github_release
        if: >-
          ${{ needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.attest_repository_publication.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          art="$OPENBURNBAR_LINUX_RELEASE_OUT"
          cp packaging/linux/openburnbar-linux-ed25519.pub.pem "$art/"
          OPENBURNBAR_LINUX_REPOSITORY_FEED_VERIFICATION_RECEIPT="$RUNNER_TEMP/pre-github-publication-state.json" \
            bash scripts/publish-linux-update-feed-r2.sh --verify-only
          mapfile -t assets < <(find "$art/artifacts" "$art/sidecars" "$art" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'openburnbar-daemon-*' \
               -o -name '*.ed25519.sig' -o -name '*.asc' -o -name '*.sigstore.json' -o -name '*.spdx.json' \
               -o -name '*.openvex.json' -o -name '*checksums*.txt' -o -name '*source-*.tar' \
               -o -name '*parity-attestation.json' -o -name '*provenance-predicate.json' \
               -o -name 'repository-closure.json' -o -name 'repository-closure.json.asc' \
               -o -name 'repository-lifecycle.json' \
               -o -name 'repository-upload-manifest.json' -o -name 'repository-upload.json' \
               -o -name 'repository-activation.json' -o -name 'repository-feed-publication.json' \
               -o -name 'repository-feed-verification.json' -o -name 'repository-rollback-drill.json' \
               -o -name 'preview-repository-lifecycle.json' -o -name 'public-repository-verification.json' \
               -o -name 'public-repository-lifecycle.json' \
               -o -name 'latest-linux.json' \
               -o -name 'openburnbar-linux-ed25519.pub.pem' \) | sort -u)
          prerelease=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.allow_prerelease }}" = "true" ]]; then
            prerelease="--prerelease"
          fi
          marker="OpenBurnBar-Release-Run: $GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          notes="$RUNNER_TEMP/openburnbar-linux-release-notes.txt"
          printf '%s\n\n%s\n' \
            'OpenBurnBar Linux candidate for aarch64 and x86_64. Artifacts include Ed25519 signatures, Sigstore bundles, source, SBOM, VEX, provenance, parity attestation, and repository publication receipts.' \
            "$marker" >"$notes"
          expected_assets="$RUNNER_TEMP/openburnbar-linux-release-assets.txt"
          node - "$expected_assets" "${assets[@]}" <<'NODE'
          const crypto = require('node:crypto');
          const path = require('node:path');
          const fs = require('node:fs');
          const [output, ...assets] = process.argv.slice(2);
          const records = assets.map((asset) => {
            const bytes = fs.readFileSync(asset);
            return {
              name: path.basename(asset),
              size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex')
            };
          }).sort((left, right) => left.name.localeCompare(right.name));
          const names = records.map((record) => record.name);
          if (new Set(names).size !== names.length) throw new Error('Linux release asset basenames are not unique');
          fs.writeFileSync(output, `${JSON.stringify(records, null, 2)}\n`);
          NODE
          verify_release_assets() {
            local phase="$1"
            local download_dir="$RUNNER_TEMP/openburnbar-linux-release-$phase"
            rm -rf "$download_dir"
            mkdir -p "$download_dir"
            gh release download "$tag" --dir "$download_dir"
            node - "$expected_assets" "$download_dir" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const [expectedPath, downloadDir] = process.argv.slice(2);
          const expected = JSON.parse(fs.readFileSync(expectedPath, 'utf8'));
          const actual = fs.readdirSync(downloadDir, { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => {
              const bytes = fs.readFileSync(path.join(downloadDir, entry.name));
              return {
                name: entry.name,
                size: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex')
              };
            }).sort((left, right) => left.name.localeCompare(right.name));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('GitHub release assets do not match the exact local byte closure');
          }
          NODE
          }
          gh release create "$tag" --draft \
            --title "OpenBurnBar Linux ${{ needs.resolve-release.outputs.version }}" \
            --notes-file "$notes"
          gh release upload "$tag" "${assets[@]}"
          verify_release_assets draft
          gh release edit "$tag" --draft=false $prerelease
          verify_release_assets published
          OPENBURNBAR_LINUX_REPOSITORY_FEED_VERIFICATION_RECEIPT="$RUNNER_TEMP/post-github-publication-state.json" \
            bash scripts/publish-linux-update-feed-r2.sh --verify-only
          published="$RUNNER_TEMP/openburnbar-linux-published-release.json"
          gh release view "$tag" --json isDraft,body,assets >"$published"
          node - "$published" "$expected_assets" "$marker" <<'NODE'
          const fs = require('node:fs');
          const [releasePath, expectedPath, marker] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const expected = JSON.parse(fs.readFileSync(expectedPath, 'utf8')).map((asset) => asset.name).sort();
          const actual = (release.assets ?? []).map((asset) => asset.name).sort();
          if (release.isDraft !== false || !release.body?.includes(marker)
              || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('published GitHub release does not match this run and the exact asset closure');
          }
          NODE

      - name: Remove partial draft GitHub release
        id: cleanup_github_release
        if: >-
          ${{ always() && needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.publish_github_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          marker="OpenBurnBar-Release-Run: $GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          node scripts/linux-port/cleanup-linux-github-release.mjs --tag "$tag" --marker "$marker"

      - name: Compensate failed repository publication
        id: compensate_repository_publication
        if: >-
          ${{ always() && needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.activate_repository.outcome != 'skipped' &&
              (steps.deploy_repository_routes.outcome != 'success' ||
               steps.verify_public_repository.outcome != 'success' ||
               steps.verify_public_lifecycle.outcome != 'success' ||
               steps.drill_repository_rollback.outcome != 'success' ||
               steps.publish_feed_pointer.outcome != 'success' ||
               steps.deploy_feed_routes.outcome != 'success' ||
               steps.verify_public_feed.outcome != 'success' ||
               steps.verify_live_feed.outcome != 'success' ||
               steps.attest_repository_publication.outcome != 'success' ||
               steps.publish_github_release.outcome != 'success') }}
        continue-on-error: true
        env:
          OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN: ${{ secrets.OPENBURNBAR_LINUX_REPOSITORY_ACTIVATION_TOKEN }}
          OPENBURNBAR_R2_PUBLIC_BASE_URL: https://downloads.burnbar.ai
          OPENBURNBAR_LINUX_REPOSITORY_COMPENSATION_RECEIPT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/repository-activation-compensation.json
        run: node scripts/linux-port/compensate-linux-repository-activation.mjs

      - name: Enforce atomic repository publication outcome
        if: >-
          ${{ always() && needs.resolve-release.outputs.publish_allowed == 'true' &&
              steps.activate_repository.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.publish_github_release.outcome }}" == "success" ]]; then
            exit 0
          fi
          if [[ "${{ steps.cleanup_github_release.outcome }}" != "success" ]]; then
            echo "failed Linux publication did not prove its run-owned GitHub release was removed" >&2
            exit 1
          fi
          receipt="$OPENBURNBAR_LINUX_EVIDENCE_OUT/repository-activation-compensation.json"
          node - "$receipt" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.passed !== true || receipt.contained !== true) {
            throw new Error('failed Linux publication was not proven contained');
          }
          NODE
          echo "Linux publication failed after activation and was contained; failing the release transaction." >&2
          exit 1

      - name: Upload Linux release evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-release-evidence
          path: |
            ${{ env.OPENBURNBAR_LINUX_RELEASE_OUT }}/
            ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/
            ${{ env.OPENBURNBAR_LINUX_SHARDS_DIR }}/
          if-no-files-found: error
