name: PR Windows Full Suite

# Full-suite Windows CI gate (WS-A3 of the parity burndown plan).
#
# Replaces the pr-windows-fast.yml skeleton placeholders with REAL dotnet build
# + dotnet test over the full windows/ solution. The app builds to full
# XamlCompiler completion (proven on physical Windows by #1248) and the 4,083+
# C# test fixtures run natively on windows-latest (x64) and windows-11-arm
# (ARM64). This is the gate that makes a Windows regression un-mergeable once
# Alberto flips it to a required status check (WS-A2).
#
# Relationship to the existing lanes:
#   - pr-windows-fast.yml stays as the cheap path-filter detector + skeleton
#     (non-Windows PRs skip; this workflow runs on Windows surface changes +
#     on merge to main).
#   - openburnbar-engine-windows.yml builds the Swift Engine subset on Windows
#     (x64 + ARM64) + the G2 parser-parity harness. That lane is unchanged.
#   - THIS workflow builds the C# WinUI app + all C# test projects and runs the
#     full dotnet test suite — the 4,083+ fixtures that the physical Windows
#     validation proved green (after #1249's 5 fixes).
#
# Architectures: two parallel legs, mirroring openburnbar-engine-windows.yml.
#   • x64  — windows-latest (free, GA). Builds + tests the full solution.
#   • ARM64 — windows-11-arm (free for public repos). Builds + tests natively.
# Every exact candidate's ARM64 result must come from a real windows-11-arm
# runner; it cannot be exercised on the macOS/x64 development host.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      # The full gate builds and executes both Rust cdylibs through the C#
      # native shims, so every source or binding change in either crate reruns
      # the exact x64 + ARM64 loopback proof.
      - "crates/burnbar-remote/**"
      - "crates/openburnbar-iroh/**"
      - "crates/openburnbar-domain-core/**"
      - "scripts/lib/atomic-regular-file.mjs"
      - "scripts/lib/domain-core-release-evidence.mjs"
      - "scripts/ci/canonical-candidate-commit.mjs"
      - "scripts/ci/verify-domain-core-observed-identity.mjs"
      - "scripts/windows-port/allowed-not-executed-full.json"
      - "scripts/windows-port/native-library-staging.mjs"
      - "scripts/windows-port/native-library-staging.test.mjs"
      - "scripts/windows-port/stage-local-rust-cdylib.mjs"
      - "scripts/windows-port/stage-local-rust-cdylib.test.mjs"
      - "scripts/windows-port/verify-local-domain-core-identity.mjs"
      - "scripts/windows-port/verify-local-domain-core-identity.test.mjs"
      - "scripts/windows-port/verify-trx-results.mjs"
      - "scripts/windows-port/verify-trx-results.test.mjs"
      - ".github/workflows/pr-windows-full.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

concurrency:
  group: pr-windows-full-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-windows-full-changes:
    name: Detect Windows full-suite changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # PR checkouts use GitHub's synthetic merge commit. Depth 2 includes
          # that merge commit plus its base/head parents — all this detector
          # needs, matching pr-windows-fast.yml / pr-windows-dist.yml. A full
          # `fetch-depth: 0` clone is unnecessary here and, on large PRs, the
          # full-history checkout overran this job's 3-minute timeout and
          # self-cancelled, spuriously failing the required "PR Windows Full
          # Gate" (a re-run cleared it — phase-one finding).
          fetch-depth: 2

      - name: Determine whether full Windows paths changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA}"
          head="${HEAD_SHA}"

          if git cat-file -e "HEAD^1^{commit}" 2>/dev/null && \
             git cat-file -e "HEAD^2^{commit}" 2>/dev/null; then
            # Synthetic merge commit present (normal PR / merge_group): its two
            # parents ARE base (HEAD^1) and head (HEAD^2), both fetched at
            # depth 2. Diff them directly — the pr-windows-fast.yml house form.
            changed="$(git diff --name-only HEAD^1 HEAD^2)"
          elif git cat-file -e "${base}^{commit}" 2>/dev/null && \
               git cat-file -e "${head}^{commit}" 2>/dev/null; then
            # Fallback: no merge commit, but explicit base/head SHAs resolve.
            # A shallow (depth-2) clone may not reach their common ancestor; if
            # merge-base can't be computed, stay fail-safe and run the suite.
            if merge_base="$(git merge-base "${base}" "${head}" 2>/dev/null)"; then
              changed="$(git diff --name-only "${merge_base}" "${head}")"
            else
              echo "windows=true" >> "$GITHUB_OUTPUT"
              echo "merge-base unresolved at shallow depth for ${EVENT_NAME}; running Windows full suite to stay fail-safe."
              exit 0
            fi
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve merge commit or base/head commits for ${EVENT_NAME}; running Windows full suite to stay fail-safe."
            exit 0
          fi

          echo "Changed files:"
          echo "${changed}"

          if echo "${changed}" | grep -Eq \
            '^(windows/|crates/burnbar-remote/|crates/openburnbar-iroh/|crates/openburnbar-domain-core/|OpenBurnBarCore/Sources/OpenBurnBarKernel/Resources/|AgentLensTests/Fixtures/|scripts/lib/(atomic-regular-file|domain-core-release-evidence)\.mjs|scripts/ci/(canonical-candidate-commit|verify-domain-core-observed-identity)\.mjs|scripts/windows-port/(allowed-not-executed-full\.json|(native-library-staging|stage-local-rust-cdylib)(\.test)?\.mjs|verify-(local-domain-core-identity|trx-results)(\.test)?\.mjs)|\.github/workflows/pr-windows-full\.yml)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Windows full-suite surface changed: running x64 + ARM64 full-suite legs."
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "No Windows full-suite surface changed: skipping expensive Windows legs; aggregate still reports success."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # x64 leg — the full suite on windows-latest.
  # ──────────────────────────────────────────────────────────────────────────
  build-test-x64:
    name: Windows full suite (x64)
    needs: detect-windows-full-changes
    if: needs.detect-windows-full-changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Set up .NET 10 + 8 SDKs. The storage + PAL projects target net10.0; the
      # WinUI app targets net8.0-windows. windows-latest ships both net8 and
      # net10 previews; install the SDK explicitly to pin it.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: "22"

      - name: Resolve canonical candidate commit
        id: candidate
        run: node scripts/ci/canonical-candidate-commit.mjs

      - name: Verify canonical candidate checkout
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Canonical candidate output is missing or malformed."
          }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $env:CANDIDATE_COMMIT) {
            throw "Checked-out commit $checkedOutCommit does not match canonical candidate $env:CANDIDATE_COMMIT."
          }

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.94.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache native Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/openburnbar-domain-core/target
            crates/burnbar-remote/target
            crates/openburnbar-iroh/target
          key: windows-full-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/openburnbar-domain-core/Cargo.lock', 'crates/burnbar-remote/Cargo.lock', 'crates/openburnbar-iroh/Cargo.lock') }}
          restore-keys: |
            windows-full-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Windows solution
        run: |
          if (-not (Test-Path "windows/OpenBurnBar.sln")) {
            throw "windows/OpenBurnBar.sln not found."
          }
          Write-Host "Windows solution present."

      - name: Verify native candidate helpers
        run: |
          node --test `
            scripts/windows-port/native-library-staging.test.mjs `
            scripts/windows-port/stage-local-rust-cdylib.test.mjs `
            scripts/windows-port/verify-local-domain-core-identity.test.mjs `
            scripts/windows-port/verify-trx-results.test.mjs

      # Restore the full solution. This resolves all ProjectReferences + NuGet
      # packages (WindowsAppSDK 1.8, Win2D 1.3, CommunityToolkit, Microsoft.Data.Sqlite,
      # SQLitePCLRaw.bundle_e_sqlcipher, xunit) in one pass.
      - name: Restore (dotnet restore)
        run: dotnet restore windows/OpenBurnBar.sln

      - name: Build exact-candidate native libraries
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup run 1.96.0 cargo build --locked --manifest-path crates/openburnbar-domain-core/Cargo.toml -p openburnbar-domain-ffi --target x86_64-pc-windows-msvc
          rustup run 1.94.0 cargo build --locked --manifest-path crates/burnbar-remote/Cargo.toml -p burnbar-remote-ffi --target x86_64-pc-windows-msvc
          rustup run 1.96.0 cargo build --locked --manifest-path crates/openburnbar-iroh/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Stage exact native libraries
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/openburnbar-domain-core/Cargo.toml --toolchain 1.96.0 --logical-name openburnbar_domain_ffi --target x86_64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/openburnbar_domain_ffi.dll
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/burnbar-remote/Cargo.toml --toolchain 1.94.0 --logical-name burnbar_remote --target x86_64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/burnbar_remote.dll
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/openburnbar-iroh/Cargo.toml --toolchain 1.96.0 --logical-name openburnbar_iroh --target x86_64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/openburnbar_iroh.dll

      # Build the full solution in Debug. The WinUI app builds to full
      # XamlCompiler completion (proven by #1248 on physical Windows). The
      # portable + test projects build as part of the same solution graph.
      - name: Build (dotnet build — full solution, Debug)
        run: dotnet build windows/OpenBurnBar.sln --configuration Debug --no-restore -p:Platform=x64

      # Run the full C# test suite. The 4,083+ fixtures cover: storage (14 DB
      # open/read/FTS5/byte-compat), cloudsync (Firestore gateway, CloudVault,
      # App Check, offline queue), computeruse, particles, pretext, pal/ipc,
      # integrations, dist (hardening + updater feed), quota (4-mechanism value
      # match), presentation (budget, memory, switcher, insights), onboarding,
      # shell, components, theme, signal-interop. xunit collects + reports.
      - name: Test (dotnet test — full suite)
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          OPENBURNBAR_REQUIRE_NATIVE_SHIMS: "1"
          OPENBURNBAR_NATIVE_DIR: ${{ github.workspace }}\crates\openburnbar-domain-core\target\debug
          DOMAIN_CORE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}\crates\openburnbar-domain-core\target\debug\openburnbar_domain_ffi.dll
          DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}\domain-core-observed-identity-x64.json
        run: dotnet test windows/OpenBurnBar.sln --configuration Debug --no-build --logger trx --results-directory TestResults-x64

      - name: Verify loaded domain-core identity
        run: node scripts/windows-port/verify-local-domain-core-identity.mjs --expected-commit ${{ steps.candidate.outputs.candidate_commit }} --observed-identity "${{ runner.temp }}\domain-core-observed-identity-x64.json" --binary "${{ github.workspace }}\crates\openburnbar-domain-core\target\debug\openburnbar_domain_ffi.dll"

      - name: Live Windows Playwright bridge lifecycle
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $browsersPath = Join-Path $PWD ".playwright-browsers"
          $nodeRoot = Join-Path $PWD ".playwright-node"
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsersPath
          npm install --prefix $nodeRoot --no-save --package-lock=false playwright@1.49.1
          node (Join-Path $nodeRoot "node_modules/playwright/cli.js") install chromium

          $env:OPENBURNBAR_BROWSER_CU_INTEGRATION_NODE = (Get-Command node).Source
          $env:OPENBURNBAR_BROWSER_CU_INTEGRATION_BRIDGE = (Resolve-Path "OpenBurnBarDaemon/Resources/PlaywrightBridge/openburnbar-playwright-bridge.js").Path
          $env:OPENBURNBAR_BROWSER_CU_INTEGRATION_NODE_PATH = (Resolve-Path (Join-Path $nodeRoot "node_modules")).Path
          $env:OPENBURNBAR_BROWSER_CU_INTEGRATION_BROWSERS_PATH = (Resolve-Path $browsersPath).Path
          dotnet test windows/tests/computeruse/OpenBurnBar.ComputerUse.Tests.csproj `
            --configuration Debug `
            --no-build `
            --filter "FullyQualifiedName~ProcessDriver_LivePlaywrightBridge_NavigatesEvaluatesAndCloses" `
            --logger trx `
            --results-directory TestResults-x64

      - name: Verify complete x64 test evidence
        run: node scripts/windows-port/verify-trx-results.mjs --results-directory TestResults-x64 --minimum-files 41 --minimum-tests 4084 --maximum-not-executed 2 --allowed-not-executed-file scripts/windows-port/allowed-not-executed-full.json

      # Publish the TRX results so a red fixture is inspectable in the Actions UI.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: windows-full-x64-test-results
          path: TestResults-x64/
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # ARM64 leg — the full suite on the free windows-11-arm runner.
  # Mirrors the x64 leg step-for-step. The native SQLCipher bundle ships
  # win-arm64; WindowsAppSDK 1.8 supports ARM64. The ARM64 leg gives build +
  # test parity with NO hardware (the master plan's G-gates require ARM64).
  #
  # windows-11-arm is GA + free for public repos. Prior hosted runs prove that
  # this lane is executable, but each candidate still needs its own fresh green
  # result. Hosted ARM64 CI is build/test proof, not physical-device proof.
  # ──────────────────────────────────────────────────────────────────────────
  build-test-arm64:
    name: Windows full suite (ARM64)
    needs: detect-windows-full-changes
    if: needs.detect-windows-full-changes.outputs.windows == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: "22"

      - name: Resolve canonical candidate commit
        id: candidate
        run: node scripts/ci/canonical-candidate-commit.mjs

      - name: Verify canonical candidate checkout
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Canonical candidate output is missing or malformed."
          }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $env:CANDIDATE_COMMIT) {
            throw "Checked-out commit $checkedOutCommit does not match canonical candidate $env:CANDIDATE_COMMIT."
          }

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-pc-windows-msvc

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.94.0"
          targets: aarch64-pc-windows-msvc

      - name: Cache native Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/openburnbar-domain-core/target
            crates/burnbar-remote/target
            crates/openburnbar-iroh/target
          key: windows-full-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/openburnbar-domain-core/Cargo.lock', 'crates/burnbar-remote/Cargo.lock', 'crates/openburnbar-iroh/Cargo.lock') }}
          restore-keys: |
            windows-full-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Windows solution
        run: |
          if (-not (Test-Path "windows/OpenBurnBar.sln")) {
            throw "windows/OpenBurnBar.sln not found."
          }
          Write-Host "Windows solution present."

      - name: Verify native candidate helpers
        run: |
          node --test `
            scripts/windows-port/native-library-staging.test.mjs `
            scripts/windows-port/stage-local-rust-cdylib.test.mjs `
            scripts/windows-port/verify-local-domain-core-identity.test.mjs `
            scripts/windows-port/verify-trx-results.test.mjs

      - name: Restore (dotnet restore)
        run: dotnet restore windows/OpenBurnBar.sln

      - name: Build exact-candidate native libraries
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup run 1.96.0 cargo build --locked --manifest-path crates/openburnbar-domain-core/Cargo.toml -p openburnbar-domain-ffi --target aarch64-pc-windows-msvc
          rustup run 1.94.0 cargo build --locked --manifest-path crates/burnbar-remote/Cargo.toml -p burnbar-remote-ffi --target aarch64-pc-windows-msvc
          rustup run 1.96.0 cargo build --locked --manifest-path crates/openburnbar-iroh/Cargo.toml --target aarch64-pc-windows-msvc

      - name: Stage exact native libraries
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/openburnbar-domain-core/Cargo.toml --toolchain 1.96.0 --logical-name openburnbar_domain_ffi --target aarch64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/openburnbar_domain_ffi.dll
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/burnbar-remote/Cargo.toml --toolchain 1.94.0 --logical-name burnbar_remote --target aarch64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/burnbar_remote.dll
          node scripts/windows-port/stage-local-rust-cdylib.mjs --manifest-path crates/openburnbar-iroh/Cargo.toml --toolchain 1.96.0 --logical-name openburnbar_iroh --target aarch64-pc-windows-msvc --destination crates/openburnbar-domain-core/target/debug/openburnbar_iroh.dll

      - name: Build (dotnet build — full solution, Debug)
        run: dotnet build windows/OpenBurnBar.sln --configuration Debug --no-restore -p:Platform=ARM64

      - name: Test (dotnet test — full suite)
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
          OPENBURNBAR_REQUIRE_NATIVE_SHIMS: "1"
          OPENBURNBAR_NATIVE_DIR: ${{ github.workspace }}\crates\openburnbar-domain-core\target\debug
          DOMAIN_CORE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}\crates\openburnbar-domain-core\target\debug\openburnbar_domain_ffi.dll
          DOMAIN_CORE_CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          DOMAIN_CORE_OBSERVED_IDENTITY_REPORT: ${{ runner.temp }}\domain-core-observed-identity-arm64.json
        run: dotnet test windows/OpenBurnBar.sln --configuration Debug --no-build --logger trx --results-directory TestResults-arm64

      - name: Verify loaded domain-core identity
        run: node scripts/windows-port/verify-local-domain-core-identity.mjs --expected-commit ${{ steps.candidate.outputs.candidate_commit }} --observed-identity "${{ runner.temp }}\domain-core-observed-identity-arm64.json" --binary "${{ github.workspace }}\crates\openburnbar-domain-core\target\debug\openburnbar_domain_ffi.dll"

      - name: Verify complete ARM64 test evidence
        run: node scripts/windows-port/verify-trx-results.mjs --results-directory TestResults-arm64 --minimum-files 40 --minimum-tests 4083 --maximum-not-executed 2 --allowed-not-executed-file scripts/windows-port/allowed-not-executed-full.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: windows-full-arm64-test-results
          path: TestResults-arm64/
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Aggregate gate — one required status. Passes when BOTH legs succeed.
  # ──────────────────────────────────────────────────────────────────────────
  pr-windows-full-gate:
    name: PR Windows Full Gate
    needs:
      - detect-windows-full-changes
      - build-test-x64
      - build-test-arm64
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check both Windows full-suite legs passed
        env:
          WINDOWS_CHANGED: ${{ needs.detect-windows-full-changes.outputs.windows }}
          DETECT_RESULT: ${{ needs.detect-windows-full-changes.result }}
          X64_RESULT: ${{ needs.build-test-x64.result }}
          ARM64_RESULT: ${{ needs.build-test-arm64.result }}
        run: |
          set -euo pipefail
          echo "detect-windows-full-changes: ${DETECT_RESULT}"
          echo "windows-changed: ${WINDOWS_CHANGED}"
          echo "build-test-x64: ${X64_RESULT}"
          echo "build-test-arm64: ${ARM64_RESULT}"

          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "::error::detect-windows-full-changes did not succeed (${DETECT_RESULT})."
            exit 1
          fi

          if [[ "${WINDOWS_CHANGED}" == "true" ]]; then
            if [[ "${X64_RESULT}" != "success" ]]; then
              echo "::error::Windows full suite (x64) failed (result=${X64_RESULT})."
              exit 1
            fi
            if [[ "${ARM64_RESULT}" != "success" ]]; then
              echo "::error::Windows full suite (ARM64) failed (result=${ARM64_RESULT})."
              exit 1
            fi
          else
            if [[ "${X64_RESULT}" != "skipped" || "${ARM64_RESULT}" != "skipped" ]]; then
              echo "::error::Windows full-suite legs should skip when no Windows full-suite surface changed."
              exit 1
            fi
          fi

          if [[ "${WINDOWS_CHANGED}" == "true" ]]; then
            echo "### PR Windows Full Gate: full-suite build + 4,083+ tests green on x64 + ARM64" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### PR Windows Full Gate: no Windows full-suite surface changed - x64 + ARM64 legs skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
