name: PR Windows Fast Gate

# Path-filtered Windows PR gate. The ARM64 leg remains in pr-windows-full.yml;
# this lane provides the minimum real x64 compile, test, transitive
# dependency-security, and parity-ledger honesty floor for every Windows-surface
# change.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-windows-fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cheap detector: did this PR touch the Windows tree or its CI/budget wiring? ──
  # Runs on ubuntu so the windows-latest lanes only spin up when a PR
  # actually changes windows/ (or its wiring). For merge_group (and any non-PR
  # trigger) the gate always runs.
  detect-windows-changes:
    name: Detect Windows changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          # PR checkouts use GitHub's synthetic merge commit. Depth 2 includes
          # that merge commit plus its base/head parents — all this detector needs.
          fetch-depth: 2

      - name: Determine whether Windows paths changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Non-PR triggers (merge_group / manual) always run the Windows gate.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Event ${EVENT_NAME}: running Windows gate unconditionally."
            exit 0
          fi

          base="${BASE_SHA}"
          head="${HEAD_SHA}"

          if git cat-file -e "HEAD^1^{commit}" 2>/dev/null && \
             git cat-file -e "HEAD^2^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only HEAD^1 HEAD^2)"
          elif git cat-file -e "${base}^{commit}" 2>/dev/null && \
               git cat-file -e "${head}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${base}" "${head}")"
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve merge parents or base/head commits; running Windows gate to stay fail-safe."
            exit 0
          fi
          echo "Changed files:"
          echo "${changed}"

          if echo "${changed}" | grep -Eq \
            '^(windows/|crates/openburnbar-domain-core/|\.github/workflows/pr-windows-fast\.yml|budgets/windows-tree-baseline\.json|scripts/debt/check-windows-tree-budget\.sh|docs/windows-port/|scripts/ci/verify-windows-parity-ledger|scripts/lib/atomic-regular-file\.mjs|scripts/windows-port/)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "Windows surface changed: running the skeleton, x64, and parity ledger lanes."
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "No Windows surface changed: skipping the windows-latest lane (aggregate still passes)."
          fi

  # ── PR-GATED (skeleton): tree-shape tripwire ───────────────────────────────
  # Cheap legacy tripwire kept alongside the real x64 lane while the Windows
  # surface is still expanding quickly.
  windows-skeleton:
    name: Windows skeleton (build + lint + test)
    needs: detect-windows-changes
    if: needs.detect-windows-changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Verify Windows source tree + aggregating solution
        run: |
          set -euo pipefail
          test -f windows/OpenBurnBar.sln
          test -f windows/README.md
          for area in app pal native tests; do
            test -d "windows/${area}"
          done
          echo "Windows tree + OpenBurnBar.sln present (app / pal / native / tests)."

      - name: Build (skeleton — real msbuild/dotnet lands in CI-003)
        run: |
          echo "SKELETON build: WinUI app + PAL + native shim compile once WINUI-016 adds projects to windows/OpenBurnBar.sln."

      - name: Lint (skeleton — real analyzers land in CI-003)
        run: |
          echo "SKELETON lint: dotnet format / Roslyn analyzers over windows/ once projects exist."

      - name: Unit tests (skeleton — real test run lands in CI-003)
        run: |
          echo "SKELETON unit tests: run the windows/tests projects once they exist."

  # ── PR-GATED: windows-latest restore + security + build + unit ──────────────
  windows-x64:
    name: Windows x64 (security + build + test)
    needs: detect-windows-changes
    if: needs.detect-windows-changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: "1.96.0"

      - name: Verify Windows solution
        run: |
          if (-not (Test-Path "windows/OpenBurnBar.sln")) {
            throw "windows/OpenBurnBar.sln not found."
          }
          Write-Host "Windows solution present."

      - name: Parse physical certification PowerShell
        run: |
          $scripts = @(
            "scripts/windows-port/new-physical-hardware-attestation.ps1",
            "scripts/windows-port/new-release-certification-supplemental-receipt.ps1",
            "scripts/windows-port/publish-staging-remote-config-fixture.ps1",
            "scripts/windows-port/remote-config-http.psm1",
            "scripts/windows-port/test-staging-runtime-safety-fixture.ps1",
            "scripts/windows-port/run-ui-automation.ps1",
            "scripts/windows-port/run-physical-release-certification.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              throw "Physical certification PowerShell has parse errors: $script"
            }
            Write-Host "PowerShell parse OK: $script"
          }

      - name: Test Remote Config unquoted ETag handling
        run: |
          Import-Module "./scripts/windows-port/remote-config-http.psm1" -Force
          $response = [System.Net.Http.HttpResponseMessage]::new(
            [System.Net.HttpStatusCode]::OK
          )
          try {
            if (-not $response.Headers.TryAddWithoutValidation(
              "ETag",
              "etag-1079930549647-1")) {
              throw "Unable to construct the Firebase ETag regression fixture."
            }
            if ($null -ne $response.Headers.ETag) {
              throw "Regression fixture unexpectedly parsed as an RFC-compliant typed ETag."
            }
            $actual = Get-RemoteConfigETag $response
            if ($actual -cne "etag-1079930549647-1") {
              throw "Unquoted Firebase ETag was not preserved: '$actual'."
            }
            Write-Host "Remote Config unquoted ETag parser PASS."
          }

          finally {
            $response.Dispose()
          }

      - name: Validate staging Remote Config certification fixtures
        run: |
          $publisher = "scripts/windows-port/publish-staging-remote-config-fixture.ps1"
          foreach ($fixture in @("Baseline", "ComputerKill", "MediaKill", "MalformedSystem")) {
            $result = & $publisher -Fixture $fixture -ValidateOnly | ConvertFrom-Json
            if (-not $result.payloadValidated -or $result.mutationAttempted) {
              throw "Fixture validation was not side-effect free: $fixture"
            }
          }
          $malformed = & $publisher -Fixture MalformedSystem -ValidateOnly | ConvertFrom-Json
          $system = @($malformed.overriddenParameters | Where-Object { $_.name -ceq "computer_use_system_enabled" })
          if ($system.Count -ne 1 -or
              $system[0].valueType -cne "STRING" -or
              $system[0].valueSha256 -cne "20e6695ec9d873ae768f6ceffd4500ba2ffc6bc7e123389cf143d7caae21ae69") {
            throw "MalformedSystem must publish its invalid value as STRING."
          }

      - name: Smoke supplemental certification templates
        run: |
          $catalog = Get-Content -Raw "scripts/windows-port/release-certification-protocols.json" | ConvertFrom-Json
          $outputRoot = Join-Path $env:RUNNER_TEMP ("certification-protocol-" + [Guid]::NewGuid().ToString("N"))
          $tool = Resolve-Path "scripts/windows-port/new-release-certification-supplemental-receipt.ps1"
          foreach ($gateProperty in $catalog.gates.PSObject.Properties) {
            $gate = [string]$gateProperty.Name
            $resultsPath = Join-Path $outputRoot ($gate + ".json")
            & $tool -Gate $gate -ResultsPath $resultsPath -Initialize
            $results = Get-Content -Raw $resultsPath | ConvertFrom-Json
            $profileName = [string]$gateProperty.Value.profile
            $profile = $catalog.profiles.PSObject.Properties[$profileName].Value
            if ($results.schema -ne "openburnbar.windows.release-certification-protocol-results.v1" -or
                $results.gate -ne $gate -or
                @($results.assertions).Count -ne @($profile.assertions).Count -or
                @($results.assertions | Where-Object { $_.status -ne "NOT_RUN" }).Count -ne 0) {
              throw "Supplemental certification template smoke failed: $gate"
            }
            Write-Host "Supplemental template OK: $gate ($(@($results.assertions).Count) assertions)"
          }

      - name: Verify native candidate helpers on Windows
        run: |
          node --test `
            scripts/windows-port/native-library-staging.test.mjs `
            scripts/windows-port/stage-local-rust-cdylib.test.mjs `
            scripts/windows-port/verify-local-domain-core-identity.test.mjs

      - name: Restore Windows solution
        run: dotnet restore windows/OpenBurnBar.sln

      - name: Audit transitive NuGet dependencies
        run: |
          $output = dotnet list windows/OpenBurnBar.sln package --vulnerable --include-transitive 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit command failed."
          }
          if ($output -match "has the following vulnerable packages") {
            throw "NuGet vulnerability audit found vulnerable packages."
          }

      - name: Build native shared domain core
        run: cargo build --manifest-path crates/openburnbar-domain-core/Cargo.toml -p openburnbar-domain-ffi

      - name: Build Windows solution
        run: dotnet build windows/OpenBurnBar.sln --configuration Debug --no-restore -p:Platform=x64

      - name: Verify usage-scan worker staging
        run: |
          $appOutputRoot = "windows/app/OpenBurnBar.App/bin/x64/Debug"
          $workers = @(
            Get-ChildItem -Path $appOutputRoot -Recurse -File -Filter "OpenBurnBar.Cli.exe"
          )
          if ($workers.Count -eq 0) {
            throw "The normal Windows app build did not stage OpenBurnBar.Cli.exe."
          }
          $requiredWorkerFiles = @(
            "OpenBurnBar.Cli.exe",
            "OpenBurnBar.Cli.dll",
            "OpenBurnBar.Cli.deps.json",
            "OpenBurnBar.Cli.runtimeconfig.json"
          )
          foreach ($worker in $workers) {
            foreach ($requiredWorkerFile in $requiredWorkerFiles) {
              $candidate = Join-Path $worker.DirectoryName $requiredWorkerFile
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                throw "The normal Windows app build is missing usage-scan worker artifact: $candidate"
              }
            }
            Write-Host "Usage-scan worker staged beside app output: $($worker.DirectoryName)"
          }

      - name: Run Windows test suite
        env:
          OPENBURNBAR_REQUIRE_DOMAIN_CORE_NATIVE: "1"
        run: dotnet test windows/OpenBurnBar.sln --configuration Debug --no-build --logger trx --results-directory TestResults-x64

      - name: Verify complete Windows test evidence
        run: node scripts/windows-port/verify-trx-results.mjs --results-directory TestResults-x64 --minimum-files 40 --minimum-tests 4082 --maximum-not-executed 15

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: windows-pr-x64-test-results
          path: TestResults-x64/
          if-no-files-found: error

  # ── Phase 0 parity ledger (ubuntu; runs whenever the Windows surface changes) ─
  # Anti-false-green gate: Authored is illegal; Real rows need tests+evidence and
  # clean production paths. Also covered by fast-feedback.yml on every PR.
  windows-parity-ledger:
    name: Windows parity ledger
    needs: detect-windows-changes
    if: needs.detect-windows-changes.outputs.windows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"

      - name: XAML token discipline (Aurora/macOS parity — no raw colors or fonts outside Theme/)
        run: bash scripts/windows-port/check-xaml-token-discipline.sh

      - name: Validate physical certification harness contract
        run: |
          node scripts/windows-port/test-validate-release-certification-evidence.mjs
          node scripts/windows-port/test-physical-release-certification.mjs
          node scripts/windows-port/test-stage-exact-candidate-rehearsal.mjs
          node --test scripts/windows-port/native-library-staging.test.mjs
          node --test scripts/windows-port/stage-local-rust-cdylib.test.mjs
          node --test scripts/windows-port/verify-local-domain-core-identity.test.mjs
          node --test scripts/windows-port/verify-trx-results.test.mjs

      - name: Install PyYAML for ledger scanner
        run: python3 -m pip install --user 'pyyaml>=6,<7'

      - name: Self-test the Windows parity ledger gate
        run: bash scripts/ci/verify-windows-parity-ledger.test.sh

      - name: Verify Windows parity ledger honesty
        run: bash scripts/ci/verify-windows-parity-ledger.sh

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  # Single required status. Passes when every applicable Windows lane succeeds,
  # or when all are skipped because the PR touched no Windows surface. Fails if
  # any applicable lane failed or was cancelled. Mirrors pr-native-gate semantics.
  pr-windows-gate:
    name: PR Windows Gate
    needs:
      - detect-windows-changes
      - windows-skeleton
      - windows-x64
      - windows-parity-ledger
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Windows jobs passed (or were correctly skipped)
        env:
          WINDOWS_CHANGED: ${{ needs.detect-windows-changes.outputs.windows }}
          DETECT_RESULT: ${{ needs.detect-windows-changes.result }}
          SKELETON_RESULT: ${{ needs.windows-skeleton.result }}
          WINDOWS_RESULT: ${{ needs.windows-x64.result }}
          LEDGER_RESULT: ${{ needs.windows-parity-ledger.result }}
        run: |
          set -euo pipefail
          echo "detect-windows-changes: ${DETECT_RESULT}"
          echo "windows-changed: ${WINDOWS_CHANGED}"
          echo "windows-skeleton: ${SKELETON_RESULT}"
          echo "windows-x64: ${WINDOWS_RESULT}"
          echo "windows-parity-ledger: ${LEDGER_RESULT}"

          # The detector itself must have succeeded; a 'skipped' here would mean
          # the path filter never ran, so the downstream skip cannot be trusted.
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "::error::detect-windows-changes did not succeed (${DETECT_RESULT})."
            exit 1
          fi

          if [[ "${WINDOWS_CHANGED}" == "true" ]]; then
            if [[ "${SKELETON_RESULT}" != "success" ]]; then
              echo "::error::The Windows skeleton lane did not succeed (result=${SKELETON_RESULT})."
              exit 1
            fi
            if [[ "${WINDOWS_RESULT}" != "success" ]]; then
              echo "::error::The Windows x64 lane did not succeed (result=${WINDOWS_RESULT})."
              exit 1
            fi
            if [[ "${LEDGER_RESULT}" != "success" ]]; then
              echo "::error::The Windows parity ledger gate did not succeed (result=${LEDGER_RESULT})."
              exit 1
            fi
          else
            if [[ "${WINDOWS_CHANGED}" != "false" ||
                  "${SKELETON_RESULT}" != "skipped" ||
                  "${WINDOWS_RESULT}" != "skipped" ||
                  "${LEDGER_RESULT}" != "skipped" ]]; then
              echo "::error::Windows lanes skipped without a trusted no-change decision."
              exit 1
            fi
          fi

          echo "### PR Windows Gate: skeleton + x64 + parity ledger checks passed" >> "$GITHUB_STEP_SUMMARY"
