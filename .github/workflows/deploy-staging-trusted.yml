name: Trusted Staging Deployment

# This reusable workflow is called as
# Imagine-That-Ai/BurnBar/.github/workflows/deploy-staging-trusted.yml@main.
# Its jobs treat candidate artifacts as bounded data and run only trusted-main
# deployment instructions under the staging environment's short-lived WIF token.

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      rules_artifact:
        required: true
        type: string
      deploy_hosting:
        required: true
        type: boolean
      hosting_artifact:
        required: true
        type: string
      deploy_functions:
        required: true
        type: boolean
      functions_artifact:
        required: true
        type: string
      function_targets:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bounded candidate data to staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RULES_ARTIFACT: ${{ inputs.rules_artifact }}
      HOSTING_ARTIFACT: ${{ inputs.hosting_artifact }}
      DEPLOY_HOSTING: ${{ inputs.deploy_hosting }}
      FUNCTIONS_ARTIFACT: ${{ inputs.functions_artifact }}
      DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
      FUNCTION_TARGETS: ${{ inputs.function_targets }}
      FIREBASE_PROJECT: ${{ vars.STAGING_FIREBASE_PROJECT || 'burnbar-staging' }}
      STAGING_FIREBASE_PUBLIC_CONFIG_JSON: ${{ vars.STAGING_FIREBASE_PUBLIC_CONFIG_JSON }}
      STAGING_ENABLED: ${{ vars.STAGING_ENABLED }}
    steps:
      - name: Check out trusted deployment instructions from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Validate trusted invocation and provisioning
        env:
          HAS_WIF_PROVIDER: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_DEPLOY_SA: ${{ secrets.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha is not a full Git commit SHA."; exit 1;
          }
          [[ "$RULES_ARTIFACT" == "staging-rules-$CANDIDATE_SHA" ]] || {
            echo "::error::rules artifact identity does not match candidate SHA."; exit 1;
          }
          if [[ "$DEPLOY_HOSTING" == "true" ]]; then
            [[ "$HOSTING_ARTIFACT" == "staging-hosting-$CANDIDATE_SHA" ]] || {
              echo "::error::Hosting artifact identity does not match candidate SHA."; exit 1;
            }
            [[ -n "$STAGING_FIREBASE_PUBLIC_CONFIG_JSON" ]] || {
              echo "::error::STAGING_FIREBASE_PUBLIC_CONFIG_JSON is not provisioned."; exit 1;
            }
            [[ "$FIREBASE_PROJECT" == "burnbar-staging" ]] || {
              echo "::error::The staging website public Firebase config is pinned to burnbar-staging."; exit 1;
            }
          fi
          if [[ "$DEPLOY_FUNCTIONS" == "true" ]]; then
            [[ "$FUNCTIONS_ARTIFACT" == "staging-functions-$CANDIDATE_SHA" ]] || {
              echo "::error::Functions artifact identity does not match candidate SHA."; exit 1;
            }
            # The candidate artifact is always scoped to explicit reviewed
            # targets, so an unscoped deploy would ask the non-interactive
            # Firebase CLI to delete every other remote function and abort.
            [[ -n "${FUNCTION_TARGETS:-}" ]] || {
              echo "::error::deploy_functions requires the resolved function_targets selectors from the candidate build."; exit 1;
            }
          fi
          if [[ -n "${FUNCTION_TARGETS:-}" ]] &&
             [[ ! "$FUNCTION_TARGETS" =~ ^functions:[A-Za-z][A-Za-z0-9_-]*(,functions:[A-Za-z][A-Za-z0-9_-]*)*$ ]]; then
            echo "::error::function_targets must contain only explicit Firebase Functions selectors."
            exit 1
          fi
          [[ "$STAGING_ENABLED" == "true" ]] || {
            echo "::error::STAGING_ENABLED must be true."; exit 1;
          }
          [[ "$HAS_WIF_PROVIDER" == "true" && "$HAS_DEPLOY_SA" == "true" ]] || {
            echo "::error::The staging WIF environment secrets are not provisioned."; exit 1;
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.rules_artifact }}
          path: ${{ runner.temp }}/candidate-rules

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.deploy_functions }}
        with:
          name: ${{ inputs.functions_artifact }}
          path: ${{ runner.temp }}/candidate-functions

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.deploy_hosting }}
        with:
          name: ${{ inputs.hosting_artifact }}
          path: ${{ runner.temp }}/candidate-hosting

      - name: Verify bounded candidate artifacts before authentication
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/candidate-rules"
          test "$(cat "$rules/CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          test "$(find "$rules" -type f | wc -l | tr -d ' ')" = "5"
          test "$(du -sk "$rules" | cut -f1)" -le 2048
          (cd "$rules" && sha256sum --check SHA256SUMS)
          find "$rules" -type l -exec false {} +

          if [[ "$DEPLOY_HOSTING" == "true" ]]; then
            hosting="$RUNNER_TEMP/candidate-hosting"
            test "$(cat "$hosting/CANDIDATE_SHA")" = "$CANDIDATE_SHA"
            test "$(du -sk "$hosting" | cut -f1)" -le 131072
            test "$(find "$hosting" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
            test "$(find "$hosting" -mindepth 1 -maxdepth 1 -type d -name website | wc -l | tr -d ' ')" = "1"
            test "$(find "$hosting" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "3"
            test -f "$hosting/website/dist/index.html"
            test -f "$hosting/website/dist/subscribe/index.html"
            test "$(find "$hosting/website/dist" -type f | wc -l | tr -d ' ')" -le 10000
            (cd "$hosting" && sha256sum --check SHA256SUMS)
            find "$hosting" -type l -exec false {} +
          fi

          if [[ "$DEPLOY_FUNCTIONS" == "true" ]]; then
            functions="$RUNNER_TEMP/candidate-functions"
            node trusted/scripts/ci/verify-staging-functions-artifact.mjs \
              --artifact-root "$functions" \
              --candidate-sha "$CANDIDATE_SHA"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Prepare trusted deploy tooling and inert workspace before authentication
        working-directory: trusted
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-firebase-tools.sh
          deploy_root="$RUNNER_TEMP/staging-deploy"
          mkdir -p "$deploy_root"
          cp "$RUNNER_TEMP/candidate-rules/firestore.rules" \
             "$RUNNER_TEMP/candidate-rules/firestore.indexes.json" \
             "$RUNNER_TEMP/candidate-rules/storage.rules" \
             "$deploy_root/"
          jq -nc \
            --arg bucket "${FIREBASE_PROJECT}.firebasestorage.app" \
            '{firestore:{rules:"firestore.rules",indexes:"firestore.indexes.json"},storage:[{bucket:$bucket,rules:"storage.rules"}]}' \
            > "$deploy_root/firebase-rules.json"
          node scripts/ci/compact-firestore-rules-inplace.mjs \
            "$deploy_root/firestore.rules"
          if [[ "$DEPLOY_HOSTING" == "true" ]]; then
            cp -R "$RUNNER_TEMP/candidate-hosting/website" "$deploy_root/website"
            node scripts/ci/write-firebase-hosting-ci-config.mjs \
              --mode staging-hosting \
              --output "$deploy_root/firebase-hosting.json" \
              --manifest "$deploy_root/firebase-hosting.manifest.json" \
              --check
          fi
          if [[ "$DEPLOY_FUNCTIONS" == "true" ]]; then
            cp -R "$RUNNER_TEMP/candidate-functions/functions" "$deploy_root/functions"
            npm ci --prefix "$deploy_root/functions" --omit=dev --ignore-scripts
            cat > "$deploy_root/firebase-functions.json" <<'JSON'
          {"functions":[{"source":"functions","codebase":"default","ignore":["node_modules/.cache",".git","firebase-debug.log","firebase-debug.*.log"]}]}
          JSON
          fi
          for config in "$deploy_root"/firebase-*.json; do
            if grep -q '"predeploy"' "$config"; then
              echo "::error::Trusted deployment config contains a predeploy hook."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud through trusted-main WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Deploy Firestore, indexes, and Storage rules
        working-directory: trusted
        env:
          FIREBASE_CONFIG_PATH: ${{ runner.temp }}/staging-deploy/firebase-rules.json
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          deploy_log="$(mktemp)"
          deploy_status=0
          "$FIREBASE_TOOLS_BIN" deploy \
            --only firestore,storage \
            --project "$FIREBASE_PROJECT" \
            --config "$FIREBASE_CONFIG_PATH" \
            --non-interactive 2>&1 | tee "$deploy_log" || deploy_status=$?
          if [[ "$deploy_status" -ne 0 ]]; then
            if grep -q "409" "$deploy_log" && grep -qi "Requested entity already exists" "$deploy_log"; then
              echo "::warning::Firestore rules release hit 409; running targeted repair"
              node scripts/ci/repair-firestore-rules-release.mjs "$FIREBASE_PROJECT" \
                "$RUNNER_TEMP/staging-deploy/firestore.rules"
            else
              cat "$deploy_log"
              exit "$deploy_status"
            fi
          fi
          # Verify the live release against the exact candidate artifacts this
          # job deployed, not the trusted checkout's main files.
          node scripts/ci/check-firestore-deploy-drift.mjs "$FIREBASE_PROJECT" \
            "$RUNNER_TEMP/staging-deploy"
          node scripts/ci/verify-firestore-ttl-state.mjs "$FIREBASE_PROJECT" \
            "$RUNNER_TEMP/staging-deploy"

      - name: Deploy reviewed Functions artifact
        if: ${{ inputs.deploy_functions }}
        working-directory: trusted
        env:
          FIREBASE_CONFIG_PATH: ${{ runner.temp }}/staging-deploy/firebase-functions.json
          SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN_FUNCTIONS }}
        run: |
          set -euo pipefail
          functions_dir="$RUNNER_TEMP/staging-deploy/functions"
          env_file="$functions_dir/.env.${FIREBASE_PROJECT}"
          env_temp="$(mktemp "$RUNNER_TEMP/staging-functions-env.XXXXXX")"
          trap 'rm -f "$env_temp"' EXIT
          {
            cat "$functions_dir/.env.burnbar-staging"
            printf '\nFUNCTION_VERSION=staging-%s\n' "$CANDIDATE_SHA"
            printf 'OPENBURNBAR_SOURCE_COMMIT=%s\n' "$CANDIDATE_SHA"
            if [[ -n "${SENTRY_DSN:-}" ]]; then
              printf 'SENTRY_DSN=%s\nSENTRY_ENVIRONMENT=staging\n' "$SENTRY_DSN"
            fi
          } > "$env_temp"
          mv "$env_temp" "$env_file"
          trap - EXIT
          deploy_scope="$FUNCTION_TARGETS"
          "$FIREBASE_TOOLS_BIN" deploy \
            --only "$deploy_scope" \
            --project "$FIREBASE_PROJECT" \
            --config "$FIREBASE_CONFIG_PATH" \
            --non-interactive

      - name: Verify every Hosting rewrite target exists
        if: ${{ inputs.deploy_hosting }}
        working-directory: trusted
        env:
          FIREBASE_CONFIG_PATH: ${{ runner.temp }}/staging-deploy/firebase-hosting.json
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          rewrite_count=0
          while IFS=$'\t' read -r function_id region; do
            [[ -n "$function_id" && -n "$region" ]] || continue
            rewrite_count=$((rewrite_count + 1))
            gcloud functions describe "$function_id" \
              --gen2 \
              --region "$region" \
              --project "$FIREBASE_PROJECT" \
              --format='value(state)' |
              grep -qx ACTIVE || {
                echo "::error::Hosting rewrite target $function_id is not ACTIVE in $FIREBASE_PROJECT/$region."
                exit 1
              }
          done < <(
            jq -r '
              .hosting[]
              | .rewrites[]?
              | select(.function)
              | if (.function | type) == "string"
                then [.function, "us-central1"]
                else [.function.functionId, (.function.region // "us-central1")]
                end
              | @tsv
            ' "$FIREBASE_CONFIG_PATH"
          )
          [[ "$rewrite_count" -gt 0 ]] || {
            echo "::error::Staging marketing Hosting config has no reviewed Function rewrites."
            exit 1
          }

      - name: Grant public invocation only to reviewed Hosting rewrite services
        if: ${{ inputs.deploy_hosting }}
        working-directory: trusted
        env:
          FIREBASE_CONFIG_PATH: ${{ runner.temp }}/staging-deploy/firebase-hosting.json
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          declare -A reviewed_rewrites=(
            [burnBarHermesGateway]=us-central1
            [latestRouterRundown]=us-central1
            [startCliLink]=us-central1
            [pollCliLink]=us-central1
          )
          rewrite_count=0
          while IFS=$'\t' read -r function_id region; do
            [[ -n "$function_id" && -n "$region" ]] || continue
            expected_region="${reviewed_rewrites[$function_id]:-}"
            [[ -n "$expected_region" && "$region" == "$expected_region" ]] || {
              echo "::error::Refusing to grant public invocation to unreviewed rewrite $function_id in $region."
              exit 1
            }
            service_resource="$(
              gcloud functions describe "$function_id" \
                --gen2 \
                --region "$region" \
                --project "$FIREBASE_PROJECT" \
                --format='value(serviceConfig.service)'
            )"
            service_name="${service_resource##*/}"
            [[ -n "$service_name" && "$service_name" != "$service_resource" ]] || {
              echo "::error::Could not resolve the Cloud Run service for rewrite $function_id."
              exit 1
            }
            gcloud run services add-iam-policy-binding "$service_name" \
              --region "$region" \
              --project "$FIREBASE_PROJECT" \
              --member=allUsers \
              --role=roles/run.invoker \
              --quiet
            unset 'reviewed_rewrites[$function_id]'
            rewrite_count=$((rewrite_count + 1))
          done < <(
            jq -r '
              .hosting[]
              | .rewrites[]?
              | select(.function)
              | if (.function | type) == "string"
                then [.function, "us-central1"]
                else [.function.functionId, (.function.region // "us-central1")]
                end
              | @tsv
            ' "$FIREBASE_CONFIG_PATH"
          )
          [[ "$rewrite_count" -eq 4 && "${#reviewed_rewrites[@]}" -eq 0 ]] || {
            echo "::error::Staging marketing Hosting must contain exactly the four reviewed public rewrites."
            exit 1
          }

      - name: Deploy reviewed Hosting artifact
        if: ${{ inputs.deploy_hosting }}
        working-directory: trusted
        env:
          FIREBASE_CONFIG_PATH: ${{ runner.temp }}/staging-deploy/firebase-hosting.json
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          "$FIREBASE_TOOLS_BIN" deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --config "$FIREBASE_CONFIG_PATH" \
            --non-interactive

      - name: Verify exact staging website deployment
        if: ${{ inputs.deploy_hosting }}
        working-directory: trusted
        run: |
          set -euo pipefail
          node website/scripts/verify-staging-deployment.mjs \
            --base-url "https://${FIREBASE_PROJECT}.web.app" \
            --dist "$RUNNER_TEMP/staging-deploy/website/dist"

      - name: Record trusted staging receipt
        if: always()
        run: |
          {
            echo "## Trusted staging deployment"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Trusted workflow: \`$GITHUB_WORKFLOW_REF\`"
            echo "- Project: \`$FIREBASE_PROJECT\`"
            echo "- Hosting included: \`$DEPLOY_HOSTING\`"
            echo "- Functions included: \`$DEPLOY_FUNCTIONS\`"
            echo "- Function targets: \`${FUNCTION_TARGETS:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
