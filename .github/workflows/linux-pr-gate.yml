name: Linux PR Gate

# Path-filtered PR gate for Linux-touching changes. Intentionally NOT on
# merge_group — MQ wall time must not pay for this ~33m parity lane.
# Broader Linux soak already lives in linux-nightly.yml (cron 17 10 * * *).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/linux-*.yml"
      - "apps/linux-desktop/**"
      - "docs/linux-port/**"
      - "packaging/linux/**"
      - "schemas/linux-runtime-capability-manifest.schema.json"
      - "scripts/linux-port/**"
      - "tools/linux-toolchain/**"
      - "OpenBurnBarCore/**"
      - "OpenBurnBarDaemon/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linux-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-matched-performance:
    name: macOS matched performance reference
    runs-on: macos-26
    timeout-minutes: 25
    env:
      OB_EVIDENCE_OUT: ${{ github.workspace }}/.linux-matched-performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Matched performance comparator mutation tests
        run: node --test scripts/linux-port/matched-performance-contract.test.mjs

      - name: Capture macOS matched performance reference
        run: node scripts/linux-port/run-matched-performance.mjs --macos-only --profile pr

      - name: Upload macOS matched performance reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: linux-parity-macos-performance-pr
          path: ${{ env.OB_EVIDENCE_OUT }}/matched-performance-macos.json
          if-no-files-found: error

  linux-fast:
    name: Linux fast package and parity gate
    runs-on: ubuntu-24.04-arm
    needs: [macos-matched-performance]
    timeout-minutes: 45
    env:
      OPENBURNBAR_LINUX_EVIDENCE_OUT: ${{ github.workspace }}/.linux-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/linux-desktop/package-lock.json
            scripts/linux-port/package-lock.json

      - name: Install Linux evidence contract dependencies
        run: npm ci --prefix scripts/linux-port --ignore-scripts

      - name: Validate Linux release config
        run: node scripts/linux-port/validate-linux-release-config.mjs

      - name: Validate parity ledger structure
        run: node scripts/linux-port/validate-parity-ledger.mjs --allow-blocked

      - name: Check generated parity ledger Markdown
        run: node scripts/linux-port/render-parity-ledger.mjs --check

      - name: Check Linux docs
        run: node scripts/linux-port/check-linux-docs.mjs

      # PR policy (Issue 6 R2): hermetic unit tests always run. Live probe against
      # GitHub latest-release feed availability is advisory on PRs until a
      # release publishes the first signed two-architecture feed. Release
      # promotion runs this probe without continue-on-error.
      - name: Linux update-feed unit tests (hermetic)
        run: node --test scripts/linux-port/check-linux-update-feed.test.mjs

      - name: Probe public Linux update feed (advisory on PR)
        run: node scripts/linux-port/check-linux-update-feed.mjs --allow-missing
        continue-on-error: true

      - name: Linux parity ledger unit tests
        run: >
          node --test
          scripts/linux-port/attest-product-requirement.test.mjs
          scripts/linux-port/github-artifact-provenance.test.mjs
          scripts/linux-port/live-installed-product-evidence.test.mjs
          scripts/linux-port/smoke-linux-packages.test.mjs
          scripts/linux-port/product-proof-closure.test.mjs
          scripts/linux-port/product-feature-proof-closure.test.mjs
          scripts/linux-port/p07-computer-use-proof.test.mjs
          scripts/linux-port/p08-mercury-media-proof.test.mjs
          scripts/linux-port/p09-navigation-shell-proof.test.mjs
          scripts/linux-port/p10-dashboard-layout-proof.test.mjs
          scripts/linux-port/p11-usage-ingestion-proof.test.mjs
          scripts/linux-port/p12-quota-proof.test.mjs
          scripts/linux-port/p13-native-onboarding-probes.test.mjs
          scripts/linux-port/p13-onboarding-proof.test.mjs
          scripts/linux-port/p14-chat-proof.test.mjs
          scripts/linux-port/p15-account-billing-proof.test.mjs
          scripts/linux-port/p16-cloud-devices-proof.test.mjs
          scripts/linux-port/p16-physical-ipad-coordination.test.mjs
          scripts/linux-port/p17-native-activity-probes.test.mjs
          scripts/linux-port/p17-activity-proof.test.mjs
          scripts/linux-port/p18-native-memory-probes.test.mjs
          scripts/linux-port/p18-memory-review-proof.test.mjs
          scripts/linux-port/p19-native-projects-probes.test.mjs
          scripts/linux-port/p19-projects-proof.test.mjs
          scripts/linux-port/p20-native-missions-probes.test.mjs
          scripts/linux-port/p20-missions-proof.test.mjs
          scripts/linux-port/p21-native-insights-probes.test.mjs
          scripts/linux-port/p21-insights-proof.test.mjs
          scripts/linux-port/p22-native-database-probes.test.mjs
          scripts/linux-port/p22-database-proof.test.mjs
          scripts/linux-port/p23-native-provider-workspace-probes.test.mjs
          scripts/linux-port/p23-provider-workspace-proof.test.mjs
          scripts/linux-port/p24-installed-settings-workflow.test.mjs
          scripts/linux-port/p24-native-settings-probes.test.mjs
          scripts/linux-port/p24-settings-proof.test.mjs
          scripts/linux-port/p26-native-tray-probes.test.mjs
          scripts/linux-port/p26-tray-proof.test.mjs
          scripts/linux-port/p27-native-notification-probes.test.mjs
          scripts/linux-port/p27-notifications-proof.test.mjs
          scripts/linux-port/p28-native-smarthub-probes.test.mjs
          scripts/linux-port/p28-smarthub-proof.test.mjs
          scripts/linux-port/p29-native-text-expansion-probes.test.mjs
          scripts/linux-port/p29-text-expansion-proof.test.mjs
          scripts/linux-port/p30-native-pet-probes.test.mjs
          scripts/linux-port/p30-pet-proof.test.mjs
          scripts/linux-port/p32-performance-proof.test.mjs
          scripts/linux-port/p33-reliability-proof.test.mjs
          scripts/linux-port/p35-diagnostics-support-proof.test.mjs
          scripts/linux-port/p36-visual-polish-proof.test.mjs
          scripts/linux-port/install-tauri-webdriver-prerequisites.test.mjs
          scripts/linux-port/p25-installed-update-lifecycle.test.mjs
          scripts/linux-port/p25-native-update-probes.test.mjs
          scripts/linux-port/p25-updates-proof.test.mjs
          scripts/linux-port/p38-release-automation-proof.test.mjs
          scripts/linux-port/p31-accessibility-proof.test.mjs
          scripts/linux-port/p34-credential-security-proof.test.mjs
          scripts/linux-port/parity-certification-preflight.test.mjs
          scripts/linux-port/run-linux-matrix-harness.test.mjs
          scripts/linux-port/run-product-requirement-validator.test.mjs
          scripts/linux-port/validate-parity-ledger.test.mjs
          scripts/linux-port/render-parity-ledger.test.mjs

      - name: Linux release integrity unit tests
        run: >
          node --test
          scripts/linux-port/assemble-linux-release.test.mjs
          scripts/linux-port/linux-aggregate-installed-attestation.test.mjs
          scripts/linux-port/browser-runtime-packaging.test.mjs
          scripts/linux-port/aur-browser-runtime-packaging.test.mjs
          scripts/linux-port/arch-package-lifecycle.test.mjs
          scripts/linux-port/embed-linux-appimage-payload.test.mjs
          scripts/linux-port/linux-appimage-peer-manifest.test.mjs
          scripts/linux-port/linux-native-package-real-tools.test.mjs
          scripts/linux-port/linux-package-session.test.mjs
          scripts/linux-port/arch-lifecycle-authentication.test.mjs
          scripts/linux-port/prepare-linux-package-payload.test.mjs
          scripts/linux-port/validate-linux-release-public-config.test.mjs
          scripts/linux-port/sign-linux-release-requests.test.mjs
          scripts/linux-port/sign-product-proof-closure.test.mjs
          scripts/linux-port/signed-installed-package-wiring.test.mjs
          scripts/linux-port/credential-storage-contract.test.mjs
          scripts/linux-port/media-runtime-contract.test.mjs
          scripts/linux-port/linux-toolchain-node-runtime.test.mjs
          scripts/linux-port/verify-linux-release.test.mjs
          scripts/linux-port/resolve-linux-release-version.test.mjs
          scripts/linux-port/resolve-linux-previous-release.test.mjs
          scripts/linux-port/materialize-linux-lifecycle-release-assets.test.mjs
          scripts/linux-port/verify-linux-baseline-workflow.test.mjs

      - name: Verify Linux workflow wiring
        run: |
          node scripts/linux-port/verify-linux-workflow-wiring.mjs
          node scripts/linux-port/verify-linux-baseline-workflow.mjs
          node --test \
            scripts/linux-port/verify-linux-workflow-wiring.test.mjs \
            scripts/linux-port/resolve-product-evidence-run.test.mjs \
            scripts/linux-port/resolve-product-receipt-artifacts.test.mjs \
            scripts/linux-port/runtime-capability-contract.test.mjs \
            scripts/linux-port/accessibility-harness-contract.test.mjs \
            scripts/linux-port/run-linux-native-tests.test.mjs \
            scripts/linux-port/text-expansion-native-evidence.test.mjs \
            scripts/linux-port/matched-performance-contract.test.mjs \
            scripts/linux-port/perf-budget-contract.test.mjs

      - name: Install Linux desktop dependencies
        run: npm ci --prefix apps/linux-desktop

      # Promoted from observing-first to required: the linux-fast job is
      # already required, so removing continue-on-error makes tsc regressions
      # fail the gate. Promotion verified green on PR #1784.
      - name: Linux desktop TypeScript typecheck
        run: npm run typecheck --prefix apps/linux-desktop

      - name: Linux desktop unit tests
        run: npm test --prefix apps/linux-desktop

      - name: Linux desktop web build
        run: npm run build --prefix apps/linux-desktop

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Toolchain smoke
        run: docker run --rm -v "$PWD:/workspace" -w /workspace openburnbar-linux-toolchain:mission-001 bash tools/linux-toolchain/smoke.sh

      - name: Real deb and rpm metadata and extraction tests
        run: >
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace
          openburnbar-linux-toolchain:mission-001
          node --test
          scripts/linux-port/linux-native-package-real-tools.test.mjs
          scripts/linux-port/linux-installed-manifest.test.mjs
      - name: Run Linux Swift package tests
        run: |
          mkdir -p "$OPENBURNBAR_LINUX_EVIDENCE_OUT"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$OPENBURNBAR_LINUX_EVIDENCE_OUT:/evidence" \
            -w /workspace \
            --env OPENBURNBAR_LINUX_SWIFT_TEST_RESULTS=/evidence/linux-swift-tests \
            openburnbar-linux-toolchain:mission-001 \
            bash scripts/linux-port/run-linux-swift-tests.sh

      - name: Download macOS matched performance reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          name: linux-parity-macos-performance-pr
          path: ${{ runner.temp }}/openburnbar-macos-performance

      - name: Compare Linux against macOS matched workloads
        env:
          OB_EVIDENCE_OUT: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}
        run: >
          node scripts/linux-port/run-matched-performance.mjs
          --profile pr
          --macos-input "${{ runner.temp }}/openburnbar-macos-performance/matched-performance-macos.json"

      - name: Linux Swift and Rust behavior tests
        run: >
          docker run --rm -v "$PWD:/workspace" -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash scripts/linux-port/run-linux-native-tests.sh

      - name: IPC drift gate
        run: node tools/ipc/generate-burnbarrpc-canon.mjs --check

      - name: Upload Linux gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: linux-pr-gate-evidence
          path: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/
          include-hidden-files: true
          if-no-files-found: warn
