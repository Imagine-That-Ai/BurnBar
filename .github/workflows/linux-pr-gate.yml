name: Linux PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/linux-*.yml"
      - "apps/linux-desktop/**"
      - "docs/linux-port/**"
      - "packaging/linux/**"
      - "scripts/linux-port/**"
      - "tools/linux-toolchain/**"
      - "OpenBurnBarCore/**"
      - "OpenBurnBarDaemon/**"
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linux-pr-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-fast:
    name: Linux fast package and parity gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      OPENBURNBAR_LINUX_EVIDENCE_OUT: ${{ runner.temp }}/openburnbar-linux-evidence
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json

      - name: Validate Linux release config
        run: node scripts/linux-port/validate-linux-release-config.mjs

      - name: Validate parity ledger structure
        run: node scripts/linux-port/validate-parity-ledger.mjs --allow-blocked

      - name: Check generated parity ledger Markdown
        run: node scripts/linux-port/render-parity-ledger.mjs --check

      - name: Check Linux docs
        run: node scripts/linux-port/check-linux-docs.mjs

      # PR policy (Issue 6 R2): hermetic unit tests always run. Live probe against
      # burnbar.ai is advisory on PRs (continue-on-error) because the public path
      # still serves SPA HTML. Release promotion jobs must run the same probe
      # without continue-on-error (HTML is hard-fail when status 200).
      - name: Linux update-feed unit tests (hermetic)
        run: node --test scripts/linux-port/check-linux-update-feed.test.mjs

      - name: Probe public Linux update feed (advisory on PR)
        run: node scripts/linux-port/check-linux-update-feed.mjs --allow-missing
        continue-on-error: true

      - name: Linux parity ledger unit tests
        run: >
          node --test
          scripts/linux-port/validate-parity-ledger.test.mjs
          scripts/linux-port/render-parity-ledger.test.mjs

      - name: Linux release integrity unit tests
        run: >
          node --test
          scripts/linux-port/verify-linux-release.test.mjs
          scripts/linux-port/resolve-linux-release-version.test.mjs

      - name: Verify Linux workflow wiring
        run: |
          node scripts/linux-port/verify-linux-workflow-wiring.mjs
          node --test scripts/linux-port/verify-linux-workflow-wiring.test.mjs

      - name: Install Linux desktop dependencies
        run: npm ci --prefix apps/linux-desktop

      - name: Linux desktop unit tests
        run: npm test --prefix apps/linux-desktop

      - name: Linux desktop web build
        run: npm run build --prefix apps/linux-desktop

      - name: Build mission Linux toolchain image
        run: docker build -t openburnbar-linux-toolchain:mission-001 tools/linux-toolchain

      - name: Toolchain smoke
        run: docker run --rm -v "$PWD:/workspace" -w /workspace openburnbar-linux-toolchain:mission-001 bash tools/linux-toolchain/smoke.sh

      - name: Linux Swift and Rust behavior tests
        run: >
          docker run --rm -v "$PWD:/workspace" -w /workspace
          openburnbar-linux-toolchain:mission-001
          bash scripts/linux-port/run-linux-native-tests.sh

      - name: IPC drift gate
        run: node tools/ipc/generate-burnbarrpc-canon.mjs --check

      - name: Upload Linux gate evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.6.1
        with:
          name: linux-pr-gate-evidence
          path: ${{ env.OPENBURNBAR_LINUX_EVIDENCE_OUT }}/
          if-no-files-found: warn
