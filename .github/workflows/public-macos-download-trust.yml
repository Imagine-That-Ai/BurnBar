name: Public macOS Download Trust

permissions:
  contents: read

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-public-macos-download-change:
    runs-on: ubuntu-latest
    # This detector needs every commit/tree to compare PR and merge-group
    # candidates against their exact base, but it never reads repository file
    # contents. Avoid downloading the large blob pack and leave enough time for
    # GitHub-hosted checkout degradation without weakening the fail-closed gate.
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      gate_changed: ${{ steps.detect.outputs.gate_changed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - id: detect
        name: Detect public macOS download config changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          changed=false
          gate_changed=false
          changed_paths="$(mktemp)"
          trust_gate_changed() {
            grep -Eq '^(OpenBurnBarSafariExtension/Resources/OpenBurnBarSafariExtension\.entitlements|\.github/workflows/public-macos-download-trust\.yml|scripts/ci/verify-public-macos-download-trust\.sh|scripts/ci/verify-public-macos-download-trust\.test\.sh|scripts/ci/verify-public-macos-download-trust-workflow\.test\.py|scripts/ci/verify-openburnbar-development-signing(\.test)?\.sh|scripts/ci/(sign|verify)-openburnbar-safari-extension(\.test)?\.sh|scripts/ci/verify-openburnbar-safari-extension-layout\.py|scripts/ci/verify-signing-profile-certificate\.sh|scripts/ci/verify-signing-profile-certificate\.py|scripts/ci/verify-signing-profile-certificate\.test\.py|scripts/ci/verify-apple-release-firebase-config\.sh|scripts/ci/verify-apple-release-firebase-config\.test\.sh|scripts/ci/verify-apple-appcheck-release-artifact\.sh|scripts/lib/parse-macos-provisioning-udid(\.test)?\.py|scripts/test-openburnbar-safari-extension\.sh|tools/safari-certification-fixtures/.*)$' "$changed_paths"
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
            gate_changed=true
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$changed_paths"
            if grep -qx 'website/src/data/site.ts' "$changed_paths"; then
              changed=true
            fi
            if trust_gate_changed; then
              gate_changed=true
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed=true
              gate_changed=true
            else
              git diff --name-only "$BEFORE_SHA" HEAD > "$changed_paths"
              if grep -qx 'website/src/data/site.ts' "$changed_paths"; then
                changed=true
              fi
              if trust_gate_changed; then
                gate_changed=true
              fi
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "gate_changed=$gate_changed" >> "$GITHUB_OUTPUT"
          echo "Public macOS download config changed: $changed"
          echo "Public macOS trust gate code changed: $gate_changed"

  verify-public-macos-download-trust-code:
    needs: detect-public-macos-download-change
    if: ${{ needs.detect-public-macos-download-change.outputs.gate_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: "22"

      - name: Install SITE parser dependency
        run: npm ci --prefix website --ignore-scripts

      - name: Verify public macOS trust gate scripts
        run: |
          set -euo pipefail
          bash -n scripts/ci/verify-public-macos-download-trust.sh
          bash -n scripts/ci/verify-apple-release-firebase-config.sh
          bash -n scripts/ci/verify-apple-release-firebase-config.test.sh
          bash -n scripts/ci/verify-apple-appcheck-release-artifact.sh
          bash -n scripts/ci/verify-public-macos-download-trust.test.sh
          bash -n scripts/ci/sign-openburnbar-safari-extension.sh
          bash -n scripts/ci/verify-openburnbar-development-signing.sh
          bash -n scripts/ci/verify-openburnbar-development-signing.test.sh
          bash -n scripts/ci/verify-openburnbar-safari-extension.sh
          bash -n scripts/ci/verify-openburnbar-safari-extension.test.sh
          bash -n scripts/ci/verify-signing-profile-certificate.sh
          python3 -m py_compile \
            scripts/ci/verify-openburnbar-safari-extension-layout.py \
            scripts/lib/parse-macos-provisioning-udid.py \
            scripts/lib/parse-macos-provisioning-udid.test.py \
            scripts/ci/verify-public-macos-download-trust-workflow.test.py
          bash scripts/ci/verify-apple-release-firebase-config.test.sh
          bash scripts/ci/verify-public-macos-download-trust.test.sh
          bash scripts/ci/verify-openburnbar-safari-extension.test.sh
          python3 scripts/ci/verify-signing-profile-certificate.test.py
          python3 scripts/lib/parse-macos-provisioning-udid.test.py
          python3 scripts/ci/verify-public-macos-download-trust-workflow.test.py
          node tools/safari-certification-fixtures/verify.mjs
          node --test tools/safari-certification-fixtures/*.test.mjs

  verify-public-macos-development-signing-code:
    needs: detect-public-macos-download-change
    if: ${{ needs.detect-public-macos-download-change.outputs.gate_changed == 'true' }}
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Verify hardware-bound Apple Development signing gates
        run: |
          set -euo pipefail
          bash scripts/ci/verify-openburnbar-development-signing.test.sh
          bash scripts/ci/verify-openburnbar-safari-extension.test.sh
          /usr/sbin/system_profiler SPHardwareDataType -json 2>/dev/null \
            | python3 scripts/lib/parse-macos-provisioning-udid.py \
            | python3 -c 'import re, sys; value = sys.stdin.read().strip(); raise SystemExit(0 if re.fullmatch(r"[A-Za-z0-9-]{8,128}", value) else 1)'

  verify-public-macos-download-trust:
    needs: detect-public-macos-download-change
    if: ${{ needs.detect-public-macos-download-change.outputs.changed == 'true' }}
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Check out candidate download metadata
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          path: candidate
          persist-credentials: false

      - name: Check out trusted-base verifier and parser policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Install trusted-base SITE parser dependency
        run: npm ci --prefix trusted/website --ignore-scripts

      - name: Verify exact public macOS DMG trust chain
        run: >-
          bash trusted/scripts/ci/verify-public-macos-download-trust.sh
          "$GITHUB_WORKSPACE/candidate/website/src/data/site.ts"
