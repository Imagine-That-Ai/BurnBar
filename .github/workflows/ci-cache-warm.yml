name: CI cache warm (default branch)

# WHY THIS EXISTS
#
# GitHub Actions scopes a cache to the ref that wrote it. A cache written on
# refs/pull/<n>/merge is readable ONLY by that pull request; caches written on
# the DEFAULT branch are readable by every branch and every PR. Nothing in this
# repo was writing the expensive macOS caches on `main`:
#
#   $ gh api repos/.../actions/caches --jq '[.actions_caches[].ref]|unique'
#   ["refs/pull/1564/merge","refs/pull/1744/merge","refs/pull/1764/merge",
#    "refs/pull/1959/merge","refs/pull/1969/merge","refs/pull/1970/merge"]
#
# Zero entries on refs/heads/main. Every PR therefore started COLD and rebuilt
# the libsignal Signal FFI xcframework from Rust source (five Apple targets) on
# every macOS job, which is the bulk of the ~25 min median on App PR Gate,
# Headless App Build and CodeQL PR. With hosted macos-* capped near five
# concurrent jobs, that cold rebuild is what turned a normal PR burst into a
# 46-queued-vs-5-running backlog.
#
# This workflow builds those artifacts once per relevant change on `main` so
# every PR restores them instead of rebuilding.
#
# SPM FOLLOW-UP (app-spm / mobile-spm)
#
# App PR Gate also restores SwiftPM caches under `*-app-spm-*` and
# `*-mobile-spm-*`, keyed on the anchored Package.resolved list. Those keys
# were only ever saved on PR/merge-queue refs, which no other ref can read —
# every MQ candidate therefore started SPM-cold (measured ~4.6GB post-save on
# Mobile after a miss). The `spm` job below resolves packages on hosted
# macos-26 and saves the SAME keys + paths on `main` so MQ/PR restores hit.
# Prefer `xcodebuild -resolvePackageDependencies` over a full app build: the
# checkout + download caches under `.spm-cache-new` and
# `~/.cache/org.swift.swiftpm` are what turn a cold resolve into a hit;
# derived-data from a full compile is optional bulk we deliberately avoid.
#
# SECOND EFFECT -- DE-RACING A SHARED KEY
#
# The signal-ffi cache key intentionally covers the vendored libsignal SHA and
# the build scripts, but NOT SIGNAL_FFI_BUILD_TARGETS, so consumers requesting
# different slices share one key:
#
#   aarch64-apple-darwin          app-pr-gate, headless-app-build,
#                                 computer-use-loopback-test,
#                                 pr-native-fast (host target on hosted arm64)
#   x86_64-apple-darwin           codeql (nightly Swift; codeql-pr is non-Swift)
#
# (burnbar-turbo intentionally does NOT restore these entries: it runs on the
# isolated self-hosted turbo fleet, a different Xcode surface, and builds its
# own artifacts under its turbo-* keys.)
#
# Whichever job saved first won, so a thin single-slice artifact could be
# restored by a consumer that needed a different slice. This job deliberately
# builds the SCRIPT DEFAULT -- all five targets -- so the entry that every PR
# restores is a superset that satisfies all of them. Because entries are
# immutable per key, an exact-key hit here is NOT trusted blindly: the restored
# artifact's metadata is validated against the consumer contract (debug
# profile, all five targets), and a thin entry (e.g. the x86_64-only artifact
# the main-branch CodeQL job can save under this key first) is evicted and
# replaced with the superset. Fixing the key to include the target set is the
# complete fix and is tracked separately; warming a validated superset here
# removes the race in practice without touching six workflows.
#
# TOOLCHAIN ROTATION -- CONTENT, NOT KEY
#
# The cache key covers runner.os, the libsignal SHA and the build scripts, but
# NOT the rolling macos-26 image version or the unpinned `stable` Rust
# toolchain. Left alone, the daily schedule would keep one entry alive forever
# (immutability + touch-on-restore), so an artifact built months ago on an old
# Xcode/rustc surface would keep being restored after the hosted image moved
# on. The key expression cannot grow a new component without editing the same
# expression in six consumer workflows, so rotation happens on CONTENT under
# the SAME key instead: every warm build stamps a provenance sidecar
# (.openburnbar-signal-ffi-warm-provenance.env) with the hosted ImageVersion
# it was built on, and the validation step treats an ImageVersion mismatch
# exactly like a thin entry -- evict, rebuild on the current image, re-save.
# Staleness after an image bump is therefore bounded by the daily schedule
# (~24h), instead of unbounded.

on:
  push:
    branches: [main]
    # Only the inputs that actually change the cache key. Product code does not
    # invalidate these artifacts, so a normal merge does not pay this cost.
    paths:
      - "Vendor/libsignal"
      - ".gitmodules"
      - "scripts/build-signal-ffi-xcframework.sh"
      - "scripts/lib/prepare-signal-ffi-xcframework.sh"
      - ".github/workflows/ci-cache-warm.yml"
      # SPM key inputs (must match hashFiles in app-pr-gate.yml byte-for-byte).
      - "OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - "OpenBurnBarCore/Package.resolved"
      - "OpenBurnBarDaemon/Package.resolved"
      - "Vendor/GRDB-SQLCipher/Package.resolved"
  # GitHub evicts caches untouched for 7 days. A daily pass keeps the entry warm
  # on a quiet week so PRs never silently fall back to a cold build.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Cache entries are immutable per key. Upgrading a thin entry saved by
  # another main-branch writer (see the shared-key note above) requires
  # deleting it before saving the superset, which needs actions: write.
  actions: write

# Never race two warms against the same key; a superseded warm is pointless.
concurrency:
  group: ci-cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal-ffi:
    name: Warm Signal FFI caches
    # Hosted macos-26 on purpose: the PR gates that consume these entries run
    # here, so warming on the same image keeps toolchain provenance identical.
    # The free self-hosted fleet is cheaper but is a different Xcode/Homebrew
    # surface, and a subtly mismatched artifact restored by every PR would be a
    # far worse failure than one hosted job per libsignal bump.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      # Must match the consumers byte for byte or the warmed entry is unreachable.
      - name: Resolve Signal FFI cache identity
        id: signal-ffi-cache
        run: echo "sha=$(git -C Vendor/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore macOS Signal FFI artifact
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Restore iOS Signal FFI artifact
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiIOS.xcframework
          key: ${{ runner.os }}-signal-ffi-ios-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      # An exact-key hit is not proof of health. Other writers share this key
      # and can save a single-target artifact first; consumers validate the
      # metadata that build-signal-ffi-xcframework.sh embeds and rebuild on any
      # mismatch, so a thin entry restored here must be rebuilt and replaced,
      # never trusted just because the key matched. The same check enforces
      # toolchain rotation: the warm-provenance sidecar written below must
      # name the hosted image THIS runner is on, or the entry is treated as
      # stale and rebuilt (see "TOOLCHAIN ROTATION" in the header).
      - name: Validate restored artifacts against the consumer contract
        id: validate
        run: |
          set -euo pipefail
          expected_targets="aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
          is_debug_superset() {
            local fw="$1"
            local meta="${fw}/.openburnbar-signal-ffi-build.env"
            local prov="${fw}/.openburnbar-signal-ffi-warm-provenance.env"
            [[ -d "${fw}" && -f "${meta}" && -f "${prov}" ]] || return 1
            local profile targets target image
            profile="$(sed -n 's/^profile=//p' "${meta}" | head -n 1)"
            targets="$(sed -n 's/^targets=//p' "${meta}" | head -n 1)"
            [[ "${profile}" == "debug" ]] || return 1
            for target in ${expected_targets}; do
              [[ " ${targets} " == *" ${target} "* ]] || return 1
            done
            # Rotation check: the entry must have been warmed on the hosted
            # image this runner is using. ImageVersion is set on every hosted
            # runner; an entry stamped "unknown" or built on an older image is
            # stale and gets rebuilt on the current toolchain surface.
            image="$(sed -n 's/^image_version=//p' "${prov}" | head -n 1)"
            [[ "${image}" != "unknown" && -n "${image}" ]] || return 1
            [[ "${image}" == "${ImageVersion:-unknown}" ]] || return 1
          }
          for entry in macos:Vendor/OpenBurnBarSignalFfiMac.xcframework ios:Vendor/OpenBurnBarSignalFfiIOS.xcframework; do
            name="${entry%%:*}"
            fw="${entry#*:}"
            if is_debug_superset "${fw}"; then
              echo "${fw} already holds the debug all-target superset built on image ${ImageVersion:-unknown}; no rebuild needed."
              echo "build_${name}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${fw} is missing, cannot satisfy every consumer, or predates hosted image ${ImageVersion:-unknown}; will rebuild and replace it."
              echo "build_${name}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install Rust toolchain for libsignal Swift FFI
        if: steps.validate.outputs.build_macos == 'true' || steps.validate.outputs.build_ios == 'true'
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.96.0" # pin: crates/openburnbar-iroh (libsignal lineage)

      - name: Ensure libsignal native toolchain (protoc + cmake)
        if: steps.validate.outputs.build_macos == 'true' || steps.validate.outputs.build_ios == 'true'
        uses: ./.github/actions/ensure-libsignal-toolchain

      # SIGNAL_FFI_BUILD_PROFILE=debug on purpose: every PR consumer goes
      # through prepare-signal-ffi-xcframework.sh, whose CI default resolves to
      # debug (CONFIGURATION is unset on PR gates), and it rejects restored
      # artifacts whose metadata profile differs. A release-profile warm would
      # be restored and immediately rebuilt by every consumer. No
      # SIGNAL_FFI_BUILD_TARGETS: the script default builds all five Apple
      # targets and emits BOTH xcframeworks, so one build warms both entries
      # with a superset every consumer accepts.
      - name: Build debug Signal FFI xcframeworks (all default targets)
        if: steps.validate.outputs.build_macos == 'true' || steps.validate.outputs.build_ios == 'true'
        run: SIGNAL_FFI_BUILD_PROFILE=debug ./scripts/build-signal-ffi-xcframework.sh

      # Stamp both artifacts with the hosted image they were built on. The
      # validation step above requires this stamp to match the current
      # runner's ImageVersion, which is what rotates the (immutable,
      # daily-touched) cache entry when the rolling macos-26 image or its
      # toolchain moves on -- content rotation under the same key, because the
      # key expression is shared byte-for-byte with six consumer workflows.
      # rustc/xcode lines are informational only (they aid post-mortems; the
      # image version is the rotation trigger).
      - name: Record warm provenance in both artifacts
        if: steps.validate.outputs.build_macos == 'true' || steps.validate.outputs.build_ios == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc_version="$(rustc --version 2>/dev/null || echo unknown)"
          xcode_version="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/ $//' || echo unknown)"
          for fw in Vendor/OpenBurnBarSignalFfiMac.xcframework Vendor/OpenBurnBarSignalFfiIOS.xcframework; do
            {
              echo "image_version=${ImageVersion:-unknown}"
              echo "rustc=${rustc_version}"
              echo "xcode=${xcode_version}"
            } > "${fw}/.openburnbar-signal-ffi-warm-provenance.env"
          done

      # Saved cache entries are immutable, so replacing a thin entry means
      # deleting it first. Deleting by key (no ref filter) also clears
      # PR-scoped shadows of the same key so open PRs fall through to the
      # default-branch superset. If another writer re-saves between this
      # eviction and the save below, the save is skipped with a warning and
      # the daily scheduled pass heals the entry.
      - name: Evict stale entries that cannot satisfy every consumer
        if: steps.validate.outputs.build_macos == 'true' || steps.validate.outputs.build_ios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_MACOS: ${{ steps.validate.outputs.build_macos }}
          BUILD_IOS: ${{ steps.validate.outputs.build_ios }}
          MACOS_KEY: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}
          IOS_KEY: ${{ runner.os }}-signal-ffi-ios-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_MACOS}" == "true" ]]; then
            gh cache delete "${MACOS_KEY}" || echo "No existing macOS entry to evict."
          fi
          if [[ "${BUILD_IOS}" == "true" ]]; then
            gh cache delete "${IOS_KEY}" || echo "No existing iOS entry to evict."
          fi

      - name: Save macOS Signal FFI artifact
        if: steps.validate.outputs.build_macos == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiMac.xcframework
          key: ${{ runner.os }}-signal-ffi-macos-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Save iOS Signal FFI artifact
        if: steps.validate.outputs.build_ios == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: Vendor/OpenBurnBarSignalFfiIOS.xcframework
          key: ${{ runner.os }}-signal-ffi-ios-${{ steps.signal-ffi-cache.outputs.sha }}-${{ hashFiles('scripts/build-signal-ffi-xcframework.sh', 'scripts/lib/prepare-signal-ffi-xcframework.sh') }}

      - name: Report what was warmed
        env:
          BUILD_MACOS: ${{ steps.validate.outputs.build_macos }}
          BUILD_IOS: ${{ steps.validate.outputs.build_ios }}
        run: |
          set -euo pipefail
          echo "libsignal SHA: ${{ steps.signal-ffi-cache.outputs.sha }}"
          echo "macOS entry rebuilt this run: ${BUILD_MACOS}"
          echo "iOS entry rebuilt this run:   ${BUILD_IOS}"
          expected_targets="aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
          for fw in Vendor/OpenBurnBarSignalFfiMac.xcframework Vendor/OpenBurnBarSignalFfiIOS.xcframework; do
            meta="${fw}/.openburnbar-signal-ffi-build.env"
            if [[ ! -d "${fw}" || ! -f "${meta}" ]]; then
              echo "::error::${fw} was neither restored nor built; consumers would still rebuild cold."
              exit 1
            fi
            profile="$(sed -n 's/^profile=//p' "${meta}" | head -n 1)"
            targets="$(sed -n 's/^targets=//p' "${meta}" | head -n 1)"
            if [[ "${profile}" != "debug" ]]; then
              echo "::error::${fw} carries profile=${profile:-<missing>}; consumers request debug and would rebuild."
              exit 1
            fi
            for target in ${expected_targets}; do
              if [[ " ${targets} " != *" ${target} "* ]]; then
                echo "::error::${fw} is missing target ${target}; some consumers would still rebuild."
                exit 1
              fi
            done
            echo "--- ${fw} (profile=${profile}, targets=${targets}) slices:"
            # Slice directories are the per-platform arch folders inside the xcframework.
            find "${fw}" -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | sort | sed 's/^/    /'
          done

  spm:
    name: Warm SwiftPM caches
    # Same hosted macos-26 image as App PR Gate consumers. Do not route through
    # MACOS_GATE_POOL — warm must stay on the image PRs/MQ restore from.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: false

      # OpenBurnBarCore's Package.swift probes Vendor/libsignal as a local path
      # dependency; without the submodule, resolve fails before SPM checkouts land.
      - name: Initialize libsignal submodule with retry
        run: bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      # Keys + path lists MUST match app-pr-gate.yml byte-for-byte or the warm
      # entry is unreachable from MQ/PR restores.
      - name: Restore AgentLens SwiftPM cache
        id: restore-app-spm
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .build
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-app-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}

      - name: Restore Mobile SwiftPM cache
        id: restore-mobile-spm
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mobile-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}

      # Cheap populate: resolve clones packages into .spm-cache-new and fills the
      # SwiftPM download cache. Skip a full xcodebuild build — derived-data from
      # compile is the bulk of the ~4.6GB Mobile save and is not required for an
      # SPM checkout hit. FIREBASE_SOURCE_FIRESTORE=1 keeps the committed
      # source-built Firestore graph (docs/FIREBASE_IOS27_GRPC.md).
      - name: Resolve Swift packages into consumer cache paths
        if: steps.restore-app-spm.outputs.cache-hit != 'true' || steps.restore-mobile-spm.outputs.cache-hit != 'true'
        env:
          FIREBASE_SOURCE_FIRESTORE: "1"
        run: |
          set -euo pipefail
          mkdir -p .spm-cache-new .derived-data .build
          resolve_scheme() {
            local scheme="$1"
            local derived=".derived-data/spm-warm-${scheme}"
            local attempt=1
            local max_attempts=3
            local status=0
            while (( attempt <= max_attempts )); do
              status=0
              rm -rf "${derived}"
              mkdir -p "${derived}"
              xcodebuild -resolvePackageDependencies \
                -project OpenBurnBar.xcodeproj \
                -scheme "${scheme}" \
                -clonedSourcePackagesDirPath .spm-cache-new \
                -derivedDataPath "${derived}" \
                && return 0 || status=$?
              # Exit 134 == SIGABRT: known transient Xcode IDE model-graph crash
              # (see scripts/check-openburnbar-app-swiftpm-lock.sh).
              if (( status != 134 )); then
                echo "::error::xcodebuild -resolvePackageDependencies failed for ${scheme} with exit ${status}"
                return "${status}"
              fi
              echo "resolve ${scheme} aborted (exit 134) on attempt ${attempt}/${max_attempts}; retrying."
              attempt=$(( attempt + 1 ))
            done
            echo "::error::resolve ${scheme} aborted (exit 134) on every attempt"
            return "${status}"
          }
          resolve_scheme OpenBurnBar
          resolve_scheme OpenBurnBarMobile
          echo "SPM cache tree sizes after resolve:"
          du -sh .spm-cache-new .derived-data "${HOME}/.cache/org.swift.swiftpm" 2>/dev/null || true

      - name: Save AgentLens SwiftPM cache on main
        if: steps.restore-app-spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .build
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-app-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}

      - name: Save Mobile SwiftPM cache on main
        if: steps.restore-mobile-spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            .spm-cache-new
            .derived-data
            ~/.cache/org.swift.swiftpm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mobile-spm-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarCore/Package.resolved', 'OpenBurnBarDaemon/Package.resolved', 'Vendor/GRDB-SQLCipher/Package.resolved') }}

      - name: Report what was warmed
        env:
          APP_HIT: ${{ steps.restore-app-spm.outputs.cache-hit }}
          MOBILE_HIT: ${{ steps.restore-mobile-spm.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "AgentLens app-spm cache-hit on restore: ${APP_HIT:-false}"
          echo "Mobile mobile-spm cache-hit on restore: ${MOBILE_HIT:-false}"
          if [[ ! -d .spm-cache-new ]]; then
            echo "::error::.spm-cache-new missing after warm; consumers would still resolve cold."
            exit 1
          fi
          echo "--- .spm-cache-new top-level:"
          find .spm-cache-new -maxdepth 1 -mindepth 1 -exec basename {} \; | sort | head -n 40
