name: Deploy Cloud Run Services
run-name: release-control/deploy-cloud-run/${{ inputs.dry_run && 'dry-run' || inputs.existing_tag_retry && 'existing-tag-retry' || github.event_name }}/${{ inputs.tag || github.ref_name }}/${{ inputs.candidate_sha || github.sha }}/${{ github.sha }}

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (v*). Defaults to ref when dispatching from a tag."
        required: false
        type: string
      dry_run:
        description: "Build, test, and Docker smoke only (no Cloud Run deploy)"
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: "Full immutable release-candidate SHA"
        required: false
        type: string
      existing_tag_retry:
        description: "Current-main controlled real retry for an existing stable tag"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: burnbar
  REGION: us-central1
  SERVICE: openburnbar-hosted-mcp
  MCP_RESOURCE: https://mcp.burnbar.ai/mcp
  MCP_AUTH_ISSUER: https://mcp.burnbar.ai

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
      statuses: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
      existing_tag_retry: ${{ steps.tag.outputs.existing_tag_retry }}
      control_sha: ${{ steps.tag.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Stage trusted release attestation helper
        run: install -m 0700 scripts/ci/release-dry-run-attestation.mjs "$RUNNER_TEMP/release-dry-run-attestation.mjs"

      - name: Resolve and verify deploy tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_EXISTING_TAG_RETRY: ${{ inputs.existing_tag_retry }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          IS_DRY_RUN="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]]; then
            IS_DRY_RUN="true"
          fi
          IS_EXISTING_TAG_RETRY="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_EXISTING_TAG_RETRY" == "true" ]]; then
            IS_EXISTING_TAG_RETRY="true"
          fi
          if [[ "$IS_DRY_RUN" == "true" && "$IS_EXISTING_TAG_RETRY" == "true" ]]; then
            echo "::error::dry_run and existing_tag_retry are mutually exclusive."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cloud Run production deploys must resolve to a SemVer v* release tag."
            exit 1
          fi

          # ── Two-phase release safety ─────────────────────────────────────
          # Manual release control is main-only. Existing-tag real retry
          # verifies current-main authority and both exact dry-run receipts
          # before any candidate checkout, build, environment, secret, or OIDC
          # job can begin. Ordinary real deploys remain tag-push-only.
          if [[ "$IS_DRY_RUN" == "true" || "$IS_EXISTING_TAG_RETRY" == "true" ]]; then
            if [[ -z "$INPUT_CANDIDATE_SHA" ]]; then
              echo "::error::Manual release control requires candidate_sha (full immutable release SHA)."
              exit 1
            fi
            if ! [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::candidate_sha must be a full 40-char hex SHA, got: $INPUT_CANDIDATE_SHA"
              exit 1
            fi
            tag_ref="refs/tags/${TAG}"
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" || "$REF_NAME" != "main" ]]; then
              echo "::error::Manual release control must be dispatched from main; tag-selected reruns are forbidden."
              exit 1
            fi

            git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

            git fetch --force --tags origin

            if ! git cat-file -e "$INPUT_CANDIDATE_SHA^{commit}" 2>/dev/null; then
              git fetch --force origin "$INPUT_CANDIDATE_SHA"
            fi
            if ! git cat-file -e "$INPUT_CANDIDATE_SHA^{commit}" 2>/dev/null; then
              echo "::error::candidate_sha $INPUT_CANDIDATE_SHA does not resolve to a commit."
              exit 1
            fi

            main_sha="$(git rev-parse origin/main)"
            if [[ "${GITHUB_SHA:-}" != "$main_sha" ]]; then
              echo "::error::Trusted control workflow SHA ${GITHUB_SHA:-<missing>} != current origin/main $main_sha."
              exit 1
            fi

            if git rev-parse --verify --quiet "$tag_ref" >/dev/null; then
              if [[ ! "$TAG" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Existing-tag recovery and retry are limited to stable SemVer tags."
                exit 1
              fi
              if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
                echo "::error::Existing-tag control requires an annotated release tag: $TAG."
                exit 1
              fi
              tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
              if [[ "$tag_commit" != "$INPUT_CANDIDATE_SHA" ]]; then
                echo "::error::Existing tag $TAG peels to $tag_commit, not candidate_sha $INPUT_CANDIDATE_SHA."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
                echo "::error::Existing release tag $TAG is not reachable from origin/main."
                exit 1
              fi
              if [[ "$IS_DRY_RUN" == "true" ]]; then
                node scripts/ci/verify-existing-tag-dry-run-recovery.mjs \
                  --sha "$INPUT_CANDIDATE_SHA" \
                  --tag "$TAG" \
                  --plane deploy-cloud-run
              else
                node scripts/ci/verify-existing-tag-dry-run-recovery.mjs \
                  --sha "$INPUT_CANDIDATE_SHA" \
                  --tag "$TAG" \
                  --plane deploy-cloud-run \
                  --mode real-retry
                node "$RUNNER_TEMP/release-dry-run-attestation.mjs" verify \
                  --sha "$INPUT_CANDIDATE_SHA" \
                  --tag "$TAG" \
                  --control-sha "$GITHUB_SHA"
              fi
            elif [[ "$IS_EXISTING_TAG_RETRY" == "true" ]]; then
              echo "::error::existing_tag_retry requires an existing immutable stable tag: $TAG."
              exit 1
            elif [[ "$INPUT_CANDIDATE_SHA" != "$main_sha" ]]; then
              echo "::error::candidate_sha $INPUT_CANDIDATE_SHA != origin/main $main_sha."
              echo "::error::A future-tag dry-run must prove the exact commit that will be tagged is current main."
              exit 1
            fi
            commit="$INPUT_CANDIDATE_SHA"
          else
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Manual real deploys must use existing_tag_retry=true from main; tag-selected dispatches and reruns are forbidden."
              exit 1
            fi
            tag_ref="refs/tags/${TAG}"
            if [[ "$EVENT_NAME" != "push" || "$GITHUB_REF" != "$tag_ref" ]]; then
              echo "::error::Ordinary real deploys require the immutable tag-push event for $tag_ref."
              exit 1
            fi

            git fetch --force --tags origin "+${tag_ref}:${tag_ref}"
            git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

            commit="$(git rev-list -n 1 "${tag_ref}^{commit}")"
            if [[ -z "$commit" ]]; then
              echo "::error::Unable to resolve ${tag_ref} to a commit."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::Release tag ${TAG} points at ${commit}, which is not reachable from origin/main."
              exit 1
            fi
          fi

          {
            echo "tag=$TAG"
            echo "commit=$commit"
            echo "dry_run=$IS_DRY_RUN"
            echo "existing_tag_retry=$IS_EXISTING_TAG_RETRY"
            echo "control_sha=${GITHUB_SHA:-}"
          } >> "$GITHUB_OUTPUT"

  build-hosted-mcp-artifact:
    name: Build hosted MCP deploy artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resolve-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/hosted-mcp/package-lock.json

      - name: Build and test hosted MCP
        run: |
          set -euo pipefail
          npm ci --prefix services/hosted-mcp
          npm --prefix services/hosted-mcp test

      - name: Prime Docker base image with bounded registry retry
        run: |
          set -euo pipefail
          image="node:22-bookworm-slim@sha256:53ada149d435c38b14476cb57e4a7da73c15595aba79bd6971b547ceb6d018bf"
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Docker registry did not serve ${image} after ${attempt} attempts."
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Docker registry pull failed; retrying in ${delay}s (attempt ${attempt}/3)."
            sleep "$delay"
          done

      - name: Docker build smoke
        run: docker build -f services/hosted-mcp/Dockerfile --pull=false -t openburnbar-hosted-mcp:deploy-smoke .

      - name: Stage deploy artifact
        id: artifact
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hosted-mcp-deploy-artifact"
          archive="$RUNNER_TEMP/hosted-mcp-deploy-artifact.tgz"
          rm -rf "$artifact_dir" "$archive"
          mkdir -p "$artifact_dir"

          tar \
            --exclude='*/node_modules' \
            --exclude='.git' \
            -cf - \
            services/hosted-mcp \
            packages/entitlements \
            packages/signal-envelope-contracts \
            scripts/build-entitlements.sh \
            scripts/build-signal-envelope-contracts.sh \
            | tar -xf - -C "$artifact_dir"

          (
            cd "$artifact_dir"
            manifest="$RUNNER_TEMP/hosted-mcp-deploy-SHA256SUMS"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$manifest"
            mv "$manifest" SHA256SUMS
          )
          tar -C "$artifact_dir" -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: hosted-mcp-deploy-artifact-${{ needs.resolve-release.outputs.tag }}
          path: ${{ steps.artifact.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  verify-attestations:
    name: Verify dry-run attestations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-release
    if: needs.resolve-release.outputs.dry_run != 'true'
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - name: Check out trusted release attestation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ github.sha }}
          path: .release-attestation-control
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci/release-dry-run-attestation.mjs
          sparse-checkout-cone-mode: false

      - name: Verify dry-run attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_SHA: ${{ needs.resolve-release.outputs.commit }}
          ATTEST_TAG: ${{ needs.resolve-release.outputs.tag }}
          ATTEST_CONTROL_SHA: ${{ needs.resolve-release.outputs.control_sha }}
        run: node .release-attestation-control/scripts/ci/release-dry-run-attestation.mjs verify --sha "$ATTEST_SHA" --tag "$ATTEST_TAG" --control-sha "$ATTEST_CONTROL_SHA"

  deploy-hosted-mcp:
    name: Deploy hosted MCP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve-release
      - build-hosted-mcp-artifact
      - verify-attestations
    if: needs.resolve-release.outputs.dry_run != 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      previous_revision: ${{ steps.current.outputs.previous_revision }}
      latest_revision: ${{ steps.readback.outputs.latest_revision }}
      service_url: ${{ steps.readback.outputs.service_url }}
      storage_bucket: ${{ steps.current.outputs.storage_bucket }}
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (node24-native)
        with:
          name: hosted-mcp-deploy-artifact-${{ needs.resolve-release.outputs.tag }}
          path: ${{ runner.temp }}/hosted-mcp-artifact-download

      - name: Verify deploy artifact
        env:
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/hosted-mcp-deploy-artifact
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_ARTIFACT_DIR"
          tar -xzf "$RUNNER_TEMP/hosted-mcp-artifact-download/hosted-mcp-deploy-artifact.tgz" -C "$DEPLOY_ARTIFACT_DIR"
          (
            cd "$DEPLOY_ARTIFACT_DIR"
            if find . \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q .; then
              echo "::error::Deploy artifact contains a symlink or special file."
              exit 1
            fi
            if find . -type f -links +1 -print -quit | grep -q .; then
              echo "::error::Deploy artifact contains a hard-linked file."
              exit 1
            fi
            sha256sum -c SHA256SUMS
            if test -e scripts/deploy-hosted-mcp.sh; then
              echo "::error::Deploy artifact must not carry the post-auth deploy driver."
              exit 1
            fi
            test -f services/hosted-mcp/cloudbuild.yaml
            test -f services/hosted-mcp/Dockerfile
          )

      - name: Authenticate to Google Cloud (WIF/OIDC only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24-native)
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24-native)

      - name: Verify deployer IAM
        env:
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Cloud Run deploy requires workload identity federation."
            exit 1
          fi
          if [[ -z "${GCP_DEPLOY_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT is not configured for the production environment."
            exit 1
          fi
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > deployer-iam-policy.json
          python3 - "$GCP_DEPLOY_SERVICE_ACCOUNT" deployer-iam-policy.json <<'PY'
          import json
          import sys

          service_account = sys.argv[1]
          path = sys.argv[2]
          required = {
              "roles/run.admin",
              "roles/cloudbuild.builds.editor",
              "roles/iam.serviceAccountUser",
              "roles/artifactregistry.admin",
          }
          forbidden = {
              "roles/secretmanager.admin",
              "roles/secretmanager.secretAccessor",
              "roles/secretmanager.secretVersionAdder",
              "roles/secretmanager.secretVersionManager",
          }
          metadata_only_roles = {
              "roles/secretmanager.viewer",
          }
          member = f"serviceAccount:{service_account}"
          with open(path, encoding="utf-8") as handle:
              policy = json.load(handle)
          roles = {
              binding.get("role")
              for binding in policy.get("bindings", [])
              if member in binding.get("members", [])
          }
          missing = sorted(required - roles)
          if missing:
              print(f"::error::Deploy service account {service_account} is missing required project IAM roles: {', '.join(missing)}")
              sys.exit(1)
          present_forbidden = sorted(forbidden & roles)
          if present_forbidden:
              print(f"::error::Deploy service account {service_account} must not hold project-wide Secret Manager payload/write roles: {', '.join(present_forbidden)}")
              sys.exit(1)
          missing_metadata_roles = sorted(metadata_only_roles - roles)
          if missing_metadata_roles:
              print(f"::error::Deploy service account {service_account} must have read-only Secret Manager metadata access: {', '.join(missing_metadata_roles)}")
              sys.exit(1)
          print(f"deployer IAM ok: {service_account}")
          PY

      - name: Capture current Cloud Run state
        id: current
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > cloud-run-hosted-mcp-before.json
          python3 - cloud-run-hosted-mcp-before.json <<'PY'
          import json
          import os
          import sys

          def env_value(service, name):
              containers = (
                  service.get("spec", {})
                  .get("template", {})
                  .get("spec", {})
                  .get("containers", [])
              )
              for container in containers:
                  for item in container.get("env", []):
                      if item.get("name") == name:
                          return item.get("value")
              return None

          with open(sys.argv[1], encoding="utf-8") as handle:
              service = json.load(handle)

          revision = service.get("status", {}).get("latestReadyRevisionName")
          service_url = service.get("status", {}).get("url")
          bucket = env_value(service, "OPENBURNBAR_STORAGE_BUCKET")
          issuer = env_value(service, "MCP_AUTH_ISSUER") or "<unset>"
          runtime_service_account = (
              service.get("spec", {})
              .get("template", {})
              .get("spec", {})
              .get("serviceAccountName")
          )

          if not revision:
              print("::error::Cloud Run service has no latestReadyRevisionName; refusing deploy without a rollback target.")
              sys.exit(1)
          if not bucket:
              print("::error::Cloud Run service is missing OPENBURNBAR_STORAGE_BUCKET; refusing deploy rather than clearing body storage config.")
              sys.exit(1)
          if not runtime_service_account:
              print("::error::Cloud Run service must pin an explicit runtime service account before signer secrets can be attached.")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"previous_revision={revision}\n")
              output.write(f"service_url={service_url}\n")
              output.write(f"storage_bucket={bucket}\n")
              output.write(f"previous_issuer={issuer}\n")
              output.write(f"runtime_service_account={runtime_service_account}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"OPENBURNBAR_STORAGE_BUCKET={bucket}\n")

          print(f"previous revision: {revision}")
          print(f"service url: {service_url}")
          print(f"storage bucket: {bucket}")
          print(f"previous issuer: {issuer}")
          print(f"runtime service account: {runtime_service_account}")
          PY

      - name: Deploy hosted MCP
        id: deploy
        env:
          DEPLOY_SOURCE_DIR: ${{ runner.temp }}/hosted-mcp-deploy-artifact
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          OPENBURNBAR_SOURCE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
          OPENBURNBAR_CORRESPONDING_SOURCE_URL: https://burnbar.ai/legal/source
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ steps.current.outputs.runtime_service_account }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "::error::No Google application credentials from WIF/OIDC auth. Cloud Run deploy requires workload identity federation."
            exit 1
          fi
          if [[ -z "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::Missing Cloud Run runtime service account; refusing to attach signer secrets."
            exit 1
          fi

          cd "$DEPLOY_SOURCE_DIR"

          SECRET_NAME="${REMOTE_MCP_TOKEN_HMAC_SECRET_NAME:-REMOTE_MCP_TOKEN_HMAC_SECRET}"
          ED25519_PRIVATE_SECRET_NAME="${REMOTE_MCP_TOKEN_ED25519_PRIVATE_KEY_SECRET_NAME:-REMOTE_MCP_TOKEN_ED25519_PRIVATE_KEY_BASE64}"
          ED25519_PUBLIC_SECRET_NAME="${MCP_TOKEN_ED25519_PUBLIC_KEY_SECRET_NAME:-MCP_TOKEN_ED25519_PUBLIC_KEY_BASE64}"
          IMAGE="gcr.io/${GOOGLE_CLOUD_PROJECT}/${SERVICE}:${OPENBURNBAR_SOURCE_COMMIT:0:12}"
          ENV_VARS="MCP_RESOURCE=${MCP_RESOURCE},MCP_AUTH_ISSUER=${MCP_AUTH_ISSUER},OPENBURNBAR_SOURCE_COMMIT=${OPENBURNBAR_SOURCE_COMMIT},OPENBURNBAR_CORRESPONDING_SOURCE_URL=${OPENBURNBAR_CORRESPONDING_SOURCE_URL}"
          SECRET_BINDINGS=()

          for forbidden_secret_env in \
            REMOTE_MCP_TOKEN_HMAC_SECRET \
            REMOTE_MCP_TOKEN_ED25519_PRIVATE_KEY_BASE64 \
            MCP_TOKEN_ED25519_PUBLIC_KEY_BASE64
          do
            if [[ -n "${!forbidden_secret_env:-}" ]]; then
              echo "::error::Production Cloud Run deploy must not receive signer secret values. Rotate signer secrets out-of-band, then deploy with read-only Secret Manager bindings."
              exit 1
            fi
          done

          if [[ -n "${OPENBURNBAR_STORAGE_BUCKET:-}" ]]; then
            ENV_VARS="${ENV_VARS},OPENBURNBAR_STORAGE_BUCKET=${OPENBURNBAR_STORAGE_BUCKET}"
          fi

          verify_runtime_secret_accessor() {
            local secret_name="$1"
            local policy_file
            policy_file="$(mktemp)"
            gcloud secrets get-iam-policy "$secret_name" \
              --project "$GOOGLE_CLOUD_PROJECT" \
              --format=json > "$policy_file"
            python3 - "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" "$secret_name" "$policy_file" <<'PY'
          import json
          import sys

          runtime_service_account = sys.argv[1]
          secret_name = sys.argv[2]
          policy_path = sys.argv[3]
          member = f"serviceAccount:{runtime_service_account}"
          with open(policy_path, encoding="utf-8") as handle:
              policy = json.load(handle)
          for binding in policy.get("bindings", []):
              if binding.get("role") == "roles/secretmanager.secretAccessor" and member in binding.get("members", []):
                  raise SystemExit(0)
          print(f"::error::Cloud Run runtime service account {runtime_service_account} must have per-secret roles/secretmanager.secretAccessor on {secret_name}; project-wide payload access is not accepted.")
          raise SystemExit(1)
          PY
            rm -f "$policy_file"
          }

          if gcloud secrets describe "$SECRET_NAME" --project "$GOOGLE_CLOUD_PROJECT" >/dev/null 2>&1; then
            verify_runtime_secret_accessor "$SECRET_NAME"
            SECRET_BINDINGS+=("MCP_TOKEN_HMAC_SECRET=${SECRET_NAME}:latest")
          fi
          if gcloud secrets describe "$ED25519_PRIVATE_SECRET_NAME" --project "$GOOGLE_CLOUD_PROJECT" >/dev/null 2>&1; then
            verify_runtime_secret_accessor "$ED25519_PRIVATE_SECRET_NAME"
            SECRET_BINDINGS+=("MCP_TOKEN_ED25519_PRIVATE_KEY_BASE64=${ED25519_PRIVATE_SECRET_NAME}:latest")
          fi
          if gcloud secrets describe "$ED25519_PUBLIC_SECRET_NAME" --project "$GOOGLE_CLOUD_PROJECT" >/dev/null 2>&1; then
            verify_runtime_secret_accessor "$ED25519_PUBLIC_SECRET_NAME"
            SECRET_BINDINGS+=("MCP_TOKEN_ED25519_PUBLIC_KEY_BASE64=${ED25519_PUBLIC_SECRET_NAME}:latest")
            ENV_VARS="${ENV_VARS},MCP_ALLOW_LEGACY_HMAC_TOKENS=${MCP_ALLOW_LEGACY_HMAC_TOKENS:-false}"
          fi

          if [[ "${#SECRET_BINDINGS[@]}" -eq 0 ]]; then
            echo "::error::At least one hosted MCP token signer must be configured: Ed25519 private/public secrets or legacy HMAC."
            exit 1
          fi
          if [[ "${SECRET_BINDINGS[*]}" == *"MCP_TOKEN_ED25519_PRIVATE_KEY_BASE64="* && "${SECRET_BINDINGS[*]}" != *"MCP_TOKEN_ED25519_PUBLIC_KEY_BASE64="* ]]; then
            echo "::error::Ed25519 private key is configured but MCP_TOKEN_ED25519_PUBLIC_KEY_BASE64 is missing."
            exit 1
          fi
          SET_SECRETS="$(IFS=,; echo "${SECRET_BINDINGS[*]}")"

          build_output="$(gcloud builds submit "$DEPLOY_SOURCE_DIR" \
            --config "$DEPLOY_SOURCE_DIR/services/hosted-mcp/cloudbuild.yaml" \
            --substitutions "_IMAGE=${IMAGE}" \
            --suppress-logs \
            --async \
            --format=json \
            --project "$GOOGLE_CLOUD_PROJECT")"

          build_id="$(python3 -c '
          import json
          import re
          import sys

          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = {}

          paths = (
              ("metadata", "build", "id"),
              ("metadata", "build", "name"),
              ("response", "id"),
              ("response", "name"),
              ("id",),
              ("name",),
          )
          for path in paths:
              node = data
              for key in path:
                  if not isinstance(node, dict):
                      node = None
                      break
                  node = node.get(key)
              if isinstance(node, str) and node:
                  print(node.rsplit("/", 1)[-1])
                  raise SystemExit(0)

          match = re.search(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", raw)
          if match:
              print(match.group(0))
          ' <<<"$build_output")"

          if [[ -z "$build_id" ]]; then
            echo "::error::Unable to determine Cloud Build ID from gcloud output."
            echo "$build_output" >&2
            exit 1
          fi

          echo "Cloud Build submitted: ${build_id}"
          echo "Cloud Build logs: https://console.cloud.google.com/cloud-build/builds/${build_id}?project=${GOOGLE_CLOUD_PROJECT}"

          poll_interval="${CLOUD_BUILD_POLL_INTERVAL_SECONDS:-10}"
          deadline=$((SECONDS + ${CLOUD_BUILD_TIMEOUT_SECONDS:-1800}))
          while true; do
            status="$(gcloud builds describe "$build_id" \
              --project "$GOOGLE_CLOUD_PROJECT" \
              --format='value(status)')"

            case "$status" in
              SUCCESS)
                echo "Cloud Build succeeded: ${build_id}"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build failed with status ${status}: ${build_id}"
                exit 1
                ;;
              QUEUED|WORKING|PENDING|"")
                if [[ "$SECONDS" -ge "$deadline" ]]; then
                  echo "::error::Cloud Build timed out waiting for ${build_id}; last status: ${status:-unknown}"
                  exit 1
                fi
                echo "Cloud Build ${build_id} status: ${status:-unknown}; waiting ${poll_interval}s..."
                sleep "$poll_interval"
                ;;
              *)
                if [[ "$SECONDS" -ge "$deadline" ]]; then
                  echo "::error::Cloud Build timed out waiting for ${build_id}; last status: ${status}"
                  exit 1
                fi
                echo "Cloud Build ${build_id} status: ${status}; waiting ${poll_interval}s..."
                sleep "$poll_interval"
                ;;
            esac
          done

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances "${MIN_INSTANCES:-0}" \
            --max-instances "${MAX_INSTANCES:-20}" \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SET_SECRETS"

          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --to-latest

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$GOOGLE_CLOUD_PROJECT" --format='value(status.url)')"
          HEALTH_PATH="${MCP_HEALTH_PATH:-/readyz}"
          HEALTH_URL="${SERVICE_URL%/}${HEALTH_PATH}"
          RETRIES="${DEPLOY_HEALTH_RETRIES:-12}"
          SLEEP_SEC="${DEPLOY_HEALTH_SLEEP_SEC:-10}"
          attempt=1
          while [[ "$attempt" -le "$RETRIES" ]]; do
            if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
              echo "OK: ${HEALTH_URL}"
              exit 0
            fi
            echo "waiting for ${HEALTH_URL} (${attempt}/${RETRIES})..."
            sleep "$SLEEP_SEC"
            attempt=$((attempt + 1))
          done
          echo "::error::${HEALTH_URL} did not become healthy"
          exit 1

      - name: Read back hosted MCP deployment
        id: readback
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > cloud-run-hosted-mcp-after.json
          python3 - cloud-run-hosted-mcp-after.json <<'PY'
          import json
          import os
          import sys

          def env_value(service, name):
              containers = (
                  service.get("spec", {})
                  .get("template", {})
                  .get("spec", {})
                  .get("containers", [])
              )
              for container in containers:
                  for item in container.get("env", []):
                      if item.get("name") == name:
                          return item.get("value")
              return None

          with open(sys.argv[1], encoding="utf-8") as handle:
              service = json.load(handle)

          status = service.get("status", {})
          latest = status.get("latestReadyRevisionName")
          service_url = status.get("url")
          traffic = status.get("traffic", [])
          traffic_ok = any(
              entry.get("percent") == 100
              and (entry.get("revisionName") == latest or entry.get("latestRevision") is True)
              for entry in traffic
          )

          expected_bucket = os.environ["OPENBURNBAR_STORAGE_BUCKET"]
          bucket = env_value(service, "OPENBURNBAR_STORAGE_BUCKET")
          resource = env_value(service, "MCP_RESOURCE")
          issuer = env_value(service, "MCP_AUTH_ISSUER")

          errors = []
          if not latest:
              errors.append("missing latestReadyRevisionName")
          if not traffic_ok:
              errors.append("100% traffic is not on the latest ready revision")
          if bucket != expected_bucket:
              errors.append(f"OPENBURNBAR_STORAGE_BUCKET drifted: expected {expected_bucket}, got {bucket}")
          if resource != os.environ["MCP_RESOURCE"]:
              errors.append(f"MCP_RESOURCE drifted: expected {os.environ['MCP_RESOURCE']}, got {resource}")
          if issuer != os.environ["MCP_AUTH_ISSUER"]:
              errors.append(f"MCP_AUTH_ISSUER drifted: expected {os.environ['MCP_AUTH_ISSUER']}, got {issuer}")

          evidence = {
              "service": os.environ["SERVICE"],
              "project": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "tag": os.environ["DEPLOY_TAG"],
              "sourceCommit": os.environ["DEPLOY_SOURCE_COMMIT"],
              "previousRevision": os.environ["PREVIOUS_REVISION"],
              "latestReadyRevisionName": latest,
              "serviceUrl": service_url,
              "traffic": traffic,
              "environment": {
                  "MCP_RESOURCE": resource,
                  "MCP_AUTH_ISSUER": issuer,
                  "OPENBURNBAR_STORAGE_BUCKET": bucket,
              },
          }
          with open("cloud-run-hosted-mcp-deploy.json", "w", encoding="utf-8") as output:
              json.dump(evidence, output, indent=2, sort_keys=True)
              output.write("\n")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"latest_revision={latest}\n")
              output.write(f"service_url={service_url}\n")

          print(f"latest revision: {latest}")
          print(f"service url: {service_url}")
          PY
        env:
          DEPLOY_TAG: ${{ needs.resolve-release.outputs.tag }}
          DEPLOY_SOURCE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
          PREVIOUS_REVISION: ${{ steps.current.outputs.previous_revision }}

      - name: Auto-rollback hosted MCP on failed deploy
        if: ${{ always() && (steps.deploy.outcome == 'failure' || steps.readback.outcome == 'failure') }}
        run: |
          set -euo pipefail
          PREVIOUS_REVISION="${{ steps.current.outputs.previous_revision }}"
          if [[ -z "$PREVIOUS_REVISION" ]]; then
            echo "::error::No previous revision captured; cannot run safe revision-pin rollback."
            exit 1
          fi
          echo "::warning::Hosted MCP deploy unhealthy (deploy=${{ steps.deploy.outcome }}, readback=${{ steps.readback.outcome }}) - rolling back to ${PREVIOUS_REVISION}."
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-revisions "${PREVIOUS_REVISION}=100"

      - name: Upload Cloud Run deploy artifact
        if: always() && hashFiles('cloud-run-hosted-mcp-deploy.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: cloud-run-hosted-mcp-${{ needs.resolve-release.outputs.tag }}
          path: cloud-run-hosted-mcp-deploy.json
          if-no-files-found: ignore

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Cloud Run hosted-MCP deploy"
            echo "- Tag: ${{ needs.resolve-release.outputs.tag }}"
            echo "- Commit: ${{ needs.resolve-release.outputs.commit }}"
            echo "- Dry run: ${{ needs.resolve-release.outputs.dry_run }}"
            echo "- Project: ${PROJECT_ID}"
            echo "- Region: ${REGION}"
            echo "- Service: ${SERVICE}"
            echo "- Previous revision: ${{ steps.current.outputs.previous_revision }}"
            echo "- Latest revision: ${{ steps.readback.outputs.latest_revision }}"
            echo "- Storage bucket: ${{ steps.current.outputs.storage_bucket }}"
            echo "- MCP resource: ${MCP_RESOURCE}"
            echo "- MCP auth issuer: ${MCP_AUTH_ISSUER}"
            echo ""
            echo "### Rollback"
            echo "- AUTOMATED: a failed deploy or readback pins traffic back to:"
            echo "  \`gcloud run services update-traffic ${SERVICE} --region ${REGION} --project ${PROJECT_ID} --to-revisions ${{ steps.current.outputs.previous_revision }}=100\`"
            echo "- MANUAL: choose any previous-good revision from:"
            echo "  \`gcloud run revisions list --service ${SERVICE} --region ${REGION} --project ${PROJECT_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cloud-run-dry-run-summary:
    name: Cloud Run dry-run summary
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-hosted-mcp-artifact
    if: needs.resolve-release.outputs.dry_run == 'true'
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          fetch-depth: 1
          submodules: false

      - name: Check out trusted release attestation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ github.sha }}
          path: .release-attestation-control
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci/release-dry-run-attestation.mjs
          sparse-checkout-cone-mode: false

      - name: Dry-run skip deploy
        run: |
          {
            echo "## Cloud Run hosted-MCP deploy"
            echo "- Tag: ${{ needs.resolve-release.outputs.tag }}"
            echo "- Commit: ${{ needs.resolve-release.outputs.commit }}"
            echo "- Dry run: true"
            echo "- Result: built, tested, Docker-smoked, and staged a deploy artifact; skipped production deploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dry-run attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_SHA: ${{ needs.resolve-release.outputs.commit }}
          ATTEST_TAG: ${{ needs.resolve-release.outputs.tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .release-attestation-control/scripts/ci/release-dry-run-attestation.mjs publish --sha "$ATTEST_SHA" --tag "$ATTEST_TAG" --plane deploy-cloud-run

  cloud-run-deploy-result:
    name: Cloud Run deploy result
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-hosted-mcp-artifact
      - deploy-hosted-mcp
    if: always() && needs.resolve-release.outputs.dry_run != 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          fetch-depth: 1
          submodules: false

      - name: Fail when deploy job did not succeed
        if: ${{ needs.deploy-hosted-mcp.result != 'success' }}
        run: |
          echo "::error::deploy-hosted-mcp result was ${{ needs.deploy-hosted-mcp.result }}"
          exit 1

      - name: Record Cloud Run deploy failure
        if: ${{ always() && needs.deploy-hosted-mcp.result != 'success' }}
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: deploy-cloud-run
          title-prefix: Cloud Run deploy failed
          summary: >-
            The hosted MCP Cloud Run deploy, health check, or post-deploy
            readback failed. Production traffic should be verified against the
            rollback revision before release continues.
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

      - name: Close resolved Cloud Run deploy failure issue
        if: ${{ needs.deploy-hosted-mcp.result == 'success' }}
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: deploy-cloud-run
          title-prefix: Cloud Run deploy failed
