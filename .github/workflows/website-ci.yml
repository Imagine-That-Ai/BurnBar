name: Website CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      # Inputs of website/scripts/generate-crypto-claims.mjs — a change to any
      # of these can make the committed crypto-claims copy stale.
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run verify
