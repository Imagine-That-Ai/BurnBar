name: Website CI

concurrency:
  group: website-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  # Only pull_request runs share a group and get cancelled. merge_group runs are
  # the merge-queue's own proof and `push` runs are the per-commit post-merge
  # record, so both get a unique per-run group that can never collide: a shared
  # group evicts a *pending* run even with cancel-in-progress false, because
  # GitHub keeps at most one queued run per group. Same pattern and reasoning as
  # `.github/workflows/security-pr.yml`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "website/**"
      - "analytics/**"
      - "workers/analytics-collector/**"
      - ".github/workflows/website-ci.yml"
      # Inputs of website/scripts/generate-crypto-claims.mjs — a change to any
      # of these can make the committed crypto-claims copy stale.
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "analytics/**"
      - "workers/analytics-collector/**"
      - ".github/workflows/website-ci.yml"
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run verify
