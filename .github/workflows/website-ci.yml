name: Website CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      # Inputs of website/scripts/generate-crypto-claims.mjs — a change to any
      # of these can make the committed crypto-claims copy stale.
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - "docs/security/crypto-architecture-policy.json"
      - "packages/libsignal-bridge/package.json"
      - "third_party/libsignal/runtime-readiness.json"

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions (router research import)
        run: npm ci && npm run build
        working-directory: functions

      - name: Build and verify website
        run: npm run verify
