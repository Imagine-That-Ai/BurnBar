name: Workflow Lint

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/actions/ops-failure-issue/**"
      - ".jscpd.json"
      - "scripts/ci/verify-github-action-pins.mjs"
      - "scripts/ci/verify-agent-repair-loop-prompts.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.test.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.test.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.test.mjs"
      - "scripts/ci/verify-curl-bearer-token-boundary.sh"
      - "scripts/ci/verify-curl-bearer-token-boundary.test.sh"
      - "scripts/lib/curl-bearer.sh"
      - "scripts/lib/curl-bearer.test.sh"
      - "scripts/lib/prepare-signal-ffi-xcframework.sh"
      - "scripts/lib/prepare-signal-ffi-xcframework.test.sh"
      - "scripts/hooks/pre-push"
      - "scripts/hooks/pre-push.test.sh"
      - "scripts/ci/verify-release-provenance-boundaries.mjs"
      - "scripts/ci/verify-release-provenance-boundaries.test.mjs"
      - "scripts/ci/check_burnbar_release_preflight.py"
      - "scripts/ci/check_burnbar_release_preflight.test.py"
      - "scripts/ci/check-firestore-rules-size.mjs"
      - "scripts/ci/check-firestore-rules-size.test.mjs"
      - "scripts/ci/compact-firestore-rules-inplace.mjs"
      - "scripts/generate-macos-appcast.mjs"
      - "scripts/generate-macos-appcast.test.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.test.mjs"
      - "scripts/ci/verify-staging-functions-deploy-boundary.mjs"
      - "scripts/ci/verify-staging-functions-deploy-boundary.test.mjs"
      - "scripts/ci/prepare-scoped-functions-deploy.mjs"
