      - "scripts/ci/verify-hosting-deploy-boundary.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.test.mjs"
      - "scripts/ci/verify-staging-functions-deploy-boundary.mjs"
      - "scripts/ci/verify-staging-functions-deploy-boundary.test.mjs"
      - "scripts/ci/prepare-scoped-functions-deploy.mjs"
      - "scripts/ci/prepare-scoped-functions-deploy.test.mjs"
