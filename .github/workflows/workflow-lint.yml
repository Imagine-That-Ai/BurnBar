jobs:
  actionlint:
    runs-on: ubuntu-latest
    # PR run 31396653617 spent the full former 10-minute budget in checkout
    # on 2026-08-10, before actionlint or any workflow self-test could run.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # actionlint v1.7.12's go.mod requires go >= 1.25.0. 1.24.4 plus
          # GOTOOLCHAIN=local fails the install step:
          #   github.com/rhysd/actionlint@v1.7.12 requires go >= 1.25.0
          #   (running go 1.24.4; GOTOOLCHAIN=local)
          # Honest red: dependabot #2424 Workflow Lint run 33095280213
          # (Thu 2026-08-27 11:52 CT). This job is the live proof.
          go-version: "1.25.0"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow files
        run: |
          "$HOME/go/bin/actionlint" -color

      - name: Verify merge queue required-check coverage
        run: |
          node scripts/ci/verify-merge-queue-workflows.mjs
          node scripts/ci/verify-merge-queue-workflows.test.mjs

      # Two xcframeworks shipping a bare `Headers/module.modulemap` both claim
      # `include/module.modulemap` and break every iOS archive, which blocked
      # all releases in August 2026. One is safe; a second is not.
      - name: Verify xcframework module map collision limit
        run: |
          node scripts/ci/verify-xcframework-modulemap-collision.mjs
          node --test scripts/ci/verify-xcframework-modulemap-collision.test.mjs

      # Two defects that fail silently rather than red: a job that inherits a
      # skipped upstream through `needs` and is never scheduled, and a `paths:`
      # filter that omits a script the workflow runs, so fixing that script
      # triggers nothing. Both took burnbar.ai down for a month in August 2026
      # with every check green. See docs/CI_RELEASE_RUNBOOK.md.
      - name: Verify workflow reachability
        run: |
          node scripts/ci/verify-workflow-reachability.mjs
          node --test scripts/ci/verify-workflow-reachability.test.mjs

      # A macOS Swift job that builds libsignal without this preflight fails only
      # on the self-hosted half of the fleet, and only as an opaque cargo panic
      # ("is `cmake` not installed?"). That blocked the merge queue for days.
      - name: Verify libsignal native toolchain preflight coverage
        run: |
          node scripts/ci/verify-libsignal-toolchain-preflight.mjs
          node scripts/ci/verify-libsignal-toolchain-preflight.test.mjs

      - name: Verify CI cache warm contract (Signal FFI + SPM on main)
        run: node --test scripts/ci/verify-ci-cache-warm.test.mjs

      - name: Verify GitHub Actions pins
        run: |
          node scripts/ci/verify-github-action-pins.mjs
          node scripts/ci/verify-github-action-pins.test.mjs

      - name: Self-test Firebase CI config generation
        run: node scripts/ci/write-firebase-hosting-ci-config.test.mjs

      - name: Self-test QA artifact redaction
        run: node scripts/ci/redact-qa-artifacts.test.mjs

      - name: Self-test App Check smoke fail-closed gate
        run: bash scripts/ci/app-check-smoke.test.sh

      - name: Self-test Apple DeviceCheck production gate
        run: bash scripts/ops/verify-firestore-app-check-enforcement.test.sh

      - name: Self-test mobile test destination selection
        run: bash scripts/ci/test-openburnbar-mobile.test.sh

      - name: Self-test duplicate-code report verifier
        run: node scripts/ci/verify-jscpd-report.test.mjs

      - name: Self-test ops failure issue (escalation + paging)
        run: node --test .github/actions/ops-failure-issue/escalation.test.cjs .github/actions/ops-failure-issue/paging-wiring.test.cjs .github/actions/ops-failure-issue/paging-payload.test.cjs

      - name: Self-test release attestation verifier
        run: bash scripts/ci/verify-release-attestations.test.sh

      - name: Self-test protected Google Play publisher
        run: |
          node --test \
            scripts/ci/google-play-publication.test.mjs \
            scripts/ci/google-play-safe-retry.test.mjs

      - name: Self-test audited GitHub release promotion
        run: |
          node --test \
