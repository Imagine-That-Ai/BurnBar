      - "scripts/ci/verify-native-build-workflow-secret-boundary.test.mjs"
      - "scripts/ci/verify-ops-plane-workflow-boundary.mjs"
      - "scripts/ci/verify-ops-plane-workflow-boundary.test.mjs"
      - "scripts/ci/verify-pr-harness-aggregate-gates.mjs"
      - "scripts/ci/verify-pr-harness-aggregate-gates.test.mjs"
      - "scripts/diff-coverage-ts.sh"
      - "scripts/diff-coverage-ts-self-test.sh"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.mjs"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.test.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.test.mjs"
      - "scripts/ci/redact-qa-artifacts.mjs"
      - "scripts/ci/redact-qa-artifacts.test.mjs"
      - "scripts/ci/app-check-smoke.sh"
      - "scripts/ci/app-check-smoke.test.sh"
      - "scripts/ci/verify-jscpd-report.mjs"
      - "scripts/ci/verify-jscpd-report.test.mjs"
      - "scripts/ci/verify-release-attestations.sh"
      - "scripts/ci/verify-release-attestations.test.sh"
      - "scripts/ci/verify-release-tag-safety.mjs"
      - "scripts/ci/verify-release-tag-safety.test.mjs"
      - "scripts/ci/verify-release-tag-safety.functional.test.mjs"
      - "scripts/ci/release-dry-run-attestation.mjs"
      - "scripts/ci/release-dry-run-attestation.test.mjs"
      - "scripts/ops/run-firestore-restore-drill.sh"
      - "scripts/ops/run-firestore-restore-drill.test.sh"
      - "scripts/ops/verify-firestore-app-check-enforcement.sh"
      - "scripts/ops/verify-firestore-app-check-enforcement.test.sh"
      - "scripts/ci/verify-signal-rule0.sh"
      - "scripts/ci/verify-signal-rule0.test.sh"
      - "scripts/ci/verify-vendored-agent-source.sh"
      - "scripts/ci/verify-libsignal-submodule-delta.sh"
      - "scripts/ci/verify-scanner-governance.test.mjs"
