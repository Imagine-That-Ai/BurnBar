name: Workflow Lint

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/CODEOWNERS"
      - "scripts/ci/verify-github-action-pins.mjs"
      - "scripts/ci/verify-supply-chain-hardening.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/CODEOWNERS"
      - "scripts/ci/verify-github-action-pins.mjs"
      - "scripts/ci/verify-supply-chain-hardening.sh"
  merge_group:
    branches: [main]
    types: [checks_requested]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.4"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow files
        run: |
          "$HOME/go/bin/actionlint" -color

      - name: Verify GitHub Actions pins
        run: node scripts/ci/verify-github-action-pins.mjs

      # Cure53 supply-chain / CI hardening invariants (T-SC-02..T-SC-10):
      # asserts the fail-closed controls in the release/deploy/provenance
      # workflows and CODEOWNERS are still present, so a future edit cannot
      # silently re-open a fail-open path.
      - name: Verify supply-chain hardening invariants
        run: bash scripts/ci/verify-supply-chain-hardening.sh
