  merge_group:
    branches: [main]
    types: [checks_requested]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.4"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow files
        run: |
          "$HOME/go/bin/actionlint" -color

      - name: Verify GitHub Actions pins
        run: node scripts/ci/verify-github-action-pins.mjs

      - name: Self-test Firebase CI config generation
        run: node scripts/ci/write-firebase-hosting-ci-config.test.mjs

      - name: Self-test QA artifact redaction
        run: node scripts/ci/redact-qa-artifacts.test.mjs

      - name: Self-test App Check smoke fail-closed gate
        run: bash scripts/ci/app-check-smoke.test.sh

      - name: Self-test Apple DeviceCheck production gate
        run: bash scripts/ops/verify-firestore-app-check-enforcement.test.sh

      - name: Self-test duplicate-code report verifier
        run: node scripts/ci/verify-jscpd-report.test.mjs

      - name: Self-test ops failure issue (escalation + paging)
        run: node --test .github/actions/ops-failure-issue/escalation.test.cjs .github/actions/ops-failure-issue/paging-wiring.test.cjs .github/actions/ops-failure-issue/paging-payload.test.cjs

      - name: Self-test release attestation verifier
        run: bash scripts/ci/verify-release-attestations.test.sh

      - name: Self-test Firestore restore drill env validation
        run: bash scripts/ops/run-firestore-restore-drill.test.sh

      - name: Check functional QA runner syntax
        run: bash -n tools/qa/run-functional-qa.sh

      - name: Check vendored supply-chain guard syntax
        run: |
          bash -n scripts/ci/verify-signal-rule0.sh
          bash -n scripts/ci/verify-signal-rule0.test.sh
          bash -n scripts/ci/verify-vendored-agent-source.sh
          bash -n scripts/ci/verify-libsignal-submodule-delta.sh

      - name: Self-test Rule-0 guard
        run: bash scripts/ci/verify-signal-rule0.test.sh

      - name: Verify agent repair loop prompts
        run: node scripts/ci/verify-agent-repair-loop-prompts.mjs

      - name: Self-test agent repair loop provenance verifier
        run: node scripts/ci/verify-agent-repair-loop-provenance.test.mjs

      - name: Verify agent repair loop provenance
        run: node scripts/ci/verify-agent-repair-loop-provenance.mjs

      - name: Self-test agent workflow boundary verifier
        run: node scripts/ci/verify-agent-workflow-boundaries.test.mjs

      - name: Verify agent workflow boundaries
        run: node scripts/ci/verify-agent-workflow-boundaries.mjs

      - name: Self-test PR secret boundaries
        run: node scripts/ci/verify-pr-secret-boundaries.test.mjs

      - name: Verify PR secret boundaries
        run: node scripts/ci/verify-pr-secret-boundaries.mjs

      - name: Self-test curl bearer-token argv boundary
        run: bash scripts/ci/verify-curl-bearer-token-boundary.test.sh

      - name: Verify curl bearer-token argv boundary
        run: bash scripts/ci/verify-curl-bearer-token-boundary.sh

      - name: Self-test curl bearer helper
        run: bash scripts/lib/curl-bearer.test.sh

      - name: Self-test Signal FFI XCFramework prepare boundary
        run: bash scripts/lib/prepare-signal-ffi-xcframework.test.sh

      - name: Self-test release provenance boundaries
        run: node scripts/ci/verify-release-provenance-boundaries.test.mjs

      - name: Self-test BurnBar release preflight imports
        run: python3 scripts/ci/check_burnbar_release_preflight.test.py

      - name: Self-test Firestore rules size tripwire
        run: node scripts/ci/check-firestore-rules-size.test.mjs

      - name: Self-test preserve/* tag pre-push guard
        run: bash scripts/hooks/pre-push.test.sh

      - name: Verify release provenance boundaries
        run: node scripts/ci/verify-release-provenance-boundaries.mjs

      - name: Self-test macOS appcast generator
        run: node scripts/generate-macos-appcast.test.mjs

      - name: Self-test hosting deploy boundary
        run: node scripts/ci/verify-hosting-deploy-boundary.test.mjs

      - name: Verify hosting deploy boundary
        run: node scripts/ci/verify-hosting-deploy-boundary.mjs

      - name: Self-test staging Functions deploy boundary
        run: node scripts/ci/verify-staging-functions-deploy-boundary.test.mjs

      - name: Verify staging Functions deploy boundary
        run: node scripts/ci/verify-staging-functions-deploy-boundary.mjs

      - name: Self-test scoped staging Functions entrypoint
        run: node scripts/ci/prepare-scoped-functions-deploy.test.mjs

      - name: Self-test native build workflow secret boundary
        run: node scripts/ci/verify-native-build-workflow-secret-boundary.test.mjs

      - name: Verify native build workflow secret boundary
        run: node scripts/ci/verify-native-build-workflow-secret-boundary.mjs

      - name: Self-test ops-plane workflow boundary
        run: node scripts/ci/verify-ops-plane-workflow-boundary.test.mjs

      - name: Verify ops-plane workflow boundary
        run: node scripts/ci/verify-ops-plane-workflow-boundary.mjs

      - name: Self-test release tag safety
        run: node scripts/ci/verify-release-tag-safety.test.mjs

      - name: Functional test release tag safety
        run: node scripts/ci/verify-release-tag-safety.functional.test.mjs

      - name: Verify release tag safety
        run: node scripts/ci/verify-release-tag-safety.mjs

      - name: Self-test release dry-run attestation
        run: node scripts/ci/release-dry-run-attestation.test.mjs

      - name: Self-test PR harness aggregate gates
        run: node scripts/ci/verify-pr-harness-aggregate-gates.test.mjs

      - name: Verify PR harness aggregate gates
        run: node scripts/ci/verify-pr-harness-aggregate-gates.mjs

      - name: Self-test TypeScript diff coverage gate
        run: bash scripts/diff-coverage-ts-self-test.sh

      - name: Self-test wiki mem0 workflow boundary
        run: node scripts/ci/verify-wiki-mem0-workflow-boundary.test.mjs

      - name: Verify wiki mem0 workflow boundary
        run: node scripts/ci/verify-wiki-mem0-workflow-boundary.mjs

      - name: Self-test npm audit fail-closed gate
        run: node scripts/ci/check-npm-audit-fail-closed.test.mjs

      - name: Self-test gitleaks allowlist boundary
        run: node scripts/ci/verify-gitleaks-allowlist-boundary.test.mjs

      - name: Verify gitleaks allowlist boundary
        run: node scripts/ci/verify-gitleaks-allowlist-boundary.mjs

      - name: Self-test gitleaks workflow boundary
        run: node scripts/ci/verify-gitleaks-workflow-boundary.test.mjs

      - name: Verify gitleaks workflow boundary
        run: node scripts/ci/verify-gitleaks-workflow-boundary.mjs

      - name: Self-test scanner governance regression suite
        run: node scripts/ci/verify-scanner-governance.test.mjs

      - name: Self-test CODEOWNERS security trees verifier
        run: bash scripts/ci/verify-codeowners-security-trees.test.sh
