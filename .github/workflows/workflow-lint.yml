name: Workflow Lint

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/verify-github-action-pins.mjs"
      - "scripts/ci/verify-agent-repair-loop-prompts.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.test.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.test.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.test.mjs"
      - "scripts/ci/verify-release-provenance-boundaries.mjs"
      - "scripts/ci/verify-release-provenance-boundaries.test.mjs"
      - "scripts/generate-macos-appcast.mjs"
      - "scripts/generate-macos-appcast.test.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.test.mjs"
      - "scripts/ci/verify-native-build-workflow-secret-boundary.mjs"
      - "scripts/ci/verify-native-build-workflow-secret-boundary.test.mjs"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.mjs"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.test.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.test.mjs"
      - "scripts/ci/redact-qa-artifacts.mjs"
      - "scripts/ci/redact-qa-artifacts.test.mjs"
      - "scripts/ci/app-check-smoke.sh"
      - "scripts/ci/app-check-smoke.test.sh"
      - "scripts/ci/verify-release-attestations.sh"
      - "scripts/ci/verify-release-attestations.test.sh"
      - "scripts/ci/verify-signal-rule0.sh"
      - "scripts/ci/verify-signal-rule0.test.sh"
      - "scripts/ci/verify-vendored-agent-source.sh"
      - "scripts/ci/verify-libsignal-submodule-delta.sh"
      - "third_party/hermes-agent/manifest.json"
      - "third_party/libsignal/manifest.json"
      - "tools/qa/run-functional-qa.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/verify-github-action-pins.mjs"
      - "scripts/ci/verify-agent-repair-loop-prompts.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.mjs"
      - "scripts/ci/verify-agent-repair-loop-provenance.test.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.mjs"
      - "scripts/ci/verify-agent-workflow-boundaries.test.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.mjs"
      - "scripts/ci/verify-pr-secret-boundaries.test.mjs"
      - "scripts/ci/verify-release-provenance-boundaries.mjs"
      - "scripts/ci/verify-release-provenance-boundaries.test.mjs"
      - "scripts/generate-macos-appcast.mjs"
      - "scripts/generate-macos-appcast.test.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.mjs"
      - "scripts/ci/verify-hosting-deploy-boundary.test.mjs"
      - "scripts/ci/verify-native-build-workflow-secret-boundary.mjs"
      - "scripts/ci/verify-native-build-workflow-secret-boundary.test.mjs"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.mjs"
      - "scripts/ci/verify-wiki-mem0-workflow-boundary.test.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.mjs"
      - "scripts/ci/check-npm-audit-fail-closed.test.mjs"
      - "scripts/ci/redact-qa-artifacts.mjs"
      - "scripts/ci/redact-qa-artifacts.test.mjs"
      - "scripts/ci/app-check-smoke.sh"
      - "scripts/ci/app-check-smoke.test.sh"
      - "scripts/ci/verify-release-attestations.sh"
      - "scripts/ci/verify-release-attestations.test.sh"
      - "scripts/ci/verify-signal-rule0.sh"
      - "scripts/ci/verify-signal-rule0.test.sh"
      - "scripts/ci/verify-vendored-agent-source.sh"
      - "scripts/ci/verify-libsignal-submodule-delta.sh"
      - "third_party/hermes-agent/manifest.json"
      - "third_party/libsignal/manifest.json"
      - "tools/qa/run-functional-qa.sh"
  merge_group:
    branches: [main]
    types: [checks_requested]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.4"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow files
        run: |
          "$HOME/go/bin/actionlint" -color

      - name: Verify GitHub Actions pins
        run: node scripts/ci/verify-github-action-pins.mjs

      - name: Self-test QA artifact redaction
        run: node scripts/ci/redact-qa-artifacts.test.mjs

      - name: Self-test App Check smoke fail-closed gate
        run: bash scripts/ci/app-check-smoke.test.sh

      - name: Self-test release attestation verifier
        run: bash scripts/ci/verify-release-attestations.test.sh

      - name: Check functional QA runner syntax
        run: bash -n tools/qa/run-functional-qa.sh

      - name: Check vendored supply-chain guard syntax
        run: |
          bash -n scripts/ci/verify-signal-rule0.sh
          bash -n scripts/ci/verify-signal-rule0.test.sh
          bash -n scripts/ci/verify-vendored-agent-source.sh
          bash -n scripts/ci/verify-libsignal-submodule-delta.sh

      - name: Self-test Rule-0 guard
        run: bash scripts/ci/verify-signal-rule0.test.sh

      - name: Verify agent repair loop prompts
        run: node scripts/ci/verify-agent-repair-loop-prompts.mjs

      - name: Self-test agent repair loop provenance verifier
        run: node scripts/ci/verify-agent-repair-loop-provenance.test.mjs

      - name: Verify agent repair loop provenance
        run: node scripts/ci/verify-agent-repair-loop-provenance.mjs

      - name: Self-test agent workflow boundary verifier
        run: node scripts/ci/verify-agent-workflow-boundaries.test.mjs

      - name: Verify agent workflow boundaries
        run: node scripts/ci/verify-agent-workflow-boundaries.mjs

      - name: Self-test PR secret boundaries
        run: node scripts/ci/verify-pr-secret-boundaries.test.mjs

      - name: Verify PR secret boundaries
        run: node scripts/ci/verify-pr-secret-boundaries.mjs

      - name: Self-test release provenance boundaries
        run: node scripts/ci/verify-release-provenance-boundaries.test.mjs

      - name: Verify release provenance boundaries
        run: node scripts/ci/verify-release-provenance-boundaries.mjs

      - name: Self-test macOS appcast generator
        run: node scripts/generate-macos-appcast.test.mjs

      - name: Self-test hosting deploy boundary
        run: node scripts/ci/verify-hosting-deploy-boundary.test.mjs

      - name: Verify hosting deploy boundary
        run: node scripts/ci/verify-hosting-deploy-boundary.mjs

      - name: Self-test native build workflow secret boundary
        run: node scripts/ci/verify-native-build-workflow-secret-boundary.test.mjs

      - name: Verify native build workflow secret boundary
        run: node scripts/ci/verify-native-build-workflow-secret-boundary.mjs

      - name: Self-test wiki mem0 workflow boundary
        run: node scripts/ci/verify-wiki-mem0-workflow-boundary.test.mjs

      - name: Verify wiki mem0 workflow boundary
        run: node scripts/ci/verify-wiki-mem0-workflow-boundary.mjs

      - name: Self-test npm audit fail-closed gate
        run: node scripts/ci/check-npm-audit-fail-closed.test.mjs

      - name: Self-test gitleaks allowlist boundary
        run: node scripts/ci/verify-gitleaks-allowlist-boundary.test.mjs

      - name: Verify gitleaks allowlist boundary
        run: node scripts/ci/verify-gitleaks-allowlist-boundary.mjs

      - name: Self-test gitleaks workflow boundary
        run: node scripts/ci/verify-gitleaks-workflow-boundary.test.mjs

      - name: Verify gitleaks workflow boundary
        run: node scripts/ci/verify-gitleaks-workflow-boundary.mjs
