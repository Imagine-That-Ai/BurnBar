name: Workflow Lint

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  merge_group:
    branches: [main]
    types: [checks_requested]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Install actionlint
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
              -o /tmp/download-actionlint.bash \
              && bash /tmp/download-actionlint.bash latest; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            rm -f ./actionlint /tmp/download-actionlint.bash
            sleep $((attempt * 10))
          done

      - name: Lint workflow files
        run: |
          ./actionlint -color
