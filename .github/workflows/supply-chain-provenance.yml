# WS5: SLSA build provenance + cosign attestations for OpenBurnBar release artifacts.
name: Supply chain provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v*) to attest — must match an existing GitHub Release"
        required: true
        type: string
  workflow_run:
    workflows: ["OpenBurnBar Release"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_HEAD: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${RUN_HEAD}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG (expected vMAJOR.MINOR.PATCH[-prerelease][+build], MAJOR 0-999)"
            exit 1
          fi

          tag_ref="refs/tags/${TAG}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${GITHUB_REF}" != "$tag_ref" ]]; then
            echo "::error::Manual provenance dispatch for ${TAG} must run from ${tag_ref}, not ${GITHUB_REF}."
            echo "::error::Select the release tag as the workflow dispatch ref so keyless provenance is tag-bound."
            exit 1
          fi

          git fetch --force --tags origin "+${tag_ref}:${tag_ref}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

          if ! commit="$(git rev-list -n 1 "${tag_ref}^{commit}")"; then
            echo "::error::Tag does not exist in repository: $TAG"
            exit 1
          fi
          if [[ -z "$commit" ]]; then
            echo "::error::Unable to resolve ${tag_ref} to a commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Release tag ${TAG} points at ${commit}, which is not reachable from origin/main."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && ( -z "${RUN_HEAD_SHA:-}" || "$RUN_HEAD_SHA" != "$commit" ) ]]; then
            echo "::error::Release workflow_run head ${RUN_HEAD_SHA} does not match ${tag_ref} commit ${commit}."
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "tag_ref=$tag_ref"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          echo "Generating provenance inputs for $RELEASE_TAG at $RELEASE_COMMIT"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0 (node24-native)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release-artifacts
        if: github.event_name == 'workflow_run'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Generate SBOM
        id: sbom
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          SBOM="${{ runner.temp }}/openburnbar-${VERSION}.spdx.json"
          python3 scripts/generate-sbom.py \
            --version "$VERSION" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$SBOM"
          echo "path=$SBOM" >> "$GITHUB_OUTPUT"

      - name: Generate OpenVEX sidecar
        id: vex
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
        run: |
          VEX="${{ runner.temp }}/openburnbar-${VERSION}.vex.json"
          python3 scripts/supply-chain/generate-vex.py \
            --sbom "$SBOM_PATH" \
            --output "$VEX" \
            --product-version "$VERSION"
          echo "path=$VEX" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM and VEX (cosign / GitHub attestations)
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
          VEX_PATH: ${{ steps.vex.outputs.path }}
        run: |
          cosign attest --yes \
            --predicate-type https://slsa.dev/provenance/v1 \
            --type slsaprovenance \
            "$SBOM_PATH" || cosign attest --yes "$SBOM_PATH"
          cosign attest --yes "$VEX_PATH"

      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (node24-native)
        with:
          name: supply-chain-provenance-${{ steps.tag.outputs.version }}
          path: |
            ${{ steps.sbom.outputs.path }}
            ${{ steps.vex.outputs.path }}

      - name: Ecosystem deny checks
        run: bash scripts/supply-chain/run-ecosystem-deny-checks.sh

      - name: Provenance summary
        run: |
          {
            echo "### Supply chain provenance"
            echo ""
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- SBOM + OpenVEX generated and cosign-attested"
            echo "- Bit-reproducible **notarized** builds: de-scoped (see docs/security/SUPPLY_CHAIN_PROVENANCE.md)"
          } >> "$GITHUB_STEP_SUMMARY"
