        run: bash ./scripts/ci/inject-sentry-config-android.sh

      - name: Run Android unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_release_validation_gates }}
        run: ./scripts/test-openburnbar-android.sh

  authorize-domain-core-rollback:
    name: Authorize Shared Rust native rollback
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.domain_core_profile == 'public-production-rollback' }}
    needs: release-preflight
    runs-on: ubuntu-latest
    environment: domain-core-promotion
    permissions:
      contents: read
    steps:
      - name: Record protected rollback authorization
        run: |
          set -euo pipefail
          echo "Protected rollback authorized for ${{ needs.release-preflight.outputs.release_commit }}."
          echo "Profile: public-production-rollback" >> "$GITHUB_STEP_SUMMARY"

  domain-core-native-release-gate:
    name: Verify protected Shared Rust native release candidate
    if: ${{ always() && needs.release-preflight.result == 'success' && (needs.authorize-domain-core-rollback.result == 'success' || needs.authorize-domain-core-rollback.result == 'skipped') }}
    needs: [release-preflight, authorize-domain-core-rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      # "false" once the resolver reports no domain on Rust: the release ships
      # the legacy implementation and there is no attested candidate, promotion
      # attestation, rollback artifact, or protected signer run to demand.
      rust_active: ${{ steps.gate.outputs.rust_active }}
      profile_name: ${{ steps.gate.outputs.profile_name }}
      public_profile_sha256: ${{ steps.gate.outputs.public_profile_sha256 }}
      candidate_commit: ${{ steps.gate.outputs.candidate_commit }}
      signer_run_id: ${{ steps.gate.outputs.signer_run_id }}
      signer_run_attempt: ${{ steps.gate.outputs.signer_run_attempt }}
      artifact_name: domain-core-native-release-gate-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.release-preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify exact protected candidate chain
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          SELECTED_PROFILE: ${{ needs.release-preflight.outputs.domain_core_profile }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/domain-core-native-release-gate"
          activation="$RUNNER_TEMP/domain-core-native-release-gate/domain-core-activation.json"
          node scripts/ci/resolve-domain-core-activation.mjs \
            --release-commit "$RELEASE_COMMIT" --format json > "$activation"
          CANDIDATE_COMMIT="$(jq -er '.candidateCommit' "$activation")"
          node scripts/ci/prepare-domain-core-native-release-gate.mjs \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --release-commit "$RELEASE_COMMIT" \
            --activation "$activation" \
            --event-name "$GITHUB_EVENT_NAME" \
            --requested-profile "$SELECTED_PROFILE" \
            --output-dir "$RUNNER_TEMP/domain-core-native-release-gate" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable verified native release inputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-native-release-gate-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-native-release-gate/
          if-no-files-found: error
          retention-days: 90

  # The protected packaging lane: builds, signs, notarizes, and attests every
  # release artifact behind the `release` environment approval. Validation
  # gates run in parallel jobs; `publish` requires all of them, so nothing
  # ships on a red gate. Signing, notarization, artifact generation, and
  # provenance stay serialized in this single job so attestations bind to the
  # same workspace that built the artifacts.
  build-and-release:
    if: ${{ always() && needs.release-preflight.result == 'success' && needs.domain-core-native-release-gate.result == 'success' && (needs.authorize-domain-core-rollback.result == 'success' || needs.authorize-domain-core-rollback.result == 'skipped') }}
    environment: release
    name: build-and-release
    needs:
      [
        release-preflight,
        authorize-domain-core-rollback,
        domain-core-native-release-gate,
      ]
    # Keep release builds on the same current GA macOS/Xcode image as PR app
    # tests; Xcode 16.4 on macOS 15 crashes in SwiftEmitModule for this target.
    runs-on: macos-26
    # Packaging only (validation gates run as parallel jobs): FFI + daemon +
    # extension + Release app builds, Android bundle, signing, notarization,
    # and provenance. Cold-runner worst case stays well under five hours now
    # that the ~3.5h serial validation prefix is gone.
    timeout-minutes: 300
    outputs:
      dmg_path: ${{ steps.dmg.outputs.dmg_path }}
      dmg_name: ${{ steps.dmg.outputs.dmg_name }}
      zip_path: ${{ steps.zip.outputs.zip_path }}
      zip_name: ${{ steps.zip.outputs.zip_name }}
      aab_name: ${{ steps.android.outputs.aab_name }}
      native_identity_artifact_name: domain-core-native-observed-identities-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - name: Check out release tag for packaging
        env:
          TAG_REF: ${{ needs.release-preflight.outputs.tag_ref }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+${TAG_REF}:${TAG_REF}"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      # Runs inside the environment-bound job on purpose: environment-scoped
      # secrets only resolve for jobs bound to the release environment, so this
      # fail-hard presence check must live with the signing work it protects.
      - name: Validate strict release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: |
          missing=()
          for var in \
            APPLE_TEAM_ID \
            APPLE_SIGNING_IDENTITY \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_API_KEY_P8 \
            OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 \
            FIREBASE_PLIST_BASE64; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi
          # regularFile() fail-closes on relative paths, so the policy must be
          # passed absolute or this step can never pass.
          node scripts/ci/verify-domain-core-apple-signing-identity.mjs \
            --policy "$GITHUB_WORKSPACE/config/apple-release-signing-policy.json" --environment

      - name: Write Apple API key
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          export NOTARY_KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          payload = "".join(os.environ["APPLE_NOTARY_API_KEY_P8"].split())
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(payload, validate=True))
          PY
          chmod 600 "$NOTARY_KEY_PATH"
          echo "notary_key_path=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Download verified Shared Rust release inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-release-gate

      - name: Resolve signed public domain-core profile
        env:
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
        run: |
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --expected-release-commit "$RELEASE_COMMIT" --format github-env >> "$GITHUB_ENV"
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --expected-release-commit "$RELEASE_COMMIT" --format github-env-apple >> "$GITHUB_ENV"

      - name: Install Sparkle signing tools
        run: |
          set -euo pipefail
          brew install --cask sparkle
          SPARKLE_CASKROOM="$(brew --prefix)/Caskroom/sparkle"
          xattr -dr com.apple.quarantine "$SPARKLE_CASKROOM" 2>/dev/null || true
          SPARKLE_SIGN_UPDATE="$(
            find "$SPARKLE_CASKROOM" -name sign_update -type f -print -quit 2>/dev/null || true
          )"
          if [[ -z "$SPARKLE_SIGN_UPDATE" ]]; then
            echo "::error::Sparkle sign_update tool was not found after cask install."
            echo "::group::Sparkle install tree"
            find "$SPARKLE_CASKROOM" -path '*Sparkle*' -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
          SPARKLE_CASKROOM_REAL="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$SPARKLE_CASKROOM")"
          SPARKLE_SIGN_UPDATE_REAL="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$SPARKLE_SIGN_UPDATE")"
          if [[ -L "$SPARKLE_SIGN_UPDATE" ]]; then
            echo "::error::Sparkle sign_update must be a regular file from the Homebrew cask, not a symlink: $SPARKLE_SIGN_UPDATE"
            exit 1
          fi
          case "$SPARKLE_SIGN_UPDATE_REAL" in
            "$SPARKLE_CASKROOM_REAL"/*) ;;
            *)
              echo "::error::Sparkle sign_update resolved outside the Homebrew Sparkle cask: $SPARKLE_SIGN_UPDATE_REAL"
              exit 1
              ;;
          esac
          if [[ ! -x "$SPARKLE_SIGN_UPDATE" ]]; then
            echo "::error::Sparkle sign_update exists but is not executable: $SPARKLE_SIGN_UPDATE"
            exit 1
          fi
          echo "SPARKLE_SIGN_UPDATE=$SPARKLE_SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Inject Firebase config
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Inject iOS/macOS Sentry config
        env:
          OPENBURNBAR_SENTRY_DSN: ${{ secrets.OPENBURNBAR_SENTRY_DSN }}
        run: bash ./scripts/ci/inject-sentry-config-ios.sh

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Resolve libsignal revision
        id: libsignal
        run: echo "rev=$(git rev-parse HEAD:Vendor/libsignal)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: .spm-cache
          key: release-spm-package-${{ runner.os }}-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarDaemon/Package.resolved') }}
          restore-keys: |
            release-spm-package-${{ runner.os }}-

      - name: Restore cargo cache for libsignal FFI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/libsignal/target
          key: release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-${{ steps.libsignal.outputs.rev }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-

      - name: Prepare Signal FFI XCFramework for release app
        env:
          SIGNAL_FFI_BUILD_PROFILE: release
          # The protected release lane packages both the direct-download Mac app
          # and the App Store iOS archive from one source-coherent FFI build.
          SIGNAL_FFI_BUILD_TARGETS: "aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Prepare shared domain core XCFramework for release app
        env:
          DOMAIN_CORE_BUILD_PROFILE: release
        run: bash scripts/build-domain-core-xcframework.sh

      - name: Verify shared domain core release artifact
        run: test -d Vendor/OpenBurnBarDomainCore.xcframework

      - name: Prepare Mercury Iroh XCFramework for release app
        env:
          IROH_BUILD_PROFILE: release
        run: bash scripts/build-iroh-xcframework.sh

      - name: Verify Mercury Iroh release artifact
        run: bash scripts/ci/verify-iroh-release-artifact.sh

      - name: Verify OpenBurnBar app SwiftPM lockfile
        run: ./scripts/check-openburnbar-app-swiftpm-lock.sh

      - name: Set up Java 21 (Android release bundle)
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # The runner image periodically gains preview SDK components whose
      # licenses nobody has accepted; sdkmanager then exits 64 mid-release
      # (2026-08-20: an "Android SDK Preview" license appeared and killed the
      # AAR byte-compare step). Accept all licenses non-interactively so an
      # image rollout cannot fail a release at 2 a.m.
      - name: Accept Android SDK licenses
        # `yes` always dies of SIGPIPE when sdkmanager exits, so the pipeline's
        # own status is meaningless — but sdkmanager's is not: if IT fails (bad
        # cmdline-tools path, broken license op), this step must fail loudly
        # rather than hand the next step the same opaque exit-64 death.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          status="${PIPESTATUS[1]}"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed (exit $status); Android SDK licenses are NOT accepted."
            exit "$status"
          fi

      # NOTE: the checked-in-AAR byte-compare (build-domain-core-android-aar.sh
      # --check-artifact) deliberately does NOT run here. Rust codegen is
      # deterministic per host but not across hosts (~240KB .so delta with
      # identical Rust/NDK pins, measured 2026-08-20 across two ubuntu CI runs
      # vs a local macOS build), so a byte-compare against a Linux-built
      # committed artifact is structurally unpassable on this macOS runner.
      # The gate's authoritative home is domain-core.yml, which runs it on
      # ubuntu for every PR.
      - name: Build candidate-bound four-ABI Android AAR
        env:
          OPENBURNBAR_DOMAIN_CORE_CANDIDATE_COMMIT: ${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}
          DOMAIN_CORE_BUILD_PROFILE: release
        run: ./scripts/build-domain-core-android-aar.sh

      - name: Inject Android Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          OPENBURNBAR_ANDROID_FIREBASE_STRICT: "1"
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Verify Android Firebase release config
        run: node ./scripts/ci/verify-android-firebase-release-config.mjs --strict-release

      - name: Inject Android Sentry config
        env:
          ANDROID_SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
        run: bash ./scripts/ci/inject-sentry-config-android.sh

      - name: Inject Android keystore for release signing
        env:
          OPENBURNBAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_BASE64 }}
          OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD }}
          OPENBURNBAR_ANDROID_KEY_ALIAS: ${{ secrets.OPENBURNBAR_ANDROID_KEY_ALIAS }}
          OPENBURNBAR_ANDROID_KEY_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEY_PASSWORD }}
        run: bash ./scripts/ci/inject-android-keystore.sh

      - name: Build signed Android release bundle
        id: android
        env:
          OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD }}
          OPENBURNBAR_ANDROID_KEY_ALIAS: ${{ secrets.OPENBURNBAR_ANDROID_KEY_ALIAS }}
          OPENBURNBAR_ANDROID_KEY_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${OPENBURNBAR_ANDROID_KEYSTORE_PATH:-}" || ! -f "$OPENBURNBAR_ANDROID_KEYSTORE_PATH" ]]; then
            echo "::error::Android release keystore was not injected at OPENBURNBAR_ANDROID_KEYSTORE_PATH."
            exit 1
          fi
          cd android
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon -PopenBurnBarAppVersionName="${{ needs.release-preflight.outputs.version }}"
          source_path="$(pwd)/app/build/outputs/bundle/release/app-release.aab"
          release_name="OpenBurnBar-${{ needs.release-preflight.outputs.version }}-Android.aab"
          release_path="$RUNNER_TEMP/$release_name"
          cp "$source_path" "$release_path"
          printf 'aab_path=%s\naab_name=%s\n' "$release_path" "$release_name" >> "$GITHUB_OUTPUT"

      - name: Verify Android domain-core profile receipt
        run: node scripts/ci/verify-domain-core-build-profile-artifact.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --android-aab "${{ steps.android.outputs.aab_path }}"

      - name: Build Android native identity instrumentation
        working-directory: android
        run: ./gradlew :openburnbar-domain-core:assembleDebugAndroidTest --no-daemon

      # The dynamic loaded-bytes proof no longer runs in this job: macos-26
      # hosted runners expose no hardware virtualization, so the Android
      # emulator can never boot here (HV_UNSUPPORTED — see the
      # android-hermes-smoke comment in openburnbar-pr-harness.yml; release
      # attempts 13/13R proved it at 100%, qemu never came up). The proof runs
      # in the android-release-identity job on ubuntu-24.04 + KVM against the
      # AAB's x86_64 slice; this job uploads the exact signed APKs that proof
      # must execute, and keeps the static byte-binding of BOTH packaged ABIs
      # to the protected candidate AAR below.
      - name: Require both Android identity proof inputs
        # if-no-files-found: error below only fires when ZERO paths match.
        # With one of two files missing, upload-artifact still succeeds with a
        # partial artifact AND relocates the survivor: the artifact root is
        # the least common ancestor of matched files, so losing one file
        # shifts the other's path inside the archive and breaks BOTH download
        # paths in android-release-identity. Fail here, at the point of
        # truth, not later inside an emulator script on another runner.
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk

      - name: Upload Android identity proof inputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: android-release-identity-inputs-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk
          if-no-files-found: error

      - name: Verify packaged Android Rust libraries match the protected candidate AAR
        env:
          RUST_ACTIVE: ${{ needs.domain-core-native-release-gate.outputs.rust_active }}
        run: |
          set -euo pipefail
          if [[ "$RUST_ACTIVE" == "true" ]]; then
            node scripts/ci/verify-domain-core-android-universal-artifact.mjs \
              --aab "${{ steps.android.outputs.aab_path }}" \
              --candidate-aar Vendor/openburnbar-domain-core.aar \
              --candidate-bundle "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-candidate-bundle.json" \
              --output "$RUNNER_TEMP/domain-core-android-universal-build-manifest.json"
          fi

      - name: Upload Android release bundle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.android.outputs.aab_name }}
          path: ${{ steps.android.outputs.aab_path }}

      - name: Install extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Inject extension Sentry DSN
        env:
          BURNBAR_EXTENSION_SENTRY_DSN: ${{ secrets.BURNBAR_EXTENSION_SENTRY_DSN }}
        run: bash scripts/ci/inject-sentry-config-extension.sh

      - name: Build extension
        run: npm run --prefix extensions/openburnbar build

      - name: Build daemon (SPM release binaries)
        run: |
          swift build --package-path OpenBurnBarDaemon -c release --product OpenBurnBarDaemon
          swift build --package-path OpenBurnBarDaemon -c release --product OpenBurnBarCLI

      - name: Resolve Xcode packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$CACHE_DIR" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build Release .app (unsigned)
        env:
          # Marks this as a notarized release build so the in-app updater's
          # Stamp Build Provenance phase records channel=release (not "source").
          OPENBURNBAR_BUILD_CHANNEL: release
        run: |
          set -euo pipefail

          xcodebuild_log="${RUNNER_TEMP:-/tmp}/openburnbar-release-app-xcodebuild.log"
          rm -f "$xcodebuild_log"

          # SWIFT_COMPILATION_MODE=incremental: the app module's whole-module
          # -O compile (which also turns on cross-module optimization,
          # -enable-default-cmo) exceeds the hosted macos-26 runner's memory —
          # repair.12's swift-frontend was killed mid-compile with zero
          # diagnostics ("The following build commands failed: CompileSwift"
          # and nothing else, the memory-kill signature). No PR gate ever
          # caught this because none of them builds the app with xcodebuild in
          # Release; the daemon-only "Release build" check passes on `swift
          # build`. Per-file -O trades some cross-file inlining for a build
          # that fits the runner. Revisit if the lane moves to bigger runners.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$CACHE_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_COMPILATION_MODE=incremental \
            DOMAIN_CORE_BUILD_PROFILE="$DOMAIN_CORE_BUILD_PROFILE" \
            DOMAIN_CORE_BUILD_AUTHORITY="$DOMAIN_CORE_BUILD_AUTHORITY" \
            DOMAIN_CORE_DISTRIBUTION="$DOMAIN_CORE_DISTRIBUTION" \
            DOMAIN_CORE_ROLLOUT_CHANNEL="$DOMAIN_CORE_ROLLOUT_CHANNEL" \
            DOMAIN_CORE_EVIDENCE_ENABLED="$DOMAIN_CORE_EVIDENCE_ENABLED" \
            DOMAIN_CORE_CANDIDATE_COMMIT="$DOMAIN_CORE_CANDIDATE_COMMIT" \
            DOMAIN_CORE_EXPECTED_VERSION="$DOMAIN_CORE_EXPECTED_VERSION" \
            DOMAIN_CORE_EXPECTED_ABI_VERSION="$DOMAIN_CORE_EXPECTED_ABI_VERSION" \
            DOMAIN_CORE_EXPECTED_SOURCE_SHA256="$DOMAIN_CORE_EXPECTED_SOURCE_SHA256" \
            DOMAIN_CORE_QUOTA_MODE="$DOMAIN_CORE_QUOTA_MODE" \
            DOMAIN_CORE_CLOUDVAULT_MODE="$DOMAIN_CORE_CLOUDVAULT_MODE" \
            DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE="$DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE" \
            DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE="$DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE" \
            DOMAIN_CORE_HERMES_MODE="$DOMAIN_CORE_HERMES_MODE" \
            DOMAIN_CORE_PRICING_MODE="$DOMAIN_CORE_PRICING_MODE" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build >"$xcodebuild_log" 2>&1 &
          xcodebuild_pid="$!"

          heartbeat_count=0
          while kill -0 "$xcodebuild_pid" 2>/dev/null; do
            sleep 60
            if kill -0 "$xcodebuild_pid" 2>/dev/null; then
              heartbeat_count=$((heartbeat_count + 1))
              echo "::notice::xcodebuild Release .app still running at $(date -u +%Y-%m-%dT%H:%M:%SZ) (${heartbeat_count}m elapsed)"
              if [[ -s "$xcodebuild_log" ]]; then
                echo "::group::xcodebuild Release .app recent output"
                tail -n 40 "$xcodebuild_log" || true
                echo "::endgroup::"
              fi
            fi
          done

          set +e
          wait "$xcodebuild_pid"
          xcodebuild_status="$?"
          set -e

          if [[ "$xcodebuild_status" -ne 0 ]]; then
            echo "::error::xcodebuild Release .app failed with exit code ${xcodebuild_status}"
            echo "::group::xcodebuild Release .app final log"
            tail -n 200 "$xcodebuild_log" || true
            echo "::endgroup::"
            exit "$xcodebuild_status"
          fi

          echo "::group::xcodebuild Release .app final log"
          tail -n 80 "$xcodebuild_log" || true
          echo "::endgroup::"

      - name: Verify Apple domain-core profile receipt
        run: node scripts/ci/verify-domain-core-build-profile-artifact.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --apple-app "$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"

      - name: Embed daemon binary in app bundle
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          HELPERS_DIR="$APP_PATH/Contents/Helpers"
          mkdir -p "$HELPERS_DIR"

          DAEMON_BIN="OpenBurnBarDaemon/.build/release/OpenBurnBarDaemon"
          DAEMON_CLI_BIN="OpenBurnBarDaemon/.build/release/OpenBurnBarCLI"
          DAEMON_CORE_DYLIB="OpenBurnBarDaemon/.build/release/libOpenBurnBarCore.dylib"
          if [[ ! -f "$DAEMON_BIN" ]]; then
            echo "::error::Daemon binary not found at $DAEMON_BIN"
            exit 1
          fi
          if [[ ! -f "$DAEMON_CLI_BIN" ]]; then
            echo "::error::Daemon CLI binary not found at $DAEMON_CLI_BIN"
            exit 1
          fi
          cp "$DAEMON_BIN" "$HELPERS_DIR/OpenBurnBarDaemon"
          cp "$DAEMON_CLI_BIN" "$HELPERS_DIR/OpenBurnBarCLI"
          if [[ -f "$DAEMON_CORE_DYLIB" ]]; then
            cp "$DAEMON_CORE_DYLIB" "$HELPERS_DIR/libOpenBurnBarCore.dylib"
          else
            echo "No daemon support dylib found at $DAEMON_CORE_DYLIB; daemon is statically linked."
          fi
          chmod +x "$HELPERS_DIR/OpenBurnBarDaemon" "$HELPERS_DIR/OpenBurnBarCLI"
          DAEMON_RESOURCE_BUNDLE="$APP_PATH/Contents/Resources/OpenBurnBarCore_OpenBurnBarCore.bundle"
          DAEMON_HELPER_RESOURCE_BUNDLE="$HELPERS_DIR/OpenBurnBarCore_OpenBurnBarCore.bundle"
          # Core-decomposition P-02: the Kernel target gained its own resource bundle
          # (catalog.json + secret-pattern-corpus.json). Stage it IN ADDITION to the Core bundle.
          DAEMON_KERNEL_RESOURCE_BUNDLE="$APP_PATH/Contents/Resources/OpenBurnBarCore_OpenBurnBarKernel.bundle"
          DAEMON_HELPER_KERNEL_RESOURCE_BUNDLE="$HELPERS_DIR/OpenBurnBarCore_OpenBurnBarKernel.bundle"
          PROJECT_CODE_MEMORY_DIR="$APP_PATH/Contents/Resources/ProjectCodeMemory"
          if [[ ! -d "$DAEMON_RESOURCE_BUNDLE" ]]; then
            echo "::error::OpenBurnBarDaemon resource bundle missing at $DAEMON_RESOURCE_BUNDLE"
            exit 1
          fi
          if [[ ! -d "$DAEMON_KERNEL_RESOURCE_BUNDLE" ]]; then
            echo "::error::OpenBurnBarDaemon Kernel resource bundle missing at $DAEMON_KERNEL_RESOURCE_BUNDLE"
            exit 1
          fi
          if [[ ! -d "$PROJECT_CODE_MEMORY_DIR" ]]; then
            echo "::error::OpenBurnBarDaemon Project Code Memory resources missing at $PROJECT_CODE_MEMORY_DIR"
            exit 1
          fi
          rm -rf "$DAEMON_HELPER_RESOURCE_BUNDLE" "$DAEMON_HELPER_KERNEL_RESOURCE_BUNDLE" "$HELPERS_DIR/ProjectCodeMemory"
          cp -R "$DAEMON_RESOURCE_BUNDLE" "$DAEMON_HELPER_RESOURCE_BUNDLE"
          cp -R "$DAEMON_KERNEL_RESOURCE_BUNDLE" "$DAEMON_HELPER_KERNEL_RESOURCE_BUNDLE"
          if otool -L "$HELPERS_DIR/OpenBurnBarDaemon" | grep -q 'SQLCipher.framework'; then
            if [[ ! -d "$APP_PATH/Contents/Frameworks/SQLCipher.framework" ]]; then
              echo "::error::OpenBurnBarDaemon links SQLCipher.framework but the app bundle is missing Contents/Frameworks/SQLCipher.framework"
              exit 1
            fi
            if ! otool -l "$HELPERS_DIR/OpenBurnBarDaemon" | grep -q '@executable_path/../Frameworks'; then
              install_name_tool -add_rpath "@executable_path/../Frameworks" "$HELPERS_DIR/OpenBurnBarDaemon"
            fi
          fi
          if otool -L "$HELPERS_DIR/OpenBurnBarCLI" | grep -q 'SQLCipher.framework'; then
            if [[ ! -d "$APP_PATH/Contents/Frameworks/SQLCipher.framework" ]]; then
              echo "::error::OpenBurnBarCLI links SQLCipher.framework but the app bundle is missing Contents/Frameworks/SQLCipher.framework"
              exit 1
            fi
            if ! otool -l "$HELPERS_DIR/OpenBurnBarCLI" | grep -q '@executable_path/../Frameworks'; then
              install_name_tool -add_rpath "@executable_path/../Frameworks" "$HELPERS_DIR/OpenBurnBarCLI"
            fi
          fi

      - name: Embed OpenBurnBarCore framework in app bundle
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          CORE_FRAMEWORK_PATH="$DERIVED_DATA/Build/Products/$CONFIG/PackageFrameworks/OpenBurnBarCore.framework"

          mkdir -p "$FRAMEWORKS_DIR"
          if [[ -d "$CORE_FRAMEWORK_PATH" ]]; then
            rm -rf "$FRAMEWORKS_DIR/OpenBurnBarCore.framework"
            cp -R "$CORE_FRAMEWORK_PATH" "$FRAMEWORKS_DIR/"
          else
            echo "No OpenBurnBarCore.framework found at $CORE_FRAMEWORK_PATH; app is statically linked."
          fi

      - name: Verify unsigned app App Check release artifact
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          bash scripts/ci/verify-apple-appcheck-release-artifact.sh "$APP_PATH"

      - name: Verify unsigned app Firebase release config
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          bash scripts/ci/verify-apple-release-firebase-config.sh "$APP_PATH"

      - name: Import Developer ID signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "keychain_password=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "certificate.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12"])
          )
          PY

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Codesign app bundle (deterministic order)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          OPENBURNBAR_APP_PROFILE_BASE64: ${{ secrets.OPENBURNBAR_APP_PROFILE_BASE64 }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          HELPERS_DIR="$APP_PATH/Contents/Helpers"
          ENTITLEMENTS="AgentLens/Resources/OpenBurnBarRelease.entitlements"
          APP_PROFILE="$RUNNER_TEMP/OpenBurnBar-MAC_APP_DIRECT.provisionprofile"
          APP_PROFILE_PLIST="$RUNNER_TEMP/OpenBurnBar-MAC_APP_DIRECT.plist"
          APP_SIGNING_ENTITLEMENTS="$RUNNER_TEMP/OpenBurnBarRelease-signing.entitlements"
          PRIVILEGED_INPUT_ENTITLEMENTS="OpenBurnBarDaemon/Resources/PrivilegedInputExecution/OpenBurnBarPrivilegedInputExecution.entitlements"
          VIRTUAL_HID_BRIDGE_ENTITLEMENTS="OpenBurnBarDaemon/Resources/VirtualHIDBridge/OpenBurnBarVirtualHIDBridgeSocketAdapter.entitlements"
          export APP_PROFILE

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi
          if [[ -z "${OPENBURNBAR_APP_PROFILE_BASE64:-}" ]]; then
            echo "::error::OPENBURNBAR_APP_PROFILE_BASE64 is required. Store the com.openburnbar.app MAC_APP_DIRECT profile as a GitHub Actions secret."
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          payload = "".join(os.environ["OPENBURNBAR_APP_PROFILE_BASE64"].split())
          Path(os.environ["APP_PROFILE"]).write_bytes(base64.b64decode(payload))
          PY
          security cms -D -i "$APP_PROFILE" > "$APP_PROFILE_PLIST"
          if [[ "$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$APP_PROFILE_PLIST" 2>/dev/null || true)" != "true" ]]; then
            echo "::error::App profile must be a Developer ID / MAC_APP_DIRECT all-devices profile."
            exit 1
          fi
          APP_PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$APP_PROFILE_PLIST" 2>/dev/null || true)"
          APP_PROFILE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$APP_PROFILE_PLIST" 2>/dev/null || true)"
          EXPECTED_APP_IDENTIFIER="${APP_PROFILE_TEAM_ID}.${BUNDLE_ID}"
          if [[ ! "$APP_PROFILE_TEAM_ID" =~ ^[A-Z0-9]{10}$ || "$APP_PROFILE_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ]]; then
            echo "::error::App profile must authorize $BUNDLE_ID for team ${APP_PROFILE_TEAM_ID:-<missing>}; found application identifier '${APP_PROFILE_IDENTIFIER:-missing}'."
            exit 1
          fi
          APP_PROFILE_KEYCHAIN_GROUPS="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:keychain-access-groups" "$APP_PROFILE_PLIST" 2>/dev/null || true)"
          if ! grep -q "${APP_PROFILE_TEAM_ID}\\.\\*\\|${EXPECTED_APP_IDENTIFIER}" <<<"$APP_PROFILE_KEYCHAIN_GROUPS"; then
            echo "::error::App profile does not authorize the $EXPECTED_APP_IDENTIFIER Keychain access group."
            printf '%s\n' "$APP_PROFILE_KEYCHAIN_GROUPS"
            exit 1
          fi
          python3 - "$ENTITLEMENTS" "$APP_SIGNING_ENTITLEMENTS" "$APP_PROFILE_TEAM_ID" "$BUNDLE_ID" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          source, destination, team_id, bundle_id = sys.argv[1:5]

          def expand(value):
              if isinstance(value, str):
                  return (
                      value
                      .replace("$(AppIdentifierPrefix)", f"{team_id}.")
                      .replace("$(TeamIdentifierPrefix)", team_id)
                      .replace("$(PRODUCT_BUNDLE_IDENTIFIER)", bundle_id)
                  )
              if isinstance(value, list):
                  return [expand(item) for item in value]
              if isinstance(value, dict):
                  return {key: expand(item) for key, item in value.items()}
              return value

          with Path(source).open("rb") as file:
              entitlements = plistlib.load(file)
          with Path(destination).open("wb") as file:
              plistlib.dump(expand(entitlements), file)
          PY

          sign_one() {
            local path="$1"
            local options="${2:-runtime}"
            local identifier="${3:-}"
            [[ -e "$path" ]] || return 0
            local args=(--force --timestamp --options "$options" --sign "$SIGNING_IDENTITY")
            if [[ -n "$identifier" ]]; then
              args+=(--identifier "$identifier")
            fi
            codesign "${args[@]}" "$path"
          }

          sign_one_with_entitlements() {
            local path="$1"
            local entitlements_path="$2"
            local options="${3:-runtime}"
            local identifier="${4:-}"
            [[ -e "$path" ]] || return 0
            local args=(--force --timestamp --options "$options" --entitlements "$entitlements_path" --sign "$SIGNING_IDENTITY")
            if [[ -n "$identifier" ]]; then
              args+=(--identifier "$identifier")
            fi
            codesign "${args[@]}" "$path"
          }

          assert_peer_signature() {
            local path="$1"
            local expected_identifier="$2"
            local signature

            [[ -e "$path" ]] || return 0
            signature="$(codesign -d -vvv "$path" 2>&1)"
            if ! grep -q "Identifier=$expected_identifier" <<<"$signature"; then
              echo "::error::$path is signed with the wrong identifier; expected $expected_identifier."
              printf '%s\n' "$signature"
              exit 1
            fi
            if ! grep -q "flags=.*runtime" <<<"$signature" || ! grep -q "flags=.*library-validation" <<<"$signature"; then
              echo "::error::$path must be signed with hardened runtime and library validation for privileged socket policy."
              printf '%s\n' "$signature"
              exit 1
            fi
          }

          # Xcode embeds the OpenBurnBarDomainCore binaryTarget's framework into
          # Contents/Frameworks (see project.yml: XCBuild copies every
          # transitive binary framework into $BUILT_PRODUCTS_DIR/Frameworks).
          #
          # repair.16/17/18 were all rejected by the notary service on this one
          # path with the same two errors:
          #   openburnbar_domain_ffiFFI: "The binary is not signed with a valid
          #   Developer ID certificate" + "The signature does not include a
          #   secure timestamp"
          #   repair.16 submission 25976ab9-e013-4871-9363-827fe3994062
          #   repair.17 submission a55acafc-42c0-42d1-82ad-c9bdfd3183e9
          #   repair.18 submission 00688dc6-a2ed-4401-b50a-c62599a8153a
          # repair.17 and repair.18 guessed the framework wrapped a static
          # archive. It does not — repair.18's own diagnostics printed
          # "Mach-O universal binary with 1 architecture: [arm64:... dynamically
          # linked shared library]". The real cause was in
          # scripts/build-domain-core-xcframework.sh: the generated Info.plist
          # had no CFBundleExecutable, so codesign could not locate a main
          # executable and sealed the bundle as RESOURCE-ONLY — hashing the
          # Mach-O as a resource and leaving its ad-hoc linker signature (no
          # authority, no timestamp) untouched. That plist now declares
          # CFBundleExecutable; the sweep below stays only as a guard against a
          # binary that is not a signable Mach-O at all.
          STATIC_FFI_FRAMEWORK="$FRAMEWORKS_DIR/openburnbar_domain_ffiFFI.framework"
          if [[ -e "$STATIC_FFI_FRAMEWORK" ]]; then
            echo "domain-ffi framework present; inspecting before signing:"
            ls -l "$STATIC_FFI_FRAMEWORK" || true
            ffi_binary=""
            for candidate in \
              "$STATIC_FFI_FRAMEWORK/Versions/A/openburnbar_domain_ffiFFI" \
              "$STATIC_FFI_FRAMEWORK/Versions/Current/openburnbar_domain_ffiFFI" \
              "$STATIC_FFI_FRAMEWORK/openburnbar_domain_ffiFFI"; do
              if [[ -f "$candidate" ]]; then
                ffi_binary="$candidate"
                break
              fi
            done
            if [[ -n "$ffi_binary" ]]; then
              echo "  binary: $ffi_binary"
              echo "  type:   $(file -b "$ffi_binary" || true)"
            else
              echo "  binary: <none found>"
            fi
            if [[ -n "$ffi_binary" ]] && file -b "$ffi_binary" | grep -q 'dynamically linked shared library'; then
              echo "  keeping: real Mach-O dylib, the signing loop below will sign it."
            else
              echo "  removing: not a signable Mach-O dylib (already linked into the executables)."
              rm -rf "$STATIC_FFI_FRAMEWORK"
            fi
          fi

          if [[ -d "$FRAMEWORKS_DIR" ]]; then
            while IFS= read -r -d '' item; do
              sign_one "$item"
            done < <(
              find "$FRAMEWORKS_DIR" -mindepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.bundle' \) -print0 \
                | python3 -c 'import sys; paths=[p for p in sys.stdin.buffer.read().split(b"\0") if p]; paths.sort(key=lambda p: (p.count(b"/"), len(p)), reverse=True); sys.stdout.buffer.write(b"\0".join(paths) + (b"\0" if paths else b""))'
            )
          fi

          if [[ -d "$HELPERS_DIR" ]]; then
            while IFS= read -r -d '' item; do
              sign_one "$item"
            done < <(
              find "$HELPERS_DIR" -mindepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.bundle' \) -print0 \
                | python3 -c 'import sys; paths=[p for p in sys.stdin.buffer.read().split(b"\0") if p]; paths.sort(key=lambda p: (p.count(b"/"), len(p)), reverse=True); sys.stdout.buffer.write(b"\0".join(paths) + (b"\0" if paths else b""))'
            )
          fi

          sign_one "$HELPERS_DIR/libOpenBurnBarCore.dylib"
          sign_one "$HELPERS_DIR/OpenBurnBarDaemon" "runtime,library" "com.openburnbar.app"
          sign_one "$HELPERS_DIR/OpenBurnBarCLI" "runtime,library" "com.openburnbar.cli"
          sign_one_with_entitlements \
            "$HELPERS_DIR/OpenBurnBarPrivilegedInputExecution" \
            "$PRIVILEGED_INPUT_ENTITLEMENTS" \
            "runtime,library" \
            "com.openburnbar.privileged-input-execution"
          sign_one_with_entitlements \
            "$HELPERS_DIR/OpenBurnBarVirtualHIDBridge" \
            "$VIRTUAL_HID_BRIDGE_ENTITLEMENTS" \
            "runtime,library" \
            "com.openburnbar.virtual-hid-bridge"
          sign_one \
            "$HELPERS_DIR/OpenBurnBarPrivilegedInputKillSwitchWatchdog" \
            "runtime,library" \
            "com.openburnbar.privileged-input-killswitch-watchdog"

          # Sign the embedded Safari extension BEFORE the host app (nested-first).
          # The build ran with CODE_SIGNING_ALLOWED=NO, so the appex arrives
          # unsigned; skipping it fails `codesign --verify --deep --strict`
          # below and reproduces the bug the target exists to fix: an extension
          # that is committed but reaches no release. Mirrors
          # scripts/build-macos-website-release.sh exactly.
          SAFARI_EXTENSION_APPEX="$APP_PATH/Contents/PlugIns/OpenBurnBarSafariExtension.appex"
          SAFARI_EXTENSION_ENTITLEMENTS="OpenBurnBarSafariExtension/Resources/OpenBurnBarSafariExtension.entitlements"
          if [[ ! -d "$SAFARI_EXTENSION_APPEX" ]]; then
            echo "::error::Safari extension missing at $SAFARI_EXTENSION_APPEX. The OpenBurnBarSafariExtension target must build and embed into Contents/PlugIns."
            exit 1
          fi
          if [[ ! -f "$SAFARI_EXTENSION_APPEX/Contents/Resources/manifest.json" ]]; then
            echo "::error::Safari extension at $SAFARI_EXTENSION_APPEX has no Contents/Resources/manifest.json; the extensions/safari/dist copy did not run."
            exit 1
          fi
          sign_one_with_entitlements \
            "$SAFARI_EXTENSION_APPEX" \
            "$SAFARI_EXTENSION_ENTITLEMENTS" \
            "runtime,library" \
            "com.openburnbar.app.safari-extension"

          cp "$APP_PROFILE" "$APP_PATH/Contents/embedded.provisionprofile"
          codesign --force --timestamp --options runtime,library \
            --entitlements "$APP_SIGNING_ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          # Fail closed on what the notary service actually inspects. Every
          # Mach-O in the bundle is checked on its own, so a bundle-level
          # `codesign --verify --strict` proves nothing: it passed in repair.18
          # while the domain-ffi Mach-O inside was still ad-hoc signed, because
          # a resource-only bundle really is validly signed. Assert the two
          # properties the notary rejected instead — a Developer ID authority
          # and a secure timestamp on each embedded Mach-O.
          assert_macho_notarizable() {
            local path="$1"
            local kind signature
            [[ -f "$path" ]] || return 0
            kind="$(file -b "$path")"
            # Real Mach-O code only. A fat *static archive* also reports
            # "Mach-O universal binary", so exclude ar members explicitly;
            # the notary service does not demand a signature on those.
            grep -q 'Mach-O' <<<"$kind" || return 0
            grep -q 'ar archive' <<<"$kind" && return 0
            signature="$(codesign -dvvv "$path" 2>&1)"
            if ! grep -q '^Authority=Developer ID Application:' <<<"$signature"; then
              echo "::error::$path carries no Developer ID Application authority; the notary service would reject the DMG."
              printf '%s\n' "$signature"
              exit 1
            fi
            if ! grep -q '^Timestamp=' <<<"$signature"; then
              echo "::error::$path has no secure timestamp; the notary service would reject the DMG."
              printf '%s\n' "$signature"
              exit 1
            fi
          }
          while IFS= read -r -d '' macho; do
            assert_macho_notarizable "$macho"
          done < <(find "$FRAMEWORKS_DIR" "$HELPERS_DIR" -type f -print0 2>/dev/null)

          bash scripts/ci/verify-signing-profile-certificate.sh "$APP_PATH" "$APP_PROFILE"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          assert_peer_signature "$APP_PATH" "com.openburnbar.app"
          assert_peer_signature "$HELPERS_DIR/OpenBurnBarDaemon" "com.openburnbar.app"
          assert_peer_signature "$HELPERS_DIR/OpenBurnBarCLI" "com.openburnbar.cli"
          assert_peer_signature "$SAFARI_EXTENSION_APPEX" "com.openburnbar.app.safari-extension"
          assert_peer_signature "$HELPERS_DIR/OpenBurnBarPrivilegedInputExecution" "com.openburnbar.privileged-input-execution"
          assert_peer_signature "$HELPERS_DIR/OpenBurnBarVirtualHIDBridge" "com.openburnbar.virtual-hid-bridge"
          assert_peer_signature "$HELPERS_DIR/OpenBurnBarPrivilegedInputKillSwitchWatchdog" "com.openburnbar.privileged-input-killswitch-watchdog"
          bash scripts/ci/verify-daemon-release-signing.sh "$APP_PATH" "$APP_PROFILE_TEAM_ID"
          ACTUAL_ENTITLEMENTS="$RUNNER_TEMP/OpenBurnBar-signed-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ACTUAL_ENTITLEMENTS" 2>/dev/null
          ACTUAL_APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c "Print :com.apple.application-identifier" "$ACTUAL_ENTITLEMENTS" 2>/dev/null || true)"
          ACTUAL_TEAM_IDENTIFIER="$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.team-identifier" "$ACTUAL_ENTITLEMENTS" 2>/dev/null || true)"
          ACTUAL_KEYCHAIN_GROUPS="$(/usr/libexec/PlistBuddy -c "Print :keychain-access-groups" "$ACTUAL_ENTITLEMENTS" 2>/dev/null || true)"
          if [[ "$ACTUAL_APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" || "$ACTUAL_TEAM_IDENTIFIER" != "$APP_PROFILE_TEAM_ID" ]]; then
            echo "::error::Direct-download app identity entitlements are wrong: app='${ACTUAL_APP_IDENTIFIER:-missing}' team='${ACTUAL_TEAM_IDENTIFIER:-missing}' expected app='$EXPECTED_APP_IDENTIFIER' team='$APP_PROFILE_TEAM_ID'."
            exit 1
          fi
          if ! grep -q "$EXPECTED_APP_IDENTIFIER" <<<"$ACTUAL_KEYCHAIN_GROUPS"; then
            echo "::error::Direct-download app is missing Firebase Auth Keychain group $EXPECTED_APP_IDENTIFIER."
            printf '%s\n' "$ACTUAL_KEYCHAIN_GROUPS"
            exit 1
          fi
          spctl --assess --type execute -vv "$APP_PATH" || true

      - name: Create DMG
        id: dmg
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          DMG_NAME="OpenBurnBar-${VERSION}-macOS.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "OpenBurnBar" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Codesign DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          OPENBURNBAR_NOTARY_OUTER_TIMEOUT_SECONDS: "2100"
          OPENBURNBAR_STAPLER_OUTER_TIMEOUT_SECONDS: "600"
        run: |
          NOTARY_ARGS=(
            --key "$notary_key_path"
            --key-id "$APPLE_NOTARY_KEY_ID"
          )

          run_notary_submit() {
            local mode="$1"
            shift

            python3 scripts/ci/release-command-watchdog.py \
              --mode "$mode" \
              --outer-timeout-seconds "$OPENBURNBAR_NOTARY_OUTER_TIMEOUT_SECONDS" \
              -- \
              xcrun notarytool submit "$DMG_PATH" "${NOTARY_ARGS[@]}" "$@" --wait --timeout 30m
          }

          run_stapler() {
            local mode="$1"
            shift

            python3 scripts/ci/release-command-watchdog.py \
              --mode "$mode" \
              --outer-timeout-seconds "$OPENBURNBAR_STAPLER_OUTER_TIMEOUT_SECONDS" \
              -- \
              xcrun stapler "$@" "$DMG_PATH"
          }

          # Avoid using `notarytool history` as an auth probe because it can
          # trap on some runner/toolchain combinations. Probe by submit itself.
          if [[ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            set +e
            run_notary_submit "team API key" --issuer "$APPLE_NOTARY_ISSUER_ID"
            notary_status=$?
            set -e
            if [[ $notary_status -eq 0 ]]; then
              echo "Notary auth mode: team API key"
            else
              echo "::warning::Issuer-mode notarization failed; retrying without issuer (individual key mode)."
              run_notary_submit "individual API key"
              echo "Notary auth mode: individual API key"
            fi
          else
            run_notary_submit "individual API key"
            echo "Notary auth mode: individual API key"
          fi

          run_stapler "stapler staple" staple
          run_stapler "stapler validate" validate

      - name: Create ZIP archive
        id: zip
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          ZIP_NAME="OpenBurnBar-${VERSION}-macOS.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"

          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent "$(basename "$APP_PATH")" "$ZIP_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify packaged App Check release artifacts
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: bash scripts/ci/verify-apple-appcheck-release-artifact.sh "$DMG_PATH" "$ZIP_PATH"

      - name: Verify packaged Firebase release config
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: bash scripts/ci/verify-apple-release-firebase-config.sh "$DMG_PATH" "$ZIP_PATH"

      - name: Checkout pinned Hermes agent source
        id: hermes-agent-source
        run: |
          repo="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.forkRepository)")"
          pin="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.pinnedCommit)")"
          src="$RUNNER_TEMP/hermes-agent"
          git clone --no-tags --filter=blob:none "$repo" "$src"
          git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach "$pin"
          HERMES_AGENT_SRC="$src" OPENBURNBAR_REQUIRE_HERMES_AGENT_SOURCE=1 bash scripts/ci/verify-vendored-agent-source.sh
          echo "path=$src" >> "$GITHUB_OUTPUT"

      - name: Build corresponding source archive
        id: corresponding-source
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          HERMES_AGENT_SRC: ${{ steps.hermes-agent-source.outputs.path }}
          OPENBURNBAR_REQUIRE_HERMES_AGENT_SOURCE: "1"
        run: |
          bash scripts/ci/verify-libsignal-pin.sh --network
          # M-6: the Vendor/libsignal fork may differ from official only in
          # allow-listed build files (never the crypto core).
          bash scripts/ci/verify-libsignal-submodule-delta.sh
          bash scripts/ci/verify-corresponding-source-archive.sh --version "$VERSION"
          SOURCE_ARCHIVE="$RUNNER_TEMP/OpenBurnBar-${VERSION}-corresponding-source.tar.gz"
          bash scripts/ci/build-corresponding-source-archive.sh --version "$VERSION" --output "$SOURCE_ARCHIVE"
          echo "source_path=$SOURCE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "source_sha256_path=${SOURCE_ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate direct-download update feeds
        id: update-feeds
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
          OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 }}
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
          # Tag pushes are never critical by default; manual reruns can flag a
          # security release so the in-app updater re-prompts past "Later".
          OPENBURNBAR_RELEASE_CRITICAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.critical) && '1' || '0' }}
        run: |
          # shellcheck disable=SC2153 # ZIP_PATH is supplied by the step env above.
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist")"
          DMG_NAME="$(basename "$DMG_PATH")"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          SOURCE_NAME="$(basename "$SOURCE_PATH")"
          BASE_URL="${OPENBURNBAR_MAC_UPDATE_BASE_URL:?OPENBURNBAR_MAC_UPDATE_BASE_URL is required}"
          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"
          LATEST_PATH="$RUNNER_TEMP/latest-macos.json"

          SPARKLE_PRIVATE_KEY="$(
            python3 - <<'PY'
          import base64
          import os

          print(base64.b64decode(os.environ["OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64"]).decode(), end="")
          PY
          )"
          SIGN_UPDATE_OUTPUT="$(printf "%s\n" "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_SIGN_UPDATE" --ed-key-file - "$DMG_PATH")"
          SPARKLE_ED_SIGNATURE="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$SIGN_UPDATE_OUTPUT" | head -n 1)"
          if [[ -z "$SPARKLE_ED_SIGNATURE" ]]; then
            echo "::error::Sparkle sign_update did not emit sparkle:edSignature."
            exit 1
          fi

          node scripts/generate-macos-appcast.mjs \
            --version "$VERSION" \
            --build "$BUILD" \
            --bundle-id "$BUNDLE_ID" \
            --release-dir "$RUNNER_TEMP" \
            --dmg-name "$DMG_NAME" \
            --zip-name "$ZIP_NAME" \
            --source-archive-name "$SOURCE_NAME" \
            --base-url "$BASE_URL" \
            --commit "$(git rev-parse HEAD)" \
            --minimum-system-version "14.0" \
            --appcast-name "$(basename "$APPCAST_PATH")" \
            --latest-name "$(basename "$LATEST_PATH")" \
            --ed-signature "$SPARKLE_ED_SIGNATURE" \
            --critical "${OPENBURNBAR_RELEASE_CRITICAL:-0}"

          {
            echo "appcast_path=$APPCAST_PATH"
            echo "latest_path=$LATEST_PATH"
            echo "update_base_url=$BASE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Create canonical retained domain-core rollback bundle
        id: domain-core-rollback
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag_name }}
        run: |
          set -euo pipefail
          activation="$RUNNER_TEMP/domain-core-activation.json"
          profile="$RUNNER_TEMP/domain-core-public-production-rollback.json"
          source_archive="$RUNNER_TEMP/OpenBurnBar-${VERSION}-legacy-source.tar.gz"
          rollback="$RUNNER_TEMP/OpenBurnBar-${VERSION}-legacy-rollback.zip"
          node scripts/ci/resolve-domain-core-activation.mjs \
            --release-commit "$RELEASE_COMMIT" --allow-dirty --format json \
            | jq '{candidateCommit, activationCommit, coreVersion, abiVersion, sourceSha256, changedPathsSha256}' \
            > "$activation"
          candidate="$(jq -er '.candidateCommit' "$activation")"
          node scripts/ci/resolve-domain-core-build-profile.mjs \
            --profile public-production-rollback \
            --expected-candidate-commit "$candidate" \
            --expected-release-commit "$RELEASE_COMMIT" \
            --expected-release-version "$VERSION" \
            --expected-release-tag "$RELEASE_TAG" \
            --allow-dirty \
            --format json --output "$profile"
          git merge-base --is-ancestor "$candidate" "$RELEASE_COMMIT"
          # The activation authority P is re-derived from the committed
          # authority files and is not the release commit R. Bind it to this
          # release's lineage: P must be an ancestor of R.
          activation_commit="$(jq -er '.activationCommit' "$activation")"
          git merge-base --is-ancestor "$activation_commit" "$RELEASE_COMMIT"
          git archive \
            --format=tar.gz \
            --prefix="OpenBurnBar-${VERSION}-legacy-source/" \
            --output="$source_archive" \
            "$candidate"
          test -s "$source_archive"
          python3 scripts/ci/create-domain-core-rollback-bundle.py \
            --profile "$profile" \
            --activation "$activation" \
            --source-archive "$source_archive" \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$rollback"
          test -s "$rollback"
          echo "rollback_path=$rollback" >> "$GITHUB_OUTPUT"
          echo "rollback_name=${rollback##*/}" >> "$GITHUB_OUTPUT"

      - name: Compute artifact checksums
        id: checksums
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          APPCAST_PATH: ${{ steps.update-feeds.outputs.appcast_path }}
          LATEST_PATH: ${{ steps.update-feeds.outputs.latest_path }}
          ROLLBACK_PATH: ${{ steps.domain-core-rollback.outputs.rollback_path }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          CHECKSUMS_FILE="$RUNNER_TEMP/checksums-v${VERSION}.txt"

          # Group writes (SC2129) so we open the output file once.
          {
            echo "# OpenBurnBar v${VERSION} release checksums"
            echo "# Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Commit: $(git rev-parse HEAD)"
            echo ""
            sha256sum "$DMG_PATH"
            sha512sum "$DMG_PATH"
            sha256sum "$ZIP_PATH"
            sha512sum "$ZIP_PATH"
            sha256sum "$SOURCE_PATH"
            sha512sum "$SOURCE_PATH"
            sha256sum "$APPCAST_PATH"
            sha512sum "$APPCAST_PATH"
            sha256sum "$LATEST_PATH"
            sha512sum "$LATEST_PATH"
            sha256sum "$ROLLBACK_PATH"
            sha512sum "$ROLLBACK_PATH"
          } > "$CHECKSUMS_FILE"

          cat "$CHECKSUMS_FILE"

          echo "checksums_path=$CHECKSUMS_FILE" >> "$GITHUB_OUTPUT"

      - name: Resolve release provenance policy
        id: provenance-policy
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -n "${RELEASE_SIGNING_KEY:-}" ]]; then
            echo "gpg_configured=true" >> "$GITHUB_OUTPUT"
            echo "Legacy GPG checksum signing is configured; detached checksum signature will be generated and verified."
          else
            echo "gpg_configured=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SIGNING_KEY is not configured; using required keyless Sigstore blob attestations for release provenance."
          fi

      - name: Sign checksums (legacy GPG, optional)
        id: sign-checksums
        env:
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        # Sigstore keyless attestations below are the required SOTA provenance
        # control. GPG checksum signatures are retained as an optional legacy
        # compatibility artifact when operators configure RELEASE_SIGNING_KEY.
        if: steps.provenance-policy.outputs.gpg_configured == 'true'
        run: |
          # Import the GPG signing key
          echo "$RELEASE_SIGNING_KEY" | base64 --decode | gpg --import --batch --passphrase ""

          # Create a detached signature for the checksums file
          gpg --batch --yes --detach-sign --armor \
            --local-user "OpenBurnBar Release" \
            "$CHECKSUMS_PATH"

          echo "sig_path=${CHECKSUMS_PATH}.asc" >> "$GITHUB_OUTPUT"
          echo "Checksums signed successfully."

      - name: Verify checksum GPG signature (when configured)
        if: steps.provenance-policy.outputs.gpg_configured == 'true'
        env:
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          SIGNATURE_PATH: ${{ steps.sign-checksums.outputs.sig_path }}
        run: |
          if [[ -z "${SIGNATURE_PATH:-}" || ! -f "$SIGNATURE_PATH" ]]; then
            echo "::error::RELEASE_SIGNING_KEY is configured, but the detached checksum signature was not produced."
            exit 1
          fi
          gpg --batch --verify "$SIGNATURE_PATH" "$CHECKSUMS_PATH"
          echo "Checksum GPG signature verified."

      - name: Generate SBOM
        id: sbom
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          SBOM_FILE="$RUNNER_TEMP/sbom-v${VERSION}.spdx.json"

          python3 scripts/generate-sbom.py \
            --version "$VERSION" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$SBOM_FILE"

          echo "sbom_path=$SBOM_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate OpenVEX sidecar
        id: vex
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          VEX_FILE="$RUNNER_TEMP/openburnbar-v${VERSION}.vex.json"
          python3 scripts/supply-chain/generate-vex.py \
            --sbom "$SBOM_PATH" \
            --output "$VEX_FILE" \
            --product-version "$VERSION"
          echo "vex_path=$VEX_FILE" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Sigstore blob attestations (SBOM + VEX + checksums + binaries)
        id: sigstore-provenance
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
          VEX_PATH: ${{ steps.vex.outputs.vex_path }}
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          APPCAST_PATH: ${{ steps.update-feeds.outputs.appcast_path }}
          LATEST_PATH: ${{ steps.update-feeds.outputs.latest_path }}
          ROLLBACK_PATH: ${{ steps.domain-core-rollback.outputs.rollback_path }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag_name }}
          RELEASE_REF: ${{ needs.release-preflight.outputs.tag_ref }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail

          PROVENANCE_DIR="$RUNNER_TEMP/release-provenance-v${VERSION}"
          PREDICATE_TYPE="https://openburnbar.dev/attestations/release-artifact/v1"
          mkdir -p "$PROVENANCE_DIR"

          attest_release_blob() {
            local artifact_path="$1"
            local artifact_name="$2"

            if [[ -z "$artifact_path" || ! -f "$artifact_path" ]]; then
              echo "::error::Release provenance artifact missing: $artifact_name ($artifact_path)"
              exit 1
            fi

            local safe_name="${artifact_name//[^A-Za-z0-9._-]/_}"
            local predicate_path="$PROVENANCE_DIR/${safe_name}.predicate.json"
            local bundle_path="$PROVENANCE_DIR/${safe_name}.sigstore.json"

            python3 - "$artifact_path" "$artifact_name" "$predicate_path" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          artifact_path = Path(sys.argv[1])
          artifact_name = sys.argv[2]
          predicate_path = Path(sys.argv[3])
          sha256 = hashlib.sha256(artifact_path.read_bytes()).hexdigest()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          release_commit = os.environ["RELEASE_COMMIT"]
          if commit != release_commit:
              raise SystemExit(f"release checkout drifted: HEAD={commit}, expected={release_commit}")

          predicate = {
              "schemaVersion": 1,
              "predicateType": "https://openburnbar.dev/attestations/release-artifact/v1",
              "artifact": {
                  "name": artifact_name,
                  "fileName": artifact_path.name,
                  "sha256": sha256,
                  "sizeBytes": artifact_path.stat().st_size,
              },
              "release": {
                  "version": os.environ["VERSION"],
                  "tag": os.environ["RELEASE_TAG"],
                  "commit": release_commit,
                  "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "ref": os.environ["RELEASE_REF"],
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "runID": os.environ.get("GITHUB_RUN_ID", ""),
                  "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              },
              "runner": {
                  "environment": os.environ["RUNNER_ENVIRONMENT"],
              },
          }
          predicate_path.write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

            cosign attest-blob --yes \
              --predicate "$predicate_path" \
              --type "$PREDICATE_TYPE" \
              --bundle "$bundle_path" \
              "$artifact_path"

            if [[ ! -s "$bundle_path" ]]; then
              echo "::error::cosign did not write a Sigstore bundle for $artifact_name"
              exit 1
            fi
          }

          attest_release_blob "$SBOM_PATH" "sbom-v${VERSION}.spdx.json"
          attest_release_blob "$VEX_PATH" "openburnbar-v${VERSION}.vex.json"
          attest_release_blob "$CHECKSUMS_PATH" "checksums-v${VERSION}.txt"
          attest_release_blob "$DMG_PATH" "${DMG_PATH##*/}"
          attest_release_blob "$ZIP_PATH" "${ZIP_PATH##*/}"
          attest_release_blob "$SOURCE_PATH" "${SOURCE_PATH##*/}"
          attest_release_blob "$APPCAST_PATH" "${APPCAST_PATH##*/}"
          attest_release_blob "$LATEST_PATH" "${LATEST_PATH##*/}"

          rollback_predicate="$PROVENANCE_DIR/${ROLLBACK_PATH##*/}.predicate.json"
          rollback_bundle="$PROVENANCE_DIR/${ROLLBACK_PATH##*/}.sigstore.json"
          python3 - "$ROLLBACK_PATH" "$rollback_predicate" <<'PY'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          artifact = Path(sys.argv[1])
          predicate = Path(sys.argv[2])
          with zipfile.ZipFile(artifact) as archive:
              manifest = json.loads(archive.read("manifest.json"))
          payload = {
              "schemaVersion": 1,
              "artifactKind": "legacy-rollback-bundle",
              "target": "all-supported-consumers",
              "artifact": {"fileName": artifact.name, "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest()},
              "release": {
                  "version": os.environ["VERSION"],
                  "tag": os.environ["RELEASE_TAG"],
                  "commit": os.environ["RELEASE_COMMIT"],
                  "candidate": manifest["candidate"],
                  "activation": manifest["activation"],
                  "retentionPolicy": manifest["retentionPolicy"],
              },
          }
          predicate.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          cosign attest-blob --yes \
            --predicate "$rollback_predicate" \
            --type https://openburnbar.dev/attestations/domain-core-rollback-artifact/v1 \
            --bundle "$rollback_bundle" \
            "$ROLLBACK_PATH"
          test -s "$rollback_bundle"

          echo "provenance_dir=$PROVENANCE_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Apple privacy manifests in release bundles
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          for manifest in \
            "$APP_PATH/Contents/Resources/PrivacyInfo.xcprivacy" \
            "AgentLens/Resources/PrivacyInfo.xcprivacy" \
            "OpenBurnBarMobile/Resources/PrivacyInfo.xcprivacy" \
            "OpenBurnBarWidget/Resources/PrivacyInfo.xcprivacy"; do
            if [[ ! -f "$manifest" ]]; then
              echo "Missing privacy manifest: $manifest" >&2
              exit 1
            fi
          done
          echo "Privacy manifests present for macOS app source trees and embedded bundle."

      - name: Generate third-party NOTICES from SBOM
        id: notices
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          NOTICES_FILE="$RUNNER_TEMP/NOTICES-v${VERSION}.txt"
          python3 - <<'PY' "$SBOM_PATH" "$NOTICES_FILE" "$VERSION"
          import json, sys
          from pathlib import Path
          sbom_path, notices_path, version = sys.argv[1:4]
          data = json.loads(Path(sbom_path).read_text())
          packages = data.get("packages") or []
          lines = [
              f"OpenBurnBar v{version} — third-party notices",
              "Generated from SPDX SBOM at release time.",
              "",
          ]
          for pkg in sorted(packages, key=lambda p: (p.get("name") or "", p.get("version") or "")):
              name = pkg.get("name") or "unknown"
              ver = pkg.get("version") or ""
              license_id = None
              for ref in pkg.get("licenseConcluded") or []:
                  if isinstance(ref, str) and ref.startswith("LicenseRef-"):
                      license_id = ref.replace("LicenseRef-", "")
              if license_id is None and pkg.get("licenseDeclared"):
                  license_id = str(pkg["licenseDeclared"])
              lines.append(f"{name} {ver}".strip())
              if license_id:
                  lines.append(f"  License: {license_id}")
              lines.append("")
          Path(notices_path).write_text("\n".join(lines))
          print(f"Wrote {notices_path} ({len(packages)} packages)")
          PY
          echo "notices_path=$NOTICES_FILE" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        id: metadata
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          TAG_NAME: ${{ needs.release-preflight.outputs.tag_name }}
          SOURCE_ARCHIVE: OpenBurnBar-${{ needs.release-preflight.outputs.version }}-corresponding-source.tar.gz
          UPDATE_BASE_URL: ${{ steps.update-feeds.outputs.update_base_url }}
          APPCAST_FILE: appcast.xml
          LATEST_FILE: latest-macos.json
        run: |
          METADATA_FILE="$RUNNER_TEMP/release-metadata.json"

          python3 - <<'PY' > "$METADATA_FILE"
          import datetime
          import json
          import os
          import subprocess

          metadata = {
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG_NAME"],
              "correspondingSource": os.environ["SOURCE_ARCHIVE"],
              "channel": "direct-download",
              "updateBaseUrl": os.environ["UPDATE_BASE_URL"],
              "appcast": os.environ["APPCAST_FILE"],
              "latestMetadata": os.environ["LATEST_FILE"],
              "sparkleEdSignaturePresent": True,
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "build_timestamp": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
              "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
          }
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY

          echo "metadata_path=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          cat "$METADATA_FILE"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_path }}
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload retained domain-core rollback artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.domain-core-rollback.outputs.rollback_name }}
          path: ${{ steps.domain-core-rollback.outputs.rollback_path }}
          if-no-files-found: error

      - name: Upload appcast artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: appcast-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.update-feeds.outputs.appcast_path }}
          if-no-files-found: error

      - name: Upload latest macOS metadata artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: latest-macos-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.update-feeds.outputs.latest_path }}
          if-no-files-found: error

      - name: Upload checksums artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: checksums-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.checksums.outputs.checksums_path }}
          if-no-files-found: error

      - name: Upload checksum signature artifact
        if: steps.sign-checksums.outputs.sig_path != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: checksums-v${{ needs.release-preflight.outputs.version }}-signature
          path: ${{ steps.sign-checksums.outputs.sig_path }}
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: sbom-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.sbom.outputs.sbom_path }}
          if-no-files-found: error

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: OpenBurnBar-${{ needs.release-preflight.outputs.version }}-corresponding-source
          path: |
            ${{ steps.corresponding-source.outputs.source_path }}
            ${{ steps.corresponding-source.outputs.source_sha256_path }}
          if-no-files-found: error

      - name: Upload VEX artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: vex-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.vex.outputs.vex_path }}
          if-no-files-found: error

      - name: Upload release provenance bundles artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: release-provenance-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.sigstore-provenance.outputs.provenance_dir }}
          if-no-files-found: error

      - name: Upload observed Android Rust identity
        if: ${{ needs.domain-core-native-release-gate.outputs.rust_active == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-native-observed-identities-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-android-observed-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload NOTICES artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: notices-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.notices.outputs.notices_path }}
          if-no-files-found: error

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: release-metadata-v${{ needs.release-preflight.outputs.version }}
          path: ${{ steps.metadata.outputs.metadata_path }}
          if-no-files-found: error

      - name: Clean up Firebase config
        if: always()
        run: bash ./scripts/ci/cleanup-firebase-config.sh

      - name: Clean up signing and notary artifacts
        if: always()
        run: |
          if [[ -n "${keychain_path:-}" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          if [[ -n "${notary_key_path:-}" ]]; then
            rm -f "$notary_key_path"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  domain-core-ios-release-evidence:
    name: Domain Core iOS release evidence
    # Follows the iOS job, not the Mac one. `!cancelled()` displaces the
    # implicit success() guard so a failed iOS build reaches this job and
    # reports "not enabled" instead of propagating a skip into publication.
    #
    # build-and-release is nevertheless a dependency: when the iOS lane
    # succeeds this job downloads the canonical retained rollback bundle,
    # which build-and-release produces. Without the edge the two race and the
    # download fails with "Artifact not found for name:
    # OpenBurnBar-<version>-legacy-rollback.zip". The race stayed invisible
    # because every prior release failed the iOS lane, leaving `enabled` false
    # so the job reported "not enabled" and never reached the download.
    # `!cancelled()` still displaces success(), so a failed Mac lane reaches
    # this job exactly as a failed iOS lane does.
    if: ${{ !cancelled() && needs.release-preflight.result == 'success' }}
    needs:
      - release-preflight
      - domain-core-native-release-gate
      - build-ios-release
      - build-and-release
    uses: ./.github/workflows/domain-core-ios-release-evidence.yml
    with:
      # No archive exists to gather evidence for when the iOS lane failed.
      #
      # Rust-inactive releases ship the legacy implementation, so the iOS
      # executable carries no linked Rust domain core and demanding its
      # identity symbols is incoherent: the lane can only ever fail. That is
      # what v1.0.40+repair.26 hit -- the first release whose iOS lane actually
      # built, which made the lane run for the first time instead of reporting
      # "not enabled" over a missing archive.
      #
      # promote-github-release.mjs already states the intended shape: a
      # governed rollback release "publishes the legacy artifacts with no
      # native domain-core evidence and no App Store iOS lane". Gate on
      # rust_active so that holds here too. This also keeps the App Store
      # Connect upload in this lane from running for a release that will never
      # produce the evidence to attest it.
      enabled: ${{ needs.release-preflight.outputs.is_prerelease == 'false' && needs.build-ios-release.result == 'success' && needs.domain-core-native-release-gate.outputs.rust_active == 'true' }}
      version: ${{ needs.release-preflight.outputs.version }}
      release_commit: ${{ needs.release-preflight.outputs.release_commit }}
      archive_artifact_name: OpenBurnBar-${{ needs.release-preflight.outputs.version }}-iOS-archive
      domain_core_profile: ${{ needs.release-preflight.outputs.domain_core_profile }}
      # build-and-release bakes the gate's candidate identity into the iOS app.
      # Forward the same verdict so iOS evidence verifies against it rather than
      # re-deriving an activation authority commit that the artifacts never saw.
      gate_artifact_name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
      gate_candidate_commit: ${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}
      gate_profile_name: ${{ needs.domain-core-native-release-gate.outputs.profile_name }}
      gate_rust_active: ${{ needs.domain-core-native-release-gate.outputs.rust_active }}
    secrets: inherit

  # iOS is packaged in its own job so a broken iOS target cannot block a macOS
  # release. It blocked every macOS release for weeks in August 2026 while the
  # Mac app itself built and signed cleanly.
  #
  # NOTHING depends on this job. Its failure is visible on the run and excludes
  # iOS from the release; it cannot fail the Mac lane, publication, or promotion.
  #
  # The setup below duplicates build-and-release's because both need the same
  # signed inputs. Source coherence is preserved by construction: both jobs
  # check out the same `release_commit` and build the FFI from it, and nothing
  # in the pipeline compares the two FFI builds byte-for-byte — only that each
  # is built from the pinned release source. See docs/CI_RELEASE_RUNBOOK.md.
  build-ios-release:
    if: ${{ always() && needs.release-preflight.result == 'success' && needs.release-preflight.outputs.is_prerelease == 'false' && (needs.authorize-domain-core-rollback.result == 'success' || needs.authorize-domain-core-rollback.result == 'skipped') && needs.domain-core-native-release-gate.result == 'success' }}
    name: build-ios-release
    needs:
      [
        release-preflight,
        authorize-domain-core-rollback,
        domain-core-native-release-gate,
      ]
    runs-on: macos-26
    timeout-minutes: 180
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository for iOS packaging
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - name: Check out release tag for iOS packaging
        env:
          TAG_REF: ${{ needs.release-preflight.outputs.tag_ref }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+${TAG_REF}:${TAG_REF}"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal

      # Runs inside the environment-bound job on purpose: environment-scoped
      # secrets only resolve for jobs bound to the release environment, so this
      # fail-hard presence check must live with the signing work it protects.
      - name: Validate strict release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: |
          missing=()
          for var in \
            APPLE_TEAM_ID \
            APPLE_SIGNING_IDENTITY \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_API_KEY_P8 \
            OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 \
            FIREBASE_PLIST_BASE64; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi
          # regularFile() fail-closes on relative paths, so the policy must be
          # passed absolute or this step can never pass.
          node scripts/ci/verify-domain-core-apple-signing-identity.mjs \
            --policy "$GITHUB_WORKSPACE/config/apple-release-signing-policy.json" --environment

      - name: Write Apple API key
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          export NOTARY_KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          payload = "".join(os.environ["APPLE_NOTARY_API_KEY_P8"].split())
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(payload, validate=True))
          PY
          chmod 600 "$NOTARY_KEY_PATH"
          echo "notary_key_path=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Download verified Shared Rust release inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-release-gate

      - name: Resolve signed public domain-core profile
        env:
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
        run: |
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --expected-release-commit "$RELEASE_COMMIT" --format github-env >> "$GITHUB_ENV"
          node scripts/ci/resolve-domain-core-build-profile.mjs --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" --expected-candidate-commit "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" --expected-release-commit "$RELEASE_COMMIT" --format github-env-apple >> "$GITHUB_ENV"

      - name: Inject Firebase config
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Inject iOS/macOS Sentry config
        env:
          OPENBURNBAR_SENTRY_DSN: ${{ secrets.OPENBURNBAR_SENTRY_DSN }}
        run: bash ./scripts/ci/inject-sentry-config-ios.sh

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Ensure libsignal native toolchain (protoc + cmake)
        uses: ./.github/actions/ensure-libsignal-toolchain

      - name: Resolve libsignal revision
        id: libsignal
        run: echo "rev=$(git rev-parse HEAD:Vendor/libsignal)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: .spm-cache
          key: release-spm-package-${{ runner.os }}-${{ hashFiles('OpenBurnBar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenBurnBarDaemon/Package.resolved') }}
          restore-keys: |
            release-spm-package-${{ runner.os }}-

      - name: Restore cargo cache for libsignal FFI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24-native)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/libsignal/target
          key: release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-${{ steps.libsignal.outputs.rev }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-

      - name: Prepare Signal FFI XCFramework for release app
        env:
          SIGNAL_FFI_BUILD_PROFILE: release
          # The protected release lane packages both the direct-download Mac app
          # and the App Store iOS archive from one source-coherent FFI build.
          SIGNAL_FFI_BUILD_TARGETS: "aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/lib/prepare-signal-ffi-xcframework.sh

      - name: Prepare shared domain core XCFramework for release app
        env:
          DOMAIN_CORE_BUILD_PROFILE: release
        run: bash scripts/build-domain-core-xcframework.sh

      - name: Verify shared domain core release artifact
        run: test -d Vendor/OpenBurnBarDomainCore.xcframework

      - name: Prepare Mercury Iroh XCFramework for release app
        env:
          IROH_BUILD_PROFILE: release
        run: bash scripts/build-iroh-xcframework.sh

      - name: Verify Mercury Iroh release artifact
        run: bash scripts/ci/verify-iroh-release-artifact.sh
      - name: Archive and export signed iOS app
        if: needs.release-preflight.outputs.is_prerelease == 'false'
        id: ios-archive
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OpenBurnBarMobile.xcarchive"
          export_dir="$RUNNER_TEMP/ios-app-store-export"
          bundle_dir="$RUNNER_TEMP/ios-release-bundle"
          archive_zip="$RUNNER_TEMP/OpenBurnBar-${VERSION}-iOS.xcarchive.zip"
          export_options="$RUNNER_TEMP/OpenBurnBarMobile-ExportOptions.plist"
          build_number="$GITHUB_RUN_NUMBER"
          apple_version="${VERSION%%+*}"
          rm -rf "$archive" "$export_dir" "$bundle_dir" "$archive_zip"
          mkdir -p "$export_dir" "$bundle_dir"

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          auth_args=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$notary_key_path"
            -authenticationKeyID "$APPLE_NOTARY_KEY_ID"
            -authenticationKeyIssuerID "$APPLE_NOTARY_ISSUER_ID"
          )
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme OpenBurnBarMobile \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -clonedSourcePackagesDirPath "$CACHE_DIR" \
            -derivedDataPath "$DERIVED_DATA-ios" \
            "${auth_args[@]}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$apple_version" \
            CURRENT_PROJECT_VERSION="$build_number" \
            DOMAIN_CORE_BUILD_PROFILE="$DOMAIN_CORE_BUILD_PROFILE" \
            DOMAIN_CORE_BUILD_AUTHORITY="$DOMAIN_CORE_BUILD_AUTHORITY" \
            DOMAIN_CORE_DISTRIBUTION="$DOMAIN_CORE_DISTRIBUTION" \
            DOMAIN_CORE_ROLLOUT_CHANNEL="$DOMAIN_CORE_ROLLOUT_CHANNEL" \
            DOMAIN_CORE_EVIDENCE_ENABLED="$DOMAIN_CORE_EVIDENCE_ENABLED" \
            DOMAIN_CORE_CANDIDATE_COMMIT="$DOMAIN_CORE_CANDIDATE_COMMIT" \
            DOMAIN_CORE_EXPECTED_VERSION="$DOMAIN_CORE_EXPECTED_VERSION" \
            DOMAIN_CORE_EXPECTED_ABI_VERSION="$DOMAIN_CORE_EXPECTED_ABI_VERSION" \
            DOMAIN_CORE_EXPECTED_SOURCE_SHA256="$DOMAIN_CORE_EXPECTED_SOURCE_SHA256" \
            DOMAIN_CORE_QUOTA_MODE="$DOMAIN_CORE_QUOTA_MODE" \
            DOMAIN_CORE_CLOUDVAULT_MODE="$DOMAIN_CORE_CLOUDVAULT_MODE" \
            DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE="$DOMAIN_CORE_CLOUDVAULT_REWRAP_MODE" \
            DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE="$DOMAIN_CORE_CLOUDVAULT_SEARCH_MODE" \
            DOMAIN_CORE_HERMES_MODE="$DOMAIN_CORE_HERMES_MODE" \
            DOMAIN_CORE_PRICING_MODE="$DOMAIN_CORE_PRICING_MODE"

          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$export_options" \
            "${auth_args[@]}"

          ipa="$(find "$export_dir" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          test -s "$ipa"
          ipa_unpacked="$RUNNER_TEMP/ios-app-store-ipa"
          rm -rf "$ipa_unpacked"
          mkdir -p "$ipa_unpacked"
          unzip -q "$ipa" -d "$ipa_unpacked"
          exported_app="$ipa_unpacked/Payload/OpenBurnBarMobile.app"
          test -d "$exported_app"
          test -s "$exported_app/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$exported_app"
          app="$archive/Products/Applications/OpenBurnBarMobile.app"
          test -d "$app"
          test -s "$app/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs \
            --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" \
            --expected-candidate-commit "$DOMAIN_CORE_CANDIDATE_COMMIT" \
            --apple-app "$app"
          node scripts/ci/verify-domain-core-build-profile-artifact.mjs \
            --profile "${{ needs.domain-core-native-release-gate.outputs.profile_name }}" \
            --expected-candidate-commit "$DOMAIN_CORE_CANDIDATE_COMMIT" \
            --apple-app "$exported_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archive/Info.plist")" = "$apple_version"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

          cp -R "$archive" "$bundle_dir/OpenBurnBarMobile.xcarchive"
          cp "$ipa" "$bundle_dir/OpenBurnBarMobile.ipa"
          ditto -c -k --sequesterRsrc "$bundle_dir" "$archive_zip"
          test -s "$archive_zip"
          echo "archive_path=$archive_zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=OpenBurnBar-${VERSION}-iOS-archive" >> "$GITHUB_OUTPUT"

      - name: Upload signed iOS archive artifact
        if: needs.release-preflight.outputs.is_prerelease == 'false'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.ios-archive.outputs.artifact_name }}
          path: ${{ steps.ios-archive.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 90

  smoke-test:
    needs: build-and-release
    # `authorize-domain-core-rollback` skips on every non-rollback release, and
    # a skip propagates transitively through `needs` even across
    # `build-and-release`, which runs under always() and succeeds. Without a
    # status-check function here this job is never scheduled, and because
    # apple-native-prepublication and prepare-release-publication both require
    # `needs.smoke-test.result == 'success'`, publication could not happen on a
    # normal release at all. See docs/CI_RELEASE_RUNBOOK.md §1.1.
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Download DMG artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.dmg_name }}
          path: ${{ runner.temp }}

      - name: Smoke test mounted release DMG
        env:
          DMG_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.dmg_name }}
        run: |
          bash scripts/ci/verify-apple-appcheck-release-artifact.sh "$DMG_PATH"
          bash scripts/ci/smoke-openburnbar-release-dmg.sh "$DMG_PATH"

  apple-native-prepublication:
    name: Verify and stage immutable Apple DMG before publication
    needs:
      - release-preflight
      - domain-core-native-release-gate
      - build-and-release
      - smoke-test
    if: ${{ needs.smoke-test.result == 'success' && needs.domain-core-native-release-gate.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 25
    environment: release
    permissions:
      actions: read
      contents: write
    outputs:
      identity_artifact_name: domain-core-apple-prepublication-identity-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.release-preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact verified release inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-release-gate

      - name: Download signed Apple DMG
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.dmg_name }}
          path: ${{ runner.temp }}/domain-core-apple-prepublication

      - name: Execute final mounted-app Rust identity mode and verify pinned signer
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          PROFILE: ${{ needs.domain-core-native-release-gate.outputs.profile_name }}
          COMMIT: ${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}
          DMG_PATH: ${{ runner.temp }}/domain-core-apple-prepublication/${{ needs.build-and-release.outputs.dmg_name }}
          OBSERVED_IDENTITY: ${{ runner.temp }}/domain-core-apple-prepublication-observed-identity.json
        run: |
          set -euo pipefail
          bash scripts/ci/verify-domain-core-native-release-artifact.sh \
            apple "$DMG_PATH" "$VERSION" "$PROFILE" "$COMMIT" \
            "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-selected-public-profile.json" \
            "$OBSERVED_IDENTITY"

      - name: Retain prepublication Apple observed identity
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-apple-prepublication-identity-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-apple-prepublication-observed-identity.json
          if-no-files-found: error
          retention-days: 90

  android-release-identity:
    name: Android release identity proof (x86_64 emulator)
    # The dynamic proof that the shipped domain-core library actually loads
    # with the attested identity. It lives on ubuntu-24.04 + KVM because
    # hosted Apple Silicon runners cannot start the Android emulator at all
    # (HV_UNSUPPORTED; see android-hermes-smoke in openburnbar-pr-harness.yml).
    # Coverage contract: this job binds loaded-bytes == the AAB's x86_64 slice
    # dynamically; build-and-release binds BOTH packaged ABIs byte-for-byte to
    # the protected candidate AAR statically; the AAR is bound by the
    # domain-core provenance chain. The inputs are the exact signed APKs
    # uploaded by build-and-release — nothing is rebuilt here.
    needs:
      - release-preflight
      - domain-core-native-release-gate
      - build-and-release
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' && needs.domain-core-native-release-gate.result == 'success' && needs.domain-core-native-release-gate.outputs.rust_active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.release-preflight.outputs.release_commit }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download verified Shared Rust release inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-release-gate

      - name: Download Android identity proof inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: android-release-identity-inputs-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/identity-inputs

      - name: Download Android release bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: OpenBurnBar-${{ needs.release-preflight.outputs.version }}-Android.aab
          path: ${{ runner.temp }}/android-bundle

      - name: Execute and record loaded Android Rust identity
        # Release provenance guard: never soft-failable — the boundary
        # verifier forbids it on guard steps, and a guard that tolerates its
        # own failure is not a guard.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: |
            bash scripts/ci/run-android-release-startup-smoke.sh "$RUNNER_TEMP/identity-inputs/app/build/outputs/apk/release/app-release.apk"
            bash scripts/ci/run-domain-core-android-native-load.sh "$RUNNER_TEMP/identity-inputs/openburnbar-domain-core/build/outputs/apk/androidTest/debug/openburnbar-domain-core-debug-androidTest.apk" "${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}" "$RUNNER_TEMP/domain-core-android-observed-identity.json"

      - name: Verify loaded Android Rust identity
        run: |
          set -euo pipefail
          packaged_library="$RUNNER_TEMP/domain-core-android-packaged-libopenburnbar_domain_ffi.so"
          unzip -p "$RUNNER_TEMP/android-bundle/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-Android.aab" \
            base/lib/x86_64/libopenburnbar_domain_ffi.so > "$packaged_library"
          test -s "$packaged_library"
          node scripts/ci/verify-domain-core-observed-identity.mjs \
            --profile "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-selected-public-profile.json" \
            --observed-identity "$RUNNER_TEMP/domain-core-android-observed-identity.json" \
            --binary "$packaged_library"

      - name: Upload observed Android Rust identity
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-android-observed-identity-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/domain-core-android-observed-identity.json
          if-no-files-found: error

  prepare-release-publication:
    # Fail-closed release gate: preparation requires every validation lane and the
    # packaging + artifact smoke chain. A skipped gate only occurs through the
    # owner-approved bypass inputs validated in release-preflight; a failed or
    # cancelled gate blocks publication.
    #
    # One deliberate exception: when the iOS lane itself failed
    # (build-ios-release.result != 'success'), a failed release-mobile-gate no
    # longer blocks publication. The iOS product is already excluded from the
    # release in that case, so iOS unit tests failing alongside a broken iOS
    # build is consistent rather than new signal -- and holding the finished,
    # signed macOS release hostage to it recreates the August 2026 coupling
    # this workflow was restructured to remove. Every other gate remains
    # strictly required, and mobile-gate failure still blocks whenever the iOS
    # build succeeded.
    if: >-
      ${{ !cancelled()
          && needs.release-preflight.result == 'success'
          && needs.release-swift-gate.result != 'failure'
          && needs.release-app-gate.result != 'failure'
          && needs.release-sqlcipher-gate.result != 'failure'
          && (needs.release-mobile-gate.result != 'failure'
              || needs.build-ios-release.result != 'success')
          && needs.release-android-gate.result != 'failure'
          && needs.release-functions-gate.result != 'failure'
          && needs.release-extension-gate.result != 'failure'
          && needs.release-supply-chain-gate.result != 'failure'
          && needs.build-and-release.result == 'success'
          && (needs.android-release-identity.result == 'success'
              || (needs.domain-core-native-release-gate.outputs.rust_active == 'false'
                  && needs.android-release-identity.result == 'skipped'))
          && needs.domain-core-ios-release-evidence.result != 'failure'
          && needs.smoke-test.result == 'success'
          && needs.apple-native-prepublication.result != 'failure' }}
    needs:
      - release-preflight
      - release-swift-gate
      - release-app-gate
      - release-sqlcipher-gate
      - release-mobile-gate
      - release-android-gate
      - release-functions-gate
      - release-extension-gate
      - release-supply-chain-gate
      - build-and-release
      - domain-core-native-release-gate
      - android-release-identity
      - build-ios-release
      - domain-core-ios-release-evidence
      - smoke-test
      - apple-native-prepublication
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      publication_inputs_artifact_name: release-publication-inputs-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.release-preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Stage the complete general release asset set
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          DMG_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.dmg_name }}
          ZIP_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.zip_name }}
        run: |
          set -euo pipefail
          # Checksums, SBOM, and metadata are also downloaded via merge-multiple.
          # `find -print -quit` is shellcheck-clean (SC2012) and quoted to handle spaces (SC2086).
          CHECKSUMS_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "checksums-v${VERSION}*.txt" -print -quit 2>/dev/null)
          APPCAST_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "appcast.xml" -print -quit 2>/dev/null)
          LATEST_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "latest-macos.json" -print -quit 2>/dev/null)
          SBOM_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.spdx.json" -print -quit 2>/dev/null)
          VEX_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.vex.json" -print -quit 2>/dev/null)
          NOTICES_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "NOTICES-v${VERSION}*.txt" -print -quit 2>/dev/null)
          METADATA_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "release-metadata.json" -print -quit 2>/dev/null)
          SOURCE_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "OpenBurnBar-${VERSION}-corresponding-source.tar.gz" -print -quit 2>/dev/null)
          SOURCE_SHA256_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "OpenBurnBar-${VERSION}-corresponding-source.tar.gz.sha256" -print -quit 2>/dev/null)
          SIG_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.asc" -print -quit 2>/dev/null)
          ROLLBACK_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "OpenBurnBar-${VERSION}-legacy-rollback.zip" -print -quit 2>/dev/null)
          PROVENANCE_PATHS=()
          while IFS= read -r provenance_path; do
            [[ -n "$provenance_path" ]] && PROVENANCE_PATHS+=("$provenance_path")
          done < <(find "$RUNNER_TEMP" -type f \( -name "*.sigstore.json" -o -name "*.predicate.json" \) ! -name 'domain-core-ios-*' -print 2>/dev/null | sort)

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          VERSION_TAG="${VERSION#v}"
          awk -v ver="$VERSION_TAG" '
            /^## / {
              if (found) { exit }
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::warning::No CHANGELOG section for $VERSION_TAG; using [Unreleased]"
            awk '/^## / { if (found) { exit } if ($0 ~ /\[Unreleased\]/) { found=1; next } } found { print }' \
              CHANGELOG.md > "$NOTES_FILE"
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::warning::No [Unreleased] section either; falling back to full CHANGELOG"
            cp CHANGELOG.md "$NOTES_FILE"
          fi

          for asset in "$DMG_PATH" "$ZIP_PATH" "$ROLLBACK_PATH"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release asset missing after artifact download: $asset"
              exit 1
            fi
          done
          bash scripts/ci/verify-apple-appcheck-release-artifact.sh "$DMG_PATH" "$ZIP_PATH"
          ASSETS=("$ZIP_PATH" "$ROLLBACK_PATH")
          [[ -n "$CHECKSUMS_PATH" && -f "$CHECKSUMS_PATH" ]] && ASSETS+=("$CHECKSUMS_PATH")
          [[ -n "$APPCAST_PATH" && -f "$APPCAST_PATH" ]] && ASSETS+=("$APPCAST_PATH")
          [[ -n "$LATEST_PATH" && -f "$LATEST_PATH" ]] && ASSETS+=("$LATEST_PATH")
          [[ -n "$SBOM_PATH" && -f "$SBOM_PATH" ]] && ASSETS+=("$SBOM_PATH")
          [[ -n "$VEX_PATH" && -f "$VEX_PATH" ]] && ASSETS+=("$VEX_PATH")
          [[ -n "$NOTICES_PATH" && -f "$NOTICES_PATH" ]] && ASSETS+=("$NOTICES_PATH")
          [[ -n "$METADATA_PATH" && -f "$METADATA_PATH" ]] && ASSETS+=("$METADATA_PATH")
          [[ -n "$SOURCE_PATH" && -f "$SOURCE_PATH" ]] && ASSETS+=("$SOURCE_PATH")
          [[ -n "$SOURCE_SHA256_PATH" && -f "$SOURCE_SHA256_PATH" ]] && ASSETS+=("$SOURCE_SHA256_PATH")
          [[ -n "$SIG_PATH" && -f "$SIG_PATH" ]] && ASSETS+=("$SIG_PATH")
          if ((${#PROVENANCE_PATHS[@]} == 0)); then
            echo "::error::Release provenance bundles missing after artifact download."
            exit 1
          fi
          ASSETS+=("${PROVENANCE_PATHS[@]}")
          stage="$RUNNER_TEMP/release-publication-inputs"
          mkdir -p "$stage/assets"
          cp "$NOTES_FILE" "$stage/release-notes.md"
          for asset in "${ASSETS[@]}"; do
            destination="$stage/assets/$(basename "$asset")"
            if [[ -e "$destination" ]]; then
              echo "::error::Duplicate general release asset name: $(basename "$asset")"
              exit 1
            fi
            cp "$asset" "$destination"
          done

          ios_predicates=()
          while IFS= read -r predicate; do
            [[ -n "$predicate" ]] && ios_predicates+=("$predicate")
          done < <(find "$RUNNER_TEMP" -type f -name 'domain-core-ios-*.predicate.json' -print 2>/dev/null | LC_ALL=C sort)
          if ((${#ios_predicates[@]} > 0)); then
            ios_archive="$(find "$RUNNER_TEMP" -type f -name "OpenBurnBar-${VERSION}-iOS.xcarchive.zip" -print -quit 2>/dev/null)"
            ios_receipt="$(find "$RUNNER_TEMP" -type f -name 'app-store-connect-receipt.json' -print -quit 2>/dev/null)"
            test -s "$ios_archive"
            test -s "$ios_receipt"
            mkdir -p "$stage/ios"
            cp "$ios_archive" "$stage/ios/"
            cp "$ios_receipt" "$stage/assets/OpenBurnBar-${VERSION}-iOS-app-store-connect-receipt.json"
            for predicate in "${ios_predicates[@]}"; do
              bundle="${predicate}.sigstore.json"
              test -s "$bundle"
              cp "$predicate" "$bundle" "$stage/ios/"
            done
          fi

      - name: Retain exact general publication inputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: release-publication-inputs-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publication-inputs/
          if-no-files-found: error
          retention-days: 90

  domain-core-native-release-evidence:
    name: Atomically publish verified Apple and Android release set
    needs:
      - release-preflight
      - domain-core-native-release-gate
      - build-and-release
      - apple-native-prepublication
      - prepare-release-publication
    if: ${{ needs.prepare-release-publication.result == 'success' && needs.apple-native-prepublication.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ needs.release-preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact verified release inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.domain-core-native-release-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-release-gate

      - name: Download signed Apple artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.dmg_name }}
          path: ${{ runner.temp }}/domain-core-native-artifacts

      - name: Download signed Android artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.aab_name }}
          path: ${{ runner.temp }}/domain-core-native-artifacts

      - name: Download observed native Rust identities
        if: ${{ needs.domain-core-native-release-gate.outputs.rust_active == 'true' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.native_identity_artifact_name }}
          path: ${{ runner.temp }}/domain-core-native-identities

      - name: Download prepublication Apple observed identity
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.apple-native-prepublication.outputs.identity_artifact_name }}
          path: ${{ runner.temp }}/domain-core-apple-prepublication-identity

      - name: Download exact general publication inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (node24-native)
        with:
          name: ${{ needs.prepare-release-publication.outputs.publication_inputs_artifact_name }}
          path: ${{ runner.temp }}/release-publication-inputs

      - name: Reverify signed artifacts, selected profile, and loaded Rust identity
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          PROFILE: ${{ needs.domain-core-native-release-gate.outputs.profile_name }}
          COMMIT: ${{ needs.domain-core-native-release-gate.outputs.candidate_commit }}
          DMG_PATH: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          AAB_PATH: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          RUST_ACTIVE: ${{ needs.domain-core-native-release-gate.outputs.rust_active }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/domain-core-native-release-gate/domain-core-selected-public-profile.json"
          mkdir -p "$RUNNER_TEMP/domain-core-native-evidence"
          protected_android=()
          if [[ "$RUST_ACTIVE" == "true" ]]; then
            protected_android=(
              "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-candidate-bundle.json"
              "$RUNNER_TEMP/domain-core-native-evidence/android-universal-abi-manifest.json"
            )
          fi
          android_observed_identity=""
          if [[ "$RUST_ACTIVE" == "true" ]]; then
            android_observed_identity="$RUNNER_TEMP/domain-core-native-identities/domain-core-android-observed-identity.json"
          fi
          bash scripts/ci/verify-domain-core-native-release-artifact.sh \
            apple "$DMG_PATH" "$VERSION" "$PROFILE" "$COMMIT" "$profile" \
            "$RUNNER_TEMP/domain-core-native-evidence/apple-final-reverify-identity.json"
          bash scripts/ci/verify-domain-core-native-release-artifact.sh \
            android "$AAB_PATH" "$VERSION" "$PROFILE" "$COMMIT" "$profile" \
            "$android_observed_identity" \
            ${protected_android[@]+"${protected_android[@]}"}

      - name: Create Apple v2 release predicates
        id: apple-plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
          TAG: ${{ needs.release-preflight.outputs.tag_name }}
          COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          PROFILE: ${{ needs.domain-core-native-release-gate.outputs.profile_name }}
          SIGNER_RUN_ID: ${{ needs.domain-core-native-release-gate.outputs.signer_run_id }}
          SIGNER_RUN_ATTEMPT: ${{ needs.domain-core-native-release-gate.outputs.signer_run_attempt }}
          DMG_PATH: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          RUST_ACTIVE: ${{ needs.domain-core-native-release-gate.outputs.rust_active }}
        run: |
          set -euo pipefail
          protected_evidence=()
          if [[ "$RUST_ACTIVE" == "true" ]]; then
            protected_evidence=(
              --candidate-bundle "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-candidate-bundle.json"
              --promotion-attestation "$RUNNER_TEMP/domain-core-native-release-gate/promotion/domain-core-promotion-attestation.sigstore.jsonl"
              --protected-signer-run-id "$SIGNER_RUN_ID"
              --protected-signer-run-attempt "$SIGNER_RUN_ATTEMPT"
              --rollback-artifact "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-public-production-rollback.json"
            )
          fi
          node scripts/ci/create-domain-core-native-release-evidence.mjs \
            --consumer apple --artifact "$DMG_PATH" --version "$VERSION" \
            --tag "$TAG" --commit "$COMMIT" --profile-name "$PROFILE" \
            --profile "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-selected-public-profile.json" \
            --activation "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-activation.json" \
            ${protected_evidence[@]+"${protected_evidence[@]}"} \
            --output-dir "$RUNNER_TEMP/domain-core-native-evidence/apple" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create Android v2 release predicates
        id: android-plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
          TAG: ${{ needs.release-preflight.outputs.tag_name }}
          COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          PROFILE: ${{ needs.domain-core-native-release-gate.outputs.profile_name }}
          SIGNER_RUN_ID: ${{ needs.domain-core-native-release-gate.outputs.signer_run_id }}
          SIGNER_RUN_ATTEMPT: ${{ needs.domain-core-native-release-gate.outputs.signer_run_attempt }}
          AAB_PATH: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          RUST_ACTIVE: ${{ needs.domain-core-native-release-gate.outputs.rust_active }}
        run: |
          set -euo pipefail
          protected_evidence=()
          if [[ "$RUST_ACTIVE" == "true" ]]; then
            protected_evidence=(
              --candidate-bundle "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-candidate-bundle.json"
              --promotion-attestation "$RUNNER_TEMP/domain-core-native-release-gate/promotion/domain-core-promotion-attestation.sigstore.jsonl"
              --protected-signer-run-id "$SIGNER_RUN_ID"
              --protected-signer-run-attempt "$SIGNER_RUN_ATTEMPT"
              --rollback-artifact "$RUNNER_TEMP/domain-core-native-release-gate/source/domain-core-public-production-rollback.json"
              --android-abi-manifest "$RUNNER_TEMP/domain-core-native-evidence/android-universal-abi-manifest.json"
            )
          fi
          node scripts/ci/create-domain-core-native-release-evidence.mjs \
            --consumer android --artifact "$AAB_PATH" --version "$VERSION" \
            --tag "$TAG" --commit "$COMMIT" --profile-name "$PROFILE" \
            --profile "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-selected-public-profile.json" \
            --activation "$RUNNER_TEMP/domain-core-native-release-gate/domain-core-activation.json" \
            ${protected_evidence[@]+"${protected_evidence[@]}"} \
            --output-dir "$RUNNER_TEMP/domain-core-native-evidence/android" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reuse cryptographically exact existing evidence on draft or published retries
        id: existing-evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/hydrate-apple-android-release-evidence.mjs \
            --apple-plan "${{ steps.apple-plan.outputs.plan_path }}" \
            --android-plan "${{ steps.android-plan.outputs.plan_path }}" \
            --output-dir "$RUNNER_TEMP/domain-core-native-evidence/bundles" \
            --github-output "$GITHUB_OUTPUT"

      - name: Attest Apple quota predicate
        id: attest-apple-quota
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_quota == 'true' && steps.existing-evidence.outputs.apple_quota_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-quota-domain-core.predicate.json

      - name: Attest Apple CloudVault predicate
        id: attest-apple-cloud-vault
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_cloud_vault == 'true' && steps.existing-evidence.outputs.apple_cloud_vault_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-cloudVault-domain-core.predicate.json

      - name: Attest Apple CloudVault rewrap predicate
        id: attest-apple-cloud-vault-rewrap
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_cloud_vault_rewrap == 'true' && steps.existing-evidence.outputs.apple_cloud_vault_rewrap_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-cloudVaultRewrap-domain-core.predicate.json

      - name: Attest Apple CloudVault search predicate
        id: attest-apple-cloud-vault-search
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_cloud_vault_search == 'true' && steps.existing-evidence.outputs.apple_cloud_vault_search_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-cloudVaultSearch-domain-core.predicate.json

      - name: Attest Apple Hermes predicate
        id: attest-apple-hermes
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_hermes == 'true' && steps.existing-evidence.outputs.apple_hermes_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-hermes-domain-core.predicate.json

      - name: Attest Apple pricing predicate
        id: attest-apple-pricing
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.apple-plan.outputs.domain_pricing == 'true' && steps.existing-evidence.outputs.apple_pricing_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.dmg_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/apple/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-apple-pricing-domain-core.predicate.json

      - name: Attest Android CloudVault predicate
        id: attest-android-cloud-vault
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.android-plan.outputs.domain_cloud_vault == 'true' && steps.existing-evidence.outputs.android_cloud_vault_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/android/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-android-cloudVault-domain-core.predicate.json

      - name: Attest Android CloudVault rewrap predicate
        id: attest-android-cloud-vault-rewrap
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.android-plan.outputs.domain_cloud_vault_rewrap == 'true' && steps.existing-evidence.outputs.android_cloud_vault_rewrap_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/android/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-android-cloudVaultRewrap-domain-core.predicate.json

      - name: Attest Android CloudVault search predicate
        id: attest-android-cloud-vault-search
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.android-plan.outputs.domain_cloud_vault_search == 'true' && steps.existing-evidence.outputs.android_cloud_vault_search_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/android/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-android-cloudVaultSearch-domain-core.predicate.json

      - name: Attest Android Hermes predicate
        id: attest-android-hermes
        if: ${{ steps.existing-evidence.outputs.release_published != 'true' && steps.android-plan.outputs.domain_hermes == 'true' && steps.existing-evidence.outputs.android_hermes_existing != 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/domain-core-native-artifacts/${{ needs.build-and-release.outputs.aab_name }}
          predicate-type: https://openburnbar.dev/attestations/domain-core-release-artifact/v2
          predicate-path: ${{ runner.temp }}/domain-core-native-evidence/android/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-android-hermes-domain-core.predicate.json

      - name: Stage deterministic attestation bundle names
        env:
          APPLE_QUOTA: ${{ steps.attest-apple-quota.outputs.bundle-path }}
          APPLE_CLOUD_VAULT: ${{ steps.attest-apple-cloud-vault.outputs.bundle-path }}
          APPLE_CLOUD_VAULT_REWRAP: ${{ steps.attest-apple-cloud-vault-rewrap.outputs.bundle-path }}
          APPLE_CLOUD_VAULT_SEARCH: ${{ steps.attest-apple-cloud-vault-search.outputs.bundle-path }}
          APPLE_HERMES: ${{ steps.attest-apple-hermes.outputs.bundle-path }}
          APPLE_PRICING: ${{ steps.attest-apple-pricing.outputs.bundle-path }}
          ANDROID_CLOUD_VAULT: ${{ steps.attest-android-cloud-vault.outputs.bundle-path }}
          ANDROID_CLOUD_VAULT_REWRAP: ${{ steps.attest-android-cloud-vault-rewrap.outputs.bundle-path }}
          ANDROID_CLOUD_VAULT_SEARCH: ${{ steps.attest-android-cloud-vault-search.outputs.bundle-path }}
          ANDROID_HERMES: ${{ steps.attest-android-hermes.outputs.bundle-path }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/domain-core-native-evidence/bundles"
          mkdir -p "$bundle_dir"
          stage() {
            local source="$1"
            local name="$2"
            [[ -z "$source" ]] && return 0
            test -f "$source"
            cp "$source" "$bundle_dir/$name"
          }
          stage "$APPLE_QUOTA" "OpenBurnBar-${VERSION}-apple-quota-domain-core.sigstore.json"
          stage "$APPLE_CLOUD_VAULT" "OpenBurnBar-${VERSION}-apple-cloudVault-domain-core.sigstore.json"
          stage "$APPLE_CLOUD_VAULT_REWRAP" "OpenBurnBar-${VERSION}-apple-cloudVaultRewrap-domain-core.sigstore.json"
          stage "$APPLE_CLOUD_VAULT_SEARCH" "OpenBurnBar-${VERSION}-apple-cloudVaultSearch-domain-core.sigstore.json"
          stage "$APPLE_HERMES" "OpenBurnBar-${VERSION}-apple-hermes-domain-core.sigstore.json"
          stage "$APPLE_PRICING" "OpenBurnBar-${VERSION}-apple-pricing-domain-core.sigstore.json"
          stage "$ANDROID_CLOUD_VAULT" "OpenBurnBar-${VERSION}-android-cloudVault-domain-core.sigstore.json"
          stage "$ANDROID_CLOUD_VAULT_REWRAP" "OpenBurnBar-${VERSION}-android-cloudVaultRewrap-domain-core.sigstore.json"
          stage "$ANDROID_CLOUD_VAULT_SEARCH" "OpenBurnBar-${VERSION}-android-cloudVaultSearch-domain-core.sigstore.json"
          stage "$ANDROID_HERMES" "OpenBurnBar-${VERSION}-android-hermes-domain-core.sigstore.json"

      - name: Create exact Apple and Android publication manifests
        run: |
          node scripts/ci/create-domain-core-native-publication.mjs \
            --plan "${{ steps.apple-plan.outputs.plan_path }}" \
            --bundle-dir "$RUNNER_TEMP/domain-core-native-evidence/bundles" \
            --output "$RUNNER_TEMP/domain-core-native-evidence/apple-publication.json"
          node scripts/ci/create-domain-core-native-publication.mjs \
            --plan "${{ steps.android-plan.outputs.plan_path }}" \
            --bundle-dir "$RUNNER_TEMP/domain-core-native-evidence/bundles" \
            --output "$RUNNER_TEMP/domain-core-native-evidence/android-publication.json"

      - name: Publish the complete verified release set from one draft state machine
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-preflight.outputs.tag_name }}
          COMMIT: ${{ needs.release-preflight.outputs.release_commit }}
          # Publication never repoints the public update channel. Promotion is
          # a separate remote-artifact audit in the release-promotion job.
          PROMOTE: "false"
        run: |
          set -euo pipefail
          asset_args=()
          while IFS= read -r asset; do
            asset_args+=(--asset "$asset")
          done < <(find "$RUNNER_TEMP/release-publication-inputs/assets" -type f -print | LC_ALL=C sort)
          if ((${#asset_args[@]} == 0)); then
            echo "::error::No general release publication assets were retained."
            exit 1
          fi
          manifest="$RUNNER_TEMP/domain-core-native-evidence/apple-android-publication.json"
          node scripts/ci/create-apple-android-release-publication.mjs \
            --apple "$RUNNER_TEMP/domain-core-native-evidence/apple-publication.json" \
            --android "$RUNNER_TEMP/domain-core-native-evidence/android-publication.json" \
            --notes "$RUNNER_TEMP/release-publication-inputs/release-notes.md" \
            --tag "$TAG" --commit "$COMMIT" --promote "$PROMOTE" \
            "${asset_args[@]}" --output "$manifest"
          node scripts/ci/publish-apple-android-release.mjs --manifest "$manifest"

          ios_dir="$RUNNER_TEMP/release-publication-inputs/ios"
          if [[ -d "$ios_dir" ]]; then
            archive="$ios_dir/OpenBurnBar-${{ needs.release-preflight.outputs.version }}-iOS.xcarchive.zip"
            test -s "$archive"
            bundles='[]'
            while IFS= read -r predicate; do
              domain="$(jq -er '.domain' "$predicate")"
              bundle="${predicate}.sigstore.json"
              test -s "$bundle"
              asset_name="OpenBurnBar-${{ needs.release-preflight.outputs.version }}-iOS-${domain}-domain-core-attestation.sigstore.json"
              bundles="$(jq -c \
                --arg domain "$domain" \
                --arg assetName "$asset_name" \
                --arg bundlePath "$bundle" \
                --arg predicatePath "$predicate" \
                '. + [{domain: $domain, assetName: $assetName, bundlePath: $bundlePath, predicatePath: $predicatePath}]' \
                <<<"$bundles")"
            done < <(find "$ios_dir" -maxdepth 1 -type f -name 'domain-core-ios-*.predicate.json' -print | LC_ALL=C sort)
            test "$(jq 'length' <<<"$bundles")" -gt 0
            ios_manifest="$RUNNER_TEMP/domain-core-native-evidence/ios-publication.json"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg tag "$TAG" \
              --arg commit "$COMMIT" \
              --arg artifactPath "$archive" \
              --argjson bundles "$bundles" \
              '{schemaVersion: 2, repository: $repository, tag: $tag, commit: $commit, consumer: "ios", signerWorkflow: ".github/workflows/domain-core-ios-release-evidence.yml", releaseState: "published", nativeArtifactOnly: false, artifactPath: $artifactPath, bundles: $bundles}' \
              > "$ios_manifest"
            node scripts/ci/publish-domain-core-release-evidence.mjs --manifest "$ios_manifest"
          fi

      - name: Notify Sentry of published release
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_MACOS: openburnbar-macos
          SENTRY_PROJECT_FUNCTIONS: openburnbar-functions
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global @sentry/cli@2.42.2
          release_name="openburnbar@${VERSION}"
          for project in "$SENTRY_PROJECT_MACOS" "$SENTRY_PROJECT_FUNCTIONS"; do
            sentry-cli releases new --org "$SENTRY_ORG" --project "$project" "$release_name" || true
            sentry-cli releases set-commits --org "$SENTRY_ORG" --project "$project" "$release_name" --auto || true
            sentry-cli releases finalize --org "$SENTRY_ORG" --project "$project" "$release_name" || true
            sentry-cli releases deploys "$release_name" new \
              --org "$SENTRY_ORG" --project "$project" --env production \
              --name "v${VERSION}-$(date -u +%Y%m%dT%H%M%SZ)" || true
          done

      - name: Retain exact native release evidence and rollback chain
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: domain-core-native-release-evidence-${{ needs.domain-core-native-release-gate.outputs.profile_name }}-${{ needs.release-preflight.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/domain-core-native-evidence/
            ${{ runner.temp }}/domain-core-native-release-gate/domain-core-native-release-gate.json
            ${{ runner.temp }}/domain-core-native-release-gate/domain-core-selected-public-profile.json
            ${{ runner.temp }}/domain-core-native-release-gate/source/domain-core-public-production-rollback.json
            ${{ runner.temp }}/domain-core-native-identities/
            ${{ runner.temp }}/domain-core-apple-prepublication-identity/
          if-no-files-found: error
          retention-days: 90

  # Fail-closed feed verification: after the release is published and marked
  # latest, fetch the LIVE feed exactly the way the in-app updater does and
  # prove it end-to-end — 200s, version matches the tag, appcast agrees, and
  # the published DMG's Ed25519 signature verifies against the SUPublicEDKey
  # pinned in Info.plist. A release whose own update feed is broken fails here.
  verify-live-update-feed:
    name: Verify live update feed
    needs: [release-promotion]
    # Only the dedicated remote-artifact promotion lane may repoint
    # `releases/latest`; verify the public alias after that exact audit and
    # mutation completes.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote == true && needs.release-promotion.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Fetch and verify published feed, appcast, and DMG signature
        env:
          TAG_NAME: ${{ inputs.tag }}
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          export VERSION
          BASE_URL="${OPENBURNBAR_MAC_UPDATE_BASE_URL:?OPENBURNBAR_MAC_UPDATE_BASE_URL is required}"
          BASE_URL="${BASE_URL%/}"
          WORKDIR="$(mktemp -d)"
          export WORKDIR

          fetch_with_retry() {
            local url="$1" out="$2" attempt=1 code=000
            while [[ "$attempt" -le 10 ]]; do
              code="$(curl -L -sS -o "$out" -w "%{http_code}" "$url" 2>/dev/null || echo "000")"
              if [[ "$code" == "200" ]]; then
                return 0
              fi
              echo "waiting for $url (HTTP $code, attempt $attempt/10)..." >&2
              sleep 30
              attempt=$((attempt + 1))
            done
            echo "::error::Published update feed asset is not reachable: $url (last HTTP $code)"
            return 1
          }

          fetch_with_retry "$BASE_URL/latest-macos.json" "$WORKDIR/latest-macos.json"
          fetch_with_retry "$BASE_URL/appcast.xml" "$WORKDIR/appcast.xml"

          DMG_NAME="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.WORKDIR + "/latest-macos.json", "utf8")).dmg')"
          DMG_NAME_ENCODED="$(node -p 'encodeURIComponent(JSON.parse(require("node:fs").readFileSync(process.env.WORKDIR + "/latest-macos.json", "utf8")).dmg)')"
          fetch_with_retry "$BASE_URL/$DMG_NAME_ENCODED" "$WORKDIR/$DMG_NAME"

          node - <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const workdir = process.env.WORKDIR;
          const expectedVersion = process.env.VERSION;
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const latest = JSON.parse(fs.readFileSync(path.join(workdir, "latest-macos.json"), "utf8"));
          if (latest.version !== expectedVersion) {
            fail(`latest-macos.json advertises version ${latest.version}, but this release published ${expectedVersion}`);
          }
          if (!/^[0-9a-f]{64}$/i.test(latest.sha256 ?? "")) {
            fail("latest-macos.json sha256 is missing or malformed");
          }
          if (!latest.sparkleEdSignature) {
            fail("latest-macos.json sparkleEdSignature is missing — the feed is unsigned");
          }

          const appcast = fs.readFileSync(path.join(workdir, "appcast.xml"), "utf8");
          if (!appcast.includes(`<sparkle:shortVersionString>${expectedVersion}</sparkle:shortVersionString>`)) {
            fail(`appcast.xml does not advertise version ${expectedVersion}`);
          }
          if (!appcast.includes(`sparkle:edSignature="${latest.sparkleEdSignature}"`)) {
            fail("appcast.xml edSignature does not match latest-macos.json");
          }

          const dmg = fs.readFileSync(path.join(workdir, latest.dmg));
          if (dmg.length !== latest.length) {
            fail(`published DMG is ${dmg.length} bytes but the feed advertises ${latest.length}`);
          }
          const digest = crypto.createHash("sha256").update(dmg).digest("hex");
          if (digest !== latest.sha256.toLowerCase()) {
            fail(`published DMG sha256 ${digest} does not match feed sha256 ${latest.sha256}`);
          }

          const plist = fs.readFileSync("AgentLens/Resources/OpenBurnBar-Info.plist", "utf8");
          const keyMatch = plist.match(/<key>SUPublicEDKey<\/key>\s*<string>([^<]+)<\/string>/);
          if (!keyMatch) {
            fail("SUPublicEDKey not found in AgentLens/Resources/OpenBurnBar-Info.plist");
          }
          const rawKey = Buffer.from(keyMatch[1].trim(), "base64");
          if (rawKey.length !== 32) {
            fail("SUPublicEDKey is not a raw 32-byte Ed25519 public key");
          }
          // Wrap the raw Ed25519 key in a SPKI DER header so node can load it.
          const spki = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), rawKey]);
          const publicKey = crypto.createPublicKey({ key: spki, format: "der", type: "spki" });
          const signature = Buffer.from(latest.sparkleEdSignature, "base64");
          if (!crypto.verify(null, dmg, publicKey, signature)) {
            fail("Ed25519 signature verification FAILED: the published DMG does not verify against SUPublicEDKey");
          }
          console.log(`PASS: live update feed verified — version ${latest.version}, sha256 + Ed25519 signature valid for ${latest.dmg}`);
          NODE
