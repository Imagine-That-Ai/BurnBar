          key: release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-${{ steps.libsignal.outputs.rev }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ env.SIGNAL_FFI_BUILD_PROFILE }}-

      - name: Run Swift tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_release_validation_gates }}
