name: OpenBurnBar Release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (for manual reruns)"
        required: true
        type: string
      critical:
        description: "Mark as a security-critical update (the in-app updater re-prompts even after Later)"
        required: false
        type: boolean
        default: false
      promote:
        description: "Promote this release to GitHub 'latest' (repoints the update feed). Ignored for -prerelease tags."
        required: false
        type: boolean
        default: false
      release_hold_bypass_reason:
        description: "Explicit owner-approved reason to bypass runtime/legal release holds for this manual run."
        required: false
        type: string
        default: ""
      run_mobile_unit_tests:
        description: "Run iOS simulator mobile unit tests before publishing release artifacts. Disable only for an owner-approved manual release with independent mobile validation evidence."
        required: false
        type: boolean
        default: true
      mobile_unit_test_bypass_reason:
        description: "Required when run_mobile_unit_tests=false; include the independent mobile validation evidence and owner approval."
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: OpenBurnBar
  PROJECT: OpenBurnBar.xcodeproj
  CONFIG: Release
  DESTINATION: "platform=macOS,arch=arm64"
  CACHE_DIR: .spm-cache
  DERIVED_DATA: .derived-data

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: release
    # Keep release builds on the same current GA macOS/Xcode image as PR app
    # tests; Xcode 16.4 on macOS 15 crashes in SwiftEmitModule for this target.
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      dmg_path: ${{ steps.dmg.outputs.dmg_path }}
      dmg_name: ${{ steps.dmg.outputs.dmg_name }}
      zip_path: ${{ steps.zip.outputs.zip_path }}
      zip_name: ${{ steps.zip.outputs.zip_name }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    env:
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_PLIST_BASE64 != '' && secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN != '' }}
      HAS_SIGNING_SECRETS: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY_SECRETS: ${{ secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 2

      - name: Resolve release tag and version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          # SemVer release grammar: vMAJOR.MINOR.PATCH with an optional
          # -prerelease and/or +build suffix (e.g. v1.0.2, v1.1.0-beta.3).
          # The previous pattern (^v[0-9a-zA-Z._-]+$) accepted arbitrary
          # strings like "vfoo" and is not safe to drive --latest promotion.
          # MAJOR is capped at three digits (0-999) so year-shaped calver tags
          # (v2026.*) are rejected — H19 declares v1.0.x the canonical line.
          if [[ ! "$TAG_NAME" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG_NAME (expected vMAJOR.MINOR.PATCH[-prerelease][+build], MAJOR 0-999)"
            exit 1
          fi

          git fetch --force --no-tags --depth=2 origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "::error::Tag does not exist in repository: $TAG_NAME"
            exit 1
          fi

          # Prerelease status is derived strictly from the tag: a hyphen in the
          # version (the SemVer prerelease delimiter) marks it. The publish job
          # NEVER repoints "latest" for a prerelease, regardless of inputs.
          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          {
            echo "tag_name=$TAG_NAME"
            echo "version=${TAG_NAME#v}"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git checkout --detach "$TAG_NAME"
          git rev-parse --verify HEAD~1 >/dev/null
          git submodule update --init --recursive Vendor/libsignal
          echo "Building release tag $TAG_NAME at $(git rev-parse HEAD)"

      - name: Install release security scanners
        run: brew install gitleaks trufflehog

      - name: Scan publishable tree for secrets
        run: ./scripts/security/scan-publishable-tree.sh

      - name: BurnBar source provenance preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py --source-provenance-only

      - name: Validate release hold bypass reason
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_hold_bypass_reason != '' }}
        env:
          RELEASE_HOLD_BYPASS_REASON: ${{ inputs.release_hold_bypass_reason }}
        run: |
          compact="${RELEASE_HOLD_BYPASS_REASON//[[:space:]]/}"
          if [[ -z "$compact" ]]; then
            echo "::error::release_hold_bypass_reason must contain non-whitespace text."
            exit 1
          fi

      - name: BurnBar product release preflight
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_hold_bypass_reason != '') }}
        run: python3 scripts/ci/check_burnbar_release_preflight.py

      - name: Record owner-approved release hold bypass
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_hold_bypass_reason != '' }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_HOLD_BYPASS_REASON: ${{ inputs.release_hold_bypass_reason }}
        run: |
          echo "::warning::Bypassing BurnBar product release preflight for manual release ${TAG_NAME}: ${RELEASE_HOLD_BYPASS_REASON}"
          {
            echo "## Owner-approved release hold bypass"
            echo "- Tag: ${TAG_NAME}"
            echo "- Version: ${VERSION}"
            echo "- Reason: ${RELEASE_HOLD_BYPASS_REASON}"
            echo "- Scope: runtime-readiness and legal-release-review holds only; all signing, notarization, secret scanning, and artifact verification still run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate mobile unit test bypass reason
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_mobile_unit_tests }}
        env:
          MOBILE_UNIT_TEST_BYPASS_REASON: ${{ inputs.mobile_unit_test_bypass_reason }}
        run: |
          compact="${MOBILE_UNIT_TEST_BYPASS_REASON//[[:space:]]/}"
          if [[ -z "$compact" ]]; then
            echo "::error::run_mobile_unit_tests=false requires mobile_unit_test_bypass_reason with independent mobile validation evidence."
            exit 1
          fi

      - name: Release preflight summary
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Release tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "Strict notarized release mode: true"
          echo "Firebase secrets available: ${HAS_FIREBASE_SECRETS}"
          echo "Signing secrets available: ${HAS_SIGNING_SECRETS}"
          echo "Notary API secrets available: ${HAS_NOTARY_SECRETS}"

      - name: Validate strict release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: |
          missing=()
          for var in \
            APPLE_TEAM_ID \
            APPLE_SIGNING_IDENTITY \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_API_KEY_P8 \
            OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 \
            FIREBASE_PLIST_BASE64 \
            FIREBASE_APP_CHECK_DEBUG_TOKEN; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install Sparkle signing tools
        run: |
          brew install --cask sparkle
          SPARKLE_CASKROOM="$(brew --prefix)/Caskroom/sparkle"
          xattr -dr com.apple.quarantine "$SPARKLE_CASKROOM" 2>/dev/null || true
          SPARKLE_SIGN_UPDATE="$(
            find "$SPARKLE_CASKROOM" /Applications -name sign_update \( -type f -o -type l \) -print -quit 2>/dev/null || true
          )"
          if [[ -z "$SPARKLE_SIGN_UPDATE" ]]; then
            echo "::error::Sparkle sign_update tool was not found after cask install."
            echo "::group::Sparkle install tree"
            find "$SPARKLE_CASKROOM" /Applications -path '*Sparkle*' -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
          chmod +x "$SPARKLE_SIGN_UPDATE" 2>/dev/null || true
          if [[ ! -x "$SPARKLE_SIGN_UPDATE" ]]; then
            echo "::error::Sparkle sign_update exists but is not executable: $SPARKLE_SIGN_UPDATE"
            exit 1
          fi
          echo "SPARKLE_SIGN_UPDATE=$SPARKLE_SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Inject Firebase config
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: bash ./scripts/ci/inject-firebase-config.sh

      - name: Inject iOS/macOS Sentry config
        env:
          OPENBURNBAR_SENTRY_DSN: ${{ secrets.OPENBURNBAR_SENTRY_DSN }}
        run: bash ./scripts/ci/inject-sentry-config-ios.sh

      - name: Install OpenBurnBar Functions dependencies
        run: npm ci --prefix functions

      - name: Lint OpenBurnBar Functions
        run: npm --prefix functions run lint

      - name: Build OpenBurnBar Functions
        run: npm --prefix functions run build

      - name: Run OpenBurnBar Functions tests
        run: npm --prefix functions test

      - name: Install extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Install Rust toolchain for libsignal Swift FFI
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Install protobuf for libsignal Swift FFI
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Run Swift tests
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-swift.sh

      - name: Run OpenBurnBar app tests
        run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-app.sh

      - name: Verify SQLCipher codec in Release configuration
        run: OPENBURNBAR_REQUIRE_SQLCIPHER_CODEC=1 ./scripts/ci/verify-sqlcipher-codec.sh

      - name: Run OpenBurnBar mobile unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mobile_unit_tests }}
        timeout-minutes: 45
        # GitHub macOS runners have no USB physical devices; the script falls back to iOS Simulator in CI.
        # Release gates need pass/fail proof; coverage collection belongs to CI, not notarized artifact publication.
        run: ./scripts/test-openburnbar-mobile.sh

      - name: Record owner-approved mobile unit test bypass
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_mobile_unit_tests }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MOBILE_UNIT_TEST_BYPASS_REASON: ${{ inputs.mobile_unit_test_bypass_reason }}
        run: |
          echo "::warning::Bypassing OpenBurnBar mobile unit tests for manual release ${TAG_NAME}: ${MOBILE_UNIT_TEST_BYPASS_REASON}"
          {
            echo "## Owner-approved mobile unit test bypass"
            echo "- Tag: ${TAG_NAME}"
            echo "- Version: ${VERSION}"
            echo "- Reason/evidence: ${MOBILE_UNIT_TEST_BYPASS_REASON}"
            echo "- Scope: iOS simulator mobile unit-test gate only; Swift tests, app tests, SQLCipher codec checks, TypeScript tests, Firestore rules, Android tests, supply-chain checks, signing, notarization, and artifact verification still run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run retrieval replay evals
        run: ./scripts/test-openburnbar-retrieval-evals.sh

      - name: Run TypeScript tests
        run: ./scripts/test-openburnbar-ts.sh

      - name: Run replay evals
        run: ./scripts/test-openburnbar-replay-evals.sh

      - name: Run extension-host tests
        run: ./scripts/test-openburnbar-extension-host.sh

      - name: Run Firestore rules emulator tests
        run: npm --prefix functions run test:firestore-rules

      - name: Verify OpenBurnBar app SwiftPM lockfile
        run: ./scripts/check-openburnbar-app-swiftpm-lock.sh

      - name: Set up Java 21 (Android release tests)
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24-native)
        with:
          packages: "platforms;android-35 build-tools;36.0.0"

      - name: Inject Android Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          OPENBURNBAR_ANDROID_FIREBASE_STRICT: "1"
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Verify Android Firebase release config
        run: node ./scripts/ci/verify-android-firebase-release-config.mjs --strict-release

      - name: Inject Android Sentry config
        env:
          ANDROID_SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
        run: bash ./scripts/ci/inject-sentry-config-android.sh

      - name: Inject Android keystore for release signing
        env:
          OPENBURNBAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_BASE64 }}
          OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD }}
          OPENBURNBAR_ANDROID_KEY_ALIAS: ${{ secrets.OPENBURNBAR_ANDROID_KEY_ALIAS }}
          OPENBURNBAR_ANDROID_KEY_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEY_PASSWORD }}
        run: bash ./scripts/ci/inject-android-keystore.sh

      - name: Run Android unit tests
        run: ./scripts/test-openburnbar-android.sh

      - name: Build signed Android release bundle
        env:
          OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEYSTORE_PASSWORD }}
          OPENBURNBAR_ANDROID_KEY_ALIAS: ${{ secrets.OPENBURNBAR_ANDROID_KEY_ALIAS }}
          OPENBURNBAR_ANDROID_KEY_PASSWORD: ${{ secrets.OPENBURNBAR_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${OPENBURNBAR_ANDROID_KEYSTORE_PATH:-}" || ! -f "$OPENBURNBAR_ANDROID_KEYSTORE_PATH" ]]; then
            echo "::error::Android release keystore was not injected at OPENBURNBAR_ANDROID_KEYSTORE_PATH."
            exit 1
          fi
          cd android
          ./gradlew :app:bundleRelease --no-daemon
          echo "aab_path=$(pwd)/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"

      - name: Upload Android release bundle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Run supply chain audit
        run: ./scripts/supply-chain-audit.sh

      - name: Inject extension Sentry DSN
        env:
          BURNBAR_EXTENSION_SENTRY_DSN: ${{ secrets.BURNBAR_EXTENSION_SENTRY_DSN }}
        run: bash scripts/ci/inject-sentry-config-extension.sh

      - name: Build extension
        run: npm run --prefix extensions/openburnbar build

      - name: Build daemon (SPM release binary)
        run: swift build --package-path OpenBurnBarDaemon -c release

      - name: Resolve Xcode packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$CACHE_DIR" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build Release .app (unsigned)
        env:
          # Marks this as a notarized release build so the in-app updater's
          # Stamp Build Provenance phase records channel=release (not "source").
          OPENBURNBAR_BUILD_CHANNEL: release
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$CACHE_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed daemon binary in app bundle
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          HELPERS_DIR="$APP_PATH/Contents/Helpers"
          mkdir -p "$HELPERS_DIR"

          DAEMON_BIN="OpenBurnBarDaemon/.build/release/OpenBurnBarDaemon"
          DAEMON_CORE_DYLIB="OpenBurnBarDaemon/.build/release/libOpenBurnBarCore.dylib"
          if [[ ! -f "$DAEMON_BIN" ]]; then
            echo "::error::Daemon binary not found at $DAEMON_BIN"
            exit 1
          fi
          cp "$DAEMON_BIN" "$HELPERS_DIR/OpenBurnBarDaemon"
          if [[ -f "$DAEMON_CORE_DYLIB" ]]; then
            cp "$DAEMON_CORE_DYLIB" "$HELPERS_DIR/libOpenBurnBarCore.dylib"
          else
            echo "No daemon support dylib found at $DAEMON_CORE_DYLIB; daemon is statically linked."
          fi
          chmod +x "$HELPERS_DIR/OpenBurnBarDaemon"
          DAEMON_RESOURCE_BUNDLE="$APP_PATH/Contents/Resources/OpenBurnBarCore_OpenBurnBarCore.bundle"
          DAEMON_HELPER_RESOURCE_BUNDLE="$HELPERS_DIR/OpenBurnBarCore_OpenBurnBarCore.bundle"
          PROJECT_CODE_MEMORY_DIR="$APP_PATH/Contents/Resources/ProjectCodeMemory"
          if [[ ! -d "$DAEMON_RESOURCE_BUNDLE" ]]; then
            echo "::error::OpenBurnBarDaemon resource bundle missing at $DAEMON_RESOURCE_BUNDLE"
            exit 1
          fi
          if [[ ! -d "$PROJECT_CODE_MEMORY_DIR" ]]; then
            echo "::error::OpenBurnBarDaemon Project Code Memory resources missing at $PROJECT_CODE_MEMORY_DIR"
            exit 1
          fi
          rm -rf "$DAEMON_HELPER_RESOURCE_BUNDLE" "$HELPERS_DIR/ProjectCodeMemory"
          cp -R "$DAEMON_RESOURCE_BUNDLE" "$DAEMON_HELPER_RESOURCE_BUNDLE"
          cp -R "$PROJECT_CODE_MEMORY_DIR" "$HELPERS_DIR/ProjectCodeMemory"
          if otool -L "$HELPERS_DIR/OpenBurnBarDaemon" | grep -q 'SQLCipher.framework'; then
            if [[ ! -d "$APP_PATH/Contents/Frameworks/SQLCipher.framework" ]]; then
              echo "::error::OpenBurnBarDaemon links SQLCipher.framework but the app bundle is missing Contents/Frameworks/SQLCipher.framework"
              exit 1
            fi
            if ! otool -l "$HELPERS_DIR/OpenBurnBarDaemon" | grep -q '@executable_path/../Frameworks'; then
              install_name_tool -add_rpath "@executable_path/../Frameworks" "$HELPERS_DIR/OpenBurnBarDaemon"
            fi
          fi

      - name: Embed OpenBurnBarCore framework in app bundle
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          CORE_FRAMEWORK_PATH="$DERIVED_DATA/Build/Products/$CONFIG/PackageFrameworks/OpenBurnBarCore.framework"

          mkdir -p "$FRAMEWORKS_DIR"
          if [[ -d "$CORE_FRAMEWORK_PATH" ]]; then
            rm -rf "$FRAMEWORKS_DIR/OpenBurnBarCore.framework"
            cp -R "$CORE_FRAMEWORK_PATH" "$FRAMEWORKS_DIR/"
          else
            echo "No OpenBurnBarCore.framework found at $CORE_FRAMEWORK_PATH; app is statically linked."
          fi

      - name: Import Developer ID signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "keychain_password=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "certificate.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12"])
          )
          PY

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Codesign app bundle (deterministic order)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          HELPERS_DIR="$APP_PATH/Contents/Helpers"
          ENTITLEMENTS="AgentLens/Resources/OpenBurnBarRelease.entitlements"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          if [[ -d "$FRAMEWORKS_DIR" ]]; then
            while IFS= read -r -d '' item; do
              codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$item"
            done < <(find "$FRAMEWORKS_DIR" -mindepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.bundle' \) -print0 | sort -z)
          fi

          if [[ -d "$HELPERS_DIR" ]]; then
            while IFS= read -r -d '' item; do
              codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$item"
            done < <(find "$HELPERS_DIR" -mindepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.bundle' \) -print0 | sort -z)
          fi

          if [[ -f "$HELPERS_DIR/libOpenBurnBarCore.dylib" ]]; then
            codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$HELPERS_DIR/libOpenBurnBarCore.dylib"
          fi

          if [[ -f "$HELPERS_DIR/OpenBurnBarDaemon" ]]; then
            codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$HELPERS_DIR/OpenBurnBarDaemon"
          fi

          codesign --force --timestamp --deep --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute -vv "$APP_PATH" || true

      - name: Create DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          DMG_NAME="OpenBurnBar-${VERSION}-macOS.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "OpenBurnBar" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Codesign DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Write notary API key
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          key_id = os.environ["APPLE_NOTARY_KEY_ID"]
          payload = os.environ["APPLE_NOTARY_API_KEY_P8"]
          Path(os.environ["RUNNER_TEMP"], f"AuthKey_{key_id}.p8").write_bytes(base64.b64decode(payload))
          PY
          chmod 600 "$NOTARY_KEY_PATH"
          echo "notary_key_path=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          NOTARY_ARGS=(
            --key "$notary_key_path"
            --key-id "$APPLE_NOTARY_KEY_ID"
          )

          # Avoid using `notarytool history` as an auth probe because it can
          # trap on some runner/toolchain combinations. Probe by submit itself.
          if [[ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            set +e
            xcrun notarytool submit "$DMG_PATH" "${NOTARY_ARGS[@]}" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 30m
            notary_status=$?
            set -e
            if [[ $notary_status -eq 0 ]]; then
              echo "Notary auth mode: team API key"
            else
              echo "::warning::Issuer-mode notarization failed; retrying without issuer (individual key mode)."
              xcrun notarytool submit "$DMG_PATH" "${NOTARY_ARGS[@]}" --wait --timeout 30m
              echo "Notary auth mode: individual API key"
            fi
          else
            xcrun notarytool submit "$DMG_PATH" "${NOTARY_ARGS[@]}" --wait --timeout 30m
            echo "Notary auth mode: individual API key"
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Create ZIP archive
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          ZIP_NAME="OpenBurnBar-${VERSION}-macOS.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"

          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent "$(basename "$APP_PATH")" "$ZIP_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Hermes agent source
        id: hermes-agent-source
        run: |
          repo="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.forkRepository)")"
          pin="$(node -e "const m=require('./third_party/hermes-agent/manifest.json'); console.log(m.pinnedCommit)")"
          src="$RUNNER_TEMP/hermes-agent"
          git clone --no-tags --filter=blob:none "$repo" "$src"
          git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach "$pin"
          HERMES_AGENT_SRC="$src" OPENBURNBAR_REQUIRE_HERMES_AGENT_SOURCE=1 bash scripts/ci/verify-vendored-agent-source.sh
          echo "path=$src" >> "$GITHUB_OUTPUT"

      - name: Build corresponding source archive
        id: corresponding-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HERMES_AGENT_SRC: ${{ steps.hermes-agent-source.outputs.path }}
          OPENBURNBAR_REQUIRE_HERMES_AGENT_SOURCE: "1"
        run: |
          bash scripts/ci/verify-libsignal-pin.sh --network
          # M-6: the Vendor/libsignal fork may differ from official only in
          # allow-listed build files (never the crypto core).
          bash scripts/ci/verify-libsignal-submodule-delta.sh
          bash scripts/ci/verify-corresponding-source-archive.sh --version "$VERSION"
          SOURCE_ARCHIVE="$RUNNER_TEMP/OpenBurnBar-${VERSION}-corresponding-source.tar.gz"
          bash scripts/ci/build-corresponding-source-archive.sh --version "$VERSION" --output "$SOURCE_ARCHIVE"
          echo "source_path=$SOURCE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "source_sha256_path=${SOURCE_ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate direct-download update feeds
        id: update-feeds
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          VERSION: ${{ steps.version.outputs.version }}
          OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64 }}
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
          # Tag pushes are never critical by default; manual reruns can flag a
          # security release so the in-app updater re-prompts past "Later".
          OPENBURNBAR_RELEASE_CRITICAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.critical) && '1' || '0' }}
        run: |
          # shellcheck disable=SC2153 # ZIP_PATH is supplied by the step env above.
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist")"
          DMG_NAME="$(basename "$DMG_PATH")"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          SOURCE_NAME="$(basename "$SOURCE_PATH")"
          BASE_URL="${OPENBURNBAR_MAC_UPDATE_BASE_URL:-https://github.com/Imagine-That-Ai/BurnBar/releases/latest/download}"
          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"
          LATEST_PATH="$RUNNER_TEMP/latest-macos.json"

          SPARKLE_PRIVATE_KEY="$(
            python3 - <<'PY'
          import base64
          import os

          print(base64.b64decode(os.environ["OPENBURNBAR_SPARKLE_PRIVATE_KEY_BASE64"]).decode(), end="")
          PY
          )"
          SIGN_UPDATE_OUTPUT="$(printf "%s\n" "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_SIGN_UPDATE" --ed-key-file - "$DMG_PATH")"
          SPARKLE_ED_SIGNATURE="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$SIGN_UPDATE_OUTPUT" | head -n 1)"
          if [[ -z "$SPARKLE_ED_SIGNATURE" ]]; then
            echo "::error::Sparkle sign_update did not emit sparkle:edSignature."
            exit 1
          fi

          node scripts/generate-macos-appcast.mjs \
            --version "$VERSION" \
            --build "$BUILD" \
            --bundle-id "$BUNDLE_ID" \
            --release-dir "$RUNNER_TEMP" \
            --dmg-name "$DMG_NAME" \
            --zip-name "$ZIP_NAME" \
            --source-archive-name "$SOURCE_NAME" \
            --base-url "$BASE_URL" \
            --commit "$(git rev-parse HEAD)" \
            --minimum-system-version "14.0" \
            --appcast-name "$(basename "$APPCAST_PATH")" \
            --latest-name "$(basename "$LATEST_PATH")" \
            --ed-signature "$SPARKLE_ED_SIGNATURE" \
            --critical "${OPENBURNBAR_RELEASE_CRITICAL:-0}"

          {
            echo "appcast_path=$APPCAST_PATH"
            echo "latest_path=$LATEST_PATH"
            echo "update_base_url=$BASE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Compute artifact checksums
        id: checksums
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          APPCAST_PATH: ${{ steps.update-feeds.outputs.appcast_path }}
          LATEST_PATH: ${{ steps.update-feeds.outputs.latest_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHECKSUMS_FILE="$RUNNER_TEMP/checksums-v${VERSION}.txt"

          # Group writes (SC2129) so we open the output file once.
          {
            echo "# OpenBurnBar v${VERSION} release checksums"
            echo "# Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Commit: $(git rev-parse HEAD)"
            echo ""
            sha256sum "$DMG_PATH"
            sha512sum "$DMG_PATH"
            sha256sum "$ZIP_PATH"
            sha512sum "$ZIP_PATH"
            sha256sum "$SOURCE_PATH"
            sha512sum "$SOURCE_PATH"
            sha256sum "$APPCAST_PATH"
            sha512sum "$APPCAST_PATH"
            sha256sum "$LATEST_PATH"
            sha512sum "$LATEST_PATH"
          } > "$CHECKSUMS_FILE"

          cat "$CHECKSUMS_FILE"

          echo "checksums_path=$CHECKSUMS_FILE" >> "$GITHUB_OUTPUT"

      - name: Resolve release provenance policy
        id: provenance-policy
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -n "${RELEASE_SIGNING_KEY:-}" ]]; then
            echo "gpg_configured=true" >> "$GITHUB_OUTPUT"
            echo "Legacy GPG checksum signing is configured; detached checksum signature will be generated and verified."
          else
            echo "gpg_configured=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SIGNING_KEY is not configured; using required keyless Sigstore blob attestations for release provenance."
          fi

      - name: Sign checksums (legacy GPG, optional)
        id: sign-checksums
        env:
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        # Sigstore keyless attestations below are the required SOTA provenance
        # control. GPG checksum signatures are retained as an optional legacy
        # compatibility artifact when operators configure RELEASE_SIGNING_KEY.
        if: steps.provenance-policy.outputs.gpg_configured == 'true'
        run: |
          # Import the GPG signing key
          echo "$RELEASE_SIGNING_KEY" | base64 --decode | gpg --import --batch --passphrase ""

          # Create a detached signature for the checksums file
          gpg --batch --yes --detach-sign --armor \
            --local-user "OpenBurnBar Release" \
            "$CHECKSUMS_PATH"

          echo "sig_path=${CHECKSUMS_PATH}.asc" >> "$GITHUB_OUTPUT"
          echo "Checksums signed successfully."

      - name: Verify checksum GPG signature (when configured)
        if: steps.provenance-policy.outputs.gpg_configured == 'true'
        env:
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          SIGNATURE_PATH: ${{ steps.sign-checksums.outputs.sig_path }}
        run: |
          if [[ -z "${SIGNATURE_PATH:-}" || ! -f "$SIGNATURE_PATH" ]]; then
            echo "::error::RELEASE_SIGNING_KEY is configured, but the detached checksum signature was not produced."
            exit 1
          fi
          gpg --batch --verify "$SIGNATURE_PATH" "$CHECKSUMS_PATH"
          echo "Checksum GPG signature verified."

      - name: Generate SBOM
        id: sbom
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SBOM_FILE="$RUNNER_TEMP/sbom-v${VERSION}.spdx.json"

          python3 scripts/generate-sbom.py \
            --version "$VERSION" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$SBOM_FILE"

          echo "sbom_path=$SBOM_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate OpenVEX sidecar
        id: vex
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          VEX_FILE="$RUNNER_TEMP/openburnbar-v${VERSION}.vex.json"
          python3 scripts/supply-chain/generate-vex.py \
            --sbom "$SBOM_PATH" \
            --output "$VEX_FILE" \
            --product-version "$VERSION"
          echo "vex_path=$VEX_FILE" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Sigstore blob attestations (SBOM + VEX + checksums + binaries)
        id: sigstore-provenance
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
          VEX_PATH: ${{ steps.vex.outputs.vex_path }}
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.checksums_path }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SOURCE_PATH: ${{ steps.corresponding-source.outputs.source_path }}
          APPCAST_PATH: ${{ steps.update-feeds.outputs.appcast_path }}
          LATEST_PATH: ${{ steps.update-feeds.outputs.latest_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PROVENANCE_DIR="$RUNNER_TEMP/release-provenance-v${VERSION}"
          PREDICATE_TYPE="https://openburnbar.dev/attestations/release-artifact/v1"
          mkdir -p "$PROVENANCE_DIR"

          attest_release_blob() {
            local artifact_path="$1"
            local artifact_name="$2"

            if [[ -z "$artifact_path" || ! -f "$artifact_path" ]]; then
              echo "::error::Release provenance artifact missing: $artifact_name ($artifact_path)"
              exit 1
            fi

            local safe_name="${artifact_name//[^A-Za-z0-9._-]/_}"
            local predicate_path="$PROVENANCE_DIR/${safe_name}.predicate.json"
            local bundle_path="$PROVENANCE_DIR/${safe_name}.sigstore.json"

            python3 - "$artifact_path" "$artifact_name" "$predicate_path" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          artifact_path = Path(sys.argv[1])
          artifact_name = sys.argv[2]
          predicate_path = Path(sys.argv[3])
          sha256 = hashlib.sha256(artifact_path.read_bytes()).hexdigest()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          predicate = {
              "schemaVersion": 1,
              "predicateType": "https://openburnbar.dev/attestations/release-artifact/v1",
              "artifact": {
                  "name": artifact_name,
                  "fileName": artifact_path.name,
                  "sha256": sha256,
                  "sizeBytes": artifact_path.stat().st_size,
              },
              "release": {
                  "version": os.environ["VERSION"],
                  "commit": commit,
                  "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "ref": os.environ.get("GITHUB_REF", ""),
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "runID": os.environ.get("GITHUB_RUN_ID", ""),
                  "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              },
          }
          predicate_path.write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

            cosign attest-blob --yes \
              --predicate "$predicate_path" \
              --type "$PREDICATE_TYPE" \
              --bundle "$bundle_path" \
              "$artifact_path"

            if [[ ! -s "$bundle_path" ]]; then
              echo "::error::cosign did not write a Sigstore bundle for $artifact_name"
              exit 1
            fi
          }

          attest_release_blob "$SBOM_PATH" "sbom-v${VERSION}.spdx.json"
          attest_release_blob "$VEX_PATH" "openburnbar-v${VERSION}.vex.json"
          attest_release_blob "$CHECKSUMS_PATH" "checksums-v${VERSION}.txt"
          attest_release_blob "$DMG_PATH" "${DMG_PATH##*/}"
          attest_release_blob "$ZIP_PATH" "${ZIP_PATH##*/}"
          attest_release_blob "$SOURCE_PATH" "${SOURCE_PATH##*/}"
          attest_release_blob "$APPCAST_PATH" "${APPCAST_PATH##*/}"
          attest_release_blob "$LATEST_PATH" "${LATEST_PATH##*/}"

          echo "provenance_dir=$PROVENANCE_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Apple privacy manifests in release bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIG/OpenBurnBar.app"
          for manifest in \
            "$APP_PATH/Contents/Resources/PrivacyInfo.xcprivacy" \
            "AgentLens/Resources/PrivacyInfo.xcprivacy" \
            "OpenBurnBarMobile/Resources/PrivacyInfo.xcprivacy" \
            "OpenBurnBarWidget/Resources/PrivacyInfo.xcprivacy"; do
            if [[ ! -f "$manifest" ]]; then
              echo "Missing privacy manifest: $manifest" >&2
              exit 1
            fi
          done
          echo "Privacy manifests present for macOS app source trees and embedded bundle."

      - name: Generate third-party NOTICES from SBOM
        id: notices
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          NOTICES_FILE="$RUNNER_TEMP/NOTICES-v${VERSION}.txt"
          python3 - <<'PY' "$SBOM_PATH" "$NOTICES_FILE" "$VERSION"
          import json, sys
          from pathlib import Path
          sbom_path, notices_path, version = sys.argv[1:4]
          data = json.loads(Path(sbom_path).read_text())
          packages = data.get("packages") or []
          lines = [
              f"OpenBurnBar v{version} — third-party notices",
              "Generated from SPDX SBOM at release time.",
              "",
          ]
          for pkg in sorted(packages, key=lambda p: (p.get("name") or "", p.get("version") or "")):
              name = pkg.get("name") or "unknown"
              ver = pkg.get("version") or ""
              license_id = None
              for ref in pkg.get("licenseConcluded") or []:
                  if isinstance(ref, str) and ref.startswith("LicenseRef-"):
                      license_id = ref.replace("LicenseRef-", "")
              if license_id is None and pkg.get("licenseDeclared"):
                  license_id = str(pkg["licenseDeclared"])
              lines.append(f"{name} {ver}".strip())
              if license_id:
                  lines.append(f"  License: {license_id}")
              lines.append("")
          Path(notices_path).write_text("\n".join(lines))
          print(f"Wrote {notices_path} ({len(packages)} packages)")
          PY
          echo "notices_path=$NOTICES_FILE" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        id: metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          SOURCE_ARCHIVE: OpenBurnBar-${{ steps.version.outputs.version }}-corresponding-source.tar.gz
          UPDATE_BASE_URL: ${{ steps.update-feeds.outputs.update_base_url }}
          APPCAST_FILE: appcast.xml
          LATEST_FILE: latest-macos.json
        run: |
          METADATA_FILE="$RUNNER_TEMP/release-metadata.json"

          python3 - <<'PY' > "$METADATA_FILE"
          import datetime
          import json
          import os
          import subprocess

          metadata = {
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG_NAME"],
              "correspondingSource": os.environ["SOURCE_ARCHIVE"],
              "channel": "direct-download",
              "updateBaseUrl": os.environ["UPDATE_BASE_URL"],
              "appcast": os.environ["APPCAST_FILE"],
              "latestMetadata": os.environ["LATEST_FILE"],
              "sparkleEdSignaturePresent": True,
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "build_timestamp": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
              "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
          }
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY

          echo "metadata_path=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          cat "$METADATA_FILE"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_path }}
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload appcast artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: appcast-v${{ steps.version.outputs.version }}
          path: ${{ steps.update-feeds.outputs.appcast_path }}
          if-no-files-found: error

      - name: Upload latest macOS metadata artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: latest-macos-v${{ steps.version.outputs.version }}
          path: ${{ steps.update-feeds.outputs.latest_path }}
          if-no-files-found: error

      - name: Upload checksums artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: checksums-v${{ steps.version.outputs.version }}
          path: ${{ steps.checksums.outputs.checksums_path }}
          if-no-files-found: error

      - name: Upload checksum signature artifact
        if: steps.sign-checksums.outputs.sig_path != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: checksums-v${{ steps.version.outputs.version }}-signature
          path: ${{ steps.sign-checksums.outputs.sig_path }}
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: sbom-v${{ steps.version.outputs.version }}
          path: ${{ steps.sbom.outputs.sbom_path }}
          if-no-files-found: error

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: OpenBurnBar-${{ steps.version.outputs.version }}-corresponding-source
          path: |
            ${{ steps.corresponding-source.outputs.source_path }}
            ${{ steps.corresponding-source.outputs.source_sha256_path }}
          if-no-files-found: error

      - name: Upload VEX artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: vex-v${{ steps.version.outputs.version }}
          path: ${{ steps.vex.outputs.vex_path }}
          if-no-files-found: error

      - name: Upload release provenance bundles artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: release-provenance-v${{ steps.version.outputs.version }}
          path: ${{ steps.sigstore-provenance.outputs.provenance_dir }}
          if-no-files-found: error

      - name: Upload NOTICES artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: notices-v${{ steps.version.outputs.version }}
          path: ${{ steps.notices.outputs.notices_path }}
          if-no-files-found: error

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: release-metadata-v${{ steps.version.outputs.version }}
          path: ${{ steps.metadata.outputs.metadata_path }}
          if-no-files-found: error

      - name: Clean up Firebase config
        if: always()
        run: bash ./scripts/ci/cleanup-firebase-config.sh

      - name: Clean up signing and notary artifacts
        if: always()
        run: |
          if [[ -n "${keychain_path:-}" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          if [[ -n "${notary_key_path:-}" ]]; then
            rm -f "$notary_key_path"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  smoke-test:
    needs: build-and-release
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Download DMG artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          name: ${{ needs.build-and-release.outputs.dmg_name }}
          path: ${{ runner.temp }}

      - name: Smoke test mounted release DMG
        env:
          DMG_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.dmg_name }}
        run: |
          bash scripts/ci/smoke-openburnbar-release-dmg.sh "$DMG_PATH"

  publish:
    needs: [build-and-release, smoke-test]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0 (node24-native)
        with:
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build-and-release.outputs.version }}
          VERSION: ${{ needs.build-and-release.outputs.version }}
          DMG_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.dmg_name }}
          ZIP_PATH: ${{ runner.temp }}/${{ needs.build-and-release.outputs.zip_name }}
          # Prerelease status is derived from the tag (set in build-and-release).
          IS_PRERELEASE: ${{ needs.build-and-release.outputs.is_prerelease }}
          # 'latest' (which atomically repoints the in-app update feed) is opt-in:
          # only an explicit workflow_dispatch promote=true sets it, and never
          # for a prerelease tag.
          PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote && 'true' || 'false' }}
        run: |
          # Checksums, SBOM, and metadata are also downloaded via merge-multiple.
          # `find -print -quit` is shellcheck-clean (SC2012) and quoted to handle spaces (SC2086).
          CHECKSUMS_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "checksums-v${VERSION}*.txt" -print -quit 2>/dev/null)
          APPCAST_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "appcast.xml" -print -quit 2>/dev/null)
          LATEST_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "latest-macos.json" -print -quit 2>/dev/null)
          SBOM_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.spdx.json" -print -quit 2>/dev/null)
          VEX_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.vex.json" -print -quit 2>/dev/null)
          NOTICES_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "NOTICES-v${VERSION}*.txt" -print -quit 2>/dev/null)
          METADATA_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "release-metadata.json" -print -quit 2>/dev/null)
          SOURCE_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "OpenBurnBar-${VERSION}-corresponding-source.tar.gz" -print -quit 2>/dev/null)
          SOURCE_SHA256_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "OpenBurnBar-${VERSION}-corresponding-source.tar.gz.sha256" -print -quit 2>/dev/null)
          SIG_PATH=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "*.asc" -print -quit 2>/dev/null)
          mapfile -t PROVENANCE_PATHS < <(find "$RUNNER_TEMP" -type f \( -name "*.sigstore.json" -o -name "*.predicate.json" \) -print 2>/dev/null | sort)

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          VERSION_TAG="${VERSION#v}"
          awk -v ver="$VERSION_TAG" '
            /^## / {
              if (found) { exit }
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::warning::No CHANGELOG section for $VERSION_TAG; falling back to full CHANGELOG"
            cp CHANGELOG.md "$NOTES_FILE"
          fi

          ASSETS=("$DMG_PATH" "$ZIP_PATH")
          for asset in "${ASSETS[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release asset missing after artifact download: $asset"
              exit 1
            fi
          done
          [[ -n "$CHECKSUMS_PATH" && -f "$CHECKSUMS_PATH" ]] && ASSETS+=("$CHECKSUMS_PATH")
          [[ -n "$APPCAST_PATH" && -f "$APPCAST_PATH" ]] && ASSETS+=("$APPCAST_PATH")
          [[ -n "$LATEST_PATH" && -f "$LATEST_PATH" ]] && ASSETS+=("$LATEST_PATH")
          [[ -n "$SBOM_PATH" && -f "$SBOM_PATH" ]] && ASSETS+=("$SBOM_PATH")
          [[ -n "$VEX_PATH" && -f "$VEX_PATH" ]] && ASSETS+=("$VEX_PATH")
          [[ -n "$NOTICES_PATH" && -f "$NOTICES_PATH" ]] && ASSETS+=("$NOTICES_PATH")
          [[ -n "$METADATA_PATH" && -f "$METADATA_PATH" ]] && ASSETS+=("$METADATA_PATH")
          [[ -n "$SOURCE_PATH" && -f "$SOURCE_PATH" ]] && ASSETS+=("$SOURCE_PATH")
          [[ -n "$SOURCE_SHA256_PATH" && -f "$SOURCE_SHA256_PATH" ]] && ASSETS+=("$SOURCE_SHA256_PATH")
          [[ -n "$SIG_PATH" && -f "$SIG_PATH" ]] && ASSETS+=("$SIG_PATH")
          if ((${#PROVENANCE_PATHS[@]} == 0)); then
            echo "::error::Release provenance bundles missing after artifact download."
            exit 1
          fi
          ASSETS+=("${PROVENANCE_PATHS[@]}")

          # Decide prerelease + latest flags up front. A prerelease (-beta etc.)
          # tag is ALWAYS published as a prerelease and NEVER repoints "latest",
          # regardless of the promote input — promoting a beta to "latest"
          # atomically repoints the fleet's update feed onto a beta, which is the
          # exact failure this guard exists to prevent (H15).
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
            if [[ "$PROMOTE" == "true" ]]; then
              echo "::warning::promote=true ignored for prerelease tag v${VERSION} — prereleases never become 'latest'."
            fi
            echo "Publishing v${VERSION} as a PRERELEASE (update feed not repointed)."
          else
            PRERELEASE_FLAG="--prerelease=false"
            if [[ "$PROMOTE" == "true" ]]; then
              LATEST_FLAG="--latest"
              echo "Publishing v${VERSION} and PROMOTING to 'latest' (update feed repointed)."
            else
              LATEST_FLAG="--latest=false"
              echo "Publishing v${VERSION} as a stable release WITHOUT promotion (use workflow_dispatch promote=true to set 'latest')."
            fi
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "${ASSETS[@]}" --clobber
            gh release edit "v${VERSION}" --title "OpenBurnBar $VERSION" "$PRERELEASE_FLAG" "$LATEST_FLAG"
          else
            gh release create "v${VERSION}" \
              "${ASSETS[@]}" \
              --title "OpenBurnBar $VERSION" \
              --verify-tag \
              "$PRERELEASE_FLAG" \
              "$LATEST_FLAG" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Notify Sentry of new release
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_MACOS: openburnbar-macos
          SENTRY_PROJECT_FUNCTIONS: openburnbar-functions
          VERSION: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global @sentry/cli@2.42.2

          RELEASE_NAME="openburnbar@${VERSION}"

          for PROJECT in "$SENTRY_PROJECT_MACOS" "$SENTRY_PROJECT_FUNCTIONS"; do
            sentry-cli releases new --org "$SENTRY_ORG" --project "$PROJECT" "$RELEASE_NAME" || true
            sentry-cli releases set-commits --org "$SENTRY_ORG" --project "$PROJECT" "$RELEASE_NAME" --auto || true
            sentry-cli releases finalize --org "$SENTRY_ORG" --project "$PROJECT" "$RELEASE_NAME" || true
            sentry-cli releases deploys "$RELEASE_NAME" new \
              --org "$SENTRY_ORG" \
              --project "$PROJECT" \
              --env production \
              --name "v${VERSION}-$(date -u +%Y%m%dT%H%M%SZ)" || true
          done
          echo "Sentry release ${RELEASE_NAME} created and finalized."

      - name: Clean up Firebase config
        if: always()
        run: bash ./scripts/ci/cleanup-firebase-config.sh

  # Fail-closed feed verification: after the release is published and marked
  # latest, fetch the LIVE feed exactly the way the in-app updater does and
  # prove it end-to-end — 200s, version matches the tag, appcast agrees, and
  # the published DMG's Ed25519 signature verifies against the SUPublicEDKey
  # pinned in Info.plist. A release whose own update feed is broken fails here.
  verify-live-update-feed:
    name: Verify live update feed
    needs: [build-and-release, publish]
    # Tag pushes intentionally publish stable assets without repointing
    # `releases/latest`. Only an explicit promote=true dispatch changes the
    # update channel, so only that promoted run can truthfully verify the live
    # updater feed for this release.
    if: ${{ needs.build-and-release.outputs.is_prerelease == 'false' && github.event_name == 'workflow_dispatch' && inputs.promote == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Fetch and verify published feed, appcast, and DMG signature
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${OPENBURNBAR_MAC_UPDATE_BASE_URL:-https://github.com/Imagine-That-Ai/BurnBar/releases/latest/download}"
          BASE_URL="${BASE_URL%/}"
          WORKDIR="$(mktemp -d)"
          export WORKDIR

          fetch_with_retry() {
            local url="$1" out="$2" attempt=1 code=000
            while [[ "$attempt" -le 10 ]]; do
              code="$(curl -L -sS -o "$out" -w "%{http_code}" "$url" 2>/dev/null || echo "000")"
              if [[ "$code" == "200" ]]; then
                return 0
              fi
              echo "waiting for $url (HTTP $code, attempt $attempt/10)..." >&2
              sleep 30
              attempt=$((attempt + 1))
            done
            echo "::error::Published update feed asset is not reachable: $url (last HTTP $code)"
            return 1
          }

          fetch_with_retry "$BASE_URL/latest-macos.json" "$WORKDIR/latest-macos.json"
          fetch_with_retry "$BASE_URL/appcast.xml" "$WORKDIR/appcast.xml"

          DMG_NAME="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.WORKDIR + "/latest-macos.json", "utf8")).dmg')"
          DMG_NAME_ENCODED="$(node -p 'encodeURIComponent(JSON.parse(require("node:fs").readFileSync(process.env.WORKDIR + "/latest-macos.json", "utf8")).dmg)')"
          fetch_with_retry "$BASE_URL/$DMG_NAME_ENCODED" "$WORKDIR/$DMG_NAME"

          node - <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const workdir = process.env.WORKDIR;
          const expectedVersion = process.env.VERSION;
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const latest = JSON.parse(fs.readFileSync(path.join(workdir, "latest-macos.json"), "utf8"));
          if (latest.version !== expectedVersion) {
            fail(`latest-macos.json advertises version ${latest.version}, but this release published ${expectedVersion}`);
          }
          if (!/^[0-9a-f]{64}$/i.test(latest.sha256 ?? "")) {
            fail("latest-macos.json sha256 is missing or malformed");
          }
          if (!latest.sparkleEdSignature) {
            fail("latest-macos.json sparkleEdSignature is missing — the feed is unsigned");
          }

          const appcast = fs.readFileSync(path.join(workdir, "appcast.xml"), "utf8");
          if (!appcast.includes(`<sparkle:shortVersionString>${expectedVersion}</sparkle:shortVersionString>`)) {
            fail(`appcast.xml does not advertise version ${expectedVersion}`);
          }
          if (!appcast.includes(`sparkle:edSignature="${latest.sparkleEdSignature}"`)) {
            fail("appcast.xml edSignature does not match latest-macos.json");
          }

          const dmg = fs.readFileSync(path.join(workdir, latest.dmg));
          if (dmg.length !== latest.length) {
            fail(`published DMG is ${dmg.length} bytes but the feed advertises ${latest.length}`);
          }
          const digest = crypto.createHash("sha256").update(dmg).digest("hex");
          if (digest !== latest.sha256.toLowerCase()) {
            fail(`published DMG sha256 ${digest} does not match feed sha256 ${latest.sha256}`);
          }

          const plist = fs.readFileSync("AgentLens/Resources/OpenBurnBar-Info.plist", "utf8");
          const keyMatch = plist.match(/<key>SUPublicEDKey<\/key>\s*<string>([^<]+)<\/string>/);
          if (!keyMatch) {
            fail("SUPublicEDKey not found in AgentLens/Resources/OpenBurnBar-Info.plist");
          }
          const rawKey = Buffer.from(keyMatch[1].trim(), "base64");
          if (rawKey.length !== 32) {
            fail("SUPublicEDKey is not a raw 32-byte Ed25519 public key");
          }
          // Wrap the raw Ed25519 key in a SPKI DER header so node can load it.
          const spki = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), rawKey]);
          const publicKey = crypto.createPublicKey({ key: spki, format: "der", type: "spki" });
          const signature = Buffer.from(latest.sparkleEdSignature, "base64");
          if (!crypto.verify(null, dmg, publicKey, signature)) {
            fail("Ed25519 signature verification FAILED: the published DMG does not verify against SUPublicEDKey");
          }
          console.log(`PASS: live update feed verified — version ${latest.version}, sha256 + Ed25519 signature valid for ${latest.dmg}`);
          NODE
