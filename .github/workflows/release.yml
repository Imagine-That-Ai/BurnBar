name: OpenBurnBar Release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (for manual reruns)"
        required: true
        type: string
      critical:
        description: "Mark as a security-critical update (the in-app updater re-prompts even after Later)"
        required: false
        type: boolean
        default: false
      promote:
        description: "Publish this release to the governed R2 update channel, then promote it to GitHub 'latest'. Ignored for -prerelease tags."
        required: false
        type: boolean
        default: false
      expected_live_macos_version:
        description: "Exact version currently advertised by downloads.burnbar.ai, or absent for an empty host. Required when promote=true."
        required: false
        type: string
        default: ""
      expected_live_macos_commit:
        description: "Exact full commit currently advertised by downloads.burnbar.ai, or absent for an empty host. Required when promote=true."
        required: false
        type: string
        default: ""
      run_mobile_unit_tests:
        description: "Run iOS simulator mobile unit tests before publishing release artifacts. Disable only for an owner-approved manual release with independent mobile validation evidence."
        required: false
        type: boolean
        default: true
      mobile_unit_test_bypass_reason:
        description: "Required when run_mobile_unit_tests=false; include the independent mobile validation evidence and owner approval."
        required: false
        type: string
        default: ""
      run_release_validation_gates:
        description: "Run slow release validation gates before packaging. Disable only for an owner-approved retry with equivalent prior-run evidence."
        required: false
        type: boolean
        default: true
      release_validation_bypass_reason:
        description: "Required when run_release_validation_gates=false; include prior successful gate evidence, owner approval, and retry scope."
        required: false
        type: string
        default: ""
      domain_core_profile:
        description: "Signed public domain-core profile. Rollback requires protected domain-core-promotion approval."
        required: true
        type: choice
        default: public-production
        options:
          - public-production
          - public-production-rollback

concurrency:
  # GitHub releases have no compare-and-swap publish API. Serialize this
  # workflow by the exact release tag; manual/admin contents writers remain a
  # documented external trust boundary and are detected by the final audit.
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SCHEME: OpenBurnBar
  PROJECT: OpenBurnBar.xcodeproj
  CONFIG: Release
  SIGNAL_FFI_BUILD_PROFILE: release
  DESTINATION: "platform=macOS,arch=arm64"
  CACHE_DIR: .spm-cache
  DERIVED_DATA: .derived-data
  # Source-built Firestore is a release invariant everywhere the SwiftPM graph
  # is resolved (gates and packaging): the prebuilt grpc binary SIGSEGVs.
  FIREBASE_SOURCE_FIRESTORE: "1"

jobs:
  release-promotion:
    name: Audit and promote existing stable release
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    concurrency:
      # GitHub's global `latest` pointer has no compare-and-swap API. Different
      # tag workflows must never mutate it concurrently.
      group: openburnbar-release-promotion-global
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 75
    environment: release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Resolve immutable stable release coordinates
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG_NAME="$INPUT_TAG"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Promotion requires a stable vMAJOR.MINOR.PATCH[+build] tag."
            exit 1
          fi
          tag_ref="refs/tags/${TAG_NAME}"
          if [[ "$GITHUB_REF" != "$tag_ref" ]]; then
            echo "::error::promote=true for ${TAG_NAME} must run from ${tag_ref}, not ${GITHUB_REF}."
            exit 1
          fi
          git fetch --force origin "+${tag_ref}:${tag_ref}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          release_commit="$(git rev-list -n 1 "${tag_ref}^{commit}")"
          test -n "$release_commit"
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$GITHUB_SHA" = "$release_commit"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag ${TAG_NAME} is not reachable from origin/main."
            exit 1
          fi

          version="${TAG_NAME#v}"
          notes="$RUNNER_TEMP/release-promotion-notes.md"
          awk -v ver="$version" '
            /^## / {
              if (found) { exit }
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [[ ! -s "$notes" ]]; then
            # A repair train ships under [Unreleased] until it is cut into its
            # own section, and that is the section the publication actually
            # used for the release body. Falling straight through to the whole
            # CHANGELOG made the audit demand a body no release can carry:
            # the file is far larger than GitHub's release-body limit, so the
            # comparison could never hold. Mirror the publication instead.
            awk '/^## / { if (found) { exit } if ($0 ~ /\[Unreleased\]/) { found=1; next } } found { print }' \
              CHANGELOG.md > "$notes"
          fi
          if [[ ! -s "$notes" ]]; then
            cp CHANGELOG.md "$notes"
          fi

          {
            echo "tag_name=$TAG_NAME"
            echo "version=$version"
            echo "release_commit=$release_commit"
            echo "notes_path=$notes"
            echo "asset_dir=$RUNNER_TEMP/release-promotion-assets"
            echo "receipt_path=$RUNNER_TEMP/release-promotion-receipt.json"
          } >> "$GITHUB_OUTPUT"

      - name: Install public trust verifier dependencies
        run: npm ci --prefix website --ignore-scripts

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (node24-native)

      - name: Audit exact published release, asset set, digests, feeds, and native attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/promote-github-release.mjs audit \
            --tag "${{ steps.release.outputs.tag_name }}" \
            --commit "${{ steps.release.outputs.release_commit }}" \
            --notes "${{ steps.release.outputs.notes_path }}" \
            --asset-dir "${{ steps.release.outputs.asset_dir }}" \
            --receipt "${{ steps.release.outputs.receipt_path }}" \
            --domain-core-profile "${{ inputs.domain_core_profile }}"

      - name: Verify legacy GPG checksum signature (when published)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_DIR: ${{ steps.release.outputs.asset_dir }}
        run: |
          set -euo pipefail
          checksums="$ASSET_DIR/checksums-v${VERSION}.txt"
          signature="${checksums}.asc"
          if [[ ! -f "$signature" ]]; then
            echo "No legacy GPG checksum signature is published; keyless Sigstore blob attestations remain the required provenance control."
            exit 0
          fi
          if [[ -z "${RELEASE_SIGNING_KEY:-}" ]]; then
            echo "::error::checksums-v${VERSION}.txt.asc is published but RELEASE_SIGNING_KEY is not configured; the promotion cannot verify the detached signature."
            exit 1
          fi
          keyring="$RUNNER_TEMP/release-promotion-gnupg"
          mkdir -p "$keyring"
          chmod 700 "$keyring"
          echo "$RELEASE_SIGNING_KEY" | base64 --decode | gpg --homedir "$keyring" --import --batch --passphrase ""
          gpg --homedir "$keyring" --batch --verify "$signature" "$checksums"
          echo "Checksum GPG signature verified against the audited checksums file."

      - name: Verify release Sigstore provenance against exact tag identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/ci/verify-release-attestations.sh
          "${{ steps.release.outputs.tag_name }}"

      - name: Verify rollback bundle Sigstore provenance
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_DIR: ${{ steps.release.outputs.asset_dir }}
        run: |
          set -euo pipefail
          rollback="$ASSET_DIR/OpenBurnBar-${VERSION}-legacy-rollback.zip"
          bundle="${rollback}.sigstore.json"
          test -s "$rollback"
          test -s "$bundle"
          cosign verify-blob-attestation \
            --bundle "$bundle" \
            --type https://openburnbar.dev/attestations/domain-core-rollback-artifact/v1 \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$rollback" >/dev/null

      - name: Verify exact macOS release bundle and App Check wiring
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_DIR: ${{ steps.release.outputs.asset_dir }}
        run: |
          bash scripts/ci/verify-apple-appcheck-release-artifact.sh \
            "$ASSET_DIR/OpenBurnBar-${VERSION}-macOS.dmg" \
            "$ASSET_DIR/OpenBurnBar-${VERSION}-macOS.zip"

      - name: Verify exact-tag public macOS signing, notarization, and identity
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          site_config="$RUNNER_TEMP/release-promotion-site.ts"
          node --input-type=module - "$site_config" "$TAG_NAME" "$VERSION" <<'NODE'
          import { writeFileSync } from "node:fs";

          const [path, tag, version] = process.argv.slice(2);
          const base = `https://github.com/Imagine-That-Ai/BurnBar/releases/download/${tag}`;
          const file = `OpenBurnBar-${version}-macOS.dmg`;
          writeFileSync(
            path,
            `export const SITE = ${JSON.stringify({
              macDownloadBaseUrl: base,
              macReleaseFile: file,
              macReleaseLatest: version,
            })} as const;\n`,
          );
          NODE
          bash scripts/ci/verify-public-macos-download-trust.sh "$site_config"

      - name: Verify exact R2 publication handoff before promotion
        env:
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENBURNBAR_MAC_UPDATE_BASE_URL:-}" ]]; then
            echo "::error::Repository variable OPENBURNBAR_MAC_UPDATE_BASE_URL is required before promotion."
            exit 1
          fi
          node scripts/ci/macos-r2-publication.mjs preflight \
            --asset-dir "${{ steps.release.outputs.asset_dir }}" \
            --receipt "${{ steps.release.outputs.receipt_path }}" \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag_name }}" \
            --commit "${{ steps.release.outputs.release_commit }}" \
            --public-base-url "$OPENBURNBAR_MAC_UPDATE_BASE_URL" \
            --output "$RUNNER_TEMP/r2-publication-preflight.json"

      - name: Retain authoritative R2 publication handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (node24-native)
        with:
          name: macos-r2-publication-inputs-${{ steps.release.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.release.outputs.asset_dir }}/
            ${{ steps.release.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish and verify exact R2 candidate before activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENBURNBAR_R2_BUCKET: ${{ vars.OPENBURNBAR_R2_BUCKET }}
          OPENBURNBAR_R2_PUBLIC_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
          OPENBURNBAR_RELEASE_ASSET_DIR: ${{ steps.release.outputs.asset_dir }}
          OPENBURNBAR_RELEASE_RECEIPT: ${{ steps.release.outputs.receipt_path }}
          OPENBURNBAR_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          OPENBURNBAR_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          OPENBURNBAR_RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          OPENBURNBAR_EXPECTED_LIVE_VERSION: ${{ inputs.expected_live_macos_version }}
          OPENBURNBAR_EXPECTED_LIVE_COMMIT: ${{ inputs.expected_live_macos_commit }}
        run: bash scripts/upload-macos-downloads-r2.sh

      - name: Promote only the unchanged audited release to GitHub latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/promote-github-release.mjs promote
          --receipt "${{ steps.release.outputs.receipt_path }}"

  release-functions-gate:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.promote)
    name: Release Functions Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.3.0 (node24-native)
        with:
          java-version: "21"
          distribution: temurin

      - name: Install OpenBurnBar Functions dependencies
        run: npm ci --prefix functions

      - name: Lint OpenBurnBar Functions
        run: npm --prefix functions run lint

      - name: Build OpenBurnBar Functions
        run: npm --prefix functions run build

      - name: Run OpenBurnBar Functions tests
        run: npm --prefix functions test

      - name: Run Firestore rules emulator tests
        run: npm --prefix functions run test:firestore-rules

      - name: Run Storage rules emulator tests
        run: bash scripts/ci/test-storage-rules.sh

  release-extension-gate:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.promote)
    name: Release Extension and TS Gate
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Run TypeScript tests
        run: ./scripts/test-openburnbar-ts.sh

      - name: Run replay evals
        run: ./scripts/test-openburnbar-replay-evals.sh

      - name: Run extension-host tests
        run: ./scripts/test-openburnbar-extension-host.sh

  release-supply-chain-gate:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.promote)
    name: Release Supply Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            extensions/openburnbar/package-lock.json

      - name: Install audit dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix extensions/openburnbar

      - name: Run supply chain audit
        run: ./scripts/supply-chain-audit.sh

  # Resolves and validates the release tag once; every downstream lane consumes
  # its outputs and re-verifies the checkout commit. Also owns the publishable
  # secrets scan, provenance preflights, and bypass-reason validation so a bad
  # release fails in minutes, not hours. Strict signing-secret validation lives
  # in the environment-bound build-and-release job instead: environment secrets
  # are only exposed to jobs bound to the release environment, so a fail-hard
  # APPLE_*/Sparkle check here would break setups that scope them there.
  release-preflight:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.promote)
    name: Release Preflight
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      tag_ref: ${{ steps.version.outputs.tag_ref }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      domain_core_profile: ${{ steps.version.outputs.domain_core_profile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          fetch-depth: 0

      - name: Require the canonical macOS update base
        env:
          OPENBURNBAR_MAC_UPDATE_BASE_URL: ${{ vars.OPENBURNBAR_MAC_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENBURNBAR_MAC_UPDATE_BASE_URL:-}" ]]; then
            echo "::error::Repository variable OPENBURNBAR_MAC_UPDATE_BASE_URL is required for release artifacts."
            exit 1
          fi
          node -e '
            const value = process.env.OPENBURNBAR_MAC_UPDATE_BASE_URL;
            const url = new URL(value);
            if (
              url.protocol !== "https:" ||
              url.username ||
              url.password ||
              url.search ||
              url.hash ||
              /\/releases\/latest\/download\/?$/u.test(url.pathname)
            ) {
              throw new Error("OPENBURNBAR_MAC_UPDATE_BASE_URL must be a credential-free stable HTTPS release host");
            }
          '

      - name: Resolve release tag and version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          # SemVer release grammar: vMAJOR.MINOR.PATCH with an optional
          # -prerelease and/or +build suffix (e.g. v1.0.2, v1.1.0-beta.3).
          # The previous pattern (^v[0-9a-zA-Z._-]+$) accepted arbitrary
          # strings like "vfoo" and is not safe to drive --latest promotion.
          # MAJOR is capped at three digits (0-999) so year-shaped calver tags
          # (v2026.*) are rejected — H19 declares v1.0.x the canonical line.
          if [[ ! "$TAG_NAME" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG_NAME (expected vMAJOR.MINOR.PATCH[-prerelease][+build], MAJOR 0-999)"
            exit 1
          fi

          tag_ref="refs/tags/${TAG_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "$tag_ref" ]]; then
            echo "::error::Manual release dispatch for ${TAG_NAME} must run from ${tag_ref}, not ${GITHUB_REF}."
            echo "::error::Select the release tag as the workflow dispatch ref so keyless provenance is tag-bound."
            exit 1
          fi

          git fetch --force --tags origin "+${tag_ref}:${tag_ref}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

          if ! release_commit="$(git rev-list -n 1 "${tag_ref}^{commit}")"; then
            echo "::error::Tag does not exist in repository: $TAG_NAME"
            exit 1
          fi
          if [[ -z "$release_commit" ]]; then
            echo "::error::Unable to resolve ${tag_ref} to a commit."
            exit 1
          fi
          node scripts/ci/verify-domain-core-native-event-commit.mjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-commit "$GITHUB_SHA" \
            --release-commit "$release_commit"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag ${TAG_NAME} points at ${release_commit}, which is not reachable from origin/main."
            exit 1
          fi

          # Only a hyphen before optional +build metadata is the SemVer
          # prerelease delimiter. A stable tag such as v1.2.3+linux-x64 stays
          # stable and may be explicitly promoted.
          VERSION_WITHOUT_BUILD="${TAG_NAME%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          {
            echo "tag_name=$TAG_NAME"
            echo "tag_ref=$tag_ref"
            echo "release_commit=$release_commit"
            echo "version=${TAG_NAME#v}"
            echo "is_prerelease=$IS_PRERELEASE"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "domain_core_profile=public-production"
            else
              case "${{ inputs.domain_core_profile }}" in
                public-production|public-production-rollback)
                  echo "domain_core_profile=${{ inputs.domain_core_profile }}"
                  ;;
                *)
                  echo "::error::Manual release requires an explicit signed public domain-core profile."
                  exit 1
                  ;;
              esac
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git rev-parse --verify HEAD~1 >/dev/null
          bash scripts/ci/update-submodules-with-retry.sh Vendor/libsignal
          echo "Building release tag $TAG_NAME at $RELEASE_COMMIT"

      - name: Install release security scanners
        run: brew install gitleaks trufflehog

      - name: Scan publishable tree for secrets
        run: ./scripts/security/scan-publishable-tree.sh

      - name: BurnBar source provenance preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py --source-provenance-only

      - name: BurnBar product release preflight
        run: python3 scripts/ci/check_burnbar_release_preflight.py --allow-owner-emergency-approval --allow-owner-emergency-runtime-hold --expected-release-tag "${{ steps.version.outputs.tag_name }}"

      - name: Validate mobile unit test bypass reason
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_mobile_unit_tests }}
        env:
          MOBILE_UNIT_TEST_BYPASS_REASON: ${{ inputs.mobile_unit_test_bypass_reason }}
        run: |
          set -euo pipefail
          compact="${MOBILE_UNIT_TEST_BYPASS_REASON//[[:space:]]/}"
          if [[ -z "$compact" ]]; then
            echo "::error::run_mobile_unit_tests=false requires mobile_unit_test_bypass_reason with independent mobile validation evidence."
            exit 1
          fi
          if ((${#MOBILE_UNIT_TEST_BYPASS_REASON} < 80)); then
            echo "::error::mobile_unit_test_bypass_reason must include owner approval plus independent mobile validation evidence."
            exit 1
          fi
          if ! grep -Eiq '\b(owner|approved|approval|approver)\b' <<<"${MOBILE_UNIT_TEST_BYPASS_REASON}"; then
            echo "::error::mobile_unit_test_bypass_reason must name owner approval."
            exit 1
          fi
          if ! grep -Eiq '\b(mobile|ios|simulator|OpenBurnBarMobileTests|test-openburnbar-mobile)\b' <<<"${MOBILE_UNIT_TEST_BYPASS_REASON}"; then
            echo "::error::mobile_unit_test_bypass_reason must describe the independent mobile validation evidence."
            exit 1
          fi
          if ! grep -Eiq '(https://github\.com/Imagine-That-Ai/BurnBar/(actions/runs/[0-9]+|pull/[0-9]+)|[0-9a-f]{40})' <<<"${MOBILE_UNIT_TEST_BYPASS_REASON}"; then
            echo "::error::mobile_unit_test_bypass_reason must include a GitHub run/PR URL or 40-character commit SHA for auditability."
            exit 1
          fi

      - name: Validate release validation bypass reason
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_release_validation_gates }}
        env:
          RELEASE_VALIDATION_BYPASS_REASON: ${{ inputs.release_validation_bypass_reason }}
        run: |
          set -euo pipefail
          compact="${RELEASE_VALIDATION_BYPASS_REASON//[[:space:]]/}"
          if [[ -z "$compact" ]]; then
            echo "::error::run_release_validation_gates=false requires release_validation_bypass_reason with prior-run evidence."
            exit 1
          fi
          if ((${#RELEASE_VALIDATION_BYPASS_REASON} < 140)); then
            echo "::error::release_validation_bypass_reason must include owner approval, prior run evidence, and retry scope."
            exit 1
          fi
          if ! grep -Eiq '\b(owner|approved|approval|approver)\b' <<<"${RELEASE_VALIDATION_BYPASS_REASON}"; then
            echo "::error::release_validation_bypass_reason must name owner approval."
            exit 1
          fi
          if ! grep -Eiq '\b(Swift|app smoke|SQLCipher|mobile|Android|retrieval|validation)\b' <<<"${RELEASE_VALIDATION_BYPASS_REASON}"; then
            echo "::error::release_validation_bypass_reason must describe the release validation gates being reused."
            exit 1
          fi
          if ! grep -Eiq 'https://github\.com/Imagine-That-Ai/BurnBar/actions/runs/[0-9]+' <<<"${RELEASE_VALIDATION_BYPASS_REASON}"; then
            echo "::error::release_validation_bypass_reason must include the prior GitHub Actions run URL."
            exit 1
          fi

      - name: Release preflight summary
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_RELEASE_VALIDATION_GATES: ${{ github.event_name != 'workflow_dispatch' || inputs.run_release_validation_gates }}
        run: |
          echo "Release tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "Strict notarized release mode: true"
          echo "Run release validation gates: ${RUN_RELEASE_VALIDATION_GATES}"

      - name: Verify Apple App Check public release policy
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: bash ./scripts/ci/verify-apple-appcheck-release-env.sh

      - name: Record owner-approved mobile unit test bypass
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_mobile_unit_tests }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MOBILE_UNIT_TEST_BYPASS_REASON: ${{ inputs.mobile_unit_test_bypass_reason }}
        run: |
          echo "::warning::Bypassing OpenBurnBar mobile unit tests for manual release ${TAG_NAME}: ${MOBILE_UNIT_TEST_BYPASS_REASON}"
          {
            echo "## Owner-approved mobile unit test bypass"
            echo "- Tag: ${TAG_NAME}"
            echo "- Version: ${VERSION}"
            echo "- Reason/evidence: ${MOBILE_UNIT_TEST_BYPASS_REASON}"
            echo "- Scope: iOS simulator mobile unit-test gate only; Swift tests, app tests, SQLCipher codec checks, TypeScript tests, Firestore rules, Android tests, supply-chain checks, signing, notarization, and artifact verification still run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record owner-approved release validation bypass
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_release_validation_gates }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VALIDATION_BYPASS_REASON: ${{ inputs.release_validation_bypass_reason }}
        run: |
          echo "::warning::Bypassing slow release validation gates for manual release ${TAG_NAME}: ${RELEASE_VALIDATION_BYPASS_REASON}"
          {
            echo "## Owner-approved release validation bypass"
            echo "- Tag: ${TAG_NAME}"
            echo "- Version: ${VERSION}"
            echo "- Reason/evidence: ${RELEASE_VALIDATION_BYPASS_REASON}"
            echo "- Scope: Swift tests, release app smoke, SQLCipher, mobile smoke, retrieval replay, and Android unit tests only; preflight, secret validation, Firebase/App Check config injection, Android release bundle build, macOS signing, notarization, artifact smoke, provenance, publish, and live feed verification still run."
          } >> "$GITHUB_STEP_SUMMARY"

