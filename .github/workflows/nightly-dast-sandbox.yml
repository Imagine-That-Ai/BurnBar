name: OpenBurnBar Nightly DAST Sandbox

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Same cadence as nightly-e2e, but separately deduped and advisory.
    - cron: "43 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dast-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Hosted-runner advisory lane. These jobs are intentionally isolated from
  # nightly-e2e because the public website ZAP scan, local Functions emulator
  # scan, and privileged live-socket redteam have environment prerequisites that
  # keep the paged lane red on GitHub-hosted runners. Unit-level socket auth
  # tests remain PR-gated; restoring live-socket redteam as a hard page requires
  # a self-hosted privileged macOS runner.

  privileged-socket-redteam:
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      advisory_result: ${{ steps.redteam.outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: true

      - name: Run privileged-socket red-team gate
        id: redteam
        continue-on-error: true
        run: bash ./scripts/ci/privileged-socket-redteam-ci.sh

  dast-website:
    name: DAST — Website (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      advisory_result: ${{ steps.zap.outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Run OWASP ZAP baseline scan against burnbar.ai
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://burnbar.ai"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a -j"
          fail_action: true
          artifact_name: "zap-website-report"

  dast-functions:
    name: DAST — Functions health endpoints (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      advisory_result: ${{ steps.zap.outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version: 22

      - name: Start Firebase Functions Emulator
        run: |
          set -euo pipefail
          npm ci --prefix functions
          npm run build --prefix functions
          npm --prefix functions exec -- firebase emulators:start --project openburnbar-dev --only functions &
          timeout 60 bash -c 'until curl -sf http://localhost:5001 >/dev/null; do sleep 2; done'

      - name: Run OWASP ZAP API scan against health endpoints
        id: zap
        continue-on-error: true
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: "functions/openapi.yaml"
          format: openapi
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a -j"
          fail_action: true
          artifact_name: "zap-functions-report"

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [privileged-socket-redteam, dast-website, dast-functions]
    if: >-
      always() && (
        needs.privileged-socket-redteam.outputs.advisory_result == 'failure' ||
        needs.dast-website.outputs.advisory_result == 'failure' ||
        needs.dast-functions.outputs.advisory_result == 'failure'
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record sandbox failure (per-lane dedupe; comment, never silent-skip)
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: nightly-sandbox
          title-prefix: Nightly DAST sandbox failed
          summary: The advisory OpenBurnBar DAST/redteam sandbox failed.
          details: |
            Advisory job outcomes:
            ```json
            ${{ toJSON(needs) }}
            ```

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [privileged-socket-redteam, dast-website, dast-functions]
    if: >-
      always() &&
      needs.privileged-socket-redteam.outputs.advisory_result == 'success' &&
      needs.dast-website.outputs.advisory_result == 'success' &&
      needs.dast-functions.outputs.advisory_result == 'success'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved sandbox failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: nightly-sandbox
          title-prefix: Nightly DAST sandbox failed
