name: OpenBurnBar Nightly DAST Sandbox

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Security sandbox. Runs after the core nightly starts so hosted runner
    # contention here cannot mask the paged E2E signal.
    - cron: "13 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dast-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Hosted-runner security lane. These jobs are intentionally isolated from
  # nightly-e2e because public DAST, local Functions-emulator DAST, and live
  # privileged-socket red-team checks have environment prerequisites that should
  # not keep the paged nightly lane red on GitHub-hosted runners. Failures still
  # make this sandbox workflow red and open a per-lane tracking issue.
  privileged-socket-redteam:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.outcome.outputs.failed }}
      failure_class: ${{ steps.outcome.outputs.failure_class }}
      reason_code: ${{ steps.outcome.outputs.reason_code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
        with:
          submodules: true

      - name: Run privileged-socket red-team gate
        id: redteam
        env:
          OPENBURNBAR_DAST_ARTIFACT_DIR: ${{ runner.temp }}/openburnbar-dast-redteam
        run: bash ./scripts/ci/privileged-socket-redteam-ci.sh

      - name: Upload privileged red-team result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: privileged-socket-redteam-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openburnbar-dast-redteam/
          if-no-files-found: warn
          retention-days: 30

      - name: Record sandbox outcome
        id: outcome
        if: always()
        run: |
          emit_outcome() {
            {
              echo "failed=$1"
              echo "failure_class=$2"
              echo "reason_code=$3"
            } >> "$GITHUB_OUTPUT"
          }
          result_file="${{ runner.temp }}/openburnbar-dast-redteam/privileged-socket-redteam-result.json"
          if [[ "${{ steps.redteam.outcome }}" == "success" ]]; then
            emit_outcome "false" "" ""
          else
            reason_code="privileged-redteam-failed"
            failure_class="infra"
            if [[ -f "$result_file" ]] && grep -q '"reasonCode": "privileged-binaries-missing"' "$result_file"; then
              reason_code="privileged-binaries-missing"
            elif [[ -f "$result_file" ]] && grep -q '"reasonCode": "' "$result_file"; then
              reason_code="$(sed -n 's/.*"reasonCode": "\([^"]*\)".*/\1/p' "$result_file" | head -n 1)"
            elif [[ "${{ steps.redteam.outcome }}" == "skipped" ]]; then
              reason_code="privileged-redteam-skipped"
            fi
            if [[ -f "$result_file" ]] && grep -q '"failureClass": "product"' "$result_file"; then
              failure_class="product"
            fi
            emit_outcome "true" "$failure_class" "$reason_code"
            echo "::error title=Privileged socket red-team failed::reasonCode=$reason_code. Live privileged-socket proof failed in the sandbox lane."
          fi

  dast-website:
    name: DAST - Website (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.outcome.outputs.failed }}
      failure_class: ${{ steps.outcome.outputs.failure_class }}
      reason_code: ${{ steps.outcome.outputs.reason_code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - name: Run OWASP ZAP baseline scan against burnbar.ai
        id: zap
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://burnbar.ai"
          rules_file_name: ".github/zap-rules.tsv"
          # ZAP exit 1 (FAIL) remains blocking; -I makes warning-only scans exit 0.
          cmd_options: "-a -j -I"
          fail_action: true
          artifact_name: "zap-website-report"

      - name: Record sandbox outcome
        id: outcome
        if: always()
        run: |
          emit_outcome() {
            {
              echo "failed=$1"
              echo "failure_class=$2"
              echo "reason_code=$3"
            } >> "$GITHUB_OUTPUT"
          }
          if [[ "${{ steps.zap.outcome }}" == "failure" ]]; then
            emit_outcome "true" "product" "dast-website-scan-failed"
            echo "::error title=Website DAST failed::reasonCode=dast-website-scan-failed. The sandbox ZAP baseline failed."
          elif [[ "${{ steps.zap.outcome }}" == "success" ]]; then
            emit_outcome "false" "" ""
          else
            emit_outcome "true" "infra" "dast-website-scan-skipped"
            echo "::error title=Website DAST unavailable::reasonCode=dast-website-scan-skipped. The security scan did not complete successfully."
          fi

  dast-functions:
    name: DAST - Functions health endpoints (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.outcome.outputs.failed }}
      failure_class: ${{ steps.outcome.outputs.failure_class }}
      reason_code: ${{ steps.outcome.outputs.reason_code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Start Firebase Functions Emulator
        id: emulator
        env:
          DAST_ARTIFACT_DIR: ${{ runner.temp }}/openburnbar-dast-functions
        run: |
          set -euo pipefail
          mkdir -p "$DAST_ARTIFACT_DIR"
          npm ci --prefix functions 2>&1 | tee "$DAST_ARTIFACT_DIR/npm-ci.log"
          npm run build --prefix functions 2>&1 | tee "$DAST_ARTIFACT_DIR/functions-build.log"
          npm --prefix functions exec -- firebase emulators:start --project openburnbar-dev --only functions \
            > "$DAST_ARTIFACT_DIR/firebase-emulator.log" 2>&1 &
          echo "$!" > "$DAST_ARTIFACT_DIR/firebase-emulator.pid"
          # Readiness must be explicit. A dead emulator is a sandbox failure,
          # not a blind ZAP pass.
          if ! timeout 60 bash -c 'until curl -sf http://localhost:5001 >/dev/null; do sleep 2; done'; then
            echo "reasonCode=emulator-not-ready" | tee "$DAST_ARTIFACT_DIR/emulator-readiness.txt"
            exit 1
          fi

      - name: Upload emulator and toolchain diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dast-functions-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openburnbar-dast-functions/
          if-no-files-found: warn
          retention-days: 30

      - name: Run OWASP ZAP API scan against health endpoints
        id: zap
        if: always() && steps.emulator.outcome == 'success'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: "functions/openapi.yaml"
          format: openapi
          rules_file_name: ".github/zap-rules.tsv"
          # ZAP exit 1 (FAIL) remains blocking; -I makes warning-only scans exit 0.
          cmd_options: "-a -j -I"
          fail_action: true
          artifact_name: "zap-functions-report"

      - name: Record sandbox outcome
        id: outcome
        if: always()
        run: |
          emit_outcome() {
            {
              echo "failed=$1"
              echo "failure_class=$2"
              echo "reason_code=$3"
            } >> "$GITHUB_OUTPUT"
          }
          if [[ "${{ steps.emulator.outcome }}" != "success" ]]; then
            reason_code="dast-functions-setup-failed"
            if [[ -f "${{ runner.temp }}/openburnbar-dast-functions/emulator-readiness.txt" ]]; then
              reason_code="emulator-not-ready"
            elif [[ "${{ steps.emulator.outcome }}" == "skipped" ]]; then
              reason_code="emulator-start-skipped"
            fi
            emit_outcome "true" "infra" "$reason_code"
            echo "::error title=Functions DAST unavailable::reasonCode=$reason_code. The Functions sandbox did not become ready."
          elif [[ "${{ steps.zap.outcome }}" == "failure" ]]; then
            emit_outcome "true" "product" "dast-functions-scan-failed"
            echo "::error title=Functions DAST failed::reasonCode=dast-functions-scan-failed. The ZAP API scan failed."
          elif [[ "${{ steps.zap.outcome }}" == "success" ]]; then
            emit_outcome "false" "" ""
          else
            emit_outcome "true" "infra" "dast-functions-scan-skipped"
            echo "::error title=Functions DAST unavailable::reasonCode=dast-functions-scan-skipped. The security scan did not complete successfully."
          fi

  open-failure-issue:
    runs-on: ubuntu-latest
    needs: [privileged-socket-redteam, dast-website, dast-functions]
    if: >-
      always() &&
      (
        needs['privileged-socket-redteam'].outputs.failed == 'true' ||
        needs['dast-website'].outputs.failed == 'true' ||
        needs['dast-functions'].outputs.failed == 'true' ||
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled') ||
        contains(needs.*.result, 'skipped')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Record sandbox failure (per-lane dedupe; comment, never silent-skip)
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: open
          lane: nightly-sandbox
          title-prefix: Nightly DAST sandbox failed
          summary: The scheduled DAST/red-team sandbox failed.
          details: |
            Job results:
            ```json
            ${{ toJSON(needs) }}
            ```
            Reason codes are emitted by each sandbox lane and remain red when a prerequisite is skipped.
          paging-slack-webhook: ${{ secrets.OPS_PAGING_SLACK_WEBHOOK }}

  close-resolved-issue:
    runs-on: ubuntu-latest
    needs: [privileged-socket-redteam, dast-website, dast-functions]
    if: >-
      always() &&
      needs['privileged-socket-redteam'].outputs.failed != 'true' &&
      needs['dast-website'].outputs.failed != 'true' &&
      needs['dast-functions'].outputs.failed != 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; June 16 forced-runtime fuse)
      - name: Close resolved sandbox failure issue
        uses: ./.github/actions/ops-failure-issue
        with:
          mode: close
          lane: nightly-sandbox
          title-prefix: Nightly DAST sandbox failed
