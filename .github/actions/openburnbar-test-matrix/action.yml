name: OpenBurnBar Test Matrix
description: Unified OpenBurnBar CI test gates (core, extension, mobile, supply chain)

inputs:
  tier:
    description: "core | full | release"
    required: false
    default: full
  base_ref:
    description: Git base ref for diff coverage
    required: false
    default: origin/main
  enable_diff_coverage:
    description: Run multi-surface diff coverage
    required: false
    default: "true"
  enable_mobile:
    description: Run iOS and Android unit tests
    required: false
    default: "true"
  enable_supply_chain:
    description: Run supply chain audit
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Xcode toolchain drift tripwire
      # All macOS lanes float on the runner image's default Xcode (no
      # DEVELOPER_DIR pin anywhere — diligence P2-8). A hard path pin breaks
      # on every image refresh, so this is a drift tripwire instead: the
      # MAJOR Xcode version must match expectations, and the exact version is
      # printed in every run log so a silent image migration is attributable.
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$(uname)" == "Darwin" ]]; then
          xcodebuild -version
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          expected="26"
          if [[ "$major" != "$expected" ]]; then
            echo "::error::Runner Xcode major version is $major, expected $expected. The runner image migrated under us — verify the toolchain and bump 'expected' deliberately."
            exit 1
          fi
        fi

    - name: Validate shell script syntax
      shell: bash
      run: |
        set -euo pipefail
        for script in scripts/*.sh; do
          bash -n "$script"
        done

    - name: Verify version consistency
      shell: bash
      run: ./scripts/verify-version-consistency.sh

    - name: Install OpenBurnBar Functions dependencies
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm ci --prefix functions

    - name: Lint OpenBurnBar Functions
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm --prefix functions run lint

    - name: Build OpenBurnBar Functions
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm --prefix functions run build

    - name: Run OpenBurnBar Functions tests
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm --prefix functions test

    - name: Install protobuf for libsignal Swift FFI
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v protoc >/dev/null 2>&1; then
          if command -v brew >/dev/null 2>&1; then
            brew install protobuf
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          else
            echo "protoc is required for libsignal Swift FFI tests, and no supported package manager was found." >&2
            exit 1
          fi
        fi
        protoc --version

    - name: Run OpenBurnBar Swift tests
      shell: bash
      run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-swift.sh

    - name: Run OpenBurnBar app tests
      shell: bash
      run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-app.sh

    - name: Verify OpenBurnBar app SwiftPM lockfile
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: ./scripts/check-openburnbar-app-swiftpm-lock.sh

    - name: Run OpenBurnBar retrieval replay evals
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: ./scripts/test-openburnbar-retrieval-evals.sh

    - name: Install OpenBurnBar extension dependencies
      # The TS unit tests run vitest from extensions/openburnbar; without this
      # install the full tier dies with `vitest: command not found` (exit 127)
      # — the bug that kept the nightly lifetime-red after the protoc fix.
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm ci --prefix extensions/openburnbar

    - name: Run OpenBurnBar TypeScript unit tests
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: ./scripts/test-openburnbar-ts.sh

    - name: Run OpenBurnBar replay evals
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: ./scripts/test-openburnbar-replay-evals.sh

    - name: Run OpenBurnBar extension-host tests
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: ./scripts/test-openburnbar-extension-host.sh

    - name: Run Firestore rules emulator tests
      if: inputs.tier == 'full' || inputs.tier == 'release'
      shell: bash
      run: npm --prefix functions run test:firestore-rules

    - name: Run iOS mobile unit tests
      if: inputs.enable_mobile == 'true'
      shell: bash
      # GitHub macOS runners have no USB physical devices; the script falls back to iOS Simulator in CI.
      run: OPENBURNBAR_ENABLE_COVERAGE=YES ./scripts/test-openburnbar-mobile.sh

    - name: Run Android unit tests
      if: inputs.enable_mobile == 'true'
      shell: bash
      run: ./scripts/test-openburnbar-android.sh

    - name: Run supply chain audit
      if: inputs.enable_supply_chain == 'true'
      shell: bash
      run: ./scripts/supply-chain-audit.sh

    - name: Compute diff coverage
      if: inputs.enable_diff_coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        xcresult="$GITHUB_WORKSPACE/.derived-data/OpenBurnBar_TestCoverage.xcresult"
        if [[ ! -d "$xcresult" ]]; then
          echo "Missing xcresult at $xcresult" >&2
          exit 1
        fi
        ./scripts/extract-coverage.sh "$xcresult" > "$GITHUB_WORKSPACE/openburnbar-coverage.json"
        ./scripts/diff-coverage-all.sh "${{ inputs.base_ref }}"
