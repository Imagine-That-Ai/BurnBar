name: Ops failure issue (per-lane, comment + auto-close)
description: >-
  Shared standing-failure issue manager for the scheduled/deploy alerting lanes.
  Replaces the copy-pasted title-prefix dedupe that masked outages (tech-debt
  2026-06-11 H16/finding-144). On failure it CREATES a per-lane issue or, when
  one is already open, COMMENTS on it with the new run link and bumps a counter
  label instead of silently skipping. On a green run it COMMENTS and CLOSES the
  same lane's open issue, re-arming the alarm. Per-lane dedupe keys (a
  `lane:<name>` label) guarantee a standing red in one lane can never suppress a
  new red in a different lane.

inputs:
  mode:
    description: "open (record a failure) | close (resolve on green)"
    required: true
  lane:
    description: >-
      Stable dedupe key for this alerting lane (e.g. nightly-e2e,
      ops-confidence, deploy-firestore, deploy-hosting). Becomes the
      `lane:<value>` label so lanes never cross-suppress each other.
    required: true
  title-prefix:
    description: >-
      Human-readable issue title prefix for this lane. The run id is appended on
      creation; matching uses the `lane:<lane>` label, not the title, so the
      prefix is cosmetic and safe to change.
    required: true
  summary:
    description: One-line description of what failed (used in the issue body).
    required: false
    default: "A scheduled launch/ops gate failed."
  details:
    description: >-
      Optional extra markdown appended to the issue body (e.g. a fenced JSON
      block of `needs` results). Pass via toJSON()-rendered text.
    required: false
    default: ""
  labels:
    description: >-
      Comma-separated severity/area labels applied IN ADDITION to the per-lane
      label. The per-lane `lane:<lane>` label is always added automatically.
    required: false
    default: "P0 - Critical,area: infra"
  github-token:
    description: Token with issues:write.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Manage per-lane ops failure issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (node24-native)
      env:
        OPS_MODE: ${{ inputs.mode }}
        OPS_LANE: ${{ inputs.lane }}
        OPS_TITLE_PREFIX: ${{ inputs.title-prefix }}
        OPS_SUMMARY: ${{ inputs.summary }}
        OPS_DETAILS: ${{ inputs.details }}
        OPS_LABELS: ${{ inputs.labels }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            BLOCKER_LABEL,
            ESCALATED_LABEL,
            evaluateP0Escalation,
          } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/ops-failure-issue/escalation.cjs`);
          const mode = process.env.OPS_MODE;
          const rawLane = process.env.OPS_LANE;
          if (!rawLane) {
            core.setFailed('ops-failure-issue: `lane` input is required.');
            return;
          }
          if (mode !== 'open' && mode !== 'close') {
            core.setFailed(`ops-failure-issue: \`mode\` must be open|close, got '${mode}'.`);
            return;
          }

          const REDACTED = '[REDACTED]';
          const SECRET_QUERY_KEYS = new Set([
            'token',
            'key',
            'secret',
            'password',
            'code',
            'credential',
            'access_token',
            'refresh_token',
            'id_token',
            'api_key',
            'apikey',
            'client_secret',
            'secret_key',
            'access_key',
            'private_key',
            'x-amz-signature',
            'x-goog-signature',
            'dsn',
          ]);
          const decodeKey = (key) => {
            try {
              return decodeURIComponent(key).toLowerCase();
            } catch {
              return String(key || '').toLowerCase();
            }
          };
          const isSecretKeyName = (key) => {
            const decoded = decodeKey(key);
            const normalized = decoded.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            if (!normalized) return false;
            if (SECRET_QUERY_KEYS.has(decoded) || SECRET_QUERY_KEYS.has(normalized)) return true;
            return /(?:^|_)(?:access|refresh|id|api|client|private|secret)?_?(?:token|secret|key|password|credential|credentials|dsn|code)(?:_|$)/.test(normalized);
          };
          const redactUrlSecrets = (value) => String(value || '').replace(
            /([?&#])([^=&#\s]+)=([^&#\s]+)/gi,
            (match, prefix, key) => isSecretKeyName(key)
              ? `${prefix}${key}=${REDACTED}`
              : match
          );
          const redactText = (value) => redactUrlSecrets(value)
            .replace(/\b(Bearer|Basic)\s+[A-Za-z0-9._~+/=-]{8,}/gi, `$1 ${REDACTED}`)
            .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|sk_(?:live|test)_[A-Za-z0-9]{16,}|rk_(?:live|test)_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9_-]{16,}|xox[baprs]-[A-Za-z0-9-]{16,}|AIza[0-9A-Za-z_-]{20,}|(?:A3T|AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16}|glpat-[A-Za-z0-9_-]{16,}|SK[0-9a-fA-F]{32})\b/g, REDACTED)
            .replace(/(["']?)([A-Za-z0-9_.-]+)\1(\s*[:=]\s*)"((?:\\.|[^"\\])*)"/gi, (match, quote, key, separator) => isSecretKeyName(key) ? `${quote}${key}${quote}${separator}"${REDACTED}"` : match)
            .replace(/(["']?)([A-Za-z0-9_.-]+)\1(\s*[:=]\s*)'((?:\\.|[^'\\])*)'/gi, (match, quote, key, separator) => isSecretKeyName(key) ? `${quote}${key}${quote}${separator}'${REDACTED}'` : match)
            .replace(/(\b([A-Za-z0-9_.-]+)\b\s*[:=]\s*)([^\s"'`,;|)]+)/gi, (match, prefix, key) => isSecretKeyName(key) ? `${prefix}${REDACTED}` : match)
            .replace(/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi, '[REDACTED-EMAIL]')
            .replace(/(?<![\w.-])(?:\/Users|\/home|\/root|\/private\/var|\/var\/folders|\/var\/tmp|\/tmp|\/private\/tmp)\/[^\s"'`<>|)]{2,}/g, '[REDACTED-PATH]')
            .replace(/\B@(?=[A-Za-z0-9_-]{1,39}\b)/g, '@\u200b');
          const oneLine = (value, fallback = 'redacted') => {
            const text = redactText(value).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
            return text || fallback;
          };
          const block = (value, maxChars = 6000) => {
            const text = redactText(value).replace(/\r\n/g, '\n').trim();
            if (text.length <= maxChars) return text;
            return `${text.slice(0, maxChars).trimEnd()}\n\n[truncated]`;
          };
          const labelText = (value) => oneLine(value, '').slice(0, 50);
          const lane = oneLine(rawLane, 'unknown')
            .replace(/[^A-Za-z0-9_.:-]+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '')
            .slice(0, 45) || 'unknown';
          const summary = oneLine(process.env.OPS_SUMMARY, 'A scheduled launch/ops gate failed.');
          const details = block(process.env.OPS_DETAILS || '');
          const titlePrefix = oneLine(process.env.OPS_TITLE_PREFIX, 'Ops failure');
          const laneLabel = `lane:${lane}`;
          const extraLabels = (process.env.OPS_LABELS || '')
            .split(',')
            .map((s) => labelText(s))
            .filter(Boolean);
          // The lane label is the dedupe key — always present. Severity/area
          // labels are additive context, never the matcher.
          const COUNT_PREFIX = 'failures:';
          const allLabels = Array.from(new Set([laneLabel, ...extraLabels]));
          const labelDescriptions = new Map([
            [laneLabel, `OpenBurnBar ops failure lane: ${lane}`],
            ['P0 - Critical', 'Blocker: production down or data loss risk. Fix immediately.'],
            ['P1 - High', 'Major impact. Fix within 24 hours.'],
            ['P2 - Medium', 'Significant issue. Fix within this sprint.'],
            ['P3 - Low', 'Nice to have. Fix when capacity allows.'],
            ['area: infra', 'CI/CD, build, deployment infrastructure.'],
            [BLOCKER_LABEL, 'Named owner or external blocker exempts a known red from automatic age escalation.'],
            [ESCALATED_LABEL, 'P0 remained open beyond the 72-hour recovery SLO and was escalated.'],
          ]);
          const labelColor = (name) => {
            if (name.startsWith('lane:')) return 'd0e0ff';
            if (name.startsWith(COUNT_PREFIX)) return 'fbca04';
            if (name === 'P0 - Critical') return 'd73a4a';
            if (name === 'P1 - High') return 'e4503f';
            if (name === 'P2 - Medium') return 'f4c430';
            if (name === 'P3 - Low') return '0075ca';
            if (name === ESCALATED_LABEL) return 'd73a4a';
            if (name === BLOCKER_LABEL) return '5319e7';
            if (name.startsWith('area:')) return 'd0e0ff';
            return 'ededed';
          };
          const labelDescription = (name) => {
            if (labelDescriptions.has(name)) return labelDescriptions.get(name);
            if (name.startsWith(COUNT_PREFIX)) return 'Number of recurring failures recorded on this standing ops issue.';
            if (name.startsWith('lane:')) return `OpenBurnBar ops failure lane: ${name.slice('lane:'.length)}`;
            return `OpenBurnBar ops failure context: ${name}`;
          };
          const ensureIssueLabel = async (name) => {
            const safeName = labelText(name);
            if (!safeName) return;
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: safeName,
              });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: safeName,
                color: labelColor(safeName),
                description: labelDescription(safeName).slice(0, 100),
              });
            } catch (error) {
              if (error.status === 422) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: safeName,
                  });
                  return;
                } catch {
                  // Fall through to the original create failure when the 422 was
                  // not a concurrent label creation.
                }
              }
              throw error;
            }
          };
          const ensureIssueLabels = async (labels) => {
            for (const label of labels) {
              await ensureIssueLabel(label);
            }
          };

          const runUrl =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
            `/actions/runs/${context.runId}`;

          await ensureIssueLabels([laneLabel, BLOCKER_LABEL, ESCALATED_LABEL]);

          // Find this lane's open issue by the per-lane label ONLY, paginating
          // fully so a backlog of other-lane issues can never hide it.
          const matches = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: laneLabel,
            per_page: 100,
          });

          const bumpCountLabel = (issue) => {
            const current = (issue.labels || [])
              .map((l) => (typeof l === 'string' ? l : l.name))
              .find((n) => n && n.startsWith(COUNT_PREFIX));
            const n = current ? parseInt(current.slice(COUNT_PREFIX.length), 10) || 1 : 1;
            return { previous: current, next: `${COUNT_PREFIX}${n + 1}` };
          };

          if (mode === 'open') {
            await ensureIssueLabels([...allLabels, `${COUNT_PREFIX}1`]);
            if (matches.length > 0) {
              // Standing red: COMMENT + bump the counter label. Never silently
              // skip — a new occurrence must always leave a trace.
              const issue = matches[0];
              const { previous, next } = bumpCountLabel(issue);
              const escalation = evaluateP0Escalation(issue);
              const labelsToAdd = escalation.shouldEscalate ? [next, ESCALATED_LABEL] : [next];
              await ensureIssueLabels(labelsToAdd);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  `Recurred - ${summary}`,
                  '',
                  `Run: ${runUrl}`,
                  `Ref: ${oneLine(context.ref, 'unknown')}`,
                  escalation.shouldEscalate
                    ? `Escalation: @albertonunez - this P0 has remained open for ${escalation.ageHours} hours without a named blocker.`
                    : null,
                  details ? '' : null,
                  details || null,
                ].filter((l) => l !== null).join('\n'),
              });
              if (previous) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: previous,
                }).catch(() => {});
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
              if (escalation.shouldEscalate) {
                core.warning(`Lane '${lane}': escalated overdue P0 issue #${issue.number} at ${escalation.ageHours} hours.`);
              }
              core.notice(`Lane '${lane}': commented on standing issue #${issue.number} (${next}).`);
              return;
            }
            const title = `${titlePrefix} (${context.runId})`;
            const body = [
              summary,
              '',
              `Lane: \`${lane}\``,
              `Workflow: ${oneLine(context.workflow, 'unknown')}`,
              `Run: ${runUrl}`,
              `Ref: ${oneLine(context.ref, 'unknown')}`,
              details ? '' : null,
              details || null,
            ].filter((l) => l !== null).join('\n');
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [...allLabels, `${COUNT_PREFIX}1`],
            });
            core.notice(`Lane '${lane}': opened issue #${created.data.number}.`);
            return;
          }

          // mode === 'close': resolve this lane's open issue(s) on a green run.
          if (matches.length === 0) {
            core.info(`Lane '${lane}': no open failure issue to close.`);
            return;
          }
          for (const issue of matches) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Resolved by green run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.notice(`Lane '${lane}': closed resolved issue #${issue.number}.`);
          }
