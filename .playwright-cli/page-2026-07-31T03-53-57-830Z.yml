        - generic [ref=e365]: Read this before subscribing
        - heading "The boring, important details." [level=2] [ref=e366]
      - generic [ref=e367]:
        - generic [ref=e368]:
          - term [ref=e369]: How am I billed?
          - definition [ref=e370]: Web billing runs through Stripe Checkout; Apple purchases run through the App Store. Android purchasing will open with the public Play Store listing. We never see your card. Manage or cancel from the platform where you bought.
        - generic [ref=e371]:
          - term [ref=e372]: Are there introductory offers?
          - definition [ref=e373]: No introductory offer is promised. Checkout shows the exact amount and renewal cadence before you confirm.
        - generic [ref=e374]:
          - term [ref=e375]: What about refunds and chargebacks?
          - definition [ref=e376]: Apple purchases follow App Store policy. Google Play purchases will follow Play policy once the public Android listing opens. Stripe purchases can be handled through support. When a refund or chargeback is confirmed, the matching entitlement is revoked during reconciliation. Consumed top-ups are non-refundable except where policy or law requires it.
        - generic [ref=e377]:
          - term [ref=e378]: How does The Wand scale across plans?
          - definition [ref=e379]: Every user can cast The Wand with one local worker. BurnBar Cloud opens 3 agents in parallel, Cloud Pro opens 8, and Ultra opens 16. The Wand routes workers by live quota and model fit across the providers you connect; model tokens still come from your own provider subscriptions or keys.
        - generic [ref=e380]:
          - term [ref=e381]: How do top-ups work?
          - definition [ref=e382]: Cloud Pro includes 500 hosted Agent Control actions and 50 relay-accounting GB each month. Extra hosted actions are $4.99 for 100 hosted actions; extra relay is $4.99 for 50 relay-accounting GB. Monthly caps still apply. BurnBar Ultra carries the same hosted allowance, caps, and top-up prices as Cloud Pro.
        - generic [ref=e383]:
          - term [ref=e384]: What does BurnBar Ultra add over Cloud Pro?
          - definition [ref=e385]: Everything in Cloud Pro, plus 10× private agent memory. Cloud Pro gives your agents 10 knowledge sources, 50,000 memory chunks, and 1 GB. BurnBar Ultra raises that to 100 sources, 500,000 chunks, and 10 GB of repo docs, notes, and chat-derived memories your agents can recall. The text is sealed on your device; hosted nearest-neighbor recall is opt-in and runs over cloaked vectors and opaque keyed hashes, which still reveal structural patterns such as recurrence, counts, and access timing. BurnBar Ultra is $59.99/month or $599/year.
        - generic [ref=e386]:
          - term [ref=e387]: Who needs the subscription?
          - definition [ref=e388]: If you're happy reading your burn on the Mac you sit at every day, you don't. The paid tiers cover features that have to run on OpenBurnBar's infrastructure. Local-first stays free.
        - generic [ref=e389]:
          - term [ref=e390]: What happens to the old $4.99 subscription?
          - definition [ref=e391]: Existing Hosted Quota Sync subscribers are grandfathered for Group A cloud features. It is not sold as a new purchase tier, and it does not unlock Cloud Pro features.
        - generic [ref=e392]:
          - term [ref=e393]: What about teams?
          - definition [ref=e394]: There is no team plan today. Each developer subscribes individually through their own App Store account. A team SKU is on the roadmap.
        - generic [ref=e395]:
          - term [ref=e396]: Sign-in requirement?
          - definition [ref=e397]: A Firebase account is required so the entitlement document can be bound to your UID. App Store purchases require the matching Apple ID; future Google Play purchases will require the matching Play account. Stripe uses the signed-in OpenBurnBar account.
        - generic [ref=e398]:
          - term [ref=e399]: What can be cancelled later?
          - definition [ref=e400]: All of it. Subscription, individual sync toggles, hosted credentials, iCloud mirroring, phone-to-Mac capabilities, hosted Agent Control allowance, and diagnostics — each one has a cancellation or disable path.
