[package]
name = "openburnbar-linux-desktop"
version = "0.1.1"
description = "OpenBurnBar Linux desktop shell"
authors = ["OpenBurnBar"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
media-gst = ["dep:openburnbar-media"]

[lib]
name = "openburnbar_linux_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2.7.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The daemon and shell must use the same native media implementation. The
# nearby apps/linux-desktop/crates/openburnbar-media package is only a legacy
# protocol fixture and intentionally contains no capture/decode backend.
openburnbar-media = { path = "../../../crates/openburnbar-media", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4.18"
