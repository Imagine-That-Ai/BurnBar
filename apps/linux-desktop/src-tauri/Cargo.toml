[package]
name = "openburnbar-linux-desktop"
version = "0.1.0"
description = "OpenBurnBar Linux desktop shell"
authors = ["OpenBurnBar"]
edition = "2021"

[features]
default = []
media-gst = ["dep:openburnbar-media"]

[lib]
name = "openburnbar_linux_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
openburnbar-media = { path = "../crates/openburnbar-media", optional = true }
