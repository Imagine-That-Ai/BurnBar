<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Medallion Field -->
    <radialGradient id="obsidian-field" cx="50%" cy="30%" r="70%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="60%" stop-color="#0F1014"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>

    <!-- Luxury Cinematic Gold Rays -->
    <linearGradient id="ray-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="amber-core-flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Specular Bevel and Cinematic Glow -->
    <filter id="sunburst-bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5.5" specularConstant="1.5" specularExponent="30" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="flame-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Medallion Obsidian Base Field -->
  <circle cx="64" cy="64" r="58" fill="url(#obsidian-field)" stroke="#070709" stroke-width="3.5" filter="url(#sunburst-bevel)"/>

  <!-- Ornate Cinematic Sunburst Rays shooting outwards -->
  <!-- 16 elegant rays arranged in a circle -->
  <g stroke="url(#ray-gold)" stroke-width="1.8" stroke-linecap="round" filter="url(#sunburst-bevel)" opacity="0.85">
    <!-- N, S, E, W primary long rays -->
    <line x1="64" y1="20" x2="64" y2="8"/>
    <line x1="64" y1="108" x2="64" y2="120"/>
    <line x1="20" y1="64" x2="8" y2="64"/>
    <line x1="108" y1="64" x2="120" y2="64"/>

    <!-- Secondary diagonal rays -->
    <line x1="33" y1="33" x2="24" y2="24"/>
    <line x1="95" y1="95" x2="104" y2="104"/>
    <line x1="95" y1="33" x2="104" y2="24"/>
    <line x1="33" y1="95" x2="24" y2="104"/>

    <!-- Tertiary intermediate shorter rays -->
    <line x1="48" y1="24" x2="44" y2="15"/>
    <line x1="80" y1="24" x2="84" y2="15"/>
    <line x1="104" y1="48" x2="113" y2="44"/>
    <line x1="104" y1="80" x2="113" y2="84"/>
    <line x1="80" y1="104" x2="84" y2="113"/>
    <line x1="48" y1="104" x2="44" y2="113"/>
    <line x1="24" y1="80" x2="15" y2="84"/>
    <line x1="24" y1="48" x2="15" y2="44"/>
  </g>

  <!-- Ornate Luxury Inner Ring -->
  <circle cx="64" cy="64" r="38" stroke="url(#ray-gold)" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#sunburst-bevel)"/>
  <circle cx="64" cy="64" r="34" stroke="url(#ray-gold)" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Centered Bright Amber Flame (impressed on obsidian disc) -->
  <g filter="url(#flame-glow)">
    <path d="M 64, 76
             C 52, 76 46, 66 46, 54
             C 46, 42 52, 28 64, 14
             C 76, 28 82, 42 82, 54
             C 82, 66 76, 76 64, 76 Z"
          fill="url(#amber-core-flame)"/>

    <path d="M 64, 70
             C 56, 70 52, 63 52, 53
             C 52, 43 56, 32 64, 22
             C 72, 32 76, 43 76, 53
             C 76, 63 72, 70 64, 70 Z"
          fill="#FFF" opacity="0.3"/>
  </g>
</svg>
