<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Coral/Terracotta Warm Red Matte Wax -->
    <radialGradient id="coral-wax-base" cx="50%" cy="30%" r="70%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <!-- Silver Flame Metallic Impressed -->
    <linearGradient id="silver-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Organic Relief Bevel Filter for Wax Stamps -->
    <filter id="wax-stamp-relief" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5.5" specularConstant="1.2" specularExponent="22" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.6" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#450A0A" flood-opacity="0.5"/>
    </filter>

    <!-- Deep imprint recess filter -->
    <filter id="wax-recess" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="-1.5" dy="-2"/>
      <feGaussianBlur stdDeviation="1.5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#4C0519" flood-opacity="0.9" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Handcrafted Irregular Coral Wax Disc Base -->
  <path d="M 64,8
           C 80,6 94,13 104,18
           C 114,24 122,34 121,48
           C 120,62 124,78 116,92
           C 108,106 94,116 80,119
           C 66,122 52,118 40,116
           C 28,114 16,112 10,98
           C 4,84 8,68 7,54
           C 6,40 10,26 22,16
           C 34,6 48,10 64,8 Z"
        fill="url(#coral-wax-base)" filter="url(#wax-stamp-relief)"/>

  <!-- Inner Impressed Press Ring -->
  <path d="M 64,22 C 87,22 106,31 106,54 C 106,77 87,96 64,96 C 41,96 22,77 22,54 C 22,31 41,22 64,22 Z"
        stroke="#881337" stroke-width="3" fill="none" opacity="0.3" filter="url(#wax-recess)"/>

  <!-- Impressed Silver Flame (High Relief) -->
  <g filter="url(#wax-stamp-relief)">
    <path d="M 64, 82
             C 48, 82 40, 70 40, 56
             C 40, 42 48, 28 64, 12
             C 80, 28 88, 42 88, 56
             C 88, 70 80, 82 64, 82 Z"
          fill="url(#silver-flame)" filter="url(#wax-recess)"/>

    <!-- Flame inner emboss overlay -->
    <path d="M 64, 74
             C 52, 74 46, 65 46, 54
             C 46, 43 52, 32 64, 20
             C 76, 32 82, 43 82, 54
             C 82, 65 76, 74 64, 74 Z"
          fill="#FFF" opacity="0.15"/>
  </g>
</svg>
