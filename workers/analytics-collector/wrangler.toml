# First-party analytics collector for burnbar.ai.
# Browser clients POST consented events here. The Amplitude API key is a
# Wrangler secret and is never shipped to the browser.
#
#   wrangler secret put AMPLITUDE_API_KEY
#   wrangler secret put AMPLITUDE_PROJECT_ID   # optional; default is Dev 830581
#
# Do not commit keys. Do not point this worker at CubeLove (852537) or
# Hormiga (703455 / 799824). Production project is OpenBurnBar 830583.

name = "burnbar-analytics-collector"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
AMPLITUDE_PROJECT_ID = "830581"
AMPLITUDE_SERVER_ZONE = "US"
