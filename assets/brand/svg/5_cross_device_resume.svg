<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow-effect" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Laptop Silhouette (Background) -->
  <rect x="8" y="16" width="48" height="30" rx="3" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 4,46 L 60,46" stroke="url(#primary-line)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tablet Silhouette (Middle) -->
  <g fill="#0F172A">
    <rect x="22" y="24" width="22" height="18" rx="2.5" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="33" cy="39" r="1" fill="url(#primary-line)"/>
  </g>

  <!-- Phone Silhouette (Foreground) -->
  <g fill="#0F172A">
    <rect x="36" y="28" width="10" height="15" rx="1.5" stroke="url(#primary-line)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="39" y1="30" x2="43" y2="30" stroke="url(#primary-line)" stroke-width="1"/>
  </g>

  <!-- Flowing continuity thread weaving phone -> tablet -> laptop -->
  <path d="M 12,24 C 18,20 28,34 32,28 C 36,22 46,32 52,26"
        stroke="url(#primary-line)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Traveling Node / Dot Mid-Thread (Glow Accent) -->
  <circle cx="32" cy="28" r="4.5" fill="url(#accent-glow)" filter="url(#glow-effect)"/>
</svg>
