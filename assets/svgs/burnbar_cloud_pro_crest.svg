<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Richer Foil Gradient -->
    <linearGradient id="richFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="25%" stop-color="#EADD81"/>
      <stop offset="50%" stop-color="#8F6317"/>
      <stop offset="75%" stop-color="#DFB941"/>
      <stop offset="100%" stop-color="#FDF0A6"/>
    </linearGradient>

    <!-- Vibrant Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D31500"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <filter id="heavyRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.95"/>
    </filter>

    <!-- Sunburst Ray -->
    <polygon id="ray" points="256,250 248,60 264,60" fill="url(#richFoil)" />

    <!-- Sunburst Group -->
    <g id="sunburst">
      <use href="#ray"/><use href="#ray" transform="rotate(30 256 250)"/><use href="#ray" transform="rotate(60 256 250)"/><use href="#ray" transform="rotate(90 256 250)"/><use href="#ray" transform="rotate(120 256 250)"/><use href="#ray" transform="rotate(150 256 250)"/><use href="#ray" transform="rotate(180 256 250)"/><use href="#ray" transform="rotate(210 256 250)"/><use href="#ray" transform="rotate(240 256 250)"/><use href="#ray" transform="rotate(270 256 250)"/><use href="#ray" transform="rotate(300 256 250)"/><use href="#ray" transform="rotate(330 256 250)"/>
    </g>

    <clipPath id="shieldClip">
      <path d="M256,60 C340,60 390,90 390,170 C390,280 340,380 256,440 C172,380 122,280 122,170 C122,90 172,60 256,60 Z" />
    </clipPath>

    <!-- Laurel Branch Template -->
    <g id="laurelBranch">
      <path d="M 256,460 C 120,440 30,300 50,140" fill="none" stroke="url(#richFoil)" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(130, 410) rotate(-20)"><ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#richFoil)"/><ellipse cx="14" cy="-8" rx="14" ry="5" fill="url(#richFoil)"/></g>
      <g transform="translate(85, 340) rotate(-45)"><ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#richFoil)"/><ellipse cx="14" cy="-8" rx="14" ry="5" fill="url(#richFoil)"/></g>
      <g transform="translate(55, 260) rotate(-65)"><ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#richFoil)"/><ellipse cx="14" cy="-8" rx="14" ry="5" fill="url(#richFoil)"/></g>
      <g transform="translate(45, 180) rotate(-85)"><ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#richFoil)"/><ellipse cx="14" cy="-8" rx="14" ry="5" fill="url(#richFoil)"/></g>
    </g>
  </defs>

  <rect width="512" height="512" fill="transparent" />

  <!-- Laurel Flourishes -->
  <use href="#laurelBranch" />
  <use href="#laurelBranch" transform="translate(512, 0) scale(-1, 1)" />

  <!-- Fuller Ornate Shield -->
  <path id="shieldPro" d="M256,60 C340,60 390,90 390,170 C390,280 340,380 256,440 C172,380 122,280 122,170 C122,90 172,60 256,60 Z" fill="#1A1815" stroke="url(#richFoil)" stroke-width="10" filter="url(#heavyRelief)"/>

  <!-- Faint Sunburst -->
  <g clip-path="url(#shieldClip)" opacity="0.15">
    <use href="#sunburst" />
  </g>

  <!-- Three Tier Pips -->
  <polygon points="256,380 266,392 256,404 246,392" fill="url(#richFoil)" />
  <polygon points="220,370 230,382 220,394 210,382" fill="url(#richFoil)" />
  <polygon points="292,370 302,382 292,394 282,382" fill="url(#richFoil)" />

  <!-- Flame-with-bars Logo Mark -->
  <g transform="translate(256, 240) scale(0.55) translate(-256, -256)">
    <!-- Flame Outline Container -->
    <path d="M256,50 C270,120 350,200 350,290 A94,94 0 0,1 162,290 C162,200 240,150 256,50 Z" fill="none" stroke="url(#richFoil)" stroke-width="6"/>

    <!-- Embedded Ascending 4-Bar Chart -->
    <rect x="190" y="280" width="24" height="60" rx="12" fill="url(#bar1Grad)"/>
    <rect x="226" y="230" width="24" height="110" rx="12" fill="url(#bar2Grad)"/>
    <rect x="262" y="180" width="24" height="160" rx="12" fill="url(#bar3Grad)"/>
    <rect x="298" y="130" width="24" height="210" rx="12" fill="url(#bar4Grad)"/>
  </g>

  <!-- Crown Over Flame -->
  <g transform="translate(0, -20)">
    <path d="M 220,150 L 210,105 L 238,125 L 256,85 L 274,125 L 302,105 L 292,150 Z" fill="url(#richFoil)"/>
    <rect x="216" y="155" width="80" height="6" rx="3" fill="url(#richFoil)"/>
  </g>
</svg>
