<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mercury/Platinum Foil -->
    <linearGradient id="mercury" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E9EB"/>
      <stop offset="30%" stop-color="#A5A7AA"/>
      <stop offset="50%" stop-color="#F2F3F5"/>
      <stop offset="70%" stop-color="#7B7D82"/>
      <stop offset="100%" stop-color="#D1D3D6"/>
    </linearGradient>

    <!-- Vibrant Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D31500"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="transparent" />

  <!-- Slim Heraldic Shield -->
  <path d="M256,40 C330,40 380,60 380,120 C380,240 360,360 256,460 C152,360 132,240 132,120 C132,60 182,40 256,40 Z" fill="#151310" stroke="url(#mercury)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- One Tier Pip at Base -->
  <polygon points="256,380 268,395 256,410 244,395" fill="url(#mercury)" />

  <!-- Flame-with-bars Logo Mark -->
  <g transform="translate(256, 230) scale(0.65) translate(-256, -256)">
    <!-- Flame Outline Container -->
    <path d="M256,50 C270,120 350,200 350,290 A94,94 0 0,1 162,290 C162,200 240,150 256,50 Z" fill="none" stroke="url(#mercury)" stroke-width="6"/>

    <!-- Embedded Ascending 4-Bar Chart -->
    <rect x="190" y="280" width="24" height="60" rx="12" fill="url(#bar1Grad)"/>
    <rect x="226" y="230" width="24" height="110" rx="12" fill="url(#bar2Grad)"/>
    <rect x="262" y="180" width="24" height="160" rx="12" fill="url(#bar3Grad)"/>
    <rect x="298" y="130" width="24" height="210" rx="12" fill="url(#bar4Grad)"/>
  </g>
</svg>
