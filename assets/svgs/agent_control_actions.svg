<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold/Platinum Bevel Foil Ring Gradient -->
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="token-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Bevel & Shadow Filter -->
    <filter id="bevel-emboss" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4.5" specularConstant="1.4" specularExponent="30" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="3.5" stdDeviation="4.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="spark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Action Token / Consumable Coin -->
  <!-- Path of Hexagon (Centered) -->
  <polygon points="32,6 55,19 55,45 32,58 9,45 9,19"
           fill="url(#token-bg)" stroke="url(#gold-metal)" stroke-width="3.5" filter="url(#bevel-emboss)" stroke-linejoin="round"/>

  <!-- Inner Hexagon Ring -->
  <polygon points="32,10 51,21 51,43 32,54 13,43 13,21"
           stroke="url(#gold-metal)" stroke-width="1" fill="none" opacity="0.3" stroke-linejoin="round"/>

  <!-- Modern Cursor/Hand-Pointer Icon (Centered) -->
  <g transform="translate(4, 2)" filter="url(#bevel-emboss)">
    <!-- Sleek cursor arrow pointing up-left -->
    <path d="M 24,18 L 38,26 L 31,28 L 37,36 L 34,38 L 28,30 L 24,33 Z"
          fill="url(#gold-metal)" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- "+100" Engraved Text -->
  <text x="32" y="47" font-family="'Inter', 'Outfit', sans-serif" font-size="9" font-weight="800" fill="url(#gold-metal)" text-anchor="middle" letter-spacing="0.5" filter="url(#bevel-emboss)">
    +100
  </text>

  <!-- Minting Spark ("+") -->
  <g transform="translate(43, 8)" filter="url(#spark-glow)">
    <!-- Small 4-pointed spark -->
    <path d="M 6,0 L 7.5,4.5 L 12,6 L 7.5,7.5 L 6,12 L 4.5,7.5 L 0,6 L 4.5,4.5 Z" fill="url(#accent-glow)"/>
    <!-- Central tiny core -->
    <circle cx="6" cy="6" r="1.5" fill="#FFF"/>
  </g>
</svg>
