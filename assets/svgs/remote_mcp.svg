<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow-effect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Triangular Constellation / Three Connected Nodes -->
  <!-- Node lines -->
  <line x1="16" y1="16" x2="48" y2="16" stroke="url(#primary-line)" stroke-width="2" opacity="0.6"/>
  <line x1="16" y1="16" x2="32" y2="40" stroke="url(#primary-line)" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="16" x2="32" y2="40" stroke="url(#primary-line)" stroke-width="2" opacity="0.6"/>

  <!-- Nodes (Three circles) -->
  <!-- Top Left Node -->
  <circle cx="16" cy="16" r="5" fill="url(#primary-line)"/>

  <!-- Top Right Node (Carries Key) -->
  <circle cx="48" cy="16" r="5" fill="url(#primary-line)"/>
  <!-- Miniature Key Badge on Node -->
  <g transform="translate(48, 4)" filter="url(#glow-effect)" stroke="url(#accent-glow)" stroke-width="1.2" fill="none">
    <circle cx="3" cy="3" r="2.5"/>
    <path d="M 3,5.5 L 3,9 L 5.5,9 M 3,7.5 L 4.5,7.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Node -->
  <circle cx="32" cy="40" r="5" fill="url(#primary-line)"/>

  <!-- Single Hosted Endpoint Port (Bottom Right) -->
  <rect x="22" y="48" width="20" height="10" rx="2" stroke="url(#primary-line)" stroke-width="2" fill="#0F172A"/>
  <!-- Port inner slot -->
  <rect x="26" y="52" width="12" height="2" fill="url(#accent-glow)" filter="url(#glow-effect)"/>

  <!-- Constellation plugging into hosted endpoint port -->
  <path d="M 32,40 L 32,48" stroke="url(#accent-glow)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-effect)"/>
</svg>
