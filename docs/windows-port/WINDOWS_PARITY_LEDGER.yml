# OpenBurnBar Windows ↔ macOS Parity Ledger (Phase 0 / Wave 1)
#
# Machine-readable source of truth for production parity claims.
# Human overview: docs/windows-port/WINDOWS_PARITY_LEDGER.md
# Scanner: scripts/ci/verify-windows-parity-ledger.py
#
# Status vocabulary (closed set — Authored is FORBIDDEN):
#   Real              — runs in production mode on Windows with real data/backend
#                       behavior (or an approved Windows substitute that is itself Real).
#                       Every Real row MUST have ≥1 existing test + ≥1 evidence file,
#                       and blocking_paths MUST pass the anti-false-green token scan.
#   Substituted       — Tier-B/C OS/platform substitute that works without sample/stub
#                       claims, OR a surface that is production-honest (empty state when
#                       unconfigured) but not yet full peer feature parity.
#   DeferredApproved  — Explicit WPD / Alberto-signed deferral with revive trigger.
#   Blocked           — Cannot be Real until a named external dependency lands
#                       (Win11 VM, cert, OAuth client, partner account, etc.).
#
# Anti-false-green rule: "route resolves", "authored page", "sample mode", and
# "dev-host deferred" are NEVER sufficient for Real.

