<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pewter/Mercury Foil Gradient -->
    <linearGradient id="mercury-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Deep Metallic Shield Base -->
    <linearGradient id="pewter-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Bevel & Emboss Filter -->
    <filter id="luxury-bevel" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.5" specularExponent="30" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="inset-engrave" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1" dy="1.5"/>
      <feGaussianBlur stdDeviation="1.2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Pewter Heraldic Shield (Clean Classic) -->
  <path d="M 64,12
           C 86,12 108,18 108,44
           C 108,78 80,108 64,120
           C 48,108 20,78 20,44
           C 20,18 42,12 64,12 Z"
        fill="url(#pewter-base)" stroke="url(#mercury-foil)" stroke-width="4.5" stroke-linejoin="round" filter="url(#luxury-bevel)"/>

  <!-- Ornate Inner Frame -->
  <path d="M 64,20
           C 80,20 98,25 98,44
           C 98,71 76,96 64,106
           C 52,96 30,71 30,44
           C 30,25 48,20 64,20 Z"
        stroke="url(#mercury-foil)" stroke-width="1.2" fill="none" opacity="0.3" filter="url(#inset-engrave)"/>

  <!-- Engraved Cloud-Flame Mark in Center -->
  <g transform="translate(0, 4)" filter="url(#inset-engrave)" opacity="0.85">
    <!-- Cloud base in center -->
    <path d="M 48,74 C 38,74 33,64 38,54 C 35,42 48,34 58,39 C 63,29 80,29 85,39 C 95,34 108,42 105,54 C 110,64 105,74 95,74 Z"
          fill="#1E293B" stroke="url(#mercury-foil)" stroke-width="1.8"/>

    <!-- Engraved single focal flame inside cloud -->
    <path d="M 64, 70
             C 53, 70 47, 60 47, 50
             C 47, 40 53, 31 64, 18
             C 75, 31 81, 40 81, 50
             C 81, 60 75, 70 64, 70 Z"
          fill="url(#pewter-base)" stroke="url(#mercury-foil)" stroke-width="1.2"/>
  </g>
</svg>
