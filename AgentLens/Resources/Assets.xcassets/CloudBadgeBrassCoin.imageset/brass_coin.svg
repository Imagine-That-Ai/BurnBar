<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Luxury Brushed Brass / Gold Foil Ring -->
    <linearGradient id="brushed-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Core Deep Brass Field -->
    <radialGradient id="brass-field" cx="50%" cy="30%" r="70%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="70%" stop-color="#1C0A00"/>
      <stop offset="100%" stop-color="#0F0500"/>
    </radialGradient>

    <!-- Luxury Coin Relief Bevel -->
    <filter id="brass-relief" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5.5" specularConstant="1.5" specularExponent="32" lighting-color="#FFF" result="specOut">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specChar"/>
      <feComposite in="SourceGraphic" in2="specChar" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="5.5" stdDeviation="6.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="engrave-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0.8" dy="1.5"/>
      <feGaussianBlur stdDeviation="1.2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#451A03" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Brass Coin Medallion Field -->
  <circle cx="64" cy="64" r="58" fill="url(#brass-field)" stroke="#0F0500" stroke-width="2"/>

  <!-- Ornate Double Outer Bevelled Ring -->
  <circle cx="64" cy="64" r="53" stroke="url(#brushed-brass)" stroke-width="5" filter="url(#brass-relief)" fill="none"/>
  <circle cx="64" cy="64" r="48" stroke="url(#brushed-brass)" stroke-width="1.2" fill="none" opacity="0.4"/>
  <circle cx="64" cy="64" r="56" stroke="url(#brushed-brass)" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Engraved Cloud-Flame Relief in Center -->
  <g transform="translate(0, 3)" filter="url(#brass-relief)">
    <!-- Cloud base cradling the flame -->
    <path d="M 44,78 C 34,78 28,68 34,58 C 30,46 44,38 54,43 C 59,32 78,32 83,43 C 93,38 107,46 103,58 C 109,68 103,78 93,78 Z"
          fill="#1C0A00" stroke="url(#brushed-brass)" stroke-width="2.5" opacity="0.95"/>

    <!-- Central Cloud-Flame Single Rising Flame -->
    <path d="M 64, 72
             C 53, 72 47, 62 47, 52
             C 47, 42 53, 32 64, 18
             C 75, 32 81, 42 81, 52
             C 81, 62 75, 72 64, 72 Z"
          fill="url(#brushed-brass)" filter="url(#engrave-depth)"/>

    <path d="M 64, 66
             C 56, 66 52, 59 52, 51
             C 52, 43 56, 35 64, 25
             C 72, 35 76, 43 76, 51
             C 76, 59 72, 66 64, 66 Z"
          fill="#FFF" opacity="0.25"/>
  </g>
</svg>
