<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Kernel Backdrop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  /* Full-bleed dark stage. The engine mounts its canvases inside #host. */
  #host {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #host canvas { display: block; }
</style>
</head>
<body>
  <div id="host"></div>
  <!-- Self-contained IIFE bundle: BackdropEngine + all 30 kernels inlined.
       No external network — works offline inside a WKWebView. -->
  <script src="./kernel-backdrop.js"></script>
</body>
</html>
