# Pytest configuration for the OpenBurnBar MCP suite.
#
# Test output is held to being pristine, so a warning in the summary is a real
# signal. The one warning we cannot fix at its source is silenced by name rather
# than by muting a category.
[pytest]
filterwarnings =
    # FastMCP's settings model reaches pydantic-settings with `lifespan` still an
    # unresolved forward reference, and the warning fires on `import server` in
    # the tests that drive the tool wrappers in-process
    # (test_memorize_provenance.py, test_memorize_transcript.py). It is upstream's
    # to fix; matched by exact message and class, so a different incomplete field
    # -- or any other pydantic-settings warning -- still surfaces.
    ignore:Field 'lifespan' has an incomplete definition:pydantic_settings.exceptions.IncompleteFieldDefinitionWarning
