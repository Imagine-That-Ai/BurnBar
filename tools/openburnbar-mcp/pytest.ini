# Pytest configuration for the OpenBurnBar MCP suite.
#
# Test output is held to being pristine, so a warning in the summary is a real
# signal. The one warning we cannot fix at its source is silenced by name rather
# than by muting a category.
[pytest]
filterwarnings =
    # FastMCP's settings model reaches pydantic-settings with `lifespan` still an
    # unresolved forward reference, and the warning fires on `import server` in
    # the tests that drive the tool wrappers in-process
    # (test_memorize_provenance.py, test_memorize_transcript.py). Upstream's to fix.
    #
    # Matched on the exact message and nothing else. Naming the category would
    # make pytest import and resolve `IncompleteFieldDefinitionWarning` at
    # startup, and pydantic-settings floats here (mcp 1.28.1 requires >=2.5.2
    # with no upper bound), so a rename upstream would abort every run with a
    # UsageError instead of merely surfacing one warning. The message is
    # specific enough on its own: a different incomplete field still shows up.
    ignore:Field 'lifespan' has an incomplete definition
